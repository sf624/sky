#endif
#ifndef Q_GOLD
#define Q_GOLD 0          // 1: the jitters of the low clouds' march and of the shafts step by the golden ratio each frame (see CLOUD_PASS's main)
#endif
#ifdef Q_BENCH_CLOUD_LOD  // (?stats=bench3: the clouds' detail for the frame's pixels)
#define CLOUD_FRAME 1.0
#else
#define CLOUD_FRAME Q_FRAME
#endif
#ifndef Q_SPARKLE
#define Q_SPARKLE 1       // 0: the glitter at night is its mean, not separate sparkles (sparkle)
#endif
// The rays of a pass coarser than the frame cross its pixels at
// uPassJitter, new each frame and apart from the frame's own (uJitter): the
// scene reads the pass's ray that fell nearest each of its own, and over
// the frames that lies all round it, not always in the same square.
// (The cirrus's pass, CI_JIT. The low clouds' pass drawn coarser, at
// half the frame per side and with a jitter of its own, came out blurred at
// rest and blotched in flight: it stays at the frame's size.)
#ifdef Q_CI_JITTER
uniform vec2 uPassJitter;
#define CI_JIT uPassJitter
#else
#define CI_JIT uJitter
#endif
#if defined(CIRRUS_PASS)
#define PASS_PIX Q_CI_PASS
#elif defined(CLOUD_PASS)
#define PASS_PIX Q_PASS   // (a pixel's width, in the frame's pixels, where the passes draw)
#else
#define PASS_PIX 1.0
#endif
#ifndef Q_WARP_MIP
#define Q_WARP_MIP 1.0    // the warped map's texels as a level of the noise: 1 for 2048, 2 for 1024 (see mapAt)
#endif

uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform vec3 uSun;      // unit vector towards the sun
uniform float uSunI;    // 1, or 0 when the sun is too far down to matter
uniform vec3 uMoon;     // unit vector towards the moon
uniform float uMoonI;   // moonlight relative to sunlight (0 once the moon is far below the horizon)
uniform mat3 uSky;      // rotation of the stars since noon
uniform vec3 uEcliptic; // the ecliptic's north pole, equatorial (J2000)
// Star catalogue: a grid over the sphere (octahedral map), SLOTS stars per
// cell. Texel: direction (J2000 equatorial), colour index + brightness.
uniform sampler2D uStars;
uniform float uHaze;    // multiplier on the aerosol (Mie) density
uniform float uExposure; // set by the meter (see "meter")
uniform float uLook;    // power of the "look" curve
// The frame's alpha holds the luminance before exposure, for the meter: log2
// of it, from uLogRange.x (0) to uLogRange.y (1).
uniform vec2 uLogRange;
uniform vec3 uBalance;   // white balance (balanceFor)
uniform float uSaturation;  // a camera's saturation (saturationFor)
uniform float uNightEye;    // how far the eye's night vision has come in, from its adaptation: 0 by day to 1 (nightEyeFor)
uniform float uNightGrey;   // how far the night's wider grey has come in, from its adaptation: 0 to 1 (nightGreyFor)
// Twelve wavelengths (405-680 nm), four per vec4.
uniform vec4 uBR[3];    // Rayleigh scattering per km
uniform vec4 uBO[3];    // ozone absorption per km
uniform vec4 uWR[3];    // spectrum -> linear sRGB (solar spectrum folded in)
uniform vec4 uWG[3];
uniform vec4 uWB[3];
uniform vec4 uWS[3];    // spectrum -> what the rods see (WS in the JS)
// Multiple scattering per unit of scattering coefficient: NMU x (12 * NH)
// texels, the three wavelength groups stacked in y; then the same for the
// light of the sky on the low clouds (cloudSky); then the light's mean
// direction, towards the sun's side and up (msLean).
uniform sampler2D uMS;
uniform vec4 uWL[3];    // wavelength / 550 nm
uniform vec4 uMA[3];    // the aerosol by wavelength, relative to 550 nm (ANGSTROM in the JS)
uniform float uNight;   // radiance of the moonless night sky (airglow)
uniform float uAlt;     // altitude of the eye, km
uniform float uCloud;   // cloud amount: 0 (none) to 1 (overcast)
uniform float uWind;    // wind over the sea, m/s
uniform vec3 uLight;    // what lights the clouds and the sea: the sun, or the moon at night
uniform float uLightI;
uniform float uLightShare;   // how far that light has come in, 0 to 1, as the sun hands over to the moon (see celestial)
// The view from the aircraft is a mean over frames: each frame shifts the
// rays within the pixel (uJitter, in pixels) and the samples through the
// clouds (uPass, the number of the frame).
uniform vec2 uJitter;
uniform float uPass;
// How far the aircraft has flown, km: clouds and sea are read at p.xz + uDrift.
// It wraps at the width of the weather map, which every pattern must divide.
uniform vec2 uDrift;
uniform float uCirrus;  // amount of high, thin cloud: 0 (none) to 1
// Cloud noise, repeating. R: Perlin-Worley; G, B, A: Worley at rising frequencies.
uniform sampler3D uNoise;
// Weather map, repeating. R: cloud cover, G: towers, B: gusts on the sea, A:
// bands along the wind (where a sheet forms rows).
uniform sampler2D uWeather;
// Its slope (see cloudShape): R and G along x and z, per km, from 0 to 1
// for -uSlopeMax to uSlopeMax.
uniform sampler2D uSlope;
uniform float uSlopeMax;
// The heaps' body (see cloudShape), baked at start: R, G the turrets of 2
// km and 1 km; B the seams of the heads on them (500 m to 125 m); A the
// seams of the billows of the fine noise (see cloudDetail). BODY_LOD: the mip level of its texels, as a
// level of the noise (1 for 256 texels a side, 0 for 128).
uniform sampler3D uBody;
#ifndef BODY_LOD
#define BODY_LOD 1.0
#endif
// The tops (see clouds): for each texel of the weather map, how high the
// march may meet cloud within 1, 2, 4 and 8 texels of it (R, G, B, A: 250
// m to 2 km), as a share of CB to CT. Made with the clouds' amount.
uniform sampler2D uTops;
// The weather map where the cover breaks into heaps, read at a place moved
// by up to WARP km (see cloudShape), 2048 texels square; and its slope
// there (uSlopeW). Made with the clouds' amount.
uniform sampler2D uWarped, uSlopeW;
#ifdef CIRRUS_PASS
// The cirrus's pass (see highCloud): tHigh and lk, as their bits, and Th as
// the depth. One target: see below.
layout(location = 0) out uvec4 outCirrus;
#elif defined(AIR_LUT)
// The table of the air's light (see airTable): the light, four wavelengths
// a target, and the optical depth.
layout(location = 0) out vec4 outLut0;
layout(location = 1) out vec4 outLut1;
layout(location = 2) out vec4 outLut2;
layout(location = 3) out vec4 outLut3;
#elif defined(CLOUD_PASS)
// The low clouds' pass (see clouds): in the first stage, the slow parts of
// their light as seven half floats; in the second, tBar, sOne + sMany, sAmb
// and sLean as their bits, and Tc as the depth.
layout(location = 0) out uvec4 outClouds;
#else
layout(location = 0) out vec4 outColor;
#endif
// The passes before the scene, which it reads: layer 0 the cirrus's (the
// bits of tHigh and lk, and Th), layer 1 the low clouds' (see CLOUD_PASS).
// (One texture of two layers for both, and one for their depths: Direct3D
// 11 gives a program 16 textures.)
uniform highp usampler2DArray uPasses;
uniform highp sampler2DArray uPassDepth;
// The aircraft's frames go on to the shader that joins them into a picture
// (see there), with the distance of what each pixel shows as the depth
// (distanceCode). They are kept in steps of 1 / uSteps.
// (The distance is not a second target: ANGLE on Direct3D 11 compiles a
// program again, while the GPU process waits, at its first draw into more
// than one target, and this program takes seconds to compile.)
uniform float uSteps;
// The light of the clouds is worked out in two stages, both by the low
// clouds' pass. Stage 0 draws a quarter of the pixels (half the width and
// the height) and keeps, for the first cloud each ray meets, the parts of
// its light that change slowly across the picture: seven values as half
// floats, two to an integer (uLightMap; see lightMap); stage 1 draws the
// picture and takes them from there (see clouds); stage 2 is the sky's
// light on the clouds (SKY_LIGHT).
uniform float uStage;
uniform highp usampler2D uLightMap;
// The bits of v as a half float, rounded towards zero, as the GPU rounds
// into a target of half floats (the first stage's two targets of round 20;
// packHalf2x16 rounds to the nearest, and the picture came out some levels
// apart in a few pixels).
uint halfBits(float v) {
  uint x = floatBitsToUint(v), sign = (x >> 16) & 0x8000u, m = x & 0x7fffffu;
  int e = int((x >> 23) & 0xffu) - 112;
  if (e >= 143) return sign | 0x7c00u | (m != 0u ? 0x200u : 0u);
  if (e >= 31) return sign | 0x7bffu;
  if (e > 0) return sign | (uint(e) << 10) | (m >> 13);
  return e < -10 ? sign : sign | ((m | 0x800000u) >> uint(14 - e));
}
uint halfPair(vec2 v) {
  return halfBits(v.x) | (halfBits(v.y) << 16);
}
// The first stage's values at a texel: tIn, tauCM, above, sky (a), and
// skyLean, tauF, tauN, tauNn (b).
void lightMapAt(ivec2 ij, out vec4 a, out vec4 b) {
  uvec4 u = texelFetch(uLightMap, ij, 0);
  a = vec4(unpackHalf2x16(u.x), unpackHalf2x16(u.y));
  b = vec4(unpackHalf2x16(u.z), unpackHalf2x16(u.w));
}

const float PI = 3.14159265359;
// The parameters of the air follow Bruneton's demo (2017): see THIRD_PARTY_NOTICES.md.
// Lengths in km.
const float RG = 6360.0;        // ground radius
const float RT = 6460.0;        // top of atmosphere
const float BETA_M = 0.044;     // aerosol scattering per km at sea level, at the default haze (1)
const float MIE_EXT = 1.05;     // extinction / scattering (a single-scattering albedo of 0.95)
const float HR = 8.0;           // Rayleigh scale height
// The haze of the lowest kilometres (the boundary layer): well mixed up to
// BL.x km, falling off over about BL.y km above it (BL in the JS).
const vec2 BL = vec2(1.5, 0.3);
// The aerosol's phase function. In the boundary layer: two Cornette-Shanks
// lobes, a sharp one (MIE_PHASE.x of the light, parameter MIE_PHASE.y) from
// the larger particles and a broad one (MIE_PHASE.z), fitted to Mie theory
// for maritime and continental aerosol (asymmetry 0.715). Above it the
// particles are small (sulphate): one broad lobe, MIE_G_UP (asymmetry
// 0.66). See design.md; the same in the JS.
const vec3 MIE_PHASE = vec3(0.149, 0.932, 0.609);
const float MIE_G_UP = 0.6;
// The aerosol sends the light scattered many times on forwards (msLean):
// MIE_LEAN times the light's mean direction, towards a view that looks where
// it comes from. Its first moment would give 3 times the asymmetry, 2.1;
// 4 matches the reference (see design.md), as the forward peak is sharper.
const float MIE_LEAN = 4.0;
// Aerosol above the haze of the lowest kilometres (mieDensity in the JS):
// a thin layer in the free troposphere and one in the stratosphere.
const vec3 AERO_FREE = vec3(0.048, 6.0, 5.0);    // density (as at sea level), height, half-width in km
const vec3 AERO_STRAT = vec3(0.004, 20.0, 8.0);
const float ISUN = 20.0;
const int NV = Q_NV;            // view samples: the picture is within two steps of 8 bits of 40's
const int NSHADE = Q_NSHADE;        // more samples in twilight: in the planet's shadow...
const int NFAR = Q_NFAR;          // ...and in the lit air beyond it (see shadowSpan)
const int NMU = 40;             // multiple-scattering table: sun angle
const int NH = 12;              // multiple-scattering table: altitude
const float MS_MU_MIN = -0.35;
const float STAR_GAIN = 20.0;   // the core of a star of magnitude 6.5, of the airglow's radiance (see main)
const float STAR_LN_MAG = 0.6447;   // a star's brightness as drawn, ln per magnitude (0.7 of the real 0.921: a "look")
const float EYE_GAIN = 6.0;     // the Milky Way and the zodiacal cone, of their brightness (see main)
const vec2 ZODI_BAND = vec2(20.0, 2.0);   // the cone's half width as drawn, degrees, at 15 degrees from the sun and far from it (zodiacal)
const float EARTHSHINE = 1e-6;  // the moon's dark side, lit by the earth (of sunlight per steradian)
const float S10 = 6.61e-12;     // radiance of one star of the 10th magnitude per square degree, of the sun's light (V = -26.74)
const float CD = 6650.0;        // cd/m2 of a luminance of 1 here (white paper in the sun outside the air, 133000 lux, is 1 / pi)
const float ROD_HALF = 0.01;    // cd/m2 where the rods count as much as the cones in twilight (see main)
const vec2 MESOPIC = vec2(0.003, 3.0);   // cd/m2: at night the rods alone below, the cones alone above (see main)
const float NIGHT_LOOK = 1.7;   // the look's power for what the rods see (see main)...
const float LOOK_PIVOT = 0.12;  // ...the same as by day at this level
const float DARK_LOOK = 2.0;    // ...and as the eye adapts to a darker night (DARK_EYE), steeper...
const float DARK_PIVOT = 0.07;  // ...about this level
const vec2 DARK_EYE = vec2(15.5, 17.5);   // the exposure (log2) over which the night's curve turns to DARK_LOOK
const vec3 ROD_TINT = vec3(0.911, 1.003, 1.235);   // the rods' grey, a little blue (luminance 1)...
const vec3 ROD_BLUE = vec3(0.666, 1.025, 1.742);   // ...and bluer, for blue light from SKY_BLUE cd/m2 up (see main)
const vec2 SKY_BLUE = vec2(0.001, 0.01);
const float METER_GLINT = 0.15;  // the share of the sun and its glitter in the meter (see main)
const vec2 SHOULDER = vec2(0.75, 1.5);   // the tone curve's knee (on the looked value) and the power of its shoulder (see main)
const float SUN_R = 0.00465;     // sine of the sun's angular radius (0.267 degrees)
const float SUN_L = 2000.0;      // the sun's radiance (see main)
const float GLARE = 0.0027;      // the glare's strength, as a share of the eye's (CIE general disability glare; see main)
const int GRID = 128;
const int SLOTS = 8;
const float LN_FLUX_MAX = 5.9915;   // ln(400)

vec2 raySphere(vec3 o, vec3 d, float r) {
  float b = dot(o, d);
  float c = dot(o, o) - r * r;
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  D = sqrt(D);
  return vec2(-b - D, -b + D);
}

// Densities of (Rayleigh, Mie, ozone) at altitude h. The depth table built
// in makeSky repeats this profile: change both.
float aeroLayer(float h, vec3 l) { float x = (h - l.y) / l.z; return l.x * exp(-x * x); }
float boundaryLayer(float h) { return (1.0 + exp(-BL.x / BL.y)) / (1.0 + exp(min((h - BL.x) / BL.y, 60.0))); }
// w: the boundary layer's share of the aerosol (its phase function).
vec4 densities(float h) {
  h = max(h, 0.0);
  float bl = boundaryLayer(h), m = bl + aeroLayer(h, AERO_FREE) + aeroLayer(h, AERO_STRAT);
  return vec4(exp(-h / HR), m, max(0.0, 1.0 - abs(h - 25.0) / 15.0), bl / max(m, 1e-12));
}
vec3 density(float h) { return densities(h).xyz; }

// The depths of depthToTop hang only on the height of p and the angle of d
// to the vertical. They are read from a table, a sum of 16 steps made once
// in JS: one filtered read instead of a march. Its axes, as
// in Bruneton (2017): the distance to the top between its least and its
// most at that height, and the distance to the horizon. They keep the
// table smooth near the horizon.
uniform sampler2D uDepth;
const int DEPTH_MU = 512, DEPTH_R = 128;
const float H_TOP = 1132.2544;  // distance from the ground to the top, along the horizon: sqrt(RT^2 - RG^2)

// Optical depth (per species) from p to the top of the atmosphere.
vec3 depthToTop(vec3 p, vec3 d) {
  float r = length(p);
  float rho = sqrt(max((r - RG) * (r + RG), 0.0));
  float lo = RT - r, hi = rho + H_TOP;
  vec2 x = vec2(clamp((raySphere(p, d, RT).y - lo) / (hi - lo), 0.0, 1.0), clamp(rho / H_TOP, 0.0, 1.0));
  const vec2 N = vec2(DEPTH_MU, DEPTH_R);
  return textureLod(uDepth, (x * (N - 1.0) + 0.5) / N, 0.0).rgb;
}

// Bilinear lookup of the multiple-scattering table: the groups from `first`.
void msTable(float h, float mus, int first, out vec4 ms[3]) {
  float x = clamp((mus - MS_MU_MIN) / (1.0 - MS_MU_MIN), 0.0, 1.0) * float(NMU - 1);
  float y = sqrt(clamp(h / (RT - RG), 0.0, 1.0)) * float(NH - 1);
  // It is read through the GPU's filter (see the table of depths). The
  // groups lie one above the other: a read within one never reaches the
  // next.
  for (int k = 0; k < 3; k++) {
    ms[k] = textureLod(uMS, (vec2(x, y + float((first + k) * NH)) + 0.5) / vec2(NMU, 12 * NH), 0.0);
  }
}
// The light scattered many times that reaches a point of the air.
void multiScatter(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 0, ms); }
// The light of the sky on the low clouds there (see buildMultiScatter).
void cloudSky(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 3, ms); }
// Where that light comes from: its mean over the sphere times the
// direction it comes from, towards the sun's side (lh) and up (lv).
void msLean(float h, float mus, out vec4 lh[3], out vec4 lv[3]) { msTable(h, mus, 6, lh); msTable(h, mus, 9, lv); }

// hash13 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash3(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// The catalogue cell that holds direction c.
ivec2 starCell(vec3 c) {
  vec3 p = c / (abs(c.x) + abs(c.y) + abs(c.z));
  vec2 uv = p.z >= 0.0 ? p.xy
    : (1.0 - abs(p.yx)) * vec2(p.x >= 0.0 ? 1.0 : -1.0, p.y >= 0.0 ? 1.0 : -1.0);
  return ivec2(clamp(floor((uv * 0.5 + 0.5) * float(GRID)), 0.0, float(GRID - 1)));
}

// The band of the Milky Way, relative to the airglow: a noise pattern, not
// the real clouds, but on the real galactic plane and brighter at its centre.
float milkyWay(vec3 c) {
  const vec3 POLE = vec3(-0.8676, -0.1981, 0.4560);      // north galactic pole
  const vec3 CENTRE = vec3(-0.0550, -0.8734, -0.4839);   // galactic centre
  float b = dot(c, POLE);
  float near = 0.5 + 0.5 * dot(c, CENTRE);
  float clouds = 0.5 * noise3(c * 5.0) + 0.3 * noise3(c * 11.0) + 0.2 * noise3(c * 23.0);
  return (0.8 + 3.0 * near * near) * exp(-b * b / (0.02 + 0.03 * near)) * (0.25 + 1.5 * clouds * clouds);
}

// The zodiacal light: sunlight scattered by the dust between the planets,
// in S10 (stars of the 10th magnitude per square degree), from x, the cosine
// of the angle from the sun, and y, the sine of the ecliptic latitude. A fit
// to the table of Leinert et al. (1998, "The 1997 reference of diffuse night
// sky brightness", A&AS 127, 1, Table 16: from the Earth, at 500 nm), within
// 4.5 % rms and 13 % at most of its 182 values and the pole's 60: a cone that
// falls off as the power -2.46 of the angle from the sun, flattened towards
// the ecliptic as seen around the sun (x of the result), over a floor and
// the gegenschein (some 13 degrees across) on a wider glow at the point
// opposite the sun (y). And for the cone as it is drawn (see main), a
// look: z, its brightness along the ecliptic at this
// angle from the sun, and w, its shape across: a band of half width
// ZODI_BAND (to 1/e), 20 degrees at 15 degrees from the sun, narrowing
// fastest near the sun towards 2 (15 at 24 degrees, 9 at 50, 4 at 80),
// with a skirt twice as wide. The fit widens with the
// angle from the sun (it is flattened by the same ratio at every angle):
// drawn as it is, the cone spread into a fan and read as a soft glow on
// the horizon, where the eye sees a cone, widest and brightest at its
// base, whose sides close in all the way to its tip (Trouvelot's drawing
// of 1876; reports from dark sites).
vec4 zodiacal(float x, float y) {
  float e = max(acos(clamp(x, -1.0, 1.0)), 0.035);  // from the sun, radians (at least 2 degrees)
  float s = min(abs(y) * inversesqrt(max(1.0 - x * x * step(0.0, x), 1e-6)), 1.0);   // 0 on the ecliptic, 1 square to it
  float across = 0.252 + 0.748 * exp(-pow(s / 0.419, 1.34));
  float cone = 345.0 * pow(e, -2.46);
  float b = degrees(asin(min(abs(y), 1.0))) / (ZODI_BAND.y + (ZODI_BAND.x - ZODI_BAND.y) * exp(-max(degrees(e) - 15.0, 0.0) / 30.0));
  return vec4(cone * across,
              78.6 * across + 19.3 * exp(-(1.0 + x) / 0.01) + 62.3 * exp(-(1.0 + x) / 0.511),
              cone, 0.85 * exp(-b * b) + 0.15 * exp(-0.25 * b * b));
}

float cornetteShanks(float g, float mu) {
  return 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}
// The air's, the boundary layer's and the higher aerosol's.
vec3 phases(float mu) {
  return vec3(3.0 / (16.0 * PI) * (1.0 + mu * mu),
              mix(cornetteShanks(MIE_PHASE.z, mu), cornetteShanks(MIE_PHASE.y, mu), MIE_PHASE.x),
              cornetteShanks(MIE_G_UP, mu));
}

// Light from one source (sun or moon) scattered towards the eye at p:
// scattered once (times `direct`: less in the shadow of a cloud), plus what
// was already scattered (the table).
void addLight(vec3 p, float r, float h, vec3 od, vec4 dens, float scM, float extM,
              vec3 dir, float gain, float direct, float sky, vec3 phase, vec3 view, in vec4 Tv[3], inout vec4 L[3]) {
  vec4 ms[3], lh[3], lv[3];
  float mus = dot(p, dir) / r;
  multiScatter(h, mus, ms);
  msLean(h, mus, lh, lv);
  // The aerosol scatters that light forwards: more of it towards a view
  // that looks where it comes from (MIE_LEAN). Only the forward part: the
  // first moment taken from the view away from it as well left that sky
  // 0.65 of the reference's.
  vec3 up = p / r, side = dir - mus * up;
  float sl = length(side);
  float cv = dot(view, up), ch = sl > 1e-5 ? dot(view, side) / sl : 0.0;
  bool lit = raySphere(p, dir, RG).y < 0.0;          // not behind the planet
  vec3 odl = lit ? od + depthToTop(p, dir) : vec3(0.0);
  for (int k = 0; k < 3; k++) {
    vec4 sc = uBR[k] * dens.x, sm = scM * uMA[k];
    vec4 a = Tv[k] * ((sc + sm) * ms[k] + sm * MIE_LEAN * max(ch * lh[k] + cv * lv[k], 0.0)) * sky;
    if (lit) {
      a += direct * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z)) * (sc * phase.x + sm * mix(phase.z, phase.y, dens.w));
    }
    L[k] += gain * a;
  }
}

#if Q_AIR_LUT || defined(AIR_LUT)
// ---------- The air's light as a table (Q_AIR_LUT) ----------
// Low marches the air of each pixel no more: the light the air scatters
// towards the eye and its optical depth are made ahead, for the view rays of
// LUT_AZ by LUT_EL directions round the eye and LUT_S distances along each
// (AIR_LUT, a program of fs of its own), as Hillaire (2020) makes his
// sky-view and aerial-perspective tables, and the scene reads them where
// each layer and the end of its ray lie. Directions: the azimuth from the
// sun's, squeezed towards it (the glow), and the elevation from the
// horizon, squeezed towards it (the horizon at v = 0.5). Distances: from
// LUT_T0 to LUT_T1, evenly in their log. One more slice holds the sky as the
// sea sees it (from its surface, the whole way: skyAt). All in one 3D
// texture: the four quarters of its width hold the three vec4 of the light
// and the depth. The light is divided by uLutScale (the stronger of the sun
// and the moon) to keep half floats' range by night.
const float LUT_AZ = 64.0, LUT_EL = 48.0, LUT_S = 16.0, LUT_T0 = 0.05, LUT_T1 = 1200.0;
uniform float uLutScale;
// The stronger light (the sun's or the moon's direction), which the
// azimuth is measured from: the table's seam, behind it, then lies where its
// light is the same on either side (from the sun's, the moonlit sky stepped
// there).
uniform vec3 uLutLight;
// The light's way along the ground at a place whose up is `up`, and the way across it.
void lutAxes(vec3 up, out vec3 sh, out vec3 side) {
  sh = uLutLight - up * dot(uLutLight, up);
  sh = dot(sh, sh) > 1e-8 ? normalize(sh) : normalize(cross(up, vec3(0.0, 0.0, 1.0)));
  side = cross(up, sh);
}
// The horizon's elevation (radians, negative) at a height of alt km.
float lutHorizon(float alt) { return -acos(clamp(RG / (RG + max(alt, 0.0)), 0.0, 1.0)); }
vec2 lutUV(vec3 d, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float phi = atan(dot(d, side), dot(d, sh));
  float el = asin(clamp(dot(d, up), -1.0, 1.0)), hor = lutHorizon(alt);
  float v = el >= hor ? 0.5 + 0.5 * sqrt((el - hor) / (0.5 * PI - hor)) : 0.5 - 0.5 * sqrt((hor - el) / (hor + 0.5 * PI));
  return vec2(0.5 + 0.5 * sign(phi) * sqrt(abs(phi) / PI), v);
}
vec3 lutDir(vec2 uv, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float s = uv.x - 0.5, q = uv.y - 0.5, hor = lutHorizon(alt);
  float phi = PI * sign(s) * 4.0 * s * s;
  float el = q >= 0.0 ? hor + (0.5 * PI - hor) * 4.0 * q * q : hor - (hor + 0.5 * PI) * 4.0 * q * q;
  return cos(el) * (cos(phi) * sh + sin(phi) * side) + sin(el) * up;
}
#endif
#if Q_AIR_LUT
uniform highp sampler3D uAirLut;
// The air's light and depth from the eye to t km along the direction at uv
// (slice: -1 for the distance t; else the sky as the sea sees it).
void airAt(vec2 uv, float t, bool sea, out vec4 La[3], out vec3 oda) {
  float f = 1.0, z = (LUT_S + 0.5) / (LUT_S + 1.0);
  if (!sea) {
    if (t < LUT_T0) { f = max(t, 0.0) / LUT_T0; t = LUT_T0; }
    z = (clamp(log(t / LUT_T0) / log(LUT_T1 / LUT_T0), 0.0, 1.0) * (LUT_S - 1.0) + 0.5) / (LUT_S + 1.0);
  }
  float x = clamp(uv.x, 0.5 / LUT_AZ, 1.0 - 0.5 / LUT_AZ) * 0.25;
  for (int k = 0; k < 3; k++) La[k] = f * uLutScale * textureLod(uAirLut, vec3(x + 0.25 * float(k), uv.y, z), 0.0);
  oda = f * textureLod(uAirLut, vec3(x + 0.75, uv.y, z), 0.0).xyz;
}
#endif

// The planet's shadow along the view ray o + t d (t from 0 to tmax), for
// light from s: the shadow of a sphere in parallel light is a cylinder of
// radius RG behind it. True, with the span [sa, sb], when the ray passes
// through it; else sa and sb are left as they were. In twilight the march spends samples of their own on the span
// and on the lit air beyond: the light scattered once there rises steeply
// from the shadow's edge, and 20 samples spread over the whole ray left
// layers of colour that came and went with the angle.
bool shadowSpan(vec3 o, vec3 d, float tmax, vec3 s, inout float sa, inout float sb) {
  float ds = dot(d, s), os = dot(o, s);
  vec3 a = d - ds * s, b = o - os * s;
  float A = dot(a, a), B = dot(a, b), C = dot(b, b) - RG * RG;
  float D = B * B - A * C;
  if (A < 1e-12 || D <= 0.0) return false;
  D = sqrt(D);
  float t0 = (-B - D) / A, t1 = (-B + D) / A;
  // Only the half away from the light is in the shadow (os + ds t < 0).
  // (Cut by the chord's middle, the whole chord counted where its middle
  // lay behind the planet: by day the eye is inside the cylinder, and every
  // ray above a curve through the sun was marched as if it crossed the
  // shadow, in 8 samples instead of 20, a step of 1 % across the sky.)
  if (ds > 0.0) t1 = min(t1, -os / ds);
  else if (ds < 0.0) t0 = max(t0, -os / ds);
  else if (os >= 0.0) return false;
  t0 = max(t0, 0.0);
  t1 = min(t1, tmax);
  if (t1 <= t0) return false;
  sa = t0;
  sb = t1;
  return true;
}

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// After Jimenez (2014), "Next Generation Post Processing in Call of Duty: Advanced Warfare".
// Interleaved gradient noise: spreads the start of a march evenly over
// neighbouring pixels.
float ign(vec2 p) {
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

// The view from the aircraft: clouds below and a sea under them.

// raySphere for a ray from the eye (o, at height uAlt) and the sphere at
// height h, without its rounding. raySphere takes dot(o, o) - r * r, and at
// 6372 km a float steps by 4 km²; from an eye at the sphere's own height
// (the slider stops on the thin cloud's 12.2, 12.5 and 12.8 km) the
// crossing next to the eye then came out a hair ahead or behind it, as
// each ray's angle rounded. From the base of the thin cloud, rings of rays
// (and a disc under the eye, where dot(o, d) passes a power of two) saw
// through the whole sheet down to the sea, as lit bands. Here c comes from
// the heights, and the near crossing from the far one (their product is c).
vec2 eyeSphere(vec3 o, vec3 d, float h) {
  float b = dot(o, d);
  float c = (uAlt - h) * (2.0 * RG + uAlt + h);
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  float q = b < 0.0 ? sqrt(D) - b : -b - sqrt(D);   // the crossing farther from the eye
  if (q == 0.0) return vec2(0.0);
  return b < 0.0 ? vec2(c / q, q) : vec2(q, c / q);
}

// ---------- Clouds ----------
// A shell from CB to CT holds them. A field says where they are: positive
// inside a cloud, rising by about 1 per km of depth under its surface. It
// is a sum: a weather map (where clouds stand, and how wide), less what a
// height costs (flat bases, domed tops, thicker where wider), plus noise on
// smaller and smaller scales (billows on billows). A sum keeps the small
// sizes at the edge of a cloud: its outline is ragged, not a smooth blob.
const float CB = 0.6;               // cloud base, km
const float CT = 5.0;               // the highest tops, km
const float WEATHER_KM = 256.0;     // size of the weather map
const float BASE_KM = 8.0;          // size of one tile of the noise
const float TEXEL_KM = BASE_KM / 128.0;
const float DETAIL = 7.0;           // tiles of the fine noise per tile (whole numbers: see uDrift)
const float SIGMA = 90.0;           // extinction inside a dense cloud, per km
const float WET = 3.0;              // in a heap's 3D body, WET (h / 1 km)^(2/3) of SIGMA, h over its base (0.3 to 1.2 of it)
const float MIXED = 0.1;            // how deep under the body's surface it reaches that, km (a third of it at the surface)
const float LUMPS = 1.3;            // how far the noise of the tile moves the surface, in units of the field
const float GEO_S = 0.25;          // the fine noise on the body: the seams of the billows of 71, 36, 18 m (cloudDetail)
const float RELIEF = 0.85;          // the same for the fine noise
const float BODY_G = 2.0;           // the heaps' 3D body: the field per km under its surface
const vec3 BODY_K = vec3(0.7, 0.4, 0.6); // how far the body's bumps of 2 km and 1 km stand out, and how deep its heads' seams go, km
const float BODY_C = 0.45;          // the value of the turrets that neither raises nor lowers the surface
const float BODY_B = -0.06;          // the body's surface, km out of its envelope's (with few clouds; less inward with more)
const float BODY_D = 1.3;           // the fine noise's weight on it, against a dome's top
const vec3 SHEET_H = vec3(0.8, 0.8, 0.4); // the sheet's heads (2 km, 1 km; of its depth) and their seams (km)
const float TOP_K = 0.04;           // how far the sheet's top and the heaps on it melt into one, in units of the shell's depth
const vec3 TOP_W = vec3(0.3, 0.2, 0.12); // the cells of one top: how far the noise's 2 km, 1 km and 500 m cells raise it, km
const float TOP_E = 1.5;            // and how deep its heads carve it, against a sheet's own
const float TOP_S = 0.5;            // how much of a heap's rise over the sheet one top keeps
const float TOP_O = 0.06;           // how far its cells raise it on the whole, km
const float TOP_R = 0.66;           // the most that its cells and heads raise it over the heaps, km (for the ways out)
const float ERO_C = 0.4;            // how far out the body's surface stands for the heads that carve it, of their weight (their mean)
const float SKIN = 0.15;            // deeper than their weight, they fade out over this depth (km): none in the core
const float ERO_F = 0.55 * GEO_S;  // how far out the body's surface stands for the billows, of their weight (their mean is 0.43), see cloudField
const float GEO_PIX = 0.005;        // the fine noise fades out where a pixel is this wide and twice this (km), see cloudDetail
const float SKIN_F = 0.1;           // and over what depth they fade out deeper than their weight, km
const float WISP = 0.6;             // how much the fine turrets carve the heads' middles low on a heap (wisps)
const vec2 TOWER = vec2(0.34, 0.4);  // towers rise over G (the map's height of heaps) from x to x + y
const vec2 LEAN = vec2(0.06, 0.03);   // how far heaps lean with the wind's shear, km per km of height
const float PILE = 0.2;             // how far a tower's stacked thermals swell, of its envelope
const float WARP = 5.0;             // how far the map's heaps are moved about, km (see cloudShape)
const float EDGE = 0.03;            // depth under the surface at which an old, soft cloud is dense
const int CLOUD_STEPS = int(400.0 / Q_MARCH);
// The long marches (the clouds, the air, the sky over the sea) run to
// bounds the compiler cannot know (uRes is never negative), so that it
// keeps them as loops: Direct3D's compiler (ANGLE on Windows) may unroll a
// loop of constant bounds, which makes the program far longer to compile.
#define LONG_N(n) ((n) + int(min(uRes.x, 0.0)))
const vec4 MICRO = vec4(0.12, 0.07, 0.045, 0.05); // weights of the finer billows (cloudDetail)
const float LIGHT_MIN = 0.015;       // the first step towards the light, at least (km)
// The light in a cloud (see clouds), fitted once to a Monte Carlo of
// spheres 50 m to 2 km in radius (extinction 90 per km, Henyey-Greenstein
// g = 0.85; see design.md). The sun's light scattered many times: a lobe
// (MS1: gain, its g, how fast it fades with the depth towards the light)
// that builds up with the cloud behind the place (MS_UP: what it keeps with
// none), and light that went into the whole mass (MSD: gain, K of
// (c + K tauB) / (1 + K (tau + tauB)), c); how much of it is left where
// little cloud surrounds a point (DARK, at the surface of the field smoothed
// over DARK_KM). The sky's light (SKYV: gain, K of 1 / (1 + K tau) through
// the cloud, and its DARK).
// Not from the Monte Carlo: in a crease on the lit side the sun's light
// scattered many times is less (CREASE: at most this share less, the
// depth towards the light over which it goes, and the share of the depth
// round the place that lies away from the light over which it comes in;
// see clouds).
const vec3 MS1 = vec3(1.386, 0.429, 0.111);
const float MS_UP = 0.704;
const vec3 MSD = vec3(5.0, 0.0074, 0.039);
const float DARK = 0.589, DARK_KM = 0.07;
const vec4 CREASE = vec4(0.8, 4.0, 0.5, 0.9);
// (The crease reads its depths near the place: out to CREASE_KM.)
const float CREASE_KM = 0.175;
const vec3 SKYV = vec3(2.205, 0.0382, 0.317);
// The sky's light on the clouds (main) is 2 sAmb times cloudSky, times
// what a white matt surface facing up under the sky as drawn sends out, of
// 2 cloudSky (uSkyLight: 0.3 to 0.7, more low down and at dusk). The Monte
// Carlo's unit is that surface. By the moon and at night, 0.35 of it
// (SKY_UNIT), as by day at 3 km.
const float SKY_UNIT = 0.35;
// The view's optical depth into a cloud within which the light is worked
// out (see clouds).
const float LIGHT_TAU = 4.5;
// The steps of the light's marches from such a point (see clouds).
const int LIGHT_STEPS = 26;
const float UNDER = 0.3;            // the light of the sky left in the air under a full deck
const float COLUMN = 0.11;          // (1 - g) 0.75: how a deep column dims the light through it
const float PENUMBRA = 0.06;        // how far light strays sideways in a cloud, km: shadows on it are soft
const float STRAY_TAU = 8.0, STRAY_MAX = 12.0; // and how that grows with the depth the light has come through (see clouds)
const float SPREAD = 0.15;          // how far light spreads sideways on its way down through a deck, km
const float BELOW = 0.5;            // the gain of the sunlight that came down through a deck, seen from under it

// Places in the clouds are given from the eye (p less eye()). At the
// Earth's radius a float steps by half a metre, and the finest noise
// (cloudDetail) showed those steps as terraces; heightAt finds the height
// of such a place without them.
vec3 eye() {
  return vec3(0.0, RG + uAlt, 0.0);
}

float heightAt(vec3 p) {
  float r = RG + uAlt;
  return (uAlt * (2.0 * RG + uAlt) + 2.0 * r * p.y + dot(p, p)) / (length(p + eye()) + RG);
}

// Near the eye, the reads of the noise of the tile move by this much of a
// texel, a new amount each frame (-0.5 to 0.5; see cloudShape).
vec3 shake = vec3(0.0);
// What cloudShape last found of the sheet's relief: how far its cells and
// rolls raise it, as a share of its depth (0 off the sheet).
float relief = 0.0;
// And how steep the heap's field was there, against the top of its dome
// (see cloudShape): the billows and the fine noise are scaled by it.
float steep = 1.0;
// Reads that sum a depth over long steps (the depth maps, the light's
// later steps, the hollows, the sky's reach) leave it at 1:
// they smooth the billows over far more than a wall's, and the slope cost
// 4 ms of the frame among the tops at 1440p.
bool coarse = false;
// And how thin the heap was over this place (1 at the edge of its foot).
float thin = 0.0;
// And how much of the field there was the heaps' 3D body (solid), and how
// high over its base (km).
float solidAt = 0.0, overBase = 0.0;
// And how much of it the fine turrets carve (the body, and the heads of a
// sheet or a deck: see cloudDetail).
float carved = 0.0;
// And how high in its heap (0 at the base, 1 at the top of the heap's
// envelope over this place).
float heapUp = 0.0;
// And how much of the heap's side there faces upshear (1) or downshear (0),
// from the slope of the map against the lean (see cloudShape).
float upshear = 0.5;

// The weather map at x (km), smoothed as a mip level lod of the noise
// would be. (mip: the level of the map's own texels, as a level of the
// noise: 2 for 1024 texels, 1 for 2048.) Read through the GPU's filter, the
// map bends where its texels meet, every 250 m; along the march and towards
// the light those bends move a surface by less than a metre. (The light
// once took the normals of the field, and there the bends drew upright
// streaks on the sides of clouds: those reads were eased and shaken.)
vec4 mapAt(sampler2D map, vec3 p, vec2 x, float lod, bool fine, float mip) {
  return textureLod(map, x / WEATHER_KM, lod - mip);
}

vec4 weather(vec3 p, vec2 x, float lod, bool fine) {
  return mapAt(uWarped, p, x, lod, fine, Q_WARP_MIP);
}

// The field at p without the fine noise. lod: how much to smooth, as a mip
// level of the noise (negative: finer than its texels; the fine noise still
// gains from that). Also gives the height over the base's level (y, in
// units of the shell's depth), the place in the noise (q.xyz), how rough
// the cloud is there (q.w), how thick it is from base to top (body, 1 for a
// deck), the billows there (lump: positive on one, negative between them)
// and the field of the base alone (base: rising by 2 per km over it).
#ifdef TOPS_MAP
// The map of the tops reads the field at a place on the map and a height.
vec2 topsX;
float topsH;
#endif
#if defined(TGRID) && !defined(TOPS_MAP)
// (?grid=1) Towers grown as trees of lobes by a worker (see the script
// "towers"), kept in three grids round the eye (see `grid` in the JS):
// uGrid (R8) holds level l from its slice GRID_Z[l]: GRID_NZ[l] slices of
// the distance under their surface over CB to CT (0.5 at it, +-GRID_R
// km), then four of its columns (gridCol): how much the present field's
// heap gives way round a tower (own), the highest top within 0.8 km and the
// base (shares of CB to CT), and how much of it is shown. (One sampler, and none in the scene's own program, which
// reads the low clouds from their pass: Direct3D 11 allows a program 16,
// and that one reads 16.) uGridO[l]: the middle of level l's window on the map (km), and
// its texel there. The present field's towers give way where the grid
// holds the place (gridCut). The map of the tops (uTops) is made without
// the grid; the worker raises it over the towers (see `grid` in the JS).
uniform highp sampler3D uGrid;
uniform vec4 uGridO[3];
const float GRID_R = 0.25;
// The detail on the towers (see cloudShape below): the heads' scale and
// depth, the creases', the billows', and how much of it low on a body.
#ifndef GRID_HK
#define GRID_HK 2.0
#endif
#ifndef GRID_HW
#define GRID_HW 0.12
#endif
#ifndef GRID_CR
#define GRID_CR 1.5
#endif
#ifndef GRID_BW
#define GRID_BW 0.12
#endif
#ifndef GRID_LOW
#define GRID_LOW 0.4
#endif
#ifndef GRID_OWN
#define GRID_OWN 0.7
#endif
const float GRID_BK = 2.33;
const float GRID_OUT = 0.06 + ERO_C * GRID_HW + 0.45 * GRID_BW;   // how far the detail may stand over the towers' surface
#ifndef GRID_AO
#define GRID_AO 0.6
#endif
float gridCut = 0.0, gridOwn = 0.0, gridCrease = 0.0;
#define cloudShape cloudShape0
#endif
float cloudShape(vec3 p, float lod, bool fine, out float y, out vec4 q, out float body, out float lump, out float base) {
#ifdef TOPS_MAP
  float h = topsH;
#else
  float h = heightAt(p);
#endif
  q = vec4(0.0);
  body = 0.0;
  lump = 0.0;
  base = -9.0;
  relief = 0.0;
  thin = 0.0;
  upshear = 0.5;
  solidAt = 0.0;
  carved = 0.0;
  y = (h - CB) / (CT - CB);
  if (y <= 0.0 || y >= 1.0) return -9.0;
#ifdef TOPS_MAP
  vec2 x = topsX;
#else
  vec2 x = p.xz + uDrift;
#endif
  float region = textureLod(uWeather, x / WEATHER_KM, 6.5).r;
  float sheet = smoothstep(0.57, 0.82, uCloud + 0.6 * (region - 0.5));
  // Where the cover breaks into heaps, the map is read at a place moved by
  // up to WARP km: by the map's own cover and height of heaps (R, G) far
  // from here, smoothed over 1.4 km (mip level 2.5): the heaps of the map
  // are round domes, and from above the clouds were discs; moved, their
  // outlines are lobed and drawn out. The noise repeats every few km, and
  // a depth into it that drifts from place to place (far) keeps two tiles
  // from showing the same clouds. (The map's heaps gather in clusters by
  // themselves: see heaps in the noise shader. Before, the cover of far
  // gathered heaps on lattices, and they still looked strewn evenly.)
  vec4 far = textureLod(uWeather, x / WEATHER_KM + 0.37, 5.5);
  // (Both are made with the clouds' amount, into uWarped: see there.)
  // Heaps lean with the wind's shear, their tops downwind: the map is read
  // LEAN km upwind for each km of height.
  vec2 xl = x - LEAN * (h - CB);
  vec4 w = weather(p, xl, lod, fine);
  // The level of the bases, where rising air condenses: 150 to 300 m over
  // CB, higher or lower across tens of km (the gusts' map, w.b, serves as
  // a slow pattern). The clouds stand on it; a base is a little higher or
  // lower still from place to place (below).
  float level = CB + 0.15 + 0.15 * smoothstep(0.25, 0.75, w.b);
  y = (h - level) / (CT - CB);
  base = 2.0 * (h - level);
  // The cloud amount sets the level of the map above which clouds stand.
  // Each heap of the map is a dome: its top stands as high as the map's G
  // says (higher in the middle of a heap, and on some heaps more than on
  // others), so that a field of cloud is a field of domes even where the
  // cover is whole. The tallest heaps are towers, unless the clouds are few.
  // With much cloud, the heaps stand on a sheet (stratocumulus): from
  // below a closed deck, from above cells some 1 to 2 km across with thin
  // creases between them, or rows of rolls where the air waves. Where the
  // sheet lies follows the cover over some 20 km (the map's mip), so that
  // it breaks up first where the cover is less.
  // Near the top of the slider the heaps on it flatten, and few towers
  // stand out of it (they looked like mountains).
  float level1 = smoothstep(0.85, 1.0, uCloud + 0.3 * (region - 0.5));
  // A tower stands on the whole of its heap's middle, and some stand higher
  // than others: as the heap's height rose over the tower's width, its top
  // did, and towers were cones, like mountains.
  float towers = smoothstep(0.1, 0.5, uCloud) * (1.0 - 0.8 * level1);
#if defined(TGRID) && !defined(TOPS_MAP)
  towers *= 1.0 - gridCut;
#endif
  float tg = clamp((w.g - TOWER.x) / TOWER.y, 0.0, 1.0), tw = tg * (2.0 - tg);
  float tower = tw * towers;
  // (With few clouds, the level stands 0.1 higher: the heaps of the map
  // are many, and from 13 km 3 % of the sea was cloud at 0.1, where it
  // was 0.5 %.)
  float e = 3.0 * (w.r - 0.936 + uCloud * (1.181 - uCloud * (2.197 - 2.102 * uCloud)) - 0.1 * (1.0 - smoothstep(0.1, 0.35, uCloud))) + 1.5 * tower;
  // A dome over a flat base, with steep sides: a height costs its cube.
  // Wider clouds are thicker, up to a point; a deck swells where the map
  // is high.
  // Where the cover is thick all round, the heaps flatten into a deck of
  // small cells (stratocumulus).
  // (Not by the tower's own rise: with it, towers in a thick cover became
  // decks, and at cloud 0.7 to 0.8 hardly one stood.)
  float deck = smoothstep(2.6, 3.6, e - 1.5 * tower);
  float sheetTop = (0.25 + 0.35 * sheet) * (0.8 + 0.4 * smoothstep(0.3, 0.7, w.r)) / (CT - CB);
  float top = 0.12 + 0.32 * w.g * (1.0 - 0.6 * max(deck, level1)) + 0.25 * tower * mix(0.7, 1.0, smoothstep(0.6, 0.9, w.g));
#if defined(TGRID) && !defined(TOPS_MAP)
  top *= 1.0 - GRID_OWN * gridOwn;
#endif
  float thick = 1.0 - exp(-e / 1.6);
  float cube = top * top * top;
  float swell = 0.25 * clamp(e - 1.0, 0.0, 1.0 - 0.6 * sheet);
  float f = 1.6 * (thick + swell - y * y * y / cube) - 4.0 * max(y - 0.85, 0.0);
  // The cube costs nothing near the base: there the thin edge of a cloud,
  // where the map is barely over its level, would reach out sideways as a
  // wide, flat sheet. Round off the lowest 180 m, so that a base ends under
  // the side of its cloud.
  float rim = max(1.0 - y / 0.04, 0.0);
  f -= 0.2 * rim * rim;
  // A thicker cloud has bigger lumps, and a tower bigger still.
  float lumps = LUMPS * (0.7 + 1.3 * w.g) * (1.0 - 0.2 * deck) * (1.0 + 0.3 * swell) * (1.0 + sqrt(tower));
  float fs = sheet > 0.0 ? 13.0 * (sheetTop - y) - 3.0 * (1.0 - sheet) : -9.0;
  // (The cells and billows on the sheet raise it by 0.9 of its depth at most.)
  float fsMax = 14.0 * sheetTop;
  // The heaps' 3D body (solid: how much of it; the rest is the field above,
  // which the deck and the top of the slider keep): a broad envelope with
  // turrets (uBody) on its surface. The envelope (env) is how deep a place
  // lies in its heap: 1 at the foot of a heap's middle, 0 where the top of
  // its dome would stand, less outside; divided by how fast it rises
  // across its surface (below), a distance in km. The turrets of 2 km and
  // 1 km move that surface out by up to BODY_K (in by less), and the heads
  // baked on them (500 m to 125 m) carve it: a cauliflower. (Turrets
  // alone made the surface in round 11, inside an envelope that rose
  // slowly across a heap's side: a cluster of free balls, with more
  // standing off it.) On a sheet, towers and heaps that stand up to 250 m
  // out of it (stand) have the 3D body (in a deck too); the sheet and the
  // low swells on it keep the field above
  // (with the body there, the decks from above were a rubble of lumps with
  // dark gaps; with it on towers only, the heaps on a sheet were pillars
  // and fins with smooth, upright curtains where the two met).
  float stand = smoothstep(0.0, 0.25, (top * pow(max(thick + swell, 0.0), 1.0 / 3.0) - sheetTop) * (CT - CB));
  // (Heaps that stand out of a deck too: as the field above, with its
  // dome's smooth walls, they were pyramids with flat faces.)
  float solid = max((1.0 - max(deck, level1)) * (1.0 - sheet), (1.0 - level1) * max(stand, smoothstep(0.1, 0.5, tower)));
  solidAt = solid;
  carved = solid;
  overBase = h - level;
  // (The same dome as the field's. Round 12 shrank it where the body gave
  // way to the field, on a sheet where towers ended; now the body ends where
  // the heap sinks into the sheet, and the shrinking only drew curtains.)
  // A tower is thermals stacked one on another (PILE: how far each swells,
  // every 0.9 km of height), wider towards its top: with one envelope from
  // base to top, its walls were pillars.
  float riseB = (thick + swell) * (1.0 + tower * (PILE * sin(6.98 * (h - level) + 19.0 * far.r) + 0.25 * clamp(y / top, 0.0, 1.0)));
  float env = riseB - y * y * y / cube - 4.0 * max(y - 0.85, 0.0) - 0.2 * rim * rim;
  // The sizes of turrets that the heap's dome may hold (half its height and
  // more); on a sheet as if it were up to twice as high, with fewer small
  // ones (the low heaps that stand out of it were a rubble of small heads).
  vec3 bw = BODY_K * smoothstep(vec3(0.5), vec3(1.5), top * (CT - CB) * (1.0 + sheet) / vec3(2.0, 1.0, 0.5)) * vec3(1.0, 1.0, 1.0 - 0.45 * sheet);
  // (shift: with more cloud, less inward, so that the slider's cover stays;
  // with few, less inward too: the heads ate the smallest heaps.)
  float bumpMax = (bw.x + bw.y) * (1.0 - BODY_C) + ERO_C * bw.z, shift = BODY_B + 0.09 * smoothstep(0.4, 0.7, uCloud) + 0.05 * (1.0 - smoothstep(0.15, 0.4, uCloud));
  // Over a dome's top, env rises by gTop per km; before the slope is known,
  // the envelope's bounds: it rises 0.7 to 6 times as fast as that.
  float gTop = 3.0 / (top * (CT - CB));
  float bodyMax = BODY_G * (env / (gTop * (env > 0.0 ? 0.7 : 6.0)) + bumpMax + shift);
  // No noise could make a cloud here, even on the steepest wall (below).
  steep = 1.0;
  thin = 1.0 - smoothstep(0.05, 0.4, thick + swell);
  // (On a sheet, the heaps without a body are part of its top, and its
  // cells stand on them: see below.)
  // (topR: what the cells, heads and rolls may add over the heaps, in
  // units of y; the heaps' bound as a height, with their field rising 0.7
  // to 6 times as fast as over a dome's top, mixed with the body's.)
  float topR = (TOP_R + 0.2) / (CT - CB) + 1.2 * sheetTop * smoothstep(0.3, 0.6, far.a) * sheet, fUp = f + 3.6 * lumps;
  bool clear = sheet <= 0.0 || mix(fUp > 0.0 ? fUp * top / 3.36 : fUp * top / 28.8, bodyMax / (BODY_G * (CT - CB)), solid) + topR < 0.0;
  if (mix(f + (coarse ? 0.6 : 3.6) * lumps, bodyMax, solid) < 0.0 && fs < -fsMax && clear) return max(mix(f, bodyMax, solid), fs);
  // How steep this field is where its surface over this place stands (yt),
  // against the top of a whole dome (where it rises by 4.8 / top per unit
  // of y): over the top of a heap about 1, on its walls up to 6. The
  // billows are scaled by it, so that they move the surface by as many
  // metres on a steep wall as on a top: added to the field alone, they
  // moved the walls of towers and big heaps, where the field is four to
  // eight times as steep, by a few metres, and those were smooth pillars.
  // The slope of the map (uSlope) gives the slope across; the derivatives
  // of the terms above follow it. (Taken at this place's own height, the
  // slope grew with the height over a wall's foot, and billows scaled by
  // it stood above the walls as spikes.) The 3D body needs it too: its
  // envelope is a distance by it (coarse reads take it as over a top: it
  // cost 1.5 to 3 ms of the frame at 1440p, and they smooth the bumps on a
  // wall anyway).
  float stB = 1.0;
  if (!coarse) {
  vec4 sl = ((solid > 0.0 ? mapAt(uSlopeW, p, xl, lod, fine, 1.0) : textureLod(uSlope, xl / WEATHER_KM, lod - 2.0)) * 2.0 - 1.0) * uSlopeMax;
  float dTower = towers * 2.0 * (1.0 - tg) / TOWER.y * smoothstep(0.0, 0.15, tg);
  float rise = max(thick + swell, 0.01);
  // (Across: thick and the top's cube follow R and G, a tower G. The rise
  // per unit of y at yt = top rise^(1/3) is 4.8 rise^(2/3) / top.)
  vec2 across = (1.0 - thick) * (3.0 * sl.xy + 1.5 * dTower * sl.zw)
              + 4.8 * rise / top * (0.32 * (1.0 - 0.6 * max(deck, level1)) + 0.21 * dTower) * sl.zw;
  float acrossT = length(across) * (CT - CB) * top / 4.8;
  if (!coarse && solid < 1.0) steep = clamp(length(vec2(acrossT, pow(rise, 2.0 / 3.0))), 0.7, 6.0);
  stB = clamp(length(vec2(acrossT, pow(max(riseB, 0.01), 2.0 / 3.0))), 0.7, 6.0);
  // Which side of the heap this is: the map's cover rises inwards, so on
  // the side that faces upshear it rises along the lean.
  float gs = length(sl.xy);
  upshear = gs > 1e-3 ? smoothstep(-0.6, 0.6, dot(sl.xy / gs, normalize(LEAN))) : 0.5;
  }
  float dEnv = env / (gTop * stB);
  // How fast the heaps' field rises over their top, per unit of y.
  float gF = 4.8 * max(steep, 0.7) / top;
  float hUp = mix((f + 0.9 * lumps * steep) / gF, bodyMax / (BODY_G * (CT - CB)), solid) + topR;
  bodyMax = BODY_G * (dEnv + bumpMax + shift);
#ifdef TOPS_MAP
  // (The map of the tops wants the bound of this way out.)
  return max(max(mix(f + 0.6 * lumps * steep, bodyMax, solid), fs + fsMax), sheet > 0.0 ? 13.0 * hUp : -9.0);
#endif
  if (mix(f + 0.6 * lumps * steep, bodyMax, solid) < 0.0 && fs < -fsMax && (sheet <= 0.0 || hUp < 0.0)) return max(mix(f, bodyMax, solid), fs);
  heapUp = clamp(y / (top * pow(max(riseB, 0.01), 1.0 / 3.0)), 0.0, 1.0);
  q.xyz = vec3(x.x, h, x.y) / BASE_KM + vec3(far.b, 2.5 * far.r, far.g);
  // Near the eye (a pixel finer than 16 m) the read moves by up to half a
  // texel each frame (shake), so that the mean over the frames smooths the
  // bends of the GPU's filter; the distance decides, as in weather. Only
  // where the fine noise is wanted too: the surface and the march, not the
  // shadows. (A
  // cubic B-spline, eight filtered reads, did the same at 7 ms more near
  // the tops.)
  // (The march, only where a pixel is finer than 1 m: shaken out to 16 m, it
  // cost 2.4 ms more at 2 km, and the facets show from near only.)
  // (The march by half a texel within 100 m only, and by 30 % of that from
  // 300 m on: shaken by 31 m there, heaps a few hundred metres off were a
  // soft, grainy white blob without relief.)
  float shaken = fine ? clamp(-6.0 - log2(1.6 * uTan / uRes.y * length(p) / TEXEL_KM), 0.0, 1.0) * mix(1.0, 0.3, smoothstep(0.1, 0.3, length(p))) : 0.0;
  vec4 n = textureLod(uNoise, q.xyz + shake * (shaken / 128.0), max(lod, 0.0));
  // Hard, growing turrets stand beside older, smoother cloud.
  q.w = mix(0.45, 1.3, smoothstep(0.35, 0.65, n.g));
  // Billows of 2 km down to 125 m, rounded into domes (see cloudDetail;
  // the numbers are the means of the noise). lump: how far this place
  // stands out of them. The big ones weigh most: with the 500 m ones
  // first, the tops from above were a carpet of lumps of one size, where
  // photographs show smooth billows of a kilometre or more.
  n.gba *= 2.0 - n.gba;
  lump = 0.9 * (n.g - 0.712) + 0.7 * (n.b - 0.715) + 0.35 * (n.a - 0.715);
  // On a wall, and on heaps that stand alone, smaller billows weigh more:
  // in photographs a heap is turrets on turrets, a third of its width and
  // less (with the big ones first there too, they were smooth domes, like
  // balls of putty).
  lump = mix(lump, 0.35 * (n.g - 0.712) + 0.75 * (n.b - 0.715) + 0.9 * (n.a - 0.715), max(smoothstep(1.3, 3.0, steep), 1.0 - sheet));
  lump = mix(lump, 0.4 * (n.b - 0.715) + 1.4 * (n.a - 0.715), deck);
  // Billows bulge out more than they dent in (smoothly: a kink where
  // lump is nought showed as a ridge along it), and they shape the outside
  // of a cloud: deep in a body they fade, so that they cannot punch holes
  // through it.
  float billows = lumps * (0.8 * lump + 0.2 * sqrt(lump * lump + 0.004)) * mix(1.0, 0.3, smoothstep(0.0, 0.6, f / steep));
  // How high the top stands over this place, as the field has it here.
  body = pow(max(thick + swell + billows / 1.6, 0.0), 1.0 / 3.0) * top / 0.28;
  billows *= steep;
  // The base is up to 120 m lower under the thick middle of a cloud and
  // under the swells of a deck (e, smooth: from the weather map) and a little
  // higher or lower from place to place (n.r, lump: the noise of the tile
  // is read through the GPU's filter, whose facets show on a surface as
  // smooth as a base, so they move it little). It stays clear of the
  // shell's own cut at CB even where shreds hang below it (cloudField).
  // Its field rises by 2 per km: a base is dense 15 to 30 m in, soft but
  // not deep (a deeper one cost more steps than it showed).
  base += 2.0 * (0.05 * clamp(e, 0.0, 2.4) - 0.04 * (n.r - 0.571) + 0.15 * lump);
  f += billows;
  float lumpOld = lump;
  vec4 t = vec4(BODY_C);
  // (The heaps' field before their body takes over, and the body's.)
  float fField = f, fBody = -9.0;
  if (solid > 0.0) {
    // The turrets as bumps on the envelope (km): each size moves the
    // surface by up to about a third of its width, so that a bump rises
    // about as fast as the envelope falls and none stands alone over it.
    // (body: the heads that overhang a heap's thin foot are as dense as its
    // middle: from the column under them they were translucent, and the
    // cloud behind showed through as patches with sharp outlines. lump: how
    // far the bumps stand out here, for the light: low in a cleft. The fine
    // noise weighs BODY_D on it, against a dome's top.)
    t = textureLod(uBody, q.xyz + shake * (shaken / 128.0), max(lod + BODY_LOD, 0.0));
    // The 2 km and 1 km turrets shape the body (its lobes). The heads on
    // them only carve it: their seams go in by up to their weight, their
    // crowns stay where the body's surface is (ERO_C of their weight out of
    // it, so that the cover stays), and deep in the body they carve
    // nothing. So no head stands off the body as a ball, and heads meet in
    // narrow seams.
    // (Not on the lowest part of a heap: seen from below, its base and the
    // foot of its sides were a rubble of heads; in photographs a base is
    // flat.)
    float hw = bw.z * smoothstep(0.03, 0.25, heapUp);
    float u = dEnv + bw.x * (t.x - BODY_C) + bw.y * (t.y - BODY_C) + shift + ERO_C * hw;
    float disp = u - dEnv - shift - hw * t.z * (1.0 - smoothstep(0.0, SKIN, u - hw));
    float fb = BODY_G * (dEnv + disp + shift);
    fBody = fb;
    f = mix(f, fb, solid);
    float big = smoothstep(0.2, 0.7, w.g + 0.5 * tower);
    body = mix(body, max(pow(max(thick + swell, 0.0), 1.0 / 3.0), 0.7) * top / 0.28, solid);
    thin *= 1.0 - solid * big;
    lump = mix(lump, clamp(disp / max(bumpMax, 0.01), -0.3, 0.3), solid);
    billows *= 1.0 - solid;
    steep = mix(steep, BODY_D, solid);
    // (At least 0.9 rough: older, smoother cloud, 0.45, left some heaps
    // smooth white blobs without relief.)
    q.w = mix(q.w, max(q.w, 0.9), solid);
  }
  // Where the heaps flatten into a deck, it has the sheet's heads and
  // seams (below), in km over the field's own slope near a top.
  if (deck * (1.0 - solid) > 0.0) {
    if (solid <= 0.0) t = textureLod(uBody, q.xyz + shake * (shaken / 128.0), max(lod + BODY_LOD, 0.0));
    float hk = 0.35 * (SHEET_H.x * (t.x - BODY_C) + SHEET_H.y * (t.y - BODY_C)) + SHEET_H.z * (ERO_C - t.z);
    f += deck * (1.0 - solid) * steep * 4.8 / (top * (CT - CB)) * hk;
    carved = max(carved, deck * (1.0 - solid));
    q.w = mix(q.w, max(q.w, 0.9), deck * (1.0 - solid));
  }
  if (fs > -fsMax || (sheet > 0.0 && hUp > 0.0)) {
    // The cells: domes of the noise's 1 and 2 km Worley cells, which meet
    // in creases; rows of rolls 1.2 km apart across the wind (whole
    // numbers of them across the map), bent over tens of km, where the
    // slow map says, over more than half of a sheet. Each roll swells and
    // thins every 2 km along its length, half a step on from the roll
    // beside it: cells in ranks, as photographs of stratocumulus from above
    // show them (with rolls only in a few places, the sheet was lumps
    // without order).
    float cells = (0.6 * (n.b - 0.715) + 0.4 * (n.g - 0.712)) / 0.12;
    float rows = smoothstep(0.3, 0.6, far.a) * sheet;
    float ph = 2.0 * PI * dot(x, vec2(190.0, 95.0)) / WEATHER_KM + 9.0 * far.b + 3.0 * (n.r - 0.571);
    float roll = sin(ph);
    float along = sin(2.0 * PI * dot(x, vec2(-57.0, 114.0)) / WEATHER_KM + 0.5 * ph + 7.0 * far.g);
    // (Each roll swells more in some places than in others, by the noise's
    // 2 km cells: rolls of one depth over tens of km were straight stripes
    // from above, as no photograph shows them.)
    float rank = rows * (0.6 * (roll - 0.25) + 0.35 * max(roll + 0.3, 0.0) * along) * mix(0.35, 1.0, smoothstep(0.5, 0.85, n.g));
    if (solid <= 0.0 && deck <= 0.0) t = textureLod(uBody, q.xyz + shake * (shaken / 128.0), max(lod + BODY_LOD, 0.0));
    // Packed heads: the turrets of 2 km and 1 km raise the sheet, and meet
    // in seams that go down to 40 % of its depth (deeper, they cut it
    // through, and the march met many clouds in one: 4 ms more under a
    // deck). The heads of uBody (500 m to 125 m) carve them as they carve
    // the body, to SKIN deep.
    // (Only where the sheet is whole: at its first edges the crowns alone
    // stood out of it, a speckle of small dots that shimmered in flight.)
    float whole = smoothstep(0.2, 0.6, sheet);
    float heads = whole * max(SHEET_H.x * (t.x - BODY_C) + SHEET_H.y * (t.y - BODY_C), -0.4);
    float raise = mix(heads, 0.12 * cells, rows) + rank + 0.5 * (1.0 - 0.5 * rows) * lumps * lumpOld / LUMPS;
    // The heaps on the sheet stand in its ranks too, with smaller billows.
    f += 0.8 * rank - 0.5 * rows * billows;
    fs += 13.0 * sheetTop * raise;
    float carve = SHEET_H.z * (ERO_C - t.z * (1.0 - smoothstep(0.0, 2.95 * SKIN, fs - 2.95 * SHEET_H.z)));
    fs += 2.95 * carve * (1.0 - rows) * whole;
    relief = clamp(raise, -0.6, 0.9) * sheet;
    body = max(body, sheet * sheetTop * max(1.0 + 0.5 * cells, 0.2) / 0.28);
    // The heaps and the sheet merge without a crease (a smooth max).
    float k = clamp(0.5 + (fs - f) / 0.4, 0.0, 1.0);
    thin *= 1.0 - k;
    // The fine turrets carve the sheet's heads too, as much as on the body
    // in km (the sheet's field is steeper).
    float kc = k * (1.0 - rows) * whole;
    steep = mix(steep, 1.9, kc);
    carved = max(carved, kc);
    q.w = mix(q.w, max(q.w, 0.9), kc);
    f = mix(f, fs, k) + 0.2 * k * (1.0 - k);
    // Where the sheet is whole, the heaps on it that have no 3D body and
    // the sheet are one top: each as a height (units of y), joined by a
    // smooth max (TOP_K), with the cells and heads on the whole of it.
    // As two fields that crossed (above), the sheet's heads stood out of
    // the heaps' smooth domes as plateaus with cliffs, and the domes lay
    // between them as flat floors, like frozen lakes: from 4 to 5 km the
    // tops were a snowy mountain range. Each heap keeps half its rise over
    // the sheet (TOP_S), and its cells are as much larger as it rises
    // higher, up to twice (a heap 300 m over the sheet): with the whole
    // rise, heaps were smooth hills with long shadows. The cells are the
    // noise's Worley domes (2 km, 1 km, 500 m), which fill the plane and
    // meet in creases; the turrets of uBody stand apart, and between them
    // the sheet was flat. The heads of uBody carve them, TOP_E as deep as
    // on the sheet above, so that the top is heads on cells, as
    // photographs of stratocumulus and of cumulus from above show it.
    // They raise it by TOP_O on the whole: the two fields' higher surface
    // stood higher than one top, and without it a deck let more light
    // through (0.1 stops brighter from under it at 0.3 km).
    // (Not in the rows of rolls, which keep the sheet above.)
    if (whole > 0.0) {
      // The heaps as heights: their field over its rise at their top, and
      // the body's over its own (BODY_G per km), mixed as main mixes the
      // fields (solid).
      float hN = (fField + 0.8 * rank - 0.5 * rows * billows) / gF;
      float hH = mix(hN, fBody / (BODY_G * (CT - CB)), solid);
      float hs = (13.0 * (sheetTop - y) - 3.0 * (1.0 - sheet)) / 13.0;
      float sN = clamp(0.5 + (hH - hs) / (2.0 * TOP_K), 0.0, 1.0);
      float hTop = mix(hs, hH, sN) + TOP_K * sN * (1.0 - sN);
      // (free: how much of the heap there has no body. Bodies keep their
      // own form; the sheet round them has cells.)
      float free = 1.0 - smoothstep(0.3, 0.8, solid);
      float up = free * clamp((hTop - hs) * (CT - CB) / 0.3, 0.0, 1.0);
      hTop = hs + (1.0 - TOP_S * free) * (hTop - hs);
      float wc = whole * (1.0 - rows) * (1.0 - (1.0 - free) * sN);
      float rk = (1.0 + up) * (TOP_W.x * (n.g - 0.712) + TOP_W.y * (n.b - 0.715) + TOP_W.z * (n.a - 0.715));
      float raiseN = rows * 0.12 * cells + rank + 0.5 * (1.0 - 0.5 * rows) * lumps * lumpOld / LUMPS * (1.0 - sN) * (1.0 - wc);
      hTop += sheetTop * raiseN + wc * (rk + TOP_O) / (CT - CB);
      hTop += TOP_E * wc * SHEET_H.z / (CT - CB) * (ERO_C - t.z * (1.0 - smoothstep(0.0, SKIN, hTop * (CT - CB) - SHEET_H.z)));
      f = mix(f, hTop * mix(13.0, BODY_G * (CT - CB), solid * sN), whole);
      relief = mix(relief, clamp(raiseN + wc * rk / (sheetTop * (CT - CB)), -0.6, 0.9) * sheet, whole);
      steep = mix(steep, 1.9, wc);
      carved = max(carved, wc);
      q.w = mix(q.w, max(q.w, 0.9), wc);
      thin *= 1.0 - whole * (1.0 - solid * sN);
    }
  }
  return f;
}
#if defined(TGRID) && !defined(TOPS_MAP)
#undef cloudShape
// Level l's place of x (km on the map) in uGrid (x, y), and
// whether its window holds x.
bool gridAt(vec2 x, int l, out vec2 uv) {
  float v = GRID_V0 * exp2(float(l));
  vec2 dv = mod(x - uGridO[l].xy + 0.5 * WEATHER_KM, WEATHER_KM) - 0.5 * WEATHER_KM;
  uv = (uGridO[l].zw + dv / v) / GRID_N;
  return max(abs(dv.x), abs(dv.y)) < 0.5 * GRID_N * v;
}
// Level l's column c at uv (0 own, 1 the highest top within 0.8 km, 2 the
// base, 3 how much it is shown).
float gridCol(vec2 uv, int l, int c) {
  return textureLod(uGrid, vec3(uv, (GRID_Z[l] + GRID_NZ[l] + float(c) + 0.5) / GRID_NZT), 0.0).r;
}
// Level l's distance under the towers' surface at uv and the height yg
// (a share of CB to CT), km.
float gridD(vec2 uv, int l, float yg) {
  float nz = GRID_NZ[l];
  return (textureLod(uGrid, vec3(uv, (GRID_Z[l] + clamp(yg * nz, 0.5, nz - 0.5)) / GRID_NZT), 0.0).r * 2.0 - 1.0) * GRID_R;
}
float cloudShape(vec3 p, float lod, bool fine, out float y, out vec4 q, out float body, out float lump, out float base) {
  float h = heightAt(p);
  vec2 x = p.xz + uDrift;
  // The levels, finest first, each with what the finer left (rest) times
  // how much of its column is shown; a level finer than the read's
  // smoothing (lod: level 0's voxels are texels of the noise at lod
  // GRID_LV, -1 for 31 m) gives way to the next. A level is read up to the
  // highest top within 0.8 km (and the detail's reach over it, GRID_OUT):
  // by the column's own top, the crowns that the detail below pushes out
  // of a wall were cut off over the columns beside it, as upright curtains.
  // The present field's heap gives way round a tower (own: from the
  // coarsest level, whose window holds the others; it is smooth).
  float yg = (h - CB) / (CT - CB), rest = 1.0, cover = 0.0, read = 0.0, dSum = 0.0, own = 0.0;
  vec2 colSum = vec2(0.0);
  int lC = -1;
  if (yg > 0.0 && yg < 1.0) {
    float lv = lod - GRID_LV;
    for (int l = 0; l < 3; l++) {
      float k = l == 2 ? 1.0 : clamp(1.0 - (lv - float(l)), 0.0, 1.0);
      vec2 uv;
      if (!gridAt(x, l, uv)) continue;
      float shown = gridCol(uv, l, 3);
      if (l == 2) own = shown * gridCol(uv, l, 0);
      if (rest * k < 1e-3) continue;
      float w = rest * k * shown;
      if (w < 1e-3) continue;
      float d = -GRID_R, heap = gridCol(uv, l, 1);
      if (heap > 0.0 && h <= CB + heap * (CT - CB) + GRID_OUT) {
        d = gridD(uv, l, yg);
        read += w;
        colSum += w * vec2(heap, gridCol(uv, l, 2));
        // (The first level read that has a coarser one, for the creases
        // below.)
        if (lC < 0 && l < 2) lC = l;
      }
      dSum += w * d;
      cover += w;
      rest -= w;
    }
  }
  gridCut = cover;
  gridOwn = own;
  gridCrease = 0.0;
  float f = cloudShape0(p, lod, fine, y, q, body, lump, base);
  gridCut = 0.0;
  gridOwn = 0.0;
  if (read <= 0.0) return f;
  // Where a tile fades in, its towers grow from within.
  float d = mix(-GRID_R, dSum / cover, cover);
  float heapTop = CB + colSum.x / read * (CT - CB), gBase = CB + colSum.y / read * (CT - CB);
  // (From here as the prototype of #76: the grid's body joins the present
  // field by a smooth maximum, and takes over its facts there.)
  float hu = clamp((h - gBase) / max(heapTop - gBase, 0.05), 0.0, 1.0);
  vec3 qg = vec3(x.x, h, x.y) / BASE_KM;
  // Detail at render time (the prototype's round 2). Less of it low on a
  // body (GRID_LOW of it below a fifth of its height: flat, softer bases),
  // none at its foot.
  float low = smoothstep(0.03, 0.25, hu) * mix(GRID_LOW, 1.0, smoothstep(0.2, 0.6, hu));
  // Heads of uBody (B: 500 m to 125 m, read GRID_HK times finer) carve the
  // surface as on main's body: crowns where it stands (ERO_C of their
  // weight out), seams in by up to GRID_HW km, fading SKIN deeper. The
  // grid's own creases are cut in too (GRID_CR of cav: the distance two
  // levels coarser, or the coarsest, less its own: positive
  // between lobes, negative on their crowns): the valleys between bulges
  // sharp and deep, the bulges kept.
  float hw = GRID_HW * low;
  if (d > -(ERO_C * hw + GRID_CR * 0.06 + 0.05) && d < hw + SKIN) {
    vec4 t = textureLod(uBody, qg * GRID_HK, max(lod + BODY_LOD + log2(GRID_HK), 0.0));
    float cav = 0.0;
    vec2 uv2;
    if (lC >= 0 && gridAt(x, lC + 2 > 2 ? 2 : lC + 2, uv2)) cav = gridD(uv2, lC + 2 > 2 ? 2 : lC + 2, yg) - d;
    float dd = d + ERO_C * hw;
    float sk = 1.0 - smoothstep(0.0, SKIN, dd - hw);
    d = dd - hw * t.z * sk - GRID_CR * max(cav, 0.0) * sk;
    // (How deep in a crease, for the light: see GRID_AO.)
    gridCrease = smoothstep(0.0, 0.08, cav + hw * (t.z - 0.4));
  }
  // Packed billows on that (A of uBody, GRID_BK times finer than the tile:
  // 16 to 64 cells across it, 214 m down to 54 m), every place on a billow
  // and billows meeting in sharp seams; the same carving (crowns out by
  // 0.45 of their weight, their mean), GRID_BW km deep at most, read at the
  // pixel's level (smooth where they are smaller than a pixel).
  float bw = GRID_BW * low;
  if (d > -(0.45 * bw + 0.03) && d < bw + SKIN_F) {
    float tb = textureLod(uBody, qg * GRID_BK, max(lod + BODY_LOD + log2(GRID_BK / DETAIL) + 1.7, 0.0)).w;
    float db = d + 0.45 * bw;
    d = db - bw * tb * (1.0 - smoothstep(0.0, SKIN_F, db - bw));
  }
  float fg = BODY_G * d;
  float k = 0.1;
  float s = clamp(0.5 + (fg - f) / (2.0 * k), 0.0, 1.0);
  gridCrease *= s;
  if (s <= 0.0) return f;
  f = mix(f, fg, s) + k * s * (1.0 - s);
  solidAt = mix(solidAt, 1.0, s);
  carved = mix(carved, 1.0, s);
  steep = mix(steep, BODY_D, s);
  heapUp = mix(heapUp, hu, s);
  overBase = mix(overBase, h - gBase, s);
  body = mix(body, max(body, 2.0), s);
  thin *= 1.0 - s;
  relief *= 1.0 - s;
  lump *= 1.0 - s;
  base = mix(base, 9.0, s);
  y = mix(y, (h - gBase) / (CT - CB), s);
  q = vec4(qg, max(q.w, 0.9));
  return f;
}
