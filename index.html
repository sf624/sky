<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky — レイリー散乱の空</title>
<style>
  :root {
    --wall: #f3f1ec;
    --ink: #1c2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero: the sky itself ---------- */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    color: #fff;
  }
  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;   /* a drag by touch looks around, as with the mouse */
    /* Fallback when WebGL is unavailable. */
    background: linear-gradient(to top,
      oklch(0.90 0.04 235) 0%, oklch(0.74 0.11 245) 30%,
      oklch(0.56 0.15 255) 70%, oklch(0.44 0.15 260) 100%);
  }
  .hero canvas:active { cursor: grabbing; }
  .title {
    position: absolute;
    left: clamp(20px, 6vw, 88px);
    right: clamp(20px, 6vw, 88px);
    top: clamp(20px, 6vw, 88px);       /* as far from the top as from the left */
    pointer-events: none;
    text-shadow: 0 1px 24px rgba(10, 40, 110, .35);
  }
  .title h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 104px);
    font-weight: 200;
    letter-spacing: .04em;
    line-height: 1.05;
    /* The line box leaves room above the capitals: without it the title
       would stand lower than its margin says. Trim it where the browser
       can; elsewhere, about as much by hand. */
    text-box: trim-start cap alphabetic;
  }
  @supports not (text-box: trim-start cap alphabetic) {
    .title h1 { margin-top: -.2em; }
  }
  .title p {
    margin: 14px 0 0;
    font-size: clamp(14px, 1.5vw, 18px);
    letter-spacing: .12em;
    opacity: .92;
  }
  .panel {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 5vh, 44px);
    transform: translateX(-50%);
    width: min(840px, calc(100vw - 32px));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 24px;
    padding: 14px 22px 16px;
    border-radius: 18px;
    background: rgba(24, 58, 120, .34);
    border: 1px solid rgba(255, 255, 255, .28);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    font-size: 13px;
    letter-spacing: .06em;
  }
  .panel label { display: block; }
  /* The time row: play, now, the rate, then the time slider; the slider
     goes to a line of its own when the row is too narrow for its label. */
  .panel .time { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .panel .time label { flex: 1; min-width: 260px; }
  .panel button {
    width: 38px; height: 38px; flex: none;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .panel button:hover { background: rgba(255, 255, 255, .25); }
  .panel button svg { display: block; width: 18px; height: 18px; margin: auto; }
  .panel .row { display: flex; justify-content: space-between; }
  .panel output { font-variant-numeric: tabular-nums; opacity: .9; }
  .panel input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #fff; }
  .panel select {
    width: 100%; margin: 4px 0 0; padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font: inherit; letter-spacing: inherit;
    cursor: pointer;
  }
  .panel select option { color: #123; }
  .panel .time select { width: auto; flex: none; margin: 0; }
  .title .hint {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: .1em;
    opacity: .75;
  }
  /* Full screen, top right, in the corner that nothing else uses. */
  .fs {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 38px; height: 38px;
    padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(24, 58, 120, .34);
    color: #fff;
    cursor: pointer;
  }
  .fs:hover { background: rgba(60, 100, 170, .5); }
  .fs svg { width: 18px; height: 18px; }
  .fs .leave, .hero:fullscreen .fs .enter { display: none; }
  .hero:fullscreen .fs .leave { display: block; }
  .fs[hidden] { display: none; }
  @media (max-width: 700px) {
    .panel { grid-template-columns: repeat(2, 1fr); gap: 6px 18px; padding: 12px 16px 14px; }
  }
  /* A short window (a phone on its side): a smaller title nearer the top,
     the panel in fewer rows when it is wide enough, and a panel that never
     runs off the screen (it scrolls inside itself). */
  .panel { max-height: calc(100% - 2 * clamp(16px, 5vh, 44px)); overflow-y: auto; }
  @media (max-height: 560px) {
    .title { left: 16px; top: 16px; right: 70px; }
    .title h1 { font-size: clamp(32px, 11vh, 56px); }
    .title p { margin-top: 6px; font-size: 14px; }
    .title .hint { margin-top: 4px; }
  }
  @media (max-height: 560px) and (min-width: 701px) {
    .panel { grid-template-columns: repeat(5, 1fr); width: min(1040px, calc(100vw - 32px)); gap: 4px 20px; padding: 10px 18px 12px; }
  }
  /* The title and the hint are shown at first, then fade for good (.told).
     The panel and the full-screen button fade while nothing moves (.still)
     and come back with the pointer, a touch, a key or focus. Hidden, they
     take no clicks, so the view behind them can still be dragged; their
     controls stay in the tab order, and focus brings them back. Only
     opacity changes: the canvases are not drawn again. */
  .title { transition: opacity 1s, visibility 1s; }
  .hero.told .title { opacity: 0; visibility: hidden; }
  .panel, .fs { transition: opacity .6s; }
  .hero.still .panel, .hero.still .fs { opacity: 0; pointer-events: none; }
  /* The cursor goes with them, when their fade starts (a cursor cannot
     fade), and comes back with them; it wins over grab and grabbing. */
  .hero.still, .hero.still canvas, .hero.still canvas:active { cursor: none; }
  /* Loading: until the first picture is on the canvas (.shown), a dark
     sky with the title, a thin line of progress and a word stands over it.
     The line and the word fade in only after 0.3 s, so that a quick start
     shows nothing but the dark; the panel and the full-screen button wait
     hidden (they take no clicks and no focus). Then the dark fades out over
     the picture, and lets the pointer through to it at once. Without
     WebGL2 it fades out over the canvas's gradient. */
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    background: radial-gradient(130% 90% at 50% 105%, #22385f 0%, #121f3b 45%, #080d1c 100%);
    transition: opacity .8s, visibility .8s;
  }
  .hero.shown .loading { opacity: 0; visibility: hidden; pointer-events: none; }
  .hero:not(.shown) .panel, .hero:not(.shown) .fs { opacity: 0; visibility: hidden; }
  .loading .line, .loading p { opacity: 0; animation: sky-appear .6s ease .3s forwards; }
  /* With the picture, they go at once: the panel may come up where they are. */
  .hero.shown .loading .line, .hero.shown .loading p { animation: none; }
  .loading .line {
    position: relative;
    width: min(220px, 50vw);
    height: 2px;
    overflow: hidden;
    border-radius: 1px;
    background: rgba(255, 255, 255, .16);
  }
  /* The part done (--done, 0 to 1, set by the script), and a faint light
     that runs along the line while the page works. */
  .loading .line::before, .loading .line::after { content: ""; position: absolute; inset: 0; }
  .loading .line::before {
    background: rgba(255, 255, 255, .8);
    transform-origin: left;
    transform: scaleX(var(--done, 0));
    transition: transform .4s;
  }
  .loading .line::after {
    width: 35%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
    animation: sky-sweep 1.8s ease-in-out infinite;
  }
  .loading p {
    margin: 14px 0 0;
    font-size: 12px;
    letter-spacing: .14em;
    color: rgba(255, 255, 255, .78);
  }
  @keyframes sky-appear { to { opacity: 1; } }
  @keyframes sky-sweep { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) {
    .title, .panel, .fs { transition: none; }
    .loading .line::after { animation: none; display: none; }
  }
</style>
</head>
<body>

<section class="hero" data-sky="loading">
  <canvas id="sky" aria-label="巡航中の航空機から見た、空と雲と海" data-t-label="canvas"></canvas>
  <div class="loading" role="status">
    <div class="line"></div>
    <p data-t="loading">読み込み中…</p>
  </div>
  <div class="title">
    <h1>Sky</h1>
    <p data-t="subtitle">レイリー散乱で描く、雲の上の空</p>
    <p class="hint" data-t="hint">ドラッグで見回す</p>
  </div>
  <button class="fs" type="button" hidden aria-label="全画面表示" title="全画面表示">
    <svg class="enter" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>
    <svg class="leave" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>
  </button>
  <form class="panel" onsubmit="return false">
    <div class="time">
      <button id="play" type="button" aria-label="時間を進める" data-t-label="play">▶</button>
      <button id="now" type="button" aria-label="いまの日時" title="いまの日時" data-t-label="now" data-t-title="now">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 4.8V9l2.8 1.8"/></svg>
      </button>
      <select id="rate" aria-label="時間の進む速さ" title="時間の進む速さ" data-t-label="rate" data-t-title="rate">
        <option value="1" data-t="rate1">実時間</option>
        <option value="60" data-t="rate60">1分/秒</option>
        <option value="600" data-t="rate600">10分/秒</option>
        <option value="960" data-t="rate960" selected>16分/秒</option>
        <option value="3600" data-t="rate3600">1時間/秒</option>
      </select>
      <label>
        <span class="row"><span data-t="time">時刻</span><output id="timeOut"></output></span>
        <input id="time" type="range" min="0" max="24" step="0.05" value="15">
      </label>
    </div>
    <label>
      <span class="row"><span data-t="date">日付</span><output id="dateOut"></output></span>
      <input id="date" type="range" min="1" max="365" step="1">
    </label>
    <label>
      <span class="row"><span data-t="moon">月</span><output id="moonOut"></output></span>
      <input id="moon" type="range" min="0" max="29.5" step="0.5">
    </label>
    <label>
      <span class="row"><span data-t="haze">大気の霞</span><output id="hazeOut"></output></span>
      <input id="haze" type="range" min="0" max="6" step="0.05" value="1">
    </label>
    <label>
      <span class="row"><span data-t="wind">海上の風</span><output id="windOut"></output></span>
      <input id="wind" type="range" min="1" max="15" step="0.5" value="6">
    </label>
    <label>
      <span class="row"><span data-t="alt">高度</span><output id="altOut"></output></span>
      <input id="alt" type="range" min="0.3" max="13" step="0.1" value="11">
    </label>
    <label>
      <span class="row"><span data-t="speed">速度</span><output id="speedOut"></output></span>
      <input id="speed" type="range" min="0" max="3000" step="50" value="900">
    </label>
    <label>
      <span class="row"><span data-t="cloud">雲</span><output id="cloudOut"></output></span>
      <input id="cloud" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      <span class="row"><span data-t="cirrus">薄雲</span><output id="cirrusOut"></output></span>
      <input id="cirrus" type="range" min="0" max="1" step="0.01" value="0.4">
    </label>
    <label>
      <span class="row"><span data-t="sound">音</span><output id="soundOut"></output></span>
      <select id="sound">
        <option value="off" data-t="soundOff">なし</option>
        <option value="airliner" data-t="soundAirliner">旅客機</option>
        <option value="airliner-whine" data-t="soundWhine">エンジン近く</option>
        <option value="wind" data-t="soundWind">風</option>
      </select>
    </label>
    <label>
      <span class="row"><span data-t="volume">音量</span><output id="volumeOut"></output></span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      <span class="row"><span data-t="pixels">解像度</span></span>
      <select id="pixels">
        <option value="fhd" data-t="fhd">フルHD</option>
        <option value="wqhd" selected>WQHD</option>
        <option value="4k">4K</option>
      </select>
    </label>
    <label>
      <span class="row"><span data-t="lang">言語 / Language</span></span>
      <select id="lang">
        <option value="ja" lang="ja">日本語</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
  </form>
<script>
// The text of the hero, in Japanese and English. The HTML holds the Japanese;
// this runs as soon as the hero is parsed, before the long scripts below, so
// an English reader does not see the Japanese first. Elements name their
// text with data-t (contents), data-t-label (aria-label) and data-t-title.
const TEXT = {
  ja: {
    title: 'Sky — レイリー散乱の空',
    canvas: '巡航中の航空機から見た、空と雲と海',
    subtitle: 'レイリー散乱で描く、雲の上の空',
    hint: 'ドラッグで見回す',
    loading: '読み込み中…',
    fullScreen: '全画面表示',
    exitFullScreen: '全画面を終了',
    play: '時間を進める', now: 'いまの日時',
    rate: '時間の進む速さ', rate1: '実時間', rate60: '1分/秒', rate600: '10分/秒', rate960: '16分/秒', rate3600: '1時間/秒',
    time: '時刻', date: '日付', moon: '月', haze: '大気の霞', wind: '海上の風',
    alt: '高度', speed: '速度', cloud: '雲', cirrus: '薄雲', pixels: '解像度', fhd: 'フルHD',
    lang: '言語 / Language',
    sound: '音', soundOff: 'なし', soundAirliner: '旅客機', soundWhine: 'エンジン近く', soundWind: '風',
    volume: '音量', soundWait: 'クリックで再生',
    // The light of the hour, by the sun's elevation (see showLabels).
    night: '夜', astronomical: '天文薄明', nautical: '航海薄明', civil: '市民薄明',
    morning: '朝', evening: '夕方', day: '昼',
    dateText: (month, day) => month + '月' + day + '日',
    newMoon: '新月', firstQuarter: '上弦', fullMoon: '満月', lastQuarter: '下弦',
    moonAge: age => '月齢 ' + age,
    hazes: ['澄みきった', '澄んだ', 'うす霞', '霞'],
    clouds: ['なし', '少ない', '中くらい', '多い', '一面'],
    cirri: ['なし', '少ない', '中くらい', '多い'],
  },
  en: {
    title: 'Sky — a Rayleigh-scattered sky',
    canvas: 'The sky, clouds and sea, seen from a cruising aircraft',
    subtitle: 'The sky above the clouds, drawn with Rayleigh scattering',
    hint: 'Drag to look around',
    loading: 'Loading…',
    fullScreen: 'Full screen',
    exitFullScreen: 'Exit full screen',
    play: 'Play time-lapse', now: 'Now',
    rate: 'Speed of time', rate1: 'real time', rate60: '1 min/s', rate600: '10 min/s', rate960: '16 min/s', rate3600: '1 h/s',
    time: 'Time', date: 'Date', moon: 'Moon', haze: 'Haze', wind: 'Wind at sea',
    alt: 'Altitude', speed: 'Speed', cloud: 'Clouds', cirrus: 'Thin clouds', pixels: 'Resolution', fhd: 'Full HD',
    lang: 'Language / 言語',
    sound: 'Sound', soundOff: 'Off', soundAirliner: 'Airliner', soundWhine: 'Near engines', soundWind: 'Wind',
    volume: 'Volume', soundWait: 'click to play',
    night: 'night', astronomical: 'astronomical twilight', nautical: 'nautical twilight', civil: 'civil twilight',
    morning: 'morning', evening: 'evening', day: 'day',
    dateText: (month, day) => day + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][month - 1],
    newMoon: 'new moon', firstQuarter: 'first quarter', fullMoon: 'full moon', lastQuarter: 'last quarter',
    moonAge: age => 'day ' + age,
    hazes: ['crystal clear', 'clear', 'light haze', 'hazy'],
    clouds: ['none', 'few', 'some', 'many', 'overcast'],
    cirri: ['none', 'few', 'some', 'many'],
  },
};
// The language: the address (?lang=en), else the reader's last choice, else
// the browser's first Japanese or English language; English for all others.
let LANG = (() => {
  const known = l => l === 'ja' || l === 'en';
  const asked = new URLSearchParams(location.search).get('lang');
  if (known(asked)) return asked;
  let stored = null;
  try { stored = localStorage.getItem('sky.lang'); } catch (err) {}
  if (known(stored)) return stored;
  for (const l of navigator.languages || [navigator.language || '']) {
    if (/^ja(-|$)/i.test(l)) return 'ja';
    if (/^en(-|$)/i.test(l)) return 'en';
  }
  return 'en';
})();
function applyLanguage(lang) {
  LANG = lang;
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', T[el.dataset.tLabel]);
  for (const el of document.querySelectorAll('[data-t-title]')) el.title = T[el.dataset.tTitle];
  document.getElementById('lang').value = lang;
}
applyLanguage(LANG);
</script>
</section>

<!-- Stars to magnitude 6.5 (V band) from Wikidata: structured data under CC0
     (https://www.wikidata.org/wiki/Wikidata:Copyright), retrieved 2026-11-15
     with tools/make-stars.py. Six bytes each, little-endian: right ascension
     (u16, turns), declination (u16, -90..90 degrees), V magnitude (u8, -1.5..6.5),
     B-V colour (u8, -0.5..2). Brightest first. 101 stars that Wikidata gives no V

<script id="noise" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Draws the textures of the clouds once, at start: slice uZ (0 to 1) of the
// 3D noise, or the weather map (uZ < 0). Everything repeats.
uniform float uZ;
uniform float uSize;
out vec4 outColor;

// An integer hash: xor-shifts and multiplies, Wellons' lowbias32
// (hash-prospector, public domain). Inputs one apart give unrelated words.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for a lattice point; the lattice repeats
// every `period` points (at most 1024). One hash of the cell, its
// coordinates packed into a word, plus the seed spaced by the golden ratio.
// The numbers are the word, and its low 21 and 10 bits moved up: their
// first 11, 11 and 10 bits are their own, finer than the 8 bits the
// textures keep.
vec3 rnd(vec3 cell, vec3 period, float seed) {
  uvec3 c = uvec3(mod(cell, period));
  uint h = ihash(c.x + (c.y + c.z * 1024u) * 1024u + uint(seed) * 0x9e3779b9u + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

// Worley noise, upside down: 1 at a feature point, 0 far from all of them.
float worley(vec3 p, vec3 freq, float seed) {
  p *= freq;
  vec3 id = floor(p), f = p - id;
  float m = 1.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      for (int z = -1; z <= 1; z++) {
        vec3 g = vec3(x, y, z);
        vec3 r = g + rnd(id + g, freq, seed) - f;
        m = min(m, dot(r, r));
      }
    }
  }
  return 1.0 - sqrt(m);
}

float worleyFbm(vec3 p, vec3 freq, float seed) {
  return 0.625 * worley(p, freq, seed) + 0.25 * worley(p, 2.0 * freq, seed + 1.0)
       + 0.125 * worley(p, 4.0 * freq, seed + 2.0);
}

// Perlin (gradient) noise, about -1 to 1.
float perlin(vec3 p, vec3 freq, float seed) {
  p *= freq;
  vec3 i = floor(p), f = p - i;
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
#define G(c) dot(rnd(i + c, freq, seed) * 2.0 - 1.0, f - c)
  return mix(mix(mix(G(vec3(0, 0, 0)), G(vec3(1, 0, 0)), u.x), mix(G(vec3(0, 1, 0)), G(vec3(1, 1, 0)), u.x), u.y),
             mix(mix(G(vec3(0, 0, 1)), G(vec3(1, 0, 1)), u.x), mix(G(vec3(0, 1, 1)), G(vec3(1, 1, 1)), u.x), u.y), u.z);
}

float perlinFbm(vec3 p, vec3 freq, int octaves, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq *= 2.0;
    amp *= 0.555;
  }
  return sum;
}

// The same with a chosen gain: nearer 1, more of the small sizes.
float fbm(vec3 p, vec3 freq, int octaves, float gain, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq.xy *= 2.0;
    amp *= gain;
  }
  return sum;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  if (uZ >= 0.0) {
    // Perlin-Worley (after Schneider, 2015): Worley cells, swollen by billowy Perlin noise.
    vec3 p = vec3(uv, uZ);
    float billow = min(abs(perlinFbm(p, vec3(4.0), 7, 0.0)), 1.0);
    float g = worleyFbm(p, vec3(4.0), 10.0);
    float b = worleyFbm(p, vec3(8.0), 20.0);
    float a = worleyFbm(p, vec3(16.0), 30.0);
    outColor = vec4(g + billow * (1.0 - g), g, b, a);
  } else {
    // Weather, on a map 256 km wide: systems of some 80 km; open cells of
    // 30 km, with the cloud along their walls; streets, rows of cloud 5 km
    // apart; and clumps from 6 km down to single clouds of 1 km. The many
    // sizes of the clumps make clouds of many sizes.
    vec3 p = vec3(uv, 0.37);
    float systems = perlinFbm(p, vec3(3.0, 3.0, 1.0), 3, 40.0);
    float walls = smoothstep(0.3, 0.75, 1.0 - worley(p, vec3(9.0, 9.0, 1.0), 50.0));
    // Whole numbers turn the streets and keep them repeating.
    vec3 s = vec3(4.0 * uv.x + uv.y, 4.0 * uv.y - uv.x, 0.37);
    float streets = fbm(s, vec3(12.0, 3.0, 1.0), 3, 0.7, 90.0);
    float clumps = fbm(p, vec3(40.0, 40.0, 1.0), 4, 0.75, 60.0);
    float cover = 0.5 + 0.18 * systems + 0.15 * (walls - 0.5) + 0.3 * streets + 0.5 * clumps;
    // Towers: the widest clumps, where the weather lets them grow; some
    // grow taller than others.
    float tall = smoothstep(0.4, 0.55, 0.45 + 0.7 * perlinFbm(p, vec3(5.0, 5.0, 1.0), 4, 70.0))
               * smoothstep(0.15, 0.4, fbm(p, vec3(20.0, 20.0, 1.0), 3, 0.6, 65.0))
               * (0.7 + 0.6 * perlin(p, vec3(11.0, 11.0, 1.0), 75.0));
    // Wind on the sea, which blows towards (2, 1): gusts and calms some
    // 7 km across and twice as long down the wind, with finer ones inside
    // them.
    vec3 pw = vec3(2.0 * uv.x + uv.y, 2.0 * uv.y - uv.x, 0.37);
    float gusts = 0.5 + 0.55 * perlinFbm(pw, vec3(8.0, 16.0, 1.0), 5, 80.0);

    outColor = vec4(cover, tall, gusts, 0.0);
  }
}
</script>

<script id="ice" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Draws the cirrus's textures once: its map (uZ = -2), its ice (-3, and
// the ice's age into a second target), and the way of the ice's fibres and
// its age (-4). Everything repeats.
uniform float uZ;
uniform vec2 uSize;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAge;
layout(location = 2) out vec4 outPhase;

// An integer hash: Wellons' lowbias32, as in the noise shader.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// ---------- The cirrus's ice ----------
// A tile of ICE_KM square (half a unit of the cirrus's frame). The ice is
// drawn as systems, as photographs show cirrus: a few large, connected
// forms with much blue between, not a sprinkle of tufts. A generating head
// makes ice, which falls out of it into wind that turns with depth: the
// shear draws it into a long tail that curves away (a fall streak: mares'
// tails, the hook of cirrus uncinus). Heads come in groups along a spine,
// and their tails join into a feather or a broad fibrous band. Old ice
// spreads into broad fibrous sheets and long streets.
//
// Everything is drawn in one warped frame, the flow (iceFlowFrame): its
// lines of constant y are the ways the wind draws the ice, and they turn
// slowly over tens of km, so that the strands of neighbouring forms run
// together and their way changes from region to region. In that frame a
// tail is two arcs (a hook, then a long tail that curves gently) whose
// strands fan out from the head; a sheet is noise drawn out along it. Each
// texel is computed by itself, in closed form: the field does not depend
// on the order of the draws, and repeats with the tile.
//
// Four kinds make four fields (the channels of the texture), which the
// scene mixes by the cirrus's map: tails (R), sheets and streets (G),
// flocks of small tufts (B) and large systems (A).
const float ICE_KM = 40.477;     // WEATHER_KM / sqrt(10) / 2
const float WEATHER_KM = 256.0;

// Lattice words: a point's coordinates and the seed hashed into one word.
uint iceWord(uvec3 c, uint seed) {
  return ihash(c.x * 0x9e3779b9u + c.y * 0x85ebca6bu + c.z * 0xc2b2ae35u + seed * 0x27d4eb2fu);
}

// Gradient noise in 2D, with its gradient. The gradients turn with time t
// (each at a speed of its own, up to a turn per unit), so the pattern
// changes in time. It repeats every `period` cells (whole numbers); the
// lattice wraps by hand (see the GLSL rules on mod()).
float iceNoise(vec2 p, vec2 period, float t, uint seed, out vec2 grad) {
  vec2 i = floor(p), f = p - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec2 i0 = i - period * floor((i + 0.5) / period);
  vec2 i1 = i0 + 1.0;
  i1 -= period * floor((i1 + 0.5) / period);
  float n = 0.0;
  grad = vec2(0.0);
  for (int k = 0; k < 4; k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uint h = iceWord(uvec3(uvec2(mix(i0, i1, c) + 0.5), 0u), seed);
    float ang = 6.2831853 * (float(h >> 16u) / 65536.0 + t * (float(h & 1023u) / 511.5 - 1.0));
    vec2 g = vec2(cos(ang), sin(ang)), d = f - c, w = mix(1.0 - u, u, c);
    float v = dot(g, d), wt = w.x * w.y;
    n += wt * v;
    grad += wt * g + v * (2.0 * c - 1.0) * du * w.yx;
  }
  return n;
}

// Four random numbers (0 to 1) from a word.
vec4 iceRandom(uint h) {
  uint h2 = ihash(h);
  return vec4(uvec4(h, h >> 16u, h2, h2 >> 16u) & 65535u) / 65535.0;
}

// Value noise in 2D (0 to 1), not repeating (for the fibres of a head).
float iceValue(vec2 p, uint seed) {
  vec2 i = floor(p), f = p - i, u = f * f * (3.0 - 2.0 * f);
  uvec2 c = uvec2(ivec2(i) + 32768);
  float v00 = float(iceWord(uvec3(c, 0u), seed) >> 8u), v10 = float(iceWord(uvec3(c + uvec2(1u, 0u), 0u), seed) >> 8u);
  float v01 = float(iceWord(uvec3(c + uvec2(0u, 1u), 0u), seed) >> 8u), v11 = float(iceWord(uvec3(c + uvec2(1u, 1u), 0u), seed) >> 8u);
  return mix(mix(v00, v10, u.x), mix(v01, v11, u.x), u.y) / 16777215.0;
}

// The flow: x displaced by noise at three sizes (20, 8 and 3.4 km, whole
// numbers to the tile, so that it repeats with it), more across the wind
// than along. Lines of constant y of the result are the ways the ice is
// drawn; they turn by up to some 0.4 rad over 10 to 20 km. The slope of
// the displacement stays well under 1, so the frame never folds.
vec2 iceFlowFrame(vec2 x, uint seed) {
  const vec3 W[3] = vec3[3](vec3(2.0, 2.0, 4.0), vec3(5.0, 0.8, 1.2), vec3(12.0, 0.15, 0.25));
  vec2 d = vec2(0.0), g;
  for (int o = 0; o < 3; o++) {
    vec2 q = x * (W[o].x / ICE_KM), per = vec2(W[o].x);
    d += W[o].yz * vec2(iceNoise(q, per, 0.0, seed + uint(2 * o), g), iceNoise(q, per, 0.0, seed + uint(2 * o + 1), g));
  }
  return x + d;
}

// The way from the start of an arc to its point at l km along: the arc
// leaves at the angle th and turns at the rate k (rad per km).
vec2 iceArcEnd(float th, float k, float l) {
  if (abs(k * l) < 1e-3) return l * vec2(cos(th), sin(th));
  return vec2(sin(th + k * l) - sin(th), cos(th) - cos(th + k * l)) / k;
}

// The point of such an arc from p0, l km long, nearest q: (the way along
// it to that point, 0 to l; the place across, signed, to the left; the way
// beyond its ends, negative before p0). Beyond its ends the arc runs on
// straight.
vec3 iceArcNear(vec2 q, vec2 p0, float th, float k, float l) {
  vec2 e = vec2(cos(th), sin(th)), d = q - p0;
  float s = dot(d, e);
  if (abs(k) * l >= 0.02) {
    // About the centre: the angle from p0, the way the arc turns.
    vec2 a = vec2(e.y, -e.x) / k, b = d + a;
    s = atan(a.x * b.y - a.y * b.x, dot(a, b)) / k;
    float turn = 6.2831853 / abs(k);
    if (s < 0.5 * (l - turn)) s += turn;
    if (s >= 0.0 && s <= l) return vec3(s, 1.0 / k - sign(k) * length(b), 0.0);
  } else if (s >= 0.0 && s <= l) {
    return vec3(s, dot(d, vec2(-e.y, e.x)), 0.0);
  }
  float se = s > l ? l : 0.0, te = th + k * se;
  vec2 de = q - p0 - iceArcEnd(th, k, se), ee = vec2(cos(te), sin(te));
  return vec3(se, dot(de, vec2(-ee.y, ee.x)), dot(de, ee));
}

// The point of a tail nearest q (as iceArcNear, the way along from the
// head): its ice leaves the head at hp turned by `hook` from the way th,
// comes round to it over lh km (a comma, the hook of cirrus uncinus), then
// turns by `veer` over the rest of its length L, as it falls into wind of
// another way.
vec3 iceTailNear(vec2 q, vec2 hp, float th, float hook, float lh, float veer, float L) {
  float k1 = -hook / lh;
  vec3 a = iceArcNear(q, hp, th + hook, k1, lh);
  vec3 b = iceArcNear(q, hp + iceArcEnd(th + hook, k1, lh), th, veer / (L - lh), L - lh);
  b.x += lh;
  return dot(a.yz, a.yz) < dot(b.yz, b.yz) ? a : b;
}

// The strands' phase (see icePhase): their phasor summed over the ice (xy)
// and the ice summed (z), each kind weighed by iceKind, as the scene
// mostly mixes them.
vec3 icePh = vec3(0.0);
float iceKind = 0.0;
// Adds ice val whose strands lie at whole numbers of v, sp km apart: as a
// phasor of v, so that the scene can draw hairs along them (ciHair),
// weighed by the square of the ice, so that where trails of several ages
// or heads meet, the densest leads (summed evenly, the phase wavered from
// texel to texel and the hairs drawn along it stood as worms). Where
// they lie closer than four texels, every m-th (m not whole: the phase runs
// on smoothly), so that the phase never changes by more than a quarter of
// a turn from a texel to the next.
void icePhase(float val, float v, float sp) {
  float m = max(1.0, 4.0 * ICE_KM / uSize.x / sp), th = 6.2831853 * v / m, w = iceKind * val;
  w *= w;
  icePh += vec3(w * cos(th), w * sin(th), w);
}

// How much of a pattern of period sp (km) the ice's texels can hold: 0
// where the period is under k texels, 1 over twice that. Strands and
// threads finer than that are drawn as their mean: sampled once a texel,
// they aliased into moire that no filter of the scene could take out
// (ripples across soft bands from the ground, round 13's g3). The hairs
// (ciHair, in the scene) draw the fine strands instead.
float iceFine(float sp, float k) {
  return smoothstep(k, 2.0 * k, sp * uSize.x / ICE_KM);
}

// The strands of a trail: its ice falls in streaks along it. u: the place
// across the trail in units of its half width there, which grows with age,
// so that the strands fan out; al: the place along it; n: strands to a
// half width; sp: the strands' spacing (km). Returns their weight (around
// 1) and the share of the head's
// life that the strand there lives: the strands end one by one, the outer
// ones first, so that a trail tapers and frays out instead of ending
// round.
vec2 iceStrands(float u, float a, float al, float n, float sp, uint seed, out float vs) {
  float v = u * n;
  float life = (0.75 + 0.3 * iceValue(vec2(0.8 * v, 0.5), seed + 4u)) * (1.0 - 0.12 * min(u * u, 5.0));
  // The strands wander from side to side, each group of two or three its
  // own way, so that they cross and braid; and towards the end of its life
  // a strand curls off to one side or the other, as the ice that falls
  // last meets the shear below.
  float wob = 2.0 * iceValue(vec2(0.37 * v + 3.0, 2.5 * al), seed + 6u) - 1.0;
  float curl = 2.0 * iceValue(vec2(0.6 * v, 7.5), seed + 8u) - 1.0;
  float end = smoothstep(0.35 * life, life, a);
  v += (0.6 + 0.6 * a) * wob;
  // (The hairs follow the strands without their curl: drawn crisp along
  // it, the curls of the thin tails stood as a net of loops.)
  vs = v;
  v += 2.5 * curl * end * end;
  float band = iceValue(vec2(v, al), seed);
  float thr = 1.0 - abs(2.0 * iceValue(vec2(2.7 * v, 3.0 * al) + 5.0, seed + 2u) - 1.0);
  thr *= thr;
  thr *= thr * thr;
  // Patches across the strands: the ice falls in bursts, so that a trail
  // thickens and thins along its length over several strands at once
  // (bands across the streaks), with gaps between.
  float burst = iceValue(vec2(0.12 * v + 11.0, 1.1 * al), seed + 10u);
  burst = 0.15 + 2.2 * burst * burst;
  // Strands closer than some three texels, and threads closer than six,
  // are their mean (0.30 and 0.22): see iceFine.
  float b2 = mix(0.30, band * band, iceFine(sp, 2.5)), t6 = mix(0.22, thr, iceFine(sp / 2.7, 5.0));
  return vec2((0.08 + 1.5 * b2 + 2.5 * t6) * burst, life);
}

// Systems of heads with tails, in the flow's frame (w, km), one to a cell
// of `cells` to the tile (along the flow, across): tails len.x to len.y km
// long (many short, a few long), their width at the end wid.x to wid.y of
// their length (fans, which have lost their head, twice that); heads of
// some `head` km, up to `heads` of them to a system, along a spine across
// the flow (their tails join into a broad band of fibres) or along it
// (ribs off a spine: cirrus vertebratus). Groups of systems (noise of some
// 20 and 8 km at the head) are strong, weak or missing (gate: the noise's
// range from none to all but `empty` of the cells), so that the forms come
// in clusters with wide gaps of blue between. Returns the ice, and in age
// the ice times its age (0 at a head, 1 at the end of a tail): the ice
// falls as it ages, so its heads are high and its tails hang below them.
//
// A tail reaches no further than 1.8 cells down the flow from its head, 0.8
// up it and 0.85 across, so that the twelve cells searched (two up, one
// down, one to each side) hold every head whose ice can be here: a cut at
// the edge of the cells searched drew straight seams across the sky.
float iceSystems(vec2 w, vec2 cells, vec2 len, vec2 wid, float head, float heads, float empty, vec2 gate, uint seed, out float age) {
  vec2 C = ICE_KM / cells, c0 = floor(w / C);
  float sum = 0.0;
  age = 0.0;
  for (int ci = 0; ci < 12; ci++) {
    vec2 cell = c0 + vec2(float(ci % 4) - 2.0, float(ci / 4) - 1.0);
    vec2 wc = cell - cells * floor((cell + 0.5) / cells);
    uint h = iceWord(uvec3(uvec2(wc + 0.5), 9u), seed);
    vec4 r = iceRandom(h), r2 = iceRandom(h ^ 0x68e31da4u), r3 = iceRandom(h ^ 0x2f6b9a17u), r4 = iceRandom(h ^ 0x9e3779b9u);
    vec2 hp = (cell + vec2(0.1, 0.2) + vec2(0.6, 0.6) * r.xy) * C, g;
    float group = iceNoise(hp * (2.0 / ICE_KM), vec2(2.0), 0.0, seed + 21u, g) + 0.5 * iceNoise(hp * (5.0 / ICE_KM), vec2(5.0), 0.0, seed + 22u, g);
    float on = smoothstep(gate.x, gate.y, group);
    if (r2.x >= (1.0 - empty) * on) continue;
    // The system's way and turn: from noise over the tile (a group's tails
    // run and curve alike, as in photographs of mares' tails), and a little
    // of its own. Long tails turn less (they would leave the cells searched).
    float tilt = iceNoise(hp * (2.0 / ICE_KM), vec2(2.0), 0.0, seed + 23u, g);
    float bend = iceNoise(hp * (3.0 / ICE_KM), vec2(3.0), 0.0, seed + 24u, g);
    float L = len.x * pow(len.y / len.x, r.z);
    float sz = log(L / len.x) / log(len.y / len.x);
    bool fan = r2.w < 0.3;
    float r0 = head * (0.5 + 0.8 * r.w) * (0.5 + 0.7 * sz) * (fan ? 0.6 : 1.0);
    float th = 0.4 * tilt + 0.15 * (r3.x - 0.5);
    float veer = clamp(2.0 * bend + 0.8 * (r3.z - 0.5), -1.0, 1.0) * min(1.4 * C.y / L, 1.8);
    float hook = (fan ? 0.3 : 0.5 + 0.9 * sz) * (2.0 * r3.w - 1.0);
    float str = 0.5 * (0.25 + r2.y * r2.y) * (0.5 + 0.7 * smoothstep(gate.x, gate.y + 0.4, group));
    // The heads of the system along its spine.
    float nh = 1.0 + floor(r4.y * heads);
    bool ribs = r4.z < 0.3;
    float sa = ribs ? th + 0.3 * (r4.w - 0.5) : th + 1.5708 + 0.8 * (r4.w - 0.5);
    vec2 spine = (ribs ? 1.6 : 1.1) * r0 * (1.0 + r4.x) * vec2(cos(sa), sin(sa));
    for (int j = 0; j < 6; j++) {
      if (float(j) >= nh) break;
      vec4 rj = iceRandom(h + uint(j) * 0x85ebca6bu + 0x1234567u);
      vec2 hj = hp + spine * (float(j) - 0.5 * (nh - 1.0) + 0.3 * (rj.z - 0.5));
      // (Faded by the place against the system's own head, which lies in its cell.)
      vec2 dl = w - hj, dp = w - hp;
      float far = smoothstep(-C.x, -0.8 * C.x, dp.x) * (1.0 - smoothstep(1.8 * C.x, 2.0 * C.x, dp.x)) * (1.0 - smoothstep(0.85 * C.y, C.y, abs(dp.y)));
      if (far <= 0.0) continue;
      float Lj = L * (j == 0 ? 1.0 : 0.55 + 0.45 * rj.x), rj0 = r0 * (j == 0 ? 1.0 : 0.6 + 0.5 * rj.y);
      float lh = (0.06 + 0.1 * r3.y) * Lj + 2.0 * rj0;
      Lj = max(Lj, 1.5 * lh);
      float w1 = Lj * mix(wid.x, wid.y, r4.x) * (fan ? 2.0 : 1.0), w0 = 0.4 * rj0;
      // Quick reject: farther than the tail can reach.
      if (dot(dl, dl) > (Lj + lh + 3.0 * (w1 + rj0)) * (Lj + lh + 3.0 * (w1 + rj0))) continue;
      vec3 t = iceTailNear(w, hj, th + (j == 0 ? 0.0 : 0.15 * (rj.w - 0.5)), hook * (j == 0 ? 1.0 : 0.6 + 0.6 * rj.x), lh, veer, Lj);
      float T = t.x / Lj, wd = w0 + (w1 - w0) * pow(T, 0.8);
      float u = t.y / wd, hd2 = dot(dl, dl) / (rj0 * rj0);
      if (abs(u) > 3.5 && hd2 > 12.0) continue;
      // The tail: strands that fan out with it, end one by one, curl and
      // braid (iceStrands), thinning as the tail widens.
      float ns = fan ? 6.0 + 6.0 * r2.z : 3.0 + 5.0 * r2.z, vs;
      vec2 st = iceStrands(u, T, t.x / 2.5 + 31.0 * r.x + 7.0 * rj.y, ns, wd / ns, seed + 201u + uint(j), vs);
      float life = (0.65 + 0.35 * rj.w) * st.y;
      float keep = 1.0 - smoothstep(0.45 * life, life, T);
      float fib = mix(1.0, st.x, (0.5 + 0.4 * smoothstep(0.5, 1.8, abs(u))) * smoothstep(0.0, 0.15, T));
      float ends = exp(-0.5 * t.z * t.z / (wd * wd));
      float tail = (fan ? smoothstep(0.0, 0.12, T) : 1.0) * exp(-0.5 * u * u) * pow(w0 / wd, 0.5) * keep * fib * ends;
      // The head: the start of the tail, dense along its hook (a comma, not
      // a ball), and lumpy (knots of a third and a tenth of its size); a fan
      // has none.
      float hd = 0.0;
      if (!fan && t.x < 4.0 * lh) {
        float lump = 0.65 * iceValue(dl / (0.3 * rj0) + 17.0 * r.xy, seed + 107u) + 0.35 * iceValue(dl / (0.1 * rj0) + 5.0 * r.yx, seed + 109u);
        hd = (0.5 + 1.5 * r2.z) * exp(-0.5 * u * u - t.x / (0.4 * lh)) * ends * (0.2 + 1.6 * lump * lump);
      }
      float val = str * far * (tail + hd);
      sum += val;
      age += str * far * tail * T;
      icePhase(val, vs, wd / ns);
    }
  }
  return sum;
}

// Sheets and streets (G): old ice, spread by the shear into broad fibrous
// sheets and long streets along the flow. In the flow's frame (w): a body
// of noise drawn out along the wind (sheets of some 20 by 7 km; streets
// some 15 to 40 km long and 1 km wide, a few km apart; regions of 40 by 20
// km have the one or the other), and strands along it (noise of 5 km by
// 0.22 km and 2 km by 90 m, which wander from side to side by some 0.1 km,
// so that they braid; each strand ends at a place of its own). The body's
// edge breaks up along the strands (combed edges). A faint trace (a streaky
// veil) lies under it all: the scene takes it off except near the top of
// the slider. Returns the ice, and in age the ice times its age.
float iceSheets(vec2 w, uint seed, out float age) {
  vec2 g, q = w / ICE_KM;
  float wan = 0.25 * iceNoise(q * vec2(12.0, 60.0), vec2(12.0, 60.0), 0.0, seed + 9u, g);
  vec2 qs = q + vec2(0.0, wan / ICE_KM);
  float s1 = iceNoise(qs * vec2(2.0, 180.0), vec2(2.0, 180.0), 0.0, seed + 6u, g);
  float s2 = iceNoise(qs * vec2(8.0, 450.0), vec2(8.0, 450.0), 0.0, seed + 7u, g);
  float s3 = iceNoise(qs * vec2(20.0, 1200.0), vec2(20.0, 1200.0), 0.0, seed + 8u, g);
  float region = iceNoise(q * vec2(1.0, 2.0), vec2(1.0, 2.0), 0.0, seed + 1u, g);
  float sh = iceNoise(q * vec2(2.0, 6.0), vec2(2.0, 6.0), 0.0, seed + 2u, g) + 0.5 * iceNoise(q * vec2(4.0, 13.0), vec2(4.0, 13.0), 0.0, seed + 3u, g);
  float sn = iceNoise(q * vec2(1.0, 13.0), vec2(1.0, 13.0), 0.0, seed + 4u, g) + 0.3 * iceNoise(q * vec2(3.0, 31.0), vec2(3.0, 31.0), 0.0, seed + 10u, g);
  float run = smoothstep(-0.15, 0.25, iceNoise(q * vec2(3.0, 5.0), vec2(3.0, 5.0), 0.0, seed + 5u, g));
  float street = smoothstep(0.35, 0.9, 1.0 - 2.0 * abs(sn)) * run;
  float sheet = smoothstep(0.0, 0.45, sh);
  float env = mix(street, max(sheet, 0.5 * street), smoothstep(-0.25, 0.25, region));
  // Strands: each one's weight, around 1; the finest are their mean where
  // the texels cannot hold them (iceFine).
  float b1 = (0.5 + s1) * (0.5 + s1), b2 = mix(0.25, (0.5 + s2) * (0.5 + s2), iceFine(ICE_KM / 450.0, 2.5));
  float b3 = mix(0.25, (0.5 + s3) * (0.5 + s3), iceFine(ICE_KM / 1200.0, 2.5));
  float fib = 0.6 + 0.75 * b1 + 0.45 * b2 + 0.3 * b3;
  // The body's edge breaks up along the strands.
  float dens = smoothstep(0.1, 0.7, env + 0.12 * s1 + 0.05 * s2) * smoothstep(0.0, 0.3, env);
  float thick = 0.4 + 1.2 * smoothstep(-0.5, 0.5, iceNoise(q * vec2(6.0, 18.0), vec2(6.0, 18.0), 0.0, seed + 11u, g));
  float val = 0.12 * dens * thick * fib + 0.012 * fib;
  age = val * (0.35 + 0.35 * env);
  // A sheet's strands are less clear than a tail's: its phasor is half
  // cancelled (a second, weaker one half a turn off), so that its hairs are
  // faint (ciHair fades them with the phasor's length). Drawn in full, from
  // under the shell, the long straight strands of two decks crossed as a
  // net of scratches.
  float v = (w.y + wan) * (180.0 / ICE_KM);
  icePhase(val, v, ICE_KM / 180.0);
  icePhase(0.55 * val, v + 0.5, ICE_KM / 180.0);
  return val;
}

// The four fields of ice at x (km in the tile), all in one flow.
const float ICE_STORE = 1.0;   // the ice stored: sqrt(x / ICE_STORE)
// ages: the four fields weighed by the age of their ice (in units of a
// life), for its mean age (see iceWay).
vec4 iceField(vec2 x, uint seed, out vec4 ages) {
  vec2 w = iceFlowFrame(x, seed + 1u);
  vec4 f;
  iceKind = 1.0;
  f.x = iceSystems(w, vec2(3.0, 4.0), vec2(4.0, 24.0), vec2(0.035, 0.09), 0.5, 3.0, 0.45, vec2(-0.25, 0.3), seed + 100u, ages.x);
  f.y = iceSheets(w, seed + 200u, ages.y);
  iceKind = 0.5;
  f.z = iceSystems(w, vec2(12.0), vec2(0.3, 3.0), vec2(0.1, 0.3), 0.12, 1.0, 0.3, vec2(0.15, 0.45), seed + 300u, ages.z);
  iceKind = 2.5;
  f.w = iceSystems(w, vec2(2.0, 3.0), vec2(10.0, 36.0), vec2(0.05, 0.15), 1.2, 4.0, 0.4, vec2(-0.3, 0.2), seed + 400u, ages.w);
  return f;
}

// ---------- The cirrus's map ----------
// Where the cirrus is and of what kind, over the map (WEATHER_KM, 1 km a
// texel): R and G, how much there is for the upper and the lower deck
// (patches of some 85 and 35 km, and bands along the wind of 40 by 8 km
// and 27 by 5 km); B, the share of sheets; A, the share of flocks against
// the large systems (both over some 100 km). The bands run in the cirrus's
// frame (along (3, 1), across (-1, 3)), with whole numbers, so that the
// map repeats.
vec4 ciMap(vec2 uv) {
  vec2 g, c = vec2(dot(uv, vec2(3.0, 1.0)), dot(uv, vec2(-1.0, 3.0)));
  vec2 w;
  for (int k = 0; k < 2; k++) {
    uint s = 400u + 10u * uint(k);
    vec2 o = k == 0 ? vec2(0.0) : vec2(0.383, 0.617);
    float patches = iceNoise((uv + o) * 3.0, vec2(3.0), 0.0, s, g) + 0.5 * iceNoise((uv + o) * 7.0, vec2(7.0), 0.0, s + 1u, g);
    float bands = iceNoise(c * vec2(2.0, 10.0), vec2(2.0, 10.0), 0.0, s + 2u, g)
                + 0.5 * iceNoise(c * vec2(3.0, 16.0), vec2(3.0, 16.0), 0.0, s + 3u, g);
    w[k] = 0.5 + 0.9 * patches + 0.6 * bands;
  }
  float rows = iceNoise(uv * 2.0, vec2(2.0), 0.0, 421u, g) + 0.5 * iceNoise(uv * 5.0, vec2(5.0), 0.0, 422u, g);
  float flocks = iceNoise(uv * 3.0, vec2(3.0), 0.0, 431u, g) + 0.5 * iceNoise(uv * 6.0, vec2(6.0), 0.0, 432u, g);
  return clamp(vec4(w, 0.5 + 0.9 * rows, 0.5 + 0.9 * flocks), 0.0, 1.0);
}

// The ice, read back to find the way its fibres run (uZ = -4), and its age.
uniform sampler2D uIceIn;
uniform sampler2D uAgeIn;

// The way the ice's fibres run at uv: the structure tensor of the ice (its
// four fields together; the mean of its gradient times itself over 3 x 3
// texels of this texture, from the ice at the same size), as
// (Jxx - Jyy, 2 Jxy) over its trace. That is the gradient's direction at
// twice its angle, so that a gradient and its opposite add up and the mean
// over a footprint (the mipmaps) is the way most of it runs, with a length
// below 1 where it runs many ways. The fibres run across it.
vec4 iceWay(vec2 uv) {
  float s[25];
  float lod = log2(float(textureSize(uIceIn, 0).x) / uSize.x);
  for (int i = 0; i < 25; i++) {
    s[i] = dot(textureLod(uIceIn, uv + (vec2(i % 5, i / 5) - 2.0) / uSize, lod), vec4(1.0));
  }
  vec3 j = vec3(0.0);
  for (int i = 0; i < 9; i++) {
    int x = i % 3 + 1, y = i / 3 + 1, c = y * 5 + x;
    float w = (x == 2 ? 2.0 : 1.0) * (y == 2 ? 2.0 : 1.0);
    float gx = 0.5 * (s[c + 1] - s[c - 1]), gy = 0.5 * (s[c + 5] - s[c - 5]);
    j += w * vec3(gx * gx, gy * gy, gx * gy);
  }
  // And the mean age of the ice here, over this texel (see iceAge).
  return vec4(0.5 + 0.5 * vec2(j.x - j.y, 2.0 * j.z) / (j.x + j.y + 1e-4), textureLod(uAgeIn, uv, lod).rg);
}

// The mean age of the ice (its four kinds weighed as the scene mostly
// mixes them), from the sums iceField made: the ice falls as it ages, so
// its age says how deep in its deck it lies. Stored with its weight (G, how
// much ice; R, G times the age), so that the mipmaps average it where
// there is ice.
vec4 iceAge(vec4 f, vec4 ag) {
  const vec4 W = vec4(1.0, 1.0, 0.5, 1.0);
  float tot = dot(f, W), w = tot / (tot + 0.02);
  return vec4(w * clamp(dot(ag, W) / max(tot, 1e-6), 0.0, 1.0), w, 0.0, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  if (uZ < -3.5) {
    outColor = iceWay(uv);
  } else if (uZ < -2.5) {
    vec4 ag, f = iceField(uv * ICE_KM, 1000u, ag);
    outColor = sqrt(clamp(f / ICE_STORE, 0.0, 1.0));
    outAge = iceAge(f, ag);
    outPhase = vec4(icePh.z > 1e-6 ? 0.5 + 0.5 * icePh.xy / icePh.z : vec2(0.5), 0.0, 1.0);
  } else {
    outColor = ciMap(uv);
  }
}
</script>

<script id="waves" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Draws the map of the waves on the sea once, at start: many plane waves,
// each a whole number of times across the map, so that it repeats.
// R, G: the slope along x and z, in units of its rms (0.125 per unit, flat
// at 0.5). B: the slope squared, over 8: averaged over a footprint, it
// tells how much slope the averaged R and G have lost. A: streaks along
// the wind.
uniform float uSize;
out vec4 outColor;

const float TAU = 6.28318530718;
const float WIND = 0.4636;          // the wind blows towards (2, 1)

// The integer hash of the noise shader (lowbias32).
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for wave i, from one hash, as for a cell
// of the noise.
vec3 rnd(int i) {
  uint h = ihash(uint(i) + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  // Wind waves: 10 to 64 crests across the map, with the same slope in
  // every octave (a sea in equilibrium). They run within some 70 degrees
  // of the wind, short-crested; the long ones keep closer to it.
  const int N = 96;
  vec2 s = vec2(0.0);
  for (int i = 0; i < N; i++) {
    vec3 r = rnd(i), q = rnd(i + 5000);
    float f = (float(i) + r.x) / float(N);
    float a = WIND + mix(1.1, 1.6, f) * (r.y + r.z - 1.0);
    vec2 m = round(10.0 * pow(6.4, f) * vec2(cos(a), sin(a)));
    s += normalize(m) * cos(TAU * (dot(m, uv) + q.x));
  }
  s *= sqrt(2.0 / float(N));
  // Streaks: 6 to 40 across the wind, and about twice as long along it.
  const int M = 40;
  float w = 0.0;
  for (int i = 0; i < M; i++) {
    vec3 r = rnd(i + 9000);
    float k = 6.0 * pow(7.0, r.x);
    float a = WIND + 0.25 * TAU + 0.7 * (r.y + r.z - 1.0);
    w += cos(TAU * (dot(round(k * vec2(cos(a), sin(a))), uv) + fract(61.0 * r.x + r.y))) / sqrt(k);
  }
  outColor = vec4(0.5 + 0.125 * s, dot(s, s) / 8.0, 0.5 + 0.165 * w);
}
</script>

#version 300 es
precision highp float;
precision highp sampler2D;
precision highp sampler3D;

uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform vec3 uSun;      // unit vector towards the sun
uniform float uSunI;    // 1, or 0 when the sun is too far down to matter
uniform vec3 uMoon;     // unit vector towards the moon
uniform float uMoonI;   // moonlight relative to sunlight (0 once the moon is far below the horizon)
uniform mat3 uSky;      // rotation of the stars since noon
uniform vec3 uEcliptic; // the ecliptic's north pole, equatorial (J2000)
// Star catalogue: a grid over the sphere (octahedral map), SLOTS stars per
// cell. Texel: direction (J2000 equatorial), colour index + brightness.
uniform sampler2D uStars;
uniform float uHaze;    // multiplier on the aerosol (Mie) density
uniform float uExposure; // set by the meter (see "meter")
uniform float uLook;    // power of the "look" curve
// The frame's alpha holds the luminance before exposure, for the meter: log2
// of it, from uLogRange.x (0) to uLogRange.y (1).
uniform vec2 uLogRange;
uniform vec3 uBalance;   // white balance (balanceFor)
uniform float uSaturation;  // a camera's saturation (saturationFor)
uniform float uNightEye;    // how far the eye's night vision has come in, from its adaptation: 0 by day to 1 (nightEyeFor)
uniform float uNightGrey;   // how far the night's wider grey has come in, from its adaptation: 0 to 1 (nightGreyFor)
// Twelve wavelengths (405-680 nm), four per vec4.
uniform vec4 uBR[3];    // Rayleigh scattering per km
uniform vec4 uBO[3];    // ozone absorption per km
uniform vec4 uWR[3];    // spectrum -> linear sRGB (solar spectrum folded in)
uniform vec4 uWG[3];
uniform vec4 uWB[3];
uniform vec4 uWS[3];    // spectrum -> what the rods see (WS in the JS)
// Multiple scattering per unit of scattering coefficient: NMU x (12 * NH)
// texels, the three wavelength groups stacked in y; then the same for the
// light of the sky on the low clouds (cloudSky); then the light's mean
// direction, towards the sun's side and up (msLean).
uniform sampler2D uMS;
uniform vec4 uWL[3];    // wavelength / 550 nm
uniform vec4 uMA[3];    // the aerosol by wavelength, relative to 550 nm (ANGSTROM in the JS)
uniform float uNight;   // radiance of the moonless night sky (airglow)
uniform float uAlt;     // altitude of the eye, km
uniform float uCloud;   // cloud amount: 0 (none) to 1 (overcast)
uniform float uWind;    // wind over the sea, m/s
uniform vec3 uLight;    // what lights the clouds and the sea: the sun, or the moon at night
uniform float uLightI;
uniform float uLightShare;   // how far that light has come in, 0 to 1, as the sun hands over to the moon (see celestial)
// The view from the aircraft is a mean over frames: each frame shifts the
// rays within the pixel (uJitter, in pixels) and the samples through the
// clouds (uPass, the number of the frame).
uniform vec2 uJitter;
uniform float uPass;
// How far the aircraft has flown, km: clouds and sea are read at p.xz + uDrift.
// It wraps at the width of the weather map, which every pattern must divide.
uniform vec2 uDrift;
uniform float uCirrus;  // amount of high, thin cloud: 0 (none) to 1
// Cloud noise, repeating. R: Perlin-Worley; G, B, A: Worley at rising frequencies.
uniform sampler3D uNoise;
// Weather map, repeating. R: cloud cover, G: towers, B: gusts on the sea.
uniform sampler2D uWeather;
layout(location = 0) out vec4 outColor;
// The aircraft's frames go on to the shader that joins them into a picture
// (see there), with the distance of what each pixel shows (outAux). They are
// kept in steps of 1 / uSteps.
uniform float uSteps;
layout(location = 1) out vec4 outAux;

const float PI = 3.14159265359;
// The parameters of the air follow Bruneton's demo (2017): see THIRD_PARTY_NOTICES.md.
// Lengths in km.
const float RG = 6360.0;        // ground radius
const float RT = 6460.0;        // top of atmosphere
const float BETA_M = 0.044;     // aerosol scattering per km at sea level, at the default haze (1)
const float MIE_EXT = 1.05;     // extinction / scattering (a single-scattering albedo of 0.95)
const float HR = 8.0;           // Rayleigh scale height
// The haze of the lowest kilometres (the boundary layer): well mixed up to
// BL.x km, falling off over about BL.y km above it (BL in the JS).
const vec2 BL = vec2(1.5, 0.3);
// The aerosol's phase function. In the boundary layer: two Cornette-Shanks
// lobes, a sharp one (MIE_PHASE.x of the light, parameter MIE_PHASE.y) from
// the larger particles and a broad one (MIE_PHASE.z), fitted to Mie theory
// for maritime and continental aerosol (asymmetry 0.715). Above it the
// particles are small (sulphate): one broad lobe, MIE_G_UP (asymmetry
// 0.66). See design.md; the same in the JS.
const vec3 MIE_PHASE = vec3(0.149, 0.932, 0.609);
const float MIE_G_UP = 0.6;
// The aerosol sends the light scattered many times on forwards (msLean):
// MIE_LEAN times the light's mean direction, towards a view that looks where
// it comes from. Its first moment would give 3 times the asymmetry, 2.1;
// 4 matches the reference (see design.md), as the forward peak is sharper.
const float MIE_LEAN = 4.0;
// Aerosol above the haze of the lowest kilometres (mieDensity in the JS):
// a thin layer in the free troposphere and one in the stratosphere.
const vec3 AERO_FREE = vec3(0.048, 6.0, 5.0);    // density (as at sea level), height, half-width in km
const vec3 AERO_STRAT = vec3(0.004, 20.0, 8.0);
const float ISUN = 20.0;
const int NV = 20;              // view samples: the picture is within two steps of 8 bits of 40's
const int NSHADE = 8;           // more samples in twilight: in the planet's shadow...
const int NFAR = 16;            // ...and in the lit air beyond it (see shadowSpan)
const int NMU = 40;             // multiple-scattering table: sun angle
const int NH = 12;              // multiple-scattering table: altitude
const float MS_MU_MIN = -0.35;
const float STAR_GAIN = 20.0;   // the core of a star of magnitude 6.5, of the airglow's radiance (see main)
const float STAR_LN_MAG = 0.6447;   // a star's brightness as drawn, ln per magnitude (0.7 of the real 0.921: a "look")
const float EYE_GAIN = 6.0;     // the Milky Way and the zodiacal cone, of their brightness (see main)
const vec2 ZODI_BAND = vec2(20.0, 2.0);   // the cone's half width as drawn, degrees, at 15 degrees from the sun and far from it (zodiacal)
const float EARTHSHINE = 1e-6;  // the moon's dark side, lit by the earth (of sunlight per steradian)
const float S10 = 6.61e-12;     // radiance of one star of the 10th magnitude per square degree, of the sun's light (V = -26.74)
const float CD = 6650.0;        // cd/m2 of a luminance of 1 here (white paper in the sun outside the air, 133000 lux, is 1 / pi)
const float ROD_HALF = 0.01;    // cd/m2 where the rods count as much as the cones in twilight (see main)
const vec2 MESOPIC = vec2(0.003, 3.0);   // cd/m2: at night the rods alone below, the cones alone above (see main)
const float NIGHT_LOOK = 1.7;   // the look's power for what the rods see (see main)...
const float LOOK_PIVOT = 0.12;  // ...the same as by day at this level
const float DARK_LOOK = 2.0;    // ...and as the eye adapts to a darker night (DARK_EYE), steeper...
const float DARK_PIVOT = 0.07;  // ...about this level
const vec2 DARK_EYE = vec2(15.5, 17.5);   // the exposure (log2) over which the night's curve turns to DARK_LOOK
const vec3 ROD_TINT = vec3(0.911, 1.003, 1.235);   // the rods' grey, a little blue (luminance 1)...
const vec3 ROD_BLUE = vec3(0.666, 1.025, 1.742);   // ...and bluer, for blue light from SKY_BLUE cd/m2 up (see main)
const vec2 SKY_BLUE = vec2(0.001, 0.01);
const float METER_GLINT = 0.15;  // the share of the sun and its glitter in the meter (see main)
const int GRID = 128;
const int SLOTS = 8;
const float LN_FLUX_MAX = 5.9915;   // ln(400)

vec2 raySphere(vec3 o, vec3 d, float r) {
  float b = dot(o, d);
  float c = dot(o, o) - r * r;
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  D = sqrt(D);
  return vec2(-b - D, -b + D);
}

// Densities of (Rayleigh, Mie, ozone) at altitude h. The depth table built
// in makeSky repeats this profile: change both.
float aeroLayer(float h, vec3 l) { float x = (h - l.y) / l.z; return l.x * exp(-x * x); }
float boundaryLayer(float h) { return (1.0 + exp(-BL.x / BL.y)) / (1.0 + exp(min((h - BL.x) / BL.y, 60.0))); }
// w: the boundary layer's share of the aerosol (its phase function).
vec4 densities(float h) {
  h = max(h, 0.0);
  float bl = boundaryLayer(h), m = bl + aeroLayer(h, AERO_FREE) + aeroLayer(h, AERO_STRAT);
  return vec4(exp(-h / HR), m, max(0.0, 1.0 - abs(h - 25.0) / 15.0), bl / max(m, 1e-12));
}
vec3 density(float h) { return densities(h).xyz; }

// The depths of depthToTop hang only on the height of p and the angle of d
// to the vertical. They are read from a table, a sum of 16 steps made once
// in JS: one filtered read instead of a march. Its axes, as
// in Bruneton (2017): the distance to the top between its least and its
// most at that height, and the distance to the horizon. They keep the
// table smooth near the horizon.
uniform sampler2D uDepth;
const int DEPTH_MU = 512, DEPTH_R = 128;
const float H_TOP = 1132.2544;  // distance from the ground to the top, along the horizon: sqrt(RT^2 - RG^2)

// Optical depth (per species) from p to the top of the atmosphere.
vec3 depthToTop(vec3 p, vec3 d) {
  float r = length(p);
  float rho = sqrt(max((r - RG) * (r + RG), 0.0));
  float lo = RT - r, hi = rho + H_TOP;
  vec2 x = vec2(clamp((raySphere(p, d, RT).y - lo) / (hi - lo), 0.0, 1.0), clamp(rho / H_TOP, 0.0, 1.0));
  const vec2 N = vec2(DEPTH_MU, DEPTH_R);
  return textureLod(uDepth, (x * (N - 1.0) + 0.5) / N, 0.0).rgb;
}

// Bilinear lookup of the multiple-scattering table: the groups from `first`.
void msTable(float h, float mus, int first, out vec4 ms[3]) {
  float x = clamp((mus - MS_MU_MIN) / (1.0 - MS_MU_MIN), 0.0, 1.0) * float(NMU - 1);
  float y = sqrt(clamp(h / (RT - RG), 0.0, 1.0)) * float(NH - 1);
  // It is read through the GPU's filter (see the table of depths). The
  // groups lie one above the other: a read within one never reaches the
  // next.
  for (int k = 0; k < 3; k++) {
    ms[k] = textureLod(uMS, (vec2(x, y + float((first + k) * NH)) + 0.5) / vec2(NMU, 12 * NH), 0.0);
  }
}
// The light scattered many times that reaches a point of the air.
void multiScatter(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 0, ms); }
// The light of the sky on the low clouds there (see buildMultiScatter).
void cloudSky(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 3, ms); }
// Where that light comes from: its mean over the sphere times the
// direction it comes from, towards the sun's side (lh) and up (lv).
void msLean(float h, float mus, out vec4 lh[3], out vec4 lv[3]) { msTable(h, mus, 6, lh); msTable(h, mus, 9, lv); }

// hash13 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash3(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// The catalogue cell that holds direction c.
ivec2 starCell(vec3 c) {
  vec3 p = c / (abs(c.x) + abs(c.y) + abs(c.z));
  vec2 uv = p.z >= 0.0 ? p.xy
    : (1.0 - abs(p.yx)) * vec2(p.x >= 0.0 ? 1.0 : -1.0, p.y >= 0.0 ? 1.0 : -1.0);
  return ivec2(clamp(floor((uv * 0.5 + 0.5) * float(GRID)), 0.0, float(GRID - 1)));
}

// The band of the Milky Way, relative to the airglow: a noise pattern, not
// the real clouds, but on the real galactic plane and brighter at its centre.
float milkyWay(vec3 c) {
  const vec3 POLE = vec3(-0.8676, -0.1981, 0.4560);      // north galactic pole
  const vec3 CENTRE = vec3(-0.0550, -0.8734, -0.4839);   // galactic centre
  float b = dot(c, POLE);
  float near = 0.5 + 0.5 * dot(c, CENTRE);
  float clouds = 0.5 * noise3(c * 5.0) + 0.3 * noise3(c * 11.0) + 0.2 * noise3(c * 23.0);
  return (0.8 + 3.0 * near * near) * exp(-b * b / (0.02 + 0.03 * near)) * (0.25 + 1.5 * clouds * clouds);
}

// The zodiacal light: sunlight scattered by the dust between the planets,
// in S10 (stars of the 10th magnitude per square degree), from x, the cosine
// of the angle from the sun, and y, the sine of the ecliptic latitude. A fit
// to the table of Leinert et al. (1998, "The 1997 reference of diffuse night
// sky brightness", A&AS 127, 1, Table 16: from the Earth, at 500 nm), within
// 4.5 % rms and 13 % at most of its 182 values and the pole's 60: a cone that
// falls off as the power -2.46 of the angle from the sun, flattened towards
// the ecliptic as seen around the sun (x of the result), over a floor and
// the gegenschein (some 13 degrees across) on a wider glow at the point
// opposite the sun (y). And for the cone as it is drawn (see main), a
// look: z, its brightness along the ecliptic at this
// angle from the sun, and w, its shape across: a band of half width
// ZODI_BAND (to 1/e), 20 degrees at 15 degrees from the sun, narrowing
// fastest near the sun towards 2 (15 at 24 degrees, 9 at 50, 4 at 80),
// with a skirt twice as wide. The fit widens with the
// angle from the sun (it is flattened by the same ratio at every angle):
// drawn as it is, the cone spread into a fan and read as a soft glow on
// the horizon, where the eye sees a cone, widest and brightest at its
// base, whose sides close in all the way to its tip (Trouvelot's drawing
// of 1876; reports from dark sites).
vec4 zodiacal(float x, float y) {
  float e = max(acos(clamp(x, -1.0, 1.0)), 0.035);  // from the sun, radians (at least 2 degrees)
  float s = min(abs(y) * inversesqrt(max(1.0 - x * x * step(0.0, x), 1e-6)), 1.0);   // 0 on the ecliptic, 1 square to it
  float across = 0.252 + 0.748 * exp(-pow(s / 0.419, 1.34));
  float cone = 345.0 * pow(e, -2.46);
  float b = degrees(asin(min(abs(y), 1.0))) / (ZODI_BAND.y + (ZODI_BAND.x - ZODI_BAND.y) * exp(-max(degrees(e) - 15.0, 0.0) / 30.0));
  return vec4(cone * across,
              78.6 * across + 19.3 * exp(-(1.0 + x) / 0.01) + 62.3 * exp(-(1.0 + x) / 0.511),
              cone, 0.85 * exp(-b * b) + 0.15 * exp(-0.25 * b * b));
}

float cornetteShanks(float g, float mu) {
  return 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}
// The air's, the boundary layer's and the higher aerosol's.
vec3 phases(float mu) {
  return vec3(3.0 / (16.0 * PI) * (1.0 + mu * mu),
              mix(cornetteShanks(MIE_PHASE.z, mu), cornetteShanks(MIE_PHASE.y, mu), MIE_PHASE.x),
              cornetteShanks(MIE_G_UP, mu));
}

// Light from one source (sun or moon) scattered towards the eye at p:
// scattered once (times `direct`: less in the shadow of a cloud), plus what
// was already scattered (the table).
void addLight(vec3 p, float r, float h, vec3 od, vec4 dens, float scM, float extM,
              vec3 dir, float gain, float direct, vec3 phase, vec3 view, in vec4 Tv[3], inout vec4 L[3]) {
  vec4 ms[3], lh[3], lv[3];
  float mus = dot(p, dir) / r;
  multiScatter(h, mus, ms);
  msLean(h, mus, lh, lv);
  // The aerosol scatters that light forwards: more of it towards a view
  // that looks where it comes from (MIE_LEAN). Only the forward part: the
  // first moment taken from the view away from it as well left that sky
  // 0.65 of the reference's.
  vec3 up = p / r, side = dir - mus * up;
  float sl = length(side);
  float cv = dot(view, up), ch = sl > 1e-5 ? dot(view, side) / sl : 0.0;
  bool lit = raySphere(p, dir, RG).y < 0.0;          // not behind the planet
  vec3 odl = lit ? od + depthToTop(p, dir) : vec3(0.0);
  for (int k = 0; k < 3; k++) {
    vec4 sc = uBR[k] * dens.x, sm = scM * uMA[k];
    vec4 a = Tv[k] * ((sc + sm) * ms[k] + sm * MIE_LEAN * max(ch * lh[k] + cv * lv[k], 0.0));
    if (lit) {
      a += direct * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z)) * (sc * phase.x + sm * mix(phase.z, phase.y, dens.w));
    }
    L[k] += gain * a;
  }
}

// The planet's shadow along the view ray o + t d (t from 0 to tmax), for
// light from s: the shadow of a sphere in parallel light is a cylinder of
// radius RG behind it. True, with the span [sa, sb], when the ray passes
// through it; else sa and sb are left as they were. In twilight the march spends samples of their own on the span
// and on the lit air beyond: the light scattered once there rises steeply
// from the shadow's edge, and 20 samples spread over the whole ray left
// layers of colour that came and went with the angle.
bool shadowSpan(vec3 o, vec3 d, float tmax, vec3 s, inout float sa, inout float sb) {
  float ds = dot(d, s), os = dot(o, s);
  vec3 a = d - ds * s, b = o - os * s;
  float A = dot(a, a), B = dot(a, b), C = dot(b, b) - RG * RG;
  float D = B * B - A * C;
  if (A < 1e-12 || D <= 0.0) return false;
  D = sqrt(D);
  float t0 = (-B - D) / A, t1 = (-B + D) / A;
  if (os + ds * 0.5 * (t0 + t1) >= 0.0) return false;   // the half towards the light: not a shadow
  t0 = max(t0, 0.0);
  t1 = min(t1, tmax);
  if (t1 <= t0) return false;
  sa = t0;
  sb = t1;
  return true;
}

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// After Jimenez (2014), "Next Generation Post Processing in Call of Duty: Advanced Warfare".
// Interleaved gradient noise: spreads the start of a march evenly over
// neighbouring pixels.
float ign(vec2 p) {
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

// The view from the aircraft: clouds below and a sea under them.

// raySphere for a ray from the eye (o, at height uAlt) and the sphere at
// height h, without its rounding. raySphere takes dot(o, o) - r * r, and at
// 6372 km a float steps by 4 km²; from an eye at the sphere's own height
// (the slider stops on the thin cloud's 12.2, 12.5 and 12.8 km) the
// crossing next to the eye then came out a hair ahead or behind it, as
// each ray's angle rounded. From the base of the thin cloud, rings of rays
// (and a disc under the eye, where dot(o, d) passes a power of two) saw
// through the whole sheet down to the sea, as lit bands. Here c comes from
// the heights, and the near crossing from the far one (their product is c).
vec2 eyeSphere(vec3 o, vec3 d, float h) {
  float b = dot(o, d);
  float c = (uAlt - h) * (2.0 * RG + uAlt + h);
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  float q = b < 0.0 ? sqrt(D) - b : -b - sqrt(D);   // the crossing farther from the eye
  if (q == 0.0) return vec2(0.0);
  return b < 0.0 ? vec2(c / q, q) : vec2(q, c / q);
}

// ---------- Clouds ----------
// A shell from CB to CT holds them. A field says where they are: positive
// inside a cloud, rising by about 1 per km of depth under its surface. It
// is a sum: a weather map (where clouds stand, and how wide), less what a
// height costs (flat bases, domed tops, thicker where wider), plus noise on
// smaller and smaller scales (billows on billows). A sum keeps the small
// sizes at the edge of a cloud: its outline is ragged, not a smooth blob.
const float CB = 0.6;               // cloud base, km
const float CT = 5.0;               // the highest tops, km
const float WEATHER_KM = 256.0;     // size of the weather map
const float BASE_KM = 8.0;          // size of one tile of the noise
const float TEXEL_KM = BASE_KM / 128.0;
const float DETAIL = 7.0;           // tiles of the fine noise per tile (whole numbers: see uDrift)
const float SIGMA = 90.0;           // extinction inside a dense cloud, per km
const float LUMPS = 1.3;            // how far the noise of the tile moves the surface, in units of the field
const float RELIEF = 1.0;           // the same for the fine noise
const float EDGE = 0.04;            // depth under the surface at which a cloud is dense
const int CLOUD_STEPS = 160;
const float PENUMBRA = 0.06;        // how far light strays sideways in a cloud, km: shadows on it are soft

// The field at p without the fine noise. lod: how much to smooth, as a mip
// level of the noise (negative: finer than its texels; the fine noise still
// gains from that). Also gives the height in the shell (y, 0 to 1), the
// place in the noise (q.xyz), how rough the cloud is there (q.w), how
// thick it is from base to top (body, 1 for a deck) and the billows there
// (lump: positive on one, negative between them).
float cloudShape(vec3 p, float lod, out float y, out vec4 q, out float body, out float lump) {
  float h = length(p) - RG;
  y = (h - CB) / (CT - CB);
  q = vec4(0.0);
  body = 0.0;
  lump = 0.0;
  if (y <= 0.0 || y >= 1.0) return -9.0;
  vec2 x = p.xz + uDrift;
  vec4 w = textureLod(uWeather, x / WEATHER_KM, lod - 2.0);
  // The cloud amount sets the level of the map above which clouds stand.
  // Towers grow where the map says so, unless the clouds are few.
  float tower = w.g * smoothstep(0.1, 0.5, uCloud);
  float e = 3.0 * (w.r - 0.936 + uCloud * (1.181 - uCloud * (2.197 - 2.102 * uCloud))) + 1.5 * tower;
  // A dome over a flat base, with steep sides: a height costs its cube.
  // Wider clouds are thicker, up to a point; a deck swells where the map
  // is high.
  float top = 0.28 + 0.4 * sqrt(tower);
  float thick = 1.0 - exp(-e / 1.6);
  float cube = top * top * top;
  float swell = 0.022 * max(e - 1.0, 0.0) / cube;
  float f = 1.6 * (thick - y * y * y / cube) + 1.2 * swell - 4.0 * max(y - 0.85, 0.0);
  // The cube costs nothing near the base: there the thin edge of a cloud,
  // where the map is barely over its level, would reach out sideways as a
  // wide, flat sheet. Round off the lowest 180 m, so that a base ends under
  // the side of its cloud.
  float rim = max(1.0 - y / 0.04, 0.0);
  f -= 0.2 * rim * rim;
  // A thicker cloud has bigger lumps, and a tower bigger still.
  float lumps = LUMPS * mix(0.8, 2.0, clamp(thick, 0.0, 1.0)) * (1.0 + 0.6 * swell) * (1.0 + sqrt(tower));
  if (f < -0.6 * lumps) return f;                    // no noise could make a cloud here
  // The noise repeats every few km. Read it at a depth that drifts from
  // place to place, so that no two tiles show the same clouds.
  vec4 far = textureLod(uWeather, x / WEATHER_KM + 0.37, 5.5);
  q.xyz = vec3(x.x, h, x.y) / BASE_KM + vec3(far.b, 2.5 * far.r, far.g);
  vec4 n = textureLod(uNoise, q.xyz, max(lod, 0.0));
  // Hard, growing turrets stand beside older, smoother cloud.
  q.w = mix(0.45, 1.3, smoothstep(0.35, 0.65, n.g));
  // Billows of 2 km down to 125 m, rounded into domes (see cloudDetail;
  // the numbers are the means of the noise). lump: how far this place
  // stands out of them.
  n.gba *= 2.0 - n.gba;
  lump = 0.5 * (n.r - 0.571) + 0.5 * (n.g - 0.712) + 0.5 * (n.b - 0.715) + 0.4 * (n.a - 0.715);
  float billows = lumps * lump;
  // How high the top stands over this place, as the field has it here.
  body = pow(max(thick + (billows + 1.2 * swell) / 1.6, 0.0), 1.0 / 3.0) * top / 0.28;
  // A flat base, a few tens of metres higher or lower from place to place
  // (30 to 80 m over CB), that gets dense over 20 m: soft, and clear of the
  // shell's own cut at CB even where the fine noise swells.
  return min(f + billows, 2.0 * (h - CB - 0.03 - 0.05 * n.r));
}

// The fine noise at q (a place in the noise of the tile) on a cloud of
// roughness rough, in units of the field: billows of 300 m down to 4 m,
// read a mip level sharper than the pixel (the mean over the frames
// averages what that leaves).
float cloudDetail(vec3 q, float lod, float rough) {
  // Worley noise rises in cones to its points; v (2 - v) rounds them into
  // domes with creases between them, as the billows of a cloud.
  vec4 d = textureLod(uNoise, q * DETAIL, lod + 1.7);
  d.gba *= 2.0 - d.gba;
  float bumps = 0.3 * d.r + 0.25 * d.g + 0.25 * d.b + 0.2 * d.a;
  if (lod < -1.0) {                                  // close by: finer still
    vec4 c = textureLod(uNoise, q * (5.0 * DETAIL), lod + 4.1);
    c.gba *= 2.0 - c.gba;
    bumps += 0.3 * (1.0 - smoothstep(-2.0, -1.0, lod)) * (0.5 * c.g + 0.3 * c.b + 0.2 * c.a - 0.714);
  }
  return RELIEF * rough * (bumps - 0.67);
}

// The field at p; fine: with the fine noise, which also comes out by
// itself (bump: positive on a billow, negative in a crease). lump: see
// cloudShape. A thin cloud is rougher: its edge frays.
float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float lump) {
  vec4 q;
  float f = cloudShape(p, lod, y, q, body, lump);
  bump = 0.0;
  if (fine && q.w > 0.0 && f > -0.35 * RELIEF) bump = cloudDetail(q.xyz, lod, q.w * mix(1.5, 1.0, smoothstep(0.1, 0.6, body)));
  return f + bump;
}

float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body) {
  float lump;
  return cloudField(p, lod, fine, y, bump, body, lump);
}

// Extinction (per km) for a value of the field at height y, in a cloud of
// that body: dense a little way in (a cloud has a surface), with more water
// higher up and in thicker clouds. A smoothed field (lod) has a wider edge.
float cloudExtinction(float f, float lod, float y, float body) {
  return SIGMA * clamp(f / max(EDGE, 1.5 * TEXEL_KM * exp2(lod)), 0.0, 1.0)
       * mix(0.45, 1.0, clamp(4.0 * y, 0.0, 1.0)) * mix(0.2, 1.0, clamp(5.0 * body - 0.5, 0.0, 1.0));
}

// Extinction (per km) at p. fine: with the fine noise.
float cloudDensity(vec3 p, float lod, bool fine) {
  float y, bump, body;
  float f = cloudField(p, lod, fine, y, bump, body);
  return f > 0.0 ? cloudExtinction(f, lod, y, body) : 0.0;
}

// Optical depth of the clouds from p towards the light, over the next
// 26 steps' worth of distance; the steps grow. The first two see the fine
// noise, and their depth comes apart (crisp): bumps shade the creases
// beside them. The later ones are moved aside by off: light strays inside
// a cloud, and over the frames the shadows of other clouds soften. Also
// gives the slope of the field towards the light (per km), mostly over four
// first steps, from its values at p without and with the fine noise (fc,
// ff).
float lightDepth(vec3 p, vec3 dir, float ds, float lod, float fc, float ff, vec3 off, out float crisp, out float slope) {
  float tau = 0.0, s = 0.0;
  crisp = 0.0;
  slope = 0.0;
  for (int i = 0; i < 6; i++) {
    float y, bump, body, l = i < 2 ? lod : max(lod, 0.0) + 0.5 * float(i), sm = s + 0.5 * ds;
    float fl = cloudField(p + dir * sm + (i < 3 ? vec3(0.0) : off), l, i < 2, y, bump, body);
    float dt = fl > 0.0 ? cloudExtinction(fl, l, y, body) * ds : 0.0;
    if (i < 2) crisp += dt; else tau += dt;
    if (i == 1) slope += 0.3 * (fl - ff) / sm;
    if (i == 2) slope += 0.7 * (fl - fc) / sm;
    s += ds;
    ds *= 1.6;
  }
  return tau;
}

// ---------- The clouds' shadow ----------
// One map says, for everything outside the clouds, how deep in their shadow
// a point is: the optical depth of the clouds towards the light. It lies on
// a plane across the light, through the eye; each texel is a line of light,
// marched once through the shell of the clouds. The same shader draws it,
// with SHADOW_MAP defined, before a frame that needs it (see makeSky). After the
// opacity shadow maps of Kim and Neumann (2001), with the depths kept at
// heights instead of along the light.
// The plane is warped so that its texels are fine near the eye and grow far
// off, with no edge: x / (SHADOW_K + |x|) per axis, so SHADOW_K km away a
// texel is four times as wide as at the eye, and the far edge is infinitely
// far. A sun low in the sky lays its long shadows along few texels.
// Along each line the depth is kept at the four heights SHADOW_H: all of it
// below the base, less higher up; it is 0 at the tops. A point in between
// takes the depth at its height, linearly.
// Stored as tau / (tau + SHADOW_ENC): 8 bits keep both thin shadows and deep
// ones apart.
// The map is drawn again only when the aircraft has flown some way: it is
// read where a point was when it was drawn, uShadowShift (km) away.
uniform sampler2D uShadow;
uniform vec2 uShadowShift;
const float SHADOW_K = 40.0;
const vec4 SHADOW_H = vec4(CB, 1.3, 2.3, 3.5);
const float SHADOW_ENC = 4.0;
// The map's axes across the light, set by main.
vec3 shX, shY;
void shadowAxes() {
  shX = normalize(cross(uLight, abs(uLight.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
  shY = cross(uLight, shX);
}

// The optical depth of the clouds from p towards the light.
float cloudShadow(vec3 p) {
  if (uCloud <= 0.0) return 0.0;
  vec3 x = p + vec3(uShadowShift.x, -RG - uAlt, uShadowShift.y);
  vec2 v = vec2(dot(x, shX), dot(x, shY));
  vec4 u = textureLod(uShadow, 0.5 + 0.5 * v / (SHADOW_K + abs(v)), 0.0);
  vec4 tau = SHADOW_ENC * u / max(1.0 - u, 1e-4);
  float h = length(p) - RG;
  if (h <= SHADOW_H.x) return tau.x;
  if (h < SHADOW_H.y) return mix(tau.x, tau.y, (h - SHADOW_H.x) / (SHADOW_H.y - SHADOW_H.x));
  if (h < SHADOW_H.z) return mix(tau.y, tau.z, (h - SHADOW_H.y) / (SHADOW_H.z - SHADOW_H.y));
  if (h < SHADOW_H.w) return mix(tau.z, tau.w, (h - SHADOW_H.z) / (SHADOW_H.w - SHADOW_H.z));
  return tau.w * max(1.0 - (h - SHADOW_H.w) / (CT - SHADOW_H.w), 0.0);
}

// The same on the sea, with soft edges. The sun is a disc, and the light
// that comes through the thin edge of a cloud is spread around it by the
// droplets' forward scattering; so a cloud's shadow fades over a width that
// grows with the way from the cloud down to the sea: SHADOW_PEN radians,
// from clouds about SHADOW_OCC km high (a radius of some 60 m under a high
// sun, 400 m under a low one; along the light it is longer on the sea, by
// 1 / sin of the light's height). Read once, the map's contour was the
// edge of the glitter: so bright that it shows white down to a hundredth
// of the light, the glitter was cut along that contour, hard, and with a
// low sun into blocks (a texel is drawn out along the light on the sea).
// The light is averaged across the light instead, SHADOW_TAPS reads at new
// places each frame (jitter), spaced evenly out from the middle (denser
// there: a uniform disc left round blots), and only then made a depth.
const float SHADOW_PEN = 0.035, SHADOW_OCC = 1.5;
const int SHADOW_TAPS = 8;
float seaShadow(vec3 p, float jitter) {
  if (uCloud <= 0.0) return 0.0;
  float r = min(SHADOW_PEN * SHADOW_OCC / max(uLight.y, 0.05), 0.75);
  float lit = 0.0;
  for (int i = 0; i < SHADOW_TAPS; i++) {
    float a = 6.2832 * jitter + 2.39996 * float(i);   // the golden angle
    float ri = r * (float(i) + jitter) / float(SHADOW_TAPS);
    lit += exp(-cloudShadow(p + ri * (cos(a) * shX + sin(a) * shY)));
  }
  return -log(max(lit / float(SHADOW_TAPS), 1e-6));
}

// One texel of the map: the line of light through it, from where it rises
// through the base (or its lowest point, if that is higher) to the tops.
// The steps are about SHADOW_DS km long, as many as the light's height
// asks for, between 24 and 96: a low sun's lines climb the shell over tens
