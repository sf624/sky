// of km, and with fewer steps they missed most clouds. Half a step, or the
// texel, sets how much the field is smoothed. A line that climbs the shell
// under a sun on the horizon is some 240 km long: its shadows are as long,
// and as smooth along the light.
const float SHADOW_DS = 0.2;
vec4 shadowTexel(vec2 w) {
  vec2 v = SHADOW_K * w / (1.0 - abs(w));
  vec3 q = vec3(0.0, RG + uAlt, 0.0) + v.x * shX + v.y * shY;
  float top = raySphere(q, uLight, RG + CT).y;
  vec4 s;                                            // where the line rises through each height
  for (int k = 0; k < 4; k++) {
    vec2 c = raySphere(q, uLight, RG + SHADOW_H[k]);
    s[k] = c.y > c.x ? c.y : -dot(q, uLight);
  }
  if (top <= s.x) return vec4(0.0);
  vec2 texel = (SHADOW_K + abs(v)) * (SHADOW_K + abs(v)) / SHADOW_K * 2.0 / uRes;
  int steps = int(clamp((CT - CB) / max(uLight.y, 0.01) / SHADOW_DS, 24.0, 96.0));
  float ds = (top - s.x) / float(steps);
  float lod = max(log2(0.5 * max(0.5 * ds, max(texel.x, texel.y)) / TEXEL_KM), 0.0);
  // The depth from the start to each height (below), and in all (sum).
  float sum = 0.0;
  vec4 below = vec4(0.0);
  for (int i = 0; i < steps; i++) {
    float a = s.x + float(i) * ds;
    float den = cloudDensity(q + uLight * (a + 0.5 * ds), lod, false);
    below += den * clamp(s - a, 0.0, ds);
    sum += den * ds;
  }
  vec4 tau = sum - below;
  return tau / (tau + SHADOW_ENC);
}

float hg(float mu, float g) {
  return (1.0 - g * g) / (4.0 * PI * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}

// The clouds along the ray from ta to tb: what gets through them (Tc), the
// light they send to the eye per unit of sunlight (sOne: scattered once;
// sMany: many times) and of skylight (sAmb), and the distance it comes from
// (tBar; negative without clouds).
void clouds(vec3 o, vec3 d, float ta, float tb, float jitter,
            out float Tc, out float sOne, out float sMany, out float sAmb, out float tBar) {
  const float DS_MIN = 0.02, DS_REL = 0.0045, COARSE = 3.0, FINE = 0.35;
  Tc = 1.0; sOne = 0.0; sMany = 0.0; sAmb = 0.0; tBar = -1.0;
  float pix = 2.0 * uTan / uRes.y;
  // The steps grow with the distance. On a long path they grow faster, to
  // end within the budget; the nearest stay fine.
  const float BUDGET = COARSE * 80.0;
  // The steps also set how a cloud looks, so the plan must not jump where
  // the end of the ray does. A ray that meets the sea ends early: plan it
  // as if the sea were a mirror and the ray went on up to the tops. A ray
  // that just meets the sea is then planned like one that just misses it,
  // and a cloud in front of the horizon looks the same above and below it.
  float plan = tb;
  vec2 sea = raySphere(o, d, RG);
  if (sea.x > 0.0 && sea.x < 1e8) {
    vec3 pg = o + d * sea.x;
    plan = min(sea.x + raySphere(pg, reflect(d, normalize(pg)), RG + CT).y, 600.0);
  }
  float knee = DS_MIN / DS_REL;
  float near = max(min(plan, knee) - ta, 0.0) / DS_MIN;
  float rel = DS_REL * max(1.0, log(max(plan, knee) / max(ta, knee)) / DS_REL / max(BUDGET - near, 0.3 * BUDGET));
  // Light scattered once keeps the forward peak of the droplets; light
  // scattered many times goes deeper and forgets its direction. These five
  // terms stand for the orders of scattering; a thick cloud top that faces
  // the light comes out with an albedo near 0.7.
  float mu = dot(d, uLight);
  float p0 = 0.8 * hg(mu, 0.8) + 0.2 * hg(mu, -0.25);
  float p1 = 0.6 * hg(mu, 0.4), p2 = 1.4 * hg(mu, 0.1), p3 = 1.6 / (4.0 * PI), p4 = 0.3 / (4.0 * PI);
  float ds = max(DS_MIN, rel * ta);
  float t = ta + jitter * COARSE * ds, wsum = 0.0, tsum = 0.0;
  // The field tells how far the next surface is, roughly: stride through
  // clear air, and slow down to a pixel's worth near a cloud, so that its
  // edge comes out crisp. came: the step that led here.
  float fPrev = 1.0, came = COARSE * ds;
  int walk = 0;
  // The light of the last sample; deeper in the same cloud the next ones
  // share it.
  float one = 0.0, many = 0.0, amb = 0.0;
  bool lit = false;
  for (int i = 0; i < CLOUD_STEPS; i++) {
    if (t >= tb || Tc < 0.01) break;
    ds = max(DS_MIN, rel * t);
    float lod = log2(max(0.8 * pix * t, 0.2 * ds) / TEXEL_KM);
    vec3 p = o + d * t;
    float y, bump, body;
    float lump;
    float f = cloudField(p, lod, true, y, bump, body, lump);
    if (f > 0.0 && came > 1.5 * ds) {
      // Strode into a cloud: go back and walk, though not to before the
      // start (with the eye in a cloud, that would put the cloud behind
      // it, and the sky would show through).
      t = max(t - (came - ds), ta);
      came = ds;
      walk = 3;
      continue;
    }
    float next;
    if (f > 0.0) {
      next = clamp(0.5 * f, FINE * ds, ds);
      float den = cloudExtinction(f, lod, y, body);
      float a = 1.0 - exp(-den * next);
      if (Tc > 0.25 || !lit) {
        lit = true;
        // Light the cloud where the ray met its surface, not where the
        // step happened to land beneath it.
        vec3 ps = fPrev < 0.0 ? p - d * (came * f / (f - fPrev)) : p;
        float fs = fPrev < 0.0 ? 0.0 : f;
        // Which way the surface faces: the field falls towards the light
        // on a side turned to it. A thick cloud is a matt surface: the
        // light it sends back goes with the cosine. The steps towards the
        // light shrink with the distance below 8 km (to 15 m), and so does
        // the reach towards the sky (to 50 m): a near cloud shows its small
        // billows lit and shaded as a far one shows its big ones.
        float crisp, slope;
        vec3 side = normalize(cross(uLight, abs(uLight.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        float ang = 2.0 * PI * hash(gl_FragCoord.xy + 7.13 * uPass);
        vec3 off = PENUMBRA * sqrt(hash(gl_FragCoord.xy + 3.71 * uPass + 19.1)) * (cos(ang) * side + sin(ang) * cross(uLight, side));
        float tau = lightDepth(ps, uLight, max(clamp(0.00625 * t, 0.015, 0.05), 0.6 * ds), lod, fs - bump, fs, off, crisp, slope);
        float facing = clamp((0.3 - slope / sqrt(slope * slope + 2.0)) / 1.3, 0.0, 1.0);
        // The sky lights what faces up, the higher the better, and the
        // creases less.
        float yu, bu, cu;
        float reach = max(clamp(0.0125 * t, 0.05, 0.1), 2.0 * exp2(lod) * TEXEL_KM);
        float rise = (cloudField(ps + normalize(ps) * reach, lod, true, yu, bu, cu) - fs) / reach;
        float open = (0.6 - 0.4 * rise / sqrt(rise * rise + 2.0))
                   * mix(0.6, 1.0, clamp((length(p) - RG - CB) / 1.5, 0.0, 1.0)) * clamp(0.9 + bump, 0.6, 1.1);
        // Light scattered a few times casts the crisp shadows of the
        // bumps; light scattered many times goes round them, and the last
        // term comes through the whole cloud or from its neighbours. A
        // thin cloud lets most of the light through: only a thick one is
        // brilliant. The tops of the billows catch more of it than the
        // creases between them, and far off, where the billows of the fine
        // noise are smaller than a pixel, those of the tile do so.
        float soft = tau + 0.4 * crisp;
        tau += crisp;
        float white = 1.12 * body / (body + 0.12);
        float billow = clamp(1.0 + 2.0 * smoothstep(5.0, 30.0, t) * lump, 0.6, 1.3);
        // A side turned from the light still sees the sunlit cloud around
        // it: white light, of the sun and of the sky, as that cloud sends.
        float bounce = uLightShare * (1.0 - facing) * clamp(dot(ps, uLight) / length(ps), 0.0, 1.0);
        one = p0 * exp(-tau);
        many = billow * white * (0.66 * mix(0.15, 1.0, facing) * clamp(1.0 + 6.0 * bump, 0.5, 1.1)
                                 * (p1 * exp(-0.4 * tau) + p2 * exp(-0.15 * soft) + p3 * exp(-0.05 * soft))
                                 + p4 * exp(-0.012 * soft) + 0.02 * bounce);
        amb = billow * (open * mix(1.0, white, 0.5) + 0.15 * bounce);
      }
      sOne += Tc * a * one;
      sMany += Tc * a * many;
      sAmb += Tc * a * amb;
      wsum += Tc * a;
      tsum += Tc * a * t;
      Tc *= 1.0 - a;
    } else {
      lit = false;
      next = clamp(-0.35 * f, FINE * ds, COARSE * ds);
      if (walk > 0) {
        next = min(next, ds);
        walk--;
      }
    }
    fPrev = f;
    came = next;
    t += next;
  }
  if (Tc < 0.01) Tc = 0.0;
  if (wsum > 0.0) tBar = tsum / wsum;
}

// ---------- Sea ----------
// Light scattered back out of clear ocean water, per unit of light going
// in (as a matt surface would), for the twelve wavelengths: blue, and hardly
// any red.
const vec4 SEA[3] = vec4[3](
  vec4(0.026, 0.028, 0.026, 0.019), vec4(0.012, 0.0070, 0.0038, 0.0017), vec4(0.0006, 0.0004, 0.0003, 0.0002));

// The sky as the sea sees it, towards dir: a short march, enough for a
// reflection.
void skyAt(vec3 p0, vec3 dir, float betaM, float extM, out vec4 S[3]) {
  const int NS = 8;
  S[0] = vec4(0.0); S[1] = vec4(0.0); S[2] = vec4(0.0);
  float tmax = raySphere(p0, dir, RT).y;
  vec3 phaseSun = phases(dot(dir, uSun));
  vec3 phaseMoon = phases(dot(dir, uMoon));
  vec3 od = vec3(0.0);
  vec4 Tv[3];
  float prev = 0.0;
  for (int i = 0; i < NS; i++) {
    float f = (float(i) + 1.0) / float(NS);
    float t1 = tmax * f * f;
    float dt = t1 - prev;
    vec3 p = p0 + dir * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec4 dens = densities(h) * vec4(dt, dt, dt, 1.0);
    od += 0.5 * dens.xyz;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) {
      Tv[k] = exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    }
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI, 1.0, phaseSun, dir, Tv, S);
    if (uMoonI > 0.0) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI, 1.0, phaseMoon, dir, Tv, S);
    od += 0.5 * dens.xyz;
  }
}

// How much of a rough sea hides behind its own waves, seen from a direction
// with cosine c to the vertical (Smith's term for Gaussian slopes, in the
// rational form of Walter et al., 2007).
float waveShade(float c, float s2) {
  float a = c / sqrt(s2 * max(1.0 - c * c, 1e-6));
  return a < 1.6 ? (1.0 - 1.259 * a + 0.396 * a * a) / (3.535 * a + 2.181 * a * a) : 0.0;
}

// Map of the waves, repeating (drawn at start). R, G: the slope of a wind
// sea along x and z, in units of its rms; B: the slope squared; A: streaks.
uniform sampler2D uWaves;
const vec2 WIND = vec2(0.8944, 0.4472);              // the wind blows this way (x, z)
// Swell from far storms: plane waves with a whole number of crests (x, z)
// in WEATHER_KM, and the amplitude of their slope along x and z. Two
// trains: six waves of 200 to 340 m, and two of 120 to 170 m from elsewhere.
const int SWELLS = 8;
const vec4 SWELL[SWELLS] = vec4[SWELLS](
  vec4(-1246.0, 182.0, -0.0109, 0.0016), vec4(-1043.0, 324.0, -0.0114, 0.0035),
  vec4(-1061.0, 74.0, -0.0152, 0.0011), vec4(-978.0, -23.0, -0.0111, -0.0003),
  vec4(-827.0, 187.0, -0.0112, 0.0025), vec4(-794.0, 212.0, -0.0118, 0.0031),
  vec4(-775.0, -1975.0, -0.0036, -0.0091), vec4(-468.0, -1475.0, -0.0031, -0.0098));

// The glitter at night as the eye sees it: separate sparkles, not their
// mean. The sea is cut into facets of FACET km, each with its own slope
// drawn from the slopes the glitter leaves to the ripples (variance s2r);
// a facet sparkles where its slope is within FACET_TOL (of that variance)
// of the one that mirrors the light to the eye (zh), as a spot of SPOT
// facets at a place of its own in the facet. Divided by the mean of that
// over all facets, so that the glitter keeps its light. The spot is read
// over the pixel's footprint (fa, fc; as the foam's breakers), so that it
// shows as a point however far. Where the footprint is wider than a facet,
// the facets are taken four at a time, level by level, as one that
// sparkles four times as often; where it holds more than a few sparkles,
// they are counted (sparkleCount). The facets stay put on the sea: a still
// holds still; in flight zh moves and they twinkle.
const float FACET = 0.0005;
const float FACET_TOL = 0.02;
const float SPOT = 0.1;
float sparkleAt(float size, float tol, vec2 x, vec2 zh, float s2r, vec2 fa, vec2 fc, int one) {
  float tau2 = tol * s2r;
  float mean = tau2 / (s2r + tau2) * exp(-dot(zh, zh) / (s2r + tau2));
  float n = round(WEATHER_KM / size);                // facets to the map's side (a power of 2 times 1000)
  vec2 g = x / size, g0 = floor(g);
  vec2 ha = 0.5 * fa / size, hc = 0.5 * fc / size;
  vec3 cov = vec3(ha.x * ha.x + hc.x * hc.x, ha.x * ha.y + hc.x * hc.y, ha.y * ha.y + hc.y * hc.y) + vec3(SPOT * SPOT, 0.0, SPOT * SPOT);
  float det = cov.x * cov.z - cov.y * cov.y;
  float sum = 0.0;
  for (int j = -1; j <= one; j++) {
    for (int i = -1; i <= one; i++) {
      vec2 c = mod(g0 + vec2(i, j), n);
      vec2 lo = mod(c, 1000.0), hi = floor(c / 1000.0);
      vec3 h = vec3(lo, hi.x * 512.0 + hi.y + size * 7919.0);
      float u1 = hash3(h + 0.37), u2 = hash3(h + 0.71);
      vec2 sf = sqrt(-s2r * log(max(u1, 1e-7))) * vec2(cos(2.0 * PI * u2), sin(2.0 * PI * u2));
      float w = exp(-dot(zh - sf, zh - sf) / tau2);
      if (w > 1e-3) {
        vec2 e = g0 + vec2(i, j) + vec2(hash3(h + 0.13), hash3(h + 0.53)) - g;
        sum += w * exp(-0.5 * (cov.z * e.x * e.x - 2.0 * cov.y * e.x * e.y + cov.x * e.y * e.y) / det) / (2.0 * PI * sqrt(det));
      }
    }
  }
  return sum / max(mean, 1e-6);
}
// Many sparkles to a pixel: their count. A cell of the sea of the given
// size holds lam of them on average (p of its facets); its light over the
// mean is drawn as a lognormal of variance GRAIN / lam, from a hash of the
// cell, and read as value noise (bilinear between cells) at GRAIN_N points
// along the footprint. The mean stays 1 at every size; the grain gets finer
// and fainter as the count grows with distance, and holds still on the sea.
const float GRAIN = 4.0;
const int GRAIN_N = 6;
float sparkleCell(vec2 c, float n, float size) {
  c = mod(c, n);
  vec2 lo = mod(c, 1000.0), hi = floor(c / 1000.0);
  vec3 h = vec3(lo, hi.x * 512.0 + hi.y + size * 7919.0);
  return sqrt(-2.0 * log(max(hash3(h + 0.29), 1e-7))) * cos(2.0 * PI * hash3(h + 0.83));
}
float sparkleCount(float size, float p, vec2 x, vec2 fa, int one) {
  float lam = p * (size / FACET) * (size / FACET);
  float v = min(log(1.0 + GRAIN / max(lam, 1e-6)), 2.5), s = sqrt(v);
  float n = round(WEATHER_KM / size);
  float sum = 0.0;
  for (int i = 0; i < GRAIN_N * one; i++) {
    vec2 g = (x + fa * ((float(i) + 0.5) / float(GRAIN_N) - 0.5)) / size - 0.5;
    vec2 g0 = floor(g), f = g - g0;
    vec4 e = exp(s * vec4(sparkleCell(g0, n, size), sparkleCell(g0 + vec2(1.0, 0.0), n, size),
                          sparkleCell(g0 + vec2(0.0, 1.0), n, size), sparkleCell(g0 + 1.0, n, size)) - 0.5 * v);
    sum += mix(mix(e.x, e.y, f.x), mix(e.z, e.w, f.x), f.y);
  }
  return sum / float(GRAIN_N);
}
float sparkle(vec2 x, vec2 zh, float s2r, vec2 fa, vec2 fc) {
  // p: the share of facets that sparkle here. Where the footprint holds
  // few sparkles (counted at the middle of the path, zh = 0), they are
  // drawn one by one; from 1 to 8 they hand over to their count.
  float tau2 = FACET_TOL * s2r;
  float p = tau2 / (s2r + tau2) * exp(-dot(zh, zh) / (s2r + tau2));
  float across = length(fc), along = length(fa);
  float count = smoothstep(0.0, 3.0, log2(along * across / (FACET * FACET) * FACET_TOL / (1.0 + FACET_TOL)));
  float s = 0.0, c = 0.0;
  // The loops below run to a bound the compiler cannot know (one is 1):
  // unrolled, they made the whole shader heavier for the GPU even by day,
  // when no sparkle is drawn (4.5 ms of 17 at 2560 x 1440, November 2026).
  int one = int(step(0.0, uNightEye));
  if (count < 1.0) {
    float level = max(log2(along / FACET), 0.0);
    float k = floor(level), f = level - k;
    float tol = FACET_TOL * exp2(2.0 * k);
    float many = smoothstep(2.0, 32.0, FACET_TOL * exp2(2.0 * level));   // so many facets: their mean
    s = many >= 1.0 ? 1.0 : mix(mix(sparkleAt(FACET * exp2(k), tol, x, zh, s2r, fa, fc, one),
                                    sparkleAt(FACET * exp2(k + 1.0), 4.0 * tol, x, zh, s2r, fa, fc, one), f), 1.0, many);
  }
  if (count > 0.0) {
    // Cells about as wide as the footprint, or a GRAIN_N-th of its length.
    float level = max(log2(max(across, along / float(GRAIN_N)) / FACET), 0.0);
    float k = floor(level), f = level - k;
    float a = sparkleCount(FACET * exp2(k), p, x, fa, one) - 1.0, b = sparkleCount(FACET * exp2(k + 1.0), p, x, fa, one) - 1.0;
    c = max(1.0 + ((1.0 - f) * a + f * b) / sqrt((1.0 - f) * (1.0 - f) + f * f), 0.0);
  }
  return mix(s, c, count);
}

// The sea at pg, at distance t along d, behind air of depth od and under
// clouds of depth tau towards the light: the glitter of the sun on the
// waves, the mirrored sky, and the blue light from below.
// The slopes of the waves have the variance of Cox and Munk (1954). The
// waves long enough for the picture to show tilt the surface: swell, and
// three bands of the wind sea from the map. What a pixel's footprint
// averages away stays in the variance, so that the light of the glitter
// is the same from near and far.
// G: the glitter alone (for the meter).
void addSea(vec3 pg, vec3 d, float t, vec3 od, float betaM, float extM, float vis, float tau, inout vec4 L[3], out vec4 G[3]) {
  vec3 n = normalize(pg);
  vec3 ps = pg + n * 0.001;
  float cv = max(dot(n, -d), 0.0);
  float pix = 2.0 * uTan / uRes.y;
  // Axes on the sea along the map's x and z, and the footprint of the pixel
  // on them: fa along the view (long when seen aslant), fc across.
  vec3 ex = normalize(vec3(1.0, 0.0, 0.0) - n * n.x), ez = cross(ex, n);
  vec2 x = pg.xz + uDrift;
  vec2 dh = vec2(dot(d, ex), dot(d, ez));
  float dl = length(dh);
  vec2 ua = dl > 1e-4 ? dh / dl : vec2(1.0, 0.0);
  float across = pix * t, along = across / max(cv, 0.02);
  vec2 fa = along * ua, fc = across * vec2(-ua.y, ua.x);

  // The wind varies: gusts and calms over kilometres (the weather map),
  // more so in light airs, and streaks within them.
  float gust = textureLod(uWeather, x / WEATHER_KM, log2(max(along / (WEATHER_KM / 1024.0), 1.0))).b;
  float streak = textureGrad(uWaves, x * (40.0 / WEATHER_KM), fa * (40.0 / WEATHER_KM), fc * (40.0 / WEATHER_KM)).a;
  float wind = uWind * exp(mix(1.2, 0.4, smoothstep(2.0, 9.0, uWind)) * (2.0 * gust - 1.0) + 0.3 * (streak - 0.5));
  float s2 = 0.003 + 0.00512 * wind;

  // Wind waves. The longest are as long as a grown sea has them
  // (0.9 U^2 metres), ten to a tile of the map; each band reaches down to a
  // sixth of that, and holds the same variance (0.0075, from the constant
  // of Phillips), up to a fifth of the whole. slope: the tilt of the
  // footprint; hidden: the variance within it.
  float share = min(0.0075 / s2, 0.2) * s2;
  float rep = max(round(WEATHER_KM / (0.0096 * uWind * uWind)), 1.0) / WEATHER_KM;
  vec2 slope = vec2(0.0);
  float hidden = 0.0, crest = 0.0;
  // A footprint as wide as the waves averages them all (R, G 0.5, B 0.125).
  // The read still has some of the longest in it at 0.12 of the map: it
  // fades into that mean over the factor of three before, so that no edge
  // shows where the read stops. The fade is of R, G and B, and h is taken
  // after it: what slope loses, hidden gains.
  for (int i = 0; i < 3; i++) {
    float far = smoothstep(-1.585, 0.0, log2(along * rep / 0.12));
    vec4 w = vec4(0.5, 0.5, 0.125, 0.0);
    if (far < 1.0) w = mix(textureGrad(uWaves, x * rep + 0.37 * float(i), fa * rep, fc * rep), w, far);
    vec2 s = 8.0 * w.rg - 4.0;
    float h = max(8.0 * w.b - dot(s, s), 0.0);
    slope += s;
    hidden += h;
    if (i > 0) crest += dot(s, WIND);                // the short waves, down the wind
    rep *= 6.0;
  }
  slope *= sqrt(share);
  hidden *= share;
  float micro = s2 - 3.0 * share;
  // Swell, smoothed over the footprint. Currents bend its crests: the map
  // of the streaks, read wide, shifts it by up to some 200 m.
  vec2 xs = (x + (textureLod(uWaves, x * (5.0 / WEATHER_KM), 2.0).a - 0.5) * vec2(0.24, 0.32)) / WEATHER_KM;
  for (int i = 0; i < SWELLS; i++) {
    vec2 k = SWELL[i].xy * (2.0 * PI / WEATHER_KM);
    float keep = exp(-0.125 * (dot(k, fa) * dot(k, fa) + dot(k, fc) * dot(k, fc)));
    float var = 0.5 * dot(SWELL[i].zw, SWELL[i].zw);
    slope += SWELL[i].zw * (keep * cos(2.0 * PI * fract(dot(SWELL[i].xy, xs))));
    hidden += var * (1.0 - keep * keep);
    micro -= var;
  }
  // What is left for the ripples no picture shows.
  float s2r = max(micro, 0.1 * s2) + hidden;

  // Whitecaps cover 2.95e-6 U^3.52 of the sea (Monahan and O'Muircheartaigh,
  // 1980); two fifths of that is thick, white foam. It lies in separate
  // breakers: a cell of a grid (0.3 of the longest wave) holds one at
  // most, somewhere, of some size (many small, a few large), longer along
  // the crest; more of them in the streaks of the wind. From close, count
  // what the footprint covers of the breakers around (seen sharp, a
  // breaker has an edge, ragged with the short waves); from far, take the
  // mean.
  float white = 0.4 * 2.95e-6 * pow(wind, 3.52);
  float cells = max(round(WEATHER_KM / (2.7e-4 * uWind * uWind)), 1.0);
  float cell = WEATHER_KM / cells;
  float foam = white;
  if (white > 1e-5 && along < 1.5 * cell) {
    const float SB = 0.07;                           // size of a breaker, in cells
    float chance = white / (2.0 * PI * SB * SB * 1.2) * exp(3.5 * (streak - 0.5) - 0.245);
    vec2 g = x / cell, g0 = floor(g);
    // The footprint as a Gaussian (covariance aa, ac, cc), in cells.
    vec2 ha = 0.5 * fa / cell, hc = 0.5 * fc / cell;
    vec3 cov = vec3(ha.x * ha.x + hc.x * hc.x, ha.x * ha.y + hc.x * hc.y, ha.y * ha.y + hc.y * hc.y);
    // A breaker of unit size: 1.5 SB along the crest, SB / 1.5 down the wind.
    vec3 one = SB * SB * (2.25 * vec3(WIND.y * WIND.y, -WIND.x * WIND.y, WIND.x * WIND.x)
                        + 0.444 * vec3(WIND.x * WIND.x, WIND.x * WIND.y, WIND.y * WIND.y));
    float sum = 0.0;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec2 id = g0 + vec2(i, j);
        float r = hash(floor(mod(id, cells) + 0.5) + 0.37);       // under the chance: a breaker; also its size and place
        if (r < chance) {
          float size = fract(1731.7 * r);
          size = 0.5 * exp(1.6 * size * size);
          vec2 e = id + fract(vec2(4217.3, 9127.1) * r) - g;
          vec3 v = cov + size * size * one;
          float det = v.x * v.z - v.y * v.y;
          float sharp = size * size * SB * SB / sqrt(det);
          float b = sharp * exp(-0.5 * (v.z * e.x * e.x - 2.0 * v.y * e.x * e.y + v.x * e.y * e.y) / det);
          float edge = mix(0.3, 0.06, smoothstep(0.3, 0.9, sharp));
          sum += mix(b, smoothstep(0.37 - edge, 0.37 + edge, b * exp(0.7 * crest)), smoothstep(0.3, 0.7, sharp));
        }
      }
    }
    foam = mix(min(max(chance, 1.0) * sum, 1.0), white, smoothstep(0.6, 1.5, along / cell));
  }
  foam *= 0.5;                                       // the albedo of thick foam

  vec4 T[3], lit[3];
  G[0] = vec4(0.0); G[1] = vec4(0.0); G[2] = vec4(0.0);
  for (int k = 0; k < 3; k++) {
    T[k] = vis * exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    lit[k] = vec4(0.0);
  }
  // A cloud blocks the direct light, but lets diffuse light through.
  float soft = 1.0 / (1.0 + 0.1 * tau);
  float c = dot(n, uLight);
  if (uLightI > 0.0 && c > 0.0) {
    vec3 ol = depthToTop(ps, uLight);
    // Glitter: the share of the waves tilted so as to mirror the light to
    // the eye. That takes the slope zh; the ripples spread around the tilt
    // of the footprint.
    vec3 hv = normalize(uLight - d);
    float ch = max(dot(hv, n), 1e-3);
    vec2 zh = -vec2(dot(hv, ex), dot(hv, ez)) / ch - slope;
    float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(hv, -d), 0.0, 1.0), 5.0);
    float glint = F * exp(-dot(zh, zh) / s2r)
                / (4.0 * PI * s2r * max(cv, 1e-3) * ch * ch * ch * ch)
                / (1.0 + waveShade(max(cv, 1e-3), s2) + waveShade(c, s2));
    if (uNightEye > 0.0) glint *= mix(1.0, sparkle(x, zh, s2r, fa, fc), uNightEye);
    float direct = exp(-tau);
    for (int k = 0; k < 3; k++) {
      lit[k] = uLightI * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      G[k] = T[k] * lit[k] * direct * glint;
      L[k] += G[k] + T[k] * lit[k] * soft * c / PI * (SEA[k] + foam);
    }
  }
  // The sky, mirrored by the tilted footprint. Rough water mirrors less at
  // grazing angles than flat water (the mean Fresnel factor of Bruneton et
  // al., 2010, from the spread of the slopes along the view: half the
  // variance), and mirrors a higher part of the sky.
  vec3 nr = normalize(n - slope.x * ex - slope.y * ez);
  float sigma = sqrt(0.5 * s2r);
  float Fm = 0.02 + 0.98 * pow(1.0 - max(dot(nr, -d), 0.0), 5.0 * exp(-2.69 * sigma)) / (1.0 + 22.7 * pow(sigma, 1.5));
  vec3 up = reflect(d, nr);
  up += max(0.02 - dot(up, n), 0.0) * n;             // never into the sea
  up = normalize(up + 0.3 * n);
  vec4 S[3], msS[3], msM[3];
  skyAt(ps, up, betaM, extM, S);
  multiScatter(0.0, dot(n, uSun), msS);
  multiScatter(0.0, dot(n, uMoon), msM);
  // Clouds in the mirror hide that sky (three samples up the layer tell how
  // much is left) and show their sides and bases: grey with skylight, and
  // whiter where the sun reaches around the sea.
  float seen = 1.0;
  if (uCloud > 0.0) {
    float veil = 0.0;
    for (int i = 0; i < 3; i++) {
      vec2 h = (CT - CB) * (i == 0 ? vec2(0.07, 0.14) : i == 1 ? vec2(0.23, 0.18) : vec2(0.47, 0.3));
      veil += cloudDensity(ps + up * ((CB + h.x) / dot(up, n)), 3.0, false) * h.y / dot(up, n);
    }
    seen = exp(-veil);
  }
  // Under a cloud less light comes down to the water, of any kind.
  for (int k = 0; k < 3; k++) {
    vec4 sky = uSunI * msS[k] + uMoonI * msM[k];
    L[k] += T[k] * (Fm * mix(0.75 * sky + 0.035 * soft * c * lit[k], S[k], seen) + soft * 1.6 * (SEA[k] + foam) * sky);
  }
}

// ---------- High, thin cloud ----------
// A sheet of cirrus along the ray (as far as tmax): what it lets through
// (Th), the light it sends to the eye (H, like C of the clouds in main) and
// the distance it comes from (tHigh; negative without any).
// It fills a shell from CI_LO to CI_HI, drawn on CI_LAYERS thin layers
// through it: two decks of cirrus, each reading the ice in a frame of its
// own.
const float CI_LO = 12.2, CI_HI = 12.8;    // km
const float CI_TAU = 4.0;                  // the vertical optical depth of the ice, per unit of it
const float CI_VEIL = 0.4;                 // and of the veil, its mean
const float CI_BAND = 0.35;                // and of the body of a band of tufts, its median
const int CI_LAYERS = 2;
// The decks as volumes (km): the lower from 12.2 to 12.6, the upper from
// 12.35 to 12.8. Each holds its ice by age (ciHeight).
const vec2 CI_DECK[2] = vec2[2](vec2(12.2, 12.6), vec2(12.35, 12.8));
// Near the eye the shell is marched (see highCloud): where the ray enters
// it within CI_NEAR.x km fully, fading out by CI_NEAR.y, over CI_NEAR.z km
// of the ray, in CI_STEPS steps.
const vec3 CI_NEAR = vec3(2.0, 3.5, 3.0);
const int CI_STEPS = 12;
// The sets of hairs in a deck near the eye, at fixed heights (see highCloud).
const int CI_SHEETS = 4;
// The ice is never read over less than this (km): its streaks are soft at
// some tens of metres (cirrus seen from an aircraft close by has no hairs),
// and a finer read magnified the texels of the ice into rows of beads.
const float CI_MINF = 0.02;
const float CI_ROLL = 1.8;                 // the light scattered forward rolls off towards it
// The share of the ice's extinction that is diffraction by its crystals
// (some 100 um): light turned by less than a degree, which goes on as if
// not scattered. What lies behind the cirrus (the sky, the sea, the
// clouds) shows through by that share as well, softened; a point (the
// sun, the moon, a star) is spread into the glow round it instead.
const float CI_FWD = 0.4;
// The ice (uIce, built at start by the ice shader): a tile of ICE_KM
// (40.5 km) of four fields of ice, R: heads with tails, G: sheets and
// streets, B: flocks, A: large systems. Each deck reads it in a frame of
// its own (ciTile), and mixes the fields by the cirrus's map.
uniform sampler2D uIce;
const float ICE_KM = 40.477;   // the tile's side, as in the ice shader
// The way the ice's fibres run, a quarter as wide (built with the ice, see
// iceWay in the ice shader): the gradient of the ice at twice its angle.
uniform sampler2D uIceWay;
// The cirrus's map (built with the ice, see ciMap in the ice shader), over
// the map: R and G, how much cirrus the upper and the lower deck have; B,
// the share of sheets and streets; A, the share of flocks against large
// systems.
uniform sampler2D uCiMap;

// Loops of the cirrus run to bounds the compiler cannot know (uCirrus is
// never negative), so that it keeps them as loops: unrolled, the hairs'
// and the bends' code was copied many times over, and the driver took
// longer to finish the scene's program, on every page.
#define CI_N(n) ((n) + int(min(uCirrus, 0.0)))

// An integer hash: Wellons' lowbias32, as in the noise shader.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Gradient noise in 2D (within about -0.7 to 0.7), repeating every `per`
// cells (whole numbers); the lattice wraps by hand (see the GLSL rules).
float ciNoise(vec2 q, vec2 per, uint seed) {
  vec2 i = floor(q), f = q - i, u = f * f * (3.0 - 2.0 * f);
  vec2 i0 = i - per * floor((i + 0.5) / per), i1 = i0 + 1.0;
  i1 -= per * floor((i1 + 0.5) / per);
  float n[4];
  for (int k = 0; k < 4; k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uvec2 l = uvec2(mix(i0, i1, c) + 0.5);
    uint h = ihash(l.x * 0x9e3779b9u + ihash(l.y + seed));
    vec2 g = vec2(float(h & 65535u), float(h >> 16u)) / 32767.5 - 1.0;
    n[k] = dot(g, f - c);
  }
  return mix(mix(n[0], n[1], u.x), mix(n[2], n[3], u.x), u.y);
}

// The same noise (x) with its gradient over q (yz).
vec3 ciNoiseD(vec2 q, vec2 per, uint seed) {
  vec2 i = floor(q), f = q - i, u = f * f * (3.0 - 2.0 * f), du = 6.0 * f * (1.0 - f);
  vec2 i0 = i - per * floor((i + 0.5) / per), i1 = i0 + 1.0;
  i1 -= per * floor((i1 + 0.5) / per);
  float n[4];
  vec2 g[4];
  for (int k = 0; k < 4; k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uvec2 l = uvec2(mix(i0, i1, c) + 0.5);
    uint h = ihash(l.x * 0x9e3779b9u + ihash(l.y + seed));
    g[k] = vec2(float(h & 65535u), float(h >> 16u)) / 32767.5 - 1.0;
    n[k] = dot(g[k], f - c);
  }
  float a = mix(n[0], n[1], u.x), b = mix(n[2], n[3], u.x);
  vec2 ga = mix(g[0], g[1], u.x) + vec2((n[1] - n[0]) * du.x, 0.0);
  vec2 gb = mix(g[2], g[3], u.x) + vec2((n[3] - n[2]) * du.x, 0.0);
  return vec3(mix(a, b, u.y), mix(ga, gb, u.y) + vec2(0.0, (b - a) * du.y));
}

// Bands along x at q bend: the shift across (y) of the place at q, at
// three sizes (`per` cells to a unit and more), and the slope of the bands
// there. With amp 1, the bands turn by some 0.3 rad either way.
vec2 ciBend(vec2 q, float per, float amp, uint seed) {
  // Whole numbers of cells, so that the bends repeat with q.
  vec3 b = vec3(0.0);
  for (int i = 0; i < CI_N(3); i++) {
    float pi = floor((i == 0 ? 1.0 : i == 1 ? 2.7 : 6.7) * per + 0.5);
    b += (i == 0 ? 0.18 : i == 1 ? 0.045 : 0.012) / per * ciNoiseD(q * pi, vec2(pi), seed + uint(i)) * vec3(1.0, pi, pi);
  }
  b *= amp;
  return vec2(b.x, -b.y / max(1.0 + b.z, 0.2));
}

// The density of the body of ice at the last place ciDensity was asked
// about: the ice seen over a wider footprint, as the light inside the
// sheet feels it.
float ciBody = 0.0;
// And the share of that depth in a milky veil (cirrostratus), which draws
// the halo.
float ciVeil = 0.0;
// And its depth over some 2.5 km and over some 10 km, for the glow next to
// the sun and the moon.
float ciMean = 0.0, ciWide = 0.0;

// The ice's tile for deck k at uv on the map: the upper deck (1) along
// (3, 1) and across (-1, 3), two tiles to a unit of 81 km; the lower (0)
// along (1, 1) and across (-1, 1), four tiles to a unit of 181 km, so that
// its forms are a little larger and run 27 degrees from the upper's. Both
// step by whole numbers, so that they repeat with the map. J: the tile's
// coordinates over km on the map. Each deck's tile is shifted so that the
// place where the page starts (and every view without `at`) has some of
// its cirrus overhead: from near the shell a view sees only a few km of
// it, and there the tile had a gap.
const vec2 CI_START[2] = vec2[2](vec2(0.528, 0.851), vec2(0.431, 0.129));
vec2 ciTile(vec2 uv, int k, out mat2 J) {
  vec2 tc;
  if (k == 0) {
    tc = 4.0 * vec2(uv.x + uv.y, uv.y - uv.x);
    J = mat2(1.0, -1.0, 1.0, 1.0) * (4.0 / WEATHER_KM);
  } else {
    tc = 2.0 * vec2(3.0 * uv.x + uv.y, 3.0 * uv.y - uv.x);
    J = mat2(3.0, -1.0, 1.0, 3.0) * (2.0 / WEATHER_KM);
  }
  tc += CI_START[k];
  return tc - floor(tc);
}

// Deck k's tile at x on the map (km): its coordinates there (ciTile), and
// J, them over km on the map. The last place asked about is kept: the
// hairs, the ice and its age are often read at the same place.
vec3 ciPlaceKey = vec3(1e9);
vec2 ciPlaceTc = vec2(0.0);
mat2 ciPlaceJ = mat2(0.0);
vec2 ciPlace(vec2 x, int k, out mat2 J) {
  vec3 key = vec3(x, float(k));
  if (key != ciPlaceKey) {
    ciPlaceTc = ciTile(x / WEATHER_KM, k, ciPlaceJ);
    ciPlaceKey = key;
  }
  J = ciPlaceJ;
  return ciPlaceTc;
}

// The veil's thickness at tc (tile units of deck k's frame, where x runs
// with the wind), seen over a footprint of gl: noise at eight sizes, as
// the exponent of the depth, so that the depth spreads as cloud depths do
// (log-normal: some 0.2 to 5 times its median). Bands along the wind from
// 13 by 3.4 km down to 250 by 13 m, the smaller ones longer for their
// width (fibres), and waves across the wind of some 2 km; the amplitude
// falls by 0.8 an octave, as the spectrum of cloud does (-5/3), so that
// seen from near the shell the veil still has thick and thin patches. An
// octave fades out before its bands get narrower than a few footprints.
const int CI_VEIL_N = 9;
const vec3 CI_VEIL_OCT[CI_VEIL_N] = vec3[CI_VEIL_N](vec3(1.0, 6.0, 0.9), vec3(3.0, 12.0, 0.7), vec3(20.0, 5.0, 0.25),
  vec3(6.0, 30.0, 0.35), vec3(12.0, 80.0, 0.3), vec3(24.0, 200.0, 0.3), vec3(40.0, 500.0, 0.25), vec3(80.0, 1200.0, 0.2), vec3(160.0, 3000.0, 0.15));
float ciVeilNoise(vec2 tc, float gl, uint seed) {
  float n = 0.0;
  // The bands bend and wave (by some 0.4 rad over 20, 7.5 and 3 km), so
  // that they do not run straight to a vanishing point.
  tc.y += ciBend(tc, 2.0, 2.0, seed + 50u).x;
  for (int o = 0; o < CI_VEIL_N; o++) {
    vec3 oc = CI_VEIL_OCT[o];
    float vis = smoothstep(2.0, 4.0, 1.0 / (oc.y * gl));
    if (vis <= 0.0) break;
    n += oc.z * vis * ciNoise(tc * oc.xy, oc.xy, seed + uint(o));
  }
  return n;
}

// ---- The hairs ----
// Cirrus is made of fine filaments: streaks of falling ice that run along
// the trails and curve with them, so that neighbouring hairs bend
// together, fan out from a head and sweep on in a tail, braid and part.
// The ice's 10 m texels hold its strands only softly, and magnified from
// near the shell they stood as rows of beads; so the scene draws the hairs
// itself, at the place it reads, along the strands the ice was built with:
// the ice program stores their phase (uIcePhase: a phasor whose angle is
// the place across the strands, one turn to a strand, see icePhase), and
// the hairs are thin stripes of that angle and of three times it
// (finer hairs within each strand). Read from the texture, the angle runs
// on smoothly as the strands turn; drawn on fixed ways (round 12) the
// hairs stood as straight needles. Where strands of different trails
// cross, their phasors cancel and the hairs fade. The stripes' spacing
// and way come from the angle's change over a texel (or a footprint).
// A hair is a Gaussian across, blurred over the footprint across it in
// closed form (its width grows and its peak falls, the area kept), so that
// it never aliases: it fades into its mean instead.
uniform sampler2D uIcePhase;
// The light between the hairs, against their mean.
const float CI_HAIR_BASE = 0.12;

// The angle of the phasor b against a's (radians).
float ciTurn(vec2 a, vec2 b) {
  return atan(a.x * b.y - a.y * b.x, dot(a, b));
}

// The hairs of deck k at tc (its flow, tile units; J: tc over km on the
// map; see ciPlace), seen over the footprint h1, h2 (km on the map, a
// pixel's: the hairs are drawn at the place read, with no blur through the
// deck); sheet: which set of hairs (the march near the eye reads one at
// each of the fixed heights of a deck, so that a ray through the deck
// crosses several, each crisp). Around 1: the light between the hairs
// some 0.3 to 0.8 of the mean, a hair's core 2 to 4 times it, for each
// octave, the octaves multiplied.
float ciHair(vec2 tc, mat2 J, int k, vec2 h1, vec2 h2, uint sheet) {
  vec2 g1 = J * h1, g2 = J * h2;
  // The phase is read over two texels at least: within a texel it wavers
  // where trails of several ages meet, and its multiples drew worms.
  float tx = 1.0 / float(textureSize(uIcePhase, 0).x);
  vec2 r1 = g1 * max(1.0, 2.0 * tx / max(length(g1), 1e-9)), r2 = g2 * max(1.0, 2.0 * tx / max(length(g2), 1e-9));
  vec2 P = textureGrad(uIcePhase, tc, r1, r2).rg * 2.0 - 1.0;
  float coh = length(P);
  if (coh < 0.35) return 1.0;
  // The angle's gradient (radians per tile unit), from its change over a
  // texel, or over the footprint if that is wider.
  float dl = max(2.0 * tx, max(length(g1), length(g2)));
  vec2 Px = textureGrad(uIcePhase, tc + vec2(dl, 0.0), r1, r2).rg * 2.0 - 1.0;
  vec2 Py = textureGrad(uIcePhase, tc + vec2(0.0, dl), r1, r2).rg * 2.0 - 1.0;
  vec2 gp = vec2(ciTurn(P, Px), ciTurn(P, Py)) / dl;
  float gl = length(gp);
  if (gl < 1e-3) return 1.0;
  // The strands' spacing (km) and the footprint across them (km); seen
  // aslant a pixel covers many hairs along its length too: half of its
  // length counts.
  vec2 e = gp / gl;
  float sp = 2.0 * PI / gl * ICE_KM;
  float fa = ICE_KM * max(max(length(vec2(dot(g1, e), dot(g2, e))), 0.5 * max(length(g1), length(g2))), 1e-9);
  if (fa > 0.7 * sp) return 1.0;
  // Seen from close by (a pixel under some 8 to 15 m, a texel of the
  // phase) half of the hairs fade and the rest are wide (20 m, below),
  // down to some 0.3 m a pixel: read between the phase's texels, thin
  // hairs bent from texel to texel and stood as ladders and broken dashes
  // (round 13, from 9 km looking up); wide and faint, they are the soft
  // streaks that photographs taken next to cirrus show, at several depths.
  float nr = fa / (ICE_KM * tx), near = 0.5 * smoothstep(0.03, 0.15, nr) + 0.5 * smoothstep(0.8, 1.5, nr);
  if (near <= 0.0) return 1.0;
  // Hairs that run across the ice's own way there (uIceWay, smoothed over
  // some 0.1 km and more; where the way is clear) fade: where the strands of two trails meet, the
  // denser takes over within a texel, and its hairs, bent sharply there,
  // stood as zigzags; where thin tails curl, as a net.
  float lw = log2(max(max(length(g1), length(g2)) * float(textureSize(uIceWay, 0).x), 1.0));
  vec2 wv = textureLod(uIceWay, tc, max(lw + 0.5, 0.5)).rg * 2.0 - 1.0;
  float wc = length(wv), agree = dot(vec2(e.x * e.x - e.y * e.y, 2.0 * e.x * e.y), wv) / max(wc, 1e-3);
  float align = mix(1.0, smoothstep(0.5, 0.9, agree), smoothstep(0.05, 0.25, wc));
  if (align <= 0.0) return 1.0;
  float ph = atan(P.y, P.x) + 2.4 * float(sheet);
  uint seed = (k == 0 ? 3000u : 4000u) + 131u * sheet;
  // Bundles some 0.6 km wide and 3 km long (along the wind) where a set of
  // hairs shows, gaps where it does not; and the hairs' width, which
  // changes over a few km.
  vec2 pb = floor(ICE_KM / vec2(3.0, 0.6) + 0.5), pw = floor(ICE_KM / vec2(4.0, 2.0) + 0.5), pq = floor(ICE_KM / vec2(0.6, 0.12) + 0.5);
  float wid = 0.07 + 0.2 * smoothstep(-0.4, 0.4, ciNoise(tc * pw, pw, seed + 979u));
  float F = 1.0;
  for (int o = 0; o < CI_N(2); o++) {
    float m = o == 0 ? 1.0 : 3.0, s = sp / m;
    float vis = 1.0 - smoothstep(0.25 * s, 0.7 * s, fa);
    if (vis <= 0.0) break;
    float bun = clamp(0.5 + 1.8 * ciNoise(tc * pb * (o == 0 ? 1.0 : 2.0), pb * (o == 0 ? 1.0 : 2.0), seed + 977u + uint(o)), 0.0, 1.0);
    // The nearest hair of this octave (km), its width and its peak, blurred.
    float q = m * ph / (2.0 * PI);
    float dy = (q - floor(q + 0.5)) * s;
    // Neighbouring hairs differ in strength (0.15 to 1, some 0.575 on
    // average; noise of some 0.6 km along the wind and 0.12 km across):
    // drawn alike, the hairs of a strand stood evenly spaced, as the teeth
    // of a comb, and seen from some 3 km, as the bars of a ladder.
    float hs = clamp(0.575 + 1.3 * ciNoise(tc * pq, pq, seed + 981u + uint(o)), 0.15, 1.0);
    // At least 8 m each side (20 m seen from close by, above): cirrus is
    // soft streaks, not wires. Hairs that wide for their spacing are left out.
    float hw = max(s * wid * (o == 0 ? 0.7 : 1.0), mix(0.02, 0.008, smoothstep(0.8, 1.5, nr))), hwE = sqrt(hw * hw + 0.25 * fa * fa);
    vis *= 1.0 - smoothstep(0.2 * s, 0.35 * s, hw);
    float h = bun * hs * (hw / hwE) * exp(-dy * dy / (hwE * hwE)), mean = bun * 0.575 * 1.7725 * hw / s;
    F *= mix(1.0, (CI_HAIR_BASE + h) / (CI_HAIR_BASE + mean), vis * near * align * smoothstep(0.35, 0.75, coh) * (o == 0 ? 0.7 : 0.75));
  }
  return F;
}

// How much veil (cirrostratus) the slider c and the map m make: from c =
// 0.35 it grows to CI_VEIL of vertical depth at its median.
float veilOn0(float c, float m) {
  return CI_VEIL * pow(smoothstep(0.35, 1.0, c), 1.6) * m;
}

// The cirrus at x on the map (km), on deck k (0: the lower, 1: the upper),
// seen over a footprint with the axes f1 and f2 (km on the map). In units
// of the vertical optical depth of the whole shell: the deck's share of
// it. Without `fibres`, as the light of the sun feels it over a wide
// footprint, where the veil's noise averages out: the code that reads it
// is left out. hairIn: the hairs there (ciHair, read by the caller, 1 for
// none). `lite`: the depth alone, for the steps of the march near the eye
// and the second read of a long crossing; ciBody, ciVeil, ciMean and
// ciWide are not set. Each call is a copy of this code for the compiler,
// and the page's first picture waits for it.
// Where the tufts gather (see ciDensity): in bands (x) and, with little
// cirrus, in fields (y), at uv on the map, for deck k.
vec2 ciFields(vec2 uv, int k) {
  vec2 cfr = vec2(dot(uv, vec2(3.0, 1.0)), dot(uv, vec2(-1.0, 3.0))) + (k == 0 ? vec2(0.31, 0.57) : vec2(0.0));
  // The bands bend (by some 0.4 rad over 27, 10 and 4 km).
  cfr.y += ciBend(cfr, 3.0, 2.0, k == 0 ? 831u : 832u).x;
  float n5 = ciNoise(uv * 5.0, vec2(5.0), k == 0 ? 811u : 812u);
  float bandN = ciNoise(cfr * vec2(2.0, 12.0), vec2(2.0, 12.0), k == 0 ? 821u : 822u) + 0.5 * ciNoise(cfr * vec2(3.0, 23.0), vec2(3.0, 23.0), 823u) + 0.6 * n5;
  float widen = 0.6 * min(uCirrus, 0.4) + 0.35 * clamp(uCirrus - 0.4, 0.0, 0.35);
  return vec2(smoothstep(0.25 - widen, 0.55 - widen, bandN),
              smoothstep(-0.25, 0.25, n5 + 0.5 * ciNoise(uv * 11.0, vec2(11.0), 813u)));
}
vec2 ciFieldsOut = vec2(0.0);

float ciDensity(vec2 x, int k, vec2 f1, vec2 f2, bool fibres, bool lite, vec2 fieldsIn, float hairIn) {
  ciBody = 0.0;
  ciVeil = 0.0;
  ciMean = 0.0;
  ciWide = 0.0;
  vec2 uv = x / WEATHER_KM;
  float lod = log2(max(max(length(f1), length(f2)), 1.0));
  // The map: how much cirrus this deck has here, and of what kinds. The
  // lower deck reads another place of it and needs more, so that the decks
  // come and go apart. Over some 16 km it tells where there is none, and
  // most of the sky costs little.
  vec2 muv = k == 0 ? uv + vec2(0.383, 0.617) : uv;
  float thr = 0.72 - 0.85 * uCirrus + (k == 0 ? 0.12 : 0.0);
  vec4 cf = textureLod(uCiMap, muv, max(lod, 4.0));
  float near = smoothstep(thr - 0.5, thr - 0.38, k == 0 ? cf.g : cf.r);
  if (near <= 0.0) return 0.0;
  vec4 cm = textureLod(uCiMap, muv, lod);
  float m = smoothstep(thr - 0.3, thr + 0.15, k == 0 ? cm.g : cm.r) * near;
  // The kinds: tails everywhere, fewer where sheets are many; sheets
  // and streets, which come in from 0.2 to 0.75 (so that little cirrus
  // is a few tails, more is streets and sheets); flocks or large systems.
  float sr = smoothstep(0.35, 0.75, cm.b), sf = smoothstep(0.45, 0.8, cm.a);
  // The tufts gather in bands along the wind, some 40 km long and a few
  // km wide, with clear lanes between (noise in the cirrus's frame, over
  // the map), and in fields of some 50 km: seen from below, far off, they
  // close up into long thin bands, as cirrus does at dusk; spread evenly
  // (round 10), they stood in rows like the scales of a fish. As the
  // slider goes up, the bands widen and join.
  // (Without the fibres, for the sun's light over a wide footprint, their
  // mean: the code is left out of those copies.)
  // Little cirrus is tufts in fields of some 50 km (spread: round 10's,
  // kept: from the ground they stand apart with blue between); from 0.3
  // the bands take over, though a field's tufts keep most of their weight.
  // (Read once per deck and pixel, and passed to the march's reads as
  // fieldsIn: they change over tens of km.)
  vec2 fsp = !fibres ? vec2(0.55) : lite ? max(fieldsIn, 0.0) : ciFields(uv, k);
  ciFieldsOut = fsp;
  float fields = fsp.x, spread = fsp.y;
  float banded = smoothstep(0.3, 0.6, uCirrus);
  vec4 wk = vec4((1.0 - 0.5 * sr) * mix(0.15 + 1.1 * spread, 0.05 + 1.0 * max(fields, 0.7 * spread), banded),
                 (0.25 + 0.9 * sr) * smoothstep(0.2, 0.75, uCirrus) * mix(1.0, 0.4 + 0.8 * fields, banded), 0.5 * sf,
                 (1.2 - 0.6 * sf) * (1.0 + 1.0 * smoothstep(0.15, 0.85, uCirrus)) * mix(1.0, 0.1 + 0.8 * fields, banded));
  // The ice in the deck's frame. The footprint's axes go along, through
  // the mipmaps and the anisotropic filter.
  mat2 J;
  vec2 tc = ciPlace(x, k, J), g1 = J * f1, g2 = J * f2;
  vec4 si = textureGrad(uIce, tc, g1, g2);
  // A tuft of a flock is crisp: its thin edge is cut off and its core
  // made denser, so that it stands as a small, bright, ragged cell.
  vec4 q = si * si;
  q.b *= 2.0 * smoothstep(0.01, 0.08, q.b);
  // The faint trace under the sheets (a streaky veil) shows only near the
  // top of the slider.
  q.g = max(q.g - 0.035 * (1.0 - smoothstep(0.6, 0.95, uCirrus)), 0.0);
  float ice = dot(q, wk), F = 1.0;
  // How dense the ice is, from 0 to 1, for the fibres' strength.
  float dense = 1.0 - exp(-7.0 * ice);
  // The hairs (ciHair, read by the caller at the place it chose): thin
  // ice breaks up into them; dense cores stay soft and milky, with a faint
  // sheen of hairs. Where there is next to no ice (the faint ends of old
  // tails, under 0.01), there are none: there they gathered ice that does
  // not show into lone straight lines across the clear sky (round 13's c2).
  F = mix(1.0, hairIn, (1.0 - 0.85 * smoothstep(0.25, 0.75, dense)) * smoothstep(0.002, 0.012, ice));
  // The optical depth follows the ice: thin almost everywhere (some 0.05
  // to 0.5 seen straight up), the cores 1 to 2. Little cirrus is the same
  // ice less a floor: the weak tails and the thin edges go first, and
  // what is left fades in from nothing along its own fibres, with no
  // outline of its own. The floor is soft (a square at first), so that the
  // depth grows smoothly from 0.
  float c = uCirrus;
  float floor0 = 0.1 * pow(1.0 - c, 6.0) + 0.02 * (1.0 - m), knee = 0.5 * floor0 + 0.004;
  float gain = CI_TAU * (0.6 + 0.8 * c) * (0.3 + 0.7 * m);
  float fine = ice * F, y = max(fine - floor0, 0.0);
  // Dense cores up to twice as deep (from 0.04 to 0.3 of ice above the
  // floor): a tuft has a dense white body under its feathered edges, as
  // photographs show; the edges, and so the cover, are as before.
  float d = gain * y * y / (y + knee) * (1.0 + smoothstep(0.04, 0.3, y));
  // The veil (cirrostratus), and in the bands a body of ice (from 0.2):
  // both have the veil's banded noise as the exponent of their depth, so
  // that a band is long and continuous with streaks along it, and tufts
  // in it, not a row of separate dabs.
  float vn = fibres && (veilOn0(c, m) > 0.0 || banded > 0.0) ? ciVeilNoise(tc, max(max(length(g1), length(g2)), 1e-7), k == 0 ? 600u : 700u) : 0.0;
  float body = CI_BAND * smoothstep(0.2, 0.6, c) * fields * fields * m * exp(2.2 * vn - 0.4);
  // Much cirrus (from 0.7 to 1) closes up into an even veil: it fills
  // the lanes between the bands and its patches even out, so that the
  // moon shines through one milky sheet with its ring, and a deck seen
  // from under it is grey all over, as in photographs of cirrostratus;
  // with lanes, much cirrus at night stood as dark lanes across the
  // moonlit veil, and the ring had no even sheet to show on. It keeps
  // faint streaks (its noise and the hairs weaker by only a little): from
  // 0.55, the even veil wiped out the texture of the decks seen from near
  // the shell (round 14's k5, c2).
  float even = smoothstep(0.7, 1.0, c);
  float sheet0 = (veilOn0(c, m) * (0.1 + 1.2 * even + 1.5 * fields * fields) * max(exp((2.2 - 0.6 * even) * vn - 0.4) - 6.0 * pow(1.0 - c, 1.5) * (1.2 - fields), 0.0) + body) * mix(1.0, F, 0.7 - 0.2 * even);
  if (lite) return d + sheet0;
  // The ice over some 0.4 km (or four footprints, if that is wider): the
  // body that the light inside the sheet feels.
  float gl = max(max(length(g1), length(g2)), 1e-7);
  float sb = max(4.0, 0.01 / gl);
  vec4 sbs = textureGrad(uIce, tc, g1 * sb, g2 * sb);
  float yb = max(dot(sbs * sbs, wk) - floor0, 0.0);
  float db = gain * yb * yb / (yb + knee);
  // Much cirrus also makes a veil (cirrostratus): the same ice at twice
  // the size, read at another place and softened over some 0.15 km, so
  // that the veil has bands and fibres of its own, thick patches and clear
  // lanes (its depth from some 0.1 to 3), instead of an even sheet. It
  // comes in by degrees from 0.5; from 0.85 a trace of it fills the lanes.
  float s2 = max(1.0, 0.062 / gl), s3 = max(1.0, 0.25 / gl);
  vec4 sv2 = textureGrad(uIce, tc, g1 * s2, g2 * s2), svb = textureGrad(uIce, tc, g1 * s3, g2 * s3);
  float v2 = dot(sv2 * sv2, wk), vb = dot(svb * svb, wk);
  float veilOn = veilOn0(c, m);
  // Without the fibres (the sun's light through the sheet, over a wide
  // footprint) the veil's noise averages out: its median is enough, and
  // the code is left out of those copies.
  float sheet = sheet0;
  float ym = max(v2 - floor0, 0.0), yw = max(vb - floor0, 0.0);
  // The glow round the sun and the moon reads the veil's mean.
  float sheetM = veilOn;
  ciBody = db + sheet;
  ciVeil = sheet;
  ciMean = gain * ym * ym / (ym + knee) + sheetM;
  ciWide = gain * yw * yw / (yw + knee) + sheetM;
  return d + sheet;
}

// The height (km) of the ice of deck k by its age: the heads near the top
// of the deck, the ice lower as it ages (it falls), down to near the
// deck's base by 0.6 of a life. And the spread round that height (the
// standard deviation of a Gaussian, km): wider for older ice.
float ciHeight(int k, float age) {
  vec2 dk = CI_DECK[k];
  return dk.y - (dk.y - dk.x) * (0.15 + 0.7 * clamp(age / 0.6, 0.0, 1.0));
}
float ciSpread(int k, float age) {
  vec2 dk = CI_DECK[k];
  return (dk.y - dk.x) * (0.08 + 0.14 * clamp(age / 0.6, 0.0, 1.0));
}
// The normal distribution's integral, through erf after Winitzki (2008;
// within 1.2e-4), as in the ice shader.
float ciPhi(float z) {
  float x = 0.70710678 * z, x2 = x * x;
  return 0.5 + 0.5 * sign(x) * sqrt(1.0 - exp(-x2 * (1.2732395 + 0.147 * x2) / (1.0 + 0.147 * x2)));
}

// The mean age of the ice of deck k at x on the map, seen over some foot
// km (see iceWay in the ice shader): 0 at its head, 1 at the end of a
// life. Where there is little ice, it tends to 0.3.
float ciAge(vec2 x, int k, float foot) {
  mat2 J;
  vec2 tc = ciPlace(x, k, J);
  vec2 v = textureLod(uIceWay, tc, log2(max(foot * length(J[0]) * float(textureSize(uIceWay, 0).x), 1.0))).ba;
  // A blend, not a threshold: cut where the weight passed 0.02, the age
  // jumped, and with it the ice's height, which drew hard stepped edges
  // across the decks from just under the shell (round 13's k5).
  return (v.x + 0.3 * 0.03) / (v.y + 0.03);
}

// The depth as the light of the sun feels it, the ice seen over `foot`
// km: the mean over the shell.
float cirrusDepth(vec2 x, float foot) {
  vec2 f1 = vec2(foot, 0.0), f2 = vec2(0.0, foot);
  return 0.5 * (ciDensity(x, 0, f1, f2, false, true, vec2(-1.0), 1.0) + ciDensity(x, 1, f1, f2, false, true, vec2(-1.0), 1.0));
}

// The depth of the thin cloud between a point under it and the light, as
// direct light feels it. Ice scatters mostly forward, and that light still
// arrives: half of the depth counts. The width of the sun and the light
// scattered forward blur the fibres' shadows into their mean.
float cirrusShadow(vec3 p) {
  if (uCirrus <= 0.0) return 0.0;
  vec3 pc = p + uLight * raySphere(p, uLight, RG + 0.5 * (CI_LO + CI_HI)).y;
  return 0.5 * cirrusDepth(pc.xz + uDrift, 0.5) / max(dot(normalize(pc), uLight), 0.05);
}

// Light scattered once by a sheet of depth te along the view, lit through a
// depth ts: the sheet sends te times the mean of exp(-t - ts(t)) along the
// view, lit on the side the eye is on (sameSide), or through it.
float ciOnce(float te, float ts, bool sameSide) {
  return sameSide ? te * (1.0 - exp(-te - ts)) / max(te + ts, 1e-6)
       : abs(te - ts) < 1e-3 ? te * exp(-te) : te * (exp(-ts) - exp(-te)) / (te - ts);
}

void highCloud(vec3 o, vec3 d, float tmax, float extM, out float Th, out float tHigh, out vec4 H[3]) {
  Th = 1.0;
  tHigh = -1.0;
  H[0] = vec4(0.0); H[1] = vec4(0.0); H[2] = vec4(0.0);
  // Where the ray is inside the shell: t0 to t1. From its base, a ray down
  // leaves it at once (lo.x is 0).
  vec2 lo = eyeSphere(o, d, CI_LO), hi = eyeSphere(o, d, CI_HI);
  float t0, t1;
  if (uAlt < CI_LO) {
    t0 = lo.y; t1 = hi.y;
  } else if (uAlt < CI_HI) {
    t0 = 0.0; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  } else {
    t0 = hi.x; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  }
  t1 = min(t1, tmax);
  if (t0 < 0.0 || t1 <= t0) return;
  float pix = 2.0 * uTan / uRes.y;
  // Each deck is a volume (CI_DECK) that the ice fills by its age (ciAge,
  // ciHeight): heads near its top, older ice lower down, as it has fallen;
  // its vertical depth (ciDensity) is spread over the height round there
  // (ciSpread), so that a column holds the depth a flat read gives.
  // Far off, each deck is read once, where the ray crosses the height of
  // its ice there (from the age where the ray crosses the deck's middle:
  // one step of parallax mapping), its depth times the way through the
  // deck over the deck's thickness.
  float tau = 0.0, tauV = 0.0, bodyT = 0.0, veilT = 0.0, meanT = 0.0, wideT = 0.0, wtt = 0.0, tSum = 0.0, nSum = 0.0;
  // Near the eye (where the ray enters the shell within CI_NEAR.y km) the
  // shell is marched over CI_NEAR.z km instead; the flat reads then cover
  // only the part of each deck beyond the march. The two are blended (wn)
  // as the shell's distance goes from CI_NEAR.x to CI_NEAR.y.
  // Rays that run low through the shell (under some 10 degrees where they
  // enter it) are read flat too: through the march such a ray crossed
  // several km of ice, which averaged its bands into one smooth sheet (at
  // dusk, from just under the shell, a soft glow where photographs show
  // thin lit bands). The blend goes by the ray's slope, which flight does
  // not change, so it draws no edge that moves.
  vec3 pe = o + d * t0;
  float wn = (1.0 - smoothstep(CI_NEAR.x, CI_NEAR.y, t0)) * smoothstep(0.12, 0.3, abs(dot(d, normalize(pe))));
  float tE = wn > 0.0 ? min(t1, t0 + CI_NEAR.z) : t0;
  float tauR = 0.0, wttR = 0.0;
  float colK[2] = float[2](0.0, 0.0), bodyK[2] = float[2](0.0, 0.0);
  vec2 fieldsK[2] = vec2[2](vec2(-1.0), vec2(-1.0));
  for (int k = 0; k < CI_LAYERS; k++) {
    float lo = CI_DECK[k].x, hi = CI_DECK[k].y, th = hi - lo;
    vec2 el = eyeSphere(o, d, lo), eh = eyeSphere(o, d, hi);
    float s0, s1;
    if (uAlt < lo) {
      s0 = el.y; s1 = eh.y;
    } else if (uAlt < hi) {
      s0 = 0.0; s1 = el.y > el.x && el.x >= 0.0 ? el.x : eh.y;
    } else {
      s0 = eh.x; s1 = el.y > el.x && el.x >= 0.0 ? el.x : eh.y;
    }
    s0 = max(s0, t0);
    s1 = min(s1, t1);
    if (s0 < 0.0 || s1 <= s0) continue;
    float hm = 0.5 * (lo + hi);
    vec2 em = eyeSphere(o, d, hm);
    float tm = uAlt < hm ? em.y : em.x;
    if (tm < s0 || tm > s1) tm = 0.5 * (s0 + s1);
    float hc = ciHeight(k, ciAge((o + d * tm).xz + uDrift, k, max(pix * tm, CI_MINF)));
    vec2 ec = eyeSphere(o, d, hc);
    float t = ec.x > 1e8 ? tm : clamp(uAlt < hc ? ec.y : ec.x, s0, s1);
    vec3 p = o + d * t, up = normalize(p);
    float cv = abs(dot(d, up));
    // The footprint on the deck: a pixel, drawn out along the ray's way over
    // the map; and aslant, the way through the deck blurs the ice along it.
    // Never under CI_MINF.
    vec2 dh = d.xz - up.xz * dot(d, up);
    float lh = length(dh);
    vec2 dn = lh > 1e-6 ? dh / lh : vec2(1.0, 0.0);
    vec2 f1 = dn * max(pix * t / max(cv, 1e-3) + 0.08 * (s1 - s0) * lh, CI_MINF);
    vec2 f2 = vec2(-dn.y, dn.x) * max(pix * t, CI_MINF);
    mat2 Jp;
    vec2 tcp = ciPlace(p.xz + uDrift, k, Jp);
    float hr = ciHair(tcp, Jp, k, dn * (pix * t / max(cv, 1e-3)), vec2(-dn.y, dn.x) * (pix * t), 0u);
    float rho = ciDensity(p.xz + uDrift, k, f1, f2, true, false, vec2(-1.0), hr), way = (s1 - s0) / th;
    float cBody = ciBody, cVeil = ciVeil, cMean = ciMean, cWide = ciWide;
    fieldsK[k] = ciFieldsOut;
    // A ray that grazes the deck crosses it over km: one read stood for all
    // of that, while the march near the eye reads it all along, and where
    // the two met, a patch of ice near the eye stood apart from the same
    // ice read farther on. Over a long crossing a second read (of the
    // depth alone) is averaged in, from the part the march leaves, a
    // quarter of the way on from the first.
    float ra = max(s0, tE), many = smoothstep(2.0, 4.0, way) * step(ra + 0.01, s1);
    if (many > 0.0) {
      float tj = clamp(t + 0.25 * (s1 - s0), ra, s1);
      tj = tj - t < 0.1 * (s1 - s0) ? mix(ra, s1, 0.25) : tj;
      rho = mix(rho, 0.5 * (rho + ciDensity((o + d * tj).xz + uDrift, k, f1 * (tj / t), f2 * (tj / t), true, true, fieldsK[k], 1.0)), many);
    }
    tau += rho * way;
    tauV += rho;
    bodyT += cBody;
    veilT += cVeil * way;
    meanT += cMean * way;
    wideT += cWide * way;
    wtt += rho * way * t;
    tSum += t;
    nSum += 1.0;
    colK[k] = rho;
    bodyK[k] = cBody;
    float wr = max(s1 - max(s0, tE), 0.0) / th;
    tauR += rho * wr;
    wttR += rho * wr * max(t, tE);
  }
  // The march near the eye: CI_STEPS steps over the shell from t0 to tE.
  // In each, a deck's ice is read once over the step (its footprint drawn
  // out along it), and the part of its column the step crosses is taken
  // from the spread in closed form, so that no step shows. The light
  // scattered once is summed step by step: what reaches a step from the
  // light has crossed the column above it (or below it, for a low light
  // from under the shell), so that the heads shade the ice under them and
  // the tops of a deck are brighter than its base.
  // The steps' bounds move from frame to frame by a fraction of a step
  // (the first and the last step are parts of one): on a fixed grid, the
  // edge of a band seen along a grazing ray stood in stairs, a step each.
  float tauN = 0.0, onceN = 0.0, onceDN = 0.0, wttN = 0.0;
  if (tE > t0) {
    float dt = (tE - t0) / float(CI_STEPS), jit = ign(gl_FragCoord.xy + 2.718 * uPass + 5.0);
    // The hairs of each sheet, read once where the ray crosses it (before
    // the steps, the same for every pixel: read inside the steps, as each
    // pixel came to a new sheet, they cost ten times as much).
    float hairS[CI_LAYERS * CI_SHEETS];
    for (int n = 0; n < CI_N(CI_LAYERS * CI_SHEETS); n++) {
      int k = n / CI_SHEETS;
      float hs = CI_DECK[k].x + (float(n - k * CI_SHEETS) + 0.5) * (CI_DECK[k].y - CI_DECK[k].x) / float(CI_SHEETS);
      vec2 es = eyeSphere(o, d, hs);
      float tsh = uAlt < hs ? es.y : es.x;
      hairS[n] = 1.0;
      if (es.x > 1e8 || tsh < t0 - 0.5 || tsh > tE + 0.5) continue;
      vec3 ps = o + d * tsh, us = normalize(ps);
      float cs = dot(d, us);
      vec2 dhs = d.xz - us.xz * cs;
      float lhs = length(dhs);
      vec2 dns = lhs > 1e-6 ? dhs / lhs : vec2(1.0, 0.0);
      mat2 Js;
      vec2 tcs = ciPlace(ps.xz + uDrift, k, Js);
      hairS[n] = ciHair(tcs, Js, k, dns * (pix * tsh / max(abs(cs), 1e-3)), vec2(-dns.y, dns.x) * (pix * tsh), 1u + uint(n));
    }
    for (int i = 0; i <= CI_STEPS; i++) {
      float ta = i == 0 ? t0 : t0 + dt * (float(i - 1) + jit), tb = i == CI_STEPS ? tE : t0 + dt * (float(i) + jit);
      if (tb <= ta) continue;
      float tmid = 0.5 * (ta + tb), dts = tb - ta;
      vec3 pm = o + d * tmid, up = normalize(pm);
      float ha = length(o + d * ta) - RG, hb = length(o + d * tb) - RG, hmid = length(pm) - RG;
      float cv = dot(d, up), mus = dot(up, uLight);
      vec2 dh = d.xz - up.xz * cv;
      float lh = length(dh);
      vec2 dn = lh > 1e-6 ? dh / lh : vec2(1.0, 0.0);
      vec2 f1 = dn * max(max(dts * lh, pix * tmid), CI_MINF), f2 = vec2(-dn.y, dn.x) * max(pix * tmid, CI_MINF);
      // The light comes from above (1) or below (0). A low sun runs along
      // the decks and crosses as much ice as their whole columns (as the
      // flat reads take it): there each step feels the whole column. With
      // half of it, low sunlit ice near the eye was brighter than the same
      // ice farther off, a patch with the outline of the ice; and a sharp
      // switch at the sun's height 0 drew a seam.
      float fromAbove = smoothstep(-0.1, 0.1, mus), steep = smoothstep(0.1, 0.35, abs(mus));
      float tauS = 0.0, tsS = 0.0;
      for (int k = 0; k < CI_LAYERS; k++) {
        float lo = CI_DECK[k].x, hi = CI_DECK[k].y;
        if (min(ha, hb) >= hi || max(ha, hb) <= lo) {
          // The deck lies wholly above or below the step: its column shades
          // the step if the light comes from that side.
          tsS += max(colK[k], bodyK[k]) * mix(1.0, hmid < lo ? fromAbove : 1.0 - fromAbove, steep);
          continue;
        }
        vec2 x = pm.xz + uDrift;
        // The hairs of the sheet nearest the step's middle (CI_SHEETS to a
        // deck, at fixed heights), read where the ray crosses it: the
        // steps move from frame to frame, the sheets do not, so that the
        // hairs stay crisp.
        int ns = clamp(int(floor((hmid - lo) / (hi - lo) * float(CI_SHEETS))), 0, CI_SHEETS - 1);
        float hr = hairS[k * CI_SHEETS + ns];
        float col = ciDensity(x, k, f1, f2, true, true, fieldsK[k], hr);
        if (col <= 0.0) continue;
        float age = ciAge(x, k, max(pix * tmid, CI_MINF));
        float hc = ciHeight(k, age), sg = ciSpread(k, age);
        float pl = ciPhi((lo - hc) / sg), ph = ciPhi((hi - hc) / sg), nrm = max(ph - pl, 1e-3);
        float qa = ciPhi((clamp(ha, lo, hi) - hc) / sg), qb = ciPhi((clamp(hb, lo, hi) - hc) / sg);
        float dz = abs(hb - ha), z = (clamp(hmid, lo, hi) - hc) / sg;
        // The column's share per km of height here, times the way.
        float per = dz > 1e-4 * sg ? abs(qb - qa) / dz : 0.39894 * exp(-0.5 * z * z) / sg;
        tauS += col * per / nrm * dts;
        float qm = ciPhi(z);
        tsS += max(col, bodyK[k]) * mix(1.0, mix(qm - pl, ph - qm, fromAbove) / nrm, steep);
      }
      if (tauS <= 0.0) continue;
      float li = 1.0 / max(abs(mus), 0.15), tr = exp(-tauN - 0.5 * tauS) * tauS;
      onceN += tr * exp(-0.6 * tsS * li);
      onceDN += tr * exp(-0.15 * tsS * li);
      wttN += tauS * tmid;
      tauN += tauS;
    }
  }
  float tauF = tau;
  tau = mix(tauF, tauN + tauR, wn);
  wtt = mix(wtt, wttN + wttR, wn);
  // Where there is no ice in the pixel but some around, the glow round
  // the sun or the moon is still drawn (below).
  if (tau <= 0.0 && wideT <= 0.0) return;
  tHigh = tau > 0.0 ? wtt / tau : tSum / nSum;
  ciBody = bodyT;
  Th = exp(-tau);
  vec3 pc = o + d * tHigh, up = normalize(pc);
  float a = 1.0 - Th;

  // Light. Ice crystals scatter forward: a narrow peak (diffraction by
  // crystals of some 100 um, within a degree or two of the sun, so that the
  // glow round the sun stays small), a broad one (refraction), and a flat
  // part to the side and back (some 0.3 of the mean, as ray tracing of ice
  // crystals gives it); and the halo at 22 degrees from the sun, red inside,
  // which a min-deviation prism of ice draws.
  float mu = dot(d, uLight);
  float ph = 0.4 * hg(mu, 0.7) + 0.25 * hg(mu, -0.3), peak = 0.35 * hg(mu, 0.99);
  float th = acos(clamp(mu, -1.0, 1.0));
  float mus = dot(up, uLight);
  bool lit = uLightI > 0.0 && raySphere(pc, uLight, RG).y < 0.0;
  vec3 ol = lit ? depthToTop(pc, uLight) : vec3(0.0);
  // Sunlight dims on its way into the sheet (less the forward peak, which
  // goes on as if not scattered): its depth ts there, against te along
  // the view. Scattered once, the sheet sends to the eye te times the mean
  // of exp(-t - ts(t)) along the view: lit on the side the eye is on, or
  // through it. A low sun lights it from below.
  // A fibre in a thick body of ice is lit through the body. A low sun
  // does not cross the whole sheet edgewise: it finds its way in between
  // the clouds within some seven times the sheet's thickness.
  bool sameSide = (dot(d, up) < 0.0) == (mus > 0.0);
  // Near the eye, the march's own sum, and the flat reads behind it.
  float li = 1.0 / max(abs(mus), 0.15);
  float once = mix(ciOnce(tauF, 0.6 * max(tauV, ciBody) * li, sameSide),
                   onceN + exp(-tauN) * ciOnce(tauR, 0.6 * max(tauV, ciBody) * li, sameSide), wn);
  // The narrow peak, a few degrees round the sun or the moon, is a round
  // glow (an aureole): it follows the sheet's depth over some 10 km, and
  // the ice just in front of the light only by a quarter. Drawn from the
  // ice in front (round 8), a plume round the moon lit up as a bright
  // patch of its own shape; from the depth over 2.5 km (round 7), as a
  // smooth bright lens.
  float onceW = ciOnce(wideT, 0.6 * wideT / max(abs(mus), 0.15), sameSide);
  // Along a long path most light is scattered more than once, which
  // spreads the peak and the halo out; a thicker sheet sends more back.
  // Scattered twice or more, the light still goes mostly forward (as by a
  // narrower lobe, g 0.5 for ice's 0.7): next to the moon or the sun dense
  // ice glows, and does not stand dark against thinner ice.
  float many = 1.0 - exp(-0.3 * tau), spread = 0.15 * tauV / (tauV + 0.3);
  // The light scattered many times has mostly gone forward at each step: on
  // its way in it fades with a quarter of the depth that the light
  // scattered once feels (1 - g of ice). With the depth of the single
  // scattering, thick ice towards a low sun went darker than the sky behind
  // it.
  float onceD = mix(ciOnce(tauF, 0.15 * max(tauV, ciBody) * li, sameSide),
                    onceDN + exp(-tauN) * ciOnce(tauR, 0.15 * max(tauV, ciBody) * li, sameSide), wn);
  // Light from below: the low clouds, lit by the same sun, add to the sea
  // that the mean sky already holds. Forward scattering sends more of it
  // to an eye below the sheet.
  float below = 0.35 * clamp(1.4 * uCloud - 0.1, 0.0, 1.0) * max(mus, 0.0) / PI;
  float wBelow = 0.5 + 0.35 * dot(d, up);
  vec4 msS[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0)), msM[3] = msS;
  float rc = length(pc);
  if (uSunI > 0.0) multiScatter(rc - RG, dot(pc, uSun) / rc, msS);
  if (uMoonI > 0.0) multiScatter(rc - RG, dot(pc, uMoon) / rc, msM);
  // The halo needs smooth hexagonal crystals, which thin cirrus has: it
  // shows faintly in thin fibrous cirrus (as in photographs of halos in
  // cirrus fibratus), more in a thin, even veil (cirrostratus), and fades
  // where the ice is thick enough to scatter the light again. By day it
  // is faint (0.03) and only in a veil: photographs of much cirrus towards
  // the sun mostly show none, and 0.05 to 0.17 drew a clear coloured ring
  // in any veil. At night (the moon's light) it is as before.
  // (The light scattered more than once loses it: F takes the halo by
  // 1 - many, as the rest of the light scattered once. Taken by it twice,
  // as before, the ring did not show through a veil at night, where the
  // photographs show it.)
  float haloW = (uLightI > 0.5 ? 0.03 * smoothstep(0.1, 0.4, veilT) : 0.05 + 0.12 * smoothstep(0.03, 0.3, veilT)) * smoothstep(0.02, 0.15, tau);
  vec4 F[3];
  for (int k = 0; k < 3; k++) {
    vec4 n = 1.2998 + 0.00316 / (0.3025 * uWL[k] * uWL[k]);   // ice, by wavelength (0.55 um units)
    vec4 x = th - (2.0 * asin(0.5 * n) - PI / 3.0);
    vec4 halo = haloW * mix(exp(-x * x / 1.2e-3), exp(-max(x, 0.0) / 0.05), step(0.0, x));
    vec4 sun = lit ? exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z)) : vec4(0.0);
    H[k] = a * ((1.0 - CI_FWD) * (uSunI * msS[k] + uMoonI * msM[k] + uNight * pow(uWL[k], vec4(-3.0)))
                + uLightI * sun * wBelow * below);
    F[k] = uLightI * sun * ((ph + halo) * (1.0 - many) * once + (spread + 0.3 * hg(mu, 0.5)) * many * onceD + peak * exp(-0.3 * wideT) * mix(onceW, once, 0.4));
  }
  // Towards the sun the sheet sends far more light than the sky round it
  // (thirty to fifty times, ten degrees off), more than the screen can
  // show: on the screen its thick and thin parts would be one white glow.
  // A photograph through such a veil keeps them apart. The light scattered
  // forward rolls off smoothly towards some 2.2 times the screen's white
  // (after the exposure), so that the texture of the ice stays.
  float lum = ISUN * uExposure * (dot(uWG[0], F[0]) + dot(uWG[1], F[1]) + dot(uWG[2], F[2]));
  float roll = lum > 1e-4 ? CI_ROLL * (1.0 - exp(-lum / CI_ROLL)) / lum : 1.0;
  for (int k = 0; k < 3; k++) H[k] += roll * F[k];
}

// A distance (km; negative: infinitely far) as a number from 0 to 1, in 16
// bits over two channels of 8.
vec2 distanceCode(float t) {
  float c = floor((t > 0.0 ? clamp(0.5 + log2(t) / 20.0, 0.0, 0.99) : 1.0) * 65535.0 + 0.5);
  float high = floor(c / 256.0);
  return vec2(high, c - 256.0 * high) / 255.0;
}

#ifdef SHADOW_MAP
// The map of the clouds' shadow, uRes texels square.
void main() {
  shadowAxes();
  outColor = shadowTexel(gl_FragCoord.xy / uRes * 2.0 - 1.0);
}
#else
void main() {
  shadowAxes();
  vec2 uv = ((gl_FragCoord.xy + uJitter) * 2.0 - uRes) / uRes.y;
  vec3 d = normalize(uCam * vec3(uv * uTan, 1.0));
  vec3 o = vec3(0.0, RG + uAlt, 0.0);

  float tmax = raySphere(o, d, RT).y;
  vec2 tg = raySphere(o, d, RG);
  bool ground = tg.x > 0.0 && tg.x < 1e8;
  if (ground) tmax = tg.x;

  float betaM = BETA_M * uHaze;
  float extM = betaM * MIE_EXT;
  float mu = dot(d, uSun);
  vec3 phaseSun = phases(mu);
  vec3 phaseMoon = phases(dot(d, uMoon));

  // The clouds first. They enter the march through the air below as one
  // layer at distance tBar: it sends the light C and lets Tc through. The
  // high, thin cloud is a second layer: tHigh, H, Th.
  float Tc = 1.0, tBar = -1.0, Th = 1.0, tHigh = -1.0;
  vec4 C[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
  vec4 H[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
  if (uCirrus > 0.0) highCloud(o, d, tmax, extM, Th, tHigh, H);
  if (uCloud > 0.0) {
    vec2 top = raySphere(o, d, RG + CT), base = raySphere(o, d, RG + CB);
    float ta = max(uAlt > CT ? top.x : uAlt < CB ? base.y : 0.0, 0.0);
    float tb = min(ground ? (uAlt < CB ? -1.0 : base.x) : top.y, 600.0);
    float sOne = 0.0, sMany = 0.0, sAmb = 0.0;
    if (tb > ta) {
      clouds(o, d, ta, tb, ign(gl_FragCoord.xy + 5.588238 * uPass), Tc, sOne, sMany, sAmb, tBar);
    }
    if (tBar > 0.0) {
      // The colours of the light there: sunlight through the air above,
      // and skylight (the multiple-scattering table is the mean sky).
      vec3 pc = o + d * tBar;
      float rc = length(pc);
      bool lit = uLightI > 0.0 && raySphere(pc, uLight, RG).y < 0.0;
      vec3 ol = lit ? depthToTop(pc, uLight) : vec3(0.0);
      float dim = lit ? exp(-cirrusShadow(pc)) : 1.0;   // the thin cloud above shades them
      vec4 msS[3], msM[3];
      cloudSky(rc - RG, dot(pc, uSun) / rc, msS);
      cloudSky(rc - RG, dot(pc, uMoon) / rc, msM);
      for (int k = 0; k < 3; k++) {
        C[k] = sAmb * (2.0 * (uSunI * msS[k] + uMoonI * msM[k]) + 0.5 * uNight * pow(uWL[k], vec4(-3.0)));
        if (lit) C[k] += uLightI * (sOne + sMany) * dim * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      }
    }
  }

  // The clouds shade the air below their tops (see cloudShadow). Light
  // scattered once by the air there is sampled more finely than the march
  // below: SHAFTS samples of the shadow over that part of the ray, ca to
  // cb, denser near the eye, at new places each frame. Each step of the
  // march takes the mean light of those that fall in it (weighed by the
  // air's scattering there), or reads the map once if none does.
  const int SHAFTS = 16;
  float ca = 0.0, cb = -1.0;
  if (uCloud > 0.0 && uLightI > 0.0) {
    vec2 ct = eyeSphere(o, d, CT);
    if (uAlt < CT) cb = ct.y;
    else if (ct.x >= 0.0 && ct.x < 1e8) { ca = ct.x; cb = ct.y; }
    cb = min(cb, tmax);
  }
  float shaftJitter = ign(gl_FragCoord.xy + 3.137 * uPass + 11.0);
  int shaft = 0;
  // The thin cloud is not in the map: its shadow (cirrusShadow) where the
  // ray meets the sea dims the air near the sea.
  // The same depth shades the sea below (once: each call of cirrusShadow
  // is a copy of the cirrus's code for the compiler).
  float ciSea = 0.0;
  if (uCirrus > 0.0 && uLightI > 0.0 && ground && Tc > 0.0) ciSea = cirrusShadow(o + d * tmax);
  float ciShade = exp(-ciSea);
  // The map is the light's: in twilight the sun still lights the air
  // while the moon lights the clouds and the sea.
  bool sunLight = dot(uLight, uSun) > 0.999;

  // March along the view ray; samples are denser near the eye. An extra
  // sample ends at each layer, the nearer one first.
  vec3 od = vec3(0.0);
  vec4 L[3], G[3];
  L[0] = vec4(0.0); L[1] = vec4(0.0); L[2] = vec4(0.0);
  G[0] = vec4(0.0); G[1] = vec4(0.0); G[2] = vec4(0.0);
  vec4 Tv[3];
  // vis: what gets through the layers so far; visX, the same for what is
  // wide (the air, the sea, the clouds), which the thin cloud's diffraction
  // lets through by CI_FWD of what it takes.
  float prev = 0.0, vis = 1.0, visX = 1.0;
  bool cloudsFirst = tHigh < 0.0 || (tBar > 0.0 && tBar <= tHigh);
  float tSecond = cloudsFirst ? tHigh : tBar;
  float tLayer = cloudsFirst ? tBar : tHigh;         // the next layer; negative: none
  if (tLayer < 0.0) tLayer = 1e9;
  // Without the planet's shadow on the ray, NV samples from the eye to the
  // end. With it, NV up to the shadow, NSHADE in it and NFAR beyond, each
  // run denser at its start; a run of no length is skipped.
  float sa = tmax, sb = tmax;
  int n = NV, j = 0;
  if (uSunI > 0.0 && shadowSpan(o, d, tmax, uSun, sa, sb)) {
    n = sb < tmax ? NV + NSHADE + NFAR : NV + NSHADE;
    if (sa <= 0.0) j = NV;
  }
  int layer = 0;
  for (int i = 0; i < NV + NSHADE + NFAR + 2; i++) {
    if (j >= n) break;
    float t1;
    if (j < NV) {
      float f = (float(j) + 1.0) / float(NV);
      t1 = sa * f * f;
    } else if (j < NV + NSHADE) {
      float f = (float(j - NV) + 1.0) / float(NSHADE);
      t1 = sa + (sb - sa) * f * f;
    } else {
      float f = (float(j - NV - NSHADE) + 1.0) / float(NFAR);
      t1 = sb + (tmax - sb) * f * f;
    }
    bool atLayer = tLayer < t1;
    if (atLayer) t1 = tLayer; else j++;
    float dt = t1 - prev;
    vec3 p = o + d * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec4 dens = densities(h) * vec4(dt, dt, dt, 1.0);
    od += 0.5 * dens.xyz;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) {
      Tv[k] = exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    }
    float direct = 1.0;
    if (prev - dt < cb && prev > ca) {
      float lit = 0.0, sum = 0.0;
      for (int m = shaft; m < SHAFTS; m++) {
        float f = (float(m) + shaftJitter) / float(SHAFTS);
        float ts = ca + (cb - ca) * f * f;
        if (ts >= prev) break;
        shaft++;
        if (ts < prev - dt) continue;
        vec3 ps = o + d * ts;
        vec3 w = density(length(ps) - RG);
        float wt = uBR[1].z * w.x + betaM * w.y;
        lit += wt * exp(-cloudShadow(ps));
        sum += wt;
      }
      direct = sum > 0.0 ? lit / sum : exp(-cloudShadow(p));
    }
    direct *= mix(1.0, ciShade, 1.0 - smoothstep(0.6, 2.0, h));
    direct = mix(1.0, direct, uLightShare);          // the clouds' shadows come and go with their light
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI * visX, sunLight ? direct : 1.0, phaseSun, d, Tv, L);
    if (uMoonI > 0.0) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI * visX, sunLight ? 1.0 : direct, phaseMoon, d, Tv, L);
    od += 0.5 * dens.xyz;
    if (atLayer) {
      bool isClouds = (layer == 0) == cloudsFirst;
      for (int k = 0; k < 3; k++) {
        L[k] += visX * exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z)) * (isClouds ? C[k] : H[k]);
      }
      vis *= isClouds ? Tc : Th;
      visX *= isClouds ? Tc : Th + CI_FWD * (1.0 - Th);
      layer++;
      tLayer = layer == 1 && tSecond > 0.0 ? tSecond : 1e9;
      if (vis <= 0.0) break;
    }
  }

  if (vis <= 0.0) {
    // Behind a thick cloud.
  } else if (ground) {
    // The shadow on the sea: the clouds' (the map, softened) and the thin cloud's.
    vec3 pg = o + d * tmax;
    float shadow = uLightI > 0.0 ? uLightShare * (seaShadow(pg, ign(gl_FragCoord.xy + 7.31 * uPass + 3.0)) + ciSea) : 0.0;
    addSea(pg, d, tmax, od, betaM, extM, visX, shadow, L, G);
  } else {
    // Beyond the atmosphere: the sun, the moon, airglow, the Milky Way,
    // the zodiacal light and stars, all dimmed and reddened by the air.
    float pix = 2.0 * uTan / uRes.y;
    // Sun disc (angular radius 0.267 degrees).
    float sun = mu > 0.0 ? 2000.0 * smoothstep(0.0050, 0.0043, length(cross(d, uSun))) : 0.0;
    // Moon: a sphere lit by the sun, so the phase comes out by itself.
    const float MOON_R = 0.00454;                    // sin(0.26 degrees)
    vec3 em = (d - uMoon * dot(d, uMoon)) / MOON_R;
    float rm = length(em);
    float moonMask = 0.0, moon = 0.0;
    if (dot(d, uMoon) > 0.0 && rm < 1.0) {
      vec3 nm = em - uMoon * sqrt(1.0 - rm * rm);
      float seas = 0.65 + 0.6 * noise3(nm * 2.2 + 7.0);
      moon = 0.05 * seas * pow(max(dot(nm, uSun), 0.0), 0.6) + EARTHSHINE;
      moonMask = smoothstep(1.0, 1.0 - 1.5 * pix / MOON_R, rm);
    }
    vec3 c = d * uSky;                               // equatorial direction (J2000)
    // Every light here is drawn with its own brightness at every hour, and
    // only the air hides it: it is dimmed on its way to the eye (tk, tg),
    // and the light the air scatters towards the eye (L, so far) lies over
    // it. The exposure and the tone curve then decide what shows. A star by
    // day is lost under the bright sky, not switched off, and the stars and
    // the Milky Way come out by themselves as the twilight fades.
    float vanRhijn = 1.0 / sqrt(1.0 - 0.90 * (1.0 - d.y * d.y));   // a thin layer seen aslant
    float free = 1.0 - moonMask;                     // the moon hides what lies behind it
    vec4 tk[3];
