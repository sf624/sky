<script id="meter" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// The exposure meter: each pixel of this small target is a block of the
// picture, and holds the mean of its level (log2 of the luminance before
// exposure, coded from 0 to 1) at 4 x 4 points, in 16 bits over two 8-bit
// channels. The JS reads the blocks back and sets the exposure.
uniform sampler2D uPicture;
uniform vec2 uBlocks;   // the number of blocks across and up
out vec4 outColor;

void main() {
  vec2 size = vec2(textureSize(uPicture, 0));
  float sum = 0.0;
  for (int k = 0; k < 16; k++) {
    vec2 at = (floor(gl_FragCoord.xy) + (vec2(k & 3, k >> 2) + 0.5) / 4.0) / uBlocks * size;
    sum += texelFetch(uPicture, ivec2(at), 0).a;
  }
  float c = floor(sum / 16.0 * 65535.0 + 0.5), high = floor(c / 256.0);
  outColor = vec4(high / 255.0, (c - 256.0 * high) / 255.0, 0.0, 1.0);
}
</script>

<!-- The towers of ?grid=1: the worker that grows them and fills the grids
(see `grid` in the script below, TGRID in fs). Made into a Worker from its
text (a Blob): no file and no build. -->
<script id="towers" type="text/x-worker">
'use strict';
// ---- The shape rule: a tower's seed -> its lobes (from the prototype of
// #76). Kept apart from the plumbing below, which only calls lobesOf with
// the seed { x, z, W, top, base, seed } (km, x and z the middle of its
// foot), the knobs P and the lean. A lobe: { x, y, z, r, k } (km; k the
// width of its smooth union). The grid holds lobes of at least 0.6 voxels.
// (The rule of the shape prototype, round 2.) A body is a tree of lobes
// (spheres): a broad cluster of turrets on a footprint as wide as the body
// is tall or wider, rising out of a few big trunk lobes, with an apron of
// low lobes and small heaps round the foot; on each lobe smaller lobes over
// its surface (all round, a little out, spaced apart so that they meet in
// creases), 0.3 to 0.55 of their parent, down to rmin. The lobes are joined by a smooth minimum,
// wide for the big ones, narrow for the small ones (crisp clefts).
// rngOf: Mulberry32, by Tommy Ettinger (2017, public domain under CC0), in
// JavaScript: see THIRD_PARTY_NOTICES.md.
const rngOf = seed => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// P: the generator's knobs.
// A body is a broad cluster of turrets (thermals) on a footprint about
// as wide as the body is tall or wider; the middle ones stand highest,
// the others at heights spread from low to high, so that from above it
// is a heap of domes at many levels (not a plateau). Each turret is a
// column of lobes with jittered size and spacing (no bands), ending in a
// full dome (a round cap, not cut flat). The lower part is one mass
// (trunk lobes: no flutes between the columns). Round the foot, wide low lobes
// and small heaps (an apron) melt the body into the deck. On every lobe,
// generation by generation, smaller lobes all over its surface, down
// the walls too (cauliflower, not smooth veils).
const P = {
  turrets: 3.5,      // turrets per km of width, plus 2
  spread: 0.62,      // turret feet within this share of the half width
  sep: 0.55,         // least distance between feet, of W / sqrt(turrets)
  elong: 0.35,       // the footprint stretched by up to this much
  tr0: 0.09, tr1: 0.08, // turret lobe radius: (tr0 + tr1 rnd) W
  rCap: 0.85,        // a turret's radius at most this share of its height
  vary: 0.4,         // the other turrets top at (1 - vary rnd^skew) of the height
  skew: 1.0,         // at their place under the dome
  dome: 0.55,        // the dome: 1 - dome rho^domeP of the height at rho of the
  domeP: 2,          // feet's reach
  jit: 0.4,          // turret lobes off the axis by up to this much of its radius,
  jitR: 0.35,        // and smaller by up to this share (a lumpy column, no rings)
  shoulder: 0.12,    // lobes widen by this much high on a turret
  capR: 0.95,        // the cap: this share of the turret's radius
  rj: 0.3,           // lobe radius jitter (+-half)
  step: 0.4,         // lobe spacing up a turret, of its radius (jittered)
  lean: 2.5,         // times the page's LEAN
  wobble: 0.3,       // turret axis wanders by this much of its radius
  kCore: 0.06,       // smooth union of turret lobes, of their radius
  kKid: 0.04,        // of children, of their radius (sharp creases)
  trunk: 4,          // big lobes filling the body's lower part (one mass, no
  trunkR: 0.2,       // flutes between turret columns): radius trunkR W, their
  trunkTop: 0.4,     // tops at most trunkTop of the height
  feet: 1.6,         // apron lobes per km of width
  footR0: 0.07, footR1: 0.09, // their radius (footR0 + footR1 rnd) W
  footOut: 1.0,      // out to this share of the half width beyond the turrets
  sats: 1.2,         // small heaps round the foot, per km of width
  satR0: 0.035, satR1: 0.05,
  cov: 10,           // children per lobe: cov 4 (parent / child radius)^2 0.8 candidates
  overlap: -0.5,     // a candidate whose centre is this share of its radius inside another lobe is dropped;
                     // negative: closer to one than this share of its radius outside it (siblings
                     // spaced 1.5 radii apart: bulges that meet in deep creases; packed closer, their
                     // union was a smooth ball)
  ratio0: 0.3, ratio1: 0.2, // child radius (ratio0 + ratio1 rnd) of its parent
  g1r0: 0.35, g1r1: 0.2, // first generation: bigger, so that they shape the outline
  g1sink: 0.12, g1cov: 10,
  sink: 0.18,        // child centre this share of its radius inside the parent's surface
  up: 0,             // upward bias of children
  out: 0.35,         // outward bias
  minY: -0.7,        // lowest normal of a child (overhangs below -0)
  flatLow: 0.08,     // in the lowest share of the height, children only on top
  rmin: 0.040,       // smallest lobe, km (1.3 of the finest voxel: 30 m lobes doubled the worker's time, and the
                     // billows at render time are as fine)
};

function lobesOf(obj, P, LEAN) {
  const rnd = rngOf(obj.seed), out = [];
  const { x: cx, z: cz, W, top, base } = obj;
  const H = top - base;
  const nT = Math.max(1, Math.round(obj.turrets != null ? obj.turrets : 2 + P.turrets * W));
  const lx = LEAN[0] * P.lean, lz = LEAN[1] * P.lean;
  // The footprint: a disc stretched along a random axis.
  const ea = rnd() * Math.PI, el = 1 + P.elong * rnd(), ca = Math.cos(ea), sa = Math.sin(ea);
  const at = (u, v) => [cx + u * el * ca - v * sa, cz + u * el * sa + v * ca];
  const R = 0.5 * W * P.spread, sep = P.sep * W / Math.sqrt(nT);
  const feet = [[0.15 * R * (rnd() - 0.5), 0.15 * R * (rnd() - 0.5)]];
  for (let t = 0; t < 40 * nT && feet.length < nT; t++) {
    const a = rnd() * 2 * Math.PI, rr = Math.sqrt(rnd()) * R;
    const u = rr * Math.cos(a), v = rr * Math.sin(a);
    if (feet.every(f => Math.hypot(f[0] - u, f[1] - v) > sep)) feet.push([u, v]);
  }
  const core = [];
  let reach = 0;
  feet.forEach((f, i) => {
    const rho = Math.min(Math.hypot(f[0], f[1]) / R, 1);
    const hs = i === 0 ? 1 : (1 - P.dome * Math.pow(rho, P.domeP)) * (1 - P.vary * Math.pow(rnd(), P.skew));
    const tTop = base + H * hs, hT = tTop - base;
    const r0 = Math.min(W * (P.tr0 + P.tr1 * rnd()) * (0.75 + 0.25 * hs), P.rCap * hT);
    const [fx, fz] = at(f[0], f[1]);
    reach = Math.max(reach, Math.hypot(fx - cx, fz - cz) + r0);
    const ph1 = rnd() * 6.28, ph2 = rnd() * 6.28, fr = 1.5 + 2 * rnd();
    const axis = y => {
      const fy = (y - base) / H, wob = P.wobble * r0;
      return [fx + lx * (y - base) + wob * Math.sin(fr * fy * 3 + ph1), fz + lz * (y - base) + wob * Math.sin(fr * fy * 3 + ph2)];
    };
    // The cap: a full dome whose top is the turret's top.
    const rc = r0 * P.capR * (1 + P.shoulder);
    let y = base + 0.45 * r0;
    for (let n = 0; n < 200 && y < tTop - 1.6 * rc; n++) {
      const fy = Math.min((y - base) / H, 1);
      const r = r0 * (1 + P.shoulder * smooth(0.1, 0.6, fy)) * (1 + P.rj * (rnd() - 0.5));
      const [px, pz] = axis(y);
      // Off the axis, on a side new each time; smaller the farther out.
      const ja = rnd() * 2 * Math.PI, jr = P.jit * r0 * Math.sqrt(rnd()), rr = r * (1 - P.jitR * jr / (P.jit * r0 + 1e-9));
      core.push({ x: px + jr * Math.cos(ja), y, z: pz + jr * Math.sin(ja), r: rr, k: P.kCore * rr, g: 0, ax: fx, az: fz });
      y += P.step * r * (0.7 + 0.6 * rnd());
    }
    const yc = Math.max(tTop - rc, base + 0.3 * rc), [px, pz] = axis(yc);
    core.push({ x: px, y: yc, z: pz, r: rc, k: P.kCore * rc, g: 0, ax: fx, az: fz });
  });
  // The trunk: the turrets rise out of one mass.
  for (let i = 0; i < P.trunk; i++) {
    const a = rnd() * 2 * Math.PI, rr = 0.35 * reach * Math.sqrt(rnd());
    const r = Math.min(P.trunkR * W * (0.8 + 0.4 * rnd()), 0.5 * P.trunkTop * H + 0.2 * W);
    const y = Math.max(base + P.trunkTop * H - r, base + 0.2 * r);
    core.push({ x: cx + rr * Math.cos(a) + lx * (y - base), y, z: cz + rr * Math.sin(a) + lz * (y - base), r, k: P.kCore * r, g: 0, ax: cx, az: cz });
  }
  // The apron: wide low lobes and small heaps round the foot, at random
  // (not a ring: from above, a ring drew the white of a fried egg).
  const nF = Math.round(P.feet * W), nS = Math.round(P.sats * W);
  for (let i = 0; i < nF + nS; i++) {
    const sat = i >= nF;
    const a = rnd() * 2 * Math.PI;
    const rr = sat ? reach + W * (0.05 + 0.3 * rnd()) : reach * (0.5 + 0.5 * rnd()) + 0.5 * W * P.footOut * 0.3 * rnd();
    const r = W * (sat ? P.satR0 + P.satR1 * rnd() : P.footR0 + P.footR1 * rnd());
    const x = cx + rr * Math.cos(a), z = cz + rr * Math.sin(a);
    core.push({ x, y: base + (sat ? 0.35 : 0.15) * r, z, r, k: P.kCore * r, g: 0, ax: cx, az: cz });
  }
  for (const l of core) out.push(l);
  // Children, generation by generation (bigger first), with a test that
  // skips a child buried deep inside a bigger lobe.
  const cell = 0.25, hash = new Map();
  // (The primes of the hash of a cell: Teschner, Heidelberger, Mueller,
  // Pomeranets and Gross, "Optimized Spatial Hashing for Collision Detection
  // of Deformable Objects", VMV 2003.)
  const key = (i, j, k) => (i * 73856093) ^ (j * 19349663) ^ (k * 83492791);
  // (A lobe is put in every cell within its radius, and with a spacing
  // between siblings (overlap < 0) within that much more of its own.)
  const pad = Math.max(-P.overlap, 0);
  const put = (l, idx) => {
    const e = l.r * (1 + pad / 0.8);
    const i0 = Math.floor((l.x - e) / cell), i1 = Math.floor((l.x + e) / cell);
    const j0 = Math.floor((l.y - e) / cell), j1 = Math.floor((l.y + e) / cell);
    const k0 = Math.floor((l.z - e) / cell), k1 = Math.floor((l.z + e) / cell);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (let k = k0; k <= k1; k++) {
      const h = key(i, j, k);
      let a = hash.get(h);
      if (!a) hash.set(h, a = []);
      a.push(idx);
    }
  };
  const buried = (x, y, z, rc, parent) => {
    const a = hash.get(key(Math.floor(x / cell), Math.floor(y / cell), Math.floor(z / cell)));
    if (!a) return false;
    for (const i of a) {
      const l = out[i];
      if (l === parent || l.r < 0.8 * rc) continue;
      const dx = x - l.x, dy = y - l.y, dz = z - l.z;
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) - l.r;
      if (d < -P.overlap * rc) return true;
    }
    return false;
  };
  out.forEach(put);
  let gen = core;
  for (let g = 0; g < 12 && gen.length; g++) {
    const rm = g === 0 ? P.g1r0 + 0.5 * P.g1r1 : P.ratio0 + 0.5 * P.ratio1, next = [], nk = Math.round((g === 0 ? P.g1cov : P.cov) * 4 / (rm * rm) * 0.8);
    for (const p of gen) {
      // Outward: away from the axis of its body.
      let ox = p.x - (p.ax + lx * (p.y - base)), oz = p.z - (p.az + lz * (p.y - base));
      const ol = Math.hypot(ox, oz) || 1;
      ox /= ol; oz /= ol;
      const low = (p.y - base) / H < P.flatLow;
      for (let c = 0; c < nk; c++) {
        const rc = p.r * (g === 0 ? P.g1r0 + P.g1r1 * rnd() : P.ratio0 + P.ratio1 * rnd());
        let nx, ny, nz;
        for (let t = 0; t < 8; t++) {
          // A direction on the sphere, biased up and out.
          const u = 2 * rnd() - 1, ph = 2 * Math.PI * rnd(), s = Math.sqrt(1 - u * u);
          nx = s * Math.cos(ph) + P.out * ox; ny = u + P.up; nz = s * Math.sin(ph) + P.out * oz;
          const nl = Math.hypot(nx, ny, nz) || 1;
          nx /= nl; ny /= nl; nz /= nl;
          if (ny >= (low ? -0.15 : P.minY)) break;
        }
        if (rc < P.rmin) { rnd(); continue; }
        if (ny < (low ? -0.15 : P.minY)) continue;
        const dd = p.r - (g === 0 ? P.g1sink : P.sink) * rc;
        const x = p.x + nx * dd + lx * ny * dd * 0.5, y = p.y + ny * dd, z = p.z + nz * dd + lz * ny * dd * 0.5;
        if (y - rc < base - 0.02) continue;
        if (buried(x, y, z, rc, p)) continue;
        const l = { x, y, z, r: rc, k: P.kKid * rc, g: g + 1, ax: p.ax, az: p.az };
        put(l, out.length);
        out.push(l);
        next.push(l);
      }
    }
    gen = next;
  }
  return out;
}

// ---- The plumbing: towers from the weather map, bricks, tiles ----
// The main thread sends: `start` (the levels), `map` (the warped weather
// map for a cloud amount), `eye` (the place, for the order of work), `want`
// (tiles a level shows now: the rest are dropped). It gets `tile`s back.
const CB = 0.6, CT = 5.0, WEATHER_KM = 256, LEAN = [0.06, 0.03];
const R = 0.25, S = 1000, FAR = Math.round(R * S);   // the distance kept, km; Int16 in m
const CELL = 2;                                      // a world cell: at most one tower
const BASE_UP = 0.08;                                // a tower's base over the level of the bases, km
const NC = WEATHER_KM / CELL;
const SIZE_P = 2.0, H_LAW = [0.6, 4.0], W_RATIO = 1.25, H_W = 0.45, WH_K = 0.4, W_MIN = 1.3, W_MAX = 5.0;  // the law of sizes (see towersOf)
const H_MIN = 0.8, TOWER_H = 1.5;                    // the least height of the field's heap that makes a tower, km; a tower's
const GROUP_KM = 12.8;                               // the groups of big towers: a field of this lattice
const OWN_IN = 0.3, OWN_OUT = 0.55, OWN_PAD = 0.3;  // the field's heap gives way within OWN_IN W of a middle, less out to OWN_OUT W + OWN_PAD km
// A smooth random field over the map, 0 to 1 (value noise on a lattice of
// GROUP_KM, which divides the map).
const groupAt = (x, z) => {
  const n = Math.round(WEATHER_KM / GROUP_KM), u = wrapKm(x) / GROUP_KM, v = wrapKm(z) / GROUP_KM;
  const i = Math.floor(u), j = Math.floor(v), fu = sstep(0, 1, u - i), fv = sstep(0, 1, v - j);
  const h = (a, b) => hash2(((a % n) + n) % n, ((b % n) + n) % n, 101) / 4294967296;
  return (h(i, j) * (1 - fu) + h(i + 1, j) * fu) * (1 - fv) + (h(i, j + 1) * (1 - fu) + h(i + 1, j + 1) * fu) * fv;
};
let cfg = null;              // { T, levels: [{ V, nz }] }
let towers = null, cells = null, mapGen = -1, maxReach = 0;
const lobeCache = new Map(), brickCache = new Map();
let lobeBytes = 0, brickBytes = 0;
const LOBE_BUDGET = 48e6, BRICK_BUDGET = 96e6;
let eye = [0, 0];
let wanted = [];             // per level: Map key -> [tx, tz]
// The map each level's list was made for (the page's gen of it). A list made
// for a newer map waits until that map comes: the page asks for the tiles of
// a new map at once, but the map comes only when its read-back ends; tiles
// made meanwhile from the old towers would be dropped, and not asked again.
let wantGen = [];
const stats = { towers: 0, lobesMs: 0, lobes: 0, bricksMs: 0, bricks: 0, tiles: 0, tilesMs: 0, seedsMs: 0 };

const wrapKm = x => ((x % WEATHER_KM) + WEATHER_KM) % WEATHER_KM;
const near = d => d - WEATHER_KM * Math.round(d / WEATHER_KM);
const sstep = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const hash2 = (i, j, s) => {
  let h = Math.imul(i, 0x27d4eb2d) ^ Math.imul(j + 0x165667b1, 0x9e3779b1) ^ Math.imul(s, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 0;
};

// The towers of the whole map, from the warped weather map (RGBA8, n
// texels a side) at the cloud amount c: per world cell, the place where the
// present field's heap stands highest (at least H_MIN over the level of
// the bases, and over the sheet; or its tower is strong, TOWER_H per unit),
// if no place within 1.5 km stands higher.
// (Seeded at the field's towers only, the grids held a few of the big heaps,
// and the field's own heaps, as high round them, hid them.) The base
// follows the field's level there; width and top a law of sizes (below).
function towersOf(px, n, c) {
  const t0 = performance.now();
  const km = WEATHER_KM / n, hv = new Float32Array(n * n), tv = new Float32Array(n * n);
  // The cover over some 20 km (the shader's `region`, a mip of uWeather).
  const B = 32, nb = n / B, reg = new Float32Array(nb * nb);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) reg[(j / B | 0) * nb + (i / B | 0)] += px[4 * (j * n + i)] / 255 / (B * B);
  const regionAt = (i, j) => {
    const u = (i + 0.5) / B - 0.5, v = (j + 0.5) / B - 0.5, i0 = Math.floor(u), j0 = Math.floor(v), fu = u - i0, fv = v - j0;
    const at = (a, b) => reg[(((b % nb) + nb) % nb) * nb + (((a % nb) + nb) % nb)];
    return (at(i0, j0) * (1 - fu) + at(i0 + 1, j0) * fu) * (1 - fv) + (at(i0, j0 + 1) * (1 - fu) + at(i0 + 1, j0 + 1) * fu) * fv;
  };
  // Per texel, as the shader's cloudShape: the height of the field's heap
  // over its level (km) without its tower (the grids take that), less the
  // sheet's top; and the strength of the field's tower (tv).
  const towersK = sstep(0.1, 0.5, c);
  const poly = c * (1.181 - c * (2.197 - 2.102 * c)) - 0.1 * (1 - sstep(0.1, 0.35, c));
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const o = j * n + i, r = px[4 * o] / 255, G = px[4 * o + 1] / 255;
    const region = regionAt(i, j), level1 = sstep(0.85, 1, c + 0.3 * (region - 0.5));
    const tg = Math.min(Math.max((G - 0.34) / 0.4, 0), 1);
    if (tg > 0) tv[o] = tg * (2 - tg) * towersK * (1 - 0.8 * level1);
    const e = 3 * (r - 0.936 + poly);
    if (e <= 0) continue;
    const sheet = sstep(0.57, 0.82, c + 0.6 * (region - 0.5));
    const topS = 0.12 + 0.32 * G * (1 - 0.6 * Math.max(sstep(2.6, 3.6, e), level1));
    const thick = 1 - Math.exp(-e / 1.6), swell = 0.25 * Math.min(Math.max(e - 1, 0), 1 - 0.6 * sheet);
    const sheetTop = sheet > 0 ? (0.25 + 0.35 * sheet) * (0.8 + 0.4 * sstep(0.3, 0.7, r)) : 0;
    hv[o] = Math.max((CT - CB) * topS * Math.cbrt(thick + swell) - sheetTop, 0);
  }
  // Where the field draws a tower, as high as its tower is strong (on a
  // deck its heaps hardly stand over the sheet); none where the heap is
  // lower than H_MIN and no tower (bodies in all the low heaps cost 5 ms of
  // the frame under them, at 0.3 km).
  for (let o = 0; o < n * n; o++) hv[o] = hv[o] >= H_MIN || tv[o] > 0.2 ? Math.max(hv[o], TOWER_H * tv[o]) : 0;
  const at = (a, b) => (((b % n) + n) % n) * n + (((a % n) + n) % n);
  const cellT = CELL / km, nms = Math.round(1.5 / km), foot = Math.round(2.5 / km);
  const list = [], grid = new Array(NC * NC).fill(null);
  for (let cj = 0; cj < NC; cj++) for (let ci = 0; ci < NC; ci++) {
    let best = -1, bv = 0;
    for (let j = cj * cellT; j < (cj + 1) * cellT; j++) for (let i = ci * cellT; i < (ci + 1) * cellT; i++) if (hv[j * n + i] > bv) { bv = hv[j * n + i]; best = j * n + i; }
    if (best < 0) continue;
    const bi = best % n, bj = (best / n) | 0;
    let keep = true;
    for (let dj = -nms; dj <= nms && keep; dj++) for (let di = -nms; di <= nms; di++) {
      const v = hv[at(bi + di, bj + dj)];
      // (Ties go to the lower index: two equal places make one tower.)
      if (v > bv || (v === bv && (dj < 0 || (dj === 0 && di < 0)))) { keep = false; break; }
    }
    if (!keep) continue;
    const b = px[4 * best + 2] / 255;
    const level = CB + 0.15 + 0.15 * sstep(0.25, 0.75, b);
    const seed = hash2(ci, cj, 7);
    // At least as wide as the field's heap there (the place within 2.5 km
    // where it stands over WH_K as high as here), and as high: the heap
    // gives way to it (own, below). (Narrower, a tower stood in a crater, or
    // the heap round it hid it.)
    let cnt = 0;
    for (let dj = -foot; dj <= foot; dj++) for (let di = -foot; di <= foot; di++) if (di * di + dj * dj <= foot * foot && hv[at(bi + di, bj + dj)] > WH_K * bv) cnt++;
    const Wh = 2 * Math.sqrt(cnt * km * km / Math.PI);
    // Its height: at least the heap's, more by a law of sizes (most small,
    // some middle, few big: u = rnd^SIZE_P), the big ones in groups
    // (GROUP_KM, a smooth random field) and where the field's tower is
    // strong. As wide as tall or wider (W_RATIO): sized from the area of the
    // field's tower round the place, 1 to 3.5 km, with the field's top, they
    // were as tall as wide, and their turrets were posts with round heads.
    let tmax = 0;
    for (let dj = -nms; dj <= nms; dj++) for (let di = -nms; di <= nms; di++) tmax = Math.max(tmax, tv[at(bi + di, bj + dj)]);
    const rr = (seed >>> 20) / 4096, str = Math.min(Math.max(tmax / 0.8, 0), 1);
    const u = Math.pow(rr, SIZE_P) * (0.35 + 0.65 * sstep(0.25, 0.75, groupAt(bi * km, bj * km))) * (0.3 + 0.7 * str);
    const Hl = H_LAW[0] + (H_LAW[1] - H_LAW[0]) * u;
    const W = Math.min(Math.max(Wh, W_RATIO * Hl, W_MIN), W_MAX);
    // (No lower than H_W of its width: flat wide bodies were a sheet of
    // stratocumulus from below.)
    const H = Math.min(Math.max(hv[best], Hl, H_W * W), CT - 0.35 - level - BASE_UP);
    const top = level + BASE_UP + H;
    const t = {
      id: cj * NC + ci, x: wrapKm((bi + 0.5) * km + ((seed & 1023) / 1023 - 0.5) * 0.2), z: wrapKm((bj + 0.5) * km + (((seed >>> 10) & 1023) / 1023 - 0.5) * 0.2),
      // (Its flat base a little over the level of the present field's bases:
      // where the heap under it is drawn, that heap's base shows, not a disc.)
      W, top, base: level + BASE_UP, seed,
    };
    // How far from its middle its lobes may reach: a bound, before they are
    // made, for the tiles it may touch (lobesFor counts a tower whose lobes
    // go past it, stats.over: the tiles would cut it).
    t.reach = 1.5 * W + 0.2 * (top - level) + 0.3;
    list.push(t);
  }
  // A small tower within the foot of a bigger one gives way (biggest first).
  list.sort((a, b) => b.W - a.W);
  const kept = [];
  for (const t of list) {
    if (kept.some(k => Math.hypot(near(t.x - k.x), near(t.z - k.z)) < OWN_IN * k.W + 0.25 * t.W)) continue;
    kept.push(t);
    maxReach = Math.max(maxReach, t.reach);
    grid[t.id] = t;
  }
  stats.seedsMs = Math.round(performance.now() - t0);
  return { list: kept, grid };
}

// The map of the tops (RGBA8, nTops texels a side over the map: the
// highest place where the march may meet cloud within 1, 2, 4 and 8
// texels), as the main thread read it back: raised over each tower when its
// lobes are made, before any tile shows it, and the part sent back.
let tops = null, nTops = 0;
const TOPS_OUT = 0.17;
function raiseTops(t, L) {
  const n = nTops, km = WEATHER_KM / n, M = 8;
  const i0 = Math.floor((t.x + L.box[0]) / km) - M, i1 = Math.ceil((t.x + L.box[1]) / km) + M;
  const j0 = Math.floor((t.z + L.box[2]) / km) - M, j1 = Math.ceil((t.z + L.box[3]) / km) + M;
  const w = i1 - i0, h = j1 - j0, g = new Uint8Array(w * h);
  // The top of each lobe over the texels it covers (TOPS_OUT more: the
  // reach of the detail over the surface, GRID_OUT in fs; rounded up).
  const f = L.lobes;
  for (let q = 0; q < L.n; q++) {
    const x = t.x + f[5 * q], z = t.z + f[5 * q + 2], r = f[5 * q + 3];
    const v = Math.min(255, Math.ceil((f[5 * q + 1] + r + TOPS_OUT - CB) / (CT - CB) * 255));
    for (let j = Math.floor((z - r) / km); j <= Math.floor((z + r) / km); j++) for (let i = Math.floor((x - r) / km); i <= Math.floor((x + r) / km); i++) {
      const o = (j - j0) * w + i - i0;
      if (g[o] < v) g[o] = v;
    }
  }
  // The highest within 1, 2, 4 and 8 texels (squares, as the shader's).
  const out = new Uint8Array(w * h * 4), a = new Uint8Array(w * h), b = new Uint8Array(w * h);
  let cur = g, r0 = 0;
  [1, 2, 4, 8].forEach((k, c) => {
    const d = k - r0;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let m = 0;
      for (let e = Math.max(0, i - d); e <= Math.min(w - 1, i + d); e++) if (cur[j * w + e] > m) m = cur[j * w + e];
      a[j * w + i] = m;
    }
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let m = 0;
      for (let e = Math.max(0, j - d); e <= Math.min(h - 1, j + d); e++) if (a[e * w + i] > m) m = a[e * w + i];
      b[j * w + i] = m;
    }
    for (let o = 0; o < w * h; o++) out[4 * o + c] = b[o];
    cur = b.slice();
    r0 = k;
  });
  // Into the copy, modulo the map, and sent back in parts that do not wrap.
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const o = 4 * ((((j0 + j) % n) + n) % n * n + (((i0 + i) % n) + n) % n);
    for (let c = 0; c < 4; c++) if (tops[o + c] < out[4 * (j * w + i) + c]) tops[o + c] = out[4 * (j * w + i) + c];
  }
  const xs = [((i0 % n) + n) % n], ys = [((j0 % n) + n) % n];
  const parts = [];
  for (const [x, ww] of xs[0] + w > n ? [[xs[0], n - xs[0]], [0, w - (n - xs[0])]] : [[xs[0], w]])
    for (const [y, hh] of ys[0] + h > n ? [[ys[0], n - ys[0]], [0, h - (n - ys[0])]] : [[ys[0], h]]) {
      const px = new Uint8Array(ww * hh * 4);
      for (let j = 0; j < hh; j++) px.set(tops.subarray(4 * ((y + j) * n + x), 4 * ((y + j) * n + x + ww)), 4 * j * ww);
      parts.push({ x, y, w: ww, h: hh, px });
    }
  postMessage({ type: 'tops', gen: mapGen, parts }, parts.map(p => p.px.buffer));
}

// A tower's lobes (cached): Float32Array of x, y, z, r, k from its middle,
// those of at least 0.6 of the finest voxel; and their box.
function lobesFor(t) {
  let e = lobeCache.get(t.id);
  if (e) { lobeCache.delete(t.id); lobeCache.set(t.id, e); return e; }
  const t0 = performance.now();
  const V0 = cfg.levels[0].V;
  const all = lobesOf({ x: 0, z: 0, W: t.W, top: t.top, base: t.base, seed: t.seed }, { ...P, rmin: Math.max(P.rmin, 0.6 * V0) }, LEAN);
  const kept = all.filter(l => l.r >= 0.6 * V0).sort((a, b) => b.r - a.r);
  const f = new Float32Array(5 * kept.length);
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, y1 = 0;
  kept.forEach((l, i) => {
    f.set([l.x, l.y, l.z, l.r, l.k], 5 * i);
    x0 = Math.min(x0, l.x - l.r); x1 = Math.max(x1, l.x + l.r);
    z0 = Math.min(z0, l.z - l.r); z1 = Math.max(z1, l.z + l.r);
    y1 = Math.max(y1, l.y + l.r);
  });
  e = { lobes: f, n: kept.length, box: [x0, x1, z0, z1], top: Math.min(y1, CT), bytes: f.byteLength };
  if (Math.max(-x0, x1, -z0, z1) > t.reach) stats.over = (stats.over || 0) + 1;
  if (!t.raised) {
    raiseTops(t, e);
    t.raised = true;
  }
  lobeCache.set(t.id, e);
  lobeBytes += e.bytes;
  stats.lobesMs += performance.now() - t0;
  stats.lobes++;
  while (lobeBytes > LOBE_BUDGET && lobeCache.size > 1) {
    const [k, v] = lobeCache.entries().next().value;
    lobeCache.delete(k);
    lobeBytes -= v.bytes;
  }
  return e;
}

// A tower's brick at a level: its box in the level's voxels on the map
// (i0, j0, k0 may be off the map: tiles take them modulo its size), the
// distance under its surface coded in 8 bits (0.5 at it, +-R), and each
// column's top (0: none; else 1 + 255 of its share of CB to CT, rounded up).
function brickFor(t, l) {
  const key = t.id * 4 + l;
  let b = brickCache.get(key);
  if (b) { brickCache.delete(key); brickCache.set(key, b); return b; }
  const L = lobesFor(t);
  const t0 = performance.now();
  const { V, nz } = cfg.levels[l], vz = (CT - CB) / nz;
  const e = R + 1.5 * V;
  const i0 = Math.floor((t.x + L.box[0] - e) / V), i1 = Math.ceil((t.x + L.box[1] + e) / V);
  const j0 = Math.floor((t.z + L.box[2] - e) / V), j1 = Math.ceil((t.z + L.box[3] + e) / V);
  const k1 = Math.min(nz, Math.ceil((L.top + e - CB) / vz));
  const nx = i1 - i0, ny = j1 - j0, nk = k1;
  const d = new Int16Array(nx * ny * nk).fill(FAR);
  const band0 = 1.5 * Math.max(V, vz);
  const f = L.lobes;
  for (let q = 0; q < L.n; q++) {
    const r = f[5 * q + 3];
    if (r < 0.6 * V) break;   // (sorted by size)

// Felzenszwalb and Huttenlocher's transform of squared distances, along x, z

// The towers whose bound reaches within m km of the box [x0, x1) x [z0, z1)
// (km on the map, x0 may be off it).

const share = h => Math.min(255, Math.max(0, Math.ceil((h - CB) / (CT - CB) * 255)));

<script>
// Background sound, made in the browser with the Web Audio API: no files, no
// samples. Every part is noise or a tone, shaped by filters to stand for one
// source of the real sound. SkySound.engine(ctx) builds the graph on any
// BaseAudioContext (the tests render it offline); SkySound.attach(...) runs
// it in the page. It never asks for a frame: the page may stop drawing while
// the sound goes on.
const SkySound = (() => {
  'use strict';
  const KINDS = ['off', 'airliner', 'airliner-whine', 'wind'];
  // Strength of the engines' high tones in the airliner with engine whine
  // (1: soft, the level chosen by ear; 2: 6 dB stronger).
  const WHINE = 1;
  // The engines run at cruise thrust whatever the sliders say: the speed
  // slider is how fast the view goes by, not a throttle, and an airliner's
  // engines hold a steady speed in cruise. N1, the fan's speed as a fraction
  // of full, is 0.9; the fan shaft turns at 56 Hz.
  const N1 = 0.9, SHAFT = 62 * N1;
  const FADE = 0.15;          // time constant of fades and crossfades, s
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  const between = (lo, hi) => lo + (hi - lo) * Math.random();
  // Moves an AudioParam to a value: at once (tau 0), or gliding towards it.
  function to(param, value, when, tau) {
    if (tau > 0) param.setTargetAtTime(value, when, tau); else param.setValueAtTime(value, when);
  }

  // What the sound needs to know of the flight, from the altitude (km) and the
  // speed (km/h). Density falls with a scale height of 8 km.
  function flight(alt, speed) {
    const sigma = Math.exp(-alt / 8), ref = Math.exp(-11 / 8);
    // Dynamic pressure, relative to the cruise (11 km, 900 km/h), with a light
    // wind that is there even when the aircraft stands still.
    const q = sigma / ref * ((speed / 900) ** 2 + 0.004);
    // The rush of air grows with the dynamic pressure, compressed (0.7 of its
    // level in dB) and softly held below +9 dB, so that low and fast stays
    // bearable: -17 dB standing still, -3 dB low and slow, +5 dB at 2400 km/h.
    const db = 7 * Math.log10(q);

      sigma,
      rush: 10 ** ((db > 0 ? 9 * Math.tanh(db / 9) : db) / 20),
      // A faster flow is brighter: the frequencies of the turbulence scale
      // with the speed.
      bright: Math.sqrt((speed + 60) / 960),
      // Thin air carries less of the low end: a shelf under 250 Hz, 0 dB at
      // 11 km, up to +7 dB near the ground.
      body: Math.min(7, Math.max(-3, 4 * Math.log2(sigma / ref))),
    };

  //   play(kind, when): crossfade to a variation ('off' fades out);
  //   fly(alt, speed, when, glide): follow the flight (glide false: at once);
  //   volume(v, when, glide): 0 to 1;
  //   hush(quiet, when): fade the whole output out (true) or back in;
  //   tick(until): schedule the slow random movement (gusts, the beat of the
  //   engines) up to the time until. In the page, a timer calls it.

    // correlated with left: some width, and safe in mono), times random signs

    // it repeats only when both loops line up again, which is never in
    // practice; one looped buffer alone would repeat every 11 s.

        l[i] = u * Math.cos(w);
        r[i] = 0.6 * l[i] + 0.8 * u * Math.sin(w);

    // the compressor's knee -> a high-pass at 25 Hz (nothing below is heard,
    // and it would only work the compressor) -> a compressor with a short
    // look-ahead, which holds the loud states (low and fast) down -> trim ->

        out, chain,

        gain(v = 0) { const g = ctx.createGain(); g.gain.value = v; return g; },

        // A branch of noise through the given nodes, into the voice.

        // none: a sine) at the given frequency.

          // the graph and its filters stop running.
          const timer = ctx.createConstantSource();
          timer.offset.value = 0;
          timer.connect(out.gain);
          timer.onended = () => { for (const [src, dst] of taps) src.disconnect(dst); out.disconnect(); };
          timer.start(when);
          timer.stop(when + 0.01);

    // The high tones of two turbofans heard through the cabin wall, for the
    // airliner with engine whine; strength scales their level. Per engine,
    // panned as the low drone:
    //   - the fan's blade-passing tone (24 blades: 1340 Hz) with its second
    //     and third harmonics;
    //   - "buzz-saw": at high power the fan's tips pass the speed of sound and
    //     their shocks, a little unequal from blade to blade, give tones at
    //     every multiple of the shaft's speed; here orders 8 to 40, of
    //     irregular height, at half strength (they come in from N1 0.8 and
    //     are full at 1);
    //   - the high-pressure compressor's whine, on the second shaft (N2 0.96):
    //     3.5 kHz;
    // and, shared, a narrow band of noise around the fan tone and around the
    // whine. The wall's mass law takes off the top: all of it is low-passed
    // at 3.5 kHz. Each line wanders a few cents, slowly, both engines
    // together; the second runs 0.2 to 1 cent faster, so that the fan's line
    // beats once in 1.3 to 6.5 s (the whine at 3.5 kHz, 0.4 to 2 times a
    // second).
    function highTones(k, strength) {
      const bus = k.gain(strength * N1 ** 3), wall = k.filter('lowpass', 3500, 0.5);
      k.chain(bus, wall, k.out);
      const whine = 3600 * (0.6 + 0.4 * N1);
      const engines = [-0.35, 0.35].map(p => {
        const pan = k.pan(p);
        pan.connect(bus);
        const fan = k.tone([1, 0.45, 0.25], 24 * SHAFT);
        k.chain(fan, k.gain(0.02), pan);
        const orders = Array.from({ length: 40 }, (_, i) => i < 7 ? 0 : 0.2 + 0.8 * Math.random() ** 2);
        const buzz = k.tone(orders, SHAFT);
        k.chain(buzz, k.filter('bandpass', 1100, 0.6), k.gain(0.015), pan);
        const comp = k.tone(null, whine);
        k.chain(comp, k.gain(0.004), pan);
        return [fan, buzz, comp];
      });
      k.chain(k.late(k.filter('bandpass', 24 * SHAFT, 18)), k.gain(0.05), bus);
      k.chain(k.late(k.filter('bandpass', whine, 25)), k.gain(0.05), bus);
      return [{ every: [3, 8], at: (t, tau) => {
        const c = 4 * gauss(), apart = between(0.2, 1);
        engines.forEach((tones, i) => { for (const o of tones) o.detune.setTargetAtTime(c + i * apart, t, tau); });
      } }];
    }

    // The variations. Each returns its kit, set(f, when, glide) to follow the
    // flight, and tracks: the slow random movement, as { every: [lo, hi]
    // seconds between knots, at(t, tau): schedule one knot }.
    const voices = {
      // The cabin of an airliner at cruise. whine > 0 adds the engines' high
      // tones at that strength.
      airliner(whine = 0) {
        const k = kit();
        // The rush of the boundary layer through the fuselage: most of the
        // noise in a cabin. The wall passes the low frequencies and stops the
        // high ones, so the noise is low-passed twice; it brightens with speed.
        const rushLp = k.filter('lowpass', 450, 0.55), rushLp2 = k.filter('lowpass', 1500, 0.6);
        const shelf = k.filter('lowshelf', 250), rush = k.gain(), drift = k.gain(1);
        k.noise(k.filter('highpass', 40), rushLp, rushLp2, shelf, rush, drift);
        // Low rumble: the airframe shaking in light turbulence, under 100 Hz,
        // in slow swells.
        const rumble = k.gain(), bump = k.gain(1);
        k.noise(k.filter('lowpass', 85, 0.8), rumble, bump);
        // The engines, under the wings behind: the fan shaft's tone and its
        // harmonics, one per engine, panned a little to each side. They run
        // at nearly the same speed, so they beat slowly; the beat wanders.
        const engines = [-0.35, 0.35].map(p => {
          const o = k.tone([1, 0.6, 0.45, 0.3, 0.2, 0.14, 0.1, 0.07, 0.05], SHAFT);
          k.chain(o, k.filter('lowpass', 600), k.gain(0.09 * N1 ** 3), k.pan(p), k.out);
          return o;
        });
        // The fans' whirr: a narrow band of noise at the blade-passing
        // frequency (24 blades), faint through the wall.
        k.noise(k.filter('bandpass', 24 * SHAFT, 8), k.gain(0.025 * N1 ** 4));
        // Air conditioning: a steady hiss from the vents, 2 to 7 kHz.
        k.noise(k.filter('highpass', 1800), k.filter('lowpass', 7000), k.gain(0.0035));
        return {
          k,
          // Only the air follows the flight; the engines keep their cruise.
          set(f, when, glide) {
            to(rush.gain, 0.6 * f.rush, when, glide && 0.4);
            to(rushLp.frequency, 450 * f.bright, when, glide && 0.4);
            to(rushLp2.frequency, 1500 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.4);
            to(rumble.gain, 0.9 * f.rush * Math.sqrt(f.sigma / 0.25), when, glide && 0.4);
          },
          tracks: [
            // The second engine runs 8 to 22 cents faster: a beat of 0.3 to
            // 0.8 Hz on the shaft tone, more on its harmonics. (The whine's
            // lines keep their own, much smaller mismatch: at this one, the
            // fan tone, 24 times higher, would flutter at 7 to 19 Hz.)
            { every: [4, 10], at: (t, tau) => engines[1].detune.setTargetAtTime(between(8, 22), t, tau) },
            { every: [0.8, 3], at: (t, tau) => bump.gain.setTargetAtTime(Math.exp(0.3 * gauss()), t, tau) },
            { every: [2, 6], at: (t, tau) => drift.gain.setTargetAtTime(Math.exp(0.08 * gauss()), t, tau) },
            ...(whine > 0 ? highTones(k, whine) : []),
          ],
        };
      },
      // The same cabin, with more of the engines' high tones.
      'airliner-whine': () => voices.airliner(WHINE),

      // No engine: only the air, as from an open window or a glider. Gusts
      // come and go; thin and quiet high up, fuller low down.
      wind() {
        const k = kit();
        // The rush past the ears and the frame, low-passed; a gust makes it
        // both louder and brighter (the filter's detune follows the gust).
        const thin = k.filter('highpass', 60), bodyLp = k.filter('lowpass', 800, 0.5);
        const shelf = k.filter('lowshelf', 250), body = k.gain(), gust = k.gain(1);
        k.noise(thin, bodyLp, shelf, body, gust);
        // Buffeting: the low, irregular push of the wind, under 120 Hz, which
        // rises more than the rest in a strong gust.
        const buffet = k.gain(), heave = k.gain(1);
        k.noise(k.filter('lowpass', 110, 0.7), buffet, heave);
        // Whistles: air on an edge sings at a pitch set by its speed (vortex
        // shedding); two faint narrow bands that come and go.
        const whistles = [1, 1.62].map(r => {
          const bp = k.filter('bandpass', 700 * r, 22), g = k.gain(), on = k.gain(0);
          k.noise(bp, g, on);
          return { r, bp, g, on };
        });
        // Gusts: a slow swell (tens of seconds) with quicker gusts on top,
        // log-normal, so that strong ones are rare.
        let swell = 0;
        return {
          k,
          set(f, when, glide) {
            // Standing still, a breeze remains: 15 dB under the cruise at
            // 11 km, 9 dB under it near the ground.
            const rush = Math.max(f.rush, 0.18 * Math.sqrt(f.sigma / Math.exp(-11 / 8)));
            to(thin.frequency, 40 + 160 * (1 - f.sigma), when, glide && 0.6);
            to(bodyLp.frequency, 800 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.6);
            to(body.gain, 0.55 * rush, when, glide && 0.4);
            to(buffet.gain, 1.3 * rush * f.sigma, when, glide && 0.4);
            for (const w of whistles) {
              to(w.bp.frequency, 700 * w.r * f.bright, when, glide && 0.6);
              to(w.g.gain, 0.25 * rush * Math.sqrt(f.sigma), when, glide && 0.6);
            }
          },
          tracks: [
            { every: [0.8, 2.6], at: (t, tau) => {
              swell = 0.9 * swell + 0.44 * gauss();
              const g = 0.33 * swell + 0.45 * gauss();
              gust.gain.setTargetAtTime(Math.exp(0.6 * g - 0.15), t, tau);
              heave.gain.setTargetAtTime(Math.exp(0.9 * g - 0.3), t, tau);
              bodyLp.detune.setTargetAtTime(300 * g, t, tau);
              for (const w of whistles) w.bp.detune.setTargetAtTime(250 * g, t, tau);
            } },
            ...[0, 1].map(i => ({ every: [1.5, 5], at: (t, tau) =>
              whistles[i].on.gain.setTargetAtTime(Math.random() < 0.35 ? between(0.3, 1) : 0, t, tau) })),
          ],
        };
      },
    };

    let now = flight(11, 900), voice = null, current = 'off';
    const live = new Set();
    return {
      get kind() { return current; },
      play(kind, when) {
        current = voices[kind] ? kind : 'off';
        if (voice) {
          // The old voice fades out, keeps its movement until it is silent,
          // and leaves the graph.
          to(voice.k.out.gain, 0, when, FADE);
          voice.end = when + 8 * FADE;
          voice.k.release(voice.end);
          voice = null;
        }
        if (!voices[kind]) return;
        voice = voices[kind]();
        voice.set(now, when, false);
        voice.end = Infinity;
        for (const tr of voice.tracks) tr.t = when;
        live.add(voice);
        voice.k.out.gain.setValueAtTime(0, when);
        to(voice.k.out.gain, 1, when, FADE);
      },
      fly(alt, speed, when, glide = true) {
        now = flight(alt, speed);
        if (voice) voice.set(now, when, glide);
      },
      volume(v, when, glide = true) { to(level.gain, v * v, when, glide && 0.05); },
      hush(quiet, when) { to(hushed.gain, quiet ? 0 : 1, when, 0.1); },
      tick(until) {
        for (const v of live) {
          const stop = Math.min(until, v.end);
          for (const tr of v.tracks) {
            while (tr.t < stop) {
              const step = between(...tr.every);
              tr.at(tr.t, step / 3);
              tr.t += step;
            }
          }
          if (v.tracks.every(tr => tr.t >= v.end)) live.delete(v);
        }
      },
    };
  }

  // Runs the sound in the page. Takes
  //   select, volume: the controls; their parents are hidden without Web Audio;
  //   note, volumeOut: <output>s, for the note that the sound waits for a
  //   click (waiting(): its text, in the page's language) and the volume;
  //   params: the address's URLSearchParams; aircraft(): { alt, speed } now.
  // Returns follow(), to call when the altitude or the speed changes, and
  // show(), to call when the language changes.
  function attach({ select, volume, note, volumeOut, waiting, params, aircraft }) {
    const AC = window.AudioContext;
    if (!AC) {
      select.parentElement.hidden = volume.parentElement.hidden = true;
      return { follow() {}, show() {} };
    }
    // The address, else the last choice, else off and half volume.
    let stored = [null, null];
    try { stored = [localStorage.getItem('sky.sound'), localStorage.getItem('sky.volume')]; } catch (err) {}
    let kind = [params.get('sound'), stored[0]].find(k => KINDS.includes(k)) || 'off';
    const v = [params.get('volume'), stored[1]].find(x => x !== null && x !== '' && isFinite(x));
    let vol = v === undefined ? 0.5 : Math.min(1, Math.max(0, +v));
    select.value = kind;
    volume.value = vol;
    let ctx = null, eng = null, timer = 0, gen = 0;
    const show = () => {
      note.textContent = kind !== 'off' && (!ctx || ctx.state !== 'running') && !document.hidden ? waiting() : '';
      volumeOut.textContent = Math.round(vol * 100) + ' %';
    };
    const tick = () => eng.tick(ctx.currentTime + 4);
    // Starts or resumes the context and the chosen variation. Browsers allow
    // sound only from a user gesture: this runs from one, or waits for one.
    function wake() {
      if (kind === 'off' || document.hidden) return;
      // Without a gesture yet, a new context would only be refused (and warn).
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const my = ++gen;
      if (!ctx) {
        try { ctx = new AC({ latencyHint: 'playback' }); } catch (err) { return; }
        eng = engine(ctx);
        eng.volume(vol, 0, false);
        eng.fly(aircraft().alt, aircraft().speed, 0, false);
        ctx.onstatechange = show;
      }
      ctx.resume().then(() => {
        if (my !== gen) return;
        const t = ctx.currentTime;
        eng.hush(false, t);
        if (eng.kind !== kind) eng.play(kind, t);
        tick();
        clearInterval(timer);
        timer = setInterval(tick, 1000);
        show();
      }, () => {});
    }
    // Fades out, then suspends: nothing runs while it is off or hidden.
    function sleep(off) {
      const my = ++gen;
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime;
      if (off) eng.play('off', t); else eng.hush(true, t);
      setTimeout(() => {
        if (my !== gen) return;
        clearInterval(timer);
        ctx.suspend();
      }, off ? 1300 : 600);
    }
    for (const type of ['pointerdown', 'pointerup', 'keydown', 'click']) {
      window.addEventListener(type, () => { if (!ctx || ctx.state !== 'running') wake(); }, { capture: true, passive: true });
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) sleep(false); else wake(); show(); });
    select.addEventListener('change', () => {
      kind = select.value;
      try { localStorage.setItem('sky.sound', kind); } catch (err) {}
      if (kind === 'off') sleep(true); else wake();
      show();
    });
    volume.addEventListener('input', () => {
      vol = +volume.value;
      try { localStorage.setItem('sky.volume', vol); } catch (err) {}
      if (eng) eng.volume(vol, ctx.currentTime);
      show();
    });
    show();
    return { follow() { if (eng) eng.fly(aircraft().alt, aircraft().speed, ctx.currentTime); }, show };
  }

  return { engine, attach };
})();
</script>

<script>
(() => {
  'use strict';
  const RAD = Math.PI / 180;
  const OBLIQUITY = 23.44 * RAD;     // tilt of the earth's axis
  const LIGHT_SWAP = [-3, -4.5, -6]; // sun's elevation: the clouds' light from the sun to the moon (see celestial)
  const MOON_AIR = [-14, -11];       // stops of the moonlit air below the sunlit: the moon's light in the air fades in (moonAirFor)
  const FOV = 62 * RAD;
  const AIR_LOOK = 1.4;    // from the air: as deep as photographs taken there
  // The hero's limit, chosen in the panel.
  const HERO_PIXELS = { fhd: 1920 * 1080, wqhd: 2560 * 1440, '4k': 3840 * 2160 };
  let heroPixels = HERO_PIXELS.wqhd;
  // The quality levels: this table sets everything a level changes (see
  // "Quality levels" in docs/design.md). max draws the picture as it was
  // before there were levels; the lower ones draw fewer pixels (pixels: at
  // most this many; dpr: at most this many per CSS pixel), bake smaller
  // textures (body: the heaps' body, texels a side; ice: the cirrus's ice;
  // shadow, column: the clouds' depth maps; warped: the moved weather map;
  // grid: the towers' grids of ?grid=1, texels a side, none: no grids)
  // and take fewer samples in fs (fs: its defines, Q_ at its top). cost:
  // the GPU time of a frame of as many pixels, relative to low's (measured,
  // see docs/development.md), for the automatic choice. minScale: the
  // smallest drawing scale while the view moves (MIN_SCALE if not given;
  // 1: always the canvas's size). keys: the past is read through Keys'
  // six-point cubic, sharper in flight (see "mean").
  const QUALITY = {
    low: { pixels: 0.3e6, dpr: 1, frame: 0.5, airLut: true, meterMs: 200, stale: 1, pass: 1, ciPass: 2, body: 128, ice: 1024, shadow: 256, column: 128, warped: 1024, cost: 1,
      fs: { Q_NV: 6, Q_NSHADE: 3, Q_NFAR: 6, Q_MARCH: '4.0', Q_SHAFTS: 1, Q_SHADOW_TAPS: 2, Q_CI_STEPS: 0, Q_WARP_MIP: '2.0', Q_SKY_NS: 3, Q_MIRROR: 1, Q_LITE: 1, Q_MICRO: 0, Q_HAIRS: 0, Q_SPARKLE: 0, Q_CI_SHADE: 0, Q_GOLD: 1, Q_GAP: 1 } },
    mid: { pixels: 0.9e6, dpr: 1.5, frame: 0.5, pass: 1, body: 128, ice: 2048, shadow: 512, column: 256, warped: 1024, cost: 1.4,
      fs: { Q_NV: 12, Q_NSHADE: 5, Q_NFAR: 10, Q_MARCH: '3.0', Q_SHAFTS: 6, Q_SHADOW_TAPS: 4, Q_CI_STEPS: 6, Q_WARP_MIP: '2.0', Q_SKY_NS: 5, Q_MIRROR: 1, Q_GOLD: 1 } },
    high: { pixels: HERO_PIXELS.fhd, dpr: 2, frame: 1, keys: true, enlarge: true, pass: 1, body: 256, ice: 4096, shadow: 1024, column: 512, warped: 2048, grid: 384, cost: 7,
      fs: { Q_MARCH: '1.2', Q_SHAFTS: 12, Q_SHADOW_TAPS: 6, Q_CI_STEPS: 10 } },
    max: { pixels: Infinity, dpr: 2, frame: 1, minScale: 1, keys: true, enlarge: true, pass: 1, body: 256, ice: 4096, shadow: 1024, column: 512, warped: 2048, grid: 512, cost: 7.3, fs: {} },
  };
  const LEVELS = Object.keys(QUALITY);
  // The size in pixels the picture is drawn at, for a place of cw by ch CSS
  // pixels at the level Q: its device pixels, but at most Q.dpr per CSS
  // pixel, and no more than the drawing limit (heroPixels) or the level's
  // (Q.pixels) allow.
  const drawnSize = (cw, ch, Q) => {
    let scale = Math.min(window.devicePixelRatio || 1, Q.dpr);
    scale = Math.min(scale, Math.sqrt(Math.min(heroPixels, Q.pixels) / (cw * ch)));
    return [Math.max(1, Math.round(cw * scale)), Math.max(1, Math.round(ch * scale))];
  };
  // The canvas's own size for that place, where the level enlarges the
  // picture itself (`enlarge`, see the shader "enlarge"): the device pixels
  // it covers (device: as the browser counts them, else its CSS size times
  // the ratio), at most SHOWN_MAX of them, and never fewer than the
  // picture's (drawn). Elsewhere the picture's: the browser stretches the
  // canvas to the screen, with its plain filter.
  const SHOWN_MAX = 5120 * 2880;
  // The device pixels a canvas covers, as the browser last counted them
  // (size; null until it has, or where it does not count them): one
  // observer for each canvas, however many renderers it has.
  const observed = new WeakMap();
  const devicePixels = canvas => {
    if (observed.has(canvas)) return observed.get(canvas);
    const d = { size: null };
    observed.set(canvas, d);
    try {
      new ResizeObserver(es => {
        const s = es[es.length - 1].devicePixelContentBoxSize;
        if (s && s[0]) d.size = [s[0].inlineSize, s[0].blockSize];
      }).observe(canvas, { box: 'device-pixel-content-box' });
    } catch (err) {}   // (a browser without that box: the ratio serves)
    return d;
  };
  const shownSize = (cw, ch, Q, drawn, device) => {
    const r = window.devicePixelRatio || 1;
    let [w, h] = device && Math.abs(device[0] - cw * r) <= 2 && Math.abs(device[1] - ch * r) <= 2 ? device : [Math.round(cw * r), Math.round(ch * r)];
    if (!Q.enlarge || w * h <= drawn[0] * drawn[1]) return drawn;
    if (w * h > SHOWN_MAX) {
      const s = Math.sqrt(SHOWN_MAX / (w * h));
      [w, h] = [Math.round(w * s), Math.round(h * s)];
    }
    return [Math.max(w, drawn[0]), Math.max(h, drawn[1])];
  };
  const CRUISE = 11;       // km: 36,000 ft
  // The altitude's range, km. The slider is even in km in steps of ALT_STEP
  // up to ALT_LINEAR, then even in log(h) in ALT_LOG_STEPS steps up to
  // ALT_MAX (see the altitude's control, below).
  const ALT_MIN = 0.3, ALT_LINEAR = 13, ALT_MAX = 40, ALT_STEP = 0.02, ALT_LOG_STEPS = 400;
  const NOISE = 128, WEATHER = 1024;   // sizes of the cloud textures
  const SLOPE_MAX = 2;                 // the steepest slope of the weather map kept, per km (see cloudShape)
  // The cirrus's ice: texels a side (on a GPU, and on a software renderer),
  // and per draw; the way of its fibres is a quarter as wide.
  const ICE = 4096, ICE_SOFT = 1024, ICE_PIECE = 512;
  const CI_MAP = 256;   // the cirrus's map: texels a side, over WEATHER_KM
  const WEATHER_KM = 256;  // the weather map repeats after this many km (as in the shader)
  // The view from the aircraft is a mean over frames: of about IN_MOTION
  // while it moves, of all of them at rest. When the light changes, RELIGHT
  // frames take half of each new one, so that the old light is soon gone.
  // SETTLE frames after that, a still picture is clean and the drawing stops.
  const SETTLE = 32, IN_MOTION = 10, RELIGHT = 6;
  const MIN_SCALE = 0.35;  // the smallest picture a slow GPU may draw, relative to the canvas
  // Frames slower than this many ms shrink the picture by sqrt(SCALE_AIM / ms).
  const SCALE_AIM = 30;
  // The exposure follows the picture (see exposureFor and the shader
  // "meter"). Levels are log2 of the luminance before exposure.
  const METER = [64, 36];        // blocks of the picture the meter reads
  const LOG_RANGE = [-34, 18];   // the levels the frames' alpha codes from 0 to 1
  const METER_MS = 100;          // the meter is read at most this often...
  const METER_LAG = 3;           // ...this many frames after its blocks are drawn
  const LOW_SHARE = 0.25;        // the darker quarter of the picture sets the key...
  const KEY = -1.3;              // ...the exposure is KEY - EYE * its level...
  const EYE = 0.85;              // ...opening EYE stops for each stop darker...
  const NIGHT_LEVEL = -25.5;     // ...down to a moonless night sky
  const HIGH_SHARE = 0.03;       // the brightest 3 % of the picture...
  const WHITE = 0.3;             // ...end at this level after exposure (just below white)...
  const DAY_HIGH = 0.5;          // ...when they are this bright or more (daylight),
  const DIM = 0.6;               // ...and DIM stops lower for each stop dimmer
  const BAND = 0.1;              // each share is read as a mean over shares this far on either side (HIGH_BAND for HIGH_SHARE)
  const HIGH_BAND = 0.025;
  const SUN_NEAR = [10, 45];     // by day, blocks this near the sun (degrees) count for less in the highlights...
  const SUN_SHARE = 0.5;         // ...down to this share of their light
  const DEEP = 0.8, MID_GAP = 0.5;        // how far highlights may stop down (exposureFor)...
  const DUSK = [8, 1];           // twilight's exposure takes over as the sun goes from 8 to 1 degrees:
  const DUSK_SHARE = 0.65;       // ...set by the level that the brighter third of the picture passes (the sky):
  const DUSK_MID = -3, DUSK_SHOWN = -0.8;   // ...at DUSK_MID at sunset, it is shown at DUSK_SHOWN...
  const DUSK_POW = 0.7;          // ...falling to the night's along a power of its distance from the night's
  const ABOVE = 3.5, ABOVE_SPAN = 5;   // ...and the highlights may stand up to ABOVE stops above white,
                                       // reached ABOVE_SPAN degrees after twilight's exposure has taken over;
  const PEAK_SHARE = 0.002, PEAK_ABOVE = 1;   // ...but the brightest PEAK_SHARE (the band of glow) at most PEAK_ABOVE
  const DIM_BAND = 0.1, DROP = 1.5;           // stops above white, DIM_BAND lower per stop it is dimmer than
                                              // daylight's highlights, at most DROP lower...
  const GLOW_FREE = 3.5, GLOW_HOLD = 1;       // ...holding the sky down at most GLOW_HOLD stops for each stop the
                                              // band stands more than GLOW_FREE stops above the sky
  const NIGHT_OPEN = 16.75, NIGHT_SKY = -22.5, NIGHT_RATE = 0.5;   // at night the eye opens up at most to NIGHT_OPEN
                                       // when the sky's level is NIGHT_SKY, NIGHT_RATE stops more per stop darker
  const MONO_RATE = [1, 0.8], MONO_STEP = 0.25;  // as the sun goes down, the exposure opens up at most MONO_RATE
                                              // stops for each stop the sky darkens (in steps of MONO_STEP degrees):
  const MONO_DEEP = [-3, -6];                 // the first in civil twilight, the second from the sun MONO_DEEP[1] down
  const ADAPT_FAST = 0.2, ADAPT_SLOW = 0.5;  // s: towards less exposure, towards more
  const ADAPT_STOP = 0.01, ADAPT_START = 0.03;   // stops
  const ADAPT_TRACK = 0.002;                      // stops, in flight

  // ---------- The atmosphere (the same model as the shader) ----------
  // The parameters of the air follow Bruneton's demo (2017, BSD): see THIRD_PARTY_NOTICES.md.
  const RG = 6360, RT = 6460, HR = 8;
  const BETA_M = 0.044, MIE_EXT = 1.05, ALBEDO = 0.07;
  const BL = [1.5, 0.3];  // the boundary layer's top and edge, km (BL in the shader)
  // The aerosol's phase functions: the boundary layer's, two lobes, and the
  // higher aerosol's (MIE_PHASE, MIE_G_UP in the shader).
  const MIE_PHASE = [0.149, 0.932, 0.609], MIE_G_UP = 0.6;
  const ANGSTROM = 1.3;   // the aerosol scatters by the wavelength to the power -ANGSTROM (uMA in the shader)

  // fresh: something has changed; now: the time of the frame, ms.
  // done(share) tells the loading state how far it has come (0 to 1);
  // shown() is called once, when the first picture has gone to the canvas.
  // level(gl): the quality level to draw at (a name of QUALITY), asked once

  // its wall-clock time and its drawing scale (see the automatic choice).
  // pictured(now): each picture that has gone to the canvas.

  async function makeSky(canvas, view, { done, shown, level, timed, gpuTimed, memory, pictured, parts, marks, wake }) {

    // scene make up for most of it. The name, not a timing, decides, so
    // that one renderer always draws the same.
    const info = gl.getExtension('WEBGL_debug_renderer_info');

    let fine = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('EXT_color_buffer_float'));

    // one went until the GPU says it is done: with

    // of its own while the page goes on (a large shader can take seconds).
    const programs = [];

    // and kept in grids that move with the eye (see `grid` below, TGRID in
    // fs, the script "towers"). Only at levels with `grid` texels a side.
    // `,hK:W` after it: the heads of uBody that carve them (GRID_HK, GRID_HW;
    // 2 and 0.12 without it); `,KEY=value` sets GRID_KEY of fs for a test
    // (the detail's and the light's knobs: CR, BW, LOW, OWN, AO).
    const TOWER_GRID = (() => {
      const v = (new URLSearchParams(location.search).get('grid') || '').split(',');
      if (v[0] !== '1' || !Q.grid) return null;
      const N = Q.grid, T = 32, CB = 0.6, CT = 5.0;   // (CB, CT: as in fs)

      // M of `,vM` keeps 31.25 m.)
      const vm = /v([0-9.]+)/.exec(v.slice(1).join(',')), V0 = vm && Math.abs(vm[1] - 62.5) < 1 ? 0.0625 : 0.03125;
      const levels = [V0, 2 * V0, 4 * V0].map(V => ({ V, nz: Math.ceil((CT - CB) / V - 1e-6) }));
      // (Each level's slices, then four of its columns: see uGrid in fs.)
      const z = levels.map((l, i) => levels.slice(0, i).reduce((a, m) => a + m.nz + 4, 0));
      const nzt = levels.reduce((a, m) => a + m.nz + 4, 0);
      // (K must be over 0: the heads are read at a mip level log2(K) finer.)
      const hm = /h([0-9.]+):([0-9.]+)/.exec(v.slice(1).join(',')), hk = hm && +hm[1] > 0;
      // (GRID_V0: the finest voxel, km; GRID_LV: its level as a mip level of the noise's texels.)
      const f = x => x.toFixed(1);
      return { N, T, levels, z, nzt,
        defs: `#define TGRID 1\n#define GRID_V0 ${V0.toFixed(6)}\n#define GRID_LV ${Math.log2(V0 / 0.0625).toFixed(1)}\n#define GRID_N ${f(N)}\n#define GRID_NZ vec3(${levels.map(l => f(l.nz))})\n#define GRID_Z vec3(${z.map(f)})\n#define GRID_NZT ${f(nzt)}\n`
          + (hk ? `#define GRID_HK ${(+hm[1]).toFixed(3)}\n#define GRID_HW ${(+hm[2]).toFixed(3)}\n` : '')

    // a slice a frame made the tables take 1.8 s.

    // while the GPU compiles the programs and draws the textures below; the

    // held the first picture back by 0.4 s.

    // more than one target, and the GPU process waits for it: the ice
