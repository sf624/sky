              (0.25 + 0.9 * sr) * smoothstep(0.15, 0.65, uCirrus) * (0.15 + 0.85 * smoothstep(0.6, 0.95, uCirrus)) * mix(1.0, 0.4 + 0.8 * fields, banded), 0.5 * sf,
              (1.2 - 0.6 * sf) * (1.0 + 1.0 * smoothstep(0.15, 0.85, uCirrus)) * mix(1.0, 0.1 + 0.8 * fields, banded));
}

// The ice over a footprint of many pixels (g1 along the ray's way, g2
// across, in tile units): the mean of eight reads, four along it and two
// across, each at the level of half their spacing. (Read by the anisotropic
// filter, the number of its reads changed with the footprint's shape, and
// the mean jumped there: arcs and straight edges in the glow round the
// sun, issue #54. Eight reads along g1 alone drew the glow out into streaks
// towards the horizon. The glow is some 15 % fainter than the filter's,
// which read finer than the footprint; read as finely, the ice's forms
// stood in the glow several times over, side by side.)
vec4 ciIceWide(vec2 tc, vec2 g1, vec2 g2) {
  float lod = log2(float(textureSize(uIce, 0).x) * max(0.5 * length(g2), 0.25 * length(g1))) - 1.0;
  vec4 s = vec4(0.0);
  for (int i = 0; i < CI_N(8); i++) s += textureLod(uIce, tc + g1 * ((float(i % 4) - 1.5) / 4.0) + g2 * ((float(i / 4) - 0.5) / 2.0), lod);
  return 0.125 * s;
}

float ciDensity(vec2 x, int k, vec2 f1, vec2 f2, bool fibres, bool lite, vec4 fieldsIn, float hairIn) {
  ciBody = 0.0;
  ciVeil = 0.0;
  ciWide = 0.0;
  // (The map and the bands turn with the ice: see ciWarp.)
  vec2 uv = ciWarp(x) / WEATHER_KM;
  float lod = log2(max(max(length(f1), length(f2)), 1.0));
  // The map: how much cirrus this deck has here, and of what kinds. The
  // lower deck reads another place of it and needs more, so that the decks
  // come and go apart. Over some 16 km it tells where there is none, and
  // most of the sky costs little.
  vec2 muv = k == 0 ? uv + vec2(0.383, 0.617) : uv;
  float thr = 0.72 - 0.85 * uCirrus + (k == 0 ? 0.12 : 0.0);
  vec4 cf = textureLod(uCiMap, muv, max(lod, 4.0));
  float near = smoothstep(thr - 0.5, thr - 0.38, k == 0 ? cf.g : cf.r);
  if (near <= 0.0) return 0.0;
  vec4 cm = textureLod(uCiMap, muv, lod);
  float m = smoothstep(thr - 0.3, thr + 0.15, k == 0 ? cm.g : cm.r) * near;
  // The kinds: tails everywhere, fewer where sheets are many; sheets
  // and streets, which come in from 0.2 to 0.75 (so that little cirrus
  // is a few tails, more is streets and sheets); flocks or large systems.
  float sr = smoothstep(0.35, 0.75, cm.b), sf = smoothstep(0.45, 0.8, cm.a);
  // The tufts gather in bands along the wind, some 40 km long and a few
  // km wide, with clear lanes between (noise in the cirrus's frame, over
  // the map), and in fields of some 50 km: seen from below, far off, they
  // close up into long thin bands, as cirrus does at dusk; spread evenly
  // (round 10), they stood in rows like the scales of a fish. As the
  // slider goes up, the bands widen and join.
  // (Without the fibres, for the sun's light over a wide footprint, their
  // mean: the code is left out of those copies.)
  // Little cirrus is tufts in fields of some 50 km (spread: round 10's,
  // kept: from the ground they stand apart with blue between); from 0.3
  // the bands take over, though a field's tufts keep most of their weight.
  // (Read once per deck and pixel, and passed to the march's reads as
  // fieldsIn: they change over tens of km.)
  vec2 gat = lite && fibres ? vec2(0.0) : ciGather(uv, k, !fibres);
  vec4 fsp = !fibres ? vec4(0.55, 0.55, ciEnv(gat.x), gat.y) : lite ? vec4(max(fieldsIn.xyz, 0.0), fieldsIn.w) : ciFields(uv, k, gat);
  ciFieldsOut = fsp;
  float fields = fsp.x, spread = fsp.y, env = fsp.z, tl = ciTailsAt(fsp.w);
  float banded = smoothstep(0.3, 0.6, uCirrus);
  vec4 wk = ciKinds(fields, spread, env, tl, sr, sf, banded);
  // The ice in the deck's frame. The footprint's axes go along, through
  // the mipmaps and the anisotropic filter.
  mat2 J;
  vec2 tc = ciPlace(x, k, J), g1 = J * f1, g2 = J * f2;
  vec4 si = textureGrad(uIce, tc, g1, g2);
  // A tuft of a flock is crisp: its thin edge is cut off and its core
  // made denser, so that it stands as a small, bright, ragged cell.
  vec4 q = si * si;
  q.b *= 2.0 * smoothstep(0.01, 0.08, q.b);
  // The faint trace under the sheets (a streaky veil) shows only near the
  // top of the slider.
  q.g = max(q.g - 0.035 * (1.0 - smoothstep(0.6, 0.95, uCirrus)), 0.0);
  float ice = dot(q, wk), F = 1.0;
  // How dense the ice is, from 0 to 1, for the fibres' strength.
  float dense = 1.0 - exp(-7.0 * ice);
  // The hairs (ciHair, read by the caller at the place it chose): thin
  // ice breaks up into them; dense cores stay soft and milky, with a faint
  // sheen of hairs. Where there is next to no ice (the faint ends of old
  // tails, under 0.005 to 0.04), there are none: there they gathered ice
  // that does not show into lone straight lines across the clear sky
  // (round 13's c2). Little cirrus keeps more of them in its cores (up to
  // 0.75 at 0.15): photographs of thin cirrus show fibrous sweeps.
  F = mix(1.0, hairIn, (1.0 - 0.85 * (1.0 - 0.7 * (1.0 - smoothstep(0.15, 0.45, uCirrus))) * smoothstep(0.25, 0.75, dense)) * smoothstep(0.005, 0.04, ice));
  // The optical depth follows the ice: thin almost everywhere (some 0.05
  // to 0.5 seen straight up), the cores 1 to 2. Little cirrus is the same
  // ice less a floor: the weak tails and the thin edges go first, and
  // what is left fades in from nothing along its own fibres, with no
  // outline of its own. The floor is soft (a square at first), so that the
  // depth grows smoothly from 0. The hairs shape the depth after the floor:
  // laid on the ice before it, at a thin edge their cores alone passed it
  // and stood as short bright dashes beyond the body (from 11 to 12 km,
  // looking out at the edge of a plume). (Where the cirrus gathers does
  // much of what the floor did: at 0.1 (1 - c)^6, as up to round 18, the
  // thin fibrous sides of the few forms of little cirrus were cut off.)
  float c = uCirrus;
  float floor0 = 0.04 * pow(1.0 - c, 6.0) + 0.02 * (1.0 - m), knee = 0.5 * floor0 + 0.004;
  float gain = CI_TAU * (0.6 + 0.8 * c) * (0.3 + 0.7 * m);
  float y = max(ice - floor0, 0.0);
  // Dense cores up to 1.5 times as deep (from 0.04 to 0.3 of ice above the
  // floor): a tuft has a dense white body under its feathered edges, as
  // photographs show; the edges, and so the cover, are as before. (Twice
  // as deep, large plumes near the deck stood as opaque white masses.)
  float d = gain * y * y / (y + knee) * (1.0 + 0.5 * smoothstep(0.04, 0.3, y)) * F;
  // The veil (cirrostratus), and in the bands a body of ice (from 0.2):
  // both have the veil's banded noise as the exponent of their depth, so
  // that a band is long and continuous with streaks along it, and tufts
  // in it, not a row of separate dabs. Seen from below at dusk, the
  // bodies are the long lit bands of photographs: at half the depth, under
  // the sheets' streaks and the tails' commas, they did not show. Both lie
  // where the cirrus gathers, with a thin veil there (from 0.15 to 0.45,
  // CI_THIN, less outside the bands): the milky sky between the bands.
  float vn = fibres && (veilOn0(c, m) > 0.0 || banded > 0.0) ? ciVeilNoise(tc, max(max(length(g1), length(g2)), 1e-7), k == 0 ? 600u : 700u) : 0.0;
  // (It follows the ice's own texture: thinner in the lanes between the
  // patches of strands, so that a deck seen from near it is streaky, not a
  // fog of soft blobs; up to 0.45 by half, 0.5 + 0.75 tex: by all of it, as
  // up to round 18, the shapes of the tails and the streaks were drawn into
  // it. From 0.45 to 0.85 (fk) the space between the forms opens: there
  // only CI_GAP of it, and in full only over ice of CI_FORM.y, so that much
  // cirrus is more and longer strands with blue between them, as
  // photographs show. Evened out over the sky, as up to issue #9, 90 % of
  // a view towards the sun at 0.85 was deeper than 0.78: a milky sheet.)
  // (Far off, the ice over some 0.4 km, read below for the body the light
  // feels: following the ice at the pixel, the veil and the bands took up
  // its strands and stood as streaks.)
  float gl = max(max(length(g1), length(g2)), 1e-7);
  float sb = max(4.0, 0.01 / gl);
  vec4 sbs = lite ? si : textureGrad(uIce, tc, g1 * sb, g2 * sb);
  float fk = smoothstep(0.45, 0.85, c), gap = mix(0.5, CI_GAP, fk);
  float tex = smoothstep(fk * CI_FORM.x, mix(0.08, CI_FORM.y, fk), lite ? ice : dot(sbs * sbs, wk));
  float body = CI_BAND * smoothstep(0.2, 0.6, c) * fields * fields * env * m * exp(2.2 * vn - 0.4) * (gap + (1.25 - gap) * tex);
  // Much cirrus (from 0.7 to 1) closes up: the veil fills the lanes between
  // the bands (where there is ice) and its patches even out, and the thin
  // veil (ciThin) spreads over the whole sky, the even sheet the moon's
  // ring shows on; with lanes, much cirrus at night stood as dark lanes
  // across the moonlit veil, and the ring had no even sheet to show on. It keeps
  // faint streaks (its noise and the hairs weaker by only a little): from
  // 0.55, the even veil wiped out the texture of the decks seen from near
  // the shell (round 14's k5, c2).
  float even = smoothstep(0.7, 1.0, c);
  // The veil is thicker and thinner over tens of km (0.55 to 1.45 of its
  // depth, by the noise of where the tails are: thicker round the
  // generating cells): even all over, a deck seen from just under it was a
  // featureless grey (round 18's k4, s3). Until it evens
  // out, it lies where the cirrus gathers (0.15 of it elsewhere), and comes
  // in sooner there (its floor less by 0.6). The thin veil does not follow
  // the forms: it is the sheet of smooth crystals that draws the halo.
  float vary = 0.55 + 0.9 * smoothstep(-0.3, 0.3, fsp.w);
  float thinAt = ciThin(c) * mix(env * (0.25 + 0.75 * fields), 1.0, even) * m;
  float thin = thinAt * exp((1.6 - 0.8 * even) * vn - 0.3);
  float sheet0 = (veilOn0(c, m) * vary * mix(0.15 + 0.85 * env, 1.0, even) * (0.1 + 1.2 * even + 1.5 * fields * fields) * max(exp((2.2 - 0.6 * even) * vn - 0.4) - 6.0 * pow(1.0 - c, 1.5) * (1.2 - fields) * (1.0 - 0.6 * env), 0.0) * (gap + (1.2 - gap) * tex) + body + thin) * mix(1.0, F, 0.7 - 0.2 * even);
  if (lite) return d + sheet0;
  // The ice over some 0.4 km (or four footprints, if that is wider, sbs,
  // above): the body that the light inside the sheet feels.
  float yb = max(dot(sbs * sbs, wk) - floor0, 0.0);
  float db = gain * yb * yb / (yb + knee);
  // Much cirrus also makes a veil (cirrostratus): the same ice at twice
  // the size, read at another place and softened over some 0.15 km, so
  // that the veil has bands and fibres of its own, thick patches and clear
  // lanes (its depth from some 0.1 to 3), instead of an even sheet. It
  // comes in by degrees from 0.5; from 0.85 a trace of it fills the lanes.
  float s3 = max(1.0, 0.25 / gl);
  vec4 svb = ciIceWide(tc, g1 * s3, g2 * s3);
  // (The depth over some 10 km weighs the kinds by bands and fields evened
  // out by most of the way: by the local ones, the moonlit veil, which
  // follows it, stood in lanes at night.)
  float vb = dot(svb * svb, ciKinds(mix(fields, 0.6, 0.8), mix(spread, 0.6, 0.8), mix(env, 0.6, 0.8), mix(tl, 0.6, 0.8), sr, sf, banded));
  float veilOn = veilOn0(c, m);
  // Without the fibres (the sun's light through the sheet, over a wide
  // footprint) the veil's noise averages out: its median is enough, and
  // the code is left out of those copies.
  float sheet = sheet0;
  float yw = max(vb - floor0, 0.0);
  // The glow round the sun and the moon reads the veil's mean (and the
  // thin veil's).
  float sheetM = veilOn + thinAt;
  ciBody = db + sheet;
  ciVeil = thin * mix(1.0, F, 0.7 - 0.2 * even);
  ciWide = gain * yw * yw / (yw + knee) + sheetM;
  return d + sheet;
}

// The height (km) of the ice of deck k by its age: the heads near the top
// of the deck, the ice lower as it ages (it falls), down to near the
// deck's base by 0.6 of a life. And the spread round that height (the
// standard deviation of a Gaussian, km): wider for older ice.
float ciHeight(int k, float age) {
  vec2 dk = CI_DECK[k];
  return dk.y - (dk.y - dk.x) * (0.15 + 0.7 * clamp(age / 0.6, 0.0, 1.0));
}
float ciSpread(int k, float age) {
  vec2 dk = CI_DECK[k];
  return (dk.y - dk.x) * (0.08 + 0.14 * clamp(age / 0.6, 0.0, 1.0));
}
// The normal distribution's integral, through erf after Winitzki (2008;
// within 1.2e-4), as in the ice shader.
float ciPhi(float z) {
  float x = 0.70710678 * z, x2 = x * x;
  return 0.5 + 0.5 * sign(x) * sqrt(1.0 - exp(-x2 * (1.2732395 + 0.147 * x2) / (1.0 + 0.147 * x2)));
}

// The mean age of the ice of deck k at x on the map, seen over some foot
// km (see iceWay in the ice shader): 0 at its head, 1 at the end of a
// life. Where there is little ice, it tends to 0.3. It is read over
// CI_AGEF at least: the age changes sharply at the edge of each strand of
// a tail over a sheet, and read finer, the place read (the height of that
// ice) jumped with it, drawing hard lines with strings of beads across a
// deck seen from just under it.
const float CI_AGEF = 0.15;
float ciAge(vec2 x, int k, float foot) {
  mat2 J;
  vec2 tc = ciPlace(x, k, J);
  vec2 v = textureLod(uIceWay, tc, log2(max(foot * length(J[0]) * float(textureSize(uIceWay, 0).x), 1.0))).ba;
  // A blend, not a threshold: cut where the weight passed 0.02, the age
  // jumped, and with it the ice's height, which drew hard stepped edges
  // across the decks from just under the shell (round 13's k5).
  return (v.x + 0.3 * 0.03) / (v.y + 0.03);
}

// The depth as the light of the sun feels it, the ice seen over the
// footprint f1, f2 (km on the map): the mean over the shell. (One loop over
// the decks: each call of ciDensity is a copy for the compiler.)
float cirrusDepth(vec2 x, vec2 f1, vec2 f2) {
  float s = 0.0;
  for (int k = 0; k < CI_N(CI_LAYERS); k++) s += ciDensity(x, k, f1, f2, false, true, vec4(-1.0), 1.0);
  return 0.5 * s;
}
float cirrusDepth(vec2 x, float foot) {
  return cirrusDepth(x, vec2(foot, 0.0), vec2(0.0, foot));
}

// Light scattered once by a sheet of depth te along the view, lit through a
// depth ts: the sheet sends te times the mean of exp(-t - ts(t)) along the
// view, lit on the side the eye is on (sameSide), or through it.
float ciOnce(float te, float ts, bool sameSide) {
  return sameSide ? te * (1.0 - exp(-te - ts)) / max(te + ts, 1e-6)
       : abs(te - ts) < 1e-3 ? te * exp(-te) : te * (exp(-ts) - exp(-te)) / (te - ts);
}

// The phase of ice crystals without their diffraction peak: rough compact
// aggregates of columns, which retrievals find in most cirrus (Cole et al.
// 2014), scatter smoothly, with no halo and little light back: a lobe
// forward and a broad part to the side, together of mean cosine 0.59, so
// that with the peak (CI_FWD) the mean cosine is 0.75, as retrieved. (Up to
// round 19, a lobe of 0.7 and one back of -0.3 had 0.55 with the peak: the
// sheet sent three times as much light back as such ice does, and less to
// within 40 degrees of the sun.)
float ciGeo(float mu) {
  return 0.733 * hg(mu, 0.75) + 0.267 * hg(mu, 0.15);
}

// How much a low sun runs along the decks at pc (x, from some 30 degrees
// down: a smoothstep of 1 / sin of its height, by day only), and the depth
// its light meets on its way in there (y, tauP: both decks, read over
// CI_PATH km a unit of that towards the sun, CI_PATHW across; see
// highCloud).
vec2 ciLowSun(vec3 pc) {
  vec3 up = normalize(pc);
  float mus = dot(up, uLight), li = 1.0 / max(abs(mus), 0.15);
  float duskK = smoothstep(2.0, 6.0, li) * smoothstep(0.02, 0.3, uLightI), tauP = 0.0;
  if (duskK > 0.0) {
    vec2 sh = uLight.xz - up.xz * mus;
    sh = length(sh) > 1e-6 ? normalize(sh) : vec2(1.0, 0.0);
    float L = CI_PATH * li;
    vec2 f1 = sh * (0.5 * L), f2 = vec2(-sh.y, sh.x) * CI_PATHW, xs = pc.xz + uDrift + sh * (0.5 * L);
    tauP = 2.0 * cirrusDepth(xs, f1, f2);
  }
  return vec2(duskK, tauP);
}

// The cirrus along the ray (drawn by its own pass, CIRRUS_PASS): what it
// lets through (Th), the distance its light comes from (tHigh; negative:
// none), and three numbers of that light (lk, see cirrusLight).
void highCloud(vec3 o, vec3 d, float tmax, out float Th, out float tHigh, out vec3 lk) {
  Th = 1.0;
  tHigh = -1.0;
  lk = vec3(0.0);
  // Where the ray is inside the shell: t0 to t1. From its base, a ray down
  // leaves it at once (lo.x is 0).
  vec2 lo = eyeSphere(o, d, CI_LO), hi = eyeSphere(o, d, CI_HI);
  float t0, t1;
  if (uAlt < CI_LO) {
    t0 = lo.y; t1 = hi.y;
  } else if (uAlt < CI_HI) {
    t0 = 0.0; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  } else {
    t0 = hi.x; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  }
  t1 = min(t1, tmax);
  if (t0 < 0.0 || t1 <= t0) return;
  float pix = 2.0 * uTan / uRes.y * PASS_PIX * Q_FRAME;
  // Each deck is a volume (CI_DECK) that the ice fills by its age (ciAge,
  // ciHeight): heads near its top, older ice lower down, as it has fallen;
  // its vertical depth (ciDensity) is spread over the height round there
  // (ciSpread), so that a column holds the depth a flat read gives.
  // Far off, each deck is read once, where the ray crosses the height of
  // its ice there (from the age where the ray crosses the deck's middle:
  // one step of parallax mapping), its depth times the way through the
  // deck over the deck's thickness.
  float tau = 0.0, tauV = 0.0, bodyT = 0.0, veilT = 0.0, wideT = 0.0, wtt = 0.0, tSum = 0.0, nSum = 0.0;
  // Near the eye (where the ray enters the shell within CI_NEAR.y km) the
  // shell is marched over CI_NEAR.z km instead; the flat reads then cover
  // only the part of each deck beyond the march. The two are blended (wn)
  // as the shell's distance goes from CI_NEAR.x to CI_NEAR.y.
  // Rays that run low through the shell (under some 10 degrees where they
  // enter it) are read flat too: through the march such a ray crossed
  // several km of ice, which averaged its bands into one smooth sheet (at
  // dusk, from just under the shell, a soft glow where photographs show
  // thin lit bands). The blend goes by the ray's slope, which flight does
  // not change, so it draws no edge that moves.
  vec3 pe = o + d * t0;
#if Q_CI_STEPS > 0
  float wn = (1.0 - smoothstep(CI_NEAR.x, CI_NEAR.y, t0)) * smoothstep(0.12, 0.3, abs(dot(d, normalize(pe))));
#else
  float wn = 0.0;                                    // (no march: every ray is read flat)
#endif
  float tE = wn > 0.0 ? min(t1, t0 + CI_NEAR.z) : t0;
  float tauR = 0.0, wttR = 0.0;
  // Per deck (x: the lower, y: the upper; the fields, one vector a deck).
  vec2 colK = vec2(0.0), bodyK = vec2(0.0);
  vec4 fieldsK0 = vec4(-1.0), fieldsK1 = vec4(-1.0);
  // (A loop the compiler cannot unroll: unrolled, its two copies took
  // Microsoft's compiler, ANGLE on Direct3D 11, half as long again over the
  // cirrus's pass.)
  for (int k = 0; k < CI_N(CI_LAYERS); k++) {
    float lo = CI_DECK[k].x, hi = CI_DECK[k].y, th = hi - lo;
    vec2 el = eyeSphere(o, d, lo), eh = eyeSphere(o, d, hi);
    float s0, s1;
    if (uAlt < lo) {
      s0 = el.y; s1 = eh.y;
    } else if (uAlt < hi) {
      s0 = 0.0; s1 = el.y > el.x && el.x >= 0.0 ? el.x : eh.y;
    } else {
      s0 = eh.x; s1 = el.y > el.x && el.x >= 0.0 ? el.x : eh.y;
    }
    s0 = max(s0, t0);
    s1 = min(s1, t1);
    if (s0 < 0.0 || s1 <= s0) continue;
    float hm = 0.5 * (lo + hi);
    vec2 em = eyeSphere(o, d, hm);
    float tm = uAlt < hm ? em.y : em.x;
    if (tm < s0 || tm > s1) tm = 0.5 * (s0 + s1);
    float hc = ciHeight(k, ciAge((o + d * tm).xz + uDrift, k, max(pix * tm, CI_AGEF)));
    vec2 ec = eyeSphere(o, d, hc);
    float t = ec.x > 1e8 ? tm : clamp(uAlt < hc ? ec.y : ec.x, s0, s1);
    vec3 p = o + d * t, up = normalize(p);
    float cv = abs(dot(d, up));
    // The footprint on the deck: a pixel, drawn out along the ray's way over
    // the map; and aslant, the way through the deck blurs the ice along it.
    // Never under CI_MINF.
    vec2 dh = d.xz - up.xz * dot(d, up);
    float lh = length(dh);
    vec2 dn = lh > 1e-6 ? dh / lh : vec2(1.0, 0.0);
    vec2 f1 = dn * max(pix * t / max(cv, 1e-3) + 0.08 * (s1 - s0) * lh, CI_MINF);
    vec2 f2 = vec2(-dn.y, dn.x) * max(pix * t, CI_MINF);
    mat2 Jp;
    vec2 tcp = ciPlace(p.xz + uDrift, k, Jp);
    float hr = ciHair(tcp, Jp, k, dn * (pix * t / max(cv, 1e-3)), vec2(-dn.y, dn.x) * (pix * t), 0u);
    float rho = ciDensity(p.xz + uDrift, k, f1, f2, true, false, vec4(-1.0), hr), way = (s1 - s0) / th;
    float cBody = ciBody, cVeil = ciVeil, cWide = ciWide;
    if (k == 0) fieldsK0 = ciFieldsOut;
    else fieldsK1 = ciFieldsOut;
    // A ray that grazes the deck crosses it over km: one read stood for all
    // of that, while the march near the eye reads it all along, and where
    // the two met, a patch of ice near the eye stood apart from the same
    // ice read farther on. Over a long crossing a second read (of the
    // depth alone) is averaged in, from the part the march leaves, a
    // quarter of the way on from the first.
    // (Faded in over the last 0.3 km that the march leaves: cut where the
    // march came to leave none, it drew a hard line with a string of beads
    // across the deck seen from just under it, round 15's 11 km views.)
    // Where the march fades out (wn from 1 to 0), the part read from moves
    // with wn from the part the march leaves to the whole deck, where a
    // ray read with no march at all (wn = 0, tE = t0) reads it. (Taken from
    // the part left up to wn = 0, the second read jumped to the whole deck
    // there: a line across the sky where the march ends, some 20 degrees up
    // from 11 km, through the sun of a November afternoon, issue #54.)
    float ra = s0 + wn * max(tE - s0, 0.0), many = smoothstep(2.0, 4.0, way) * smoothstep(0.01, 0.3, s1 - ra);
#ifdef Q_BENCH_CI_ONCE
    many = 0.0;                                      // (?stats=bench3: one read of each deck)
#endif
    if (many > 0.0) {
      float tj = clamp(t + 0.25 * (s1 - s0), ra, s1);
      tj = tj - t < 0.1 * (s1 - s0) ? mix(ra, s1, 0.25) : tj;
      rho = mix(rho, 0.5 * (rho + ciDensity((o + d * tj).xz + uDrift, k, f1 * (tj / t), f2 * (tj / t), true, true, ciFieldsOut, 1.0)), many);
    }
    tau += rho * way;
    tauV += rho;
    bodyT += cBody;
    veilT += cVeil * way;
    wideT += cWide * way;
    wtt += rho * way * t;
    tSum += t;
    nSum += 1.0;
    colK[k] = rho;
    bodyK[k] = cBody;
    float wr = max(s1 - max(s0, tE), 0.0) / th;
    tauR += rho * wr;
    wttR += rho * wr * max(t, tE);
  }
  // The march near the eye: CI_STEPS steps over the shell from t0 to tE.
  // In each, a deck's ice is read once over the step (its footprint drawn
  // out along it), and the part of its column the step crosses is taken
  // from the spread in closed form, so that no step shows. The light
  // scattered once is summed step by step: what reaches a step from the
  // light has crossed the column above it (or below it, for a low light
  // from under the shell), so that the heads shade the ice under them and
  // the tops of a deck are brighter than its base.
  // The steps' bounds move from frame to frame by a fraction of a step
  // (the first and the last step are parts of one): on a fixed grid, the
  // edge of a band seen along a grazing ray stood in stairs, a step each.
  float tauN = 0.0, onceN = 0.0, onceDN = 0.0, wttN = 0.0;
  // A low sun's light reaches the ice near the eye through the depth on its
  // way in as well (tauP, read once, at the middle of the march; farther
  // on, where the flat reads put the ice): through the columns above the
  // steps alone, the cirrus overhead at dusk stood dim and brown against
  // the same cirrus lit gold farther off.
  float tPre = tau > 0.0 ? wtt / tau : tSum / max(nSum, 1.0);
  vec2 lowSun = ciLowSun(o + d * mix(tPre, 0.5 * (t0 + tE), wn));
#if Q_CI_STEPS > 0
  if (tE > t0) {
    float dt = (tE - t0) / float(CI_STEPS), jit = ign(gl_FragCoord.xy + 2.718 * uPass + 5.0);
    // The hairs of each sheet, read once where the ray crosses it (before
    // the steps, the same for every pixel: read inside the steps, as each
    // pixel came to a new sheet, they cost ten times as much).
    // (One vector a deck, a sheet a component: CI_SHEETS is 4.)
    vec4 hairS0 = vec4(1.0), hairS1 = vec4(1.0);
#if Q_HAIRS
    for (int n = 0; n < CI_N(CI_LAYERS * CI_SHEETS); n++) {
      int k = n / CI_SHEETS;
      float hs = CI_DECK[k].x + (float(n - k * CI_SHEETS) + 0.5) * (CI_DECK[k].y - CI_DECK[k].x) / float(CI_SHEETS);
      vec2 es = eyeSphere(o, d, hs);
      float tsh = uAlt < hs ? es.y : es.x;
      if (es.x > 1e8 || tsh < t0 - 0.5 || tsh > tE + 0.5) continue;
      vec3 ps = o + d * tsh, us = normalize(ps);
      float cs = dot(d, us);
      vec2 dhs = d.xz - us.xz * cs;
      float lhs = length(dhs);
      vec2 dns = lhs > 1e-6 ? dhs / lhs : vec2(1.0, 0.0);
      mat2 Js;
      vec2 tcs = ciPlace(ps.xz + uDrift, k, Js);
      float hn = ciHair(tcs, Js, k, dns * (pix * tsh / max(abs(cs), 1e-3)), vec2(-dns.y, dns.x) * (pix * tsh), 1u + uint(n));
      if (k == 0) hairS0[n] = hn;
      else hairS1[n - CI_SHEETS] = hn;
    }
#endif
    for (int i = 0; i <= CI_N(CI_STEPS); i++) {
      float ta = i == 0 ? t0 : t0 + dt * (float(i - 1) + jit), tb = i == CI_STEPS ? tE : t0 + dt * (float(i) + jit);
      if (tb <= ta) continue;
      float tmid = 0.5 * (ta + tb), dts = tb - ta;
      vec3 pm = o + d * tmid, up = normalize(pm);
      float ha = length(o + d * ta) - RG, hb = length(o + d * tb) - RG, hmid = length(pm) - RG;
      float cv = dot(d, up), mus = dot(up, uLight);
      vec2 dh = d.xz - up.xz * cv;
      float lh = length(dh);
      vec2 dn = lh > 1e-6 ? dh / lh : vec2(1.0, 0.0);
      vec2 f1 = dn * max(max(dts * lh, pix * tmid), CI_MINF), f2 = vec2(-dn.y, dn.x) * max(pix * tmid, CI_MINF);
      // The light comes from above (1) or below (0). A low sun runs along
      // the decks and crosses as much ice as their whole columns (as the
      // flat reads take it): there each step feels the whole column. With
      // half of it, low sunlit ice near the eye was brighter than the same
      // ice farther off, a patch with the outline of the ice; and a sharp
      // switch at the sun's height 0 drew a seam.
      float fromAbove = smoothstep(-0.1, 0.1, mus), steep = smoothstep(0.1, 0.35, abs(mus));
      float tauS = 0.0, tsS = 0.0;
      for (int k = 0; k < CI_N(CI_LAYERS); k++) {
        float lo = CI_DECK[k].x, hi = CI_DECK[k].y;
        if (min(ha, hb) >= hi || max(ha, hb) <= lo) {
          // The deck lies wholly above or below the step: its column shades
          // the step if the light comes from that side.
          tsS += mix(bodyK[k], max(colK[k], bodyK[k]), CI_SHADE) * mix(1.0, hmid < lo ? fromAbove : 1.0 - fromAbove, steep);
          continue;
        }
        vec2 x = pm.xz + uDrift;
        // The hairs of the sheet nearest the step's middle (CI_SHEETS to a
        // deck, at fixed heights), read where the ray crosses it: the
        // steps move from frame to frame, the sheets do not, so that the
        // hairs stay crisp.
        int ns = clamp(int(floor((hmid - lo) / (hi - lo) * float(CI_SHEETS))), 0, CI_SHEETS - 1);
        float hr = (k == 0 ? hairS0 : hairS1)[ns];
        float col = ciDensity(x, k, f1, f2, true, true, k == 0 ? fieldsK0 : fieldsK1, hr);
        if (col <= 0.0) continue;
        float age = ciAge(x, k, max(pix * tmid, CI_AGEF));
        float hc = ciHeight(k, age), sg = ciSpread(k, age);
        float pl = ciPhi((lo - hc) / sg), ph = ciPhi((hi - hc) / sg), nrm = max(ph - pl, 1e-3);
        float qa = ciPhi((clamp(ha, lo, hi) - hc) / sg), qb = ciPhi((clamp(hb, lo, hi) - hc) / sg);
        float dz = abs(hb - ha), z = (clamp(hmid, lo, hi) - hc) / sg;
        // The column's share per km of height here, times the way.
        float per = dz > 1e-4 * sg ? abs(qb - qa) / dz : 0.39894 * exp(-0.5 * z * z) / sg;
        tauS += col * per / nrm * dts;
        float qm = ciPhi(z);
        tsS += mix(bodyK[k], max(col, bodyK[k]), CI_SHADE) * mix(1.0, mix(qm - pl, ph - qm, fromAbove) / nrm, steep);
      }
      if (tauS <= 0.0) continue;
      float li = 1.0 / max(abs(mus), 0.15), tr = exp(-tauN - 0.5 * tauS) * tauS;
      tsS = mix(tsS, lowSun.y, lowSun.x);
      onceN += tr * exp(-0.6 * tsS * li);
      onceDN += tr * exp(-0.15 * tsS * li);
      wttN += tauS * tmid;
      tauN += tauS;
    }
  }
#endif
  float tauF = tau;
  tau = mix(tauF, tauN + tauR, wn);
  wtt = mix(wtt, wttN + wttR, wn);
  // Where there is no ice in the pixel but some around, the glow round
  // the sun or the moon is still drawn (below).
  if (tau <= 0.0 && wideT <= 0.0) return;
  tHigh = tau > 0.0 ? wtt / tau : tSum / nSum;
  ciBody = bodyT;
  Th = exp(-tau);
  vec3 pc = o + d * tHigh, up = normalize(pc);
  float a = 1.0 - Th;

  // Light. Ice crystals scatter forward: a narrow peak (diffraction by
  // crystals of some 100 um, within a degree or two of the sun, so that the
  // glow round the sun stays small), CI_FWD of the light, and the rest by
  // refraction and reflection (ciGeo); and the halo at 22 degrees from the
  // sun, red inside, which a min-deviation prism of ice draws.
  float mu = dot(d, uLight);
  float ph = (1.0 - CI_FWD) * ciGeo(mu), peak = CI_FWD * hg(mu, 0.99);
  float mus = dot(up, uLight);
  // Sunlight dims on its way into the sheet (less the forward peak, which
  // goes on as if not scattered): its depth ts there, against te along
  // the view. Scattered once, the sheet sends to the eye te times the mean
  // of exp(-t - ts(t)) along the view: lit on the side the eye is on, or
  // through it. A low sun lights it from below.
  // A fibre in a thick body of ice is lit through the body. A low sun
  // does not cross the whole sheet edgewise: it finds its way in between
  // the clouds within some seven times the sheet's thickness.
  bool sameSide = (dot(d, up) < 0.0) == (mus > 0.0);
  // Near the eye, the march's own sum, and the flat reads behind it.
  float li = 1.0 / max(abs(mus), 0.15);
  // A low sun (from some 30 degrees down) runs along the decks: its light
  // reaches the ice through the ice on its way in, CI_PATH km a unit of
  // li towards the sun, not through the column above it alone. So the
  // light it meets, and the share of it scattered more than once, which
  // spreads through the sheet, follow the depth over that way (tauP, read
  // over it, CI_PATHW across), smooth over km: at dusk a whole band glows,
  // its thin parts with its dense ones. Read through the local column, only
  // the dense cores were lit by the light scattered many times (it grew as
  // the cube of the depth), and dusk stood as a field of bright dashes and
  // hooked heads. The light so scattered goes about evenly (CI_DIFF, the
  // isotropic phase).
  // (Read before the march, ciLowSun.)
  float duskK = lowSun.x, tauP = lowSun.y;
  float tsV = mix(mix(bodyT, max(tauV, bodyT), CI_SHADE), tauP, duskK);
  float once = mix(ciOnce(tauF, 0.6 * tsV * li, sameSide),
                   onceN + exp(-tauN) * ciOnce(tauR, 0.6 * tsV * li, sameSide), wn);
  // The narrow peak, a few degrees round the sun or the moon, is a round
  // glow (an aureole): it follows the sheet's depth over some 10 km, and
  // the ice just in front of the light only by 0.4 (0.1 at night: by
  // more, a band through the moon stood as a bright streak). Drawn from the
  // ice in front (round 8), a plume round the moon lit up as a bright
  // patch of its own shape; from the depth over 2.5 km (round 7), as a
  // smooth bright lens.
  float onceW = ciOnce(wideT, 0.6 * wideT / max(abs(mus), 0.15), sameSide);
  // Along a long path most light is scattered more than once, which
  // spreads the peak and the halo out; a thicker sheet sends more back.
  // Scattered twice or more, the light still goes mostly forward, as by a
  // lobe of mean cosine 0.5 that widens as the sheet thickens round about
  // (phM, by the body: by the depth at the pixel, each dense strand next to
  // the sun stood as a dark stroke on the bright veil): next
  // to the moon or the sun dense ice glows, and does not stand dark against
  // thinner ice. CI_MANY sets its amount so that the sheet sends out the
  // sunlight it takes. (Up to round 19 most of it went evenly, as much back
  // as forward: a thick sheet was as bright away from the sun as near it,
  // a milky veil without depth.) At dusk, where the low sun's light has
  // spread along the sheet, it goes about evenly (CI_DIFF, below).
  // (At night the eye sees the moonlit sheet over some 10 km: nightK, below.)
  float dayK = smoothstep(0.02, 0.3, uLightI), nightK = 0.9 * (1.0 - dayK);
  float many = mix(1.0 - exp(-0.3 * mix(tau, wideT, nightK)), 1.0 - exp(-0.3 * tauP * li), duskK);
  float phM = mix(CI_MANY * hg(mu, 0.5 / (1.0 + 0.25 * bodyT)), CI_DIFF + 0.3 * hg(mu, 0.5), duskK);
  // The light scattered many times has mostly gone forward at each step: on
  // its way in it fades with a quarter of the depth that the light
  // scattered once feels (1 - g of ice). With the depth of the single
  // scattering, thick ice towards a low sun went darker than the sky behind
  // it.
  float onceD = mix(ciOnce(tauF, 0.15 * tsV * li, sameSide),
                    onceDN + exp(-tauN) * ciOnce(tauR, 0.15 * tsV * li, sameSide), wn);
  // The halo needs smooth hexagonal crystals, which thin cirrus has: it
  // shows faintly in thin fibrous cirrus (as in photographs of halos in
  // cirrus fibratus), more in the thin, even veil (ciThin: veilT is its
  // depth along the ray), the more as that veil grows at the top of the
  // slider (ciHaloGrow: the strands there are thick and the space between
  // them clear, and without it the ring at 1 lost 6 % of its contrast),
  // and fades where the ice is thick enough to scatter the light again. By
  // day it is faint (0.03) and only in a veil: photographs of much cirrus towards
  // the sun mostly show none, and 0.05 to 0.17 drew a clear coloured ring
  // in any veil. At night (the moon's light) it is as before.
  // (The light scattered more than once loses it: F takes the halo by
  // 1 - many, as the rest of the light scattered once. Taken by it twice,
  // as before, the ring did not show through a veil at night, where the
  // photographs show it.)
  // At night the eye sees moonlit cirrus as a soft, even veil (photographs
  // of a lunar halo show a smooth sheet, a bright aureole and a clear ring):
  // the light scattered by the sheet, and the share scattered many times,
  // follow its depth over some 10 km by 0.9 (nightK), so that the lanes
  // between bands do not stand as dark stripes across a grey veil (by
  // 0.65, round 16, they still did at cirrus 0.5), and the ring (0.17 in
  // thin cirrus, up to 0.25 in a veil) and a broader aureole (some 7
  // degrees) show on it.
  // (By how much the light is the sun's: uLightI is the sun's share of its
  // light, 0 to 1, and some 1e-6 for the moon; no switch, so that the look
  // goes over smoothly in the twilight as the light hands over.)
  float haloW = mix(0.17 + 0.08 * smoothstep(CI_HALOT.x, CI_HALOT.y, veilT) + 0.08 * ciHaloGrow(uCirrus), 0.03 * smoothstep(CI_HALOT.z, CI_HALOT.w, veilT), dayK) * smoothstep(0.02, 0.15, mix(tau, wideT, nightK));
  float aL = mix(a, 1.0 - exp(-wideT), nightK);
  float onceL = mix(once, onceW, nightK);
  // The light scattered forward, by wavelength, is uLightI times the
  // sunlight that reaches the sheet times lk.y + lk.z times the halo's
  // shape there (cirrusLight); lk.x is the share of the light from round
  // about (aL).
  // Where the halo shows, a share haloW of the crystals is smooth, and
  // smooth prisms send no light between their diffraction peak and the
  // ring: the light scattered once is less there. (With the rough ice's
  // lobe there in full, the inside of the moon's ring filled up, and from
  // 11 km the ring lost half its contrast; with twice haloW, it stood out
  // three times as much as in a photograph of a lunar halo.)
  float u = (1.0 - many) * onceL;
  ph *= 1.0 - haloW * smoothstep(0.92, 0.94, mu) * (1.0 - smoothstep(0.985, 0.995, mu));
  lk = vec3(aL, ph * u + phM * many * mix(onceD, onceW, nightK) + (peak + nightK * 0.45 * hg(mu, 0.9)) * exp(-0.3 * wideT) * mix(onceW, once, 0.4 - 0.3 * nightK), haloW * u);
}

// The light of the cirrus (H) at tHigh along the ray, from the numbers lk
// of its pass (see highCloud).
void cirrusLight(vec3 o, vec3 d, float extM, float tHigh, vec3 lk, out vec4 H[3], out vec4 HM[3]) {
  vec3 pc = o + d * tHigh, up = normalize(pc);
  float mu = dot(d, uLight), th = acos(clamp(mu, -1.0, 1.0));
  float mus = dot(up, uLight);
  bool lit = uLightI > 0.0 && raySphere(pc, uLight, RG).y < 0.0;
  vec3 ol = lit ? depthToTop(pc, uLight) : vec3(0.0);
  // Light from below: the low clouds, lit by the same sun, add to the sea
  // that the mean sky already holds. Forward scattering sends more of it
  // to an eye below the sheet.
  float below = 0.35 * clamp(1.4 * uCloud - 0.1, 0.0, 1.0) * max(mus, 0.0) / PI;
  float wBelow = 0.5 + 0.35 * dot(d, up);
  vec4 msS[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0)), msM[3] = msS;
  float rc = length(pc);
  if (uSunI > 0.0) multiScatter(rc - RG, dot(pc, uSun) / rc, msS);
  if (uMoonI > 0.0) multiScatter(rc - RG, dot(pc, uMoon) / rc, msM);
  vec4 F[3];
  for (int k = 0; k < 3; k++) {
    vec4 n = 1.2998 + 0.00316 / (0.3025 * uWL[k] * uWL[k]);   // ice, by wavelength (0.55 um units)
    vec4 x = th - (2.0 * asin(0.5 * n) - PI / 3.0);
    vec4 halo = mix(exp(-x * x / 1.2e-3), exp(-max(x, 0.0) / 0.05), step(0.0, x));
    vec4 sun = lit ? exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z)) : vec4(0.0);
    H[k] = lk.x * ((1.0 - CI_FWD) * (uSunI * msS[k] + uMoonI * msM[k] + uNight * pow(uWL[k], vec4(-3.0)))
                + uLightI * sun * wBelow * below);
    F[k] = uLightI * sun * (lk.y + lk.z * halo);
  }
  // Towards the sun the sheet sends far more light than the sky round it
  // (thirty to fifty times, ten degrees off), more than the screen can
  // show: on the screen its thick and thin parts would be one white glow.
  // A photograph through such a veil keeps them apart. The light scattered
  // forward rolls off smoothly towards some 2.2 times the screen's white
  // (after the exposure), so that the texture of the ice stays.
  float lum = ISUN * uExposure * (dot(uWG[0], F[0]) + dot(uWG[1], F[1]) + dot(uWG[2], F[2]));
  float roll = lum > 1e-4 ? CI_ROLL * (1.0 - exp(-lum / CI_ROLL)) / lum : 1.0;
  // The meter does not see that roll, which hangs on the exposure (a
  // brighter exposure would meter a darker sheet, and the first picture
  // would have to be drawn again until the two agree): it sees the light
  // rolled off towards CI_METER times the light of the sky at the sheet,
  // about where the screen rolls it off by day. HM is what main takes out
  // of the light it meters, with the sun's disc (G), for the difference.
  float sky = dot(uWG[0], uSunI * msS[0] + uMoonI * msM[0]) + dot(uWG[1], uSunI * msS[1] + uMoonI * msM[1])
            + dot(uWG[2], uSunI * msS[2] + uMoonI * msM[2]);
  float rel = (dot(uWG[0], F[0]) + dot(uWG[1], F[1]) + dot(uWG[2], F[2])) / max(CI_METER * sky, 1e-30);
  float rollM = rel > 1e-4 ? (1.0 - exp(-rel)) / rel : 1.0;
  for (int k = 0; k < 3; k++) {
    H[k] += roll * F[k];
    HM[k] = (roll - rollM) / (1.0 - METER_GLINT) * F[k];
  }
}

// A distance (km; negative: infinitely far) as a number from 0 to 1, in 16
// bits: the depth of the frame, c / 65536 (exact in its 32-bit floats).
// The scene adds a share (`astray`, 0 to 1) times 0.75 / 65536: below the
// next code, and kept to 1/256 of a step.
float distanceCode(float t) {
  float c = floor((t > 0.0 ? clamp(0.5 + log2(t) / 20.0, 0.0, 0.99) : 1.0) * 65535.0 + 0.5);
  return c / 65536.0;
}

#ifdef CIRRUS_PASS
// The cirrus along each ray, before the scene: its program alone is the
// size of the rest of the scene's, and ANGLE on Direct3D 11 compiles the
// two at once, where the whole took minutes (Microsoft's compiler takes
// far longer than twice as long for a program twice the size).
void main() {
  vec2 uv = ((gl_FragCoord.xy + CI_JIT) * Q_CI_PASS * 2.0 - uRes) / uRes.y;
  vec3 d = normalize(uCam * vec3(uv * uTan, 1.0));
  vec3 o = vec3(0.0, RG + uAlt, 0.0);
  float tmax = raySphere(o, d, RT).y;
  vec2 tg = raySphere(o, d, RG);
  if (tg.x > 0.0 && tg.x < 1e8) tmax = tg.x;
  float Th, tHigh;
  vec3 lk;
  highCloud(o, d, tmax, Th, tHigh, lk);
  outCirrus = floatBitsToUint(vec4(tHigh, lk));
  gl_FragDepth = Th;
}
#elif defined(SHADOW_MAP)
// A layer (uLayer) of a map of the clouds' depths along uDir, uRes texels
// square.
void main() {
  vec3 ax, ay;
  mapAxes(uDir, ax, ay);
  outColor = shadowTexel(gl_FragCoord.xy / uRes * 2.0 - 1.0, uDir, ax, ay, int(uLayer));
}
#elif defined(TOPS_MAP)
// The map of the tops (see uTops), uRes texels square, in two draws: first
// the highest place over each texel where the march may meet cloud (R),
// then the highest within 1, 2, 4 and 8 texels of it (RGBA, from uTopsIn).
uniform sampler2D uTopsIn;
uniform float uTopsPass;
// Over x, at the height h: at or above nought where cloudShape takes
// neither of its early ways out (where it takes one, it gives the march no
// cloud: no fine noise either). The second, after the slope, is the
// tighter: the first allows walls six times as steep everywhere, and its
// tops stood so high that the march skipped next to nothing.
float topsBound(vec2 x, float h) {
  topsX = x;
  topsH = h;
  float y, body, lump, base;
  vec4 q;
  return cloudShape(vec3(0.0), -4.0, false, y, q, body, lump, base);
}
// The highest such place over x (km over the sea); CB where there is none.
// The bound falls with the height over the lowest 180 m of the field (rim),
// so a search between there and CT finds it.
float topAt(vec2 x) {
  if (topsBound(x, CT - 0.001) >= 0.0) return CT;
  topsBound(x, CB + 0.3);
  float level = CB + 0.3 - overBase, lo = level + 0.04 * (CT - CB), hi = CT;
  if (topsBound(x, lo) < 0.0) return topsBound(x, level + 0.001) < 0.0 ? CB : lo;
  for (int i = 0; i < 11; i++) {
    float m = 0.5 * (lo + hi);
    if (topsBound(x, m) >= 0.0) lo = m; else hi = m;
  }
  return hi;
}
void main() {
  ivec2 n = ivec2(uRes), ij = ivec2(gl_FragCoord.xy);
  if (uTopsPass < 0.0) {
    // uWarped (uTopsPass -2) or uSlopeW (-1), uRes texels square.
    vec2 x = gl_FragCoord.xy / uRes * WEATHER_KM;
    float region = textureLod(uWeather, x / WEATHER_KM, 6.5).r;
    float sheet = smoothstep(0.57, 0.82, uCloud + 0.6 * (region - 0.5));
    vec2 xw = x + WARP * (1.0 - sheet) * (textureLod(uWeather, x / WEATHER_KM + vec2(0.29, 0.61), 2.5).rg - 0.5);
    outColor = uTopsPass < -1.5 ? textureLod(uWeather, xw / WEATHER_KM, 0.0) : textureLod(uSlope, xw / WEATHER_KM, 0.0);
    return;
  }
  if (uTopsPass == 0.0) {
    // Four places in the texel, a quarter of it from its middle.
    vec2 c = gl_FragCoord.xy / uRes * WEATHER_KM, e = 0.25 * WEATHER_KM / uRes;
    float m = max(max(topAt(c + vec2(-e.x, -e.y)), topAt(c + vec2(e.x, -e.y))),
                  max(topAt(c + vec2(-e.x, e.y)), topAt(c + vec2(e.x, e.y))));
    // 50 m more, and rounded up to the 8 bits kept.
    outColor = vec4(ceil(clamp((m + 0.05 - CB) / (CT - CB), 0.0, 1.0) * 255.0) / 255.0);
    return;
  }
  vec4 m = vec4(0.0);
  for (int j = -8; j <= 8; j++) {
    for (int i = -8; i <= 8; i++) {
      float v = texelFetch(uTopsIn, (ij + ivec2(i, j) + n) % n, 0).r;
      int r = max(abs(i), abs(j));
      m = max(m, v * vec4(r <= 1, r <= 2, r <= 4, true));
    }
  }
  outColor = m;
}
#elif defined(AIR_LUT)
// One texel of the air's table (see Q_AIR_LUT), slice uLutSlice: the air
// marched from the eye along the texel's direction to the slice's distance
// (or to the end of the ray, if nearer), as main marches it with
// LUT_NV, LUT_NSHADE and LUT_NFAR samples (more than low's own), and
// without the clouds' shadows; or, in the last slice, from the sea's
// surface up through the whole air.
uniform float uLutSlice;
const int LUT_NV = 14, LUT_NSHADE = 6, LUT_NFAR = 10;
void main() {
  vec2 uv = vec2(mod(gl_FragCoord.x, LUT_AZ), gl_FragCoord.y) / vec2(LUT_AZ, LUT_EL);
  bool sea = uLutSlice >= LUT_S - 0.5;
  float alt = sea ? 0.002 : uAlt;
  vec3 o = vec3(0.0, RG + alt, 0.0), d = lutDir(uv, vec3(0.0, 1.0, 0.0), alt);
  float tmax = raySphere(o, d, RT).y;
  vec2 tg = raySphere(o, d, RG);
  if (tg.x > 0.0 && tg.x < 1e8) tmax = tg.x;
  if (!sea) tmax = min(tmax, LUT_T0 * pow(LUT_T1 / LUT_T0, uLutSlice / (LUT_S - 1.0)));
  float betaM = BETA_M * uHaze, extM = betaM * MIE_EXT;
  float under = mix(1.0, UNDER, smoothstep(0.4, 1.0, uCloud));
  vec3 phaseSun = phases(dot(d, uSun)), phaseMoon = phases(dot(d, uMoon));
  vec3 od = vec3(0.0);
  vec4 L[3], Tv[3];
  L[0] = vec4(0.0); L[1] = vec4(0.0); L[2] = vec4(0.0);
  float sa = tmax, sb = tmax, prev = 0.0;
  int n = LUT_NV, j = 0;
  if (uSunI > 0.0 && shadowSpan(o, d, tmax, uSun, sa, sb)) {
    n = sb < tmax ? LUT_NV + LUT_NSHADE + LUT_NFAR : LUT_NV + LUT_NSHADE;
    if (sa <= 0.0) j = LUT_NV;
  }
  float gain = 1.0 / max(uLutScale, 1e-30);
  for (int i = 0; i < LONG_N(LUT_NV + LUT_NSHADE + LUT_NFAR); i++) {
    if (j >= n) break;
    float t1;
    if (j < LUT_NV) {
      float f = (float(j) + 1.0) / float(LUT_NV);
      t1 = sa * f * f;
    } else if (j < LUT_NV + LUT_NSHADE) {
      float f = (float(j - LUT_NV) + 1.0) / float(LUT_NSHADE);
      t1 = sa + (sb - sa) * f * f;
    } else {
      float f = (float(j - LUT_NV - LUT_NSHADE) + 1.0) / float(LUT_NFAR);
      t1 = sb + (tmax - sb) * f * f;
    }
    j++;
    float dt = t1 - prev;
    vec3 p = o + d * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec4 dens = densities(h) * vec4(dt, dt, dt, 1.0);
    od += 0.5 * dens.xyz;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) Tv[k] = exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    float low = 1.0 - smoothstep(0.6, 2.0, h), sky = mix(1.0, under, low);
    // The clouds' shadows, by their mean: below the tops, a deck lets
    // through little of the light (the table has no place for them; without
    // this, the air under a deck shone orange at its far edge at dusk).
    float direct = mix(1.0, mix(1.0, 0.15, smoothstep(0.4, 1.0, uCloud) * (1.0 - smoothstep(CB, CT, h))), uLightShare);
    bool sunLight = dot(uLight, uSun) > 0.999;
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI * gain, sunLight ? direct : 1.0, sky, phaseSun, d, Tv, L);
    if (uMoonI > 0.0) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI * gain, sunLight ? 1.0 : direct, sky, phaseMoon, d, Tv, L);
    od += 0.5 * dens.xyz;
  }
  outLut0 = L[0];
  outLut1 = L[1];
  outLut2 = L[2];
  outLut3 = vec4(od, 0.0);
}
#elif defined(SKY_LIGHT)
// One texel of uSkyLight: the sky's light (the sun's part) on a white
// matt surface facing up (its irradiance over pi), from 64 directions over
// the sky by the cosine, against 2 cloudSky.
vec4 skyLightTexel(ivec2 ij) {
  float h = CB + (CT - CB) * float(ij.x) / 15.0;
  vec3 pc = vec3(0.0, RG + h, 0.0);
  vec4 ms[3], S[3];
  cloudSky(h, uSun.y, ms);
  vec4 E = vec4(0.0);
  skyMoon = false;
  for (int j = 0; j < 64; j++) {
    float u1 = (float(j / 8) + 0.5) / 8.0, a = 2.0 * PI * (float(j % 8) + 0.5 * float(j / 8 % 2)) / 8.0;
    skyAt(pc, vec3(sqrt(u1) * vec2(cos(a), sin(a)), sqrt(1.0 - u1)).xzy, BETA_M * uHaze, BETA_M * uHaze * MIE_EXT, S);
    E += (ij.y == 0 ? S[0] : ij.y == 1 ? S[1] : S[2]) / 64.0;
  }
  vec4 m = 2.0 * uSunI * (ij.y == 0 ? ms[0] : ij.y == 1 ? ms[1] : ms[2]);
  return mix(vec4(SKY_UNIT), E / max(m, 1e-30), step(1e-30, m)) / uSkyEnc;
}

void main() {
  outColor = skyLightTexel(ivec2(gl_FragCoord.xy));
}

// The ray of this pixel, of the picture's uRes (scale 2: every second
// pixel's, for the first stage of the clouds' light): from the eye o along
// d to tmax, where it leaves the air or meets the sea (ground).
void viewRay(float scale, float spread, vec2 jitter, out vec3 o, out vec3 d, out float tmax, out bool ground) {
  vec2 uv = ((gl_FragCoord.xy * scale + jitter * spread) * 2.0 - uRes) / uRes.y;
  d = normalize(uCam * vec3(uv * uTan, 1.0));
  o = vec3(0.0, RG + uAlt, 0.0);
  tmax = raySphere(o, d, RT).y;
  vec2 tg = raySphere(o, d, RG);
  ground = tg.x > 0.0 && tg.x < 1e8;
  if (ground) tmax = tg.x;
}

#ifdef CLOUD_PASS
// The low clouds along each ray, before the scene, which reads them: on
// its own, the march and the light of the clouds compile in a time of their
// own on Direct3D 11 (ANGLE), beside the scene's (see the cirrus's pass).
void main() {
  shadowAxes();
  vec3 o, d;
  float tmax;
  bool ground;

    // its own light (H); taken out whole, dense ice stood as dark streaks
    // across the moonlit sky.
    float vg = visX / max(vis, 1e-6);
    // The stars: the core of a star of magnitude 6.5 is STAR_GAIN times the
    // airglow's radiance, each magnitude brighter STAR_LN_MAG brighter.
    float stars = uNight * STAR_GAIN * free;
    for (int k = 0; k < 3; k++) {
      G[k] += tk[k] * sun;
      L[k] += tk[k] * (sun + moon * moonMask + stars * st[k]) + tg[k] * vg * (glow * pow(uWL[k], vec4(-3.0)) + zodi);
    }
  }
  // Glare: light of the sun strayed inside the eye or the lens. Its shape is
  // the eye's, the CIE general disability glare function (CIE 146:2002;
  // Vos, 2003): a veiling luminance of 10 / t^3 + 5 / t^2 times the
  // illuminance at the eye (t in degrees from the light; a young eye, the
  // pigment's terms left out), steep near the sun, with a wider tail. t is
  // softened by the disc's radius, over which the light comes. Its strength
  // is GLARE of the eye's: at the eye's own, the veil runs into white some
  // 4 degrees round the sun on a screen exposed for the sky, where the eye
  // sees a small hard disc. The air's own forward scattering (the aureole)
  // is in L already, and widens the glow in haze. Clouds between the eye
  // and the sun dim the glare.
  if (uSunI > 0.0 && mu > 0.9 && raySphere(o, uSun, RG).y < 0.0) {
    float deg = degrees(acos(min(mu, 1.0)));
    float t2 = deg * deg + pow(degrees(SUN_R), 2.0);
    float glare = GLARE * SUN_L * PI * SUN_R * SUN_R * (10.0 / (t2 * sqrt(t2)) + 5.0 / t2);
    if (dot(uLight, uSun) > 0.999) glare *= exp(-cloudShadow(o));   // the map is the sun's
    if (uCirrus > 0.0 && uAlt < CI_HI) {
      // The thin cloud towards the sun: read where that ray crosses it.
      // (ciGlare: read above.)
      float slant = (CI_HI - max(uAlt, CI_LO)) / (CI_HI - CI_LO) / max(dot(normalize(glarePc), uSun), 0.05);
      glare *= exp(-ciGlare * slant);
    }
    vec3 ol = depthToTop(o, uSun);
    for (int k = 0; k < 3; k++) {
      // Only the glare is new here: G already holds the sun's disc or its
      // glitter, and L has it.
      vec4 g = uSunI * glare * smoothstep(0.9, 0.93, mu) * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      G[k] += g;
      L[k] += g;
    }
  }

  vec3 col = ISUN * vec3(
    dot(uWR[0], L[0]) + dot(uWR[1], L[1]) + dot(uWR[2], L[2]),
    dot(uWG[0], L[0]) + dot(uWG[1], L[1]) + dot(uWG[2], L[2]),
    dot(uWB[0], L[0]) + dot(uWB[1], L[1]) + dot(uWB[2], L[2]));
  col = max(col, 0.0);                               // colours outside sRGB
  // The eye at night (after Krawczyk, Myszkowski and Seidel, 2005). Below
  // a few cd/m2 the rods take over from the cones, and colours fade into
  // the grey of what the rods see, which favours blue-green over red (the
  // Purkinje shift): moonlit clouds and the moon's glitter are grey to the
  // eye, and the moonlit sky a dark grey-blue, where a long exposure shows
  // them in the colours of sunlight. The rods' share falls from 1 to 0 as
  // the pixel's luminance goes from MESOPIC.x to MESOPIC.y cd/m2 (a
  // smoothstep in its log: the eye's mesopic range), as the night eye
  // comes in. So the full moon's clouds (about 0.07 cd/m2) are mostly
  // grey, not tan. Their grey is a little blue, as the night looks (the
  // "blue shift" of Jensen et al., 2001), but less: neutral grey read as a
  // black and white photograph.
  float rodShare = 0.0;
  if (uNightEye > 0.0) {
    float rods = ISUN * (dot(uWS[0], L[0]) + dot(uWS[1], L[1]) + dot(uWS[2], L[2]));
    float cd = CD * dot(col, vec3(0.2126, 0.7152, 0.0722));
    float wide = 1.0 - smoothstep(log(MESOPIC.x), log(MESOPIC.y), log(max(cd, 1e-12)));
    rodShare = uNightEye * mix(ROD_HALF / (ROD_HALF + cd), wide, uNightGrey);
    // A full moon's sky is dark but blue to the eye, where a quarter moon's
    // is grey: at the top of the rods' range the grey of blue light turns
    // blue (ROD_BLUE), as its luminance goes from SKY_BLUE.x to SKY_BLUE.y.
    // Only light bluer than the rods' grey: the sky, and the sea that
    // mirrors it; the moonlit clouds and the glitter stay grey.
    float bluer = col.r > 0.0 ? smoothstep(0.0, 0.3, col.b / col.r * (ROD_TINT.r / ROD_TINT.b) - 1.0) : 0.0;
    float blue = uNightGrey * bluer * smoothstep(log(SKY_BLUE.x), log(SKY_BLUE.y), log(max(cd, 1e-12)));
    vec3 tint = mix(ROD_TINT, ROD_BLUE, blue);
    col = mix(col, max(rods, 0.0) * tint, rodShare);
  }
  // The meter counts the sun's disc and glare and its glitter on the sea
  // (G) at METER_GLINT of their light: a camera lets the sun and its mirror
  // image run into white and exposes for the rest. Photographs from the air
  // keep the sky as light facing the sun as away from it, with the glitter
  // white; and as a low sun dims in the haze, the picture does not grow
  // brighter for it.
  float glintY = ISUN * dot(vec3(0.2126, 0.7152, 0.0722), vec3(
    dot(uWR[0], G[0]) + dot(uWR[1], G[1]) + dot(uWR[2], G[2]),
    dot(uWG[0], G[0]) + dot(uWG[1], G[1]) + dot(uWG[2], G[2]),
    dot(uWB[0], G[0]) + dot(uWB[1], G[1]) + dot(uWB[2], G[2])));
  float metered = dot(col, vec3(0.2126, 0.7152, 0.0722)) - (1.0 - METER_GLINT) * glintY;
  float level = (log2(max(metered, 1e-30)) - uLogRange.x) / (uLogRange.y - uLogRange.x);
  col *= uExposure;
  // No shoulder that keeps the hue: each channel meets the curve below on
  // its own, as on a camera's sensor. A bright orange band of twilight
  // then runs into white at its strongest channel first, and comes out
  // yellow at its core, orange at its edges and pale above, as in
  // photographs; pressed together as a whole, it stayed a thin saturated
  // red-orange line.
  // A camera's white balance: for daylight, sunlit cloud, a little yellow on
  // a screen whose white is D65, comes out white, and the sea a deeper blue;
  // in twilight it adapts in part to the light of the sky (balanceFor).
  col *= uBalance;
  // A camera's colour by day: deeper than the light's. The sky from the air
  // is a strong azure in photographs (in linear light, red a tenth of the
  // blue or less), where the light of the sky gives a quarter. Channels
  // pushed below zero are cut.
  float y0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = max(y0 + uSaturation * (col - y0), 0.0);
  // Light far too strong for the screen turns white, as on film, instead
  // of a flat saturated colour (the glitter of a low sun would be yellow).
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col, vec3(lum), 0.85 * smoothstep(1.0, 6.0, lum));

  // A "look", not physics: a per-channel power deepens the colour, as film does.
  // What the rods see takes the power on its luminance alone: the look
  // deepens the tones but adds no colour that the eye does not see. And it
  // is steeper (NIGHT_LOOK, the same at LOOK_PIVOT, about the moonlit
  // clouds): the night eye's view has black in it, the dark sea and the
  // sky away from the moon, where the gentler curve left a grey veil.
  vec3 looked = pow(col, vec3(uLook));
  if (rodShare > 0.0) {
    float yl = max(dot(col, vec3(0.2126, 0.7152, 0.0722)), 1e-30);
    // As the eye adapts to a darker night it is steeper still, about a
    // lower level (DARK_LOOK, DARK_PIVOT): on a moonless night the Milky
    // Way, the zodiacal light and the stars stand out as the dark-adapted
    // eye sees them; under a moon, with the gentler curve, the moonlit sky
    // lies over them. One curve for everything, set by the adaptation.
    float dark = smoothstep(DARK_EYE.x, DARK_EYE.y, log2(uExposure));
    float n = mix(uLook, mix(NIGHT_LOOK, DARK_LOOK, dark), rodShare);
    float pivot = LOOK_PIVOT * pow(DARK_PIVOT / LOOK_PIVOT, dark);
    looked = mix(looked, col * pow(yl, n - 1.0) * pow(pivot, uLook - n), rodShare);
  }
  // Tone mapping: 1 - exp(-col) up to the knee (SHOULDER.x); above it the
  // shoulder falls off as a power (SHOULDER.y) instead of exponentially, so
  // that lit cloud keeps its gradation some two stops further up, and only
  // far brighter light (the sun's glow, glints) runs into white. The two
  // meet with the same value and slope.
  col = 1.0 - exp(-min(looked, SHOULDER.x)) * pow(1.0 + max(looked - SHOULDER.x, 0.0) / SHOULDER.y, vec3(-SHOULDER.y));
  col = pow(col, vec3(1.0 / 2.2));                   // display encoding
  // How far is what this pixel shows? As far as the clouds, if they hide
  // enough of what is behind or give enough of its light, or else as far
  // as the sea; the sky is infinitely far. A thin sheet counts when nothing
  // else is there, or when it hides the rest.
  float wCloud = tBar > 0.0 ? (1.0 - Tc) * (cloudsFirst ? 1.0 : Th) : 0.0;
  float wHigh = tHigh > 0.0 ? (1.0 - Th) * (cloudsFirst ? Tc : 1.0) : 0.0;
  // A wisp that hides little of the dark sea still gives much of the
  // light. Counted as sea, that light would stay on the sea while the
  // cloud flies past, and trail behind a near cloud in streaks.
  bool cloudLight = dot(C[1], vec4(1.0)) > 0.05 * dot(L[1], vec4(1.0));
  float tSeen = tBar > 0.0 && (wCloud > 0.1 || cloudLight) ? tBar : ground ? tmax : -1.0;
  // Against the sky, a sheet too thin to hide much still gives much of the
  // light, and its streaks would smear if they stayed put: it counts by
  // its share of the light (the sun, the moon and stars behind it, by far
  // the brighter, stay put). By degrees: the pixel moves with the sheet by
  // that share, from 0.05 to 0.3 of the light, as if the sheet were that
  // much farther. (Moved with the sheet from a share of 0.1 on, next to
  // the sun, where the glare is most of the light and falls off steeply,
  // the pixels past that share took their past from where the sheet was,
  // with the glare of another angle from the sun: in flight, a dark or
  // bright band hugged the glow there, with an edge, issue #54.)
  // The rest of such a pixel's light, the sky, the glare and the sun
  // behind the sheet, stays put, yet moves with the pixel: `astray`, its
  // share, goes with the distance (in the fraction of the depth below the
  // code's step), and the mean holds the past of that light to this frame
  // around the pixel as far as it slips (see `mean`).
  float astray = 0.0;
  if (tSeen < 0.0 && tHigh > 0.0) {
    float lit = dot(H[1], vec4(1.0)) / max(dot(L[1], vec4(1.0)), 1e-30);
    float share = smoothstep(0.05, 0.3, max(wHigh, lit));
    if (share > 0.0) {
      tSeen = tHigh / share;
      astray = clamp(1.0 - lit, 0.0, 1.0);
    }
  } else if (wHigh > 0.5) tSeen = tHigh;
  gl_FragDepth = distanceCode(tSeen) + 0.75 / 65536.0 * astray;
  // The frame is kept in steps (of half floats, or of 8 bits). Rounded to
  // the nearest, a smooth sky would come out in bands; rounded down, it
  // would be too dark. So round up or down at random, anew each frame:
  // then the mean over the frames is right. The same for the level.
  outColor = floor(clamp(vec4(col, level), 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass)) / uSteps;
}
#endif
#endif
</script>

<script id="mean" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// The picture of the aircraft's view is a mean over frames: one frame is
// noisy (its rays cross the pixels and step through the clouds at random).
// This shader joins a new frame to the picture so far. While the view
// moves, each pixel finds what it shows now in that picture, where it was a
// frame ago.
uniform sampler2D uFrame;     // the new frame, as shown, and its level before exposure (a)
uniform sampler2D uFrameAux;  // the distance of what each pixel shows, coded (the depth, r)
uniform sampler2D uPast;      // the picture so far
uniform sampler2D uPastAux;   // its distances (r, g), and the number of frames in the mean / 64 (b)
uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform float uAlt;     // altitude of the eye, km
uniform mat3 uCamPast;  // the camera a frame ago
uniform vec2 uResPast;  // the size of the picture so far
uniform vec3 uWay;      // how far the eye has moved since, km
uniform float uTrust;   // the most frames a pixel's past may count for
uniform float uSteps;   // the picture is kept in steps of 1 / uSteps
uniform float uPass;    // the number of the frame
#ifdef UPSCALE
// The frame is smaller than the picture (a quality level's `frame`): each
// of its rays crosses its pixel at uJitter (in its pixels, -0.5 to 0.5),
// and the picture takes each ray where it fell, by how near it fell to
// the picture's pixel. Over the frames the rays fall all over the pixels,
// and a still picture comes out as sharp as the picture's own size.
uniform vec2 uJitter;
uniform vec2 uFrameRes;   // the part of uFrame drawn (its texture is as large as at full scale)
#endif
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;

const float RG = 6360.0;        // ground radius, km

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// The code of a distance (see distanceCode in the other shader) as one
// number from 0 to 1, and one over the distance (km; 0: infinitely far).
float decode(vec2 c) {
  return (floor(c.x * 255.0 + 0.5) * 256.0 + floor(c.y * 255.0 + 0.5)) / 65535.0;
}
float nearness(float code) {
  return code > 0.995 ? 0.0 : exp2((0.5 - code) * 20.0);
}

#ifdef KEYS
// Keys' six-point cubic convolution kernel (R. G. Keys, "Cubic convolution
// interpolation for digital image processing", 1981): it passes a cubic
// through unchanged, and at any offset it lets no wave through stronger than
// it came, so read frame after frame it neither rings nor grows.
float keys6(float x) {
  x = abs(x);
  return x < 1.0 ? (4.0 / 3.0 * x - 7.0 / 3.0) * x * x + 1.0
       : x < 2.0 ? ((-7.0 / 12.0 * x + 3.0) * x - 59.0 / 12.0) * x + 2.5
       : x < 3.0 ? ((x / 12.0 - 2.0 / 3.0) * x + 1.75) * x - 1.5 : 0.0;
}
#endif

// Where in the picture so far (0 to 1; outside: nowhere) was what this pixel
// shows, if that is at one over inv km from the eye (0: infinitely far)?
// Clouds and sea have come nearer by the eye's way since, at the same height
// above the ground; the sky stays (the air rides with the eye). The camera
// of that frame says which pixel it was.
vec2 whence(float inv) {
  vec3 q = normalize(uCam * vec3((gl_FragCoord.xy * 2.0 - uRes) * uTan / uRes.y, 1.0));
  if (inv > 0.0) {
    q /= inv;
    q += vec3(uWay.x, uWay.y - dot(2.0 * q.xz + uWay.xz, uWay.xz) / (2.0 * (RG + uAlt + q.y)), uWay.z);
  }
  q = q * uCamPast;
  return q.z > 0.0 ? 0.5 + 0.5 * q.xy / (q.z * uTan) * vec2(uResPast.y / uResPast.x, 1.0) : vec2(-1.0);
}

void main() {
#ifdef UPSCALE
  // The ray of the frame that fell nearest this pixel's middle, and its
  // weight: 1 on the middle, 0.13 a pixel of the picture off.
  vec2 fsize = uFrameRes, tsize = vec2(textureSize(uFrame, 0)), ratio = fsize / uRes, fp = gl_FragCoord.xy * ratio;
  ivec2 here = clamp(ivec2(floor(fp - uJitter)), ivec2(0), ivec2(fsize) - 1);
  vec2 off = (vec2(here) + 0.5 + uJitter - fp) / ratio;
  float weight = exp(-2.0 * dot(off, off)), count = -1.0;
#else
  ivec2 here = ivec2(gl_FragCoord.xy);
#endif
  vec4 col = texelFetch(uFrame, here, 0);
#ifdef UPSCALE
  // While the view moves, the frame read through the GPU's filter where its
  // rays fell, all pixels alike: all of a frame's rays fall at the same place
  // in their pixels, and weighed by it, the picture's pixels took turns
  // following the noisy frames, in a fine grid that showed in flight.
  vec4 filtered = textureLod(uFrame, clamp(fp - uJitter, vec2(0.5), fsize - 0.5) / tsize, 0.0);
  if (uTrust < 62.5) {
    col = filtered;
    weight = 0.5;
  }
#endif
  // The code, and the share of the pixel's light that is not as far as it
  // says (astray: the sky behind a thin sheet, see the other shader).
  float raw = texelFetch(uFrameAux, here, 0).r * 65536.0;
  float code = floor(raw) / 65535.0, astray = fract(raw) / 0.75;
  float inv = nearness(code);
  // Things at different distances pass each other as the eye moves: by
  // `parallax` pixels a frame for a difference of 1 in one over the distance.
  float parallax = length(uWay) * uRes.y / (2.0 * uTan);
  vec2 st = whence(inv);
  // If something nearer was there, this pixel may show its ragged edge,
  // where one frame hits the cloud and the next misses it. Then look where
  // that nearer thing was: for a miss, it leads to the same edge; for sea
  // that the cloud has just uncovered, to the sea next to the cloud.
  if (uTrust > 0.0 && parallax > 0.0 && st == clamp(st, 0.0, 1.0)) {
    float invWas = nearness(decode(textureLod(uPastAux, st, 0.0).rg));
    if (parallax * (0.8 * invWas - inv) > 0.1) st = whence(invWas);
  }

  // The mean of n frames takes this one as the next. Without a past (the
  // first frame, a pixel that comes into view), this frame is the picture.
  float n = 0.0, codeNow = code;
  if (uTrust > 0.0 && st == clamp(st, 0.0, 1.0)) {
    // Read the picture so far through a Catmull-Rom filter (nine bilinear
    // reads: Jimenez, 2016): a bilinear read, frame after frame, would
    // blur it.
    // The weights and reads follow MJP's Tex2DCatmullRom.hlsl gist (MIT): see THIRD_PARTY_NOTICES.md.
    vec2 size = vec2(textureSize(uPast, 0));
    vec2 pos = st * size - 0.5;
    vec2 i = floor(pos), f = pos - i;
#ifdef KEYS
    // (KEYS, the levels that draw the frame at the picture's size: Keys'
    // six-point cubic over 6 by 6 texels, in 25 bilinear reads, the two
    // middle texels of each row and column in one. In flight each pixel's
    // past is read again every frame, and what one read loses, the next
    // loses again: through Catmull-Rom, a picture of 2560 by 1440 kept 62 %
    // of the detail 3.5 to 5 pixels across that a still at the place reached
    // has, and through this, 75 %. Sharper kernels, Lanczos's of three lobes
    // among them, let some waves grow at some offsets, and in flight they
    // grew into a fine hatch.)
    float wx[5], wy[5], px[5], py[5];
    for (int k = 0; k < 2; k++) {
      float g = k == 0 ? f.x : f.y, c = k == 0 ? i.x : i.y, s = k == 0 ? size.x : size.y;
      float wc = keys6(g), wd = keys6(1.0 - g);
      float w[5] = float[5](keys6(g + 2.0), keys6(g + 1.0), wc + wd, keys6(2.0 - g), keys6(3.0 - g));
      float p[5] = float[5](c - 1.5, c - 0.5, c + 0.5 + wd / (wc + wd), c + 2.5, c + 3.5);
      for (int j = 0; j < 5; j++) {
        if (k == 0) { wx[j] = w[j]; px[j] = p[j] / s; } else { wy[j] = w[j]; py[j] = p[j] / s; }
      }
    }
    vec4 was = vec4(0.0);
    for (int b = 0; b < 5; b++) {
      vec4 row = vec4(0.0);
      for (int a = 0; a < 5; a++) row += textureLod(uPast, vec2(px[a], py[b]), 0.0) * wx[a];
      was += row * wy[b];
    }
#else
    vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));
    vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
    vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));
    vec2 w3 = f * f * (-0.5 + 0.5 * f);
    vec2 w12 = w1 + w2;
    vec2 c0 = (i - 0.5) / size, c12 = (i + 0.5 + w2 / w12) / size, c3 = (i + 2.5) / size;
    vec4 was = (textureLod(uPast, vec2(c0.x, c0.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c0.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c0.y), 0.0) * w3.x) * w0.y
             + (textureLod(uPast, vec2(c0.x, c12.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c12.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c12.y), 0.0) * w3.x) * w12.y
             + (textureLod(uPast, vec2(c0.x, c3.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c3.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c3.y), 0.0) * w3.x) * w3.y;
#endif
    // The filter overshoots at edges: stay within the four texels around.
    // They also tell how many frames the mean has, and how far away the
    // pixel's past was.
    ivec2 last = ivec2(size) - 1;
    vec4 lo = vec4(1e9), hi = vec4(-1e9);
    float codeWas = 0.0;
    for (int k = 0; k < 4; k++) {
      ivec2 t = clamp(ivec2(i) + ivec2(k & 1, k >> 1), ivec2(0), last);
      vec4 c = texelFetch(uPast, t, 0);
      lo = min(lo, c);
      hi = max(hi, c);
      vec4 aux = texelFetch(uPastAux, t, 0);
      vec2 g = mix(1.0 - f, f, vec2(k & 1, k >> 1));
      n += g.x * g.y * 64.0 * aux.b;
      codeWas += g.x * g.y * decode(aux.rg);
    }
    was = clamp(was, lo, hi);
    // Is the past what the pixel shows now? Not if it was nearer or further
    // by enough to slip a fraction of a pixel since. Then the past only
    // counts as far as it looks like this frame around the pixel. At the
    // ragged edge of a cloud both cloud and sea are around, and the mean
    // goes on. Nor is it, for the light that stays put (astray) in a pixel
    // that moves: that light slips by the pixel's own way. Next to the sun,
    // under a thin sheet near the eye, the glare and the sun's disc slipped
    // so by pixels a frame, and in flight the disc drew a streak and the
    // glow banded copies of its edge.
    float invWas = nearness(codeWas);
    float doubt = smoothstep(0.1, 0.3, parallax * max(max(abs(inv - invWas) - 0.2 * max(inv, invWas), 0.0), astray * inv));
    if (doubt > 0.0) {
#ifdef UPSCALE
      ivec2 edge = ivec2(uFrameRes) - 1;
#else
      ivec2 edge = textureSize(uFrame, 0) - 1;
#endif
      lo = col;
      hi = col;
      for (int k = 0; k < 9; k++) {
        vec4 c = texelFetch(uFrame, clamp(here + ivec2(k % 3 - 1, k / 3 - 1), ivec2(0), edge), 0);
        lo = min(lo, c);
        hi = max(hi, c);
      }
      vec4 fit = clamp(was, lo, hi);
      vec3 off = abs(fit.rgb - was.rgb);
      // A past that had to change much was something else: begin again.
      float other = doubt * smoothstep(0.02, 0.1, max(off.r, max(off.g, off.b)));
      was = mix(was, fit, doubt);
      n = mix(n, min(n, 1.0), other);
      codeWas = mix(codeWas, code, other);
    }
    n = any(isnan(was)) ? 0.0 : min(n, uTrust);
#ifdef UPSCALE
    if (n > 0.0) {
      col = mix(was, col, weight / (n + weight));
      codeNow = min(code, mix(codeWas, code, weight / (n + weight)));
      count = n + weight;
    }
#else
    if (n > 0.0) {
      col = mix(was, col, 1.0 / (n + 1.0));
      // A cloud's distance stays after a miss, and fades only as fast as
      // its light does in the mean. While the picture still holds a near
      // cloud's light, the pixel moves with that cloud; once the cloud has
      // gone, the past is in doubt (above) and its light is let go. Faded
      // sooner, the light would stay behind on the sea, in streaks.
      codeNow = min(code, mix(codeWas, code, 1.0 / (n + 1.0)));
    }
#endif
  }

  // Without a past, the frame read through the GPU's filter where its rays
  // fell, as one frame's worth: a sharper ray soon takes over.
  if (count < 0.0) {
    col = filtered;
    count = 0.5;
  }
#endif
  // Round up or down at random, as the other shader does, so that the mean
  // neither stops moving nor sinks.
  outColor = floor(clamp(col, 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass + 5.3)) / uSteps;
  float c = floor(codeNow * 65535.0 + 0.5), high = floor(c / 256.0);
#ifdef UPSCALE
  // (The count grows by weights: rounded up or down at random to the 8
  // bits' steps, so that small weights still count.)
  outAux = vec4(high / 255.0, (c - 256.0 * high) / 255.0, floor(count / 64.0 * 255.0 + hash(gl_FragCoord.yx + 17.3 * uPass + 2.9)) / 255.0, 1.0);
#else
  outAux = vec4(high / 255.0, (c - 256.0 * high) / 255.0, (n + 1.0) / 64.0, 1.0);
#endif
}

<script id="show" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// Copies the picture of the aircraft's view to the canvas, which may be larger.
uniform sampler2D uPicture;
uniform vec2 uSize;     // of the canvas
uniform float uDither;  // 0 when the picture is rounded to 8 bits already
out vec4 outColor;

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main() {
  vec3 col = textureLod(uPicture, gl_FragCoord.xy / uSize, 0.0).rgb;
  // Triangular dither of one 8-bit step removes the banding.
  float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.31) - 1.0;
  outColor = vec4(col + uDither * n / 255.0, 1.0);
}

<script id="enlarge" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// Shows the picture of the aircraft's view where the canvas has more pixels
// than the picture (a screen finer than the drawing limit, or a picture
// drawn smaller while the view moves), in two passes at the canvas's size:
// an edge-adaptive enlargement into a texture, then (SHARPEN) a sharpening
// with the dither, to the canvas. Both after AMD's FidelityFX Super
// Resolution 1 (EASU and RCAS, MIT): see THIRD_PARTY_NOTICES.md. The
// picture is as shown (after the exposure and the tone curve), as both
// expect.
uniform sampler2D uPicture;   // the picture; with SHARPEN, the enlarged one
uniform vec2 uSize;           // of the canvas
#ifdef SHARPEN
uniform float uSharp;   // how much: 1 the most, each halving a stop less
uniform float uDither;  // 0 when the picture is rounded to 8 bits already
#endif
out vec4 outColor;

vec3 at(ivec2 p) {
  return texelFetch(uPicture, clamp(p, ivec2(0), textureSize(uPicture, 0) - 1), 0).rgb;
}
// (Twice a luma, cheaply: all the enlargement needs.)
float luma(vec3 c) {
  return 0.5 * (c.r + c.b) + c.g;
}

#ifdef SHARPEN
// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// Contrast-adaptive sharpening: each pixel moves away from the mean of its
// four neighbours, by as much as keeps it within 0 and 1 where they are
// near either (so it never clips and rings little), and by less where it
// stands alone against them (noise, a star: those are not edges).
void main() {
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec3 b = at(p + ivec2(0, 1)), d = at(p - ivec2(1, 0)), e = at(p), f = at(p + ivec2(1, 0)), h = at(p - ivec2(0, 1));
  vec3 lo = min(min(b, d), min(f, h)), hi = max(max(b, d), max(f, h));
  vec3 hitLo = min(lo, e) / max(4.0 * hi, 1e-6);
  vec3 hitHi = (1.0 - max(hi, e)) / min(4.0 * lo - 4.0, -1e-6);
  vec3 l3 = max(-hitLo, hitHi);
  float lobe = max(-0.1875, min(max(l3.r, max(l3.g, l3.b)), 0.0)) * uSharp;
  float bL = luma(b), dL = luma(d), eL = luma(e), fL = luma(f), hL = luma(h);
  float range = max(max(max(bL, dL), max(eL, fL)), hL) - min(min(min(bL, dL), min(eL, fL)), hL);
  float alone = clamp(abs(0.25 * (bL + dL + fL + hL) - eL) / max(range, 1e-6), 0.0, 1.0);
  lobe *= 1.0 - 0.5 * alone;
  vec3 col = (lobe * (b + d + f + h) + e) / (4.0 * lobe + 1.0);

  float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.31) - 1.0;

#else
// The lengths along x and y of the edge at a texel (its luma lC, and its

// through it as a ramp or a step, 0 where it stands alone), and its
// gradient, added to dir and len with the weight w.
void edge(inout vec2 dir, inout float len, float w, float lA, float lB, float lC, float lD, float lE) {

// A tap of the kernel: a window of Lanczos 2 (approximated by polynomials),
// in the frame of the edge (along the gradient, x, and along the edge, y,
// scaled by len2), narrowed by lob, and cut at its first zero (clip).
void tap(inout vec3 sum, inout float weight, vec2 off, vec2 dir, vec2 len2, float lob, float clip, vec3 c) {

  float d2 = min(dot(v, v), clip);

  vec2 pp = gl_FragCoord.xy * inSize / uSize - 0.5, fp = floor(pp);

  // the texture, going up):
  //     b c
  //   e f g h
  //   i j k l
  //     n q

  vec3 e = at(o + ivec2(-1, 0)), f = at(o), g = at(o + ivec2(1, 0)), h = at(o + ivec2(2, 0));
  vec3 i = at(o + ivec2(-1, 1)), j = at(o + ivec2(0, 1)), k = at(o + ivec2(1, 1)), l = at(o + ivec2(2, 1));
  vec3 n = at(o + ivec2(0, 2)), q = at(o + ivec2(1, 2));
  float bL = luma(b), cL = luma(c), eL = luma(e), fL = luma(f), gL = luma(g), hL = luma(h);
  float iL = luma(i), jL = luma(j), kL = luma(k), lL = luma(l), nL = luma(n), qL = luma(q);
  // The edge's direction and how much it is one, from the four nearest
  // texels, weighted as a bilinear read would weigh them.
  vec2 dir = vec2(0.0);
  float len = 0.0;
  edge(dir, len, (1.0 - pp.x) * (1.0 - pp.y), bL, eL, fL, gL, jL);
  edge(dir, len, pp.x * (1.0 - pp.y), cL, fL, gL, hL, kL);
  edge(dir, len, (1.0 - pp.x) * pp.y, fL, iL, jL, kL, nL);
  edge(dir, len, pp.x * pp.y, gL, jL, kL, lL, qL);
  float d2 = dot(dir, dir);
  dir = d2 < 1.0 / 32768.0 ? vec2(1.0, 0.0) : dir * inversesqrt(d2);
  len = 0.25 * len * len;
  // Along a diagonal the texels lie sqrt(2) apart: the kernel stretches
  // so, across the edge, and grows along it; at an edge its negative lobe
  // is weaker (lob), so that it rings less.
  float stretch = 1.0 / max(abs(dir.x), abs(dir.y));
  vec2 len2 = vec2(1.0 + (stretch - 1.0) * len, 1.0 - 0.5 * len);
  float lob = 0.5 - 0.29 * len, clip = 1.0 / lob;
  vec3 sum = vec3(0.0);
  float weight = 0.0;
  tap(sum, weight, vec2(0.0, -1.0) - pp, dir, len2, lob, clip, b);
  tap(sum, weight, vec2(1.0, -1.0) - pp, dir, len2, lob, clip, c);
  tap(sum, weight, vec2(-1.0, 0.0) - pp, dir, len2, lob, clip, e);
  tap(sum, weight, vec2(0.0, 0.0) - pp, dir, len2, lob, clip, f);
  tap(sum, weight, vec2(1.0, 0.0) - pp, dir, len2, lob, clip, g);
  tap(sum, weight, vec2(2.0, 0.0) - pp, dir, len2, lob, clip, h);
  tap(sum, weight, vec2(-1.0, 1.0) - pp, dir, len2, lob, clip, i);
  tap(sum, weight, vec2(0.0, 1.0) - pp, dir, len2, lob, clip, j);
  tap(sum, weight, vec2(1.0, 1.0) - pp, dir, len2, lob, clip, k);
  tap(sum, weight, vec2(2.0, 1.0) - pp, dir, len2, lob, clip, l);
  tap(sum, weight, vec2(0.0, 2.0) - pp, dir, len2, lob, clip, n);
  tap(sum, weight, vec2(1.0, 2.0) - pp, dir, len2, lob, clip, q);
  // No overshoot beyond the four nearest: no ringing.
  outColor = vec4(clamp(sum / weight, min(min(f, g), min(j, k)), max(max(f, g), max(j, k))), 1.0);
}
#endif
