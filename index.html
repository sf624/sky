// Light that came down through cloud which lets tDown of it through (two
// streams), as it leaves the base at a cosine cv to the vertical: per unit
// of sunlight with the sun at a cosine mu0 over the top (x), and per unit of
// the sky's light, 2 ms (y). A slab lets the sun's light through a little
// more with the sun high (0.5 + 0.75 mu0), and a base is brighter overhead
// than aslant (as 1 + 2 cos, the overcast sky of the CIE). The sun's part
// has the gain BELOW; the sky's part takes the 6 % the sea sends back up.
// Inside the cloud, part of that light goes back up (r of the light going
// down there): looking down, the eye sees it. The light then varies with
// the cosine, as 1 + 2 cv for the stream down and 1 - 2 cv for the stream
// up (Eddington's form), from a base looking down on the dark sea to the
// same grey all round deep in a thick deck. (Inside, the light looking
// down was that of the horizon, and a line ran across the fog there.)
vec2 throughDeck(float mu0, float tDown, float cv, float r) {
  float esc = (3.0 / 7.0) * max(1.0 + 2.0 * cv + r * (1.0 - 2.0 * cv), 0.3 + 0.7 * r);
  return vec2(BELOW * mu0 * min((0.5 + 0.75 * mu0) * tDown, 1.0) * esc / PI, 1.06 * tDown * esc);
}

// What of the sky's light comes through cloud of optical depth tau to a
// point in it, as two streams let light through a slab.
float skyThrough(float tau) {
  return 1.0 / (1.0 + SKYV.y * tau);
}

float hg(float mu, float g) {
  return (1.0 - g * g) / (4.0 * PI * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}

// The clouds along the ray from ta to tb: what gets through them (Tc), the
// light they send to the eye per unit of sunlight (sOne: scattered once;
// sMany: many times) and of skylight (sAmb), and the distance it comes from
// (tBar; negative without clouds).
void clouds(vec3 o, vec3 d, float ta, float tb, float jitter,
            out float Tc, out float sOne, out float sMany, out float sAmb, out float sLean, out float tBar, out vec4 mapA, out vec4 mapB) {
  const float DS_MIN = 0.02 * Q_MARCH, DS_NEAR = 0.008 * Q_MARCH, DS_REL = 0.0045 * Q_MARCH, COARSE = 3.0, FINE = 0.35;
  Tc = 1.0; sOne = 0.0; sMany = 0.0; sAmb = 0.0; sLean = 0.0; tBar = -1.0;
  float pix = 2.0 * uTan / uRes.y * PASS_PIX * CLOUD_FRAME;
  // The steps grow with the distance. On a long path they grow faster, to
  // end within the budget; the nearest stay fine.
  const float BUDGET = COARSE * 80.0;
  // The steps also set how a cloud looks, so the plan must not jump where
  // the end of the ray does. A ray that meets the sea ends early: plan it
  // as if the sea were a mirror and the ray went on up to the tops. A ray
  // that just meets the sea is then planned like one that just misses it,
  // and a cloud in front of the horizon looks the same above and below it.
  float plan = tb;
  vec2 sea = raySphere(o, d, RG);
  if (sea.x > 0.0 && sea.x < 1e8) {
    vec3 pg = o + d * sea.x;
    plan = min(sea.x + raySphere(pg, reflect(d, normalize(pg)), RG + CT).y, 600.0);
  }
  // Up to knee the steps are DS_MIN; beyond it, rel * t. On a long path,
  // rel used to grow for the whole ray, and clouds 2 to 5 km off were
  // marched in steps of 100 to 200 m: their edges came out as thin dark
  // squiggles and a hatch. Now the steps grow from DS_REL * t by 1 + t / L,
  // where L is set so that this too ends within the budget (the sum of
  // dt / (DS_REL t (1 + t / L)) from s0 to plan), and never past rel * t:
  // fine near the eye, as before far off. The whole budget is for the part
  // beyond the knee, wherever the ray enters the shell. It used to pay for
  // the part before the knee as well: once the eye came within about 6 km
  // of the tops, that part ate the budget, the steps beyond it grew three
  // times longer, and the noise read with them was smoothed as much, so the
  // clouds below went soft between 6.5 and 5.2 km. The march's own limit
  // (CLOUD_STEPS) pays for the near part.
  float knee = DS_MIN / DS_REL;
  float s0 = max(ta, knee), E = exp(DS_REL * BUDGET);
  float L = plan > E * s0 ? s0 * plan * (E - 1.0) / (plan - E * s0) : 1e9;
  float rel = DS_REL * max(1.0, log(max(plan, knee) / max(ta, knee)) / DS_REL / BUDGET);

  // cloudShape): read through the GPU's filter its surfaces are facets 62 m
  // across, and from inside a cloud's fringe the fog showed them as flat
  // grey polygons with straight edges. The mean over the frames is smooth.
  shake = vec3(hash(gl_FragCoord.xy + 1.37 * uPass + 13.1), hash(gl_FragCoord.yx + 2.11 * uPass + 15.3),
               hash(gl_FragCoord.xy + 3.07 * uPass + 19.7)) - 0.5;

  // The first stage's rays round this pixel (3 by 3 of them, 6 pixels
  // across) met no cloud before the nearest that one of them met: the
  // clear air before it is not marched again, and the ray starts a little
  // before it, a share of a stride further for each pixel and frame (as at
  // ta). Where none of them met any, nor does this ray: a cloud that all
  // of them miss is under 2 pixels wide.
  if (uStage > 0.5) {
    // (The light map drawn: its texture may be larger, see `full` in the JS.)
    ivec2 c = ivec2(gl_FragCoord.xy * 0.5), last = ivec2(ceil(uRes / (2.0 * Q_PASS))) - 1;
    float near = 1e9, hit = -1.0, missed = 1e9;
    for (int k = 0; k < 9; k++) {
      float a = unpackHalf2x16(texelFetch(uLightMap, clamp(c + ivec2(k % 3, k / 3) - 1, ivec2(0), last), 0).x).x;
      if (a >= 0.0) near = min(near, a);
      else if (a > -1.5) missed = 0.0;
      hit = max(hit, a);
    }
    if (hit < 0.0) t = tb;
#if Q_GAP
    // Where one of them met none all the way to the end of its ray, this
    // ray ends once it is clear of the farthest cloud that the others met,
    // by a fifth of that distance and 2 km more: beyond it, the ray that
    // met none has found the air clear a pixel or two away. (Rays that
    // slipped past the edge of a near cloud marched on to the horizon, up
    // to CLOUD_STEPS steps, and the pixels that the GPU runs with them
    // waited for them.)

    float s = 0.95 * near - 0.03;
    if (s > t) t = s + jitter * COARSE * max(DS_MIN, s * min(DS_REL * (1.0 + s / L), rel));
  }

  // clear air, and slow down to a pixel's worth near a cloud, so that its
  // edge comes out crisp. came: the step that led here.
  float fPrev = 1.0, came = COARSE * dsAir;
  int walk = 0;
  float skipped = 0.0;

  // surface: at a view's optical depth into the cloud between 0 and
  // LIGHT_TAU, drawn as the light seen through the cloud there falls off
  // (e^-tau), new for each pixel and frame. The samples before the point wait
  // for its light (pend: their weight); the later ones take it. So the light
  // is that of the cloud's first few metres, as the eye sees them, and the
  // mean over the frames is its integral. (Two strata, 0 to 1.5 and 1.5 to
  // 4.5, each with its point, cost 0.6 to 0.8 ms more of the frame among
  // the heaps.)
  float one = 0.0, many = 0.0, amb = 0.0, lean = 0.0, pend = 0.0;
  bool lit = false, fog = true, waiting = false;
  float under = 0.0, TcLit = 1.0, TcIn = 1.0, tIn = 0.0, tauStar = 0.0, TcStar = 0.0, tE = 0.0, tauAt = 0.0, wIn = 0.0, tsIn = 0.0;
  float above = 0.0;

  // works it out after its loop: the pixels that the GPU runs together
  // then work out their light together. Inside the loop, each pixel that
  // met a cloud at another step made the others wait through its light
  // in turn.
  int i = 0;
  for (int pass = 0; pass < LONG_N(CLOUD_STEPS); pass++) {
    bool need = false;
    float y, bump, body, edge, lump, fb, lod, f, next, a;
    vec3 p;
    vec4 q;
    for (; i < LONG_N(CLOUD_STEPS); i++) {
      if (t >= tb || Tc < 0.01 || (Q_GAP == 1 && t > beyond && fPrev < 0.0 && !waiting)) {
        // (A cloud still waiting for its point takes the light of the last
        // sample.)
        need = waiting;
        tE = t - came;
        tauAt = log(TcIn / max(Tc, 1e-30));
        break;
      }
      ds = max(DS_NEAR, t * min(DS_REL * (1.0 + t / L), rel));
      dsAir = max(DS_MIN, ds);

      f = cloudField(p, lod, true, y, bump, body, edge, lump, q, fb);
      if (f > 0.0 && came > 1.5 * ds) {
        // Strode into a cloud: go back and walk, though not to before the
        // start (with the eye in a cloud, that would put the cloud behind
        // it, and the sky would show through).
        skipped = t;
        t = max(t - (came - ds), ta + jitter * ds);
        came = ds;
        walk = 3;
        continue;
      }
      // Under a base, which has no fine noise, the fine steps are no finer
      // than dsAir: rays that graze it crept along it.
      float dsIn = mix(ds, dsAir, smoothstep(0.0, 0.1, fb));
      if (f > 0.0) {
        // Fine steps find the surface and what shows through its fringe;
        // where little gets through, the old steps do.
        float den = cloudExtinction(f, lod, y, body, edge);
        // In a faint fringe (a shred) a step may be as long as takes a
        // seventh of the light, up to dsAir.
        next = clamp(2.0 * f, FINE * dsIn, max(mix(dsAir, dsIn, smoothstep(0.1, 0.6, Tc)), min(dsAir, 0.15 / max(den, 1e-3))));
        a = 1.0 - exp(-den * next);
        float t0 = t;
        if (!lit) {
          // A new cloud. It is lit unless the clouds in front already hide
          // more than 85 % of what lies behind: then it takes their light
          // (it would show little of its own, and the light is most of the
          // cost).
          lit = true;
          t0 = fPrev < 0.0 ? t - came * f / (f - fPrev) : t;
          if (Tc > 0.15 || TcLit > 0.99) {
            waiting = true;
            TcIn = Tc;
            tIn = t0;
            wIn = pend;
            tsIn = tsum;
#if Q_GOLD
            // (By the plastic number's step, so that it runs apart from the
            // start's jitter.)
            tauStar = -log(1.0 - fract(ign(gl_FragCoord.xy + 31.0) + 0.7548777 * mod(uPass, 4096.0)) * (1.0 - exp(-LIGHT_TAU)));
#else
            tauStar = -log(1.0 - ign(gl_FragCoord.xy + 5.588238 * uPass + 31.0) * (1.0 - exp(-LIGHT_TAU)));
#endif
            // (The first stage keeps only the slow parts, which change
            // little over those metres: it takes them at the entry, and
            // marches no deeper. Deeper, it cost 0.4 ms under a deck.)
            // (The first stage takes the light a depth of 1 in: at the place
            // the ray came in, the faint fringe of a soft cloud, it was the
            // light of a wisp, or of a crease behind one, and the second
            // stage drew thin dark lines along the lobes of near tops.)

        // step cost 0.3 ms of the frame.)

        // thin one) takes the light where the ray left it.

          // (The ray left the cloud before the depth chosen: the light is
          // worked out at the middle of what it met there, by weight. At the
          // place it left, a ray that grazed a lobe took the light of the
          // lobe's far side for the whole of its way through it: with the
          // sun behind the eye every lobe before another had a dark outline.)
          tE = pend > wIn ? (tsum - tsIn) / (pend - wIn) : t - came * f / (f - fPrev);

        lit = false;
        fog = false;
        // (Over an even sheet, the record's smooth, the steps far off are no shorter than ds: a ray that skims its

        // horizon. Only beyond 12 to 30 km: nearer, such steps left a thin ring on the sheet seen from 11 km.)
        next = clamp(-0.6 * f, mix(FINE, 1.0, uLow.w * (1.0 - formAt) * smoothstep(12.0, 30.0, t)) * dsIn, COARSE * dsAir);

        // has come down to them or gone as far sideways as they hold: it
        // strides there, less a share of a stride new for each pixel and
        // frame (landing in the same places, the steps after drew ripples).

        // that), and not again over a stride that met cloud (skipped).

          ivec2 n = textureSize(uTops, 0);

      vec3 upL = normalize(ps + eye());

      // 15 m): a near cloud shows its small billows lit and shaded as a far
      // one shows its big ones.
      // (Not over an even sheet, the record's smooth: its billows are those of the fine noise at every distance, and
      // with short steps near the eye they no longer shaded one another there: under a low sun the sheet was flat
      // within a few km, textured beyond, and the two met in an arc.)

      // over it, and that follows the angle of the view: from 11 km a ring round the eye, darker inside, with blocks.
      // So those steps start anywhere in the first step (jit, new for each pixel and frame: the mean over the frames
      // is the integral), and tauF comes from the first stage at every distance (worked out here within some 10 km,
      // it was lighter there: a pale blob with a crisp edge).
      float even = clamp(max(uLow.w, 2.0 * (1.0 - uLow.y)), 0.0, 1.0);

      // interleaved gradient noise, which covers the circle evenly over the
      // frames (white noise left a grain in the settled picture).
      vec3 side = normalize(cross(uLight, abs(uLight.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
      float ang = 2.0 * PI * ign(gl_FragCoord.yx + 5.588238 * uPass + 11.0);
      vec3 off = PENUMBRA * sqrt(hash(gl_FragCoord.xy + 3.71 * uPass + 19.1)) * (cos(ang) * side + sin(ang) * cross(uLight, side));

      // through it. (The heaps' 3D body has no base of its own there.)

      // depth towards the light
      // past its first two steps (tauCM, with the long shadows), the depth
      // straight up (above), and how much of the sky the place sees (sky,
      // skyLean). They come from the first stage, where a ray of a near
      // pixel entered the same cloud at the same distance (bilateral, after
      // Kopf et al. 2007: the near pixels that did, by their weights, however
      // small); else they are worked out here. (Also for a cloud behind a
      // thin fringe: only for the first, the outlines of billows seen
      // against those behind them were worked out in full, 4 ms of the
      // frame among the tops.)
      float tauCM = 0.0, sky = 0.0, skyLean = 0.0, tauB = 0.0, tauF = -1.0, tauN = 0.0, tauNn = 0.0, tauBn = 0.0;

      bool under0 = true;

          // these few pixels made whole groups of the GPU wait.)

          }
        }

          A /= ws;
          tauCM = A.y;
          above = A.z;
          sky = A.w;
          skyLean = B.x / ws;
          if (0.8 * pix * tE > 0.01 * (1.0 - even)) tauF = B.y / ws;
          tauN = B.z / ws;
          tauNn = B.w / ws;
        }
      }
      if (!mapped) {

        // mean of two columns up to SPREAD off to either side, at angles new
        // each frame: light spreads sideways on its way down through a deck,
        // and its base is lit as the depth over a few hundred metres round it
        // says. (Read at one place, the creases between the noise's Worley
        // cells showed on the base as tiles with straight edges; one column a
        // frame farther off left a grain in flight.) (One column where the
        // cloud has no base, and where the first stage did not serve.)
        float ar = 2.0 * PI * ign(gl_FragCoord.xy + 5.588238 * uPass + 23.0);
        vec3 aside = SPREAD * sqrt(hash(gl_FragCoord.xy + 3.71 * uPass + 29.3)) * basal * (cos(ar) * eastL + sin(ar) * northL);
        above = columnDepth(ps + eye() + aside);
        if (basal > 0.5 && !behind) above = 0.5 * (above + columnDepth(ps + eye() - aside));
        // How much of the sky the place sees: the light that comes through
        // the cloud from directions drawn over the sky's hemisphere (by the
        // cosine to the up, new for each pixel and frame), each through
        // the depth that way as two streams let it through. The mean over
        // the frames is the whole sky: a top sees all of it, a wall half,
        // a base under a deep cloud the little that comes through it. Two
        // directions mirrored about the vertical: on a wall one goes into
        // it and one away. skyLean: the same times how far each direction
        // lies towards the sun's side (the lean of the sky's light with the
        // sun low), only as far as the sky shows through unscattered that
        // way: the light that came through cloud has forgotten where it
        // came from. (Through the two streams, a face turned from the glow
        // got nearly as much of it as one turned to it, and a deck at dusk
        // had no relief.)
        // (Not where the light that came down through a deck takes over,
        // seen from under it or from inside a cloud: there neither is used.)
        under0 = fog || basal * smoothstep(2.0, 6.0, above) > 0.999;
        sunSide = uSun - dot(uSun, upL) * upL;
        sunSide /= max(length(sunSide), 1e-4);
        u1 = ign(gl_FragCoord.xy + 5.588238 * uPass + 61.0);
        float u2 = ign(gl_FragCoord.yx + 5.588238 * uPass + 73.0);
        h = sqrt(u1) * vec2(cos(2.0 * PI * u2), sin(2.0 * PI * u2));
        sky = 0.0;
        skyLean = 0.0;
        // The depth away from the light (tauB, out to 1.5 km): how much of
        // the mass lies behind the place, as the light sees it. Light that
        // went into a big mass comes back out of its lit face; a small one
        // lets it through.
        tauB = 0.0;
      }
      // The depth towards the light. Under a deck with the light above it
      // (more than 14 of depth overhead), that of a flat sheet: the steps
      // towards the light would only find the deck. (By degrees from 8 to 14
      // of depth: a sudden change drew lines.) Only where the cloud has a
      // base: on the side of a heap, under a bulge of it, the sheet made the
      // light's path run through all of the bulge, and with the sun low such
      // places were black pits on lit cloud.
      float slabbed = sunUp > 0.0 ? smoothstep(8.0, 14.0, above) * basal : 0.0;
      bool slab = slabbed == 1.0;
      // The marches of the light, as one loop of LIGHT_STEPS reads of the
      // field: the sky's two directions (steps 0 to 9, five each), the depth
      // away from the light (tauB, 10 to 15) and towards it (16 to 25). Each
      // call of cloudDensity is a copy of the field for Direct3D's compiler
      // (ANGLE on Windows), which took far longer over four loops, each with
      // its call. (The way on to the map of the shadow is a loop of its own,
      // below: as steps 26 to 33 of this one, it took no read where the sun
      // was high, yet the frame over a deck took a seventh longer on
      // Direct3D 11.)
      // The sky's: the first two steps, 30 and 90 m, see the fine turrets (a
      // seam between heads sees less of the sky than a crown).
      // tauB's: the first three steps, out to 175 m, see the fine turrets:
      // the side of a head away from the light has little behind it, and is
      // grey, as the Monte Carlo has it for small spheres. Always in the
      // second stage, at the point (backOn): taken from the first, where the
      // ray entered the cloud, at half the size, the shaded sides of near
      // towers were flat plates of one grey with angular outlines (the light
      // that went into the mass grows fivefold as tauB goes from 0 to 20).
      // The rest, out to
      // 1.575 km, with the light high (overMap), is the map of the clouds'
      // shadow: the depth between two places on the line of light (moved
      // aside by off: light strays in a cloud). With the light low, its
      // heights lie kilometres apart along the light, and the depth read
      // between them drew bands across the sides of heaps every height of
      // the map: there three more steps, by degrees.
      // The light's: the optical depth of the clouds towards the light over
      // the next 26 first steps' worth of distance (the first: step); the
      // steps grow. All read the field at the level of the first; the
      // first three see the fine noise, smoothed over some tens of metres
      // (light spreads that far in a cloud), and the depth of the first two
      // comes apart (crisp, for tauF, where it is wanted: see below): bumps
      // shade the creases beside them softly. The others make tauCM, where
      // the first stage did not serve. (Read half a level coarser at each
      // step, a small heap had too little depth towards the light: the
      // smoothed field falls under the edge of the cloud where the field
      // itself does not, and a heap of 6 seen towards the sun was lit as
      // one of 3, through and through. With the fine noise in every step
      // too, the depth came out right, 6 to 7, but the shaded sides of
      // towers were mottled.) The levels of the reads shrink with the step
      // below 50 m (kl < 0), so that a nearer cloud is shaded as a far one
      // is, at a smaller size. The later steps are moved
      // aside by off, each a third of a turn from the one before: light
      // strays inside a cloud, and over the frames the shadows of other
      // clouds soften. The stray grows with the depth the light has come
      // through (STRAY_TAU): light that went far through a cloud comes from
      // a wide part of it.
      bool skyOn = !mapped && !under0, backOn = uStage > 0.5 && !fog && basal * smoothstep(2.0, 6.0, above) <= 0.999, wantF = tauF < 0.0 && !slab, wantCM = !mapped && !slab;
      float overMap = smoothstep(0.25, 0.45, uLight.y);
      // (By a hash of its own: by interleaved gradient noise the mean kept a diagonal hatch, as for offB above. And as
      // a vector chosen with offL below: added to the steps' place in a term of its own, with a factor of 0, the
      // compiler still summed the place otherwise, and the default picture moved by a few levels in a few pixels.)
      vec3 jit = uLight * (even * (hash(gl_FragCoord.yx + 9.37 * uPass + 3.3) - 0.5) * step);
      float tw = 0.0, sw = 0.0, dw = 0.03, sb = 0.0, db = 0.025, tauL = 0.0, crisp = 0.0;
      // (The depth away from the light strays by off turned at random: by
      // the same interleaved gradient noise as the point and the steps
      // towards the light, the mean over the frames kept a diagonal hatch.)
      float ab = 2.0 * PI * hash(gl_FragCoord.xy + 7.13 * uPass + 41.7);
      vec3 w = vec3(0.0), offL = off, offB = cos(ab) * off + sin(ab) * cross(uLight, off);
      float sl = 0.0, dl = step, kl = min(log2(step / 0.05), 0.0), reach = 27.8 * max(step, 0.015), moveAt = 5.1 * max(step, 0.015);
      int i0 = wantF ? 0 : 2, i1 = wantCM ? 10 : 2;
      // (To bounds the compiler cannot know, as the long marches: unrolled, the field's code stood 26 times here,
      // and every line added to it made the scene's programs that much longer to compile.)
      for (int n = 0; n < LONG_N(LIGHT_STEPS); n++) {
        int j = n < 10 ? n % 5 : n < 16 ? n - 10 : n - 16;
        vec3 x;
        float l, wt;
        bool fine, moved = false;
        if (n < 10) {
          if (!skyOn || (n >= 5 && behind)) continue;
          if (j == 0) {
            w = (n == 0 ? 1.0 : -1.0) * (h.x * eastL + h.y * northL) + sqrt(1.0 - u1) * upL;
            tw = 0.0;
            sw = 0.0;
            dw = 0.03;
          }
          if (j == 4) dw = 2.4 - sw;
          x = ps + w * (sw + 0.5 * dw);
          l = max(log2(0.5 * dw / TEXEL_KM), lod);
          fine = j < 2;
          wt = dw;
        } else if (n < 16) {
          if (!backOn || (j >= 3 && overMap == 1.0)) continue;
          x = ps - uLight * (sb + 0.5 * db) + offB * min(sb / 0.3, 1.0);
          l = max(log2(0.5 * db / TEXEL_KM), lod);
          fine = j < 3;
          wt = db * (j < 3 ? 1.0 : 1.0 - overMap);
        } else {
          if (sl >= reach || j >= i1) continue;
          moved = sl > moveAt;
          l = max(lod, kl - 1.0);
          x = ps + uLight * (sl + 0.5 * dl) + (moved ? offL * min(1.0 + tauL / STRAY_TAU, STRAY_MAX) : jit);
          fine = !moved;
          wt = dl;
        }
        float dt = n < 16 || j >= i0 ? cloudDensity(x, l, fine) * wt : 0.0;
        if (n < 10) {
          tw += dt;
          sw += dw;
          dw *= 3.0;
          if (j == 4) {
            float tk = skyThrough(tw);
            sky += tk;
            skyLean += exp(-tw) * dot(w, sunSide);
          }
        } else if (n < 16) {
          tauB += dt;
          if (j < 3) tauBn += dt;
          sb += db;
          db *= 2.0;
        } else {
          if (j < 2) crisp += dt; else tauL += dt;
          if (j >= 2 && sl + dl <= CREASE_KM) tauNn += dt;
          if (moved) offL = -0.5 * offL + 0.866 * cross(uLight, offL);
          sl += dl;
          dl *= 1.6;
        }
      }
      if (skyOn) {
        if (!behind) {
          sky *= 0.5;
          skyLean *= 0.5;
        }
      }
      if (backOn && overMap > 0.0) tauB += overMap * max(cloudShadow(ps + eye() + off - 1.575 * uLight) - cloudShadow(ps + eye() + off - 0.175 * uLight), 0.0);
      if (!mapped) {
        if (slab) {
          tauCM = above / max(sunUp, 0.05);
        } else {
          // Beyond the light's own steps (some 0.4 to 1.4 km), the map of
          // the clouds' shadow: the other heaps towards the light, out to
          // tens of km, so that with the sun low they shade one another.
          // It holds the depth along the line of light through this place
          // from a height upwards, so read where the steps ended. With the
          // light low it is read at the map's next height above that place
          // (cloudShadowOwn), which lies up to 5 km farther along the light
          // (275 m of height at 3 degrees): that way to it is marched here,
          // in 8 steps at about the map's own level. (Without it, the cloud
          // on that way was left out, more the lower in each height of the
          // map: lit slabs with flat tops across the shaded sides of heaps,
          // one for each height of the map.)
          vec3 xe = ps + uLight * reach;
          float tauGap = 0.0;
          if (overMap < 1.0) {
            float hx = heightAt(xe), zk = min(floor(clamp((hx - CB) / (CT - CB), 0.0, 1.0) * float(SHADOW_N)) + 1.0, float(SHADOW_N));
            float g = max(CB + (CT - CB) * zk / float(SHADOW_N) - hx, 0.0) / max(dot(uLight, normalize(xe + eye())), 0.02);
            float lg = max(log2(0.04 * g / TEXEL_KM), lod);
            for (int n = 0; n < LONG_N(8); n++) tauGap += cloudDensity(xe + uLight * (g * (float(n) + 0.5) / 8.0), lg, false) * 0.125 * g;
          }
          tauCM = tauL + (1.0 - overMap) * tauGap + cloudShadowOwn(xe + eye());
          tauCM = mix(tauCM, above / max(sunUp, 0.05), slabbed);
        }
      }
      // At the point: the depth towards the light over its first two
      // steps, with the fine noise (tauF: the crisp shadows of the small
      // billows). Where a pixel is wider than 10 m (beyond some 12 km at
      // 1440p), from the first stage too: its billows are many pixels wide
      // there. (Worked out in the second stage everywhere, it cost 0.5 ms of
      // the frame in cruise.)
      if (tauF < 0.0) tauF = (slab ? 0.0 : crisp) * (1.0 - slabbed);
      // The depth towards the light over the light's own steps past the
      // first two, without the map of the clouds' shadow (tauN: the crease
      // below).
      if (!mapped) {
        tauN = tauL * (1.0 - slabbed);
        tauNn *= 1.0 - slabbed;
      }
      if (uStage == 0.0) {
        // The first stage keeps these, and its ray ends here.
        mapA = vec4(tIn, tauCM, above, sky);
        mapB = vec4(skyLean, tauF, tauN, tauNn);
        return;
      }
      // How deep the point lies under the cloud's surface (P: 0 there, 1 at
      // DARK_KM of dense cloud, as the view's optical depth to it says): the
      // light scattered many times builds up over the first tens of metres,
      // as the Monte Carlo shows. So a thin billow, a shred or a rim, which
      // the eye sees through before it gets deep, is darker than a deep one.
      // (From the field smoothed over 70 m, it came out in blotches: 0 or 1
      // over whole billows.)
      float P = clamp(tauAt / (SIGMA * DARK_KM), 0.0, 1.0);
      P = P * P * (3.0 - 2.0 * P);
      float mu = dot(d, uLight);
      // Light scattered once keeps the forward peak of the droplets. With
      // the sun on the horizon, the thin fringes towards it glowed like
      // red-hot wire against clouds near black; in photographs at sunset
      // the rims are pink or gold and faint. Their forward peak is halved
      // then. (Here, not before the march: held through it, they slowed it.)
      float p0 = mix(0.8, 0.4, 1.0 - smoothstep(-0.02, 0.12, uLight.y)) * hg(mu, 0.8) + 0.2 * hg(mu, -0.25);
      float tauS = tauF + tauCM;
      one = p0 * exp(-tauS);
      // Light scattered many times, from the depths towards the light
      // (tauS, tauCM) and away from it (tauB) alone, no normals: a lobe of
      // the first few orders (Wrenninge et al. 2013), which fades slowly
      // with the depth towards the light and builds up with the cloud
      // behind the place; and light that went into the whole mass and comes
      // back out (the larger the mass behind the place, the more), less the
      // deeper the place lies from the light. So a big mass is brilliant on
      // its lit face and grey on its shaded one, and a small head is lit
      // through. It is less where less cloud surrounds the point (dark: a
      // rim, a billow that stands out). The constants come from a Monte
      // Carlo of spheres (see design.md).
      float dark = mix(DARK, 1.0, P), kb = MSD.y * tauB;
      float ms = MS1.x * hg(mu, MS1.y) * exp(-MS1.z * tauS) * (MS_UP + kb) / (1.0 + kb);
      float diffuse = MSD.x / (4.0 * PI) * dark * (MSD.z + kb) / (1.0 + MSD.y * tauCM + kb);
      // In a crease on the lit side, between heads that shade it, less of
      // that light. The spheres of the Monte Carlo have no creases: there,
      // a place with much cloud behind it and some depth towards the light
      // lies near the edge of the lit face, where light goes in beside it.
      // In a crease the heads beside it take that light, and photographs
      // show creases 0.6 to 0.8 as bright as the heads round them (0.85 to
      // 0.9 only with the sun behind the eye, where the creases are lit). So
      // the light scattered many times is less by up to CREASE.x as the
      // depth towards the light over the light's own steps (tauLoc, without
      // the map of the clouds' shadow: its heights lie hundreds of metres
      // apart, and with the sun low it drew bands across towers) grows past
      // CREASE.y; only where the place lies on the side of its mass that the
      // light falls on (much more cloud behind it than towards the light,
      // tauB against tauLoc): the shaded side keeps its light.
      // Both depths are read near the place (CREASE_KM): a crease is shaded
      // by the heads beside it. (Over the light's own steps and tauB out to
      // 1.5 km, with the sun high every wall had the deck and the tower
      // under it behind and the tower's top towards the light, and was
      // darkened as a crease: grey walls under white ledges, like snow on
      // rocks.)
      // (With the sun behind the eye the eye sees what the sun sees, and the
      // depth over the first steps, tauF, finds only the shadows of small
      // heads just beside the place: on the lit walls of towers they were
      // grey blotches. Photographs show creases nearly as bright as the
      // heads then.)
      float tauLoc = tauF * smoothstep(-0.95, -0.6, mu) + tauNn;
      float crease = 1.0 - CREASE.x * smoothstep(CREASE.z, CREASE.w, tauBn / (tauBn + tauLoc + 1e-3)) * (1.0 - exp(-tauLoc / CREASE.y));
      ms *= crease;
      diffuse *= crease;
      // Seen from below, a cloud under more of itself shows the light that
      // came down through it, the sun's and the sky's, spread out
      // (throughDeck): a slab of optical depth above lets through 1 / (1 +
      // COLUMN above) of what falls on it. So a base follows the depth over
      // each place: dark under thick cells and rolls, light under thin
      // gaps. Inside a cloud (the eye in it), the light there is that of
      // two streams in a slab, one down and one back up: from about all of
      // it near the top to 1 / (1 + COLUMN above) at the base, as the depth
      // under the place (under) is to the whole. (It was lit as a surface,
      // and the fog was a dark, flat grey.)
      if (fog) {
        vec3 pa = ps + eye();
        under = max(columnDepth(pa * (RG + CB) / length(pa)) - columnDepth(pa), 0.0);
      }
      float mu0 = clamp(sunUp, 0.0, 1.0), tDown = (1.0 + COLUMN * under) / (1.0 + COLUMN * (above + under));
      vec2 deck = fog ? throughDeck(mu0, tDown, dot(d, upL), COLUMN * under / (1.0 + COLUMN * under))
                      : throughDeck(mu0, tDown, max(dot(d, upL), 0.0), 0.0);
      float below = fog ? 1.0 : basal * smoothstep(2.0, 6.0, above);
      // From below, a deck shows its cells: thick middles darker, thin rims
      // lighter, by up to half (at a fifth, a base seen from just under it
      // was a smooth blur), some 600 m and 100 m across (Worley cells of the
      // noise, read at 3.5 and 10 times the tile's frequency: texels of 18
      // and 6 m, whose facets do not show). They are read in one level layer
      // of the noise: a base is nearly level, and where it crossed from one
      // layer to the next the bends of the GPU's filter drew long straight
      // lines. (Beyond a few km they fade: seen so far aslant, they made
      // streaks.)
      float cells = 1.0;
      if (below > 0.0 && !fog) {
        vec3 qs = q.xyz + vec3(ps.x - p.x, heightAt(ps) - heightAt(p), ps.z - p.z) / BASE_KM;
        vec4 cn = textureLod(uNoise, vec3(qs.x * 3.5, 0.37, qs.z * 3.5), max(lod + 1.8, 0.0));
        float cell = 0.65 * cn.g * (2.0 - cn.g) + 0.35 * textureLod(uNoise, vec3(qs.x * 10.0, 0.61, qs.z * 10.0), max(lod + 3.3, 0.0)).g;
        // (An even sheet, the record's smooth, shows 0.3 of them: a ceiling faintly mottled.)
        cells = mix(1.0, clamp(exp(-5.5 * (cell - 0.66)), 0.5, 1.6), 1.0 - smoothstep(2.0, 6.0, tE));
        cells += 0.7 * uLow.w * (1.0 - cells);
      }
      many = ms + mix(diffuse, cells * deck.x, below);
      // The sky's light, by how much of the sky the place sees; less where
      // less cloud surrounds the point, as the sun's light scattered many
      // times.
      float skyDark = mix(SKYV.z, 1.0, P);
      // (The light through a deck, seen from under it or inside, keeps the
      // unit it was set in against photographs, 2 cloudSky: main scales all
      // of this by the white surface's light, unit.)
      float unitHere = below > 0.0 ? uSkyEnc * textureLod(uSkyLight, vec2(clamp((heightAt(ps) - CB) / (CT - CB), 0.0, 1.0) * 15.0 / 16.0 + 0.5 / 16.0, 0.5), 0.0).y : 1.0;
      amb = mix(SKYV.x * sky * skyDark, cells * deck.y / unitHere, below);
      // With the sun low, the sky's light comes more from the sun's side
      // (the glow) than from the other: what sees the sky on that side gets
      // more of it, warm, and what sees it on the other side less, the blue
      // of the sky above (main, with the lean of the mean light: msLean).
      // Not through a deck (that light has forgotten where it came from),
      // and not by day, where the sky's light was set against photographs
      // with the mean light alone. (3 pi / 4: a wall towards the sun's side
      // gets as much as it did by its normal.)
      float low = 1.0 - smoothstep(0.05, 0.35, uLight.y);
      lean = (1.0 - below) * low * SKYV.x * skyDark * 2.356 * skyLean;
      // The samples that waited for this point take its light.
      sOne += pend * one;
      sMany += pend * many;
      sAmb += pend * amb;
      sLean += pend * lean;
      pend = 0.0;
      waiting = false;
    }
    fPrev = f;
    came = next;
    t += next;
    i++;
  }
  if (Tc < 0.01) Tc = 0.0;
  if (wsum > 0.0) tBar = tsum / wsum;
  // (Only the first stage, which returns above, keeps a light. -2: its
  // march ran out of steps before the end of the ray, so it did not see
  // that the rest is clear: see Q_GAP.)
  mapA = vec4(Q_GAP == 1 && t < tb ? -2.0 : -1.0);
  mapB = vec4(0.0);
}

// ---------- Sea ----------
// Light scattered back out of clear ocean water, per unit of light going
// in (as a matt surface would), for the twelve wavelengths: blue, and hardly
// any red.
const vec4 SEA[3] = vec4[3](
  vec4(0.026, 0.028, 0.026, 0.019), vec4(0.012, 0.0070, 0.0038, 0.0017), vec4(0.0006, 0.0004, 0.0003, 0.0002));

// The sky as the sea sees it, towards dir: a short march, enough for a
// reflection.
void skyAt(vec3 p0, vec3 dir, float betaM, float extM, out vec4 S[3]) {
  const int NS = Q_SKY_NS;
  S[0] = vec4(0.0); S[1] = vec4(0.0); S[2] = vec4(0.0);
#if Q_AIR_LUT && !defined(SKY_LIGHT)
  // (From the table's slices round LUT_SEA: the sky as the sea sees it,
  // read between them by the height of the light over that place of the
  // sea. Not for the sky's light on the clouds, drawn now and then from
  // their heights.
  // The sharp lobe's phase as the pixel's: with the table's alone, the
  // sun's glow spread wide, and mirrored in the glitter it filled the
  // clouds' shadows on the sea.)
  vec3 odS;
  vec3 up = normalize(p0);
  float dl = asin(clamp(dot(uLutLight, up), -1.0, 1.0)) - asin(clamp(uLutLight.y, -1.0, 1.0));
  airSlice(lutUV(dir, up, LUT_SEA_ALT), LUT_SEA + clamp(dl / lutSeaSpan(), -2.0, 2.0), 1.0, false, vec2(sharpLobe(dot(dir, uSun)), sharpLobe(dot(dir, uMoon))), S, odS);
#else
  float tmax = raySphere(p0, dir, RT).y;
  vec3 phaseSun = phases(dot(dir, uSun));
  vec3 phaseMoon = phases(dot(dir, uMoon));
  vec3 od = vec3(0.0);
  vec4 Tv[3];
  float prev = 0.0;
  for (int i = 0; i < LONG_N(NS); i++) {
    float f = (float(i) + 1.0) / float(NS);
    float t1 = tmax * f * f;
    float dt = t1 - prev;
    vec3 p = p0 + dir * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec4 dens = densities(h) * vec4(dt, dt, dt, 1.0);
    od += 0.5 * dens.xyz;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) {
      Tv[k] = exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    }
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI, 1.0, 1.0, phaseSun, dir, Tv, S);
    if (uMoonI > 0.0 && skyMoon) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI, 1.0, 1.0, phaseMoon, dir, Tv, S);
    od += 0.5 * dens.xyz;
  }
#endif
}

// How much of a rough sea hides behind its own waves, seen from a direction
// with cosine c to the vertical (Smith's term for Gaussian slopes, in the
// rational form of Walter et al., 2007).
float waveShade(float c, float s2) {
  float a = c / sqrt(s2 * max(1.0 - c * c, 1e-6));
  return a < 1.6 ? (1.0 - 1.259 * a + 0.396 * a * a) / (3.535 * a + 2.181 * a * a) : 0.0;
}

// Map of the waves, repeating (drawn at start). R, G: the slope of a wind
// sea along x and z, in units of its rms; B: the slope squared; A: streaks.
uniform sampler2D uWaves;
const vec2 WIND = vec2(0.8944, 0.4472);              // the wind blows this way (x, z)
// Swell from far storms: plane waves with a whole number of crests (x, z)
// in WEATHER_KM, and the amplitude of their slope along x and z. Two
// trains: six waves of 200 to 340 m, and two of 120 to 170 m from elsewhere.
const int SWELLS = 8;
const vec4 SWELL[SWELLS] = vec4[SWELLS](
  vec4(-1246.0, 182.0, -0.0109, 0.0016), vec4(-1043.0, 324.0, -0.0114, 0.0035),
  vec4(-1061.0, 74.0, -0.0152, 0.0011), vec4(-978.0, -23.0, -0.0111, -0.0003),
  vec4(-827.0, 187.0, -0.0112, 0.0025), vec4(-794.0, 212.0, -0.0118, 0.0031),
  vec4(-775.0, -1975.0, -0.0036, -0.0091), vec4(-468.0, -1475.0, -0.0031, -0.0098));

// The glitter at night as the eye sees it: separate sparkles, not their
// mean. The sea is cut into facets of FACET km, each with its own slope
// drawn from the slopes the glitter leaves to the ripples (variance s2r);
// a facet sparkles where its slope is within FACET_TOL (of that variance)
// of the one that mirrors the light to the eye (zh), as a spot of SPOT
// facets at a place of its own in the facet. Divided by the mean of that
// over all facets, so that the glitter keeps its light. The spot is read
// over the pixel's footprint (fa, fc; as the foam's breakers), so that it
// shows as a point however far. Where the footprint is wider than a facet,
// the facets are taken four at a time, level by level, as one that
// sparkles four times as often; where it holds more than a few sparkles,
// they are counted (sparkleCount). The facets stay put on the sea: a still
// holds still; in flight zh moves and they twinkle.
const float FACET = 0.0005;
const float FACET_TOL = 0.02;
const float SPOT = 0.1;
float sparkleAt(float size, float tol, vec2 x, vec2 zh, float s2r, vec2 fa, vec2 fc, int one) {
  float tau2 = tol * s2r;
  float mean = tau2 / (s2r + tau2) * exp(-dot(zh, zh) / (s2r + tau2));
  float n = round(WEATHER_KM / size);                // facets to the map's side (a power of 2 times 1000)
  vec2 g = x / size, g0 = floor(g);
  vec2 ha = 0.5 * fa / size, hc = 0.5 * fc / size;
  vec3 cov = vec3(ha.x * ha.x + hc.x * hc.x, ha.x * ha.y + hc.x * hc.y, ha.y * ha.y + hc.y * hc.y) + vec3(SPOT * SPOT, 0.0, SPOT * SPOT);
  float det = cov.x * cov.z - cov.y * cov.y;
  float sum = 0.0;
  for (int j = -1; j <= one; j++) {
    for (int i = -1; i <= one; i++) {
      vec2 c = mod(g0 + vec2(i, j), n);
      vec2 lo = mod(c, 1000.0), hi = floor(c / 1000.0);
      vec3 h = vec3(lo, hi.x * 512.0 + hi.y + size * 7919.0);
      float u1 = hash3(h + 0.37), u2 = hash3(h + 0.71);
      vec2 sf = sqrt(-s2r * log(max(u1, 1e-7))) * vec2(cos(2.0 * PI * u2), sin(2.0 * PI * u2));
      float w = exp(-dot(zh - sf, zh - sf) / tau2);
      if (w > 1e-3) {
        vec2 e = g0 + vec2(i, j) + vec2(hash3(h + 0.13), hash3(h + 0.53)) - g;
        sum += w * exp(-0.5 * (cov.z * e.x * e.x - 2.0 * cov.y * e.x * e.y + cov.x * e.y * e.y) / det) / (2.0 * PI * sqrt(det));
      }
    }
  }
  return sum / max(mean, 1e-6);
}
// Many sparkles to a pixel: their count. A cell of the sea of the given
// size holds lam of them on average (p of its facets); its light over the
// mean is drawn as a lognormal of variance GRAIN / lam, from a hash of the
// cell, and read as value noise (bilinear between cells) at GRAIN_N points
// along the footprint. The mean stays 1 at every size; the grain gets finer
// and fainter as the count grows with distance, and holds still on the sea.
const float GRAIN = 4.0;
const int GRAIN_N = 6;
float sparkleCell(vec2 c, float n, float size) {
  c = mod(c, n);
  vec2 lo = mod(c, 1000.0), hi = floor(c / 1000.0);
  vec3 h = vec3(lo, hi.x * 512.0 + hi.y + size * 7919.0);
  return sqrt(-2.0 * log(max(hash3(h + 0.29), 1e-7))) * cos(2.0 * PI * hash3(h + 0.83));
}
float sparkleCount(float size, float p, vec2 x, vec2 fa, int one) {
  float lam = p * (size / FACET) * (size / FACET);
  float v = min(log(1.0 + GRAIN / max(lam, 1e-6)), 2.5), s = sqrt(v);
  float n = round(WEATHER_KM / size);
  float sum = 0.0;
  for (int i = 0; i < GRAIN_N * one; i++) {
    vec2 g = (x + fa * ((float(i) + 0.5) / float(GRAIN_N) - 0.5)) / size - 0.5;
    vec2 g0 = floor(g), f = g - g0;
    vec4 e = exp(s * vec4(sparkleCell(g0, n, size), sparkleCell(g0 + vec2(1.0, 0.0), n, size),
                          sparkleCell(g0 + vec2(0.0, 1.0), n, size), sparkleCell(g0 + 1.0, n, size)) - 0.5 * v);
    sum += mix(mix(e.x, e.y, f.x), mix(e.z, e.w, f.x), f.y);
  }
  return sum / float(GRAIN_N);
}
float sparkle(vec2 x, vec2 zh, float s2r, vec2 fa, vec2 fc) {
  // p: the share of facets that sparkle here. Where the footprint holds
  // few sparkles (counted at the middle of the path, zh = 0), they are
  // drawn one by one; from 1 to 8 they hand over to their count.
  float tau2 = FACET_TOL * s2r;
  float p = tau2 / (s2r + tau2) * exp(-dot(zh, zh) / (s2r + tau2));
  float across = length(fc), along = length(fa);
  float count = smoothstep(0.0, 3.0, log2(along * across / (FACET * FACET) * FACET_TOL / (1.0 + FACET_TOL)));
  float s = 0.0, c = 0.0;
  // The loops below run to a bound the compiler cannot know (one is 1):
  // unrolled, they made the whole shader heavier for the GPU even by day,
  // when no sparkle is drawn (4.5 ms of 17 at 2560 x 1440, November 2026).
  int one = int(step(0.0, uNightEye));
  if (count < 1.0) {
    float level = max(log2(along / FACET), 0.0);
    float k = floor(level), f = level - k;
    float tol = FACET_TOL * exp2(2.0 * k);
    float many = smoothstep(2.0, 32.0, FACET_TOL * exp2(2.0 * level));   // so many facets: their mean
    s = many >= 1.0 ? 1.0 : mix(mix(sparkleAt(FACET * exp2(k), tol, x, zh, s2r, fa, fc, one),
                                    sparkleAt(FACET * exp2(k + 1.0), 4.0 * tol, x, zh, s2r, fa, fc, one), f), 1.0, many);
  }
  if (count > 0.0) {
    // Cells about as wide as the footprint, or a GRAIN_N-th of its length.
    float level = max(log2(max(across, along / float(GRAIN_N)) / FACET), 0.0);
    float k = floor(level), f = level - k;
    float a = sparkleCount(FACET * exp2(k), p, x, fa, one) - 1.0, b = sparkleCount(FACET * exp2(k + 1.0), p, x, fa, one) - 1.0;
    c = max(1.0 + ((1.0 - f) * a + f * b) / sqrt((1.0 - f) * (1.0 - f) + f * f), 0.0);
  }
  return mix(s, c, count);
}

// The sea at pg, at distance t along d, behind air of depth od and under
// clouds of depth tau towards the light: the glitter of the sun on the
// waves, the mirrored sky, and the blue light from below.
// The slopes of the waves have the variance of Cox and Munk (1954). The
// waves long enough for the picture to show tilt the surface: swell, and
// three bands of the wind sea from the map. What a pixel's footprint
// averages away stays in the variance, so that the light of the glitter
// is the same from near and far.
// G: the glitter alone (for the meter).
void addSea(vec3 pg, vec3 d, float t, vec3 od, float betaM, float extM, float vis, float tau, inout vec4 L[3], inout vec4 G[3]) {
  vec3 n = normalize(pg);
  vec3 ps = pg + n * 0.001;
  float cv = max(dot(n, -d), 0.0);
  float pix = 2.0 * uTan / uRes.y * Q_FRAME;
  // Axes on the sea along the map's x and z, and the footprint of the pixel
  // on them: fa along the view (long when seen aslant), fc across.
  vec3 ex = normalize(vec3(1.0, 0.0, 0.0) - n * n.x), ez = cross(ex, n);
  vec2 x = pg.xz + uDrift;
  vec2 dh = vec2(dot(d, ex), dot(d, ez));
  float dl = length(dh);
  vec2 ua = dl > 1e-4 ? dh / dl : vec2(1.0, 0.0);
  float across = pix * t, along = across / max(cv, 0.02);
  vec2 fa = along * ua, fc = across * vec2(-ua.y, ua.x);

  // The wind varies: gusts and calms over kilometres (the weather map),
  // more so in light airs, and streaks within them.
  float gust = textureLod(uWeather, x / WEATHER_KM, log2(max(along / (WEATHER_KM / 1024.0), 1.0))).b;
  float streak = textureGrad(uWaves, x * (40.0 / WEATHER_KM), fa * (40.0 / WEATHER_KM), fc * (40.0 / WEATHER_KM)).a;
  float wind = uWind * exp(mix(1.2, 0.4, smoothstep(2.0, 9.0, uWind)) * (2.0 * gust - 1.0) + 0.3 * (streak - 0.5));
  float s2 = 0.003 + 0.00512 * wind;

  // Wind waves. The longest are as long as a grown sea has them
  // (0.9 U^2 metres), ten to a tile of the map; each band reaches down to a
  // sixth of that, and holds the same variance (0.0075, from the constant
  // of Phillips), up to a fifth of the whole. slope: the tilt of the
  // footprint; hidden: the variance within it.
  float share = min(0.0075 / s2, 0.2) * s2;
  float rep = max(round(WEATHER_KM / (0.0096 * uWind * uWind)), 1.0) / WEATHER_KM;
  vec2 slope = vec2(0.0);
  float hidden = 0.0, crest = 0.0;
  // A footprint as wide as the waves averages them all (R, G 0.5, B 0.125).
  // The read still has some of the longest in it at 0.12 of the map: it
  // fades into that mean over the factor of three before, so that no edge
  // shows where the read stops. The fade is of R, G and B, and h is taken
  // after it: what slope loses, hidden gains.
  for (int i = 0; i < 3; i++) {
    float far = smoothstep(-1.585, 0.0, log2(along * rep / 0.12));
    vec4 w = vec4(0.5, 0.5, 0.125, 0.0);
    if (far < 1.0) w = mix(textureGrad(uWaves, x * rep + 0.37 * float(i), fa * rep, fc * rep), w, far);
    vec2 s = 8.0 * w.rg - 4.0;
    float h = max(8.0 * w.b - dot(s, s), 0.0);
    slope += s;
    hidden += h;
    if (i > 0) crest += dot(s, WIND);                // the short waves, down the wind
    rep *= 6.0;
  }
  slope *= sqrt(share);
  hidden *= share;
  float micro = s2 - 3.0 * share;
  // Swell, smoothed over the footprint. Currents bend its crests: the map
  // of the streaks, read wide, shifts it by up to some 200 m.
  vec2 xs = (x + (textureLod(uWaves, x * (5.0 / WEATHER_KM), 2.0).a - 0.5) * vec2(0.24, 0.32)) / WEATHER_KM;
  for (int i = 0; i < SWELLS; i++) {
    vec2 k = SWELL[i].xy * (2.0 * PI / WEATHER_KM);
    float keep = exp(-0.125 * (dot(k, fa) * dot(k, fa) + dot(k, fc) * dot(k, fc)));
    float var = 0.5 * dot(SWELL[i].zw, SWELL[i].zw);
    slope += SWELL[i].zw * (keep * cos(2.0 * PI * fract(dot(SWELL[i].xy, xs))));
    hidden += var * (1.0 - keep * keep);
    micro -= var;
  }
  // What is left for the ripples no picture shows.
  float s2r = max(micro, 0.1 * s2) + hidden;

  // Whitecaps cover 2.95e-6 U^3.52 of the sea (Monahan and O'Muircheartaigh,
  // 1980); two fifths of that is thick, white foam. It lies in separate
  // breakers: a cell of a grid (0.3 of the longest wave) holds one at
  // most, somewhere, of some size (many small, a few large), longer along
  // the crest; more of them in the streaks of the wind. From close, count
  // what the footprint covers of the breakers around (seen sharp, a
  // breaker has an edge, ragged with the short waves); from far, take the
  // mean.
  float white = 0.4 * 2.95e-6 * pow(wind, 3.52);
  float cells = max(round(WEATHER_KM / (2.7e-4 * uWind * uWind)), 1.0);
  float cell = WEATHER_KM / cells;
  float foam = white;
  if (white > 1e-5 && along < 1.5 * cell) {
    const float SB = 0.07;                           // size of a breaker, in cells
    float chance = white / (2.0 * PI * SB * SB * 1.2) * exp(3.5 * (streak - 0.5) - 0.245);
    vec2 g = x / cell, g0 = floor(g);
    // The footprint as a Gaussian (covariance aa, ac, cc), in cells.
    vec2 ha = 0.5 * fa / cell, hc = 0.5 * fc / cell;
    vec3 cov = vec3(ha.x * ha.x + hc.x * hc.x, ha.x * ha.y + hc.x * hc.y, ha.y * ha.y + hc.y * hc.y);
    // A breaker of unit size: 1.5 SB along the crest, SB / 1.5 down the wind.
    vec3 one = SB * SB * (2.25 * vec3(WIND.y * WIND.y, -WIND.x * WIND.y, WIND.x * WIND.x)
                        + 0.444 * vec3(WIND.x * WIND.x, WIND.x * WIND.y, WIND.y * WIND.y));
    float sum = 0.0;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec2 id = g0 + vec2(i, j);
        float r = hash(floor(mod(id, cells) + 0.5) + 0.37);       // under the chance: a breaker; also its size and place
        if (r < chance) {
          float size = fract(1731.7 * r);
          size = 0.5 * exp(1.6 * size * size);
          vec2 e = id + fract(vec2(4217.3, 9127.1) * r) - g;
          vec3 v = cov + size * size * one;
          float det = v.x * v.z - v.y * v.y;
          float sharp = size * size * SB * SB / sqrt(det);
          float b = sharp * exp(-0.5 * (v.z * e.x * e.x - 2.0 * v.y * e.x * e.y + v.x * e.y * e.y) / det);
          float edge = mix(0.3, 0.06, smoothstep(0.3, 0.9, sharp));
          sum += mix(b, smoothstep(0.37 - edge, 0.37 + edge, b * exp(0.7 * crest)), smoothstep(0.3, 0.7, sharp));
        }
      }
    }
    foam = mix(min(max(chance, 1.0) * sum, 1.0), white, smoothstep(0.6, 1.5, along / cell));
  }
  foam *= 0.5;                                       // the albedo of thick foam

  vec4 T[3], lit[3];
  for (int k = 0; k < 3; k++) {
    T[k] = vis * exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    lit[k] = vec4(0.0);
  }
  // A cloud blocks the direct light, but lets diffuse light through.
  float soft = 1.0 / (1.0 + 0.1 * tau);
  float c = dot(n, uLight);
  if (uLightI > 0.0 && c > 0.0) {
    vec3 ol = depthToTop(ps, uLight);
    // Glitter: the share of the waves tilted so as to mirror the light to
    // the eye. That takes the slope zh; the ripples spread around the tilt
    // of the footprint.
    vec3 hv = normalize(uLight - d);
    float ch = max(dot(hv, n), 1e-3);
    vec2 zh = -vec2(dot(hv, ex), dot(hv, ez)) / ch - slope;
    float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(hv, -d), 0.0, 1.0), 5.0);
    float glint = F * exp(-dot(zh, zh) / s2r)
                / (4.0 * PI * s2r * max(cv, 1e-3) * ch * ch * ch * ch)
                / (1.0 + waveShade(max(cv, 1e-3), s2) + waveShade(c, s2));
#if Q_SPARKLE
    if (uNightEye > 0.0) glint *= mix(1.0, sparkle(x, zh, s2r, fa, fc), uNightEye);
#endif
    float direct = exp(-tau);
    for (int k = 0; k < 3; k++) {
      lit[k] = uLightI * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      vec4 g = T[k] * lit[k] * direct * glint;
      G[k] += g;
      L[k] += g + T[k] * lit[k] * soft * c / PI * (SEA[k] + foam);
    }
  }
  // The sky, mirrored by the tilted footprint. Rough water mirrors less at
  // grazing angles than flat water (the mean Fresnel factor of Bruneton et
  // al., 2010, from the spread of the slopes along the view: half the
  // variance), and mirrors a higher part of the sky.
  vec3 nr = normalize(n - slope.x * ex - slope.y * ez);
  float sigma = sqrt(0.5 * s2r);
  float Fm = 0.02 + 0.98 * pow(1.0 - max(dot(nr, -d), 0.0), 5.0 * exp(-2.69 * sigma)) / (1.0 + 22.7 * pow(sigma, 1.5));
  vec3 up = reflect(d, nr);
  up += max(0.02 - dot(up, n), 0.0) * n;             // never into the sea
  up = normalize(up + 0.3 * n);
  vec4 S[3], msS[3], msM[3];
  skyAt(ps, up, betaM, extM, S);
  multiScatter(0.0, dot(n, uSun), msS);
  multiScatter(0.0, dot(n, uMoon), msM);
  // Clouds in the mirror. The waves too small to show (s2r) spread what the
  // sea mirrors over some ten to twenty degrees each way, so it shows the
  // mean light of a wide patch of the clouds, more of it the more the view
  // grazes, never their single cells. (Mirrored along one direction, the
  // cells of a deck came out as sharp dark ovals on a pale sheet: wet sand,
  // not a sea.) Four directions stand for the spread (the slopes at plus or
  // minus sigma along two axes, turned anew each frame, so that the mean
  // over the frames covers it), each weighed by how much of its facets the
  // eye sees (more of those tilted towards it: the mirror shows a higher
  // part of the sky). Each reads the cloud straight up through the shell
  // where it meets the clouds' middle (four reads), smoothed over the patch
  // it stands for: what is left of the sky behind it (seen), and the light
  // of the base there as clouds draws it (throughDeck, from the depth
  // overhead), seen aslant.
  vec4 mir[3];
  float seen = 1.0;
  for (int k = 0; k < 3; k++) mir[k] = 0.75 * (uSunI * msS[k] + uMoonI * msM[k]) + 0.035 * soft * c * lit[k];
//[ middle clouds
  // (With middle clouds alone too: the same four directions, and no read of the low clouds.)
  if (uCloud > 0.0 || uMid.x > 0.0) {
//| without
  if (uCloud > 0.0) {
//]
    float wsum = 0.0;
    vec2 e1 = sigma * ua, e2 = vec2(-e1.y, e1.x);
    mir[0] = vec4(0.0); mir[1] = vec4(0.0); mir[2] = vec4(0.0);
#if Q_MIRROR == 1
    // One of the four directions, drawn by its weight, new for each pixel
    // and frame: the mean over the frames is the same.
    vec4 ws4;
    for (int j = 0; j < 4; j++) {
      vec2 o = slope + (j < 2 ? e1 : -e1) + ((j & 1) == 0 ? e2 : -e2);
      ws4[j] = max(dot(normalize(n - o.x * ex - o.y * ez), -d), 0.0);
    }
    float pick = ign(gl_FragCoord.xy + 4.27 * uPass + 37.0) * (ws4.x + ws4.y + ws4.z + ws4.w);
    int one = pick < ws4.x ? 0 : pick < ws4.x + ws4.y ? 1 : pick < ws4.x + ws4.y + ws4.z ? 2 : 3;
    for (int j = one; j <= one; j++) {
#else
    for (int j = 0; j < 4; j++) {
#endif
      vec2 o = slope + (j < 2 ? e1 : -e1) + ((j & 1) == 0 ? e2 : -e2);
      vec3 nk = normalize(n - o.x * ex - o.y * ez);
      float wk = max(dot(nk, -d), 0.0);
      vec3 uk = reflect(d, nk);
      uk = normalize(uk + max(0.03 - dot(uk, n), 0.0) * n);
      float ck = dot(uk, n), dist = (CB + 0.5) / ck;
      // The patch on the clouds that this direction stands for: the spread
      // of a quarter of the slopes (some 2 sigma of angle) at that distance
      // and slant. The field is smoothed over it, but its edge is not made
      // as wide (that is for a pixel's footprint across an outline): read
      // so, a deck far off let nearly all the light through, and the sea
      // towards the horizon mirrored a white sky.
      float lodk = log2(max(2.0 * sigma * dist / ck, 0.06) / TEXEL_KM);
      vec3 xk = ps - eye() + uk * dist;
      float tv = 0.0;
//[ middle clouds
      for (int i = 0; i < LONG_N(uCloud > 0.0 ? 4 : 0); i++) {
//| without
      for (int i = 0; i < LONG_N(4); i++) {
//]
        vec2 h = i == 0 ? vec2(-0.275, 0.25) : i == 1 ? vec2(0.0, 0.3) : i == 2 ? vec2(0.375, 0.45) : vec2(1.3, 1.4);
        float y, bump, body, edge;
        float f = cloudField(xk + n * h.x, lodk, false, y, bump, body, edge);
        if (f > 0.0) tv += cloudExtinction(f, min(lodk, 2.0), y, body, edge) * h.y;
      }
      vec2 deck = throughDeck(max(c, 0.0), 1.0 / (1.0 + COLUMN * tv), ck, 0.0);
      float sk = exp(-tv / ck);
//[ middle clouds
      // (Behind the low clouds, the middle clouds: their base over what is left of the sky; and they dim the low bases,
      // which they light as a sky, with half of what they scatter on downwards, as the scene does (midDown). Without it,
      // the low bases in the mirror were lit by the clear sky's blue light alone: dark blue streaks on a pale grey sea.
      // They stay darker than the layer's base there, as the low bases are.)
      // (Their base through the air under them, aslant: what the air takes of it, the air's own light gives back, lit
      // through the layer. Half the air's molecules lie under the layer, and nearly all its haze.)
      vec3 mb, ola = depthToTop(ps, up) * (dot(up, n) / ck);
      float sm = midMirror(ps, uk, ck, c, mb);
      for (int k = 0; k < 3; k++) {
        vec4 sky2 = 2.0 * (uSunI * msS[k] + uMoonI * msM[k]), ta = exp(-(0.5 * uBR[k] * ola.x + extM * uMA[k] * ola.y));
        vec4 base = mb.z * (deck.x * lit[k] + deck.y * sky2) + deck.y * 0.5 * mb.x * lit[k];
        mir[k] += wk * mix(base, mix(mix(mb.z * S[k], mb.x * lit[k] + mb.y * sky2, ta), S[k], sm), sk);
      }
//| without
      for (int k = 0; k < 3; k++) {
        vec4 base = deck.x * lit[k] + deck.y * 2.0 * (uSunI * msS[k] + uMoonI * msM[k]);
        mir[k] += wk * mix(base, S[k], sk);
      }
//]
      wsum += wk;
    }
    for (int k = 0; k < 3; k++) mir[k] /= max(wsum, 1e-6);
    seen = 0.0;
  }
  // Under a cloud less light comes down to the water, of any kind.
  for (int k = 0; k < 3; k++) {
    vec4 sky = uSunI * msS[k] + uMoonI * msM[k];
    L[k] += T[k] * (Fm * mix(mir[k], S[k], seen) + soft * 1.6 * (SEA[k] + foam) * sky);
  }
}

// ---------- High, thin cloud ----------
// A sheet of cirrus along the ray (as far as tmax): what it lets through
// (Th), the light it sends to the eye (H, like C of the clouds in main) and
// the distance it comes from (tHigh; negative without any).
// It fills a shell from CI_LO to CI_HI, drawn on CI_LAYERS thin layers
// through it: two decks of cirrus, each reading the ice in a frame of its
// own.
const float CI_LO = 12.2, CI_HI = 12.8;    // km
const float CI_TAU = 4.0;                  // the vertical optical depth of the ice, per unit of it
const float CI_VEIL = 0.4;                 // and of the veil, its mean
const float CI_BAND = 0.8;                 // and of the body of a band of tufts, its median
const float CI_THIN = 0.03;                // and of the thin veil where the cirrus gathers, its median
const float CI_HALO = 0.05;                // which grows into an even veil, the halo's (at the top of the slider)
const float CI_GAP = 0.05;                 // the share of the veil between the forms
const vec4 CI_HALOT = vec4(0.01, 0.08, 0.02, 0.1); // the halo veil's depth over which the ring grows, at night and by day
const vec2 CI_FORM = vec2(0.06, 0.4);       // the ice round about from which the veil is in full
const int CI_LAYERS = 2;
// The decks as volumes (km): the lower from 12.2 to 12.6, the upper from
// 12.35 to 12.8. Each holds its ice by age (ciHeight).
const vec2 CI_DECK[2] = vec2[2](vec2(12.2, 12.6), vec2(12.35, 12.8));
// Near the eye the shell is marched (see highCloud): where the ray enters
// it within CI_NEAR.x km fully, fading out by CI_NEAR.y, over CI_NEAR.z km
// of the ray, in CI_STEPS steps.
const vec3 CI_NEAR = vec3(2.0, 3.5, 3.0);
const int CI_STEPS = Q_CI_STEPS;
// The sets of hairs in a deck near the eye, at fixed heights (see highCloud).
const int CI_SHEETS = 4;
// The ice is never read over less than this (km): its streaks are soft at
// some tens of metres (cirrus seen from an aircraft close by has no hairs),
// and a finer read magnified the texels of the ice into rows of beads.
const float CI_MINF = 0.02;
const float CI_ROLL = 1.8;                 // the light scattered forward rolls off towards it
const float CI_METER = 12.0;               // ...and for the meter, towards this many times the light of the sky at the sheet
// The share of the ice's extinction that is diffraction by its crystals
// (some 100 um): light turned by less than a degree, which goes on as if
// not scattered. What lies behind the cirrus (the sky, the sea, the
// clouds) shows through by that share as well, softened; a point (the
// sun, the moon, a star) is spread into the glow round it instead.
const float CI_FWD = 0.4;
// The way a low sun's light runs through the shell to reach the ice (km
// a unit of 1 / sin of its height), how wide that read is, and the phase of
// the light that has spread through the sheet (see highCloud).
// And how much of a dense core's own depth the sunlight on it feels, against
// the depth of its body: the light enters the sheet aslant and spreads
// through it over some 0.5 km (see highCloud).
const float CI_SHADE = 0.3;
const float CI_PATH = 0.45, CI_PATHW = 0.3, CI_DIFF = 0.08;
// The light scattered more than once, per unit of its share and path (see
// highCloud): so much that the sheet sends out all the sunlight it takes.
const float CI_MANY = 2.3;
// The ice (uIce, built at start by the ice shader): a tile of ICE_KM
// (40.5 km) of four fields of ice, R: heads with tails, G: sheets and
// streets, B: flocks, A: large systems. Each deck reads it in a frame of
// its own (ciTile), and mixes the fields by the cirrus's map.
uniform sampler2D uIce;
const float ICE_KM = 40.477;   // the tile's side, as in the ice shader
// The way the ice's fibres run, a quarter as wide (built with the ice, see
// iceWay in the ice shader): the gradient of the ice at twice its angle.
uniform sampler2D uIceWay;
// The cirrus's map (built with the ice, see ciMap in the ice shader), over
// the map: R and G, how much cirrus the upper and the lower deck have; B,
// the share of sheets and streets; A, the share of flocks against large
// systems.
uniform sampler2D uCiMap;

// Loops of the cirrus run to bounds the compiler cannot know (uCirrus is
// never negative), so that it keeps them as loops: unrolled, the hairs'
// and the bends' code was copied many times over, and the driver took
// longer to finish the scene's program, on every page. Such a loop writes
// no array at its index (vectors instead): Direct3D's compiler may have to
// unroll a loop that writes an array at an index it cannot know, and
// cannot unroll one whose bound it cannot know (see the GLSL rules).
#define CI_N(n) ((n) + int(min(uCirrus, 0.0)))

// Gradient noise in 2D (within about -0.7 to 0.7), repeating every `per`
// cells (whole numbers); the lattice wraps by hand (see the GLSL rules).
float ciNoise(vec2 q, vec2 per, uint seed) {
  vec2 i = floor(q), f = q - i, u = f * f * (3.0 - 2.0 * f);
  vec2 i0 = i - per * floor((i + 0.5) / per), i1 = i0 + 1.0;
  i1 -= per * floor((i1 + 0.5) / per);
  float n[4];
  for (int k = 0; k < 4; k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uvec2 l = uvec2(mix(i0, i1, c) + 0.5);
    uint h = ihash(l.x * 0x9e3779b9u + ihash(l.y + seed));
    vec2 g = vec2(float(h & 65535u), float(h >> 16u)) / 32767.5 - 1.0;
    n[k] = dot(g, f - c);
  }
  return mix(mix(n[0], n[1], u.x), mix(n[2], n[3], u.x), u.y);
}

// The same noise (x) with its gradient over q (yz).
vec3 ciNoiseD(vec2 q, vec2 per, uint seed) {
  vec2 i = floor(q), f = q - i, u = f * f * (3.0 - 2.0 * f), du = 6.0 * f * (1.0 - f);
  vec2 i0 = i - per * floor((i + 0.5) / per), i1 = i0 + 1.0;
  i1 -= per * floor((i1 + 0.5) / per);
  float n[4];
  vec2 g[4];
  for (int k = 0; k < 4; k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uvec2 l = uvec2(mix(i0, i1, c) + 0.5);
    uint h = ihash(l.x * 0x9e3779b9u + ihash(l.y + seed));
    g[k] = vec2(float(h & 65535u), float(h >> 16u)) / 32767.5 - 1.0;
    n[k] = dot(g[k], f - c);
  }
  float a = mix(n[0], n[1], u.x), b = mix(n[2], n[3], u.x);
  vec2 ga = mix(g[0], g[1], u.x) + vec2((n[1] - n[0]) * du.x, 0.0);
  vec2 gb = mix(g[2], g[3], u.x) + vec2((n[3] - n[2]) * du.x, 0.0);
  return vec3(mix(a, b, u.y), mix(ga, gb, u.y) + vec2(0.0, (b - a) * du.y));
}

// Bands along x at q bend: the shift across (y) of the place at q, at
// three sizes (`per` cells to a unit and more), and the slope of the bands
// there. With amp 1, the bands turn by some 0.3 rad either way.
vec2 ciBend(vec2 q, float per, float amp, uint seed) {
  // Whole numbers of cells, so that the bends repeat with q.
  vec3 b = vec3(0.0);
  for (int i = 0; i < CI_N(3); i++) {
    float pi = floor((i == 0 ? 1.0 : i == 1 ? 2.7 : 6.7) * per + 0.5);
    b += (i == 0 ? 0.18 : i == 1 ? 0.045 : 0.012) / per * ciNoiseD(q * pi, vec2(pi), seed + uint(i)) * vec3(1.0, pi, pi);
  }
  b *= amp;
  return vec2(b.x, -b.y / max(1.0 + b.z, 0.2));
}

// The density of the body of ice at the last place ciDensity was asked
// about: the ice seen over a wider footprint, as the light inside the
// sheet feels it.
float ciBody = 0.0;
// And the share of that depth in a milky veil (cirrostratus), which draws
// the halo.
float ciVeil = 0.0;
// And its depth over some 10 km, for the glow next to the sun and the moon.
float ciWide = 0.0;

// The ice's tile for deck k at uv on the map: the upper deck (1) along
// (3, 1) and across (-1, 3), two tiles to a unit of 81 km; the lower (0)
// along (1, 1) and across (-1, 1), four tiles to a unit of 181 km, so that
// its forms are a little larger and run 27 degrees from the upper's. Both
// step by whole numbers, so that they repeat with the map. J: the tile's
// coordinates over km on the map. Each deck's tile is shifted so that the
// place where the page starts (and every view without `at`) has some of
// its cirrus overhead: from near the shell a view sees only a few km of
// it, and there the tile had a gap.
const vec2 CI_START[2] = vec2[2](vec2(0.528, 0.851), vec2(0.431, 0.129));
vec2 ciTile(vec2 uv, int k, out mat2 J) {
  vec2 tc;
  if (k == 0) {
    tc = 4.0 * vec2(uv.x + uv.y, uv.y - uv.x);
    J = mat2(1.0, -1.0, 1.0, 1.0) * (4.0 / WEATHER_KM);
  } else {
    tc = 2.0 * vec2(3.0 * uv.x + uv.y, 3.0 * uv.y - uv.x);
    J = mat2(3.0, -1.0, 1.0, 3.0) * (2.0 / WEATHER_KM);
  }
  tc += CI_START[k];
  return tc - floor(tc);
}

// Deck k's tile at x on the map (km): its coordinates there (ciTile), and
// J, them over km on the map.
// (Not kept from call to call: kept, the last place and its warp
// (ciWarp) took Microsoft's compiler (ANGLE on Direct3D 11) more than half
// as long again over the cirrus's pass.)
// The wind turns from region to region. The places the cirrus is read at
// (its ice, its map, its bands) are moved by a smooth displacement over the
// map, so that its forms turn with the region by some 0.3 rad (a standard
// deviation), and up to some 0.7, over 30 to 60 km: with one way for the whole sky, every streak
// ran to one vanishing point, a radial fan seen from below (round 18's g3,
// c3). The displacement is four shear waves (CI_WAVES: whole waves to the
// map along (x, y), and a phase), each moving the place across its own way
// by CI_SHEAR of its wavelength over 2 pi: shear moves without bunching or
// folding (it keeps areas), and four of them in different ways do not
// stand as a pattern. (Noise of some 128 and 51 km did as well, at four
// times the cost of the frame under the shell.) It is 0 at the place where
// the page starts. ciWarpM: the displaced place over the place (km over
// km), for the footprints.
const vec3 CI_WAVES[4] = vec3[4](vec3(1.0, 2.0, 0.7), vec3(3.0, -1.0, 2.1), vec3(2.0, 3.0, 4.0), vec3(4.0, 1.0, 5.3));
const float CI_SHEAR = 0.3;
mat2 ciWarpM = mat2(1.0);
vec2 ciWarp(vec2 x) {
  vec2 uv = x / WEATHER_KM, w = vec2(0.0);
  mat2 g = mat2(0.0);
  // (Unrolled: as a loop, the frame under the shell took some 0.4 ms more.)
  for (int i = 0; i < 4; i++) {
    vec3 wv = CI_WAVES[i];
    float kl = length(wv.xy), ph = 6.2831853 * dot(wv.xy, uv) + wv.z;
    vec2 kn = wv.xy / kl, across = vec2(-kn.y, kn.x);
    w += CI_SHEAR * WEATHER_KM / (6.2831853 * kl) * (sin(ph) - sin(wv.z)) * across;
    g += CI_SHEAR * cos(ph) * outerProduct(across, kn);
  }
  ciWarpM = mat2(1.0) + g;
  return x + w;
}
vec2 ciPlace(vec2 x, int k, out mat2 J) {
  vec2 tc = ciTile(ciWarp(x) / WEATHER_KM, k, J);
  J = J * ciWarpM;
  return tc;
}

// The veil's thickness at tc (tile units of deck k's frame, where x runs
// with the wind), seen over a footprint of gl: noise at eight sizes, as
// the exponent of the depth, so that the depth spreads as cloud depths do
// (log-normal: some 0.2 to 5 times its median). Bands along the wind from
// 40 by 10 km down to 250 by 13 m, the largest no more than 4 times as
// long as wide (longer, they stood as a fan of streaks to the vanishing
// point), the smaller ones longer for their width (fibres), and waves
// across the wind of some 2 km; the amplitude
// falls by 0.8 an octave, as the spectrum of cloud does (-5/3), so that
// seen from near the shell the veil still has thick and thin patches. An
// octave fades out before its bands get narrower than a few footprints.
const int CI_VEIL_N = 9;
const vec3 CI_VEIL_OCT[CI_VEIL_N] = vec3[CI_VEIL_N](vec3(1.0, 4.0, 0.9), vec3(4.0, 10.0, 0.7), vec3(20.0, 5.0, 0.25),
  vec3(8.0, 24.0, 0.35), vec3(12.0, 80.0, 0.3), vec3(24.0, 200.0, 0.3), vec3(40.0, 500.0, 0.25), vec3(80.0, 1200.0, 0.2), vec3(160.0, 3000.0, 0.15));
float ciVeilNoise(vec2 tc, float gl, uint seed) {
  float n = 0.0;
  // The bands bend and wave (by some 0.4 rad over 20, 7.5 and 3 km), so
  // that they do not run straight to a vanishing point.
  tc.y += ciBend(tc, 2.0, 3.0, seed + 50u).x;
  // Its fibres (the sizes under some 0.5 km across) are as strong as the
  // veil is fibrous there (noise of some 13 by 10 km): a milky body, smooth
  // in parts, finely fibrous in others. Fibrous all over, the veil stood as
  // a fan of streaks to the vanishing point.
  float fr = 0.2 + 0.6 * smoothstep(-0.2, 0.45, ciNoise(tc * vec2(3.0, 4.0), vec2(3.0, 4.0), seed + 90u));
  for (int o = 0; o < CI_N(CI_VEIL_N); o++) {
    vec3 oc = CI_VEIL_OCT[o];
    float vis = smoothstep(2.0, 4.0, 1.0 / (oc.y * gl));
    if (vis <= 0.0) break;
    n += oc.z * vis * (o >= 4 ? fr : 1.0) * ciNoise(tc * oc.xy, oc.xy, seed + uint(o));
  }
  return n;
}

// ---- The hairs ----
// Cirrus is made of fine filaments: streaks of falling ice that run along
// the trails and curve with them, so that neighbouring hairs bend
// together, fan out from a head and sweep on in a tail, braid and part.
// The ice's 10 m texels hold its strands only softly, and magnified from
// near the shell they stood as rows of beads; so the scene draws the hairs
// itself, at the place it reads, along the strands the ice was built with:
// the ice program stores their phase (uIcePhase: a phasor whose angle is
// the place across the strands, one turn to a strand, see icePhase), and
// the hairs are thin stripes of that angle and of three times it
// (finer hairs within each strand). Read from the texture, the angle runs
// on smoothly as the strands turn; drawn on fixed ways (round 12) the
// hairs stood as straight needles. Where strands of different trails
// cross, their phasors cancel and the hairs fade. The stripes' spacing
// and way come from the angle's change over a texel (or a footprint).
// A hair is a Gaussian across, blurred over the footprint across it in
// closed form (its width grows and its peak falls, the area kept), so that
// it never aliases: it fades into its mean instead.
uniform sampler2D uIcePhase;
// The light between the hairs, against their mean.
const float CI_HAIR_BASE = 0.12;

// The angle of the phasor b against a's (radians).
float ciTurn(vec2 a, vec2 b) {
  return atan(a.x * b.y - a.y * b.x, dot(a, b));
}

// The hairs of deck k at tc (its flow, tile units; J: tc over km on the
// map; see ciPlace), seen over the footprint h1, h2 (km on the map, a
// pixel's: the hairs are drawn at the place read, with no blur through the
// deck); sheet: which set of hairs (the march near the eye reads one at
// each of the fixed heights of a deck, so that a ray through the deck
// crosses several, each crisp). Around 1: the light between the hairs
// some 0.3 to 0.8 of the mean, a hair's core 2 to 4 times it, for each
// octave, the octaves multiplied.
float ciHair(vec2 tc, mat2 J, int k, vec2 h1, vec2 h2, uint sheet) {
#if Q_HAIRS
  vec2 g1 = J * h1, g2 = J * h2;
  // The phase is read over two texels at least: within a texel it wavers
  // where trails of several ages meet, and its multiples drew worms.
  float tx = 1.0 / float(textureSize(uIcePhase, 0).x);
  vec2 r1 = g1 * max(1.0, 2.0 * tx / max(length(g1), 1e-9)), r2 = g2 * max(1.0, 2.0 * tx / max(length(g2), 1e-9));
  vec2 P = textureGrad(uIcePhase, tc, r1, r2).rg * 2.0 - 1.0;
  float coh = length(P);
  if (coh < 0.35) return 1.0;
  // The angle's gradient (radians per tile unit), from its change over a
  // texel, or over the footprint if that is wider.
  float dl = max(2.0 * tx, max(length(g1), length(g2)));
  vec2 Px = textureGrad(uIcePhase, tc + vec2(dl, 0.0), r1, r2).rg * 2.0 - 1.0;
  vec2 Py = textureGrad(uIcePhase, tc + vec2(0.0, dl), r1, r2).rg * 2.0 - 1.0;
  vec2 gp = vec2(ciTurn(P, Px), ciTurn(P, Py)) / dl;
  float gl = length(gp);
  if (gl < 1e-3) return 1.0;
  // The strands' spacing (km) and the footprint across them (km); seen
  // aslant a pixel covers many hairs along its length too: half of its
  // length counts.
  vec2 e = gp / gl;
  float sp = 2.0 * PI / gl * ICE_KM;
  float fa = ICE_KM * max(max(length(vec2(dot(g1, e), dot(g2, e))), 0.5 * max(length(g1), length(g2))), 1e-9);
  if (fa > 0.7 * sp) return 1.0;
  // Seen from close by (a pixel under some 8 to 15 m, a texel of the
  // phase) half of the hairs fade and the rest are wide (20 m, below),
  // down to some 0.3 m a pixel: read between the phase's texels, thin
  // hairs bent from texel to texel and stood as ladders and broken dashes
  // (round 13, from 9 km looking up); wide and faint, they are the soft
  // streaks that photographs taken next to cirrus show, at several depths.
  float nr = fa / (ICE_KM * tx), near = 0.5 * smoothstep(0.03, 0.15, nr) + 0.5 * smoothstep(0.8, 1.5, nr);
  if (near <= 0.0) return 1.0;
  // Hairs that run across the ice's own way there (uIceWay, smoothed over
  // some 0.1 km and more; where the way is clear) fade: where the strands of two trails meet, the
  // denser takes over within a texel, and its hairs, bent sharply there,
  // stood as zigzags; where thin tails curl, as a net.
  float lw = log2(max(max(length(g1), length(g2)) * float(textureSize(uIceWay, 0).x), 1.0));
  vec2 wv = textureLod(uIceWay, tc, max(lw + 0.5, 0.5)).rg * 2.0 - 1.0;
  float wc = length(wv), agree = dot(vec2(e.x * e.x - e.y * e.y, 2.0 * e.x * e.y), wv) / max(wc, 1e-3);
  float align = mix(1.0, smoothstep(0.5, 0.9, agree), smoothstep(0.05, 0.25, wc));
  if (align <= 0.0) return 1.0;
  float ph = atan(P.y, P.x) + 2.4 * float(sheet);
  uint seed = (k == 0 ? 3000u : 4000u) + 131u * sheet;
  // Bundles some 0.6 km wide and 3 km long (along the wind) where a set of
  // hairs shows, gaps where it does not; and the hairs' width, which
  // changes over a few km.
  vec2 pb = floor(ICE_KM / vec2(3.0, 0.6) + 0.5), pw = floor(ICE_KM / vec2(4.0, 2.0) + 0.5), pq = floor(ICE_KM / vec2(0.6, 0.12) + 0.5);
  float wid = 0.07 + 0.2 * smoothstep(-0.4, 0.4, ciNoise(tc * pw, pw, seed + 979u));
  float F = 1.0;
  for (int o = 0; o < CI_N(2); o++) {
    float m = o == 0 ? 1.0 : 3.0, s = sp / m;
    float vis = 1.0 - smoothstep(0.25 * s, 0.7 * s, fa);
    if (vis <= 0.0) break;
    float bun = clamp(0.5 + 1.8 * ciNoise(tc * pb * (o == 0 ? 1.0 : 2.0), pb * (o == 0 ? 1.0 : 2.0), seed + 977u + uint(o)), 0.0, 1.0);
    // The nearest hair of this octave (km), its width and its peak, blurred.
    float q = m * ph / (2.0 * PI);
    float dy = (q - floor(q + 0.5)) * s;
    // Neighbouring hairs differ in strength (0.15 to 1, some 0.575 on
    // average; noise of some 0.6 km along the wind and 0.12 km across):
    // drawn alike, the hairs of a strand stood evenly spaced, as the teeth
    // of a comb, and seen from some 3 km, as the bars of a ladder.
    float hs = clamp(0.575 + 1.3 * ciNoise(tc * pq, pq, seed + 981u + uint(o)), 0.15, 1.0);
    // At least 8 m each side (20 m seen from close by, above): cirrus is
    // soft streaks, not wires. Hairs that wide for their spacing are left out.
    float hw = max(s * wid * (o == 0 ? 0.7 : 1.0), mix(0.02, 0.008, smoothstep(0.8, 1.5, nr))), hwE = sqrt(hw * hw + 0.25 * fa * fa);
    vis *= 1.0 - smoothstep(0.2 * s, 0.35 * s, hw);
    float h = bun * hs * (hw / hwE) * exp(-dy * dy / (hwE * hwE)), mean = bun * 0.575 * 1.7725 * hw / s;
    F *= mix(1.0, (CI_HAIR_BASE + h) / (CI_HAIR_BASE + mean), vis * near * align * smoothstep(0.35, 0.75, coh) * (o == 0 ? 0.7 : 0.75));
  }
  return F;
#else
  return 1.0;
#endif
}

// How much veil (cirrostratus) the slider c and the map m make: from c =
// 0.35 it grows to CI_VEIL of vertical depth at its median.
float veilOn0(float c, float m) {
  return CI_VEIL * pow(smoothstep(0.35, 1.0, c), 1.6) * m;
}
// The thin, even veil (the crystals that draw the halo): CI_THIN from 0.15
// to 0.45, growing to CI_HALO by 1 (ciHaloGrow, 0 to 1).
float ciHaloGrow(float c) {
  return smoothstep(0.55, 1.0, c);
}
float ciThin(float c) {
  return CI_THIN * smoothstep(0.15, 0.45, c) + (CI_HALO - CI_THIN) * ciHaloGrow(c);
}

// The cirrus at x on the map (km), on deck k (0: the lower, 1: the upper),
// seen over a footprint with the axes f1 and f2 (km on the map). In units
// of the vertical optical depth of the whole shell: the deck's share of
// it. Without `fibres`, as the light of the sun feels it over a wide
// footprint, where the veil's noise averages out: the code that reads it
// is left out. hairIn: the hairs there (ciHair, read by the caller, 1 for
// none). `lite`: the depth alone, for the steps of the march near the eye
// and the second read of a long crossing; ciBody, ciVeil and ciWide
// are not set. Each call is a copy of this code for the compiler,
// and the page's first picture waits for it.
// Where the cirrus gathers (ciEnv, 0 to 1): broad bands along the wind (some 80 by
// 27 km and 40 by 12 km) in groups of some 130 and 50 km, whose share of the
// sky grows with the slider, from some two fifths at 0.15 to three quarters
// at 0.6 and all of it by 0.95. The tails, sheets and the bands' body lie in them,
// with wide clear or thinly veiled sky between: spread evenly over the sky,
// mid amounts stood as a crowd of similar streaks to one vanishing point,
// where photographs show a few broad bands and groups of tails. ciGather
