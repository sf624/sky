// The passes before the scene, which it reads: layer 0 the cirrus's (the
// bits of tHigh and lk, and Th), layer 1 the low clouds' (see CLOUD_PASS).
// (One texture of two layers for both, and one for their depths: Direct3D
// 11 gives a program 16 textures.)
//[ middle clouds
// (And a third layer, the middle clouds': see MID_PASS.)
//]
uniform highp usampler2DArray uPasses;
uniform highp sampler2DArray uPassDepth;
// The aircraft's frames go on to the shader that joins them into a picture
// (see there), with the distance of what each pixel shows as the depth
// (distanceCode). They are kept in steps of 1 / uSteps.
// (The distance is not a second target: ANGLE on Direct3D 11 compiles a
// program again, while the GPU process waits, at its first draw into more
// than one target, and this program takes seconds to compile.)
uniform float uSteps;
// The light of the clouds is worked out in two stages, both by the low
// clouds' pass. Stage 0 draws a quarter of the pixels (half the width and
// the height) and keeps, for the first cloud each ray meets, the parts of
// its light that change slowly across the picture: seven values as half
// floats, two to an integer (uLightMap; see lightMap); stage 1 draws the
// picture and takes them from there (see clouds); stage 2 is the sky's
// light on the clouds (SKY_LIGHT).
uniform float uStage;
uniform highp usampler2D uLightMap;
// The bits of v as a half float, rounded towards zero, as the GPU rounds
// into a target of half floats (the first stage's two targets of round 20;
// packHalf2x16 rounds to the nearest, and the picture came out some levels
// apart in a few pixels).
uint halfBits(float v) {
  uint x = floatBitsToUint(v), sign = (x >> 16) & 0x8000u, m = x & 0x7fffffu;
  int e = int((x >> 23) & 0xffu) - 112;
  if (e >= 143) return sign | 0x7c00u | (m != 0u ? 0x200u : 0u);
  if (e >= 31) return sign | 0x7bffu;
  if (e > 0) return sign | (uint(e) << 10) | (m >> 13);
  return e < -10 ? sign : sign | ((m | 0x800000u) >> uint(14 - e));
}
uint halfPair(vec2 v) {
  return halfBits(v.x) | (halfBits(v.y) << 16);
}
// The first stage's values at a texel: tIn, tauCM, above, sky (a), and
// skyLean, tauF, tauN, tauNn (b).
void lightMapAt(ivec2 ij, out vec4 a, out vec4 b) {
  uvec4 u = texelFetch(uLightMap, ij, 0);
  a = vec4(unpackHalf2x16(u.x), unpackHalf2x16(u.y));
  b = vec4(unpackHalf2x16(u.z), unpackHalf2x16(u.w));
}

const float PI = 3.14159265359;
// The parameters of the air follow Bruneton's demo (2017): see THIRD_PARTY_NOTICES.md.
// Lengths in km.
const float RG = 6360.0;        // ground radius
const float RT = 6460.0;        // top of atmosphere
const float BETA_M = 0.044;     // aerosol scattering per km at sea level, at the default haze (1)
const float MIE_EXT = 1.05;     // extinction / scattering (a single-scattering albedo of 0.95)
const float HR = 8.0;           // Rayleigh scale height
// The haze of the lowest kilometres (the boundary layer): well mixed up to
// BL.x km, falling off over about BL.y km above it (BL in the JS).
const vec2 BL = vec2(1.5, 0.3);
// The aerosol's phase function. In the boundary layer: two Cornette-Shanks
// lobes, a sharp one (MIE_PHASE.x of the light, parameter MIE_PHASE.y) from
// the larger particles and a broad one (MIE_PHASE.z), fitted to Mie theory
// for maritime and continental aerosol (asymmetry 0.715). Above it the
// particles are small (sulphate): one broad lobe, MIE_G_UP (asymmetry
// 0.66). See design.md; the same in the JS.
const vec3 MIE_PHASE = vec3(0.149, 0.932, 0.609);
const float MIE_G_UP = 0.6;
// The aerosol sends the light scattered many times on forwards (msLean):
// MIE_LEAN times the light's mean direction, towards a view that looks where
// it comes from. Its first moment would give 3 times the asymmetry, 2.1;
// 4 matches the reference (see design.md), as the forward peak is sharper.
const float MIE_LEAN = 4.0;
// Aerosol above the haze of the lowest kilometres (mieDensity in the JS):
// a thin layer in the free troposphere and one in the stratosphere.
const vec3 AERO_FREE = vec3(0.048, 6.0, 5.0);    // density (as at sea level), height, half-width in km
const vec3 AERO_STRAT = vec3(0.004, 20.0, 8.0);
const float ISUN = 20.0;
const int NV = Q_NV;            // view samples: the picture is within two steps of 8 bits of 40's
const int NSHADE = Q_NSHADE;        // more samples in twilight: in the planet's shadow...
const int NFAR = Q_NFAR;          // ...and in the lit air beyond it (see shadowSpan)
const int NMU = 40;             // multiple-scattering table: sun angle
const int NH = 12;              // multiple-scattering table: altitude
const float MS_MU_MIN = -0.35;
const float STAR_GAIN = 20.0;   // the core of a star of magnitude 6.5, of the airglow's radiance (see main)
const float STAR_LN_MAG = 0.6447;   // a star's brightness as drawn, ln per magnitude (0.7 of the real 0.921: a "look")
const float EYE_GAIN = 6.0;     // the Milky Way and the zodiacal cone, of their brightness (see main)
const float STAR_LOSS = 0.4;    // under a moon: magnitudes the eye, adapted to the moonlit world, loses (see main)
const float STAR_FADE = 0.25;   // ...and a star this many magnitudes over the limit is shown in full
const vec2 MOON_VEIL = vec2(45.0, 25.0);   // the moon's glare in the eye (glareShape) fades out from MOON_VEIL.y to .x degrees (see main)
const vec2 ZODI_BAND = vec2(20.0, 2.0);   // the cone's half width as drawn, degrees, at 15 degrees from the sun and far from it (zodiacal)
const float EARTHSHINE = 1e-6;  // the moon's dark side, lit by the earth (of sunlight per steradian)
const float S10 = 6.61e-12;     // radiance of one star of the 10th magnitude per square degree, of the sun's light (V = -26.74)
const float CD = 6650.0;        // cd/m2 of a luminance of 1 here (white paper in the sun outside the air, 133000 lux, is 1 / pi)
const float ROD_HALF = 0.01;    // cd/m2 where the rods count as much as the cones in twilight (see main)
const vec2 MESOPIC = vec2(0.003, 3.0);   // cd/m2: at night the rods alone below, the cones alone above (see main)
const float NIGHT_LOOK = 1.7;   // the look's power for what the rods see (see main)...
const float LOOK_PIVOT = 0.12;  // ...the same as by day at this level
const float DARK_LOOK = 2.0;    // ...and as the eye adapts to a darker night (uNightDark), steeper...
const float DARK_PIVOT = 0.07;  // ...about this level
const vec3 ROD_TINT = vec3(0.911, 1.003, 1.235);   // the rods' grey, a little blue (luminance 1)...
const vec3 ROD_BLUE = vec3(0.666, 1.025, 1.742);   // ...and bluer, for blue light from SKY_BLUE cd/m2 up (see main)
const vec2 SKY_BLUE = vec2(0.001, 0.01);
const float METER_GLINT = 0.15;  // the share of the sun and its glitter in the meter (see main)
const vec2 SHOULDER = vec2(0.75, 1.5);   // the tone curve's knee (on the looked value) and the power of its shoulder (see main)
const float SUN_R = 0.00465;     // sine of the sun's angular radius (0.267 degrees)
const float SUN_L = 2000.0;      // the sun's radiance (see main)
const float GLARE = 0.0027;      // the glare's strength, as a share of the eye's (CIE general disability glare; see main)...
const float GLARE_EXPO = 1.3;    // ...up to this exposure (log2, a clear day's at 11 km, sun high); above it, less (see main)
const int GRID = 128;
const int SLOTS = 8;
const float LN_FLUX_MAX = 5.9915;   // ln(400)
// The eye's glare: the veiling luminance per unit of illuminance at the eye,
// t2 the square of the angle from the light in degrees (CIE 146:2002, the
// general disability glare function of a young eye; see the sun's glare).
float glareShape(float t2) { return 10.0 / (t2 * sqrt(t2)) + 5.0 / t2; }

vec2 raySphere(vec3 o, vec3 d, float r) {
  float b = dot(o, d);
  float c = dot(o, o) - r * r;
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  D = sqrt(D);
  return vec2(-b - D, -b + D);
}

// Densities of (Rayleigh, Mie, ozone) at altitude h. The depth table built
// in makeSky repeats this profile: change both.
float aeroLayer(float h, vec3 l) { float x = (h - l.y) / l.z; return l.x * exp(-x * x); }
float boundaryLayer(float h) { return (1.0 + exp(-BL.x / BL.y)) / (1.0 + exp(min((h - BL.x) / BL.y, 60.0))); }
// w: the boundary layer's share of the aerosol (its phase function).
vec4 densities(float h) {
  h = max(h, 0.0);
  float bl = boundaryLayer(h), m = bl + aeroLayer(h, AERO_FREE) + aeroLayer(h, AERO_STRAT);
  return vec4(exp(-h / HR), m, max(0.0, 1.0 - abs(h - 25.0) / 15.0), bl / max(m, 1e-12));
}
vec3 density(float h) { return densities(h).xyz; }

// The depths of depthToTop hang only on the height of p and the angle of d
// to the vertical. They are read from a table, a sum of 16 steps made once
// in JS: one filtered read instead of a march. Its axes, as
// in Bruneton (2017): the distance to the top between its least and its
// most at that height, and the distance to the horizon. They keep the
// table smooth near the horizon.
const int DEPTH_MU = 512, DEPTH_R = 128;
const vec2 AIR_TABLES = vec2(DEPTH_MU, 12 * NH + DEPTH_R);
const float H_TOP = 1132.2544;  // distance from the ground to the top, along the horizon: sqrt(RT^2 - RG^2)

// Optical depth (per species) from p to the top of the atmosphere.
vec3 depthToTop(vec3 p, vec3 d) {
  float r = length(p);
  float rho = sqrt(max((r - RG) * (r + RG), 0.0));
  float lo = RT - r, hi = rho + H_TOP;
  vec2 x = vec2(clamp((raySphere(p, d, RT).y - lo) / (hi - lo), 0.0, 1.0), clamp(rho / H_TOP, 0.0, 1.0));
  const vec2 N = vec2(DEPTH_MU, DEPTH_R);
  return textureLod(uMS, (x * (N - 1.0) + vec2(0.5, 0.5 + float(12 * NH))) / AIR_TABLES, 0.0).rgb;
}

// Bilinear lookup of the multiple-scattering table: the groups from `first`.
void msTable(float h, float mus, int first, out vec4 ms[3]) {
  float x = clamp((mus - MS_MU_MIN) / (1.0 - MS_MU_MIN), 0.0, 1.0) * float(NMU - 1);
  float y = sqrt(clamp(h / (RT - RG), 0.0, 1.0)) * float(NH - 1);
  // It is read through the GPU's filter (see the table of depths). The
  // groups lie one above the other: a read within one never reaches the
  // next.
  for (int k = 0; k < 3; k++) {
    ms[k] = textureLod(uMS, (vec2(x, y + float((first + k) * NH)) + 0.5) / AIR_TABLES, 0.0);
  }
}
// The light scattered many times that reaches a point of the air.
void multiScatter(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 0, ms); }
// The light of the sky on the low clouds there (see buildMultiScatter).
void cloudSky(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 3, ms); }
// Where that light comes from: its mean over the sphere times the
// direction it comes from, towards the sun's side (lh) and up (lv).
void msLean(float h, float mus, out vec4 lh[3], out vec4 lv[3]) { msTable(h, mus, 6, lh); msTable(h, mus, 9, lv); }

// hash13 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash3(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// The catalogue cell that holds direction c.
ivec2 starCell(vec3 c) {
  vec3 p = c / (abs(c.x) + abs(c.y) + abs(c.z));
  vec2 uv = p.z >= 0.0 ? p.xy
    : (1.0 - abs(p.yx)) * vec2(p.x >= 0.0 ? 1.0 : -1.0, p.y >= 0.0 ? 1.0 : -1.0);
  return ivec2(clamp(floor((uv * 0.5 + 0.5) * float(GRID)), 0.0, float(GRID - 1)));
}

// The band of the Milky Way, relative to the airglow: a noise pattern, not
// the real clouds, but on the real galactic plane and brighter at its centre.
float milkyWay(vec3 c) {
  const vec3 POLE = vec3(-0.8676, -0.1981, 0.4560);      // north galactic pole
  const vec3 CENTRE = vec3(-0.0550, -0.8734, -0.4839);   // galactic centre
  float b = dot(c, POLE);
  float near = 0.5 + 0.5 * dot(c, CENTRE);
  float clouds = 0.5 * noise3(c * 5.0) + 0.3 * noise3(c * 11.0) + 0.2 * noise3(c * 23.0);
  return (0.8 + 3.0 * near * near) * exp(-b * b / (0.02 + 0.03 * near)) * (0.25 + 1.5 * clouds * clouds);
}

// The zodiacal light: sunlight scattered by the dust between the planets,
// in S10 (stars of the 10th magnitude per square degree), from x, the cosine
// of the angle from the sun, and y, the sine of the ecliptic latitude. A fit
// to the table of Leinert et al. (1998, "The 1997 reference of diffuse night
// sky brightness", A&AS 127, 1, Table 16: from the Earth, at 500 nm), within
// 4.5 % rms and 13 % at most of its 182 values and the pole's 60: a cone that
// falls off as the power -2.46 of the angle from the sun, flattened towards
// the ecliptic as seen around the sun (x of the result), over a floor and
// the gegenschein (some 13 degrees across) on a wider glow at the point
// opposite the sun (y). And for the cone as it is drawn (see main), a
// look: z, its brightness along the ecliptic at this
// angle from the sun, and w, its shape across: a band of half width
// ZODI_BAND (to 1/e), 20 degrees at 15 degrees from the sun, narrowing
// fastest near the sun towards 2 (15 at 24 degrees, 9 at 50, 4 at 80),
// with a skirt twice as wide. The fit widens with the
// angle from the sun (it is flattened by the same ratio at every angle):
// drawn as it is, the cone spread into a fan and read as a soft glow on
// the horizon, where the eye sees a cone, widest and brightest at its
// base, whose sides close in all the way to its tip (Trouvelot's drawing
// of 1876; reports from dark sites).
vec4 zodiacal(float x, float y) {
  float e = max(acos(clamp(x, -1.0, 1.0)), 0.035);  // from the sun, radians (at least 2 degrees)
  float s = min(abs(y) * inversesqrt(max(1.0 - x * x * step(0.0, x), 1e-6)), 1.0);   // 0 on the ecliptic, 1 square to it
  float across = 0.252 + 0.748 * exp(-pow(s / 0.419, 1.34));
  float cone = 345.0 * pow(e, -2.46);
  float b = degrees(asin(min(abs(y), 1.0))) / (ZODI_BAND.y + (ZODI_BAND.x - ZODI_BAND.y) * exp(-max(degrees(e) - 15.0, 0.0) / 30.0));
  return vec4(cone * across,
              78.6 * across + 19.3 * exp(-(1.0 + x) / 0.01) + 62.3 * exp(-(1.0 + x) / 0.511),
              cone, 0.85 * exp(-b * b) + 0.15 * exp(-0.25 * b * b));
}

float cornetteShanks(float g, float mu) {
  return 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}
// The boundary layer's sharp lobe (see MIE_PHASE), its share of the light
// in.
float sharpLobe(float mu) { return MIE_PHASE.x * cornetteShanks(MIE_PHASE.y, mu); }
// The air's, the boundary layer's and the higher aerosol's; broad: without
// that sharp lobe (the air's table keeps its light apart, see Q_AIR_LUT).
vec3 phases(float mu, bool broad) {
  return vec3(3.0 / (16.0 * PI) * (1.0 + mu * mu),
              (1.0 - MIE_PHASE.x) * cornetteShanks(MIE_PHASE.z, mu) + (broad ? 0.0 : sharpLobe(mu)),
              cornetteShanks(MIE_G_UP, mu));
}
vec3 phases(float mu) { return phases(mu, false); }

#ifdef AIR_LUT
// The light scattered once that addLight has added while onceOn (from the
// light whose shadows the clouds' map holds: the part they take): the air's
// table keeps it (see Q_AIR_LUT).
vec4 lightOnce[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
bool onceOn = false;
#endif
//[ middle clouds
// The light that the middle clouds scatter down on the air under them, from
// all sides, per unit of the light on them, times the phase (see midDeck;
// the caller sets it for each light).
float airDeck = 0.0;
//]
// Light from one source (sun or moon) scattered towards the eye at p:
// scattered once (times `direct`: less in the shadow of a cloud), plus what
// was already scattered (the table).
void addLight(vec3 p, float r, float h, vec3 od, vec4 dens, float scM, float extM,
              vec3 dir, float gain, float direct, float sky, vec3 phase, vec3 view, in vec4 Tv[3], inout vec4 L[3]) {
  vec4 ms[3], lh[3], lv[3];
  float mus = dot(p, dir) / r;
  multiScatter(h, mus, ms);
  msLean(h, mus, lh, lv);
  // The aerosol scatters that light forwards: more of it towards a view
  // that looks where it comes from (MIE_LEAN). Only the forward part: the
  // first moment taken from the view away from it as well left that sky
  // 0.65 of the reference's.
  vec3 up = p / r, side = dir - mus * up;
  float sl = length(side);
  float cv = dot(view, up), ch = sl > 1e-5 ? dot(view, side) / sl : 0.0;
  bool lit = raySphere(p, dir, RG).y < 0.0;          // not behind the planet
  vec3 odl = lit ? od + depthToTop(p, dir) : vec3(0.0);
  for (int k = 0; k < 3; k++) {
    vec4 sc = uBR[k] * dens.x, sm = scM * uMA[k];
    vec4 a = Tv[k] * ((sc + sm) * ms[k] + sm * MIE_LEAN * max(ch * lh[k] + cv * lv[k], 0.0)) * sky;
    if (lit) {
//[ middle clouds
      vec4 tl = exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z));
      vec4 once = direct * tl * (sc * phase.x + sm * mix(phase.z, phase.y, dens.w));
      a += once + airDeck * tl * (sc + sm);
//| without
      vec4 once = direct * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z)) * (sc * phase.x + sm * mix(phase.z, phase.y, dens.w));
      a += once;
//]
#ifdef AIR_LUT
      if (onceOn) lightOnce[k] += gain * once;
#endif
    }
    L[k] += gain * a;
  }
}
#ifdef AIR_LUT
// The light of the boundary layer's sharp lobe from dir, scattered once at
// p towards the eye, without its phase (sharpLobe): the part of addLight's
// once that the air's table keeps apart (see Q_AIR_LUT).
void addSharp(vec3 p, vec3 od, vec4 dens, float scM, float extM, vec3 dir, float gain, inout vec4 S[3]) {
  if (raySphere(p, dir, RG).y >= 0.0) return;          // behind the planet
  vec3 odl = od + depthToTop(p, dir);
  for (int k = 0; k < 3; k++) S[k] += gain * scM * dens.w * uMA[k] * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z));
}
#endif

#if Q_AIR_LUT || defined(AIR_LUT)
// ---------- The air's light as a table (Q_AIR_LUT) ----------
// At the levels with a table, the scene marches the air of each pixel no
// more: the light the air scatters
// towards the eye and its optical depth are made ahead, for the view rays of
// LUT_AZ by LUT_EL directions round the eye and LUT_S distances along each
// (AIR_LUT, a program of fs of its own), as Hillaire (2020) makes his
// sky-view and aerial-perspective tables, and the scene reads them where
// each layer and the end of its ray lie. Directions: the azimuth from the
// sun's, squeezed towards it (the glow), and the elevation from the
// horizon, squeezed towards it (the horizon at v = LUT_VH). Distances: from
// LUT_T0 to LUT_T1, evenly in their log. Five more slices hold the sky as
// the sea sees it (from its surface, the whole way: skyAt), round LUT_SEA,
// and one the whole ray, to the sea or out of the air (LUT_END). The sea's
// five are for places on the sea where the light stands higher or lower
// than over the eye's (lutSeaSpan): the sea seen from 40 km reaches 700
// km, 6 degrees round the Earth, and one slice made under the eye, at the
// light's height there, left the sea towards a setting sun mirroring a sky
// too dark (from 40 km, 2 to 7 degrees below the horizon, 8 levels darker
// than a march of many samples). All in one 3D texture: thirteen parts of
// its depth, LUT_S + 6 slices each (LUT_N), hold the
// three vec4 of the light (0 to 2), the depth (3), the three vec4 of the
// part of the light scattered once that the clouds' shadows take (4 to 6),
// and three vec4 each of the light of the boundary layer's sharp lobe from
// the sun (7 to 9) and from the moon (10 to 12); and two spare layers at
// its end, which nothing reads (see LUT_DRAWS). (Parts along the depth, not
// side by side in its width: AIR_LUT draws straight into the slices, each a
// layer, where a part beside another had to be drawn apart and copied in,
// 462 copies a table that took Direct3D 11 some 2 s.)
// That lobe's light is kept without its phase (sharpLobe), which the scene
// applies for each pixel: it is some 4 degrees wide round the light, where
// the table's texels lie 1 to 3 degrees apart high in the sky, too far
// apart for its peak. (Before, the scene marched the air within 8 degrees
// of the sun and the moon: a second way through the air, which Direct3D 11
// took 1.5 s longer to compile.) The rest of the light, with the broad
// lobes and the air's phase, is the table's.
// The light is divided by uLutScale (the light of the air the stronger of
// the sun and the moon makes) to keep half floats' range by night.
// The sizes are the level's (`airLut` in QUALITY).
const float LUT_AZ = float(Q_LUT_AZ), LUT_EL = float(Q_LUT_EL), LUT_S = float(Q_LUT_S), LUT_T0 = 0.05, LUT_T1 = 1200.0;
const float LUT_SEA = LUT_S + 2.0, LUT_END = LUT_S + 5.0, LUT_N = LUT_S + 6.0, LUT_PARTS = 13.0, LUT_SEA_ALT = 0.002;
// The light's height over the sea at the sea's slices LUT_SEA - 2 to + 2,
// in steps of lutSeaSpan, against over the eye: a half of the angle to the
// farthest sea seen.
float lutSeaSpan() { return 0.5 * max(acos(clamp(RG / (RG + uAlt), 0.0, 1.0)), 1e-3); }
uniform float uLutScale;
// The stronger light (the sun's or the moon's direction), which the
// azimuth is measured from: the table's seam, behind it, then lies where its
// light is the same on either side (from the sun's, the moonlit sky stepped
// there).
uniform vec3 uLutLight;
// The light's way along the ground at a place whose up is `up`, and the way across it.
void lutAxes(vec3 up, out vec3 sh, out vec3 side) {
  sh = uLutLight - up * dot(uLutLight, up);
  sh = dot(sh, sh) > 1e-8 ? normalize(sh) : normalize(cross(up, vec3(0.0, 0.0, 1.0)));
  side = cross(up, sh);
}
// The horizon's elevation (radians, negative) at a height of alt km.
float lutHorizon(float alt) { return -acos(clamp(RG / (RG + max(alt, 0.0)), 0.0, 1.0)); }
// Above the horizon, v's share of the rows above it for x, the
// elevation's share of the way from the horizon to the zenith: its square
// root (dense near the horizon), and from above 1.6 km more rows where the
// rays graze the boundary layer's top (BL.x): along such a ray the haze
// ends within some 0.6 km of height, and the ray's depth and light change
// several times over within a degree. With the square root alone a row
// spanned 0.8 km of that height at 4 km, 1.5 km at 11 km: the table mixed
// rays on either side of the top, and the sky at the horizon in twilight
// showed a band, the lower edge of a setting sun a red row (its depth from
// the table some 50 % too deep in the haze). An arctangent step adds some
// 5 rows there (LUT_WARP); a twelfth of the rows comes from below the
// horizon, where the sky changes slowly but near the horizon (LUT_VH: the
// horizon at 5/12 of the rows, not half).
const float LUT_VH = floor(LUT_EL * 5.0 / 12.0 + 0.5) / LUT_EL, LUT_WARP = 0.05;
float lutWarp(float x, float alt) {
  float c = LUT_WARP * smoothstep(1.6, 2.6, alt);
  float r0 = RG + alt, hor = lutHorizon(alt), span = 0.5 * PI - hor;
  float el0 = -acos(min((RG + BL.x) / r0, 1.0));     // the ray that grazes the top
  float x0 = (el0 - hor) / span, w = 0.6 / (r0 * max(sin(-el0), 1e-3) * span);
  return (sqrt(x) + c * (atan((x - x0) / w) - atan(-x0 / w))) / (1.0 + c * (atan((1.0 - x0) / w) - atan(-x0 / w)));
}
vec2 lutUV(vec3 d, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float phi = atan(dot(d, side), dot(d, sh));
  float el = asin(clamp(dot(d, up), -1.0, 1.0)), hor = lutHorizon(alt);
  float v = el >= hor ? LUT_VH + (1.0 - LUT_VH) * lutWarp((el - hor) / (0.5 * PI - hor), alt) : LUT_VH * (1.0 - sqrt((hor - el) / (hor + 0.5 * PI)));
  return vec2(0.5 + 0.5 * sign(phi) * sqrt(abs(phi) / PI), v);
}
vec3 lutDir(vec2 uv, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float s = uv.x - 0.5, hor = lutHorizon(alt);
  float phi = PI * sign(s) * 4.0 * s * s;
  float q = 1.0 - uv.y / LUT_VH, el = hor - (hor + 0.5 * PI) * q * q;
  if (uv.y >= LUT_VH) {
    // (lutWarp turned back, by halving.)
    float lo = 0.0, hi = 1.0, t = (uv.y - LUT_VH) / (1.0 - LUT_VH);
    for (int i = 0; i < 24; i++) {
      float m = 0.5 * (lo + hi);
      if (lutWarp(m, alt) < t) lo = m; else hi = m;
    }
    el = hor + (0.5 * PI - hor) * 0.5 * (lo + hi);
  }
  return cos(el) * (cos(phi) * sh + sin(phi) * side) + sin(el) * up;
}
#endif
#if Q_AIR_LUT
uniform highp sampler3D uAirLut;
// The air's light and depth along the direction at uv in slice z (between
// two slices, a mix of them), times f; sh: the sharp lobe's phase towards
// the sun and the moon there (sharpLobe). once: the light only, part 4 (the
// part scattered once) and the sharp lobe's of the light the clouds' map
// is of; else part 0, the sharp lobe's of both, and the depth.
void airSlice(vec2 uv, float z, float f, bool once, vec2 sh, out vec4 La[3], out vec3 oda) {
  // (Between two slices of a part, the filter mixes them; the end slices
  // are read at their centres, so a part never mixes with the next.)
  vec2 xy = vec2(clamp(uv.x, 0.5 / LUT_AZ, 1.0 - 0.5 / LUT_AZ), uv.y);
  const float N = LUT_N;
  bool moonMap = once && dot(uLight, uSun) < 0.999;
  float z0 = once ? 4.0 : 0.0, zs = moonMap ? 10.0 : 7.0, ws = moonMap ? sh.y : sh.x;
  for (int k = 0; k < 3; k++) {
    vec4 l = textureLod(uAirLut, vec3(xy, ((z0 + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0)
           + ws * textureLod(uAirLut, vec3(xy, ((zs + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0);
    if (!once) l += sh.y * textureLod(uAirLut, vec3(xy, ((10.0 + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0);
    La[k] = f * uLutScale * l;
  }
  oda = once ? vec3(0.0) : f * textureLod(uAirLut, vec3(xy, (3.0 * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0).xyz;
}
// The slice and the factor that airSlice reads the air from the eye to t
// km with: between the slices on either side, linearly in t (a little
// nearer the march than mixed evenly in log t). (Each read of the table in
// the scene is one airSlice: Direct3D 11 compiles every call apart, and
// the scene took longer to compile.)
vec2 lutZ(float t) {
  float f = 1.0;
  if (t < LUT_T0) { f = max(t, 0.0) / LUT_T0; t = LUT_T0; }
  float q = clamp(log(t / LUT_T0) / log(LUT_T1 / LUT_T0), 0.0, 1.0) * (LUT_S - 1.0);
  float i = min(floor(q), LUT_S - 2.0);
  float ti = LUT_T0 * pow(LUT_T1 / LUT_T0, i / (LUT_S - 1.0)), tj = LUT_T0 * pow(LUT_T1 / LUT_T0, (i + 1.0) / (LUT_S - 1.0));
  return vec2(i + clamp((t - ti) / (tj - ti), 0.0, 1.0), f);
}
#endif

// The planet's shadow along the view ray o + t d (t from 0 to tmax), for
// light from s: the shadow of a sphere in parallel light is a cylinder of
// radius RG behind it. True, with the span [sa, sb], when the ray passes
// through it; else sa and sb are left as they were. In twilight the march spends samples of their own on the span
// and on the lit air beyond: the light scattered once there rises steeply
// from the shadow's edge, and 20 samples spread over the whole ray left
// layers of colour that came and went with the angle.
bool shadowSpan(vec3 o, vec3 d, float tmax, vec3 s, inout float sa, inout float sb) {
  float ds = dot(d, s), os = dot(o, s);
  vec3 a = d - ds * s, b = o - os * s;
  float A = dot(a, a), B = dot(a, b), C = dot(b, b) - RG * RG;
  float D = B * B - A * C;
  if (A < 1e-12 || D <= 0.0) return false;
  D = sqrt(D);
  float t0 = (-B - D) / A, t1 = (-B + D) / A;
  // Only the half away from the light is in the shadow (os + ds t < 0).
  // (Cut by the chord's middle, the whole chord counted where its middle
  // lay behind the planet: by day the eye is inside the cylinder, and every
  // ray above a curve through the sun was marched as if it crossed the
  // shadow, in 8 samples instead of 20, a step of 1 % across the sky.)
  if (ds > 0.0) t1 = min(t1, -os / ds);
  else if (ds < 0.0) t0 = max(t0, -os / ds);
  else if (os >= 0.0) return false;
  t0 = max(t0, 0.0);
  t1 = min(t1, tmax);
  if (t1 <= t0) return false;
  sa = t0;
  sb = t1;
  return true;
}

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// After Jimenez (2014), "Next Generation Post Processing in Call of Duty: Advanced Warfare".
// Interleaved gradient noise: spreads the start of a march evenly over
// neighbouring pixels.
float ign(vec2 p) {
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

// The view from the aircraft: clouds below and a sea under them.

// raySphere for a ray from the eye (o, at height uAlt) and the sphere at
// height h, without its rounding. raySphere takes dot(o, o) - r * r, and at
// 6372 km a float steps by 4 km²; from an eye at the sphere's own height
// (the slider stops on the thin cloud's 12.2, 12.5 and 12.8 km) the
// crossing next to the eye then came out a hair ahead or behind it, as
// each ray's angle rounded. From the base of the thin cloud, rings of rays
// (and a disc under the eye, where dot(o, d) passes a power of two) saw
// through the whole sheet down to the sea, as lit bands. Here c comes from
// the heights, and the near crossing from the far one (their product is c).
vec2 eyeSphere(vec3 o, vec3 d, float h) {
  float b = dot(o, d);
  float c = (uAlt - h) * (2.0 * RG + uAlt + h);
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  float q = b < 0.0 ? sqrt(D) - b : -b - sqrt(D);   // the crossing farther from the eye
  if (q == 0.0) return vec2(0.0);
  return b < 0.0 ? vec2(c / q, q) : vec2(q, c / q);
}

// An integer hash: Wellons' lowbias32, as in the noise shader.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

const float CB = 0.6;               // cloud base, km
const float CT = 5.0;               // the highest tops, km

const float BASE_KM = 8.0;          // size of one tile of the noise
const float TEXEL_KM = BASE_KM / 128.0;
const float DETAIL = 7.0;           // tiles of the fine noise per tile (whole numbers: see uDrift)

const float SKY_UNIT = 0.35;

const float LIGHT_TAU = 4.5;
// The steps of the light's marches from such a point (see clouds).

float heightAt(vec3 p) {
  float r = RG + uAlt;

float heapKm = -9.0, heapMix = 0.0, heapHeads = 0.0, heapGate = 1.0, heapIn = 0.0, heapSmall = 1.0, heapOut = 0.28, sheetF = -9.0;
bool heapAll = false;

#ifdef TOPS_MAP

  // over some 10 km and more is under a mark, which falls as the slider rises, there are none (lane); deep in a
  // cluster the heaps are larger (core).
  // (Less most of the map's largest systems: no place is all cluster or all lane for a hundred km.)
  // (Read elsewhere on the map, as far: the clusters lie apart from the sheets' systems, and the place where the
  // page opens has heaps about it.)

  // the layer, were a flat pale plate in a gap of the deck.)

  // field then skips the towers' cells altogether.

// The heads of four sizes in one read of uHeads (h), the largest `cell` km: how far they move a surface out, km. Each size

// smallest for the next read).
vec4 headsEach(vec4 h, vec4 km, inout float gate) {

float headsKm(vec4 h, vec4 km, inout float gate) {

      // (pn, pm: the Perlin-Worley noise swollen by its cells, sn and sm above, written another way. With sn and sm
      // themselves read here, the compiler summed the heaps' shape above otherwise, and a still of main's views moved
      // by 2 levels in a few pixels; so did the swells mixed in with mix().)
      float thr = 0.72 - 0.6 * (a.amount - 0.69), pn = 1.0 - (1.0 - n.r) / (2.0 - wn), pm = 1.0 - (1.0 - m.r) / (2.0 - wm);
      shape = mix(shape, 1.0 - am + am * smoothstep(thr - 0.1, thr + 0.1, 0.7 * pm + 0.3 * pn), uLow.w);
      // The top of a sheet stands higher over its cells of 4 km to 1 km and
      // over the largest of them, by up to 0.7 CF_RELIEF of its height (some 100 m): relief
      // without holes, which a low sun shows and a high one hardly. (A lower
      // floor under the shape gave relief too, and pits: specks from 40 km.)
      // (The record's smooth: long swells in place of the cells' relief, from the same Perlin-Worley noise, some 100 m
      // over 8 km and half of that over 2 km; within the same bound, 0.7 CF_RELIEF, that the map of the tops takes.)
      rise = CF_RELIEF * max(0.35 * m.b + 0.35 * c.g + 0.3 * c.b - 0.3, 0.0) * (1.0 - a.form) * (1.0 - uLow.w) + CF_RELIEF * clamp(0.8 * (pm - 0.3) + 0.4 * (pn - 0.3), 0.0, 0.7) * (1.0 - a.form) * uLow.w;
    }
  }
  swirl = CF_SWIRL * (1.0 - 0.7 * heapUp) * (n.gba - n.bag);
  knob = 1.0 - (0.6 * n.b + 0.4 * n.a);
  // (A tower stands highest over the middle of its large cell and lower
  // towards its sides: a dome of turrets, not a block with a flat top.)
  float prof = 1.0 - pow(max(t / (1.0 + rise), 0.0), k);
  // (Where the amount is over CF_CLOSE the cover closes: no place is quite
  // empty. Only where the sheet's shape is (nearly) whole: under a shape held
  // back, the floor and the veil below were flat pale plates with straight
  // edges among the heaps, like floes, at a slider of 0.65.)
  float closed = smoothstep(CF_CLOSE + 0.1, CF_CLOSE + 0.18, a.amount) * smoothstep(0.95, 1.0, keep);
  shape = mix(CF_FLOOR * closed, 1.0, shape);
  // (Outside, the field falls about as fast as the shape does per km: the
  // march strides by it.)
  float d = shape * prof - (1.0 - am);
  // And a veil lies at the base of a closed sheet, which the fine noise
  // does not erode: through the thinnest places between cells one sees
  // grey cloud, not the sea (pits through a sheet were dark specks from far
  // above). Only under a sheet that the fine noise cannot take away (its
  // field over a third of what it may be at most, as a closed deck's is at
  // its base everywhere): where the cover was closing and the sheet thin,
  // the noise took the sheet and left the veil, a smooth film of haze with
  // the crisp edge of the amount's contour, over the sea in the gaps of a
  // deck (cloud 0.78 to 0.9; main too).
  veil = CF_VEIL.x * closed * clamp(1.0 - t / CF_VEIL.y, 0.0, 1.0) * smoothstep(0.28, 0.33, d / max(am, 1e-3));
  float f = CF_K * (d > 0.0 ? d / am : d);
  if (heapMix > 0.0) {
    // Heaps. Discs: the Worley cells of 2 km and of 1 km, read at one level (a cut through balls: discs of many sizes) and
    // smoothed (their smaller cells would stand as columns); rho: how far inside a disc's rim a place is, km. The amount
    // sets how much of a cell is disc: the weather map gathers the heaps and clears lanes between them.
    // (Never smoother than that by much: read from afar or for the depth maps, the discs would melt away.)
    vec4 c = textureLod(uNoise, vec3(q.x, off.y + 0.11, q.z), clamp(lod, 1.5, 2.5));
    vec3 thr = max(CF_DISC - CF_DISC_AM * a.fair - CF_GATHER * a.gather - vec3(CF_CORE * a.core, 0.0, 0.0) - TW_FOOT.z * towerFoot * vec3(1.0, 1.0, 0.0), CF_DISC_MIN) + CF_LANE * a.lane * (1.0 - towerFoot);
    const vec3 SLOPE = vec3(0.3125, 0.625, 1.25);
    // A dome over each disc, half an ellipsoid: as wide as the disc, and as high as the layer lets a whole cell's be
    // (the smaller cells' lower, CF_SIZES): so a small disc is a low dome and a large one a high one, and discs that
    // overlap keep their own domes, with a cleft between. In km, to first order; the nearest of the three sizes counts.
    vec3 rmax = max(1.0 - thr, 0.02) / SLOPE, hm = hmax * CF_SIZES;
    vec3 U = max(1.0 - (c.gba - thr) / (SLOPE * rmax), 0.0), W = vec3(max(overBase, 0.0)) / hm;
    vec3 E = sqrt(U * U + W * W);
    vec3 km = mix(hm, (1.0 - E) * E / max(sqrt(U * U / (rmax * rmax) + W * W / (hm * hm)), 1e-4), step(1e-3, E));
    // (The seams between heads go in by a share of the dome's height here at most: its core is whole, no pit goes
    // through it.)
    vec3 top = hm * sqrt(max(1.0 - U * U, 0.0));
#ifdef TOPS_MAP
    // (The map of the tops: as high as the domes within the heads' reach of the place, and the heads on them.)
    vec3 Uo = max(U - CF_OUT / rmax, 0.0), to = hm * sqrt(max(1.0 - Uo * Uo, 0.0));
    float tall = max(to.x, max(to.y, to.z));
    return max(topsOld, tall > 0.0 ? a.level + tall + CF_OUT - sink + 0.03 + 0.06 * a.depth - h : -9.0);
#endif
    // (The nearest dome and its height here, picked without indexing: Direct3D compiles an index into a vector as a
    // loop.)
    vec2 near = km.x >= km.y && km.x >= km.z ? vec2(km.x, top.x) : km.y >= km.z ? vec2(km.y, top.y) : vec2(km.z, top.z);
    // (A tower is a heap of its own shape: its heads are the heaps', at their full size.)
    // (Its heads go over into the heaps' where a heap's dome stands out of it, within 150 m either way: switched at
    // the line where the two meet, the heads' sizes jumped there, and the dome ended in a flat face.)
    float tw = smoothstep(-0.15, 0.15, towerKm - near.x + sink);
    vec4 hd = CF_HEAD * mix(vec4(1.0), TW_HEAD, tw);
    near = vec2(max(near.x, towerKm + sink), mix(near.y, TW_SEAM, tw));
    heapOut = mix(CF_OUT, TW_OUT, tw);
    heapKm = near.x - sink;
    heapIn = min(CF_OUT, 0.5 * near.y);
    // The heads of 1 km to 125 m, in 3D, where they may reach the surface.
    heapHeads = 0.0;
    heapGate = 1.0;
    // (The seams of the large heads go in by a share of the dome's height at most, and the smaller heads stand on
    // their floor: clamped all together, that floor was the dome itself, smooth, wherever two large seams met.)
    // (Not from so far that a texel of the read is a head and more: they are smoothed away there, and fade out before.)
    if (heapKm > -CF_OUT && heapKm < heapIn + CF_OUT && lod < 3.5) {
      vec2 hk = (1.0 - smoothstep(2.5, 3.5, lod)) * headsKm2(textureLod(uHeads, q.xyz + shake * (shaken / 128.0), max(lod, 0.0)), hd * vec4(vec2(smoothstep(0.0, 0.4, heapUp)), vec2(smoothstep(0.0, 0.2, heapUp))), heapGate);
      // (On a low dome the heads are smaller too, by heapSmall: at their full size they cut it to crumbs.)
      heapSmall = mix(clamp(near.y / 0.4, 0.25, 1.0), TW_SMALL, tw);
      heapHeads = max(hk.x, -heapIn) + heapSmall * hk.y;
    }
    sheetF = f;
    // (Outside the heads' reach the march may stride farther: the field falls faster there.)
    f = max(f, CF_K * (heapKm > 0.0 ? min(heapKm / CF_EDGE, 1.0) : min(heapKm, 2.0 * heapKm + CF_OUT)));
  }
  return f;
}

// The field at p; fine: with the fine noise, which erodes it (after
// Schneider 2015: a remap by Worley noise of 285 m to 71 m, wisps low in a
// cloud and billows higher up; near the eye the same noise 8 times finer).
// The base shape's noise moves the place it is read at (in place of the
// talk's curl noise), most low in a cloud. It is read at the pixel's own
// level: from far, cells smaller than a few pixels thin the cloud evenly
// and do not speckle it.
float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge, out float lump,
                 out vec4 q, out float fb) {
  float base;
  float f = cloudShape(p, lod, fine, y, q, body, lump, base);
  float c = min(f, base);
  // (co: the sheet's and the towers' own field, which the noise erodes and carves; a heap's surface is moved by its
  // heads instead. Carved from the field of both, a heap kept a smooth dome 90 m under its surface, which showed
  // wherever a seam between heads went deeper.)
  float co = heapMix > 0.0 ? min(sheetF, base) : c;
  // (The base that the light from below goes by is the sheet's. That light is a slab's, which lets a share of what
  // falls on it through; a heap is as wide as deep, light leaves it by its sides, and its base is darker: lit so, a
  // heap's base was a bright patch with the column map's texels in it.)
  fb = (heapMix > 0.0 ? sheetF : f) - base;
  float under = min(CF_K * veil, base);
  edge = CF_K * CF_FULL;
  bump = 0.0;
  bool heap = heapMix > 0.0 && heapKm > -CF_OUT && base > -0.05;
  if (co > -0.2 * CF_KNOB * CF_K * formAt || heap) {
    // How much the fine noise takes, of the most it may (e). A read without
    // it (the light's long steps, the depth maps) takes its mean: with none
    // taken from a sheet, the map of the clouds' shadow held its top some
    // 50 m over the top drawn, and with the sun at 3 degrees no crest of a
    // deck was lit. Nor is it read where the cloud is dense whatever it
    // takes (it was half the cost of the clouds' pass).
    float e = 0.45;
    bool carve = fine && co < CF_K * mix(0.6, 1.0, formAt) && !heapAll;
    float heads = heapHeads;
    if (carve) {
      vec3 qd = q.xyz * DETAIL + swirl;
      vec4 d = textureLod(uNoise, qd, lod + 2.8);
      // (On heaps the small cells weigh more: grain down to 70 m, and with
      // the finer read below to some 10 m near the eye.)
      float hf = dot(d.gba, mix(vec3(0.625, 0.25, 0.125), vec3(0.4, 0.33, 0.27), formAt));
      // Wisps low in a cloud (the Worley cells' middles go), billows higher
      // up (their seams go: round heads in creases). On heaps the base
      // shape's own cells of 1 km and 500 m carve too: knobs on knobs.
      e = mix(hf, mix(1.0 - hf, 0.5 * (1.0 - hf) + 0.5 * knob, formAt), smoothstep(0.05, 0.3, heapUp));
#if Q_MICRO
      float l1 = lod + 4.7;
      if (l1 < 1.5) {
        vec3 u = vec3(fract(q.x), q.y, fract(q.z));
        vec4 mm = textureLod(uNoise, vec3(50.0 * u.x + 25.0 * u.z, 56.0 * u.y, 50.0 * u.z - 25.0 * u.x), l1);
        e += mix(0.3, 0.6, formAt) * (1.0 - smoothstep(0.5, 1.5, l1)) * (1.0 - dot(mm.gba, mix(vec3(0.5, 0.3, 0.2), vec3(0.34, 0.33, 0.33), formAt)) - 0.4);
      }
#endif
    }
    if (fine && heap && heapKm < heapIn + CF_OUT && lod < 1.5) {
      // A heap's heads of 143 to 18 m, and near the eye of 20 to 2.5 m.
      float gate = heapGate;
      heads += heapSmall * (1.0 - smoothstep(0.5, 1.5, lod)) * headsKm(textureLod(uHeads, q.xyz * DETAIL, lod + 2.8), CF_HEAD1, gate);
#if Q_MICRO
      float l1 = lod + 4.7;
      if (l1 < 1.5) {
        vec3 u = vec3(fract(q.x), q.y, fract(q.z));
        heads += (1.0 - smoothstep(0.5, 1.5, l1)) * headsKm(textureLod(uHeads, vec3(50.0 * u.x + 25.0 * u.z, 56.0 * u.y, 50.0 * u.z - 25.0 * u.x), l1), CF_HEAD2, gate);
      }
#endif
    }
    // A sheet is eroded (a remap: its thin places go first). A heap is
    // carved about its surface by CF_KNOB of density, some 200 m from the
    // deepest crease to the highest head (heads stand out where the noise is
    // under 0.2, creases go in elsewhere; its mean is 0.54): billows on its
    // whole outside, a cauliflower.
    e = clamp(e, 0.0, 1.0);
    float er = CF_ERODE * e * (1.0 - 0.75 * uLow.w);
    float dn = mix((max(co, 0.0) / CF_K - er) / (1.0 - er), co / CF_K - CF_KNOB * ((carve ? e : 0.54) - 0.2), formAt);
    // A heap is dense right behind its surface (a sheet thickens slowly):
    // what is left after the carving is CF_SHARP times as dense, up to 1.
    // So its outline is hard and knobbly, and a fragment too thin to
    // outlast the carving is gone, not a grey ghost.
    // (Less CF_CUT first: the thinnest of it, a skirt of specks smaller
    // than a step of the march, was a grain in the air round a tower.)
    dn -= CF_CUT * mix(0.5, 1.0, formAt);
    if (heapMix > 0.0) {
      // A heap: the heads move the dome's surface, in km (none at the base, which is flat).
      // (Nor do they stand out farther than they are high over the base: a heap widens upwards from a flat base, and
      // no head hangs free beside it.)
      // (The base is level but not smooth: the heads' seams reach up into it by up to CF_RAG, lighter ragged gaps
      // under a large heap; as a plane it was a featureless slab from below. Eased in and out: cut off at CF_RAG,
      // the hollows had flat roofs with hard edges, angular patches from below.)
      float km = min(heapKm + min(heads, min(heapOut, max(overBase, 0.0))), overBase - CF_RAG * (1.0 - exp(-min(heads, 0.0) * min(heads, 0.0) / (CF_RAG * CF_RAG)))) / CF_EDGE;
      dn = max(dn, km < 0.0 ? 0.8 * km : km);
    }
    // (Where a pixel is wider than that edge, only as sharp as a pixel and
    // a half: a harder edge stood in steps, and fragments of a few texels
    // of the noise were small squares.)
    // (A sheet half as sharp: with a soft top, the sun at 3 degrees came
    // through a kilometre of its fringe and lit no crest of it. The reads
    // of the light take the full sharpness whatever their level: thinner,
    // they let the sun through a heap, which glowed evenly from behind.)
    float sharp = mix(0.5, 1.0, formAt) * CF_SHARP;
    // (The record's smooth: an even sheet is no sharper near the eye than far off. Twice as dense in its fringe within
    // some 15 km, it was lit otherwise there: a pale blob under the eye from 11 km.)
    if (dn > 0.0) dn = min(dn * (fine ? clamp(0.39 * exp2(-lod), 1.0, mix(sharp, 1.0, uLow.w * (1.0 - formAt))) : sharp), 1.0);
    bump = CF_K * dn - c;
  }
  return veil > 0.0 ? max(c + bump, under) : c + bump;
}

float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge) {
  float lump, fb;
  vec4 q;
  return cloudField(p, lod, fine, y, bump, body, edge, lump, q, fb);
}

// Extinction (per km) for a value of the field at height y: it grows with
// the density up to CF_FULL, and with the height over the base (more water
// higher up).
float cloudExtinction(float f, float lod, float y, float body, float edge) {
  float x = clamp(f / edge, 0.0, 1.0);
  float up = pow(max(y * (CT - CB), 0.0), 2.0 / 3.0);
  // (Heaps are denser than a sheet: the air in them rises faster.)
  return SIGMA * x * mix(clamp(up, 0.3, 1.2), clamp(1.6 * up, 0.6, 1.2), formAt);
}

// Extinction (per km) at p. fine: with the fine noise.
float cloudDensity(vec3 p, float lod, bool fine) {
  float y, bump, body, edge;
  float f = cloudField(p, lod, fine, y, bump, body, edge);
  return f > 0.0 ? cloudExtinction(f, lod, y, body, edge) : 0.0;
}

// ---------- The clouds' depth maps ----------
// Two maps hold the optical depth of the clouds along straight lines, from
// SHADOW_N heights of the shell up to the tops: uShadow along the light
// (for everything outside the clouds, how deep in their shadow a point is,
// and for the clouds' own light past its first steps), uColumn straight up
// (the depth over a place: a deck's light from below). Each lies on a plane
// across its lines, through the eye; each texel is one line, marched once
// through the shell. The same shader draws both, with SHADOW_MAP defined,
// before a frame that needs them (see makeSky). After the opacity shadow
// maps of Kim and Neumann (2001), with the depths kept at heights instead
// of along the line.
// The plane is warped so that its texels are fine near the eye and grow far
// off, with no edge: x / (SHADOW_K + |x|) per axis, so SHADOW_K km away a
// texel is four times as wide as at the eye, and the far edge is infinitely
// far. A sun low in the sky lays its long shadows along few texels.
// The heights are SHADOW_N steps of the shell from CB, four to a layer of
// the texture (RGBA); the depth is 0 at the tops. A point in between takes
// the depth at its height, linearly.
// Stored as tau / (tau + SHADOW_ENC): 8 bits keep both thin shadows and deep
// ones apart.
// A map's layer is drawn again only when the aircraft has flown some way
// (one layer a frame): it is read where a point was when the layer was
// drawn, uShadowShift (km) away (uColumnShift for the column), each layer
// at its own.
uniform sampler2DArray uShadow, uColumn;
// The sky's light on a white matt surface facing up at 16 heights from CB
// to CT (x), for the four wavelengths of each of the three vec4 (y), of 2
// cloudSky there (8 bits: a quarter of it, uSkyEnc 4). fs draws it (with
// SKY_LIGHT defined, a program of its own: in the scene's, its march of the
// sky in 64 directions took 5.7 s of Direct3D's compiler) when the sun or
// the haze has changed: the table of the mean light is smooth in the sky's
// directions and missed up to 2 / 3 of it at dusk.
uniform sampler2D uSkyLight;
uniform float uSkyEnc;
bool skyMoon = true;
uniform vec2 uShadowShift[4], uColumnShift[4];
const float SHADOW_K = 40.0;
const int SHADOW_N = 16;
const float SHADOW_ENC = 4.0;
// The axes of a map's plane, across its lines (dir).
void mapAxes(vec3 dir, out vec3 ax, out vec3 ay) {
  ax = normalize(cross(dir, abs(dir.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
  ay = cross(dir, ax);
}
// The light's, set by main.
vec3 shX, shY;
void shadowAxes() {
  mapAxes(uLight, shX, shY);
}

// Where p lies in a layer of a map (plane axes ax, ay; shift: how far the
// aircraft has flown since the layer was drawn).
vec3 mapAt(vec3 p, vec3 ax, vec3 ay, vec2 shift, int layer) {
  vec3 x = p + vec3(shift.x, -RG - uAlt, shift.y);
  vec2 v = vec2(dot(x, ax), dot(x, ay));
  return vec3(0.5 + 0.5 * v / (SHADOW_K + abs(v)), float(layer));
}

// The optical depth from p up to the tops along the lines of a map (map,
// its axes ax and ay, and its layers' shifts), between its heights, or by
// up (0 to 1) from the height above p alone. (The map as an argument: a
// program reads only the maps it names, and Direct3D 11 gives a program 16
// textures.)
float mapDepth(highp sampler2DArray map, vec3 ax, vec3 ay, vec2 shift[4], vec3 p, float up) {
  if (uCloud <= 0.0) return 0.0;
  float z = clamp((length(p) - RG - CB) / (CT - CB), 0.0, 1.0) * float(SHADOW_N);
  int k = min(int(z), SHADOW_N - 1), l = k / 4, c = k % 4;
  vec4 u = textureLod(map, mapAt(p, ax, ay, shift[l], l), 0.0);
  // (The height above: in this layer, the next one, or the tops.)
  float e1 = u[min(c + 1, 3)];
  if (c == 3) e1 = k == SHADOW_N - 1 ? 0.0 : textureLod(map, mapAt(p, ax, ay, shift[l + 1], l + 1), 0.0).x;
  vec2 e = vec2(u[c], e1);
  vec2 tau = SHADOW_ENC * e / max(1.0 - e, 1e-4);
  return mix(tau.x, tau.y, mix(z - float(k), 1.0, up));
}

//[ middle clouds
// ---------- The middle clouds ----------
// A second shell, over the low clouds' (its base at CT or higher, so the two
// never share a place): altocumulus and altostratus, a density from the
// noise (cells, a sheet, or both: midCells, midSheet), marched in a pass of
// its own (MID_PASS, midClouds) and joined to the scene as a third layer.
// These lines are in the programs only on a page that has middle clouds:
// makeSky takes the lines between "//[ middle clouds" and "//]" out of the
// others' text (and puts those after "//| without" in their place), so a
// page without them compiles the text it had before there were any.
// The layer's record, one uniform: its amount (0: none), its form (0: a
// sheet, altostratus, to 1: cells, altocumulus; between them both, each by
// its share), its base and its depth (km).
uniform vec4 uMid;
uniform float uMidRolls;
// Its depth straight up over each place is layer 4 of uShadow (on a level
// plane through the eye, warped as the others; see MID_MAP and midColumn),
// read where things were when it was drawn.
uniform vec2 uMidShift;
const float MID_KM = 6.4;            // its tile of the noise (a whole share of the weather map): cells of 1.6 km, 800 and 400 m
const vec2 MID_SIGMA = vec2(8.0, 45.0); // extinction of a dense part, per km: a sheet's, the cells'
const float MID_FULL = 0.5;          // the density (0 to 1) that is as dense as that
const float MID_DETAIL = 5.0;        // its fine noise: tiles per tile
// The cut through the noise that the cells are read on: not a level slice of
// its tile but an oblique one (two vectors at right angles, of 256 / 39.8 and
// 256 / 32.1 km to the tile, and the cut's normal), whose depth in the noise
// wanders with the weather map. A level slice showed the same 6.4 by 8 km of
// cells at every tile, the cells of 1.6 km in the same places: from 40 km,
// with thousands of them in view, a lattice over the whole layer. The
// vectors are whole numbers over the weather map's 256 km, so the cut still
// repeats with the map (and only with it: no nearer place in the cut is
// within 0.08 of a tile of the same place in the noise for 19 km, and the
// wandering depth takes those apart).
const vec3 MID_CUT_X = vec3(8.0, -26.0, 29.0) / 256.0, MID_CUT_Z = vec3(28.0, -7.0, -14.0) / 256.0, MID_CUT_UP = vec3(27.0, 44.0, 32.0) / 60.737;
// (midLump: the lumps of the cells at the place of the last call with `fine`, 0 to 1, 0.5 at a tuft's rim; see there.)
// (midGap, of the last call: how far the place is, in km straight up or down, from where the column at the place has
// cloud; 1 where the column has none at all. Nought within it. The march strides only where this allows.)
float midLump, midGap;
// (midMottle: the sheet's mottle at the place of the last call of midSheet, 0 to 1, 0.5 on the mean: it takes the
// place of midLump for a sheet, see midDensity.)
float midMottle = 0.5;
// The cells' density at p (from the eye), 0 to 1: h its height, t its share
// of the layer's depth, x its place on the map, wm and wr the weather map
// there (see midDensity, which has the other arguments too).
float midCells(vec3 p, float h, float t, vec2 x, vec4 wm, float wr, float lod, bool fine, bool fibres) {
  // (The noise's widest swell, the veil's share at this place and height, and the level where a cell is widest.)
  float swell = 0.5, veil = 0.0, t0 = 0.25, dB = 0.0;
  vec2 warp = vec2(0.5);
  float d;
  // Cells: the noise's Worley cells, each a cell of cloud: a dome as high
  // as the cell's own height over a threshold, and a shallower bowl under
  // it. The threshold is the field's, not the cell's: the amount, the map
  // (patches and lanes), the noise's cells of 1.6 km and its swell of some
  // 2 km (thick and thin places in a patch) raise or lower it, so a patch
  // is a field of cells with seams between them, thick places are cells
  // run together, and its edge is cells that shrink and stand apart. The
  // map's other channels move the place in the noise by up to 2 km over
  // some 4 km, and one of them says which cells lead, those of 400 m or
  // those of 800 m: cells of unlike sizes. (That alone left the noise's tile
  // in view, slid about: see MID_CUT_X.)
  float wa = wm.r, grow = clamp(1.5 * (uMid.x - 0.5 + 2.5 * (wa - 0.5)), -1.6, mix(0.2, 0.45, smoothstep(0.6, 1.0, uMid.x)));
  if (grow <= -1.55) return 0.0;
  // (The cells' level, from place to place over some 4 km: they fill 0.65 of the layer's depth, anywhere between its
  // base and its top. All on one base, the layer seen from just under it, on edge, had a ruled line for a base.)
  float span = 0.65;
  t = (t - (1.0 - span) * clamp(0.5 + 2.5 * (wm.g - 0.5), 0.0, 1.0)) / span;
  if (t <= 0.0 || t >= 1.0) {
    midGap = span * uMid.w * max(-t, t - 1.0);
    return 0.0;
  }
  vec2 xs = x + 0.6 * MID_KM * vec2(wm.g - 0.5, 1.25 * (wm.b - 0.5));
  // (cut: how deep in the noise the cut lies here, in tiles; see MID_CUT_X.)
  float cut = 2.0 * wr + 0.6 * (wm.b - wm.g) + 0.4 * wm.r;
  vec4 n = textureLod(uNoise, xs.x * MID_CUT_X + xs.y * MID_CUT_Z + (h / MID_KM + cut) * MID_CUT_UP + vec3(0.41, 0.0, 0.77), max(lod, 0.0));
  // (?midrolls: ranks of small elements, two waves of 300 and 420 m that cross, bent by the map and the noise.)
  float roll = 0.65 * sin((0.8 * x.x + 0.6 * x.y + 0.6 * wm.g + 0.3 * n.r) * (2.0 * PI / 0.3)) + 0.45 * sin((0.9 * x.y - 0.44 * x.x + 0.6 * wm.b) * (2.0 * PI / 0.42));
  float wide = 1.8 * (0.8 * (n.g - 0.5) + 1.2 * (n.r - 0.66)) + grow - 0.15 + uMidRolls * (0.8 * roll - 0.2);
  float e = mix((n.a - 0.22) / 0.3 + 1.5 * (n.b - 0.5), (n.b - 0.22) / 0.3 + 0.6 * (n.a - 0.5), smoothstep(0.3, 0.7, wm.b));
  // (The level where a cell is widest, from place to place: all at one level, the layer seen from within it, on edge,
  // was a ruled line at the eye's height.)
  t0 = 0.1 + 0.35 * n.g;
  float u = t < t0 ? (t0 - t) / t0 : (t - t0) / (1.0 - t0);
  d = 0.65 * (e + wide - u);
  dB = 0.65 * (e + wide - max(t - t0, 0.0) / (1.0 - t0));
  swell = n.r;
  warp = n.rg;
  // A veil, thin and in fibres, at the cells' widest level where the field
  // is too thin for more than scattered cells: the margins of a patch.
  // (Round every cell, it was a blur about each one from above.)
  veil = smoothstep(-1.1, -0.6, wide) * (1.0 - smoothstep(-0.3, 0.1, wide)) * smoothstep(0.2, 0.45, n.b) * smoothstep(-1.55, -1.3, grow);
  midGap = dB <= 0.1 && veil <= 0.0 ? 1.0 : span * uMid.w * max(max(min(0.3 * t0, t0 - 0.2) - t, t - t0 - max((1.0 - t0) * (e + wide + 0.1), 0.35)), 0.0);
  if (midGap > 0.0) return 0.0;
  veil *= 0.6 * smoothstep(0.0, 1.0, 1.0 - abs(t - t0) / 0.2);
  if (dB <= 0.1 && (!fibres || veil <= 0.0)) return 0.0;
  // The fine noise takes the thin places first.
  // (near2: within some 5 km of the eye, where the finest noise counts more and the edge is crisper: from so near a
  // cell is a lumpy heap, where from kilometres under it its rim is a soft fringe.)
  float er = 0.5, near2 = fine ? clamp(-3.0 - lod, 0.0, 1.0) : 0.0;
  if (fine) {
    // (Aslant through its tile too, 61 and -37 tiles up in 256 km, and by the cut's depth: its tile of 1.28 km.)
    vec3 qd = vec3(x.x, h + (61.0 * x.x - 37.0 * x.y) * (MID_KM / MID_DETAIL / 256.0) + 0.5 * cut, 0.6 * x.y) * (MID_DETAIL / MID_KM);
    vec4 e = textureLod(uNoise, qd + vec3(0.13, 0.57, 0.29), max(lod + 2.3, 0.0));
    er = 0.2 * e.g + 0.45 * e.b + 0.35 * e.a;
    {
      // Lumps: a cell is a clump of round tufts of some 350 to 45 m (the
      // heaps' heads, uHeads, four sizes in one read), nearly upright
      // columns of them (read almost in one level layer): what stands
      // upright through the layer still shows from below, where the eye
      // sees the whole depth at once and noise in three dimensions
      // averages out to a blur. They take part in the fine noise, and the
      // base is thin between them (see the end). Their lattice is turned
      // (by 2 : 1, as it must repeat in the weather map: 90 tiles of
      // sqrt(5) in 256 km) and bent by the cells' own noise, by up to 250
      // m, so that neither its rows nor its tile show.
      vec2 xl = (x + 0.5 * (warp - 0.5) + 0.1 * (e.ba - 0.5)) * (90.0 / 256.0);
      // (And aslant through their tile of 1.27 km, 53 and -29 tiles up in 256 km, at a depth that wanders with the cut's:
      // the same lumps at every tile were a finer lattice, of 570 and 640 m, over a field seen from far above.)
      vec4 hd = textureLod(uHeads, vec3(2.0 * xl.x + xl.y, 0.3 * h + (53.0 * x.x - 29.0 * x.y) / 256.0 + 1.5 * cut, 2.0 * xl.y - xl.x) + vec3(0.29, 0.43, 0.61), max(lod + 2.3, 0.0));
      // (None within some 200 m of the eye, and all from 800 m: flown through, a tuft's thin outside was a round disc of
      // haze about the eye.)
      midLump = mix(0.5, 0.25 * hd.r + 0.3 * hd.g + 0.25 * hd.b + 0.2 * hd.a, smoothstep(0.2, 0.8, length(p)));
      er = mix(er, midLump, 0.4);
    }
    // (Near the eye, the same 5 times finer: cells of 64 to 16 m.)
    float near = clamp(-0.5 - lod, 0.0, 1.0);
    if (near > 0.0 && d < 0.6) {
      e = textureLod(uNoise, qd * 5.0 + vec3(0.71, 0.23, 0.47), max(lod + 4.6, 0.0));
      er += (1.05 * near + 0.7 * near2) * (0.5 * e.g + 0.3 * e.b + 0.2 * e.a - 0.5);
    }
  }
  // (On cells it also makes lumps of the surface, in and out.)
  er = clamp(0.5 + 2.0 * (er - 0.5), 0.0, 1.0);
  // Cells, two ways, by the height in the cell:
  //  - over its widest level a crisp heap: the noise takes what is under a
  //    share of it, lumps stand on the rest, and nothing stands outside the
  //    cell (crumbs about every cell, else). Within half a kilometre of the
  //    eye the edge is four times as wide: flown through, a cell begins as
  //    a thickening haze, not as a wall.
  //    Its foot is soft-edged (from below a crisp foot showed through the
  //    base as a torn-paper outline); only its crown is crisp.
  //  - under it a soft base: a slab some 100 m deep whose density, not its
  //    depth, falls off outwards from the cell, as the square of a ramp that
  //    starts outside the heap's outline (rim): a translucent margin tens of
  //    metres wide, then the body. The noise is in it only where it is thin
  //    (thin), in fibres drawn out one way and bent by the noise's swell,
  //    as a factor: no part of a body is cut out by a threshold, and the
  //    noise's creases (between its Worley cells) never reach a body, where
  //    they were bright veins from below. It is thinner between the lumps,
  //    a quarter as dense, by their outsides only (within a lump and where
  //    two meet it is full: their creases were veins too).
  // (A slab, not a lens under each cell: a lens thinner than a step of the
  // march was met by one sample in some frames and by none in others.)
  // (Near the eye all of it is the heap.)
  // (Seen from over the layer, the whole heap is crisp, from lower down: its foot hides the base there, and soft, the
  // field from above was a fog of puffs.)
  float over = smoothstep(0.0, 0.3, uAlt - uMid.z - uMid.w);
  float top = max(near2, smoothstep(t0 - 0.1 * over, t0 + 0.35 - 0.2 * over, t));
  float heap = (1.0 + 1.2 * near2) * mix(0.25, 1.0, smoothstep(0.1, 0.6, length(p))) * smoothstep(-0.05, 0.1, d) * (d + 0.5 * (er - 0.5) - 0.6 * (1.0 - er)) / (1.0 - 0.6 * (1.0 - er));
  heap *= mix(smoothstep(0.0, 0.6, d), 1.0, max(max(near2, over), smoothstep(t0 + 0.15, t0 + 0.55, t)));
  float rim = smoothstep(0.1, 0.9, dB), thin = 1.0 - smoothstep(0.1, 0.8, dB), fb = 0.5;
  float tb = 0.3 * t0 * (1.0 - smoothstep(0.1, 0.9, dB)), base = 0.6 * MID_FULL * rim * rim * smoothstep(tb, tb + 0.25, t);
  if (fibres && top < 1.0 && (thin > 0.0 || veil > 0.0)) {
    vec2 xf = vec2(0.8 * x.x + 0.6 * x.y, -0.6 * x.x + 0.8 * x.y);
    vec4 f = textureLod(uNoise, vec3(0.7 * xf.x + 0.3 * swell, 0.2 * h, xf.y + 0.6 * swell) * (MID_DETAIL / MID_KM) + vec3(0.37, 0.11, 0.83), max(lod + 2.3, 0.0));
    fb = 0.5 * f.b + 0.5 * f.a;
  }
  base *= mix(1.0, clamp(1.0 + 2.0 * (fb - 0.5), 0.0, 2.0), thin);
  base = max(base, 0.07 * veil * smoothstep(0.4, 0.75, fb + 0.3 * (veil - 0.5)));
  base *= mix(max(smoothstep(0.3, 0.55, midLump), 0.25), 1.0, 1.0 - smoothstep(0.8, 2.5, length(p)));
  return clamp(mix(base, heap, top), 0.0, 1.0);
}
// The sheet's density at p, 0 to 1 (the arguments as midCells'; fine: with
// the fine noise).
float midSheet(float h, float t, vec2 x, float wa, float wr, float lod, bool fine) {
  // Where: the weather map's amount, elsewhere on it, over 4 km and more
  // (patches and sheets, with clear lanes), and over some 20 km (wr).
  float am = clamp(uMid.x + 0.7 * (1.0 - 0.8 * smoothstep(0.75, 1.0, uMid.x)) * (wa - 0.5), 0.0, 1.0);
  // Thick and thin places in it, as the amount there: patches of some 3 to
  // 6 km drawn out along the wind, and a mottle of some 200 to 400 m (read
  // at a depth in the noise that wanders with the patches, so that its tile
  // of 1.6 km does not show). From below an altostratus is a grey sheet,
  // darker where it is thicker and finely mottled: in photographs the luma
  // varies by some 2 % over a few degrees and 3 to 5 % over tens of them.
  // With the slow swells alone it was an even white veil, 0.3 and 0.8 %.
  vec4 m = textureLod(uNoise, vec3(0.5 * x.x, 0.0, x.y) / (2.0 * MID_KM) + vec3(0.37, 0.19 + 0.25 * t * uMid.w / MID_KM + wr, 0.71), max(lod - 1.0, 0.0));
  vec4 mn = textureLod(uNoise, vec3(0.6 * x.x, 0.5 * h, x.y) * (2.0 / MID_KM) + vec3(0.53, 1.7 * m.b + 0.9 * m.a, 0.29), max(lod, 0.0));
  midMottle = 0.5 * mn.b + 0.5 * mn.a;
  float th = clamp(1.0 + 1.4 * (m.r - 0.5) + 2.5 * (midMottle - 0.5), 0.3, 1.8);
  float d;
  // A sheet: slow swells, drawn out along the wind.
  vec3 q = vec3(0.125 * x.x, 0.0, 0.5 * x.y) / MID_KM + vec3(0.0, 0.61 + 0.5 * t * uMid.w / MID_KM + wr, 0.0);
  vec4 n = textureLod(uNoise, q, max(lod - 2.0, 0.0));
  float u = 2.0 * t - 1.0;
  d = ((0.62 + 0.38 * n.r) * (1.0 - u * u) - (1.0 - am)) / max(am, 0.05);
  if (d <= -0.35) return 0.0;
  // The fine noise takes the thin places first.
  float er = 0.5;
  if (fine && d < 0.9) {
    vec3 qd = vec3(0.25 * x.x, 2.0 * h, x.y) * (MID_DETAIL / MID_KM);
    vec4 e = textureLod(uNoise, qd + vec3(0.13, 0.57, 0.29), max(lod + 2.3, 0.0));
    er = 0.5 * e.g + 0.3 * e.b + 0.2 * e.a;
    // (Near the eye, the same 5 times finer: cells of 64 to 16 m.)
    float near = clamp(-0.5 - lod, 0.0, 1.0), near2 = clamp(-3.0 - lod, 0.0, 1.0);
    if (near > 0.0 && d < 0.6) {
      e = textureLod(uNoise, qd * 5.0 + vec3(0.71, 0.23, 0.47), max(lod + 4.6, 0.0));
      er += (1.05 * near + 0.7 * near2) * (0.5 * e.g + 0.3 * e.b + 0.2 * e.a - 0.5);
    }
  }
  er = clamp(0.5 + 2.0 * (er - 0.5), 0.0, 1.0);
  return clamp(d - 0.25 * (1.0 - er) * (1.0 - d), 0.0, 1.0) * 0.8 * th;
}
// The density at p (from the eye), 0 to 1. lod as cloudShape's; fine: the
// cells with their fine noise (else its mean); eye: the eye's own samples,
// with the cells' fibres and veil and the sheet's fine noise (on the way to
// the light they are a read too many).
// Between a sheet and cells (uMid.y), both are there, each with its share of
// its own extinction: a sheet that thins as cells grow in it. The density
// is the one that midExtinction turns into the sum of the two.
float midDensity(vec3 p, float lod, bool fine, bool eye) {
  midLump = 0.5;
  midGap = 1.0;
  float h = heightAt(p), t = (h - uMid.z) / uMid.w;
  if (t <= 0.0 || t >= 1.0) return 0.0;
  vec2 x = p.xz + uDrift, xw = x.yx / WEATHER_KM + vec2(0.21, 0.63);
  vec4 wm = textureLod(uWeather, xw, 4.0);
  float wr = textureLod(uWeather, xw, 6.5).r, form = uMid.y, cells = 0.0, sheet = 0.0;
  if (form > UNSEEN(0.0)) cells = min(midCells(p, h, t, x, wm, wr, lod, fine, eye), MID_FULL);
  if (form < UNSEEN(1.0)) sheet = min(midSheet(h, t, x, wm.r, wr, lod, eye), MID_FULL);
  midLump = mix(midMottle, midLump, form);
  return (MID_SIGMA.x * (1.0 - form) * sheet + MID_SIGMA.y * form * cells) / mix(MID_SIGMA.x, MID_SIGMA.y, form);
}
float midExtinction(float den) {
  return mix(MID_SIGMA.x, MID_SIGMA.y, uMid.y) * min(den / MID_FULL, 1.0);
}
// What a column of the layer lets through of the light on it, direct and
// scattered together, as a slab that keeps all it scatters (Eddington's two
// streams): col its depth, m the light's cosine to the layer's normal.
float midThrough(float col, float m) {
  return min((0.5 + 0.75 * m) / (1.0 + COLUMN * col), 1.0);
}
// The middle clouds' optical depth straight up over p (from the Earth's
// centre, as cloudShadow's), through the whole layer.
// (x: as it is; z: smoothed over a kilometre, for the sky's light under it;
// y: of the field smoothed over some 300 m, for its shadow on
// what lies kilometres under it, which the sun's disc and the droplets'
// forward scattering blur.)
vec3 midColumns(vec3 p) {
  vec3 e = textureLod(uShadow, mapAt(p, vec3(0.0, 0.0, -1.0), vec3(-1.0, 0.0, 0.0), uMidShift, 4), 0.0).rgb;
  return SHADOW_ENC * e / max(1.0 - e, 1e-4);
}
float midColumn(vec3 p) {
  return midColumns(p).x;
}
// And from p towards the light, for what lies under the layer: the column
// where the line of light crosses the layer's middle, aslant.
float midShadow(vec3 p) {
  if (uMid.x <= 0.0) return 0.0;
  float hm = uMid.z + 0.5 * uMid.w;
  if (length(p) - RG > hm) return 0.0;
  vec3 pc = p + uLight * raySphere(p, uLight, RG + hm).y;
  return midColumns(pc).y / max(dot(normalize(pc), uLight), 0.06);
}

// (The scene adds both where it reads the low clouds' shadow, once each:
// inside cloudShadow, which the sea reads eight times, they took 1.4 s of
// Microsoft's compiler.)
// The same for what the layer's scattered light still lights from the
// sun's side, the air under it and the low clouds: the depth that takes as
// much as the layer does, counting `share` of what it scatters on downwards
// as light that still comes from the sun's side (through a veil most of it
// does: the low clouds under an altostratus keep a light and a dark side).
float midLight(vec3 p, float share) {
  if (uMid.x <= 0.0) return 0.0;
  float hm = uMid.z + 0.5 * uMid.w;
  if (length(p) - RG > hm) return 0.0;
  vec3 pc = p + uLight * raySphere(p, uLight, RG + hm).y;
  float col = midColumns(pc).y, m = max(dot(normalize(pc), uLight), 0.06), dir = exp(-col / m);
  return -log(dir + share * max(midThrough(col, m) - dir, 0.0));
}
// What the layer leaves of the sky's light in the air under it (h: the
// height, km), by its amount, as UNDER does for the low clouds: under a
// full layer, what a slab half as deep and dense throughout lets through
// (two streams). The low air under an altostratus is lit through it.
float midUnder(float h) {
  float through = 1.0 / (1.0 + COLUMN * 0.5 * midExtinction(MID_FULL) * uMid.w);
  return mix(1.0, through, smoothstep(0.4, 1.0, uMid.x) * (1.0 - smoothstep(uMid.z - 1.0, uMid.z, h)));
}
// The share of what the layer scatters on downwards that still lights the
// air under it from the light's side (midLight's share for the air).
const float MID_AIR = 0.3;
// The rest lights it from all sides (airDeck in addLight), by the layer's
// amount, as midUnder: of the light on the layer (m: its cosine to the
// vertical), what that slab lets through less what comes straight through,
// all but MID_AIR of it, from the sky above as an even radiance (the flux
// over pi; the air scatters a hemisphere of it towards the eye at 1 / 4 pi
// per steradian), and what the sea and the low clouds send back up. Without
// it the air under the layer was lit by little but the sky's light through
// it: far off, under the layer, the air gave back less than it took of what
// lay behind it, and the horizon under an altostratus was a dark blue band,
// over it the layer's own light, reddened by the long way, brown-pink.
float midDeck(float h, float m) {
  if (uMid.x <= 0.0 || m <= 0.0) return 0.0;
  float col = 0.5 * midExtinction(MID_FULL) * uMid.w, ground = 0.12 + 0.3 * uCloud;
  float down = (1.0 - MID_AIR) * m * max(midThrough(col, m) - exp(-col / m), 0.0);
  return uLightShare * down * (1.0 + ground) / (2.0 * PI) * smoothstep(0.4, 1.0, uMid.x) * (1.0 - smoothstep(uMid.z - 1.0, uMid.z, h));
}
// The layer in the sea's mirror (see addSea), along uk from ps on the sea
// (ck: uk's cosine to the vertical; c: the light's): what it leaves of the
// sky behind it, and its base's light there as midClouds lights a base seen
// from below, from the column smoothed over a kilometre (the mirror shows
// the mean of a wide patch, never single cells): the light's part, per unit
// of the light (x: what the slab lets through less what comes straight
// through, which the glitter has), the sky's per unit of twice the sky's
// mean (y: what comes through, and a share of what the sea and the low
// clouds send back up), and what it leaves of both for what lies under it
// (z; the low clouds' bases in the mirror).
float midMirror(vec3 ps, vec3 uk, float ck, float c, out vec3 base) {
  base = vec3(0.0, 0.0, 1.0);
  if (uMid.x <= 0.0) return 1.0;
  float col = midColumns(ps + uk * ((uMid.z + 0.5 * uMid.w) / ck)).z, m = max(c, 0.35), thru = 1.0 / (1.0 + COLUMN * col);
  base = vec3(m / PI * max(midThrough(col, m) - exp(-col / m), 0.0), thru + (0.12 + 0.3 * uCloud) * (1.0 - thru), thru);
  return exp(-col / ck);
}

//]
// The optical depth of the clouds from p towards the light.
float cloudShadow(vec3 p) {
  return mapDepth(uShadow, shX, shY, uShadowShift, p, 0.0);
}
// The same, for a cloud's own light: with the light low, from the height
// above p alone. (Read between two heights, which lie kilometres apart
// along a low light, the depth from the one below took in the cloud
// itself behind p, and drew bands across the lit walls of towers, one for
// each height of the map.)
float cloudShadowOwn(vec3 p) {
  return mapDepth(uShadow, shX, shY, uShadowShift, p, 1.0 - smoothstep(0.25, 0.45, uLight.y));
}

// The optical depth of the clouds straight up from p, times the sheet's
// relief where it lies (see shadowTexel).
float columnDepth(vec3 p) {
  vec3 ax, ay;
  mapAxes(vec3(0.0, 1.0, 0.0), ax, ay);
  return mapDepth(uColumn, ax, ay, uColumnShift, p, 0.0);
}

// The same on the sea, with soft edges. The sun is a disc, and the light
// that comes through the thin edge of a cloud is spread around it by the
// droplets' forward scattering; so a cloud's shadow fades over a width that
// grows with the way from the cloud down to the sea: SHADOW_PEN radians,
// from clouds about SHADOW_OCC km high (a radius of some 60 m under a high
// sun, 400 m under a low one; along the light it is longer on the sea, by
// 1 / sin of the light's height). Read once, the map's contour was the
// edge of the glitter: so bright that it shows white down to a hundredth
// of the light, the glitter was cut along that contour, hard, and with a
// low sun into blocks (a texel is drawn out along the light on the sea).
// The light is averaged across the light instead, SHADOW_TAPS reads at new
// places each frame (jitter), spaced evenly out from the middle (denser
// there: a uniform disc left round blots), and only then made a depth.
const float SHADOW_PEN = 0.035, SHADOW_OCC = 1.5;
const int SHADOW_TAPS = Q_SHADOW_TAPS;
float seaShadow(vec3 p, float jitter) {
  if (uCloud <= 0.0) return 0.0;
  float r = min(SHADOW_PEN * SHADOW_OCC / max(uLight.y, 0.05), 0.75);
  float lit = 0.0;
  for (int i = 0; i < SHADOW_TAPS; i++) {
    float a = 6.2832 * jitter + 2.39996 * float(i);   // the golden angle
    float ri = r * (float(i) + jitter) / float(SHADOW_TAPS);
    lit += exp(-cloudShadow(p + ri * (cos(a) * shX + sin(a) * shY)));
  }
  return -log(max(lit / float(SHADOW_TAPS), 1e-6));
}

#ifdef SHADOW_MAP
// One texel of a map's layer: the line through it along dir (plane axes
// ax, ay), from where it rises through the base (or its lowest point, if
// that is higher) to the tops; the depth from each of the layer's four
// heights up. The steps are about SHADOW_DS km long, as many as the line's
// slope asks for, between 24 and 96: a low sun's lines climb the shell
// over tens of km, and with fewer steps they missed most clouds. Half a
// step, or the texel, sets how much the field is smoothed. A line that
// climbs the shell under a sun on the horizon is some 240 km long: its
// shadows are as long, and as smooth along the light. A layer marches the
// line from its lowest height on, in the same steps as the lowest layer.
// (One layer a draw: ANGLE on Direct3D 11 compiles a program again for a
// draw into several targets.)
// In the column (uColumnMap 1), a deck's water is not spread evenly: there
// is more of it where its cells and rolls stand higher (in a cloud that
// rises as one, the water grows with the height over the base, so the
// depth with the square of the thickness), and each step counts (1 +
// relief)^2 of its depth: the relief of the sheet there. (As one mean for
// the whole column, at one height, the creases of its cells, straight lines
// between Worley cells, showed from below as tiles with sharp edges.)
uniform vec3 uDir;
uniform float uColumnMap, uLayer;
const float SHADOW_DS = 0.2;
vec4 shadowTexel(vec2 w, vec3 dir, vec3 ax, vec3 ay, int layer) {
  vec2 v = SHADOW_K * w / (1.0 - abs(w));
  vec3 q = vec3(0.0, RG + uAlt, 0.0) + v.x * ax + v.y * ay;
  float top = raySphere(q, dir, RG + CT).y;
  // Where the line rises through the base, and through the layer's heights.
  vec2 c = raySphere(q, dir, RG + CB);
  float start = c.y > c.x ? c.y : -dot(q, dir);
  vec4 s;
  for (int k = 0; k < 4; k++) {
    c = raySphere(q, dir, RG + CB + (CT - CB) * float(4 * layer + k) / float(SHADOW_N));
    s[k] = c.y > c.x ? c.y : -dot(q, dir);

  int steps = int(clamp((CT - CB) / max(dir.y, 0.01) / SHADOW_DS, 24.0, 96.0));
  float ds = (top - start) / float(steps);
  float lod = max(log2(0.5 * max(0.5 * ds, max(texel.x, texel.y)) / TEXEL_KM), 0.0);

  // (below), and to the tops (sum).
  float sum = 0.0;
