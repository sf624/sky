    float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(hv, -d), 0.0, 1.0), 5.0);
    float glint = F * exp(-dot(zh, zh) / s2r)
                / (4.0 * PI * s2r * max(cv, 1e-3) * ch * ch * ch * ch)
                / (1.0 + waveShade(max(cv, 1e-3), s2) + waveShade(c, s2));
    if (uNightEye > 0.0) glint *= mix(1.0, sparkle(x, zh, s2r, fa, fc), uNightEye);
    float direct = exp(-tau);
    for (int k = 0; k < 3; k++) {
      lit[k] = uLightI * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      G[k] = T[k] * lit[k] * direct * glint;
      L[k] += G[k] + T[k] * lit[k] * soft * c / PI * (SEA[k] + foam);
    }
  }
  // The sky, mirrored by the tilted footprint. Rough water mirrors less at
  // grazing angles than flat water (the mean Fresnel factor of Bruneton et
  // al., 2010, from the spread of the slopes along the view: half the
  // variance), and mirrors a higher part of the sky.
  vec3 nr = normalize(n - slope.x * ex - slope.y * ez);
  float sigma = sqrt(0.5 * s2r);
  float Fm = 0.02 + 0.98 * pow(1.0 - max(dot(nr, -d), 0.0), 5.0 * exp(-2.69 * sigma)) / (1.0 + 22.7 * pow(sigma, 1.5));
  vec3 up = reflect(d, nr);
  up += max(0.02 - dot(up, n), 0.0) * n;             // never into the sea
  up = normalize(up + 0.3 * n);
  vec4 S[3], msS[3], msM[3];
  skyAt(ps, up, betaM, extM, S);
  multiScatter(0.0, dot(n, uSun), msS);
  multiScatter(0.0, dot(n, uMoon), msM);
  // Clouds in the mirror hide that sky (three samples up the layer tell how
  // much is left) and show their sides and bases: grey with skylight, and
  // whiter where the sun reaches around the sea.
  float seen = 1.0;
  if (uCloud > 0.0) {
    float veil = 0.0;
    for (int i = 0; i < 3; i++) {
      vec2 h = (CT - CB) * (i == 0 ? vec2(0.07, 0.14) : i == 1 ? vec2(0.23, 0.18) : vec2(0.47, 0.3));
      veil += cloudDensity(ps + up * ((CB + h.x) / dot(up, n)), 3.0, false) * h.y / dot(up, n);
    }
    seen = exp(-veil);
  }
  // Under a cloud less light comes down to the water, of any kind.
  for (int k = 0; k < 3; k++) {
    vec4 sky = uSunI * msS[k] + uMoonI * msM[k];
    L[k] += T[k] * (Fm * mix(0.75 * sky + 0.035 * soft * c * lit[k], S[k], seen) + soft * 1.6 * (SEA[k] + foam) * sky);
  }
}

// ---------- High, thin cloud ----------
// A sheet of cirrus along the ray (as far as tmax): what it lets through
// (Th), the light it sends to the eye (H, like C of the clouds in main) and
// the distance it comes from (tHigh; negative without any).
// It fills a shell from CI_LO to CI_HI, but its pattern is drawn on one
// height: where the ray crosses the middle of the shell.
const float CI_LO = 12.2, CI_HI = 12.8;    // km
const float CI_TAU = 0.15;                 // scale of its vertical optical depth
// The pattern runs along and across the wind, in a frame that repeats over
// the map (see its alpha channel): one unit of it is 81 km.
const float CI_UNIT = WEATHER_KM / 3.1623;
// The octaves of the streaks: their directions on the map (whole numbers,
// near the wind's) and frequencies along and across them: 7 by 0.9 km,
// 3 by 0.4 km, 2 by 0.25 km.
const vec2 CI_DIR[3] = vec2[3](vec2(3.0, 1.0), vec2(5.0, 1.0), vec2(2.0, 1.0));
const vec2 CI_FREQ[3] = vec2[3](vec2(12.0, 90.0), vec2(16.0, 120.0), vec2(56.0, 450.0));
// The fine fibres, along CI_DIR[0]: frequencies along and across, per unit:
// 1 km by 70 m, 0.3 km by 23 m, 0.1 km by 8 m.
const vec2 CI_FIB[3] = vec2[3](vec2(80.0, 1200.0), vec2(270.0, 3600.0), vec2(810.0, 10800.0));

// The integer hash of the noise shader (lowbias32).
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Gradient noise on a lattice that repeats every `period` cells (whole
// numbers, below 16384). A lattice point's x plus its y times the golden
// ratio, hashed, gives one word: the gradient is the word, and its low half
// moved up (16 bits of its own each).
float ciNoise(vec2 p, vec2 period) {
  vec2 i = floor(p), f = p - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec4 g[2];
  for (int k = 0; k < 2; k++) {
    uvec4 v = uvec4(floor(mod(i.xyxy + vec4(0.0, float(k), 1.0, float(k)), period.xyxy) + 0.5));
    uvec2 h = uvec2(ihash(v.x + v.y * 0x9e3779b9u + 0x632be5abu), ihash(v.z + v.w * 0x9e3779b9u + 0x632be5abu));
    g[k] = vec4(h.x, h.x << 16u, h.y, h.y << 16u) * (2.0 / 4294967296.0) - 1.0;   // gradients at (0, k) and (1, k)
  }
  return mix(mix(dot(g[0].xy, f), dot(g[0].zw, f - vec2(1.0, 0.0)), u.x),
             mix(dot(g[1].xy, f - vec2(0.0, 1.0)), dot(g[1].zw, f - vec2(1.0)), u.x), u.y);
}

// Vertical optical depth of the cirrus at x on the map, smoothed over a
// footprint of `foot` km; the streaks over `across` km, the footprint
// across the line of sight, where a ray aslant foreshortens them most; the
// fine fibres over `fibre` km, the footprint across them.
float ciDepth(vec2 x, float foot, float across, float fibre) {
  vec2 uv = x / WEATHER_KM;
  float w = textureLod(uWeather, uv, log2(max(foot / 0.25, 1.0))).a;
  float thr = 0.62 - 0.8 * uCirrus;
  if (w < thr - 0.11) return 0.0;                   // cov below is 0 there
  // Streaks, finer and finer: thin ridges of noise drawn out along the
  // wind, each octave turned a little from the others, as hairs of a
  // brush cross. A cascade: each octave scales what the coarser ones left.
  // Each fades out before it gets finer than the footprint.
  const float TAU = 6.2831853;
  float bend = 0.05 * sin(TAU * dot(uv, vec2(2.0, 1.0)) + 1.3) + 0.04 * sin(TAU * dot(uv, vec2(-1.0, 3.0)) + 4.1)
             + 0.03 * sin(TAU * dot(uv, vec2(3.0, -2.0)) + 2.2) + 0.02 * sin(TAU * dot(uv, vec2(5.0, 4.0)) + 0.4)
             + 0.015 * sin(TAU * dot(uv, vec2(-6.0, 5.0)) + 5.0) + 0.006 * sin(TAU * dot(uv, vec2(13.0, -9.0)) + 2.9);
  float m = 1.0, first = 0.0, g = 0.6;
  for (int i = 0; i < 3; i++) {
    vec2 e = CI_DIR[i], fr = CI_FREQ[i];
    float k = 1.0 - smoothstep(0.15, 0.5, across * length(e) * fr.y / WEATHER_KM);   // footprint / spacing
    if (k <= 0.0) break;
    vec2 ab = vec2(dot(uv, e), dot(uv, vec2(-e.y, e.x)) + bend);
    float n = ciNoise(ab * fr, fr);
    float r = 1.0 - abs(n);
    float v = i == 0 ? (r * r - 0.68) / 0.32 : 3.0 * n;   // a ridge first, then soft
    if (i == 0) first = k * v;
    m *= max(1.0 + g * k * v, 0.0);
    g *= 0.85;
  }
  // Lumps along the streaks, and a thin veil between them.
  vec2 al = vec2(dot(uv, CI_DIR[0]), dot(uv, vec2(-CI_DIR[0].y, CI_DIR[0].x)) + bend);
  float lump = max(1.0 + 1.2 * ciNoise(al * vec2(30.0, 60.0), vec2(30.0, 60.0)), 0.0);
  // The edges thin out over a wide margin: seen aslant, a sheet turns
  // opaque where it is a little dense, and a narrow margin would look cut.
  float cov = clamp((w - thr) / 0.45 + 0.3 * first, 0.0, 1.0);
  cov *= cov;
  // Seen from near, thin streaks break into tufts some 1.3 km by 0.4 km,
  // with clear sky between them; in a dense sheet they merge, and from
  // afar too (mean 1).
  float kt = 1.0 - smoothstep(0.08, 0.3, across * 200.0 / CI_UNIT);
  float tn = 0.0;
  if (kt > 0.0) {
    float n = ciNoise(al * vec2(60.0, 200.0) + 0.3, vec2(60.0, 200.0));
    lump *= 1.0 + 0.85 * kt * (1.0 - 0.7 * cov) * (smoothstep(-0.2, 0.25, n) / 0.45 - 1.0);
    tn = kt * n;
  }
  float veil = 0.2 + 0.4 * uCirrus;
  float base = cov * (veil + (1.0 - veil) * m * lump);
  // Below some hundreds of metres the ice is flocculent, not smooth: the
  // Worley noise, drawn out four or five times along the wind, eats into
  // it as into the edges of the low clouds.
  const float T1 = CI_UNIT / 80.0 / 128.0, T2 = CI_UNIT / 20.0 / 128.0;   // texels across, km
  float d1 = textureLod(uNoise, vec3(al * vec2(16.0, 80.0), 0.3), log2(max(foot / T1, 1.0))).a;
  float d2 = textureLod(uNoise, vec3(al * vec2(5.0, 20.0), 0.7), log2(max(foot / T2, 1.0))).a;
  float dd = 0.55 * d1 + 0.45 * d2;
  // Seen from near, a grain some 20 by 100 m more (its mean taken off, so
  // that from afar nothing changes).
  const float T0 = CI_UNIT / 240.0 / 128.0;
  if (foot < 0.05) {
    vec3 g0 = vec3(al * vec2(48.0, 240.0), 0.5);
    dd += 0.35 * (1.0 - smoothstep(0.02, 0.05, foot))
        * (textureLod(uNoise, g0, log2(max(foot / T0, 1.0))).a - textureLod(uNoise, g0, 7.0).a);
  }
  float er = 0.5 * (1.0 - dd);
  float dens = clamp((base - er) / max(1.0 - er, 0.2), 0.0, 2.0) * (0.2 + 1.6 * dd * dd);
  // Seen from nearer still, a tuft is a bundle of fibres: the ice falling
  // out of it, drawn into threads by the shear. Thin ridges of noise, 70,
  // 23 and 8 m apart and a dozen times longer. They bend together, and
  // crowd and curl at the heads of the tufts. In places they are sharp
  // threads, in others a soft sheen. Their mean is 1, so from afar, where
  // the footprint fades them, nothing changes.
  if (dens > 0.0 && fibre * CI_FIB[0].y < 0.45 * CI_UNIT) {
    float tangle = smoothstep(-0.15, 0.25, ciNoise(al * vec2(20.0, 100.0), vec2(20.0, 100.0)));
    float sharp = mix(3.0, 20.0, tangle);
    // al steps by whole numbers over the map: its fraction gives the same
    // pattern, with more of the float's bits left for these fine scales.
    vec2 aw = al - floor(al) + vec2(0.0, 7e-4 * ciNoise(al * vec2(60.0, 300.0) + 0.5, vec2(60.0, 300.0)) + 1.6e-3 * tn);
    float c = mix(0.4, 0.95, tangle) * (1.0 - 0.75 * smoothstep(0.3, 1.4, dens));   // clearest where thin
    for (int i = 0; i < 3; i++) {
      vec2 fr = CI_FIB[i];
      float q = fibre * fr.y / CI_UNIT;                         // footprint / spacing
      float k = 1.0 - smoothstep(0.12, 0.45, q);
      if (k <= 0.0) break;
      float s = clamp(1.5 / max(q, 0.01), 2.0, sharp);                    // a thread no thinner than the footprint
      float r = 1.0 - abs(ciNoise(aw * fr + float(i) * 0.37, fr));
      dens *= 1.0 + k * c * (pow(r, s) * (1.0 + 0.18 * s) - 1.0);
      c *= 0.8;
    }
  }
  float u2 = uCirrus * uCirrus;
  return CI_TAU * (0.18 + 10.0 * u2 * u2) * dens;           // a veil when there is much
}

float cirrusDepth(vec2 x, float foot, float across) {
  return ciDepth(x, foot, across, across);
}

// depthToTop in fewer steps, denser near p: enough for the light of one
// sheet, and it halves the cost.
vec3 ciDepthToTop(vec3 p, vec3 d) {
  float t = raySphere(p, d, RT).y, prev = 0.0;
  vec3 s = vec3(0.0);
  for (int i = 0; i < 8; i++) {
    float f = (float(i) + 1.0) / 8.0, t1 = t * f * f;
    s += density(length(p + d * (0.5 * (prev + t1))) - RG) * (t1 - prev);
    prev = t1;
  }
  return s;
}

// The depth of the thin cloud between a point under it and the light, as
// direct light feels it. Ice scatters mostly forward, and that light still
// arrives: half of the depth counts. The width of the sun blurs the shadow
// over some hundreds of metres.
float cirrusShadow(vec3 p) {
  if (uCirrus <= 0.0) return 0.0;
  vec3 pc = p + uLight * raySphere(p, uLight, RG + 0.5 * (CI_LO + CI_HI)).y;
  return 0.5 * cirrusDepth(pc.xz + uDrift, 0.5, 0.5) / max(dot(normalize(pc), uLight), 0.05);
}

void highCloud(vec3 o, vec3 d, float tmax, float extM, out float Th, out float tHigh, out vec4 H[3]) {
  Th = 1.0;
  tHigh = -1.0;
  H[0] = vec4(0.0); H[1] = vec4(0.0); H[2] = vec4(0.0);
  // Where the ray is inside the shell: t0 to t1. From its base, a ray down
  // leaves it at once (lo.x is 0).
  vec2 lo = eyeSphere(o, d, CI_LO), hi = eyeSphere(o, d, CI_HI);
  float t0, t1;
  if (uAlt < CI_LO) {
    t0 = lo.y; t1 = hi.y;
  } else if (uAlt < CI_HI) {
    t0 = 0.0; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  } else {
    t0 = hi.x; t1 = lo.y > lo.x && lo.x >= 0.0 ? lo.x : hi.y;
  }
  t1 = min(t1, tmax);
  if (t0 < 0.0 || t1 <= t0) return;
  // The pattern is read where the ray crosses the middle height, or
  // halfway along a ray that only grazes it.
  vec2 mid = eyeSphere(o, d, 0.5 * (CI_LO + CI_HI));
  float tm = uAlt < 0.5 * (CI_LO + CI_HI) ? mid.y : mid.x;
  if (tm < t0 || tm > t1) tm = 0.5 * (t0 + t1);
  vec3 pc = o + d * tm;
  vec3 up = normalize(pc);
  float cv = abs(dot(d, up));
  float pix = 2.0 * uTan / uRes.y;
  // A ray aslant sees the pattern foreshortened, and a long way through
  // the shell averages it.
  float thick = 0.01 * (t1 - t0) * sqrt(max(1.0 - cv * cv, 0.0));
  // The footprint is drawn out along the ray's way over the map; across
  // the fibres it is only as long as that way runs across them. Fibres
  // seen end-on stay sharp further away.
  vec2 dh = d.xz - up.xz * dot(d, up);
  float sn = dot(dh, vec2(-1.0, 3.0) / 3.1623) / max(length(dh), 1e-6);
  float fibre = pix * tm * sqrt(1.0 + sn * sn * (1.0 / max(cv * cv, 4e-4) - 1.0)) + 0.3 * thick;
  float tauV = ciDepth(pc.xz + uDrift, pix * tm * pow(max(cv, 1e-3), -0.35) + thick,
                       pix * tm / max(cv, 0.02) + thick, fibre);
  if (tauV <= 0.0) return;
  float tau = tauV * (t1 - t0) / (CI_HI - CI_LO);
  if (tau < 0.003) return;                          // too thin to see
  Th = exp(-tau);
  tHigh = tm;
  float a = 1.0 - Th;

  // Light. Ice crystals scatter forward: a narrow peak (diffraction), a
  // broad one (refraction), little to the side and back; and the halo at
  // 22 degrees from the sun, red inside, which a min-deviation prism of
  // ice draws.
  float mu = dot(d, uLight);
  float ph = 0.3 * hg(mu, 0.95) + 0.6 * hg(mu, 0.65) + 0.1 * hg(mu, -0.2);
  float th = acos(clamp(mu, -1.0, 1.0));
  float mus = dot(up, uLight);
  bool lit = uLightI > 0.0 && raySphere(pc, uLight, RG).y < 0.0;
  vec3 ol = lit ? ciDepthToTop(pc, uLight) : vec3(0.0);
  // Sunlight dims on its way into the sheet (less the forward peak, which
  // goes on as if not scattered): its depth ts there, against te along
  // the view. Scattered once, the sheet sends to the eye te times the mean
  // of exp(-t - ts(t)) along the view: lit on the side the eye is on, or
  // through it. A low sun lights it from below.
  float te = tau, ts = 0.6 * tauV / max(abs(mus), 0.02);
  float once = (dot(d, up) < 0.0) == (mus > 0.0)
    ? te * (1.0 - exp(-te - ts)) / (te + ts)
    : abs(te - ts) < 1e-3 ? te * exp(-te) : te * (exp(-ts) - exp(-te)) / (te - ts);
  // Along a long path most light is scattered more than once, which
  // spreads the peak and the halo out; a thicker sheet sends more back.
  float many = 1.0 - exp(-0.3 * tau), spread = 0.15 * tauV / (tauV + 0.3);
  // Light from below: the low clouds, lit by the same sun, add to the sea
  // that the mean sky already holds. Forward scattering sends more of it
  // to an eye below the sheet.
  float below = 0.35 * clamp(1.4 * uCloud - 0.1, 0.0, 1.0) * max(mus, 0.0) / PI;
  float wBelow = 0.5 + 0.35 * dot(d, up);
  vec4 msS[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0)), msM[3] = msS;
  float rc = length(pc);
  if (uSunI > 0.0) multiScatter(rc - RG, dot(pc, uSun) / rc, msS);
  if (uMoonI > 0.0) multiScatter(rc - RG, dot(pc, uMoon) / rc, msM);
  for (int k = 0; k < 3; k++) {
    vec4 n = 1.2998 + 0.00316 / (0.3025 * uWL[k] * uWL[k]);   // ice, by wavelength (0.55 um units)
    vec4 x = th - (2.0 * asin(0.5 * n) - PI / 3.0);
    vec4 halo = 0.08 * mix(exp(-x * x / 1.5e-4), exp(-max(x, 0.0) / 0.05), step(0.0, x));
    vec4 sun = lit ? exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z)) : vec4(0.0);
    H[k] = a * ((uSunI * msS[k] + uMoonI * msM[k]) + 0.5 * uNight * pow(uWL[k], vec4(-3.0))
                + uLightI * sun * wBelow * below)
           + uLightI * sun * mix(ph + halo, vec4(spread), many) * once;
  }
}

// A distance (km; negative: infinitely far) as a number from 0 to 1, in 16
// bits over two channels of 8.
vec2 distanceCode(float t) {
  float c = floor((t > 0.0 ? clamp(0.5 + log2(t) / 20.0, 0.0, 0.99) : 1.0) * 65535.0 + 0.5);
  float high = floor(c / 256.0);
  return vec2(high, c - 256.0 * high) / 255.0;
}

#ifdef SHADOW_MAP
// The map of the clouds' shadow, uRes texels square.
void main() {
  shadowAxes();
  outColor = shadowTexel(gl_FragCoord.xy / uRes * 2.0 - 1.0);
}
#else
void main() {
  shadowAxes();
  vec2 uv = ((gl_FragCoord.xy + uJitter) * 2.0 - uRes) / uRes.y;
  vec3 d = normalize(uCam * vec3(uv * uTan, 1.0));
  vec3 o = vec3(0.0, RG + uAlt, 0.0);

  float tmax = raySphere(o, d, RT).y;
  vec2 tg = raySphere(o, d, RG);
  bool ground = tg.x > 0.0 && tg.x < 1e8;
  if (ground) tmax = tg.x;

  float betaM = BETA_M * uHaze;
  float extM = betaM * MIE_EXT;
  float mu = dot(d, uSun);
  vec3 phaseSun = phases(mu);
  vec3 phaseMoon = phases(dot(d, uMoon));

  // The clouds first. They enter the march through the air below as one
  // layer at distance tBar: it sends the light C and lets Tc through. The
  // high, thin cloud is a second layer: tHigh, H, Th.
  float Tc = 1.0, tBar = -1.0, Th = 1.0, tHigh = -1.0;
  vec4 C[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
  vec4 H[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
  if (uCirrus > 0.0) highCloud(o, d, tmax, extM, Th, tHigh, H);
  if (uCloud > 0.0) {
    vec2 top = raySphere(o, d, RG + CT), base = raySphere(o, d, RG + CB);
    float ta = max(uAlt > CT ? top.x : uAlt < CB ? base.y : 0.0, 0.0);
    float tb = min(ground ? (uAlt < CB ? -1.0 : base.x) : top.y, 600.0);
    float sOne = 0.0, sMany = 0.0, sAmb = 0.0;
    if (tb > ta) {
      clouds(o, d, ta, tb, ign(gl_FragCoord.xy + 5.588238 * uPass), Tc, sOne, sMany, sAmb, tBar);
    }
    if (tBar > 0.0) {
      // The colours of the light there: sunlight through the air above,
      // and skylight (the multiple-scattering table is the mean sky).
      vec3 pc = o + d * tBar;
      float rc = length(pc);
      bool lit = uLightI > 0.0 && raySphere(pc, uLight, RG).y < 0.0;
      vec3 ol = lit ? depthToTop(pc, uLight) : vec3(0.0);
      float dim = lit ? exp(-cirrusShadow(pc)) : 1.0;   // the thin cloud above shades them
      vec4 msS[3], msM[3];
      cloudSky(rc - RG, dot(pc, uSun) / rc, msS);
      cloudSky(rc - RG, dot(pc, uMoon) / rc, msM);
      for (int k = 0; k < 3; k++) {
        C[k] = sAmb * (2.0 * (uSunI * msS[k] + uMoonI * msM[k]) + 0.5 * uNight * pow(uWL[k], vec4(-3.0)));
        if (lit) C[k] += uLightI * (sOne + sMany) * dim * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      }
    }
  }

  // The clouds shade the air below their tops (see cloudShadow). Light
  // scattered once by the air there is sampled more finely than the march
  // below: SHAFTS samples of the shadow over that part of the ray, ca to
  // cb, denser near the eye, at new places each frame. Each step of the
  // march takes the mean light of those that fall in it (weighed by the
  // air's scattering there), or reads the map once if none does.
  const int SHAFTS = 16;
  float ca = 0.0, cb = -1.0;
  if (uCloud > 0.0 && uLightI > 0.0) {
    vec2 ct = eyeSphere(o, d, CT);
    if (uAlt < CT) cb = ct.y;
    else if (ct.x >= 0.0 && ct.x < 1e8) { ca = ct.x; cb = ct.y; }
    cb = min(cb, tmax);
  }
  float shaftJitter = ign(gl_FragCoord.xy + 3.137 * uPass + 11.0);
  int shaft = 0;
  // The thin cloud is not in the map: its shadow (cirrusShadow) where the
  // ray meets the sea dims the air near the sea.
  float ciShade = 1.0;
  if (uCirrus > 0.0 && uLightI > 0.0 && ground && Tc > 0.0) ciShade = exp(-cirrusShadow(o + d * tmax));
  // The map is the light's: in twilight the sun still lights the air
  // while the moon lights the clouds and the sea.
  bool sunLight = dot(uLight, uSun) > 0.999;

  // March along the view ray; samples are denser near the eye. An extra
  // sample ends at each layer, the nearer one first.
  vec3 od = vec3(0.0);
  vec4 L[3], G[3];
  L[0] = vec4(0.0); L[1] = vec4(0.0); L[2] = vec4(0.0);
  G[0] = vec4(0.0); G[1] = vec4(0.0); G[2] = vec4(0.0);
  vec3 starCol = vec3(0.0);                          // the stars at night, added after the exposure
  vec4 Tv[3];
  float prev = 0.0, vis = 1.0;
  bool cloudsFirst = tHigh < 0.0 || (tBar > 0.0 && tBar <= tHigh);
  float tSecond = cloudsFirst ? tHigh : tBar;
  float tLayer = cloudsFirst ? tBar : tHigh;         // the next layer; negative: none
  if (tLayer < 0.0) tLayer = 1e9;
  // Without the planet's shadow on the ray, NV samples from the eye to the
  // end. With it, NV up to the shadow, NSHADE in it and NFAR beyond, each
  // run denser at its start; a run of no length is skipped.
  float sa = tmax, sb = tmax;
  int n = NV, j = 0;
  if (uSunI > 0.0 && shadowSpan(o, d, tmax, uSun, sa, sb)) {
    n = sb < tmax ? NV + NSHADE + NFAR : NV + NSHADE;
    if (sa <= 0.0) j = NV;
  }
  int layer = 0;
  for (int i = 0; i < NV + NSHADE + NFAR + 2; i++) {
    if (j >= n) break;
    float t1;
    if (j < NV) {
      float f = (float(j) + 1.0) / float(NV);
      t1 = sa * f * f;
    } else if (j < NV + NSHADE) {
      float f = (float(j - NV) + 1.0) / float(NSHADE);
      t1 = sa + (sb - sa) * f * f;
    } else {
      float f = (float(j - NV - NSHADE) + 1.0) / float(NFAR);
      t1 = sb + (tmax - sb) * f * f;
    }
    bool atLayer = tLayer < t1;
    if (atLayer) t1 = tLayer; else j++;
    float dt = t1 - prev;
    vec3 p = o + d * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec4 dens = densities(h) * vec4(dt, dt, dt, 1.0);
    od += 0.5 * dens.xyz;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) {
      Tv[k] = exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
    }
    float direct = 1.0;
    if (prev - dt < cb && prev > ca) {
      float lit = 0.0, sum = 0.0;
      for (int m = shaft; m < SHAFTS; m++) {
        float f = (float(m) + shaftJitter) / float(SHAFTS);
        float ts = ca + (cb - ca) * f * f;
        if (ts >= prev) break;
        shaft++;
        if (ts < prev - dt) continue;
        vec3 ps = o + d * ts;
        vec3 w = density(length(ps) - RG);
        float wt = uBR[1].z * w.x + betaM * w.y;
        lit += wt * exp(-cloudShadow(ps));
        sum += wt;
      }
      direct = sum > 0.0 ? lit / sum : exp(-cloudShadow(p));
    }
    direct *= mix(1.0, ciShade, 1.0 - smoothstep(0.6, 2.0, h));
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI * vis, sunLight ? direct : 1.0, phaseSun, d, Tv, L);
    if (uMoonI > 0.0) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI * vis, sunLight ? 1.0 : direct, phaseMoon, d, Tv, L);
    od += 0.5 * dens.xyz;
    if (atLayer) {
      bool isClouds = (layer == 0) == cloudsFirst;
      for (int k = 0; k < 3; k++) {
        L[k] += vis * exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z)) * (isClouds ? C[k] : H[k]);
      }
      vis *= isClouds ? Tc : Th;
      layer++;
      tLayer = layer == 1 && tSecond > 0.0 ? tSecond : 1e9;
      if (vis <= 0.0) break;
    }
  }

  if (vis <= 0.0) {
    // Behind a thick cloud.
  } else if (ground) {
    // The shadow on the sea: the clouds' (the map, softened) and the thin cloud's.
    vec3 pg = o + d * tmax;
    float shadow = uLightI > 0.0 ? seaShadow(pg, ign(gl_FragCoord.xy + 7.31 * uPass + 3.0)) + cirrusShadow(pg) : 0.0;
    addSea(pg, d, tmax, od, betaM, extM, vis, shadow, L, G);
  } else {
    // Beyond the atmosphere: the sun, the moon, airglow, the Milky Way and
    // stars, all dimmed and reddened by the air. By day the exposure hides
    // the faint ones.
    float pix = 2.0 * uTan / uRes.y;
    // Sun disc (angular radius 0.267 degrees).
    float sun = mu > 0.0 ? 2000.0 * smoothstep(0.0050, 0.0043, length(cross(d, uSun))) : 0.0;
    // Moon: a sphere lit by the sun, so the phase comes out by itself.
    const float MOON_R = 0.00454;                    // sin(0.26 degrees)
    vec3 em = (d - uMoon * dot(d, uMoon)) / MOON_R;
    float rm = length(em);
    float moonMask = 0.0, moon = 0.0;
    if (dot(d, uMoon) > 0.0 && rm < 1.0) {
      vec3 nm = em - uMoon * sqrt(1.0 - rm * rm);
      float seas = 0.65 + 0.6 * noise3(nm * 2.2 + 7.0);
      moon = 0.05 * seas * pow(max(dot(nm, uSun), 0.0), 0.6) + uEarth;
      moonMask = smoothstep(1.0, 1.0 - 1.5 * pix / MOON_R, rm);
    }
    vec3 c = d * uSky;                               // equatorial direction (J2000)
    float vanRhijn = 1.0 / sqrt(1.0 - 0.90 * (1.0 - d.y * d.y));   // a thin layer seen aslant
    float milky = milkyWay(c), raise = 1.0;
    // The zodiacal light, of the sun's colour. At night its cone is raised as
    // the Milky Way is, but only by what it stands above ZODI_FLOOR (smoothly:
    // (z - f)^2 / z): the faint band elsewhere is part of the dark sky's
    // brightness, which sets the faintest star seen, and raised it hid them.
    float zl = zodiacal(dot(d, uSun), dot(c, uEcliptic));
    float zUp = max(zl - ZODI_FLOOR, 0.0);
    float zodi = S10 * (zl + 2.0 * uNightEye * zUp * zUp / zl) * (1.0 - moonMask);
    vec4 tk[3];
    vec4 tg[3];                                      // ...and for the airglow at night (below)
    for (int k = 0; k < 3; k++) {
      tk[k] = vis * exp(-(uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z));
      // The air dims the airglow and the Milky Way, but scatters much of
      // that light back towards the eye: at night count half the loss.
      tg[k] = mix(tk[k], vis * exp(-0.5 * (uBR[k] * od.x + extM * uMA[k] * od.y + uBO[k] * od.z)), uNightEye);
    }
    // The stars as the eye sees them at night (see starsSeen): the faintest
    // it can see against this sky, and the faintest whose colour it sees.
    vec2 seen = vec2(0.0);
    if (uNightEye > 0.0) {
      float y = 0.0, ym = 0.0;
      for (int k = 0; k < 3; k++) {
        vec4 lw = 0.2126 * uWR[k] + 0.7152 * uWG[k] + 0.0722 * uWB[k];
        vec4 g = tg[k] * uNight * (1.0 - moonMask) * pow(uWL[k], vec4(-3.0));
        y += dot(lw, L[k] + g * vanRhijn + tg[k] * zodi);
        ym += dot(lw, g * milky);
      }
      // The moon's glare in the eye veils the sky around it: 10 E / theta^2
      // cd/m2 at theta degrees from a light of E lux (Stiles and Holladay;
      // the moon is uMoonI of the sun's 133000 lux).
      float off = degrees(acos(clamp(dot(d, uMoon), -1.0, 1.0)));
      float veil = uMoon.y > 0.0 ? 1.33e6 * uMoonI / max(off * off, 1.0) : 0.0;
      float back = CD * ISUN * y + veil;
      seen = starsSeen(back + CD * ISUN * ym);
      // The dark-adapted eye sees the Milky Way plainly where it stands well
      // over the sky and the moon's veil behind it, and not where its
      // contrast with them is under its threshold: raised MILKY_EYE times
      // over the range MILKY_SEEN of that contrast.
      raise += MILKY_EYE * uNightEye * smoothstep(MILKY_SEEN.x, MILKY_SEEN.y, CD * ISUN * ym / max(back, 1e-9));
    }
    float glow = uNight * (vanRhijn + raise * milky) * (1.0 - moonMask);
    vec4 st[3], sn[3];
    for (int k = 0; k < 3; k++) { st[k] = vec4(0.0); sn[k] = vec4(0.0); }
    ivec2 cell = starCell(c);
    for (int s = 0; s < SLOTS; s++) {
      vec4 t = texelFetch(uStars, ivec2(cell.x * SLOTS + s, cell.y), 0);
      if (t.w < 0.0) break;
      float lf = fract(t.w) * LN_FLUX_MAX;           // log of the brightness
      float rad = pix * (0.7 + 0.04 * lf);           // a point; the brightest a touch wider
      vec3 e = c - t.xyz;
      float w = exp(lf - dot(e, e) / (rad * rad));
      vec3 sl = uSky * t.xyz;                        // the star in local axes
      float ahead = dot(sl, uCam[2]);
      if (lf > 2.5 && ahead > 0.0) {
        // Diffraction spikes, as a camera draws them: a thin cross fixed to
        // the screen, on the brightest stars only. Its reach grows with the
        // brightness; the core does not.
        vec2 a = abs(vec2(dot(d, uCam[0]), dot(d, uCam[1])) / dot(d, uCam[2])
                   - vec2(dot(sl, uCam[0]), dot(sl, uCam[1])) / ahead) / pix;   // offset in pixels
        float across = min(a.x, a.y), along = max(a.x, a.y);
        w += 0.25 * smoothstep(2.5, 4.0, lf) * exp(lf - across * across / 0.3 - along / 2.0);
      }
      if (w > 1e-3) {
        float tilt = floor(t.w) / 63.0 * 8.0 - 4.0;  // blue to red
        // The eye sees the colour of a star only well above what its
        // cones can just see (seen.y): the brightest few.
        float hue = smoothstep(STAR_HUE.x, STAR_HUE.y, seen.y - (6.5 - lf / STAR_LN_MAG));
        for (int k = 0; k < 3; k++) {
          vec4 tint = pow(uWL[k], vec4(tilt));
          st[k] += w * tint;
          sn[k] += w * mix(vec4(1.0), tint, hue);
        }
      }
    }
    // By day the stars are drawn in proportion to the airglow; the exposure
    // hides them.
    float stars = uNight * STAR_GAIN * (1.0 - moonMask) * (1.0 - uNightEye);
    for (int k = 0; k < 3; k++) {
      G[k] = tk[k] * sun;
      if (uNightEye > 0.0) L[k] += tk[k] * (sun + moon * moonMask + stars * st[k]) + tg[k] * (glow * pow(uWL[k], vec4(-3.0)) + zodi);
      else L[k] += tk[k] * (sun + moon * moonMask + glow * pow(uWL[k], vec4(-3.0)) + zodi + stars * st[k]);
    }
    // At night as the eye sees them: a star at the faintest magnitude the
    // eye can see against this sky (seen.x) is drawn just visible, and each
    // magnitude brighter STAR_LN_MAG brighter (in ln), dimmed by the air and
    // the clouds before it. Added after the exposure (in main): the eye's
    // threshold, not the exposure, says which stars show.
    if (uNightEye > 0.0) {
      float k0 = (1.0 - moonMask) * exp(STAR_LN_MAG * (seen.x - 6.5));
      // The air and the clouds dim a star by some magnitudes; drawn on the
      // same compressed scale, that is the power STAR_LN_MAG / 0.921 of
      // their transmission.
      for (int k = 0; k < 3; k++) sn[k] *= pow(tk[k], vec4(STAR_LN_MAG / 0.921));
      starCol = k0 * vec3(
        dot(uWR[0], sn[0]) + dot(uWR[1], sn[1]) + dot(uWR[2], sn[2]),
        dot(uWG[0], sn[0]) + dot(uWG[1], sn[1]) + dot(uWG[2], sn[2]),
        dot(uWB[0], sn[0]) + dot(uWB[1], sn[1]) + dot(uWB[2], sn[2]));
    }
  }

  // Glare: light of the sun strayed inside the eye or the lens, a glow of a
  // few degrees around it (a "look", like the spikes of the stars). Clouds
  // between the eye and the sun dim it.
  if (uSunI > 0.0 && mu > 0.9 && raySphere(o, uSun, RG).y < 0.0) {
    float deg = degrees(acos(min(mu, 1.0)));
    float glare = 0.3 / (deg * deg + 0.3);
    if (dot(uLight, uSun) > 0.999) glare *= exp(-cloudShadow(o));   // the map is the sun's
    if (uCirrus > 0.0 && uAlt < CI_HI) {
      // The thin cloud towards the sun: read where that ray crosses it.
      float hc = max(0.5 * (CI_LO + CI_HI), uAlt);
      vec3 pc = o + uSun * raySphere(o, uSun, RG + hc).y;
      float slant = (CI_HI - max(uAlt, CI_LO)) / (CI_HI - CI_LO) / max(dot(normalize(pc), uSun), 0.05);
      glare *= exp(-cirrusDepth(pc.xz + uDrift, 0.3, 0.3) * slant);
    }
    vec3 ol = depthToTop(o, uSun);
    for (int k = 0; k < 3; k++) {
      G[k] += uSunI * glare * smoothstep(0.9, 0.93, mu) * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      L[k] += G[k];
    }
  }

  vec3 col = ISUN * vec3(
    dot(uWR[0], L[0]) + dot(uWR[1], L[1]) + dot(uWR[2], L[2]),
    dot(uWG[0], L[0]) + dot(uWG[1], L[1]) + dot(uWG[2], L[2]),
    dot(uWB[0], L[0]) + dot(uWB[1], L[1]) + dot(uWB[2], L[2]));
  col = max(col, 0.0);                               // colours outside sRGB
  // The eye at night (after Krawczyk, Myszkowski and Seidel, 2005). Below
  // a few cd/m2 the rods take over from the cones, and colours fade into
  // the grey of what the rods see, which favours blue-green over red (the
  // Purkinje shift): moonlit clouds and the moon's glitter are grey to the
  // eye, and the moonlit sky a dark grey-blue, where a long exposure shows
  // them in the colours of sunlight. The rods' share falls from 1 to 0 as
  // the pixel's luminance goes from MESOPIC.x to MESOPIC.y cd/m2 (a
  // smoothstep in its log: the eye's mesopic range), as the night eye
  // comes in. So the full moon's clouds (about 0.07 cd/m2) are mostly
  // grey, not tan. Their grey is a little blue, as the night looks (the
  // "blue shift" of Jensen et al., 2001), but less: neutral grey read as a
  // black and white photograph.
  float rodShare = 0.0;
  if (uNightEye > 0.0) {
    float rods = ISUN * (dot(uWS[0], L[0]) + dot(uWS[1], L[1]) + dot(uWS[2], L[2]));
    float cd = CD * dot(col, vec3(0.2126, 0.7152, 0.0722));
    float wide = 1.0 - smoothstep(log(MESOPIC.x), log(MESOPIC.y), log(max(cd, 1e-12)));
    rodShare = uNightEye * mix(ROD_HALF / (ROD_HALF + cd), wide, uNightGrey);
    // A full moon's sky is dark but blue to the eye, where a quarter moon's
    // is grey: at the top of the rods' range the grey of blue light turns
    // blue (ROD_BLUE), as its luminance goes from SKY_BLUE.x to SKY_BLUE.y.
    // Only light bluer than the rods' grey: the sky, and the sea that
    // mirrors it; the moonlit clouds and the glitter stay grey.
    float bluer = col.r > 0.0 ? smoothstep(0.0, 0.3, col.b / col.r * (ROD_TINT.r / ROD_TINT.b) - 1.0) : 0.0;
    float blue = uNightGrey * bluer * smoothstep(log(SKY_BLUE.x), log(SKY_BLUE.y), log(max(cd, 1e-12)));
    col = mix(col, max(rods, 0.0) * mix(ROD_TINT, ROD_BLUE, blue), rodShare);
  }
  // The meter counts the sun's disc and glare and its glitter on the sea
  // (G) at METER_GLINT of their light: a camera lets the sun and its mirror
  // image run into white and exposes for the rest. Photographs from the air
  // keep the sky as light facing the sun as away from it, with the glitter
  // white; and as a low sun dims in the haze, the picture does not grow
  // brighter for it.
  float glintY = ISUN * dot(vec3(0.2126, 0.7152, 0.0722), vec3(
    dot(uWR[0], G[0]) + dot(uWR[1], G[1]) + dot(uWR[2], G[2]),
    dot(uWG[0], G[0]) + dot(uWG[1], G[1]) + dot(uWG[2], G[2]),
    dot(uWB[0], G[0]) + dot(uWB[1], G[1]) + dot(uWB[2], G[2])));
  float metered = dot(col, vec3(0.2126, 0.7152, 0.0722)) - (1.0 - METER_GLINT) * max(glintY, 0.0);
  float level = (log2(max(metered, 1e-30)) - uLogRange.x) / (uLogRange.y - uLogRange.x);
  col *= uExposure;
  // The stars at night (starCol), as the eye sees them: one at the eye's
  // threshold against this sky stands STAR_SEEN over it on the screen,
  // whatever the exposure. A dark sky does not hide stars that the eye sees.
  if (uNightEye > 0.0 && max(starCol.r, max(starCol.g, starCol.b)) > 0.0) {
    // The tone curve below, on the luminance: x^n p^(look - n), then 1 - exp.
    float n = mix(uLook, NIGHT_LOOK, rodShare), p = pow(LOOK_PIVOT, uLook - n);
    float back = dot(col, vec3(0.2126, 0.7152, 0.0722));
    float shown = pow(1.0 - exp(-p * pow(back, n)), 1.0 / 2.2) + STAR_SEEN;
    float need = pow(-log(1.0 - pow(min(shown, 0.99), 2.2)) / p, 1.0 / n) - back;
    col += uNightEye * need * starCol;
  }
  // No shoulder that keeps the hue: each channel meets the curve below on
  // its own, as on a camera's sensor. A bright orange band of twilight
  // then runs into white at its strongest channel first, and comes out
  // yellow at its core, orange at its edges and pale above, as in
  // photographs; pressed together as a whole, it stayed a thin saturated
  // red-orange line.
  // A camera's white balance: for daylight, sunlit cloud, a little yellow on
  // a screen whose white is D65, comes out white, and the sea a deeper blue;
  // in twilight it adapts in part to the light of the sky (balanceFor).
  col *= uBalance;
  // A camera's colour by day: deeper than the light's. The sky from the air
  // is a strong azure in photographs (in linear light, red a tenth of the
  // blue or less), where the light of the sky gives a quarter. Channels
  // pushed below zero are cut.
  float y0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = max(y0 + uSaturation * (col - y0), 0.0);
  // Light far too strong for the screen turns white, as on film, instead
  // of a flat saturated colour (the glitter of a low sun would be yellow).
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col, vec3(lum), 0.85 * smoothstep(1.0, 6.0, lum));

  // A "look", not physics: a per-channel power deepens the colour, as film does.
  // What the rods see takes the power on its luminance alone: the look
  // deepens the tones but adds no colour that the eye does not see. And it
  // is steeper (NIGHT_LOOK, the same at LOOK_PIVOT, about the moonlit
  // clouds): the night eye's view has black in it, the dark sea and the
  // sky away from the moon, where the gentler curve left a grey veil.
  vec3 looked = pow(col, vec3(uLook));
  if (rodShare > 0.0) {
    float yl = max(dot(col, vec3(0.2126, 0.7152, 0.0722)), 1e-30);
    float n = mix(uLook, NIGHT_LOOK, rodShare);
    looked = mix(looked, col * pow(yl, n - 1.0) * pow(LOOK_PIVOT, uLook - n), rodShare);
  }
  col = looked;
  col = 1.0 - exp(-col);                             // tone mapping
  col = pow(col, vec3(1.0 / 2.2));                   // display encoding
  // How far is what this pixel shows? As far as the clouds, if they hide
  // enough of what is behind or give enough of its light, or else as far
  // as the sea; the sky is infinitely far. A thin sheet counts when nothing
  // else is there, or when it hides the rest.
  float wCloud = tBar > 0.0 ? (1.0 - Tc) * (cloudsFirst ? 1.0 : Th) : 0.0;
  float wHigh = tHigh > 0.0 ? (1.0 - Th) * (cloudsFirst ? Tc : 1.0) : 0.0;
  // A wisp that hides little of the dark sea still gives much of the
  // light. Counted as sea, that light would stay on the sea while the
  // cloud flies past, and trail behind a near cloud in streaks.
  bool cloudLight = dot(C[1], vec4(1.0)) > 0.05 * dot(L[1], vec4(1.0));
  float tSeen = tBar > 0.0 && (wCloud > 0.1 || cloudLight) ? tBar : ground ? tmax : -1.0;
  // Against the sky, a sheet too thin to hide much still gives much of the
  // light, and its streaks would smear if they stayed put: it counts by
  // its share of the light (the sun, the moon and stars behind it, by far
  // the brighter, stay put).
  if (tSeen < 0.0 && tHigh > 0.0) {
    wHigh = max(wHigh, dot(H[1], vec4(1.0)) / max(dot(L[1], vec4(1.0)), 1e-30));
  }
  if (wHigh > (tSeen < 0.0 ? 0.1 : 0.5)) tSeen = tHigh;
  outAux = vec4(distanceCode(tSeen), 0.0, 1.0);
  // The frame is kept in steps (of half floats, or of 8 bits). Rounded to
  // the nearest, a smooth sky would come out in bands; rounded down, it
  // would be too dark. So round up or down at random, anew each frame:
  // then the mean over the frames is right. The same for the level.
  outColor = floor(clamp(vec4(col, level), 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass)) / uSteps;
}
#endif
</script>

<script id="mean" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler2D;

// The picture of the aircraft's view is a mean over frames: one frame is
// noisy (its rays cross the pixels and step through the clouds at random).
// This shader joins a new frame to the picture so far. While the view
// moves, each pixel finds what it shows now in that picture, where it was a
// frame ago.
uniform sampler2D uFrame;     // the new frame, as shown, and its level before exposure (a)
uniform sampler2D uFrameAux;  // the distance of what each pixel shows, coded (r, g)
uniform sampler2D uPast;      // the picture so far
uniform sampler2D uPastAux;   // its distances (r, g), and the number of frames in the mean / 64 (b)
uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform float uAlt;     // altitude of the eye, km
uniform mat3 uCamPast;  // the camera a frame ago
uniform vec2 uResPast;  // the size of the picture so far
uniform vec3 uWay;      // how far the eye has moved since, km
uniform float uTrust;   // the most frames a pixel's past may count for
uniform float uSteps;   // the picture is kept in steps of 1 / uSteps
uniform float uPass;    // the number of the frame
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;

const float RG = 6360.0;        // ground radius, km

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// The code of a distance (see distanceCode in the other shader) as one
// number from 0 to 1, and one over the distance (km; 0: infinitely far).
float decode(vec2 c) {
  return (floor(c.x * 255.0 + 0.5) * 256.0 + floor(c.y * 255.0 + 0.5)) / 65535.0;
}
float nearness(float code) {
  return code > 0.995 ? 0.0 : exp2((0.5 - code) * 20.0);
}

// Where in the picture so far (0 to 1; outside: nowhere) was what this pixel
// shows, if that is at one over inv km from the eye (0: infinitely far)?
// Clouds and sea have come nearer by the eye's way since, at the same height
// above the ground; the sky stays (the air rides with the eye). The camera
// of that frame says which pixel it was.
vec2 whence(float inv) {
  vec3 q = normalize(uCam * vec3((gl_FragCoord.xy * 2.0 - uRes) * uTan / uRes.y, 1.0));
  if (inv > 0.0) {
    q /= inv;
    q += vec3(uWay.x, uWay.y - dot(2.0 * q.xz + uWay.xz, uWay.xz) / (2.0 * (RG + uAlt + q.y)), uWay.z);
  }
  q = q * uCamPast;
  return q.z > 0.0 ? 0.5 + 0.5 * q.xy / (q.z * uTan) * vec2(uResPast.y / uResPast.x, 1.0) : vec2(-1.0);
}

void main() {
  ivec2 here = ivec2(gl_FragCoord.xy);
  vec4 col = texelFetch(uFrame, here, 0);
  float code = decode(texelFetch(uFrameAux, here, 0).rg);
  float inv = nearness(code);
  // Things at different distances pass each other as the eye moves: by
  // `parallax` pixels a frame for a difference of 1 in one over the distance.
  float parallax = length(uWay) * uRes.y / (2.0 * uTan);
  vec2 st = whence(inv);
  // If something nearer was there, this pixel may show its ragged edge,
  // where one frame hits the cloud and the next misses it. Then look where
  // that nearer thing was: for a miss, it leads to the same edge; for sea
  // that the cloud has just uncovered, to the sea next to the cloud.
  if (uTrust > 0.0 && parallax > 0.0 && st == clamp(st, 0.0, 1.0)) {
    float invWas = nearness(decode(textureLod(uPastAux, st, 0.0).rg));
    if (parallax * (0.8 * invWas - inv) > 0.1) st = whence(invWas);
  }

  // The mean of n frames takes this one as the next. Without a past (the
  // first frame, a pixel that comes into view), this frame is the picture.
  float n = 0.0, codeNow = code;
  if (uTrust > 0.0 && st == clamp(st, 0.0, 1.0)) {
    // Read the picture so far through a Catmull-Rom filter (nine bilinear
    // reads: Jimenez, 2016): a bilinear read, frame after frame, would
    // blur it.
    // The weights and reads follow MJP's Tex2DCatmullRom.hlsl gist (MIT): see THIRD_PARTY_NOTICES.md.
    vec2 size = vec2(textureSize(uPast, 0));
    vec2 pos = st * size - 0.5;
    vec2 i = floor(pos), f = pos - i;
    vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));
    vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
    vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));
    vec2 w3 = f * f * (-0.5 + 0.5 * f);
    vec2 w12 = w1 + w2;
    vec2 c0 = (i - 0.5) / size, c12 = (i + 0.5 + w2 / w12) / size, c3 = (i + 2.5) / size;
    vec4 was = (textureLod(uPast, vec2(c0.x, c0.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c0.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c0.y), 0.0) * w3.x) * w0.y
             + (textureLod(uPast, vec2(c0.x, c12.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c12.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c12.y), 0.0) * w3.x) * w12.y
             + (textureLod(uPast, vec2(c0.x, c3.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c3.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c3.y), 0.0) * w3.x) * w3.y;
    // The filter overshoots at edges: stay within the four texels around.
    // They also tell how many frames the mean has, and how far away the
    // pixel's past was.
    ivec2 last = ivec2(size) - 1;
    vec4 lo = vec4(1e9), hi = vec4(-1e9);
    float codeWas = 0.0;
    for (int k = 0; k < 4; k++) {
      ivec2 t = clamp(ivec2(i) + ivec2(k & 1, k >> 1), ivec2(0), last);
      vec4 c = texelFetch(uPast, t, 0);
      lo = min(lo, c);
      hi = max(hi, c);
      vec4 aux = texelFetch(uPastAux, t, 0);
      vec2 g = mix(1.0 - f, f, vec2(k & 1, k >> 1));
      n += g.x * g.y * 64.0 * aux.b;
      codeWas += g.x * g.y * decode(aux.rg);
    }
    was = clamp(was, lo, hi);
    // Is the past what the pixel shows now? Not if it was nearer or further
    // by enough to slip a fraction of a pixel since. Then the past only
    // counts as far as it looks like this frame around the pixel. At the
    // ragged edge of a cloud both cloud and sea are around, and the mean
    // goes on.
    float invWas = nearness(codeWas);
    float doubt = smoothstep(0.1, 0.3, parallax * max(abs(inv - invWas) - 0.2 * max(inv, invWas), 0.0));
    if (doubt > 0.0) {
      ivec2 edge = textureSize(uFrame, 0) - 1;
      lo = col;
      hi = col;
      for (int k = 0; k < 9; k++) {
        vec4 c = texelFetch(uFrame, clamp(here + ivec2(k % 3 - 1, k / 3 - 1), ivec2(0), edge), 0);
        lo = min(lo, c);
        hi = max(hi, c);
      }
      vec4 fit = clamp(was, lo, hi);
      vec3 off = abs(fit.rgb - was.rgb);
      // A past that had to change much was something else: begin again.
      float other = doubt * smoothstep(0.02, 0.1, max(off.r, max(off.g, off.b)));
      was = mix(was, fit, doubt);
      n = mix(n, min(n, 1.0), other);
      codeWas = mix(codeWas, code, other);
    }
    n = any(isnan(was)) ? 0.0 : min(n, uTrust);
    if (n > 0.0) {
      col = mix(was, col, 1.0 / (n + 1.0));
      // A cloud's distance stays after a miss, and fades only as fast as
      // its light does in the mean. While the picture still holds a near
      // cloud's light, the pixel moves with that cloud; once the cloud has
      // gone, the past is in doubt (above) and its light is let go. Faded
      // sooner, the light would stay behind on the sea, in streaks.
      codeNow = min(code, mix(codeWas, code, 1.0 / (n + 1.0)));
    }
  }
  // Round up or down at random, as the other shader does, so that the mean
  // neither stops moving nor sinks.
  outColor = floor(clamp(col, 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass + 5.3)) / uSteps;
  float c = floor(codeNow * 65535.0 + 0.5), high = floor(c / 256.0);
  outAux = vec4(high / 255.0, (c - 256.0 * high) / 255.0, (n + 1.0) / 64.0, 1.0);
}
</script>

<script id="show" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Copies the picture of the aircraft's view to the canvas, which may be larger.
uniform sampler2D uPicture;
uniform vec2 uSize;     // of the canvas
uniform float uDither;  // 0 when the picture is rounded to 8 bits already
out vec4 outColor;

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

void main() {
  vec3 col = textureLod(uPicture, gl_FragCoord.xy / uSize, 0.0).rgb;
  // Triangular dither of one 8-bit step removes the banding.
  float n = hash(gl_FragCoord.xy) + hash(gl_FragCoord.xy + 17.31) - 1.0;
  outColor = vec4(col + uDither * n / 255.0, 1.0);
}
</script>

<script id="meter" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// The exposure meter: each pixel of this small target is a block of the
// picture, and holds the mean of its level (log2 of the luminance before
// exposure, coded from 0 to 1) at 4 x 4 points, in 16 bits over two 8-bit
// channels. The JS reads the blocks back and sets the exposure.
uniform sampler2D uPicture;
uniform vec2 uBlocks;   // the number of blocks across and up
out vec4 outColor;

void main() {
  vec2 size = vec2(textureSize(uPicture, 0));
  float sum = 0.0;
  for (int k = 0; k < 16; k++) {
    vec2 at = (floor(gl_FragCoord.xy) + (vec2(k & 3, k >> 2) + 0.5) / 4.0) / uBlocks * size;
    sum += texelFetch(uPicture, ivec2(at), 0).a;
  }
  float c = floor(sum / 16.0 * 65535.0 + 0.5), high = floor(c / 256.0);
  outColor = vec4(high / 255.0, (c - 256.0 * high) / 255.0, 0.0, 1.0);
}
</script>

<script>
// Background sound, made in the browser with the Web Audio API: no files, no
// samples. Every part is noise or a tone, shaped by filters to stand for one
// source of the real sound. SkySound.engine(ctx) builds the graph on any
// BaseAudioContext (the tests render it offline); SkySound.attach(...) runs
// it in the page. It never asks for a frame: the page may stop drawing while
// the sound goes on.
const SkySound = (() => {
  'use strict';
  const KINDS = ['off', 'airliner', 'airliner-whine', 'wind'];
  // Strength of the engines' high tones in the airliner with engine whine
  // (1: soft, the level chosen by ear; 2: 6 dB stronger).
  const WHINE = 1;
  // The engines run at cruise thrust whatever the sliders say: the speed
  // slider is how fast the view goes by, not a throttle, and an airliner's
  // engines hold a steady speed in cruise. N1, the fan's speed as a fraction
  // of full, is 0.9; the fan shaft turns at 56 Hz.
  const N1 = 0.9, SHAFT = 62 * N1;
  const FADE = 0.15;          // time constant of fades and crossfades, s
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  const between = (lo, hi) => lo + (hi - lo) * Math.random();
  // Moves an AudioParam to a value: at once (tau 0), or gliding towards it.
  function to(param, value, when, tau) {
    if (tau > 0) param.setTargetAtTime(value, when, tau); else param.setValueAtTime(value, when);
  }

  // What the sound needs to know of the flight, from the altitude (km) and the
  // speed (km/h). Density falls with a scale height of 8 km.
  function flight(alt, speed) {
    const sigma = Math.exp(-alt / 8), ref = Math.exp(-11 / 8);
    // Dynamic pressure, relative to the cruise (11 km, 900 km/h), with a light
    // wind that is there even when the aircraft stands still.
    const q = sigma / ref * ((speed / 900) ** 2 + 0.004);
    // The rush of air grows with the dynamic pressure, compressed (0.7 of its
    // level in dB) and softly held below +9 dB, so that low and fast stays
    // bearable: -17 dB standing still, -3 dB low and slow, +5 dB at 2400 km/h.
    const db = 7 * Math.log10(q);
    return {
      sigma,
      rush: 10 ** ((db > 0 ? 9 * Math.tanh(db / 9) : db) / 20),
      // A faster flow is brighter: the frequencies of the turbulence scale
      // with the speed.
      bright: Math.sqrt((speed + 60) / 960),
      // Thin air carries less of the low end: a shelf under 250 Hz, 0 dB at
      // 11 km, up to +7 dB near the ground.
      body: Math.min(7, Math.max(-3, 4 * Math.log2(sigma / ref))),
    };
  }

  // Builds the sound on ctx, into ctx.destination. Returns:
  //   play(kind, when): crossfade to a variation ('off' fades out);
  //   fly(alt, speed, when, glide): follow the flight (glide false: at once);
  //   volume(v, when, glide): 0 to 1;
  //   hush(quiet, when): fade the whole output out (true) or back in;
  //   tick(until): schedule the slow random movement (gusts, the beat of the
  //   engines) up to the time until. In the page, a timer calls it.
  function engine(ctx) {
    const sr = ctx.sampleRate;

    // The noise bed. Gaussian noise in a stereo buffer of 11 s (right 0.6
    // correlated with left: some width, and safe in mono), times random signs
    // from a mono buffer of 10.3 s. The product is Gaussian noise again, but
    // it repeats only when both loops line up again, which is never in
    // practice; one looped buffer alone would repeat every 11 s.
    const bed = ctx.createGain();
    {
      const n = Math.round(11 * sr), m = Math.round(10.3 * sr);
      const a = ctx.createBuffer(2, n, sr), b = ctx.createBuffer(1, m, sr);
      const l = a.getChannelData(0), r = a.getChannelData(1), s = b.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const u = Math.sqrt(-2 * Math.log(1 - Math.random())), w = 2 * Math.PI * Math.random();
        l[i] = u * Math.cos(w);
        r[i] = 0.6 * l[i] + 0.8 * u * Math.sin(w);
      }
      for (let i = 0; i < m; i++) s[i] = Math.random() < 0.5 ? -1 : 1;
      const na = ctx.createBufferSource(), nb = ctx.createBufferSource();
      na.buffer = a; nb.buffer = b; na.loop = nb.loop = true;
      bed.gain.value = 0;
      na.connect(bed);
      nb.connect(bed.gain);
      na.start();
      nb.start();
    }
    // The same noise 0.1 s later: uncorrelated with the bed, for a branch that
    // overlaps others in frequency and would otherwise add to or cancel them,
    // as their filters shift the phase.
    const late = ctx.createDelay(0.1);
    late.delayTime.value = 0.1;
    bed.connect(late);

    // Output: the voices -> mix, which puts the cruise near -27 dBFS, below
    // the compressor's knee -> a high-pass at 25 Hz (nothing below is heard,
    // and it would only work the compressor) -> a compressor with a short
    // look-ahead, which holds the loud states (low and fast) down -> trim ->
    // a soft ceiling, which keeps every sample below -1.4 dBFS whatever comes
    // in -> volume -> hush.
    const mix = ctx.createGain(), comp = ctx.createDynamicsCompressor();
    mix.gain.value = 0.4;
    comp.threshold.value = -24;
    comp.knee.value = 12;
    comp.ratio.value = 4;
    comp.attack.value = 0.005;
    comp.release.value = 0.4;
    // The compressor adds a fixed makeup gain of (1 / its gain at 0 dBFS)^0.6
    // (Web Audio's definition): 8.2 dB for these settings, measured. With the
    // trim, the gain below the knee is +6.7 dB, which brings the cruise to
    // about -20 dBFS at full volume. The trim also halves the signal for the
    // ceiling's input range.
    const trim = ctx.createGain();
    trim.gain.value = 0.5 * 10 ** (-1.5 / 20);
    // tanh with unit slope at 0, tending to 0.85: the input range -2..2 is
    // mapped onto -1..1 by the trim's half.
    const ceiling = ctx.createWaveShaper(), curve = new Float32Array(2049);
    for (let i = 0; i < curve.length; i++) curve[i] = 0.85 * Math.tanh((i / 1024 - 1) * 2 / 0.85);
    ceiling.curve = curve;
    const level = ctx.createGain(), hushed = ctx.createGain();
    const subsonic = ctx.createBiquadFilter();
    subsonic.type = 'highpass';
    subsonic.frequency.value = 25;
    mix.connect(subsonic).connect(comp).connect(trim).connect(ceiling).connect(level).connect(hushed).connect(ctx.destination);

    // A kit for one voice: its nodes, the taps it takes on the noise bed, its
    // tones, and a release that undoes them all.
    function kit() {
      const out = ctx.createGain(), taps = [], tones = [];
      out.gain.value = 0;
      out.connect(mix);
      const chain = (...nodes) => { for (let i = 1; i < nodes.length; i++) nodes[i - 1].connect(nodes[i]); return nodes[nodes.length - 1]; };
      return {
        out, chain,
        filter(type, frequency, Q = 0.7071, gain = 0) {
          const f = ctx.createBiquadFilter();
          f.type = type;
          f.frequency.value = frequency;
          f.Q.value = Q;
          f.gain.value = gain;
          return f;
        },
        gain(v = 0) { const g = ctx.createGain(); g.gain.value = v; return g; },
        pan(p) { const s = ctx.createStereoPanner(); s.pan.value = p; return s; },
        // A tap on the later noise bed, undone when the voice ends.
        late(node) { late.connect(node); taps.push([late, node]); return node; },
        // A branch of noise through the given nodes, into the voice.
        noise(...nodes) { bed.connect(nodes[0]); taps.push([bed, nodes[0]]); chain(...nodes, out); },
        // A tone with the given harmonics (amplitudes, from the fundamental;
        // none: a sine) at the given frequency.
        tone(harmonics, frequency) {
          const o = ctx.createOscillator();
          o.frequency.value = frequency;
          if (harmonics) o.setPeriodicWave(ctx.createPeriodicWave(new Float32Array([0, ...harmonics.map(() => 0)]),
            new Float32Array([0, ...harmonics])));
          o.start();
          tones.push(o);
          return o;
        },
        release(when) {
          for (const o of tones) o.stop(when);
          // A silent timer, ended when the fade is over: then the voice leaves
          // the graph and its filters stop running.
          const timer = ctx.createConstantSource();
          timer.offset.value = 0;
          timer.connect(out.gain);
          timer.onended = () => { for (const [src, dst] of taps) src.disconnect(dst); out.disconnect(); };
          timer.start(when);
          timer.stop(when + 0.01);
        },
      };
    }

    // The high tones of two turbofans heard through the cabin wall, for the
    // airliner with engine whine; strength scales their level. Per engine,
    // panned as the low drone:
    //   - the fan's blade-passing tone (24 blades: 1340 Hz) with its second
    //     and third harmonics;
    //   - "buzz-saw": at high power the fan's tips pass the speed of sound and
    //     their shocks, a little unequal from blade to blade, give tones at
    //     every multiple of the shaft's speed; here orders 8 to 40, of
    //     irregular height, at half strength (they come in from N1 0.8 and
    //     are full at 1);
    //   - the high-pressure compressor's whine, on the second shaft (N2 0.96):
    //     3.5 kHz;
    // and, shared, a narrow band of noise around the fan tone and around the
    // whine. The wall's mass law takes off the top: all of it is low-passed
    // at 3.5 kHz. Each line wanders a few cents, slowly, both engines
    // together; the second runs 0.2 to 1 cent faster, so that the fan's line
    // beats once in 1.3 to 6.5 s (the whine at 3.5 kHz, 0.4 to 2 times a
    // second).
    function highTones(k, strength) {
      const bus = k.gain(strength * N1 ** 3), wall = k.filter('lowpass', 3500, 0.5);
      k.chain(bus, wall, k.out);
      const whine = 3600 * (0.6 + 0.4 * N1);
      const engines = [-0.35, 0.35].map(p => {
        const pan = k.pan(p);
        pan.connect(bus);
        const fan = k.tone([1, 0.45, 0.25], 24 * SHAFT);
        k.chain(fan, k.gain(0.02), pan);
        const orders = Array.from({ length: 40 }, (_, i) => i < 7 ? 0 : 0.2 + 0.8 * Math.random() ** 2);
        const buzz = k.tone(orders, SHAFT);
        k.chain(buzz, k.filter('bandpass', 1100, 0.6), k.gain(0.015), pan);
        const comp = k.tone(null, whine);
        k.chain(comp, k.gain(0.004), pan);
        return [fan, buzz, comp];
      });
      k.chain(k.late(k.filter('bandpass', 24 * SHAFT, 18)), k.gain(0.05), bus);
      k.chain(k.late(k.filter('bandpass', whine, 25)), k.gain(0.05), bus);
      return [{ every: [3, 8], at: (t, tau) => {
        const c = 4 * gauss(), apart = between(0.2, 1);
        engines.forEach((tones, i) => { for (const o of tones) o.detune.setTargetAtTime(c + i * apart, t, tau); });
      } }];
    }

    // The variations. Each returns its kit, set(f, when, glide) to follow the
    // flight, and tracks: the slow random movement, as { every: [lo, hi]
    // seconds between knots, at(t, tau): schedule one knot }.
    const voices = {
      // The cabin of an airliner at cruise. whine > 0 adds the engines' high
      // tones at that strength.
      airliner(whine = 0) {
        const k = kit();
        // The rush of the boundary layer through the fuselage: most of the
        // noise in a cabin. The wall passes the low frequencies and stops the
        // high ones, so the noise is low-passed twice; it brightens with speed.
        const rushLp = k.filter('lowpass', 450, 0.55), rushLp2 = k.filter('lowpass', 1500, 0.6);
        const shelf = k.filter('lowshelf', 250), rush = k.gain(), drift = k.gain(1);
        k.noise(k.filter('highpass', 40), rushLp, rushLp2, shelf, rush, drift);
        // Low rumble: the airframe shaking in light turbulence, under 100 Hz,
        // in slow swells.
        const rumble = k.gain(), bump = k.gain(1);
        k.noise(k.filter('lowpass', 85, 0.8), rumble, bump);
        // The engines, under the wings behind: the fan shaft's tone and its
        // harmonics, one per engine, panned a little to each side. They run
        // at nearly the same speed, so they beat slowly; the beat wanders.
        const engines = [-0.35, 0.35].map(p => {
          const o = k.tone([1, 0.6, 0.45, 0.3, 0.2, 0.14, 0.1, 0.07, 0.05], SHAFT);
          k.chain(o, k.filter('lowpass', 600), k.gain(0.09 * N1 ** 3), k.pan(p), k.out);
          return o;
        });
        // The fans' whirr: a narrow band of noise at the blade-passing
        // frequency (24 blades), faint through the wall.
        k.noise(k.filter('bandpass', 24 * SHAFT, 8), k.gain(0.025 * N1 ** 4));
        // Air conditioning: a steady hiss from the vents, 2 to 7 kHz.
        k.noise(k.filter('highpass', 1800), k.filter('lowpass', 7000), k.gain(0.0035));
        return {
          k,
          // Only the air follows the flight; the engines keep their cruise.
          set(f, when, glide) {
            to(rush.gain, 0.6 * f.rush, when, glide && 0.4);
            to(rushLp.frequency, 450 * f.bright, when, glide && 0.4);
            to(rushLp2.frequency, 1500 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.4);
            to(rumble.gain, 0.9 * f.rush * Math.sqrt(f.sigma / 0.25), when, glide && 0.4);
          },
          tracks: [
            // The second engine runs 8 to 22 cents faster: a beat of 0.3 to
            // 0.8 Hz on the shaft tone, more on its harmonics. (The whine's
            // lines keep their own, much smaller mismatch: at this one, the
            // fan tone, 24 times higher, would flutter at 7 to 19 Hz.)
            { every: [4, 10], at: (t, tau) => engines[1].detune.setTargetAtTime(between(8, 22), t, tau) },
            { every: [0.8, 3], at: (t, tau) => bump.gain.setTargetAtTime(Math.exp(0.3 * gauss()), t, tau) },
            { every: [2, 6], at: (t, tau) => drift.gain.setTargetAtTime(Math.exp(0.08 * gauss()), t, tau) },
            ...(whine > 0 ? highTones(k, whine) : []),
          ],
        };
      },
      // The same cabin, with more of the engines' high tones.
      'airliner-whine': () => voices.airliner(WHINE),

      // No engine: only the air, as from an open window or a glider. Gusts
      // come and go; thin and quiet high up, fuller low down.
      wind() {
        const k = kit();
        // The rush past the ears and the frame, low-passed; a gust makes it
        // both louder and brighter (the filter's detune follows the gust).
        const thin = k.filter('highpass', 60), bodyLp = k.filter('lowpass', 800, 0.5);
        const shelf = k.filter('lowshelf', 250), body = k.gain(), gust = k.gain(1);
        k.noise(thin, bodyLp, shelf, body, gust);
        // Buffeting: the low, irregular push of the wind, under 120 Hz, which
        // rises more than the rest in a strong gust.
        const buffet = k.gain(), heave = k.gain(1);
        k.noise(k.filter('lowpass', 110, 0.7), buffet, heave);
        // Whistles: air on an edge sings at a pitch set by its speed (vortex
        // shedding); two faint narrow bands that come and go.
        const whistles = [1, 1.62].map(r => {
          const bp = k.filter('bandpass', 700 * r, 22), g = k.gain(), on = k.gain(0);
          k.noise(bp, g, on);
          return { r, bp, g, on };
        });
        // Gusts: a slow swell (tens of seconds) with quicker gusts on top,
        // log-normal, so that strong ones are rare.
        let swell = 0;
        return {
          k,
          set(f, when, glide) {
            // Standing still, a breeze remains: 15 dB under the cruise at
            // 11 km, 9 dB under it near the ground.
            const rush = Math.max(f.rush, 0.18 * Math.sqrt(f.sigma / Math.exp(-11 / 8)));
            to(thin.frequency, 40 + 160 * (1 - f.sigma), when, glide && 0.6);
            to(bodyLp.frequency, 800 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.6);
            to(body.gain, 0.55 * rush, when, glide && 0.4);
            to(buffet.gain, 1.3 * rush * f.sigma, when, glide && 0.4);
            for (const w of whistles) {
              to(w.bp.frequency, 700 * w.r * f.bright, when, glide && 0.6);
              to(w.g.gain, 0.25 * rush * Math.sqrt(f.sigma), when, glide && 0.6);
            }
          },
          tracks: [
            { every: [0.8, 2.6], at: (t, tau) => {
              swell = 0.9 * swell + 0.44 * gauss();
              const g = 0.33 * swell + 0.45 * gauss();
              gust.gain.setTargetAtTime(Math.exp(0.6 * g - 0.15), t, tau);
              heave.gain.setTargetAtTime(Math.exp(0.9 * g - 0.3), t, tau);
              bodyLp.detune.setTargetAtTime(300 * g, t, tau);
              for (const w of whistles) w.bp.detune.setTargetAtTime(250 * g, t, tau);
            } },
            ...[0, 1].map(i => ({ every: [1.5, 5], at: (t, tau) =>
              whistles[i].on.gain.setTargetAtTime(Math.random() < 0.35 ? between(0.3, 1) : 0, t, tau) })),
          ],
        };
      },
    };

    let now = flight(11, 900), voice = null, current = 'off';
    const live = new Set();
    return {
      get kind() { return current; },
      play(kind, when) {
        current = voices[kind] ? kind : 'off';
        if (voice) {
          // The old voice fades out, keeps its movement until it is silent,
          // and leaves the graph.
          to(voice.k.out.gain, 0, when, FADE);
          voice.end = when + 8 * FADE;
          voice.k.release(voice.end);
          voice = null;
        }
        if (!voices[kind]) return;
        voice = voices[kind]();
        voice.set(now, when, false);
        voice.end = Infinity;
        for (const tr of voice.tracks) tr.t = when;
        live.add(voice);
        voice.k.out.gain.setValueAtTime(0, when);
        to(voice.k.out.gain, 1, when, FADE);
      },
      fly(alt, speed, when, glide = true) {
        now = flight(alt, speed);
        if (voice) voice.set(now, when, glide);
      },
      volume(v, when, glide = true) { to(level.gain, v * v, when, glide && 0.05); },
      hush(quiet, when) { to(hushed.gain, quiet ? 0 : 1, when, 0.1); },
      tick(until) {
        for (const v of live) {
          const stop = Math.min(until, v.end);
          for (const tr of v.tracks) {
            while (tr.t < stop) {
              const step = between(...tr.every);
              tr.at(tr.t, step / 3);
              tr.t += step;
            }
          }
          if (v.tracks.every(tr => tr.t >= v.end)) live.delete(v);
        }
      },
    };
  }

  // Runs the sound in the page. Takes
  //   select, volume: the controls; their parents are hidden without Web Audio;
  //   note, volumeOut: <output>s, for the note that the sound waits for a
  //   click (waiting(): its text, in the page's language) and the volume;
  //   params: the address's URLSearchParams; aircraft(): { alt, speed } now.
  // Returns follow(), to call when the altitude or the speed changes, and
  // show(), to call when the language changes.
  function attach({ select, volume, note, volumeOut, waiting, params, aircraft }) {
    const AC = window.AudioContext;
    if (!AC) {
      select.parentElement.hidden = volume.parentElement.hidden = true;
      return { follow() {}, show() {} };
    }
    // The address, else the last choice, else off and half volume.
    let stored = [null, null];
    try { stored = [localStorage.getItem('sky.sound'), localStorage.getItem('sky.volume')]; } catch (err) {}
    let kind = [params.get('sound'), stored[0]].find(k => KINDS.includes(k)) || 'off';
    const v = [params.get('volume'), stored[1]].find(x => x !== null && x !== '' && isFinite(x));
    let vol = v === undefined ? 0.5 : Math.min(1, Math.max(0, +v));
    select.value = kind;
    volume.value = vol;
    let ctx = null, eng = null, timer = 0, gen = 0;
    const show = () => {
      note.textContent = kind !== 'off' && (!ctx || ctx.state !== 'running') && !document.hidden ? waiting() : '';
      volumeOut.textContent = Math.round(vol * 100) + ' %';
    };
    const tick = () => eng.tick(ctx.currentTime + 4);
    // Starts or resumes the context and the chosen variation. Browsers allow
    // sound only from a user gesture: this runs from one, or waits for one.
    function wake() {
      if (kind === 'off' || document.hidden) return;
      // Without a gesture yet, a new context would only be refused (and warn).
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const my = ++gen;
      if (!ctx) {
        try { ctx = new AC({ latencyHint: 'playback' }); } catch (err) { return; }
        eng = engine(ctx);
        eng.volume(vol, 0, false);
        eng.fly(aircraft().alt, aircraft().speed, 0, false);
        ctx.onstatechange = show;
      }
      ctx.resume().then(() => {
        if (my !== gen) return;
        const t = ctx.currentTime;
        eng.hush(false, t);
        if (eng.kind !== kind) eng.play(kind, t);
        tick();
        clearInterval(timer);
        timer = setInterval(tick, 1000);
        show();
      }, () => {});
    }
    // Fades out, then suspends: nothing runs while it is off or hidden.
    function sleep(off) {
      const my = ++gen;
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime;
      if (off) eng.play('off', t); else eng.hush(true, t);
      setTimeout(() => {
        if (my !== gen) return;
        clearInterval(timer);
        ctx.suspend();
      }, off ? 1300 : 600);
    }
    for (const type of ['pointerdown', 'pointerup', 'keydown', 'click']) {
      window.addEventListener(type, () => { if (!ctx || ctx.state !== 'running') wake(); }, { capture: true, passive: true });
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) sleep(false); else wake(); show(); });
    select.addEventListener('change', () => {
      kind = select.value;
      try { localStorage.setItem('sky.sound', kind); } catch (err) {}
      if (kind === 'off') sleep(true); else wake();
      show();
    });
    volume.addEventListener('input', () => {
      vol = +volume.value;
      try { localStorage.setItem('sky.volume', vol); } catch (err) {}
      if (eng) eng.volume(vol, ctx.currentTime);
      show();
    });
    show();
    return { follow() { if (eng) eng.fly(aircraft().alt, aircraft().speed, ctx.currentTime); }, show };
  }

  return { engine, attach };
})();
</script>

<script>
(() => {
  'use strict';
  const RAD = Math.PI / 180;
  const LATITUDE = 35 * RAD;         // of the observer
  const OBLIQUITY = 23.44 * RAD;     // tilt of the earth's axis
  const FOV = 62 * RAD;
  const AIR_LOOK = 1.4;    // from the air: as deep as photographs taken there
  // The hero's limit, chosen in the panel.
  const HERO_PIXELS = { fhd: 1920 * 1080, wqhd: 2560 * 1440, '4k': 3840 * 2160 };
  let heroPixels = HERO_PIXELS.wqhd;
  const CRUISE = 11;       // km: 36,000 ft
  const NOISE = 128, WEATHER = 1024;   // sizes of the cloud textures
  const WEATHER_KM = 256;  // the weather map repeats after this many km (as in the shader)
  // The view from the aircraft is a mean over frames: of about IN_MOTION
  // while it moves, of all of them at rest. When the light changes, RELIGHT
  // frames take half of each new one, so that the old light is soon gone.
  // SETTLE frames after that, a still picture is clean and the drawing stops.
  const SETTLE = 32, IN_MOTION = 10, RELIGHT = 6;
  const MIN_SCALE = 0.35;  // the smallest picture a slow GPU may draw, relative to the canvas
  // The exposure follows the picture (see exposureFor and the shader
  // "meter"). Levels are log2 of the luminance before exposure.
  const METER = [64, 36];        // blocks of the picture the meter reads
  const LOG_RANGE = [-34, 18];   // the levels the frames' alpha codes from 0 to 1
  const METER_MS = 100;          // the meter is read at most this often...
  const METER_LAG = 3;           // ...this many frames after its blocks are drawn
  const LOW_SHARE = 0.25;        // the darker quarter of the picture sets the key...
  const KEY = -1.3;              // ...the exposure is KEY - EYE * its level...
  const EYE = 0.85;              // ...opening EYE stops for each stop darker...
  const NIGHT_LEVEL = -25.5;     // ...down to a moonless night sky
  const HIGH_SHARE = 0.03;       // the brightest 3 % of the picture...
  const WHITE = 0.3;             // ...end at this level after exposure (just below white)...
  const DAY_HIGH = 0.5;          // ...when they are this bright or more (daylight),
  const DIM = 0.6;               // ...and DIM stops lower for each stop dimmer
  const DEEP = 0.8, MID_GAP = 0.5;        // how far highlights may stop down (exposureFor)...
  const DUSK = [8, 1];           // twilight's exposure takes over as the sun goes from 8 to 1 degrees:
  const DUSK_SHARE = 0.65;       // ...set by the level that the brighter third of the picture passes (the sky):
  const DUSK_MID = -3, DUSK_SHOWN = -0.8;   // ...at DUSK_MID at sunset, it is shown at DUSK_SHOWN...
  const DUSK_POW = 0.7;          // ...falling to the night's along a power of its distance from the night's
  const ABOVE = 3.5, ABOVE_SPAN = 5;   // ...and the highlights may stand up to ABOVE stops above white,
                                       // reached ABOVE_SPAN degrees after twilight's exposure has taken over;
  const PEAK_SHARE = 0.002, PEAK_ABOVE = 1;   // ...but the brightest PEAK_SHARE (the band of glow) at most PEAK_ABOVE
  const DIM_BAND = 0.1, DROP = 1.5;           // stops above white, DIM_BAND lower per stop it is dimmer than

      channel.port2.postMessage(0);
    }))
    .then(() => makeSky(heroCanvas, () => ({ yaw: state.yaw, pitch: state.pitch, fov: FOV,
      alt: state.alt, cloud: state.cloud, look: AIR_LOOK }),
      { done, shown: () => hero.classList.add('shown') }))
    .catch(err => {
      console.error(err);
      return null;
    })
    .then(made => {
      render = made;
      loaded = true;
      hero.dataset.sky = made ? 'ready' : 'failed';
      if (!made) hero.classList.add('shown');
      kick();
      // A time-lapse asked for in the address starts now, not during the loading.
      if (playing) {
        if (pace !== 1) last = performance.now();
        schedule();
      }
      showIntro();
      wake();
    });
})();
</script>
</body>
</html>
