<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The Pages workflow replaces "dev" with the commit (and the pull request) it publishes: shown by ?debug=1. -->
<meta name="build" content="dev">
<title>Sky — レイリー散乱の空</title>
<style>
  :root {
    --wall: #f3f1ec;
    --ink: #1c2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero: the sky itself ---------- */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    color: #fff;
  }
  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;   /* a drag by touch looks around, as with the mouse */
    /* Fallback when WebGL is unavailable. */
    background: linear-gradient(to top,
      oklch(0.90 0.04 235) 0%, oklch(0.74 0.11 245) 30%,
      oklch(0.56 0.15 255) 70%, oklch(0.44 0.15 260) 100%);
  }
  .hero canvas:active { cursor: grabbing; }
  /* The HUD (see HUD in the script): over the picture, under everything
     else; it takes no pointer, so a drag on it still turns the eye. */
  .hero canvas.hud { pointer-events: none; background: none; }
  .hero canvas.hud[hidden] { display: none; }
  .title {
    position: absolute;
    left: clamp(20px, 6vw, 88px);
    right: clamp(20px, 6vw, 88px);
    top: clamp(20px, 6vw, 88px);       /* as far from the top as from the left */
    pointer-events: none;
    text-shadow: 0 1px 24px rgba(10, 40, 110, .35);
  }
  .title h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 104px);
    font-weight: 200;
    letter-spacing: .04em;
    line-height: 1.05;
    /* The line box leaves room above the capitals: without it the title
       would stand lower than its margin says. Trim it where the browser
       can; elsewhere, about as much by hand. */
    text-box: trim-start cap alphabetic;
  }
  @supports not (text-box: trim-start cap alphabetic) {
    .title h1 { margin-top: -.2em; }
  }
  .title p {
    margin: 14px 0 0;
    font-size: clamp(14px, 1.5vw, 18px);
    letter-spacing: .12em;
    opacity: .92;
  }
  .panel {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 5vh, 44px);
    transform: translateX(-50%);
    width: min(840px, calc(100vw - 32px));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 24px;
    padding: 14px 22px 16px;
    border-radius: 18px;
    background: rgba(24, 58, 120, .34);
    border: 1px solid rgba(255, 255, 255, .28);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    font-size: 13px;
    letter-spacing: .06em;
  }
  .panel label { display: block; }
  /* The time row: play, now, the rate, then the time slider; the slider
     goes to a line of its own when the row is too narrow for its label. */
  .panel .time { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .panel .time label { flex: 1; min-width: 260px; }
  .panel button {
    width: 38px; height: 38px; flex: none;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .panel button:hover { background: rgba(255, 255, 255, .25); }
  .panel label:has(:disabled) { opacity: .5; }
  .panel button svg { display: block; width: 18px; height: 18px; margin: auto; }
  .panel .row { display: flex; justify-content: space-between; }
  .panel output { font-variant-numeric: tabular-nums; opacity: .9; }
  /* The altitude's value is a field: it reads as the other values until
     it is touched, then takes a number in m or km (see setAltitude). */
  .panel .row input { width: 8ch; min-width: 0; padding: 0; margin: 0; border: 0; border-radius: 3px; background: none;
    color: inherit; font: inherit; letter-spacing: inherit; text-align: right; font-variant-numeric: tabular-nums; opacity: .9; }
  /* The altitude has a row of its own: a long track, even in km up to
     ALT_LINEAR, with the heights of ALT_TICKS written under it. */
  .panel .alt { grid-column: 1 / -1; }
  .panel .alt .ticks { position: relative; display: block; height: 12px; margin: 1px 8px 0; font-size: 10px;
    line-height: 12px; letter-spacing: 0; opacity: .7; font-variant-numeric: tabular-nums; }
  .panel .alt .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .panel .row input:focus { outline: 1px solid rgba(255, 255, 255, .6); outline-offset: 1px; background: rgba(0, 0, 0, .2); opacity: 1; }
  .panel input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #fff; }
  .panel select {
    width: 100%; margin: 4px 0 0; padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font: inherit; letter-spacing: inherit;
    cursor: pointer;
  }
  .panel select option { color: #123; }
  .panel .time select { width: auto; flex: none; margin: 0; }
  /* The weather: its list, and beside it a die that draws one at random. */
  .panel .pick { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .panel .pick select { flex: 1; min-width: 0; margin: 0; padding: 4px 6px; letter-spacing: 0; }
  .panel .pick button { width: 28px; height: 28px; }
  .panel .pick button svg { width: 16px; height: 16px; }
  /* Flight: the Level button and the HUD's switch, side by side in one cell. */
  .panel .flight { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .panel .flight button { display: block; margin: 2px 0 0; width: 30px; height: 30px; }
  .panel .flight input[type=checkbox] { display: block; width: 20px; height: 20px; margin: 7px 0 0; accent-color: #fff; cursor: pointer; }
  /* The stick, for steering on a touch screen (see Steering in the script):
     bottom left. It stays when the panel fades, fainter; held, it keeps the
     panel away. */
  .stick {
    position: absolute; z-index: 2;
    left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    width: 104px; height: 104px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .55);
    background: rgba(24, 58, 120, .26);
    touch-action: none; transition: opacity .6s;
  }
  .stick[hidden] { display: none; }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px;
    border-radius: 50%; background: rgba(255, 255, 255, .5); pointer-events: none;
    transform: translate(var(--x, 0px), var(--y, 0px));
  }
  .stick-level {
    position: absolute; right: -14px; top: -14px; width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6); background: rgba(24, 58, 120, .4); color: #fff;
  }
  .stick-level svg { width: 16px; height: 16px; }
  .hero.still .stick { opacity: .45; }
  .hero .stick.held { opacity: .9; }
  /* Where the panel would lie over it (narrower than the panel and the
     stick side by side), the stick waits while the panel is shown: the
     panel fades a few seconds after the last touch, and holding the stick
     keeps it away. */
  @media (max-width: 1111px) {
    .hero:not(.still) .stick { opacity: 0; visibility: hidden; transition: opacity .6s, visibility .6s; }
  }
  .hero:not(.shown) .stick { visibility: hidden; }
  .title .hint {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: .1em;
    opacity: .75;
  }
  /* Full screen, top right, in the corner that nothing else uses. */
  .fs {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 38px; height: 38px;
    padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(24, 58, 120, .34);
    color: #fff;
    cursor: pointer;
  }
  .fs:hover { background: rgba(60, 100, 170, .5); }
  .fs svg { width: 18px; height: 18px; }
  .fs .leave, .hero:fullscreen .fs .enter { display: none; }
  .hero:fullscreen .fs .leave { display: block; }
  .fs[hidden] { display: none; }
  @media (max-width: 700px) {
    .panel { grid-template-columns: repeat(2, 1fr); gap: 6px 18px; padding: 12px 16px 14px; }
  }
  /* A short window (a phone on its side): a smaller title nearer the top,
     the panel in fewer rows when it is wide enough, and a panel that never
     runs off the screen (it scrolls inside itself). */
  .panel { max-height: calc(100% - 2 * clamp(16px, 5vh, 44px)); overflow-y: auto; }
  @media (max-height: 560px) {
    .title { left: 16px; top: 16px; right: 70px; }
    .title h1 { font-size: clamp(32px, 11vh, 56px); }
    .title p { margin-top: 6px; font-size: 14px; }
    .title .hint { margin-top: 4px; }
  }
  @media (max-height: 560px) and (min-width: 701px) {
    .panel { grid-template-columns: repeat(5, 1fr); width: min(1040px, calc(100vw - 32px)); gap: 4px 20px; padding: 10px 18px 12px; }
  }
  /* The title and the hint are shown at first, then fade for good (.told).
     The panel and the full-screen button fade while nothing moves (.still)
     and come back with the pointer, a touch, a key or focus. Hidden, they
     take no clicks, so the view behind them can still be dragged; their
     controls stay in the tab order, and focus brings them back. Only
     opacity changes: the canvases are not drawn again. */
  .title { transition: opacity 1s, visibility 1s; }
  .hero.told .title { opacity: 0; visibility: hidden; }
  .panel, .fs { transition: opacity .6s; }
  .hero.still .panel, .hero.still .fs { opacity: 0; pointer-events: none; }
  /* The cursor goes with them, when their fade starts (a cursor cannot
     fade), and comes back with them; it wins over grab and grabbing. */
  .hero.still, .hero.still canvas, .hero.still canvas:active { cursor: none; }
  /* Loading: until the first picture is on the canvas (.shown), a dark
     sky with the title, a thin line of progress and a word stands over it.
     The line and the word fade in only after 0.3 s, so that a quick start
     shows nothing but the dark; the panel and the full-screen button wait
     hidden (they take no clicks and no focus). Then the dark fades out over
     the picture, and lets the pointer through to it at once. Without
     WebGL2 it fades out over the canvas's gradient. */
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    background: radial-gradient(130% 90% at 50% 105%, #22385f 0%, #121f3b 45%, #080d1c 100%);
    transition: opacity .8s, visibility .8s;
  }
  .hero.shown .loading { opacity: 0; visibility: hidden; pointer-events: none; }
  .hero:not(.shown) .panel, .hero:not(.shown) .fs { opacity: 0; visibility: hidden; }
  .loading .line, .loading p { opacity: 0; animation: sky-appear .6s ease .3s forwards; }
  /* With the picture, they go at once: the panel may come up where they are. */
  .hero.shown .loading .line, .hero.shown .loading p { animation: none; }
  /* The loading failed: its text says so, and the line goes. */
  .hero.failed .loading .line { visibility: hidden; }
  .loading .why {
    max-width: min(90vw, 60em); max-height: 40vh; overflow: auto; margin: 1em auto 0;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
    text-align: left; opacity: .7; user-select: text; -webkit-user-select: text;
  }
  /* ?debug=1 (or the I key): the build and the address that reproduces the view, over everything, to read off a screenshot. */
  .debug {
    position: fixed; z-index: 101; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    margin: 0; padding: 6px 8px; width: max-content; max-width: min(560px, calc(100vw - 16px)); box-sizing: border-box;
    pointer-events: none; font: 11px/1.35 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #fff; background: rgba(0, 0, 0, .74); border-radius: 4px; text-align: left; user-select: text; -webkit-user-select: text;
  }
  .debug[hidden] { display: none; }
  .debug .q { display: block; margin-top: 3px; color: #cfe8ff; }
  .debug button {
    pointer-events: auto; margin-top: 4px; padding: 2px 8px; font: inherit; color: #fff; cursor: pointer;
    background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .5); border-radius: 3px;
  }
  /* (The title would lie under it for its first seconds.) */
  body.debugging .title { display: none; }
  /* ?stats: what the hero costs, over everything, to read off a screenshot. */
  .stats {
    position: fixed; z-index: 100; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    margin: 0; padding: 6px 8px; max-width: calc(100vw - 32px); pointer-events: none;
    font: 11px/1.35 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
    color: #fff; background: rgba(0, 0, 0, .72); border-radius: 4px;
  }
  .loading .line {
    position: relative;
    width: min(220px, 50vw);
    height: 2px;
    overflow: hidden;
    border-radius: 1px;
    background: rgba(255, 255, 255, .16);
  }
  /* The part done (--done, 0 to 1, set by the script), and a faint light
     that runs along the line while the page works. */
  .loading .line::before, .loading .line::after { content: ""; position: absolute; inset: 0; }
  .loading .line::before {
    background: rgba(255, 255, 255, .8);
    transform-origin: left;
    transform: scaleX(var(--done, 0));
    transition: transform .4s;
  }
  .loading .line::after {
    width: 35%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
    animation: sky-sweep 1.8s ease-in-out infinite;
  }
  .loading p {
    margin: 14px 0 0;
    font-size: 12px;
    letter-spacing: .14em;
    color: rgba(255, 255, 255, .78);
  }
  @keyframes sky-appear { to { opacity: 1; } }
  @keyframes sky-sweep { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) {
    .title, .panel, .fs, .stick { transition: none; }
    .loading .line::after { animation: none; display: none; }
  }
</style>
</head>
<body>

<section class="hero" data-sky="loading">
  <canvas id="sky" aria-label="巡航中の航空機から見た、空と雲と海" data-t-label="canvas"></canvas>
  <canvas class="hud" hidden aria-hidden="true"></canvas>
  <div class="loading" role="status">
    <div class="line"></div>
    <p data-t="loading">読み込み中…</p>
  </div>
  <div class="title">
    <h1>Sky</h1>
    <p data-t="subtitle">レイリー散乱で描く、雲の上の空</p>
    <p class="hint" data-t="hint">ドラッグで見回す</p>
  </div>
  <button class="fs" type="button" hidden aria-label="全画面表示" title="全画面表示">
    <svg class="enter" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>
    <svg class="leave" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>
  </button>
  <div class="stick" hidden aria-hidden="true">
    <div class="knob"></div>
    <button class="stick-level" type="button" tabindex="-1">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 9h5M11.5 9h5"/><circle cx="9" cy="9" r="2.5"/></svg>
    </button>
  </div>
  <form class="panel" onsubmit="return false">
    <div class="time">
      <button id="play" type="button" aria-label="時間を進める" data-t-label="play">▶</button>
      <button id="now" type="button" aria-label="いまの日時" title="いまの日時" data-t-label="now" data-t-title="now">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 4.8V9l2.8 1.8"/></svg>
      </button>
      <button id="here" type="button" aria-label="現在地のいまの空" title="現在地のいまの空" data-t-label="here" data-t-title="here">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 16.5s-5.2-5.3-5.2-9a5.2 5.2 0 0 1 10.4 0c0 3.7-5.2 9-5.2 9z"/><circle cx="9" cy="7.4" r="1.9"/></svg>
      </button>
      <select id="rate" aria-label="時間の進む速さ" title="時間の進む速さ" data-t-label="rate" data-t-title="rate">
        <option value="1" data-t="rate1">実時間</option>
        <option value="60" data-t="rate60">1分/秒</option>
        <option value="600" data-t="rate600">10分/秒</option>
        <option value="960" data-t="rate960" selected>16分/秒</option>
        <option value="3600" data-t="rate3600">1時間/秒</option>
      </select>
      <label>
        <span class="row"><span data-t="time">時刻</span><output id="timeOut"></output></span>
        <input id="time" type="range" min="0" max="24" step="0.05" value="15">
      </label>
    </div>
    <label class="alt">
      <span class="row"><span data-t="alt">高度</span><input id="altOut" type="text" inputmode="decimal" enterkeyhint="done"
        autocomplete="off" spellcheck="false" aria-label="高度（m または km）" title="高度（m または km）" data-t-label="altField" data-t-title="altField"></span>
      <input id="alt" type="range" min="0" max="1035" step="1" aria-label="高度" data-t-label="alt">
      <span class="ticks" aria-hidden="true"></span>
    </label>
    <label>
      <span class="row"><span data-t="date">日付</span><output id="dateOut"></output></span>
      <input id="date" type="range" min="1" max="365" step="1">
    </label>
    <label>
      <span class="row"><span data-t="moon">月</span><output id="moonOut"></output></span>
      <input id="moon" type="range" min="0" max="29.5" step="0.5">
    </label>
    <label>
      <span class="row"><span data-t="lat">緯度</span><output id="latOut"></output></span>
      <input id="lat" type="range" min="-90" max="90" step="0.1" value="35">
    </label>
    <label>
      <span class="row"><span data-t="lon">経度</span><output id="lonOut"></output></span>
      <input id="lon" type="range" min="-180" max="180" step="0.1" value="135">
    </label>
    <label>
      <span class="row"><span data-t="clock">時計</span></span>
      <select id="clock">
        <option value="solar" data-t="clockSolar">太陽時</option>
        <option value="utc" data-t="clockUTC">協定世界時 (UTC)</option>
      </select>
    </label>
    <div>
      <span class="row"><span id="weatherName" data-t="weather">天気</span><output id="weatherOut"></output></span>
      <span class="pick">
        <select id="weather" aria-labelledby="weatherName"></select>
        <button id="roll" type="button" aria-label="天気をランダムに選ぶ" title="天気をランダムに選ぶ" data-t-label="roll" data-t-title="roll">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="2.5" width="13" height="13" rx="3"/><g fill="currentColor" stroke="none"><circle cx="6.2" cy="6.2" r="1.3"/><circle cx="9" cy="9" r="1.3"/><circle cx="11.8" cy="11.8" r="1.3"/></g></svg>
        </button>
      </span>
    </div>
    <label>
      <span class="row"><span data-t="haze">大気の霞</span><output id="hazeOut"></output></span>
      <input id="haze" type="range" min="0" max="6" step="0.05" value="1">
    </label>
    <label>
      <span class="row"><span data-t="wind">海上の風</span><output id="windOut"></output></span>
      <input id="wind" type="range" min="1" max="15" step="0.5" value="6">
    </label>
    <label>
      <span class="row"><span data-t="speed">速度</span><output id="speedOut"></output></span>
      <input id="speed" type="range" min="0" max="3000" step="50" value="900">
    </label>
    <label>
      <span class="row"><span data-t="cloud">雲</span><output id="cloudOut"></output></span>
      <input id="cloud" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      <span class="row"><span data-t="mid">中層の雲</span><output id="midOut"></output></span>
      <input id="mid" type="range" min="0" max="1" step="0.01" value="0">
    </label>
    <label>
      <span class="row"><span data-t="cirrus">薄雲</span><output id="cirrusOut"></output></span>
      <input id="cirrus" type="range" min="0" max="1" step="0.01" value="0.4">
    </label>
    <div class="flight">
      <div>
        <span class="row"><span data-t="level">水平飛行</span></span>
        <button id="level" type="button" aria-label="水平飛行に戻す" title="水平飛行に戻す (L)" data-t-label="levelDo" data-t-title="levelKey">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1.5 9h5M11.5 9h5"/><circle cx="9" cy="9" r="2.5"/></svg>
        </button>
      </div>
      <label title="計器表示 (HUD) の切り替え (H)" data-t-title="hudKey">
        <span class="row"><span data-t="hud">計器 (HUD)</span></span>
        <input id="hud" type="checkbox">
      </label>
    </div>
    <label>
      <span class="row"><span data-t="sound">音</span><output id="soundOut"></output></span>
      <select id="sound">
        <option value="off" data-t="soundOff">なし</option>
        <option value="airliner" data-t="soundAirliner">旅客機</option>

// values (each on its slider's step); drawn by the die (weight: how often,
// against the others), any value from low to high, and any place on the

// its top by day is featureless, see low.smooth). The list is made from
// this table.

// (shown only while the sliders differ from the weather chosen).
{
  const list = document.getElementById('weather');
  for (const w of [...WEATHERS, { id: 'custom' }]) {
    const key = w.id === 'custom' ? 'weatherCustom' : 'weather.' + w.id, option = document.createElement('option');
    if (w.en) { TEXT.en[key] = w.en; TEXT.ja[key] = w.ja; }
    option.value = w.id;
    option.dataset.t = key;
    list.append(option);
  }
  list.lastChild.disabled = list.lastChild.hidden = true;
}
// The language: the address (?lang=en), else the reader's last choice, else
// the browser's first Japanese or English language; English for all others.
let LANG = (() => {
  const known = l => l === 'ja' || l === 'en';
  const asked = new URLSearchParams(location.search).get('lang');
  if (known(asked)) return asked;
  let stored = null;
  try { stored = localStorage.getItem('sky.lang'); } catch (err) {}
  if (known(stored)) return stored;
  for (const l of navigator.languages || [navigator.language || '']) {
    if (/^ja(-|$)/i.test(l)) return 'ja';
    if (/^en(-|$)/i.test(l)) return 'en';
  }
  return 'en';
})();
function applyLanguage(lang) {
  LANG = lang;
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', T[el.dataset.tLabel]);
  for (const el of document.querySelectorAll('[data-t-title]')) el.title = T[el.dataset.tTitle];
  document.getElementById('lang').value = lang;
}

<script id="noise" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// Draws the textures of the clouds once, at start: slice uZ (0 to 1) of the
// 3D noise, or the weather map (uZ -1). Everything repeats.
uniform float uZ;
uniform float uSize;
// A tower's model (uZ from 3): its lobes, balls in the model's box (xyz: the middle, y up; w: the radius; in units of the
// box's side), how many of them, and where its part of the slice starts, in texels.
uniform vec4 uLobes[128];
uniform vec2 uTower;
out vec4 outColor;

// An integer hash: xor-shifts and multiplies, Wellons' lowbias32
// (hash-prospector, public domain). Inputs one apart give unrelated words.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for a lattice point; the lattice repeats
// every `period` points (at most 1024). One hash of the cell, its
// coordinates packed into a word, plus the seed spaced by the golden ratio.
// The numbers are the word, and its low 21 and 10 bits moved up: their
// first 11, 11 and 10 bits are their own, finer than the 8 bits the
// textures keep.
vec3 rnd(vec3 cell, vec3 period, float seed) {
  uvec3 c = uvec3(mod(cell, period));
  uint h = ihash(c.x + (c.y + c.z * 1024u) * 1024u + uint(seed) * 0x9e3779b9u + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

// Worley noise, upside down: 1 at a feature point, 0 far from all of them.
// r0 rounds the peak at each point over that share of a cell (a cone made
// pointed billows: cones, and towers like mountains); the rest stays as it
// was, raised a little, so that the mean of the field is nearly the same.
float worley(vec3 p, vec3 freq, float seed, float r0) {
  p *= freq;
  vec3 id = floor(p), f = p - id;
  float m = 1.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      for (int z = -1; z <= 1; z++) {
        vec3 g = vec3(x, y, z);
        vec3 r = g + rnd(id + g, freq, seed) - f;
        m = min(m, dot(r, r));
      }
    }
  }
  return r0 == 0.0 ? 1.0 - sqrt(m) : min(1.0 + 0.25 * r0 - sqrt(m + r0 * r0), 1.0);
}

float worley(vec3 p, vec3 freq, float seed) {
  return worley(p, freq, seed, 0.0);
}

float worleyFbm(vec3 p, vec3 freq, float seed, float r0) {
  return 0.625 * worley(p, freq, seed, r0) + 0.25 * worley(p, 2.0 * freq, seed + 1.0, r0)
       + 0.125 * worley(p, 4.0 * freq, seed + 2.0, r0);
}

// Perlin (gradient) noise, about -1 to 1.
float perlin(vec3 p, vec3 freq, float seed) {
  p *= freq;
  vec3 i = floor(p), f = p - i;
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
#define G(c) dot(rnd(i + c, freq, seed) * 2.0 - 1.0, f - c)
  return mix(mix(mix(G(vec3(0, 0, 0)), G(vec3(1, 0, 0)), u.x), mix(G(vec3(0, 1, 0)), G(vec3(1, 1, 0)), u.x), u.y),
             mix(mix(G(vec3(0, 0, 1)), G(vec3(1, 0, 1)), u.x), mix(G(vec3(0, 1, 1)), G(vec3(1, 1, 1)), u.x), u.y), u.z);
}

float perlinFbm(vec3 p, vec3 freq, int octaves, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq *= 2.0;
    amp *= 0.555;
  }
  return sum;
}

// The same with a chosen gain: nearer 1, more of the small sizes.
float fbm(vec3 p, vec3 freq, int octaves, float gain, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq.xy *= 2.0;
    amp *= gain;
  }
  return sum;
}

// Heads: round heads on a jittered lattice of `cells` cells a side (each point kept 0.15 of a cell off the cell's sides), each
// a ball of a radius of 0.4 to 0.64 of a cell, a little flatter than wide. The height of the ball's surface (sqrt(1 - d^2);
// outside it 1 - d^2, below nought); where two meet the higher wins: a sharp crease. (As cones, the Worley cells, heads
// melt into soft lobes.) -1 to 1.
float heads(vec3 p, float cells, float seed) {
  p *= cells;
  // (The eight cells round the nearest corner hold every ball that can reach the place: a ball's radius is under 0.65.)
  vec3 id = floor(p - 0.5), f = p - id;
  float m = -1.0;
  for (int x = 0; x <= 1; x++) {
    for (int y = 0; y <= 1; y++) {
      for (int z = 0; z <= 1; z++) {
        vec3 g = vec3(x, y, z), h = rnd(id + g, vec3(cells), seed);
        vec3 r = g + 0.15 + 0.7 * h - f;
        r.y /= 0.85;
        float rad = mix(0.4, 0.64, fract(61.0 * h.x + 17.0 * h.y));
        float d2 = dot(r, r) / (rad * rad);
        m = max(m, d2 < 1.0 ? sqrt(1.0 - d2) : 1.0 - d2);
      }
    }
  }
  return m;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  if (uZ >= 3.0) {
    // A tower (uTower in fs): how far inside the nearest of its lobes the place is, of the box's side (-0.25 to 0.07 as
    // 0 to 1); where two lobes meet, a sharp cleft.
    vec3 p = vec3((gl_FragCoord.x - uTower.y) / uSize, uZ - 3.0, uv.y);
    float d = -1.0;
    // (A lobe whose middle is in the lowest tenth of the box goes straight down from its middle: the tower's foot
    // is as wide at the base as just over it. As balls, the lowest lobes drew in under their middles, and the tower
    // stood on a torn, narrower edge.)
    for (int i = 0; i < int(uTower.x); i++) {
      vec3 r = p - uLobes[i].xyz;
      if (uLobes[i].y < 0.1) r.y = max(r.y, 0.0);
      d = max(d, uLobes[i].w - length(r));
    }
    outColor = vec4((d + 0.25) / 0.32);
    return;
  }
  if (uZ >= 2.0) {
    // The heads of the heaps (uHeads): of 4, 8, 16 and 32 cells per tile (a head is 4 texels wide at least).
    vec3 p = vec3(uv, uZ - 2.0);
    // (In a loop to a bound the compiler cannot know: one copy of heads, not four.)
    vec4 h = vec4(0.0);
    for (int k = 0; k < 4 + int(min(uSize, 0.0)); k++) {
      float m = heads(p, float(4 << k), 70.0 + float(k));
      h = vec4(k == 0 ? m : h.x, k == 1 ? m : h.y, k == 2 ? m : h.z, k == 3 ? m : h.w);
    }
    outColor = 0.5 + 0.5 * h;
    return;
  }
  if (uZ >= 0.0) {
    // Perlin-Worley (after Schneider, 2015): Worley cells, swollen by billowy Perlin noise.
    vec3 p = vec3(uv, uZ);
    float billow = min(abs(perlinFbm(p, vec3(4.0), 7, 0.0)), 1.0);
    // (A keeps its cones: the cirrus reads it too.)
    float g = worleyFbm(p, vec3(4.0), 10.0, 0.25);
    float b = worleyFbm(p, vec3(8.0), 20.0, 0.25);
    float a = worleyFbm(p, vec3(16.0), 30.0, 0.0);
    outColor = vec4(g + billow * (1.0 - g), g, b, a);
  } else {
    // Weather, on a map 256 km wide, for the layer of low cloud (see
    // cloudLayer in fs).
    // R, its amount: systems of some 80 km; open cells of 30 km, with the
    // cloud along their walls; streets, rows of cloud 5 km apart; clumps of
    // 6 km.
    vec3 p = vec3(uv, 0.37);
    float systems = perlinFbm(p, vec3(3.0, 3.0, 1.0), 3, 40.0);
    float walls = smoothstep(0.3, 0.75, 1.0 - worley(p, vec3(9.0, 9.0, 1.0), 50.0));
    // Whole numbers turn the streets and keep them repeating.
    vec3 s = vec3(4.0 * uv.x + uv.y, 4.0 * uv.y - uv.x, 0.37);
    float streets = fbm(s, vec3(12.0, 3.0, 1.0), 3, 0.7, 90.0);
    float clumps = fbm(p, vec3(40.0, 40.0, 1.0), 4, 0.75, 60.0);
    float amount = clamp(0.5 + 0.45 * systems + 0.2 * (walls - 0.5) + 0.35 * streets + 0.25 * clumps, 0.0, 1.0);
    // G, its depth: deeper and shallower over some 40 km.
    float depth = clamp(0.5 + 0.9 * perlinFbm(p, vec3(6.0, 6.0, 1.0), 4, 72.0), 0.0, 1.0);
    // B: wind on the sea, which blows towards (2, 1): gusts and calms some
    // 7 km across and twice as long down the wind, with finer ones inside
    // them. (Smoothed over tens of km, it also moves the level of the
    // bases.)
    vec3 pw = vec3(2.0 * uv.x + uv.y, 2.0 * uv.y - uv.x, 0.37);
    float gusts = 0.5 + 0.55 * perlinFbm(pw, vec3(8.0, 16.0, 1.0), 5, 80.0);
    // A: where the air rises, and heaps grow into towers: patches of some
    // 10 km in regions of 50 km.
    float rise = smoothstep(0.4, 0.55, 0.45 + 0.7 * perlinFbm(p, vec3(5.0, 5.0, 1.0), 4, 70.0))
               * smoothstep(0.15, 0.4, fbm(p, vec3(20.0, 20.0, 1.0), 3, 0.6, 65.0))
               * (0.7 + 0.6 * perlin(p, vec3(11.0, 11.0, 1.0), 75.0));
    outColor = vec4(amount, depth, gusts, rise);
  }
}
</script>

<script id="ice" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// Draws the cirrus's textures once: its map (uZ = -2), its ice (-3, and
// the ice's age into a second target), and the way of the ice's fibres and
// its age (-4). Everything repeats.
uniform float uZ;
uniform vec2 uSize;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAge;
layout(location = 2) out vec4 outPhase;

// An integer hash: Wellons' lowbias32, as in the noise shader.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// ---------- The cirrus's ice ----------
// A tile of ICE_KM square (half a unit of the cirrus's frame). The ice is
// drawn as systems, as photographs show cirrus: a few large, connected
// forms with much blue between, not a sprinkle of tufts. A generating head
// makes ice, which falls out of it into wind that turns with depth: the
// shear draws it into a long tail that curves away (a fall streak: mares'
// tails, the hook of cirrus uncinus). Heads come in groups along a spine,
// and their tails join into a feather or a broad fibrous band. Old ice
// spreads into broad fibrous sheets and long streets.
//
// Everything is drawn in one warped frame, the flow (iceFlowFrame): its
// lines of constant y are the ways the wind draws the ice, and they turn
// slowly over tens of km, so that the strands of neighbouring forms run
// together and their way changes from region to region. In that frame a
// tail is two arcs (a hook, then a long tail that curves gently) whose
// strands fan out from the head; a sheet is noise drawn out along it. Each
// texel is computed by itself, in closed form: the field does not depend
// on the order of the draws, and repeats with the tile.
//
// Four kinds make four fields (the channels of the texture), which the
// scene mixes by the cirrus's map: tails (R), sheets and streets (G),
// flocks of small tufts (B) and large systems (A).
const float ICE_KM = 40.477;     // WEATHER_KM / sqrt(10) / 2
// Loops of the ice run to bounds the compiler cannot know, so that it keeps
// them as loops (uSize is never negative): unrolled, the noise's loop in
// each of its calls and the systems' loops made the program large, and
// the page's first picture waited for the driver to finish it. Such a
// loop writes no array at its index (vectors instead, or a loop of
// constant bounds): Direct3D's compiler may have to unroll a loop that
// writes an array at an index it cannot know, and it cannot unroll one
// whose bound it cannot know (see the GLSL rules in docs/development.md).
#define ICE_N(n) ((n) + int(min(uSize.x, 0.0)))
const float WEATHER_KM = 256.0;

// Lattice words: a point's coordinates and the seed hashed into one word.
uint iceWord(uvec3 c, uint seed) {
  return ihash(c.x * 0x9e3779b9u + c.y * 0x85ebca6bu + c.z * 0xc2b2ae35u + seed * 0x27d4eb2fu);
}

// Gradient noise in 2D, with its gradient. The gradients turn with time t
// (each at a speed of its own, up to a turn per unit), so the pattern
// changes in time. It repeats every `period` cells (whole numbers); the
// lattice wraps by hand (see the GLSL rules on mod()).
float iceNoise(vec2 p, vec2 period, float t, uint seed, out vec2 grad) {
  vec2 i = floor(p), f = p - i;
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  vec2 i0 = i - period * floor((i + 0.5) / period);
  vec2 i1 = i0 + 1.0;
  i1 -= period * floor((i1 + 0.5) / period);
  float n = 0.0;
  grad = vec2(0.0);
  for (int k = 0; k < ICE_N(4); k++) {
    vec2 c = vec2(float(k & 1), float(k >> 1));
    uint h = iceWord(uvec3(uvec2(mix(i0, i1, c) + 0.5), 0u), seed);
    float ang = 6.2831853 * (float(h >> 16u) / 65536.0 + t * (float(h & 1023u) / 511.5 - 1.0));
    vec2 g = vec2(cos(ang), sin(ang)), d = f - c, w = mix(1.0 - u, u, c);
    float v = dot(g, d), wt = w.x * w.y;
    n += wt * v;
    grad += wt * g + v * (2.0 * c - 1.0) * du * w.yx;
  }
  return n;
}

// Four random numbers (0 to 1) from a word.
vec4 iceRandom(uint h) {
  uint h2 = ihash(h);
  return vec4(uvec4(h, h >> 16u, h2, h2 >> 16u) & 65535u) / 65535.0;
}

// Value noise in 2D (0 to 1), not repeating (for the fibres of a head).
float iceValue(vec2 p, uint seed) {
  vec2 i = floor(p), f = p - i, u = f * f * (3.0 - 2.0 * f);
  uvec2 c = uvec2(ivec2(i) + 32768);
  float v00 = float(iceWord(uvec3(c, 0u), seed) >> 8u), v10 = float(iceWord(uvec3(c + uvec2(1u, 0u), 0u), seed) >> 8u);
  float v01 = float(iceWord(uvec3(c + uvec2(0u, 1u), 0u), seed) >> 8u), v11 = float(iceWord(uvec3(c + uvec2(1u, 1u), 0u), seed) >> 8u);
  return mix(mix(v00, v10, u.x), mix(v01, v11, u.x), u.y) / 16777215.0;
}

// The flow: x displaced by noise at three sizes (20, 8 and 3.4 km, whole
// numbers to the tile, so that it repeats with it), more across the wind
// than along. Lines of constant y of the result are the ways the ice is
// drawn; they turn by up to some 0.4 rad over 10 to 20 km. The slope of
// the displacement stays well under 1, so the frame never folds.
vec2 iceFlowFrame(vec2 x, uint seed) {
  const vec3 W[3] = vec3[3](vec3(2.0, 2.0, 5.0), vec3(5.0, 0.8, 1.2), vec3(12.0, 0.15, 0.2));
  vec2 d = vec2(0.0), g;
  for (int o = 0; o < ICE_N(3); o++) {
    vec2 per = o == 0 ? vec2(2.0, 1.0) : vec2(W[o].x), q = x * (per / ICE_KM);
    d += W[o].yz * vec2(iceNoise(q, per, 0.0, seed + uint(2 * o), g), iceNoise(q, per, 0.0, seed + uint(2 * o + 1), g));
  }
  return x + d;
}

// Turbulence: the flow's frame w moved by the curl of noise at three sizes
// (some 5.8, 2.5 and 1 km), each read where the larger ones have moved
// it, so that the eddies stir the stirred ice again. The curl moves the ice
// without bunching it (no sinks), and its strength changes from region to
// region (calm patches with smooth streaks, stirred ones where they kink,
// hook and fold). Everything the ice draws is drawn in the stirred frame:
// heads become ragged, tails kink and their edges are irregular at every
// scale, as in photographs; drawn in the smooth flow alone, tails stood as
// airbrushed ribbons and sheets as combed straight lines.
vec2 iceTurb(vec2 w, uint seed) {
  const vec2 O[3] = vec2[3](vec2(7.0, 0.4), vec2(16.0, 0.065), vec2(40.0, 0.015));
  vec2 g, q = w / ICE_KM;
  // (Calm regions are many: stirred all over, long bands at dusk stood as
  // wavy streaks, where photographs show long calm bands.)
  float reg = smoothstep(-0.05, 0.45, iceNoise(q * 3.0, vec2(3.0), 0.0, seed + 40u, g) + 0.5 * iceNoise(q * 7.0, vec2(7.0), 0.0, seed + 41u, g));
  float s = 0.08 + 1.0 * reg;
  vec2 d = vec2(0.0);
  for (int o = 0; o < ICE_N(3); o++) {
    iceNoise((w + d) * (O[o].x / ICE_KM), vec2(O[o].x), 0.0, seed + 42u + uint(o), g);
    d += s * O[o].y * vec2(g.y, -g.x);
  }
  return w + d;
}

// The way from the start of an arc to its point at l km along: the arc
// leaves at the angle th and turns at the rate k (rad per km).
vec2 iceArcEnd(float th, float k, float l) {
  if (abs(k * l) < 1e-3) return l * vec2(cos(th), sin(th));
  return vec2(sin(th + k * l) - sin(th), cos(th) - cos(th + k * l)) / k;
}

// The point of such an arc from p0, l km long, nearest q: (the way along
// it to that point, 0 to l; the place across, signed, to the left; the way
// beyond its ends, negative before p0). Beyond its ends the arc runs on
// straight.
float iceIn = 1.0;
vec3 iceArcNear(vec2 q, vec2 p0, float th, float k, float l) {
  vec2 e = vec2(cos(th), sin(th)), d = q - p0;
  float s = dot(d, e);
  iceIn = 1.0;
  if (abs(k) * l >= 0.02) {
    // About the centre: the angle from p0, the way the arc turns. (iceIn:
    // the distance from the centre over the radius. Near the centre the
    // nearest point jumps from one end of the arc to the other.)
    vec2 a = vec2(e.y, -e.x) / k, b = d + a;
    iceIn = abs(k) * length(b);
    s = atan(a.x * b.y - a.y * b.x, dot(a, b)) / k;
    float turn = 6.2831853 / abs(k);
    if (s < 0.5 * (l - turn)) s += turn;
    if (s >= 0.0 && s <= l) return vec3(s, 1.0 / k - sign(k) * length(b), 0.0);
  } else if (s >= 0.0 && s <= l) {
    return vec3(s, dot(d, vec2(-e.y, e.x)), 0.0);
  }
  float se = s > l ? l : 0.0, te = th + k * se;
  vec2 de = q - p0 - iceArcEnd(th, k, se), ee = vec2(cos(te), sin(te));
  return vec3(se, dot(de, vec2(-ee.y, ee.x)), dot(de, ee));
}

// The point of a tail nearest q (as iceArcNear, the way along from the
// head): its ice leaves the head at hp turned by `hook` from the way th,
// comes round to it over lh km (a comma, the hook of cirrus uncinus), then
// turns by `veer` over the rest of its length L, as it falls into wind of
// another way.
vec3 iceTailNear(vec2 q, vec2 hp, float th, float hook, float lh, float veer, float L) {
  float k1 = -hook / lh;
  vec3 a = iceArcNear(q, hp, th + hook, k1, lh);
  float ia = iceIn;
  vec3 b = iceArcNear(q, hp + iceArcEnd(th + hook, k1, lh), th, veer / (L - lh), L - lh);
  b.x += lh;
  // The nearer of the two, blended where they are nearly as near: on the
  // inside of the bend the nearest point jumps from one arc to the other,
  // and with it the place along the tail, its width and its strands (a hard
  // line with a string of beads, seen from just under the deck).
  float da = length(a.yz), db = length(b.yz), m = smoothstep(-0.25, 0.25, (da - db) / (da + db + 0.05));
  iceIn = mix(ia, iceIn, m);
  return mix(a, b, m);
}

// The strands' phase (see icePhase): their phasor summed over the ice (xy)
// and the ice summed (z), each kind weighed by iceKind, as the scene
// mostly mixes them.
vec3 icePh = vec3(0.0);
float iceKind = 0.0;
// How fibrous the ice is here, 0 to 1 (iceFibrous; fc of icePhase): where
// it is low, the ice is a soft milky body and its strands are faint; the
// phasor's length says so to the scene, whose hairs fade with it.
float iceFc = 1.0;
// Adds ice val whose strands lie at whole numbers of v, sp km apart, fc
// fibrous (its phasor's length): as a
// phasor of v, so that the scene can draw hairs along them (ciHair),
// weighed by the square of the ice, so that where trails of several ages
// or heads meet, the densest leads (summed evenly, the phase wavered from
// texel to texel and the hairs drawn along it stood as worms). Where
// they lie closer than four texels, every m-th (m not whole: the phase runs
// on smoothly), so that the phase never changes by more than a quarter of
// a turn from a texel to the next.
void icePhase(float val, float v, float sp, float fc) {
  float m = max(1.0, 4.0 * ICE_KM / uSize.x / sp), th = 6.2831853 * v / m, w = iceKind * val;
  w *= w;
  // (Shortened by how fibrous the ice is: a soft body has few hairs.)
  icePh += vec3(w * fc * cos(th), w * fc * sin(th), w);
}

// How fibrous the ice is at w (the flow's frame), 0 to 1: noise of some 13
// and 5 km. Real cirrus is a soft, translucent body with fibres in it, of
// very different strength from place to place: some parts nearly smooth,
// some finely fibrous. Drawn fibrous all over (round 16), every form stood
// as crisp lines of even width with blue between, like combed hair.
float iceFibrous(vec2 w, uint seed) {
  vec2 g, q = w / ICE_KM;
  float n = iceNoise(q * vec2(3.0, 4.0), vec2(3.0, 4.0), 0.0, seed, g) + 0.5 * iceNoise(q * vec2(8.0, 11.0), vec2(8.0, 11.0), 0.0, seed + 1u, g);
  return smoothstep(-0.4, 0.5, n);
}

// How much of a pattern of period sp (km) the ice's texels can hold: 0
// where the period is under k texels, 1 over twice that. Strands and
// threads finer than that are drawn as their mean: sampled once a texel,
// they aliased into moire that no filter of the scene could take out
// (ripples across soft bands from the ground, round 13's g3). The hairs
// (ciHair, in the scene) draw the fine strands instead.
float iceFine(float sp, float k) {
  return smoothstep(k, 2.0 * k, sp * uSize.x / ICE_KM);
}

// The strands of a trail: its ice falls in streaks along it. u: the place
// across the trail in units of its half width there, which grows with age,
// so that the strands fan out; al: the place along it; n: strands to a
// half width; sp: the strands' spacing (km). Returns their weight (around
// 1) and the share of the head's
// life that the strand there lives: the strands end one by one, the outer
// ones first, so that a trail tapers and frays out instead of ending
// round.
// How sharp the strands are (0 to 1): soft strands of value noise alone at
// 0, with thin bright threads in them at 1.
float iceSharp = 1.0;
vec2 iceStrands(float u, float a, float al, float n, float sp, uint seed, out float vs) {
  float v = u * n;
  float life = (0.75 + 0.3 * iceValue(vec2(0.8 * v, 0.5), seed + 4u)) * (1.0 - 0.12 * min(u * u, 5.0));
  // The strands wander from side to side, each group of two or three its
  // own way, so that they cross and braid; and towards the end of its life
  // a strand curls off to one side or the other, as the ice that falls
  // last meets the shear below.
  float wob = 2.0 * iceValue(vec2(0.37 * v + 3.0, 2.5 * al), seed + 6u) - 1.0;
  float curl = 2.0 * iceValue(vec2(0.6 * v, 7.5), seed + 8u) - 1.0;
  float end = smoothstep(0.35 * life, life, a);
  v += (0.6 + 0.6 * a) * wob;
  // Downstream the strands part in groups of some four, each group drifting
  // its own way, and lanes of blue open between the groups, so that a tail
  // splits and fans out instead of widening as one ribbon.
  float grp = iceValue(vec2(0.25 * v + 9.0, 0.5), seed + 14u);
  v += 1.4 * a * a * (2.0 * grp - 1.0);
  float lane = 1.0 - smoothstep(0.0, 0.25, a * a - 1.2 * abs(grp - 0.5));
  // (The hairs follow the strands without their curl: drawn crisp along
  // it, the curls of the thin tails stood as a net of loops.)
  vs = v;
  v += 2.5 * curl * end * end;
  // (Two sizes: strands of very different widths side by side.)
  float band = 0.65 * iceValue(vec2(v, al), seed) + 0.35 * iceValue(vec2(2.6 * v + 3.1, 1.9 * al), seed + 18u);
  float thr = 1.0 - abs(2.0 * iceValue(vec2(2.7 * v, 3.0 * al) + 5.0, seed + 2u) - 1.0);
  thr *= thr;
  thr *= thr * thr;
  // Patches across the strands: the ice falls in bursts, so that a trail
  // thickens and thins along its length over several strands at once
  // (bands across the streaks), with gaps between.
  float burst = iceValue(vec2(0.12 * v + 11.0, 1.1 * al), seed + 10u);
  burst = 0.15 + 2.2 * burst * burst;
  // Each strand breaks into pieces of its own (some 1 to 3 times the
  // noise's step along), with blue between: a tail is separate fine
  // strands, not one ribbon.
  // (Each group's pieces start at a place of its own: on one lattice,
  // neighbouring strands broke at the same places and stood as a grid of
  // beads seen from near the deck.)
  float seg = smoothstep(0.15, 0.5, iceValue(vec2(0.9 * v + 40.0, 0.8 * al + 3.7 * iceValue(vec2(0.37 * v, 9.0), seed + 16u)), seed + 12u));
  // Strands closer than some three texels, and threads closer than six,
  // are their mean (0.30 and 0.22): see iceFine.
  // (Soft strands are the noise itself, sharp ones its square with threads:
  // the mean stays some 0.42.)
  float b2 = mix(0.30, mix(band, band * band, iceSharp), iceFine(sp, 2.5)), t6 = mix(0.22, thr, iceFine(sp / 2.7, 5.0));
  return vec2((0.04 + 1.6 * b2 + 2.5 * iceSharp * t6) * burst * mix(0.6, seg, iceFine(sp, 2.5)) * lane, life);
}

// Systems of heads with tails, in the flow's frame (w, km), one to a cell
// of `cells` to the tile (along the flow, across): tails len.x to len.y km
// long (many short, a few long), their width at the end wid.x to wid.y of
// their length (fans, which have lost their head, twice that); heads of
// some `head` km, up to `heads` of them to a system, along a spine across
// the flow (their tails join into a broad band of fibres) or along it
// (ribs off a spine: cirrus vertebratus). Groups of systems (noise of some
// 20 and 8 km at the head) are strong, weak or missing (gate: the noise's
// range from none to all but `empty` of the cells), so that the forms come
// in clusters with wide gaps of blue between. Returns the ice, and in age
// the ice times its age (0 at a head, 1 at the end of a tail): the ice
// falls as it ages, so its heads are high and its tails hang below them.
//
// A tail reaches no further than 1.8 cells down the flow from its head, 0.8
// up it and 0.85 across, so that the twelve cells searched (two up, one
// down, one to each side) hold every head whose ice can be here: a cut at
// the edge of the cells searched drew straight seams across the sky.
float iceSystems(vec2 w, vec2 cells, vec2 len, vec2 wid, float head, float heads, float empty, vec2 gate, float feathers, uint seed, out float age) {
  vec2 C = ICE_KM / cells, c0 = floor(w / C);
  float sum = 0.0;
  age = 0.0;
  for (int ci = 0; ci < ICE_N(12); ci++) {
    vec2 cell = c0 + vec2(float(ci % 4) - 2.0, float(ci / 4) - 1.0);
    vec2 wc = cell - cells * floor((cell + 0.5) / cells);
    uint h = iceWord(uvec3(uvec2(wc + 0.5), 9u), seed);
    vec4 r = iceRandom(h), r2 = iceRandom(h ^ 0x68e31da4u), r3 = iceRandom(h ^ 0x2f6b9a17u), r4 = iceRandom(h ^ 0x9e3779b9u), r5 = iceRandom(h ^ 0x51ed270bu);
    vec2 hp = (cell + vec2(0.1, 0.2) + vec2(0.6, 0.6) * r.xy) * C, g;
    float group = iceNoise(hp * (2.0 / ICE_KM), vec2(2.0), 0.0, seed + 21u, g) + 0.5 * iceNoise(hp * (5.0 / ICE_KM), vec2(5.0), 0.0, seed + 22u, g);
    float on = smoothstep(gate.x, gate.y, group);
    if (r2.x >= (1.0 - empty) * on) continue;
    // The system's way and turn: from noise over the tile (a group's tails
    // run and curve alike, as in photographs of mares' tails), and a little
    // of its own. Long tails turn less (they would leave the cells searched).
    float tilt = iceNoise(hp * (2.0 / ICE_KM), vec2(2.0), 0.0, seed + 23u, g);
    float bend = iceNoise(hp * (3.0 / ICE_KM), vec2(3.0), 0.0, seed + 24u, g);
    float L = len.x * pow(len.y / len.x, r.z);
    float sz = log(L / len.x) / log(len.y / len.x);
    bool fan = r2.w < 0.3, feather = !fan && r5.x < feathers;
    float r0 = head * (0.5 + 0.8 * r.w) * (0.5 + 0.7 * sz) * (fan ? 0.6 : 1.0);
    float th = 0.4 * tilt + 0.3 * (r3.x - 0.5);
    float veer = clamp(2.0 * bend + 0.8 * (r3.z - 0.5), -1.0, 1.0) * min(1.4 * C.y / L, 1.8) * (feather ? 0.4 : 1.0);
    // (A feather has no hook and turns less: its barbs reach far across,
    // and near the centre of a tight turn they were cut, as U-shaped holes.)
    // The hook turns the same way as the tail (a fall streak curves one
    // way, as the shear below it turns): hooked the other way, tails stood
    // as S-shaped folds.
    float hook = (fan ? 0.3 : feather ? 0.0 : 0.4 + 0.8 * sz) * (0.4 + 0.6 * r3.w) * (veer > 0.0 ? -1.0 : 1.0);
    float str = 0.5 * (0.25 + r2.y * r2.y) * (0.5 + 0.7 * smoothstep(gate.x, gate.y + 0.4, group));
    // The heads of the system along its spine.
    float nh = 1.0 + floor(r4.y * heads);
    bool ribs = r4.z < 0.3;
    float sa = ribs ? th + 0.3 * (r4.w - 0.5) : th + 1.5708 + 0.8 * (r4.w - 0.5);
    vec2 spine = (ribs ? 1.6 : 1.1) * r0 * (1.0 + r4.x) * vec2(cos(sa), sin(sa));
    for (int j = 0; j < ICE_N(6); j++) {
      if (float(j) >= nh) break;
      vec4 rj = iceRandom(h + uint(j) * 0x85ebca6bu + 0x1234567u);
      vec2 hj = hp + spine * (float(j) - 0.5 * (nh - 1.0) + 0.3 * (rj.z - 0.5));
      // (Faded by the place against the system's own head, which lies in its cell.)
      vec2 dl = w - hj, dp = w - hp;
      float far = smoothstep(-C.x, -0.8 * C.x, dp.x) * (1.0 - smoothstep(1.8 * C.x, 2.0 * C.x, dp.x)) * (1.0 - smoothstep(0.85 * C.y, C.y, abs(dp.y)));
      if (far <= 0.0) continue;
      float Lj = L * (j == 0 ? 1.0 : 0.55 + 0.45 * rj.x), rj0 = r0 * (j == 0 ? 1.0 : 0.6 + 0.5 * rj.y);
      float lh = (0.06 + 0.1 * r3.y) * Lj + 2.0 * rj0;
      Lj = max(Lj, 1.5 * lh);
      // (Within the cells searched: cut there, a long tail ended blunt.)
      Lj = min(Lj, max(1.6 * C.x - lh, 1.2 * lh));
      float w1 = Lj * mix(wid.x, wid.y, r4.x) * (fan ? 2.0 : 1.0), w0 = (feather ? 1.0 : 0.4) * rj0;
      // (A feather is wider, but stays within the cells searched.)
      if (feather) w1 = min(1.6 * w1, 0.18 * C.y);
      // The hook turns no tighter than some 2.5 widths of the tail where it
      // ends: tighter, the outer strands on its inside folded back over
      // the head (a liquid curl in wide plumes).
      float hk = hook * (j == 0 ? 1.0 : 0.6 + 0.6 * rj.x), hkMax = lh / (2.5 * (w0 + (w1 - w0) * pow(min(lh / Lj, 1.0), 0.8)));
      hk = clamp(hk, -hkMax, hkMax);
      // Quick reject: farther than the tail can reach (5 of its widths, 7 for
      // a feather, at 1.4 times its mean width: cut nearer, it drew a hard
      // curved line with a string of beads seen from just under the deck).
      float reach = Lj + lh + (feather ? 10.0 : 7.0) * (w1 + rj0);
      if (dot(dl, dl) > reach * reach) continue;
      vec3 t = iceTailNear(w, hj, th + (j == 0 ? 0.0 : 0.15 * (rj.w - 0.5)), hk, lh, veer, Lj);
      float T = t.x / Lj;
      // (None near the centre of a tight turn, where the nearest point of
      // the tail jumps: from just under the deck, a large system drew a hard
      // line with a string of beads there.)
      float inner = smoothstep(0.25, 0.55, iceIn);
      if (inner <= 0.0) continue;
      // The width changes along the tail (some 0.6 to 1.4 of its mean, over
      // a quarter of its length): ice falls in bursts, and a tail swells and
      // pinches instead of widening evenly.
      float wv = 0.6 + 0.8 * iceValue(vec2(4.0 * T + 13.0 * rj.z, 3.5), seed + 111u);
      float wd = (w0 + (w1 - w0) * pow(T, 0.8)) * mix(1.0, wv, smoothstep(0.0, 0.2, T));
      float u = t.y / wd, hd2 = dot(dl, dl) / (rj0 * rj0);
      // (The tail ends at 4.5 of its widths, 5 for a feather, and fades to
      // nothing before: a strong tail cut there drew a hard edge seen from
      // just under the deck.)
      float U = feather ? 5.0 : 4.5, edge = 1.0 - smoothstep(0.7 * U, U, abs(u));
      if (edge <= 0.0 && hd2 > 12.0) continue;
      // (Strands of very different widths from tail to tail.)
      float ns = fan ? 5.0 + 8.0 * r2.z : 2.0 + 7.0 * r2.z * r2.z, vs, sp = wd / ns, prof;
      // How fibrous this part of the tail is: the region's (iceFc), changing
      // along the tail, so that a form is smooth in parts and fibrous in
      // others; the strands are sharper where it is more fibrous.
      // (A feather keeps its barbs: smooth, it stood as a soft blob.)
      float fcl = clamp(iceFc * (0.45 + 1.1 * iceValue(vec2(2.5 * T + 9.0 * rj.z, 6.5), seed + 117u)), feather ? 0.5 : 0.0, 1.0);
      iceSharp = fcl;
      // (The strands' arguments by the branch, and one call: each call is a
      // copy for the compiler, and the page's first picture waits for it.)
      vec4 sa = vec4(u, T, t.x / 2.5 + 31.0 * r.x + 7.0 * rj.y, ns);
      uint ss = seed + 201u + uint(j);
      if (feather) {
        // A feather: fine barbs leave the spine aslant and sweep back (some
        // 40 to 60 degrees, curving with the distance out), on one side or
        // both; each barb ends at a place of its own. The spine is a thin
        // dense line along the tail.
        float bsp = (0.1 + 0.15 * r5.w) * (0.6 + 0.6 * sz) * (head / 0.5);
        float sd = r5.z < 0.6 ? (rj.z < 0.5 ? -1.0 : 1.0) : 0.0;
        float vb = (t.x - (0.9 + 0.7 * r5.y) * abs(t.y) - 0.35 * t.y * t.y / wd) / bsp;
        // (The barbs wander, merge and part: drawn evenly they stood as a
        // fish bone.)
        vb += 1.6 * (iceValue(vec2(0.3 * vb, abs(t.y) / (2.0 * bsp)), seed + 225u) - 0.5);
        // (Their spacing changes along the spine, some 0.6 to 4 times: evenly
        // spaced, they stood as a fish bone.)
        vb += 3.0 * iceValue(vec2(t.x / (6.0 * bsp), 4.0 + sd), seed + 227u);
        sa = vec4(vb / 4.0, 0.4 * abs(u), abs(t.y) / 0.6 + 17.0 * r5.x, 4.0);
        ss = seed + 221u + uint(j);
        sp = bsp;
        // (The barbs' lengths differ as much as the feather is fibrous there,
        // and their ends are soft: a smooth feather cut barb by barb stood as
        // a hand of fingers with hard outlines.)
        float bl = (sd == 0.0 ? 1.0 : 1.8) * mix(1.0, 0.4 + 1.4 * iceValue(vec2(0.7 * vb, 2.0), seed + 223u), fcl);
        prof = exp(-0.5 * (u - 1.1 * sd) * (u - 1.1 * sd) / 1.4) * (sd == 0.0 ? 1.0 : smoothstep(-0.9, 0.5, u * sd)) * (1.0 - smoothstep(0.4 * bl, 1.2 * bl, abs(u)));
        prof += 0.5 * exp(-0.5 * u * u / 0.02);
      } else {
        // The tail: strands that fan out with it, end one by one, curl,
        // braid, break and part (iceStrands), thinning as the tail widens.
        // A soft body round the strands (some 1.6 times as wide, faint):
        // the thin edge fades into the blue instead of ending as lines.
        prof = 0.8 * exp(-0.5 * u * u) + 0.2 * exp(-0.2 * u * u);
      }
      vec2 st = iceStrands(sa.x, sa.y, sa.z, sa.w, sp, ss, vs);
      float life = (0.65 + 0.35 * rj.w) * (feather ? 1.0 : st.y);
      float keep = 1.0 - smoothstep(0.45 * life, life, T);
      // The strands from the start: a tail is fine strands all along, a
      // dense head only a little softer.
      // (The strands are a texture on the body, as strong as the tail is
      // fibrous there: everywhere at their full strength (round 16), the
      // forms were crisp lines with blue between.)
      // (Fainter in the core, under half a width: a dense tail is a soft
      // bright body whose fibres show at its thin edges; as strong in the
      // core, its strands stood as a braided rope seen from below.)
      float fib = mix(1.0, st.x / 0.42, (0.3 + 0.55 * fcl) * (0.4 + 0.6 * smoothstep(0.3, 1.6, abs(u))));
      // Before the head the strands stick out each by its own way (the
      // front of a tuft is ragged, not round).
      float fr = iceValue(vec2(3.0 * u + 7.0 * rj.x, 1.5), seed + 115u);
      float ends = exp(-0.5 * t.z * t.z / (wd * wd * (0.15 + 2.5 * fr * fr)));
      float tail = (fan ? smoothstep(0.0, 0.12, T) : 1.0) * prof * edge * pow(w0 / wd, 0.5) * keep * fib * ends;
      // The head: the start of the tail, dense along its hook (a comma, not
      // a ball), and made of ragged tufts (noise at a third, an eighth and a
      // twentieth of its size, cut: knots with blue between and frayed
      // edges); a fan has none. A round head drew comets, a smooth one
      // tadpoles.
      float hd = 0.0;
      if (!fan && !feather && t.x < 4.0 * lh) {
        // (Gradient noise, each size turned: value noise, cut, stood as
        // blocks with straight edges along its lattice, seen from below.)
        vec2 hq = dl / rj0, gq, hr = mat2(0.8, 0.6, -0.6, 0.8) * hq;
        float lump = 0.55 * iceNoise(hq * 3.0 + 17.0 * r.xy, vec2(4096.0), 0.0, seed + 107u, gq) + 0.3 * iceNoise(hr * 8.0 + 5.0 * r.yx, vec2(4096.0), 0.0, seed + 109u, gq) + 0.15 * iceNoise(hq.yx * 20.0 + 3.0 * r.zw, vec2(4096.0), 0.0, seed + 113u, gq);
        float tuft = smoothstep(-0.08, 0.22, lump);
        // (The heads of the large systems are a quarter as lumpy: seen from
        // just under the deck, their knots stood as a cauliflower of puffs.)
        hd = (0.5 + 1.5 * r2.z) * exp(-0.5 * u * u - t.x / (0.4 * lh)) * ends * edge * mix(0.95, 0.15 + 2.0 * tuft * tuft, 1.0 - 0.75 * smoothstep(0.5, 1.2, head)) * mix(1.0, st.x / 0.42, 0.4 * fcl);
      }
      float val = str * far * inner * (tail + hd);
      sum += val;
      age += str * far * inner * tail * T;
      icePhase(val, vs, sp, 0.3 + 0.7 * fcl);
    }
  }
  return sum;
}

// Sheets and streets (G): old ice, spread by the shear into broad fibrous
// sheets and long streets. In the flow's frame (w): a body of noise (sheets
// of some 20 by 7 km; streets some 15 to 40 km long and 1 to 2.5 km wide,
// a few km apart; regions of 40 by 20 km have the one or the other) made of
// strands. The strands run their own way in each cell of 8.1 by 5.8 km (the
// region's way, from noise over some 15 to 30 km, up to some 0.5 rad off
// the flow, and up to 0.55 rad of the cell's own, less in a street), and
// curve; between cells the two ways blend, so that strands of different
// headings overlap and tangle. Drawn along the flow alone, long straight
// strands stood as a radial fan (a zoom blur) seen from below, and as
// straight spokes from near the deck. The body's edge breaks up along the
// strands. A faint trace (a streaky veil) lies under it all: the scene
// takes it off except near the top of the slider. Returns the ice, and in
// age the ice times its age.
float iceSheets(vec2 w, uint seed, out float age) {
  vec2 g, q = w / ICE_KM;
  float region = iceNoise(q * vec2(1.0, 2.0), vec2(1.0, 2.0), 0.0, seed + 1u, g);
  float sh = iceNoise(q * vec2(2.0, 6.0), vec2(2.0, 6.0), 0.0, seed + 2u, g) + 0.5 * iceNoise(q * vec2(4.0, 13.0), vec2(4.0, 13.0), 0.0, seed + 3u, g);
  float sn = iceNoise(q * vec2(1.0, 13.0), vec2(1.0, 13.0), 0.0, seed + 4u, g) + 0.3 * iceNoise(q * vec2(3.0, 31.0), vec2(3.0, 31.0), 0.0, seed + 10u, g);
  float run = smoothstep(-0.15, 0.25, iceNoise(q * vec2(3.0, 5.0), vec2(3.0, 5.0), 0.0, seed + 5u, g));
  float street = smoothstep(0.35, 0.9, 1.0 - 2.0 * abs(sn)) * run;
  float sheet = smoothstep(0.0, 0.45, sh);
  float env = mix(street, max(sheet, 0.5 * street), smoothstep(-0.25, 0.25, region));
  float thF = 0.8 * iceNoise(q * 2.0, vec2(2.0), 0.0, seed + 12u, g) + 0.4 * iceNoise(q * 5.0, vec2(5.0), 0.0, seed + 13u, g);
  float spread = 0.75 * (1.0 - 0.7 * street);
  // The strands of the four nearest cells, blended (smoothly, by the place
  // in the cell): each is noise of some 3 km by 0.2 km (strands, squared:
  // gaps between them) and 1.2 km by 75 m (threads; their mean where the
  // texels cannot hold them), in the cell's turned and bent frame.
  const vec2 CN = vec2(5.0, 7.0);
  vec2 C = ICE_KM / CN, cf = w / C - 0.5, c0 = floor(cf), fr = cf - c0;
  fr = fr * fr * (3.0 - 2.0 * fr);
  vec4 fs, vs, ws;
  float fib = 0.0;
  for (int k = 0; k < ICE_N(4); k++) {
    vec2 o = vec2(float(k & 1), float(k >> 1)), cell = c0 + o;
    vec2 wc = cell - CN * floor((cell + 0.5) / CN);
    vec4 r = iceRandom(iceWord(uvec3(uvec2(wc + 0.5), 30u), seed));
    float th = thF + spread * (r.x - 0.5);
    vec2 e = vec2(cos(th), sin(th)), d = w - (cell + 0.5) * C;
    float xl = dot(d, e), yl = dot(d, vec2(-e.y, e.x)) + (r.y - 0.5) * 0.08 * dot(d, e) * dot(d, e);
    float a1 = iceValue(vec2(xl / 3.0, yl / 0.2) + 31.0 * r.zw, seed + 40u);
    float a2 = iceValue(vec2(xl / 1.2, yl / 0.075) + 17.0 * r.wz, seed + 41u);
    // (A texture on the body, as strong as the sheet is fibrous there.)
    fs[k] = mix(1.0, (0.25 + 1.5 * a1 * a1 + 0.9 * mix(0.33, a2 * a2, iceFine(0.075, 2.5))) / 1.05, 0.25 + 0.55 * iceFc);
    vs[k] = yl / 0.2;
    ws[k] = mix(1.0 - fr.x, fr.x, o.x) * mix(1.0 - fr.y, fr.y, o.y);
    ws[k] *= ws[k] * ws[k];
  }
  // (The weights cubed, so that the cells blend over narrow zones: blended
  // evenly, two sets of strands at different angles crossed as a grid of
  // beads seen from near the deck.)
  float wsum = ws[0] + ws[1] + ws[2] + ws[3];
  for (int k = 0; k < ICE_N(4); k++) {
    ws[k] /= wsum;
    fib += ws[k] * fs[k];
  }
  // The body's edge breaks up along the strands.
  float dens = smoothstep(0.1, 0.7, env + 0.15 * (fib - 1.0)) * smoothstep(0.0, 0.3, env);
  float thick = 0.4 + 1.2 * smoothstep(-0.5, 0.5, iceNoise(q * vec2(6.0, 18.0), vec2(6.0, 18.0), 0.0, seed + 11u, g));
  float sc = 0.12 * dens * thick + 0.012;
  float val = sc * fib;
  age = val * (0.35 + 0.35 * env);
  // A sheet's strands are less clear than a tail's: its phasor is half
  // cancelled (a second, weaker one half a turn off), so that its hairs are
  // faint (ciHair fades them with the phasor's length). Drawn in full, from
  // under the shell, the long straight strands of two decks crossed as a
  // net of scratches.
  for (int k = 0; k < ICE_N(4); k++) {
    float vk = sc * ws[k] * fs[k];
    icePhase(vk, vs[k], 0.2, 0.3 + 0.7 * iceFc);
    icePhase(0.55 * vk, vs[k] + 0.5, 0.2, 0.3 + 0.7 * iceFc);
  }
  return val;
}

// Erosion: noise at some 1.35 by 0.27 km and 0.58 by 0.12 km, drawn out
// along the flow, for eating the thin edges of the ice (see iceField).
float iceErode(vec2 w, uint seed) {
  vec2 g, q = w / ICE_KM;
  return iceNoise(q * vec2(30.0, 150.0), vec2(30.0, 150.0), 0.0, seed, g) + 0.5 * iceNoise(q * vec2(70.0, 350.0), vec2(70.0, 350.0), 0.0, seed + 1u, g);
}

// The four fields of ice at x (km in the tile), all in one flow.
const float ICE_STORE = 1.0;   // the ice stored: sqrt(x / ICE_STORE)
// ages: the four fields weighed by the age of their ice (in units of a
// life), for its mean age (see iceWay).
vec4 iceField(vec2 x, uint seed, out vec4 ages) {
  vec2 wf = iceFlowFrame(x, seed + 1u), w = iceTurb(wf, seed + 2u);
  vec4 f;
  iceFc = iceFibrous(w, seed + 5u);
  iceKind = 1.0;
  // (The sheets and streets are stirred by 0.3: long calm bands, as at
  // dusk in photographs.)
  f.y = iceSheets(mix(wf, w, 0.3), seed + 200u, ages.y);
  // The systems: tails (R), flocks (B) and large systems (A), in one loop
  // (each call of iceSystems is a copy for the compiler, which the page's
  // first picture waited for). The large systems are stirred less, and
  // thinner: from just under the deck, their wide plumes stirred in full
  // stood as folded, marbled curtains, and as opaque white masses where
  // photographs show translucent streaky sheets.
  for (int i = 0; i < ICE_N(3); i++) {
    float A = float(i == 2);
    iceKind = i == 0 ? 1.0 : i == 1 ? 0.5 : 2.5;
    float ag, v = (1.0 - 0.2 * A) * iceSystems(mix(w, wf, 0.7 * A),
      i == 0 ? vec2(3.0, 4.0) : i == 1 ? vec2(12.0) : vec2(2.0, 3.0),
      i == 0 ? vec2(4.0, 24.0) : i == 1 ? vec2(0.3, 3.0) : vec2(10.0, 36.0),
      i == 0 ? vec2(0.045, 0.12) : i == 1 ? vec2(0.1, 0.3) : vec2(0.07, 0.2),
      i == 0 ? 0.5 : i == 1 ? 0.12 : 1.2, i == 0 ? 3.0 : i == 1 ? 1.0 : 4.0, i == 0 ? 0.45 : i == 1 ? 0.3 : 0.4,
      i == 0 ? vec2(-0.25, 0.3) : i == 1 ? vec2(0.15, 0.45) : vec2(-0.3, 0.2), i == 0 ? 0.06 : 0.0,
      seed + (i == 0 ? 100u : i == 1 ? 300u : 400u), ag);
    ag *= 1.0 - 0.2 * A;
    if (i == 0) { f.x = v; ages.x = ag; }
    else if (i == 1) { f.z = v; ages.z = ag; }
    else { f.w = v; ages.w = ag; }
  }
  // The thin ice is eaten by fine noise (the denser, the less), so that
  // edges are ragged and blue shows through them at every scale.
  float e = iceErode(w, seed + 3u);
  // (Softly: eaten hard, the thin ice ended in streaks with blue between.)
  vec4 keep = smoothstep(vec4(-0.75), vec4(0.25), 0.7 * e + 5.0 * f);
  ages *= keep;
  return f * keep;
}

// ---------- The cirrus's map ----------
// Where the cirrus is and of what kind, over the map (WEATHER_KM, 1 km a
// texel): R and G, how much there is for the upper and the lower deck
// (patches of some 85 and 35 km, and bands along the wind of 40 by 8 km
// and 27 by 5 km); B, the share of sheets; A, the share of flocks against
// the large systems (both over some 100 km). The bands run in the cirrus's
// frame (along (3, 1), across (-1, 3)), with whole numbers, so that the
// map repeats.
vec4 ciMap(vec2 uv) {
  vec2 g, c = vec2(dot(uv, vec2(3.0, 1.0)), dot(uv, vec2(-1.0, 3.0)));
  vec2 w;
  for (int k = 0; k < ICE_N(2); k++) {
    uint s = 400u + 10u * uint(k);
    vec2 o = k == 0 ? vec2(0.0) : vec2(0.383, 0.617);
    float patches = iceNoise((uv + o) * 3.0, vec2(3.0), 0.0, s, g) + 0.5 * iceNoise((uv + o) * 7.0, vec2(7.0), 0.0, s + 1u, g);
    float bands = iceNoise(c * vec2(2.0, 10.0), vec2(2.0, 10.0), 0.0, s + 2u, g)
                + 0.5 * iceNoise(c * vec2(3.0, 16.0), vec2(3.0, 16.0), 0.0, s + 3u, g);
    w[k] = 0.5 + 0.9 * patches + 0.6 * bands;
  }
  float rows = iceNoise(uv * 2.0, vec2(2.0), 0.0, 421u, g) + 0.5 * iceNoise(uv * 5.0, vec2(5.0), 0.0, 422u, g);
  float flocks = iceNoise(uv * 3.0, vec2(3.0), 0.0, 431u, g) + 0.5 * iceNoise(uv * 6.0, vec2(6.0), 0.0, 432u, g);
  return clamp(vec4(w, 0.5 + 0.9 * rows, 0.5 + 0.9 * flocks), 0.0, 1.0);
}

// The ice, read back to find the way its fibres run (uZ = -4), and its age.
uniform sampler2D uIceIn;
uniform sampler2D uAgeIn;

// The ice's four fields summed at texel n of the 5 x 5 round uv.
float iceSum(vec2 uv, int n, float lod) {
  return dot(textureLod(uIceIn, uv + (vec2(n % 5, n / 5) - 2.0) / uSize, lod), vec4(1.0));
}

// The way the ice's fibres run at uv: the structure tensor of the ice (its
// four fields together; the mean of its gradient times itself over 3 x 3
// texels of this texture, from the ice at the same size), as
// (Jxx - Jyy, 2 Jxy) over its trace. That is the gradient's direction at
// twice its angle, so that a gradient and its opposite add up and the mean
// over a footprint (the mipmaps) is the way most of it runs, with a length
// below 1 where it runs many ways. The fibres run across it.
vec4 iceWay(vec2 uv) {
  float lod = log2(float(textureSize(uIceIn, 0).x) / uSize.x);
  vec3 j = vec3(0.0);
  // (The neighbours are read where they are needed, not kept in an array:
  // see ICE_N.)
  for (int i = 0; i < ICE_N(9); i++) {
    int x = i % 3 + 1, y = i / 3 + 1, c = y * 5 + x;
    float w = (x == 2 ? 2.0 : 1.0) * (y == 2 ? 2.0 : 1.0);
    float gx = 0.5 * (iceSum(uv, c + 1, lod) - iceSum(uv, c - 1, lod)), gy = 0.5 * (iceSum(uv, c + 5, lod) - iceSum(uv, c - 5, lod));
    j += w * vec3(gx * gx, gy * gy, gx * gy);
  }
  // And the mean age of the ice here, over this texel (see iceAge).
  return vec4(0.5 + 0.5 * vec2(j.x - j.y, 2.0 * j.z) / (j.x + j.y + 1e-4), textureLod(uAgeIn, uv, lod).rg);
}

// The mean age of the ice (its four kinds weighed as the scene mostly
// mixes them), from the sums iceField made: the ice falls as it ages, so
// its age says how deep in its deck it lies. Stored with its weight (G, how
// much ice; R, G times the age), so that the mipmaps average it where
// there is ice.
vec4 iceAge(vec4 f, vec4 ag) {
  const vec4 W = vec4(1.0, 1.0, 0.5, 1.0);
  float tot = dot(f, W), w = tot / (tot + 0.02);
  return vec4(w * clamp(dot(ag, W) / max(tot, 1e-6), 0.0, 1.0), w, 0.0, 1.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  if (uZ < -3.5) {
    outColor = iceWay(uv);
  } else if (uZ < -2.5) {
    vec4 ag, f = iceField(uv * ICE_KM, 1000u, ag);
    outColor = sqrt(clamp(f / ICE_STORE, 0.0, 1.0));
    outAge = iceAge(f, ag);
    outPhase = vec4(icePh.z > 1e-6 ? 0.5 + 0.5 * icePh.xy / icePh.z : vec2(0.5), 0.0, 1.0);
  } else {
    outColor = ciMap(uv);
  }
}
</script>

<script id="waves" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// Draws the map of the waves on the sea once, at start: many plane waves,
// each a whole number of times across the map, so that it repeats.
// R, G: the slope along x and z, in units of its rms (0.125 per unit, flat
// at 0.5). B: the slope squared, over 8: averaged over a footprint, it
// tells how much slope the averaged R and G have lost. A: streaks along
// the wind.
uniform float uSize;
out vec4 outColor;

const float TAU = 6.28318530718;
const float WIND = 0.4636;          // the wind blows towards (2, 1)

// The integer hash of the noise shader (lowbias32).
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for wave i, from one hash, as for a cell
// of the noise.
vec3 rnd(int i) {
  uint h = ihash(uint(i) + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  // Wind waves: 10 to 64 crests across the map, with the same slope in
  // every octave (a sea in equilibrium). They run within some 70 degrees
  // of the wind, short-crested; the long ones keep closer to it.
  const int N = 96;
  vec2 s = vec2(0.0);
  for (int i = 0; i < N; i++) {
    vec3 r = rnd(i), q = rnd(i + 5000);
    float f = (float(i) + r.x) / float(N);
    float a = WIND + mix(1.1, 1.6, f) * (r.y + r.z - 1.0);
    vec2 m = round(10.0 * pow(6.4, f) * vec2(cos(a), sin(a)));
    s += normalize(m) * cos(TAU * (dot(m, uv) + q.x));
  }
  s *= sqrt(2.0 / float(N));
  // Streaks: 6 to 40 across the wind, and about twice as long along it.
  const int M = 40;
  float w = 0.0;
  for (int i = 0; i < M; i++) {
    vec3 r = rnd(i + 9000);
    float k = 6.0 * pow(7.0, r.x);
    float a = WIND + 0.25 * TAU + 0.7 * (r.y + r.z - 1.0);
    w += cos(TAU * (dot(round(k * vec2(cos(a), sin(a))), uv) + fract(61.0 * r.x + r.y))) / sqrt(k);
  }
  outColor = vec4(0.5 + 0.125 * s, dot(s, s) / 8.0, 0.5 + 0.165 * w);
}
</script>

<script id="fs" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler2D;
precision highp sampler3D;
precision highp sampler2DArray;
precision highp int;
// The quality level's knobs (QUALITY in the JS defines them for the lower
// levels; these defaults are max's, the picture as it was before levels).
#ifndef Q_NV
#define Q_NV 20           // view samples of the air (NV)
#endif
#ifndef Q_NSHADE
#define Q_NSHADE 8        // and in the planet's shadow (NSHADE)...
#endif
#ifndef Q_NFAR
#define Q_NFAR 16         // ...and in the lit air beyond it (NFAR)
#endif
#ifndef Q_MARCH
#define Q_MARCH 1.0       // the low clouds' steps, times their length at max
#endif
#ifndef Q_SHAFTS
#define Q_SHAFTS 16       // samples of the clouds' shadow along a view ray (SHAFTS)
#endif
#ifndef Q_SHADOW_TAPS
#define Q_SHADOW_TAPS 8   // reads of the shadow map per pixel of sea (SHADOW_TAPS)
#endif
#ifndef Q_CI_STEPS
#define Q_CI_STEPS 12     // steps of the cirrus's march near the eye (CI_STEPS)
#endif
#ifndef Q_PASS
#define Q_PASS 1.0        // the passes before the scene (the low clouds', the cirrus's) draw a pixel for Q_PASS by Q_PASS of the frame's
#endif
#ifndef Q_FRAME
#define Q_FRAME 1.0       // the frame's width over the picture's (a level's `frame`): the detail is read for the picture's pixels
#endif
#ifndef Q_CI_PASS
#define Q_CI_PASS Q_PASS  // the cirrus's pass alone: a pixel for Q_CI_PASS by Q_CI_PASS of the frame's
#endif
#ifndef Q_SKY_NS
#define Q_SKY_NS 8        // samples of the air in the sky the sea mirrors (skyAt)
#endif
#ifndef Q_MIRROR
#define Q_MIRROR 4        // the clouds the sea mirrors: 4 directions a pixel, or 1 drawn among them (see addSea)
#endif
#ifndef Q_LITE
