// The depths of depthToTop hang only on the height of p and the angle of d
// to the vertical. They are read from a table, a sum of 16 steps made once
// in JS: one filtered read instead of a march. Its axes, as
// in Bruneton (2017): the distance to the top between its least and its
// most at that height, and the distance to the horizon. They keep the
// table smooth near the horizon.
const int DEPTH_MU = 512, DEPTH_R = 128;
const vec2 AIR_TABLES = vec2(DEPTH_MU, 12 * NH + DEPTH_R);
const float H_TOP = 1132.2544;  // distance from the ground to the top, along the horizon: sqrt(RT^2 - RG^2)

// Optical depth (per species) from p to the top of the atmosphere.
vec3 depthToTop(vec3 p, vec3 d) {
  float r = length(p);
  float rho = sqrt(max((r - RG) * (r + RG), 0.0));
  float lo = RT - r, hi = rho + H_TOP;
  vec2 x = vec2(clamp((raySphere(p, d, RT).y - lo) / (hi - lo), 0.0, 1.0), clamp(rho / H_TOP, 0.0, 1.0));
  const vec2 N = vec2(DEPTH_MU, DEPTH_R);
  return textureLod(uMS, (x * (N - 1.0) + vec2(0.5, 0.5 + float(12 * NH))) / AIR_TABLES, 0.0).rgb;
}

// Bilinear lookup of the multiple-scattering table: the groups from `first`.
void msTable(float h, float mus, int first, out vec4 ms[3]) {
  float x = clamp((mus - MS_MU_MIN) / (1.0 - MS_MU_MIN), 0.0, 1.0) * float(NMU - 1);
  float y = sqrt(clamp(h / (RT - RG), 0.0, 1.0)) * float(NH - 1);
  // It is read through the GPU's filter (see the table of depths). The
  // groups lie one above the other: a read within one never reaches the
  // next.
  for (int k = 0; k < 3; k++) {
    ms[k] = textureLod(uMS, (vec2(x, y + float((first + k) * NH)) + 0.5) / AIR_TABLES, 0.0);
  }
}
// The light scattered many times that reaches a point of the air.
void multiScatter(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 0, ms); }
// The light of the sky on the low clouds there (see buildMultiScatter).
void cloudSky(float h, float mus, out vec4 ms[3]) { msTable(h, mus, 3, ms); }
// Where that light comes from: its mean over the sphere times the
// direction it comes from, towards the sun's side (lh) and up (lv).
void msLean(float h, float mus, out vec4 lh[3], out vec4 lv[3]) { msTable(h, mus, 6, lh); msTable(h, mus, 9, lv); }

// hash13 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash3(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// The catalogue cell that holds direction c.
ivec2 starCell(vec3 c) {
  vec3 p = c / (abs(c.x) + abs(c.y) + abs(c.z));
  vec2 uv = p.z >= 0.0 ? p.xy
    : (1.0 - abs(p.yx)) * vec2(p.x >= 0.0 ? 1.0 : -1.0, p.y >= 0.0 ? 1.0 : -1.0);
  return ivec2(clamp(floor((uv * 0.5 + 0.5) * float(GRID)), 0.0, float(GRID - 1)));
}

// The band of the Milky Way, relative to the airglow: a noise pattern, not
// the real clouds, but on the real galactic plane and brighter at its centre.
float milkyWay(vec3 c) {
  const vec3 POLE = vec3(-0.8676, -0.1981, 0.4560);      // north galactic pole
  const vec3 CENTRE = vec3(-0.0550, -0.8734, -0.4839);   // galactic centre
  float b = dot(c, POLE);
  float near = 0.5 + 0.5 * dot(c, CENTRE);
  float clouds = 0.5 * noise3(c * 5.0) + 0.3 * noise3(c * 11.0) + 0.2 * noise3(c * 23.0);
  return (0.8 + 3.0 * near * near) * exp(-b * b / (0.02 + 0.03 * near)) * (0.25 + 1.5 * clouds * clouds);
}

// The zodiacal light: sunlight scattered by the dust between the planets,
// in S10 (stars of the 10th magnitude per square degree), from x, the cosine
// of the angle from the sun, and y, the sine of the ecliptic latitude. A fit
// to the table of Leinert et al. (1998, "The 1997 reference of diffuse night
// sky brightness", A&AS 127, 1, Table 16: from the Earth, at 500 nm), within
// 4.5 % rms and 13 % at most of its 182 values and the pole's 60: a cone that
// falls off as the power -2.46 of the angle from the sun, flattened towards
// the ecliptic as seen around the sun (x of the result), over a floor and
// the gegenschein (some 13 degrees across) on a wider glow at the point
// opposite the sun (y). And for the cone as it is drawn (see main), a
// look: z, its brightness along the ecliptic at this
// angle from the sun, and w, its shape across: a band of half width
// ZODI_BAND (to 1/e), 20 degrees at 15 degrees from the sun, narrowing
// fastest near the sun towards 2 (15 at 24 degrees, 9 at 50, 4 at 80),
// with a skirt twice as wide. The fit widens with the
// angle from the sun (it is flattened by the same ratio at every angle):
// drawn as it is, the cone spread into a fan and read as a soft glow on
// the horizon, where the eye sees a cone, widest and brightest at its
// base, whose sides close in all the way to its tip (Trouvelot's drawing
// of 1876; reports from dark sites).
vec4 zodiacal(float x, float y) {
  float e = max(acos(clamp(x, -1.0, 1.0)), 0.035);  // from the sun, radians (at least 2 degrees)
  float s = min(abs(y) * inversesqrt(max(1.0 - x * x * step(0.0, x), 1e-6)), 1.0);   // 0 on the ecliptic, 1 square to it
  float across = 0.252 + 0.748 * exp(-pow(s / 0.419, 1.34));
  float cone = 345.0 * pow(e, -2.46);
  float b = degrees(asin(min(abs(y), 1.0))) / (ZODI_BAND.y + (ZODI_BAND.x - ZODI_BAND.y) * exp(-max(degrees(e) - 15.0, 0.0) / 30.0));
  return vec4(cone * across,
              78.6 * across + 19.3 * exp(-(1.0 + x) / 0.01) + 62.3 * exp(-(1.0 + x) / 0.511),
              cone, 0.85 * exp(-b * b) + 0.15 * exp(-0.25 * b * b));
}

float cornetteShanks(float g, float mu) {
  return 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}
// The boundary layer's sharp lobe (see MIE_PHASE), its share of the light
// in.
float sharpLobe(float mu) { return MIE_PHASE.x * cornetteShanks(MIE_PHASE.y, mu); }
// The air's, the boundary layer's and the higher aerosol's; broad: without
// that sharp lobe (the air's table keeps its light apart, see Q_AIR_LUT).
vec3 phases(float mu, bool broad) {
  return vec3(3.0 / (16.0 * PI) * (1.0 + mu * mu),
              (1.0 - MIE_PHASE.x) * cornetteShanks(MIE_PHASE.z, mu) + (broad ? 0.0 : sharpLobe(mu)),
              cornetteShanks(MIE_G_UP, mu));
}
vec3 phases(float mu) { return phases(mu, false); }

#ifdef AIR_LUT
// The light scattered once that addLight has added while onceOn (from the
// light whose shadows the clouds' map holds: the part they take): the air's
// table keeps it (see Q_AIR_LUT).
vec4 lightOnce[3] = vec4[3](vec4(0.0), vec4(0.0), vec4(0.0));
bool onceOn = false;
#endif
// Light from one source (sun or moon) scattered towards the eye at p:
// scattered once (times `direct`: less in the shadow of a cloud), plus what
// was already scattered (the table).
void addLight(vec3 p, float r, float h, vec3 od, vec4 dens, float scM, float extM,
              vec3 dir, float gain, float direct, float sky, vec3 phase, vec3 view, in vec4 Tv[3], inout vec4 L[3]) {
  vec4 ms[3], lh[3], lv[3];
  float mus = dot(p, dir) / r;
  multiScatter(h, mus, ms);
  msLean(h, mus, lh, lv);
  // The aerosol scatters that light forwards: more of it towards a view
  // that looks where it comes from (MIE_LEAN). Only the forward part: the
  // first moment taken from the view away from it as well left that sky
  // 0.65 of the reference's.
  vec3 up = p / r, side = dir - mus * up;
  float sl = length(side);
  float cv = dot(view, up), ch = sl > 1e-5 ? dot(view, side) / sl : 0.0;
  bool lit = raySphere(p, dir, RG).y < 0.0;          // not behind the planet
  vec3 odl = lit ? od + depthToTop(p, dir) : vec3(0.0);
  for (int k = 0; k < 3; k++) {
    vec4 sc = uBR[k] * dens.x, sm = scM * uMA[k];
    vec4 a = Tv[k] * ((sc + sm) * ms[k] + sm * MIE_LEAN * max(ch * lh[k] + cv * lv[k], 0.0)) * sky;
    if (lit) {
      vec4 once = direct * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z)) * (sc * phase.x + sm * mix(phase.z, phase.y, dens.w));
      a += once;
#ifdef AIR_LUT
      if (onceOn) lightOnce[k] += gain * once;
#endif
    }
    L[k] += gain * a;
  }
}
#ifdef AIR_LUT
// The light of the boundary layer's sharp lobe from dir, scattered once at
// p towards the eye, without its phase (sharpLobe): the part of addLight's
// once that the air's table keeps apart (see Q_AIR_LUT).
void addSharp(vec3 p, vec3 od, vec4 dens, float scM, float extM, vec3 dir, float gain, inout vec4 S[3]) {
  if (raySphere(p, dir, RG).y >= 0.0) return;          // behind the planet
  vec3 odl = od + depthToTop(p, dir);
  for (int k = 0; k < 3; k++) S[k] += gain * scM * dens.w * uMA[k] * exp(-(uBR[k] * odl.x + extM * uMA[k] * odl.y + uBO[k] * odl.z));
}
#endif

#if Q_AIR_LUT || defined(AIR_LUT)
// ---------- The air's light as a table (Q_AIR_LUT) ----------
// At the levels with a table, the scene marches the air of each pixel no
// more: the light the air scatters
// towards the eye and its optical depth are made ahead, for the view rays of
// LUT_AZ by LUT_EL directions round the eye and LUT_S distances along each
// (AIR_LUT, a program of fs of its own), as Hillaire (2020) makes his
// sky-view and aerial-perspective tables, and the scene reads them where
// each layer and the end of its ray lie. Directions: the azimuth from the
// sun's, squeezed towards it (the glow), and the elevation from the
// horizon, squeezed towards it (the horizon at v = LUT_VH). Distances: from
// LUT_T0 to LUT_T1, evenly in their log. Five more slices hold the sky as
// the sea sees it (from its surface, the whole way: skyAt), round LUT_SEA,
// and one the whole ray, to the sea or out of the air (LUT_END). The sea's
// five are for places on the sea where the light stands higher or lower
// than over the eye's (lutSeaSpan): the sea seen from 40 km reaches 700
// km, 6 degrees round the Earth, and one slice made under the eye, at the
// light's height there, left the sea towards a setting sun mirroring a sky
// too dark (from 40 km, 2 to 7 degrees below the horizon, 8 levels darker
// than a march of many samples). All in one 3D texture: thirteen parts of
// its depth, LUT_S + 6 slices each (LUT_N), hold the
// three vec4 of the light (0 to 2), the depth (3), the three vec4 of the
// part of the light scattered once that the clouds' shadows take (4 to 6),
// and three vec4 each of the light of the boundary layer's sharp lobe from
// the sun (7 to 9) and from the moon (10 to 12); and two spare layers at
// its end, which nothing reads (see LUT_DRAWS). (Parts along the depth, not
// side by side in its width: AIR_LUT draws straight into the slices, each a
// layer, where a part beside another had to be drawn apart and copied in,
// 462 copies a table that took Direct3D 11 some 2 s.)
// That lobe's light is kept without its phase (sharpLobe), which the scene
// applies for each pixel: it is some 4 degrees wide round the light, where
// the table's texels lie 1 to 3 degrees apart high in the sky, too far
// apart for its peak. (Before, the scene marched the air within 8 degrees
// of the sun and the moon: a second way through the air, which Direct3D 11
// took 1.5 s longer to compile.) The rest of the light, with the broad
// lobes and the air's phase, is the table's.
// The light is divided by uLutScale (the light of the air the stronger of
// the sun and the moon makes) to keep half floats' range by night.
// The sizes are the level's (`airLut` in QUALITY).
const float LUT_AZ = float(Q_LUT_AZ), LUT_EL = float(Q_LUT_EL), LUT_S = float(Q_LUT_S), LUT_T0 = 0.05, LUT_T1 = 1200.0;
const float LUT_SEA = LUT_S + 2.0, LUT_END = LUT_S + 5.0, LUT_N = LUT_S + 6.0, LUT_PARTS = 13.0, LUT_SEA_ALT = 0.002;
// The light's height over the sea at the sea's slices LUT_SEA - 2 to + 2,
// in steps of lutSeaSpan, against over the eye: a half of the angle to the
// farthest sea seen.
float lutSeaSpan() { return 0.5 * max(acos(clamp(RG / (RG + uAlt), 0.0, 1.0)), 1e-3); }
uniform float uLutScale;
// The stronger light (the sun's or the moon's direction), which the
// azimuth is measured from: the table's seam, behind it, then lies where its
// light is the same on either side (from the sun's, the moonlit sky stepped
// there).
uniform vec3 uLutLight;
// The light's way along the ground at a place whose up is `up`, and the way across it.
void lutAxes(vec3 up, out vec3 sh, out vec3 side) {
  sh = uLutLight - up * dot(uLutLight, up);
  sh = dot(sh, sh) > 1e-8 ? normalize(sh) : normalize(cross(up, vec3(0.0, 0.0, 1.0)));
  side = cross(up, sh);
}
// The horizon's elevation (radians, negative) at a height of alt km.
float lutHorizon(float alt) { return -acos(clamp(RG / (RG + max(alt, 0.0)), 0.0, 1.0)); }
// Above the horizon, v's share of the rows above it for x, the
// elevation's share of the way from the horizon to the zenith: its square
// root (dense near the horizon), and from above 1.6 km more rows where the
// rays graze the boundary layer's top (BL.x): along such a ray the haze
// ends within some 0.6 km of height, and the ray's depth and light change
// several times over within a degree. With the square root alone a row
// spanned 0.8 km of that height at 4 km, 1.5 km at 11 km: the table mixed
// rays on either side of the top, and the sky at the horizon in twilight
// showed a band, the lower edge of a setting sun a red row (its depth from
// the table some 50 % too deep in the haze). An arctangent step adds some
// 5 rows there (LUT_WARP); a twelfth of the rows comes from below the
// horizon, where the sky changes slowly but near the horizon (LUT_VH: the
// horizon at 5/12 of the rows, not half).
const float LUT_VH = floor(LUT_EL * 5.0 / 12.0 + 0.5) / LUT_EL, LUT_WARP = 0.05;
float lutWarp(float x, float alt) {
  float c = LUT_WARP * smoothstep(1.6, 2.6, alt);
  float r0 = RG + alt, hor = lutHorizon(alt), span = 0.5 * PI - hor;
  float el0 = -acos(min((RG + BL.x) / r0, 1.0));     // the ray that grazes the top
  float x0 = (el0 - hor) / span, w = 0.6 / (r0 * max(sin(-el0), 1e-3) * span);
  return (sqrt(x) + c * (atan((x - x0) / w) - atan(-x0 / w))) / (1.0 + c * (atan((1.0 - x0) / w) - atan(-x0 / w)));
}
vec2 lutUV(vec3 d, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float phi = atan(dot(d, side), dot(d, sh));
  float el = asin(clamp(dot(d, up), -1.0, 1.0)), hor = lutHorizon(alt);
  float v = el >= hor ? LUT_VH + (1.0 - LUT_VH) * lutWarp((el - hor) / (0.5 * PI - hor), alt) : LUT_VH * (1.0 - sqrt((hor - el) / (hor + 0.5 * PI)));
  return vec2(0.5 + 0.5 * sign(phi) * sqrt(abs(phi) / PI), v);
}
vec3 lutDir(vec2 uv, vec3 up, float alt) {
  vec3 sh, side;
  lutAxes(up, sh, side);
  float s = uv.x - 0.5, hor = lutHorizon(alt);
  float phi = PI * sign(s) * 4.0 * s * s;
  float q = 1.0 - uv.y / LUT_VH, el = hor - (hor + 0.5 * PI) * q * q;
  if (uv.y >= LUT_VH) {
    // (lutWarp turned back, by halving.)
    float lo = 0.0, hi = 1.0, t = (uv.y - LUT_VH) / (1.0 - LUT_VH);
    for (int i = 0; i < 24; i++) {
      float m = 0.5 * (lo + hi);
      if (lutWarp(m, alt) < t) lo = m; else hi = m;
    }
    el = hor + (0.5 * PI - hor) * 0.5 * (lo + hi);
  }
  return cos(el) * (cos(phi) * sh + sin(phi) * side) + sin(el) * up;
}
#endif
#if Q_AIR_LUT
uniform highp sampler3D uAirLut;
// The air's light and depth along the direction at uv in slice z (between
// two slices, a mix of them), times f; sh: the sharp lobe's phase towards
// the sun and the moon there (sharpLobe). once: the light only, part 4 (the
// part scattered once) and the sharp lobe's of the light the clouds' map
// is of; else part 0, the sharp lobe's of both, and the depth.
void airSlice(vec2 uv, float z, float f, bool once, vec2 sh, out vec4 La[3], out vec3 oda) {
  // (Between two slices of a part, the filter mixes them; the end slices
  // are read at their centres, so a part never mixes with the next.)
  vec2 xy = vec2(clamp(uv.x, 0.5 / LUT_AZ, 1.0 - 0.5 / LUT_AZ), uv.y);
  const float N = LUT_N;
  bool moonMap = once && dot(uLight, uSun) < 0.999;
  float z0 = once ? 4.0 : 0.0, zs = moonMap ? 10.0 : 7.0, ws = moonMap ? sh.y : sh.x;
  for (int k = 0; k < 3; k++) {
    vec4 l = textureLod(uAirLut, vec3(xy, ((z0 + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0)
           + ws * textureLod(uAirLut, vec3(xy, ((zs + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0);
    if (!once) l += sh.y * textureLod(uAirLut, vec3(xy, ((10.0 + float(k)) * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0);
    La[k] = f * uLutScale * l;
  }
  oda = once ? vec3(0.0) : f * textureLod(uAirLut, vec3(xy, (3.0 * N + z + 0.5) / (LUT_PARTS * N + 2.0)), 0.0).xyz;
}
// The slice and the factor that airSlice reads the air from the eye to t
// km with: between the slices on either side, linearly in t (a little
// nearer the march than mixed evenly in log t). (Each read of the table in
// the scene is one airSlice: Direct3D 11 compiles every call apart, and
// the scene took longer to compile.)
vec2 lutZ(float t) {
  float f = 1.0;
  if (t < LUT_T0) { f = max(t, 0.0) / LUT_T0; t = LUT_T0; }
  float q = clamp(log(t / LUT_T0) / log(LUT_T1 / LUT_T0), 0.0, 1.0) * (LUT_S - 1.0);
  float i = min(floor(q), LUT_S - 2.0);
  float ti = LUT_T0 * pow(LUT_T1 / LUT_T0, i / (LUT_S - 1.0)), tj = LUT_T0 * pow(LUT_T1 / LUT_T0, (i + 1.0) / (LUT_S - 1.0));
  return vec2(i + clamp((t - ti) / (tj - ti), 0.0, 1.0), f);
}
#endif

// The planet's shadow along the view ray o + t d (t from 0 to tmax), for
// light from s: the shadow of a sphere in parallel light is a cylinder of
// radius RG behind it. True, with the span [sa, sb], when the ray passes
// through it; else sa and sb are left as they were. In twilight the march spends samples of their own on the span
// and on the lit air beyond: the light scattered once there rises steeply
// from the shadow's edge, and 20 samples spread over the whole ray left
// layers of colour that came and went with the angle.
bool shadowSpan(vec3 o, vec3 d, float tmax, vec3 s, inout float sa, inout float sb) {
  float ds = dot(d, s), os = dot(o, s);
  vec3 a = d - ds * s, b = o - os * s;
  float A = dot(a, a), B = dot(a, b), C = dot(b, b) - RG * RG;
  float D = B * B - A * C;
  if (A < 1e-12 || D <= 0.0) return false;
  D = sqrt(D);
  float t0 = (-B - D) / A, t1 = (-B + D) / A;
  // Only the half away from the light is in the shadow (os + ds t < 0).
  // (Cut by the chord's middle, the whole chord counted where its middle
  // lay behind the planet: by day the eye is inside the cylinder, and every
  // ray above a curve through the sun was marched as if it crossed the
  // shadow, in 8 samples instead of 20, a step of 1 % across the sky.)
  if (ds > 0.0) t1 = min(t1, -os / ds);
  else if (ds < 0.0) t0 = max(t0, -os / ds);
  else if (os >= 0.0) return false;
  t0 = max(t0, 0.0);
  t1 = min(t1, tmax);
  if (t1 <= t0) return false;
  sa = t0;
  sb = t1;
  return true;
}

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// After Jimenez (2014), "Next Generation Post Processing in Call of Duty: Advanced Warfare".
// Interleaved gradient noise: spreads the start of a march evenly over
// neighbouring pixels.
float ign(vec2 p) {
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

// The view from the aircraft: clouds below and a sea under them.

// raySphere for a ray from the eye (o, at height uAlt) and the sphere at
// height h, without its rounding. raySphere takes dot(o, o) - r * r, and at
// 6372 km a float steps by 4 km²; from an eye at the sphere's own height
// (the slider stops on the thin cloud's 12.2, 12.5 and 12.8 km) the
// crossing next to the eye then came out a hair ahead or behind it, as
// each ray's angle rounded. From the base of the thin cloud, rings of rays
// (and a disc under the eye, where dot(o, d) passes a power of two) saw
// through the whole sheet down to the sea, as lit bands. Here c comes from
// the heights, and the near crossing from the far one (their product is c).
vec2 eyeSphere(vec3 o, vec3 d, float h) {
  float b = dot(o, d);
  float c = (uAlt - h) * (2.0 * RG + uAlt + h);
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  float q = b < 0.0 ? sqrt(D) - b : -b - sqrt(D);   // the crossing farther from the eye
  if (q == 0.0) return vec2(0.0);
  return b < 0.0 ? vec2(c / q, q) : vec2(q, c / q);
}

// ---------- Clouds ----------
// A shell from CB to CT holds them. A field says where they are: a density
// (see cloudShape), positive inside a cloud and negative outside.
const float CB = 0.6;               // cloud base, km
const float CT = 5.0;               // the highest tops, km
const float WEATHER_KM = 256.0;     // size of the weather map
const float BASE_KM = 8.0;          // size of one tile of the noise
const float TEXEL_KM = BASE_KM / 128.0;
const float DETAIL = 7.0;           // tiles of the fine noise per tile (whole numbers: see uDrift)
const float SIGMA = 90.0;           // extinction inside a dense cloud, per km
const int CLOUD_STEPS = int(400.0 / Q_MARCH);
// The long marches (the clouds, the air, the sky over the sea) run to
// bounds the compiler cannot know (uRes is never negative), so that it
// keeps them as loops: Direct3D's compiler (ANGLE on Windows) may unroll a
// loop of constant bounds, which makes the program far longer to compile.
#define LONG_N(n) ((n) + int(min(uRes.x, 0.0)))
const float LIGHT_MIN = 0.015;       // the first step towards the light, at least (km)
// The light in a cloud (see clouds), fitted once to a Monte Carlo of
// spheres 50 m to 2 km in radius (extinction 90 per km, Henyey-Greenstein
// g = 0.85; see design.md). The sun's light scattered many times: a lobe
// (MS1: gain, its g, how fast it fades with the depth towards the light)
// that builds up with the cloud behind the place (MS_UP: what it keeps with
// none), and light that went into the whole mass (MSD: gain, K of
// (c + K tauB) / (1 + K (tau + tauB)), c); how much of it is left where
// little cloud surrounds a point (DARK, at the surface of the field smoothed
// over DARK_KM). The sky's light (SKYV: gain, K of 1 / (1 + K tau) through
// the cloud, and its DARK).
// Not from the Monte Carlo: in a crease on the lit side the sun's light
// scattered many times is less (CREASE: at most this share less, the
// depth towards the light over which it goes, and the share of the depth
// round the place that lies away from the light over which it comes in;
// see clouds).
const vec3 MS1 = vec3(1.386, 0.429, 0.111);
const float MS_UP = 0.704;
const vec3 MSD = vec3(5.0, 0.0074, 0.039);
const float DARK = 0.589, DARK_KM = 0.07;
const vec4 CREASE = vec4(0.8, 4.0, 0.5, 0.9);
// (The crease reads its depths near the place: out to CREASE_KM.)
const float CREASE_KM = 0.175;
const vec3 SKYV = vec3(2.205, 0.0382, 0.317);
// The sky's light on the clouds (main) is 2 sAmb times cloudSky, times
// what a white matt surface facing up under the sky as drawn sends out, of
// 2 cloudSky (uSkyLight: 0.3 to 0.7, more low down and at dusk). The Monte
// Carlo's unit is that surface. By the moon and at night, 0.35 of it
// (SKY_UNIT), as by day at 3 km.
const float SKY_UNIT = 0.35;
// The view's optical depth into a cloud within which the light is worked
// out (see clouds).
const float LIGHT_TAU = 4.5;
// The steps of the light's marches from such a point (see clouds).
const int LIGHT_STEPS = 26;
const float UNDER = 0.3;            // the light of the sky left in the air under a full deck
const float COLUMN = 0.11;          // (1 - g) 0.75: how a deep column dims the light through it
const float PENUMBRA = 0.06;        // how far light strays sideways in a cloud, km: shadows on it are soft
const float STRAY_TAU = 8.0, STRAY_MAX = 12.0; // and how that grows with the depth the light has come through (see clouds)
const float SPREAD = 0.15;          // how far light spreads sideways on its way down through a deck, km
const float BELOW = 0.5;            // the gain of the sunlight that came down through a deck, seen from under it

// Places in the clouds are given from the eye (p less eye()). At the
// Earth's radius a float steps by half a metre, and the finest noise
// (cloudDetail) showed those steps as terraces; heightAt finds the height
// of such a place without them.
vec3 eye() {
  return vec3(0.0, RG + uAlt, 0.0);
}

float heightAt(vec3 p) {
  float r = RG + uAlt;
  return (uAlt * (2.0 * RG + uAlt) + 2.0 * r * p.y + dot(p, p)) / (length(p + eye()) + RG);
}

// Near the eye, the reads of the noise of the tile move by this much of a
// texel, a new amount each frame (-0.5 to 0.5; see cloudShape).
vec3 shake = vec3(0.0);
// What cloudShape last found: its layer's form (formAt), how high over the base of its layer the
// place is (km), and as a share of the layer's depth (0 to 1); and how
// far the fine noise is read from its own place there (cloudField).
float overBase = 0.0, heapUp = 0.0, formAt = 0.0, veil = 0.0, knob = 0.5;
vec3 swirl = vec3(0.0);

// The field at p without the fine noise. lod: how much to smooth, as a mip
// level of the noise (negative: finer than its texels). Also gives the
// height over the base's level (y, in units of the shell's depth), the
// place in the noise (q.xyz) and the field of the base alone (base). (body
// and lump: 1 and 0; the light still takes them.)
#ifdef TOPS_MAP
// The map of the tops reads the field at a place on the map and a height.
vec2 topsX;
float topsH;
#endif
// ONE density for every low cloud, after Schneider (2015, 2017): a base
// shape from the noise, times a profile over the height of the layer there,
// less what the layer's amount takes away (remap), all of it in 3D. Finer
// Worley noise erodes its edge (cloudField). The field is CF_K times that
// density before it is clamped: nought at the surface, negative outside
// (roughly the distance in km, for the strides).
const float CF_K = 0.5;             // the field per unit of density
const float CF_FULL = 0.18;         // the density (0 to 1) at which a cloud is as dense as SIGMA
const float CF_ERODE = 0.5;         // how much density the fine noise takes off a sheet at most
const float CF_KNOB = 0.8;          // heaps: how much density the fine noise moves their surface by, in and out
const float CF_CUT = 0.1;           // heaps: the density left that counts as none
const float CF_SHARP = 4.0;         // heaps: how much denser what is left is (a hard edge)
const float CF_LO = 0.45, CF_HI = 0.95; // the range of the heaps' base shape (Perlin-Worley)
const vec2 CF_VEIL = vec2(0.4, 0.3); // the veil at the base of a closed sheet: its density, and the share of the depth it fades over
const float CF_CLOSE = 0.68, CF_FLOOR = 0.6;  // the amount over which the cover closes, and the floor under the shape that closes it
const float CF_RELIEF = 0.35;       // a sheet: how far its cells raise and lower its top, of its height
const float CF_SMALL = 0.35;        // heaps: the weight of the 1 km cells by themselves
const float CF_BIG = 0.25;          // heaps: the weight of the base shape read 4 times larger (8 km)
const vec2 CF_LEAN = vec2(0.22, 0.11); // how far a cloud leans with the wind's shear, km per km of height
const float CF_SWIRL = 0.3;         // how far the base shape's noise moves the fine noise's place, in its tiles (low in a cloud)
// A layer of cloud at x (km on the weather map): the level of its bases
// (km), its depth (km), its amount (0 to 1: how much of the base shape is
// kept; over CF_CLOSE the cover closes) and its form (0: a sheet of cells,
// stratocumulus; 1: heaps, cumulus; tower: how much of a heap is a tower). From the weather map (R: amount, G: depth, B: the gusts' map,
// which also moves the bases, A: where the air rises, towers) and the Clouds
// slider. (One record per layer: a stack of layers is this, once each.)
struct Layer { float level, depth, amount, form, tower; vec4 far; };
Layer cloudLayer(vec2 x, float lod) {
  Layer a;
  float region = textureLod(uWeather, x / WEATHER_KM, 6.5).r;
  // (The map's texels are 250 m; a layer is read over 1 km at least.)
  vec4 w = textureLod(uWeather, x / WEATHER_KM, max(lod - 2.0, 2.0));
  // (far: the map elsewhere, smoothed over tens of km: slow patterns.)
  a.far = textureLod(uWeather, x / WEATHER_KM + 0.37, 5.5);
  a.level = CB + 0.15 + 0.15 * smoothstep(0.25, 0.75, a.far.b);
  a.form = 1.0 - smoothstep(0.5, 0.85, uCloud + 0.4 * (region - 0.5));
  // Few clouds stand in fields (the map's clumps and streets), with clear
  // sea between: the map decides where, steeply; with more, it only thins
  // and thickens the cover. Heaps keep clear air between them inside a
  // field.
  // (At the top of the slider the cover is whole everywhere.)
  a.amount = 0.44 + 0.44 * uCloud - 0.03 * smoothstep(0.5, 0.7, uCloud) + 0.09 * smoothstep(0.6, 0.8, uCloud) - 0.04 * smoothstep(0.8, 1.0, uCloud) + mix(2.2, 0.6, smoothstep(0.1, 0.8, uCloud)) * (1.0 - 0.85 * smoothstep(0.88, 1.0, uCloud)) * (w.r - 0.5);
  a.amount = clamp(a.amount, 0.0, mix(1.0, 0.72, a.form)) * smoothstep(0.0, 0.05, uCloud);
  // Towers, where the air rises (A) and the slider lets heaps grow.
  a.tower = smoothstep(0.75, 0.95, w.a) * smoothstep(0.15, 0.4, uCloud) * a.form;
  a.depth = mix((0.5 + 0.5 * w.g) * (0.55 + 0.9 * w.r), mix(0.6 + 1.2 * w.g * w.g, 2.8 + 1.4 * w.g, a.tower), a.form);
  return a;
}
float cloudShape(vec3 p, float lod, bool fine, out float y, out vec4 q, out float body, out float lump, out float base) {
#ifdef TOPS_MAP
  float h = topsH;
  vec2 x = topsX;
#else
  float h = heightAt(p);
  vec2 x = p.xz + uDrift;
#endif
  q = vec4(0.0, 0.0, 0.0, 1.0);
  body = 1.0;
  lump = 0.0;
  base = -9.0;
  heapUp = 0.0;
  veil = 0.0;
  y = (h - CB) / (CT - CB);
  if (y <= 0.0 || y >= 1.0) return -9.0;
  Layer a = cloudLayer(x, lod);
  overBase = h - a.level;
  formAt = a.form;
  y = overBase / (CT - CB);
  // (The base: the field of a flat floor, steep, so that only the lowest
  // 60 m count as a base.)
  base = 8.0 * overBase;
  float t = overBase / a.depth;
  heapUp = clamp(t, 0.0, 1.0);
  // The profile 1 - t^k: flat under, round over (k = 2; a tower's is
  // lower towards its sides, below). The amount takes 1 - am of the shape;
  // no cloud above tTop: the profile there is under that. Over CF_CLOSE the
  // amount takes no more, and a floor under the shape closes the cover
  // instead (below): so a closed sheet keeps the relief of its top.
  float am = min(a.amount, CF_CLOSE), k = 2.0;
  // (A heap's heads stand out of it by up to 0.2 CF_KNOB of density, see
  // cloudField: cut off at the bound without them, distant tops had flat,
  // stepped outlines.)
  float tTop = pow(min(am * (1.0 + 0.2 * CF_KNOB * a.form), 1.0), 1.0 / k);
#ifdef TOPS_MAP
  // (A margin: the map of the tops reads four places in each texel, and a
  // tower's depth rises steeply across one.)
  return am > 0.0 ? a.level + a.depth * tTop * (1.0 + 0.7 * CF_RELIEF * (1.0 - a.form)) + 0.03 + 0.06 * a.depth - h : -9.0;
#endif
  if (am <= 0.0) return -9.0;
  // (A sheet's top stands higher and lower with its cells, below: by up to
  // 0.7 CF_RELIEF of its height.)
  tTop *= 1.0 + 0.7 * CF_RELIEF * (1.0 - a.form);
  if (t >= tTop) return -(t - tTop) * a.depth - 0.02;
  if (overBase <= -0.1) return base;
  float rise = 0.0;
  // The place in the noise: its tile is BASE_KM wide; a depth into it that
  // drifts from place to place (far) keeps two tiles from showing the same
  // clouds; and it leans with the wind's shear.
  vec4 far = a.far;
  vec2 xs = x - CF_LEAN * overBase;
  vec3 off = vec3(far.b, 2.5 * far.r, far.g);
  q.xyz = vec3(xs.x, h, xs.y) / BASE_KM + off;
  // (Near the eye, where a pixel is finer than 1 m, the read moves by up to
  // half a texel each frame: the mean over the frames smooths the facets of
  // the GPU's filter.)
  float shaken = fine ? clamp(-6.0 - log2(1.6 * uTan / uRes.y * length(p) / TEXEL_KM), 0.0, 1.0) * mix(1.0, 0.3, smoothstep(0.1, 0.3, length(p))) : 0.0;
  vec4 n = textureLod(uNoise, q.xyz + shake * (shaken / 128.0), max(lod, 0.0));
  vec4 m = textureLod(uNoise, q.xyz * 0.25 + vec3(0.31, 0.17, 0.73), max(lod - 2.0, 0.0));
  // Heaps: Perlin-Worley, swollen by its Worley cells (2 km to 500 m), and
  // the same 4 times larger, which gathers them. A tower is a larger heap:
  // the larger cells weigh more there (broad masses, not stems). (A shape
  // drawn out upwards made stems: its cells became columns, and the carving
  // fluted them into bundles of needles, like a ridge of rock.)
  float wn = 0.625 * n.g + 0.25 * n.b + 0.125 * n.a, wm = 0.625 * m.g + 0.25 * m.b + 0.125 * m.a;
  float sn = (n.r + 1.0 - wn) / (2.0 - wn), sm = (m.r + 1.0 - wm) / (2.0 - wm);
  // (And its cells of 1 km by themselves: small heaps between the large.)
  float shape = clamp((mix(sn, sm, mix(CF_BIG, 0.55, a.tower)) - CF_LO) / (CF_HI - CF_LO) + CF_SMALL * (n.b - 0.46), 0.0, 1.0);
  swirl = CF_SWIRL * (1.0 - 0.7 * heapUp) * (n.gba - n.bag);
  knob = 1.0 - (0.6 * n.b + 0.4 * n.a);
  if (a.form < 1.0) {
    // A sheet: packed cells at every size from 8 km to 500 m (the Worley
    // cells themselves, which meet in creases: thin lines where two large
    // cells meet, and breaks where the amount is low). The small cells are
    // drawn out across the wind, here more and there less (far.g): ranks
    // as a tendency. (The matrix has whole numbers of 32nds: the pattern
    // still repeats with the weather map.)
    vec2 xa = mat2(53.0, 10.0, 10.0, 37.0) / 32.0 * xs;
    vec4 c = textureLod(uNoise, vec3(xa.x, h, xa.y) / BASE_KM + off.zxy, max(lod + 0.5, 0.0));
    c = mix(n, c, smoothstep(0.35, 0.65, far.g));
    float cells = 0.4 * (0.6 * m.g + 0.4 * m.b) + 0.6 * (0.45 * c.g + 0.35 * c.b + 0.2 * c.a);
    shape = mix(clamp((cells - 0.2) / 0.5, 0.0, 1.0), shape, a.form);
    // The top of a sheet stands higher over its cells of 4 km to 1 km and
    // over the largest of them, by up to 0.7 CF_RELIEF of its height (some 100 m): relief
    // without holes, which a low sun shows and a high one hardly. (A lower
    // floor under the shape gave relief too, and pits: specks from 40 km.)
    rise = CF_RELIEF * max(0.35 * m.b + 0.35 * c.g + 0.3 * c.b - 0.3, 0.0) * (1.0 - a.form);
  }
  // (A tower stands highest over the middle of its large cell and lower
  // towards its sides: a dome of turrets, not a block with a flat top.)
  float prof = 1.0 - pow(max(t / (1.0 + rise) / mix(1.0, 0.55 + 0.45 * smoothstep(0.5, 0.9, sm), a.tower), 0.0), k);
  // (Where the amount is over CF_CLOSE the cover closes: no place is quite
  // empty.)
  float closed = smoothstep(CF_CLOSE + 0.1, CF_CLOSE + 0.18, a.amount);
  shape = mix(CF_FLOOR * closed, 1.0, shape);
  // And a veil lies at the base of a closed sheet, which the fine noise
  // does not erode: through the thinnest places between cells one sees
  // grey cloud, not the sea (pits through a sheet were dark specks from far
  // above).
  veil = CF_VEIL.x * closed * clamp(1.0 - t / CF_VEIL.y, 0.0, 1.0);
  // (Outside, the field falls about as fast as the shape does per km: the
  // march strides by it.)
  float d = shape * prof - (1.0 - am);
  return CF_K * (d > 0.0 ? d / am : d);
}

// The field at p; fine: with the fine noise, which erodes it (after
// Schneider 2015: a remap by Worley noise of 285 m to 71 m, wisps low in a
// cloud and billows higher up; near the eye the same noise 8 times finer).
// The base shape's noise moves the place it is read at (in place of the
// talk's curl noise), most low in a cloud. It is read at the pixel's own
// level: from far, cells smaller than a few pixels thin the cloud evenly
// and do not speckle it.
float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge, out float lump,
                 out vec4 q, out float fb) {
  float base;
  float f = cloudShape(p, lod, fine, y, q, body, lump, base);
  float c = min(f, base);
  fb = f - base;
  float under = min(CF_K * veil, base);
  edge = CF_K * CF_FULL;
  bump = 0.0;
  if (c > -0.2 * CF_KNOB * CF_K * formAt) {
    // How much the fine noise takes, of the most it may (e). A read without
    // it (the light's long steps, the depth maps) takes its mean: with none
    // taken from a sheet, the map of the clouds' shadow held its top some
    // 50 m over the top drawn, and with the sun at 3 degrees no crest of a
    // deck was lit. Nor is it read where the cloud is dense whatever it
    // takes (it was half the cost of the clouds' pass).
    float e = 0.45;
    bool carve = fine && c < CF_K * mix(0.6, 1.0, formAt);
    if (carve) {
      vec3 qd = q.xyz * DETAIL + swirl;
      vec4 d = textureLod(uNoise, qd, lod + 2.8);
      // (On heaps the small cells weigh more: grain down to 70 m, and with
      // the finer read below to some 10 m near the eye.)
      float hf = dot(d.gba, mix(vec3(0.625, 0.25, 0.125), vec3(0.4, 0.33, 0.27), formAt));
      // Wisps low in a cloud (the Worley cells' middles go), billows higher
      // up (their seams go: round heads in creases). On heaps the base
      // shape's own cells of 1 km and 500 m carve too: knobs on knobs.
      e = mix(hf, mix(1.0 - hf, 0.5 * (1.0 - hf) + 0.5 * knob, formAt), smoothstep(0.05, 0.3, heapUp));
#if Q_MICRO
      float l1 = lod + 4.7;
      if (l1 < 1.5) {
        vec3 u = vec3(fract(q.x), q.y, fract(q.z));
        vec4 mm = textureLod(uNoise, vec3(50.0 * u.x + 25.0 * u.z, 56.0 * u.y, 50.0 * u.z - 25.0 * u.x), l1);
        e += mix(0.3, 0.6, formAt) * (1.0 - smoothstep(0.5, 1.5, l1)) * (1.0 - dot(mm.gba, mix(vec3(0.5, 0.3, 0.2), vec3(0.34, 0.33, 0.33), formAt)) - 0.4);
      }
#endif
    }
    // A sheet is eroded (a remap: its thin places go first). A heap is
    // carved about its surface by CF_KNOB of density, some 200 m from the
    // deepest crease to the highest head (heads stand out where the noise is
    // under 0.2, creases go in elsewhere; its mean is 0.54): billows on its
    // whole outside, a cauliflower.
    e = clamp(e, 0.0, 1.0);
    float er = CF_ERODE * e;
    float dn = mix((max(c, 0.0) / CF_K - er) / (1.0 - er), c / CF_K - CF_KNOB * ((carve ? e : 0.54) - 0.2), formAt);
    // A heap is dense right behind its surface (a sheet thickens slowly):
    // what is left after the carving is CF_SHARP times as dense, up to 1.
    // So its outline is hard and knobbly, and a fragment too thin to
    // outlast the carving is gone, not a grey ghost.
    // (Less CF_CUT first: the thinnest of it, a skirt of specks smaller
    // than a step of the march, was a grain in the air round a tower.)
    dn -= CF_CUT * mix(0.5, 1.0, formAt);
    // (Where a pixel is wider than that edge, only as sharp as a pixel and
    // a half: a harder edge stood in steps, and fragments of a few texels
    // of the noise were small squares.)
    // (A sheet half as sharp: with a soft top, the sun at 3 degrees came
    // through a kilometre of its fringe and lit no crest of it. The reads
    // of the light take the full sharpness whatever their level: thinner,
    // they let the sun through a heap, which glowed evenly from behind.)
    float sharp = mix(0.5, 1.0, formAt) * CF_SHARP;
    if (dn > 0.0) dn = min(dn * (fine ? clamp(0.39 * exp2(-lod), 1.0, sharp) : sharp), 1.0);
    bump = CF_K * dn - c;
  }
  return veil > 0.0 ? max(c + bump, under) : c + bump;
}

float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge) {
  float lump, fb;
  vec4 q;
  return cloudField(p, lod, fine, y, bump, body, edge, lump, q, fb);
}

// Extinction (per km) for a value of the field at height y: it grows with
// the density up to CF_FULL, and with the height over the base (more water
// higher up).
float cloudExtinction(float f, float lod, float y, float body, float edge) {
  float x = clamp(f / edge, 0.0, 1.0);
  float up = pow(max(y * (CT - CB), 0.0), 2.0 / 3.0);
  // (Heaps are denser than a sheet: the air in them rises faster.)
  return SIGMA * x * mix(clamp(up, 0.3, 1.2), clamp(1.6 * up, 0.6, 1.2), formAt);
}

// Extinction (per km) at p. fine: with the fine noise.
float cloudDensity(vec3 p, float lod, bool fine) {
  float y, bump, body, edge;
  float f = cloudField(p, lod, fine, y, bump, body, edge);
  return f > 0.0 ? cloudExtinction(f, lod, y, body, edge) : 0.0;
}

// ---------- The clouds' depth maps ----------
// Two maps hold the optical depth of the clouds along straight lines, from
// SHADOW_N heights of the shell up to the tops: uShadow along the light
// (for everything outside the clouds, how deep in their shadow a point is,
// and for the clouds' own light past its first steps), uColumn straight up
// (the depth over a place: a deck's light from below). Each lies on a plane
// across its lines, through the eye; each texel is one line, marched once
// through the shell. The same shader draws both, with SHADOW_MAP defined,
// before a frame that needs them (see makeSky). After the opacity shadow
// maps of Kim and Neumann (2001), with the depths kept at heights instead
// of along the line.
// The plane is warped so that its texels are fine near the eye and grow far
// off, with no edge: x / (SHADOW_K + |x|) per axis, so SHADOW_K km away a
// texel is four times as wide as at the eye, and the far edge is infinitely
// far. A sun low in the sky lays its long shadows along few texels.
// The heights are SHADOW_N steps of the shell from CB, four to a layer of
// the texture (RGBA); the depth is 0 at the tops. A point in between takes
// the depth at its height, linearly.
// Stored as tau / (tau + SHADOW_ENC): 8 bits keep both thin shadows and deep
// ones apart.
// A map's layer is drawn again only when the aircraft has flown some way
// (one layer a frame): it is read where a point was when the layer was
// drawn, uShadowShift (km) away (uColumnShift for the column), each layer
// at its own.
uniform sampler2DArray uShadow, uColumn;
// The sky's light on a white matt surface facing up at 16 heights from CB
// to CT (x), for the four wavelengths of each of the three vec4 (y), of 2
// cloudSky there (8 bits: a quarter of it, uSkyEnc 4). fs draws it (with
// SKY_LIGHT defined, a program of its own: in the scene's, its march of the
// sky in 64 directions took 5.7 s of Direct3D's compiler) when the sun or
// the haze has changed: the table of the mean light is smooth in the sky's
// directions and missed up to 2 / 3 of it at dusk.
uniform sampler2D uSkyLight;
uniform float uSkyEnc;
bool skyMoon = true;
uniform vec2 uShadowShift[4], uColumnShift[4];
const float SHADOW_K = 40.0;
const int SHADOW_N = 16;
const float SHADOW_ENC = 4.0;
// The axes of a map's plane, across its lines (dir).
void mapAxes(vec3 dir, out vec3 ax, out vec3 ay) {
  ax = normalize(cross(dir, abs(dir.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
  ay = cross(dir, ax);
}
// The light's, set by main.
vec3 shX, shY;
void shadowAxes() {
  mapAxes(uLight, shX, shY);
}

// Where p lies in a layer of a map (plane axes ax, ay; shift: how far the
// aircraft has flown since the layer was drawn).
vec3 mapAt(vec3 p, vec3 ax, vec3 ay, vec2 shift, int layer) {
  vec3 x = p + vec3(shift.x, -RG - uAlt, shift.y);
  vec2 v = vec2(dot(x, ax), dot(x, ay));
  return vec3(0.5 + 0.5 * v / (SHADOW_K + abs(v)), float(layer));
}

// The optical depth from p up to the tops along the lines of a map (map,
// its axes ax and ay, and its layers' shifts), between its heights, or by
// up (0 to 1) from the height above p alone. (The map as an argument: a
// program reads only the maps it names, and Direct3D 11 gives a program 16
// textures.)
float mapDepth(highp sampler2DArray map, vec3 ax, vec3 ay, vec2 shift[4], vec3 p, float up) {
  if (uCloud <= 0.0) return 0.0;
  float z = clamp((length(p) - RG - CB) / (CT - CB), 0.0, 1.0) * float(SHADOW_N);
  int k = min(int(z), SHADOW_N - 1), l = k / 4, c = k % 4;
  vec4 u = textureLod(map, mapAt(p, ax, ay, shift[l], l), 0.0);
  // (The height above: in this layer, the next one, or the tops.)
  float e1 = u[min(c + 1, 3)];
  if (c == 3) e1 = k == SHADOW_N - 1 ? 0.0 : textureLod(map, mapAt(p, ax, ay, shift[l + 1], l + 1), 0.0).x;
  vec2 e = vec2(u[c], e1);
  vec2 tau = SHADOW_ENC * e / max(1.0 - e, 1e-4);
  return mix(tau.x, tau.y, mix(z - float(k), 1.0, up));
}

// The optical depth of the clouds from p towards the light.
float cloudShadow(vec3 p) {
  return mapDepth(uShadow, shX, shY, uShadowShift, p, 0.0);
}
// The same, for a cloud's own light: with the light low, from the height
// above p alone. (Read between two heights, which lie kilometres apart
// along a low light, the depth from the one below took in the cloud
// itself behind p, and drew bands across the lit walls of towers, one for
// each height of the map.)
float cloudShadowOwn(vec3 p) {
  return mapDepth(uShadow, shX, shY, uShadowShift, p, 1.0 - smoothstep(0.25, 0.45, uLight.y));
}

// The optical depth of the clouds straight up from p, times the sheet's
// relief where it lies (see shadowTexel).
float columnDepth(vec3 p) {
  vec3 ax, ay;
  mapAxes(vec3(0.0, 1.0, 0.0), ax, ay);
  return mapDepth(uColumn, ax, ay, uColumnShift, p, 0.0);
}

// The same on the sea, with soft edges. The sun is a disc, and the light
// that comes through the thin edge of a cloud is spread around it by the
// droplets' forward scattering; so a cloud's shadow fades over a width that
// grows with the way from the cloud down to the sea: SHADOW_PEN radians,
// from clouds about SHADOW_OCC km high (a radius of some 60 m under a high
// sun, 400 m under a low one; along the light it is longer on the sea, by
// 1 / sin of the light's height). Read once, the map's contour was the
// edge of the glitter: so bright that it shows white down to a hundredth
// of the light, the glitter was cut along that contour, hard, and with a
// low sun into blocks (a texel is drawn out along the light on the sea).
// The light is averaged across the light instead, SHADOW_TAPS reads at new
// places each frame (jitter), spaced evenly out from the middle (denser
// there: a uniform disc left round blots), and only then made a depth.
const float SHADOW_PEN = 0.035, SHADOW_OCC = 1.5;
const int SHADOW_TAPS = Q_SHADOW_TAPS;
float seaShadow(vec3 p, float jitter) {
  if (uCloud <= 0.0) return 0.0;
  float r = min(SHADOW_PEN * SHADOW_OCC / max(uLight.y, 0.05), 0.75);
  float lit = 0.0;
  for (int i = 0; i < SHADOW_TAPS; i++) {
    float a = 6.2832 * jitter + 2.39996 * float(i);   // the golden angle
    float ri = r * (float(i) + jitter) / float(SHADOW_TAPS);
    lit += exp(-cloudShadow(p + ri * (cos(a) * shX + sin(a) * shY)));
  }
  return -log(max(lit / float(SHADOW_TAPS), 1e-6));
}

#ifdef SHADOW_MAP
// One texel of a map's layer: the line through it along dir (plane axes
// ax, ay), from where it rises through the base (or its lowest point, if
// that is higher) to the tops; the depth from each of the layer's four
// heights up. The steps are about SHADOW_DS km long, as many as the line's
// slope asks for, between 24 and 96: a low sun's lines climb the shell
// over tens of km, and with fewer steps they missed most clouds. Half a
// step, or the texel, sets how much the field is smoothed. A line that
// climbs the shell under a sun on the horizon is some 240 km long: its
// shadows are as long, and as smooth along the light. A layer marches the
// line from its lowest height on, in the same steps as the lowest layer.
// (One layer a draw: ANGLE on Direct3D 11 compiles a program again for a
// draw into several targets.)
// In the column (uColumnMap 1), a deck's water is not spread evenly: there
// is more of it where its cells and rolls stand higher (in a cloud that
// rises as one, the water grows with the height over the base, so the
// depth with the square of the thickness), and each step counts (1 +
// relief)^2 of its depth: the relief of the sheet there. (As one mean for
// the whole column, at one height, the creases of its cells, straight lines
// between Worley cells, showed from below as tiles with sharp edges.)
uniform vec3 uDir;
uniform float uColumnMap, uLayer;
const float SHADOW_DS = 0.2;
vec4 shadowTexel(vec2 w, vec3 dir, vec3 ax, vec3 ay, int layer) {
  vec2 v = SHADOW_K * w / (1.0 - abs(w));

  float top = raySphere(q, dir, RG + CT).y;

  vec2 c = raySphere(q, dir, RG + CB);
  float start = c.y > c.x ? c.y : -dot(q, dir);

    c = raySphere(q, dir, RG + CB + (CT - CB) * float(4 * layer + k) / float(SHADOW_N));

  // (below), and to the tops (sum).

// Light that came down through cloud which lets tDown of it through (two
// streams), as it leaves the base at a cosine cv to the vertical: per unit
// of sunlight with the sun at a cosine mu0 over the top (x), and per unit of
// the sky's light, 2 ms (y). A slab lets the sun's light through a little
// more with the sun high (0.5 + 0.75 mu0), and a base is brighter overhead
// than aslant (as 1 + 2 cos, the overcast sky of the CIE). The sun's part
// has the gain BELOW; the sky's part takes the 6 % the sea sends back up.
// Inside the cloud, part of that light goes back up (r of the light going
// down there): looking down, the eye sees it. The light then varies with
// the cosine, as 1 + 2 cv for the stream down and 1 - 2 cv for the stream
// up (Eddington's form), from a base looking down on the dark sea to the
// same grey all round deep in a thick deck. (Inside, the light looking
// down was that of the horizon, and a line ran across the fog there.)
vec2 throughDeck(float mu0, float tDown, float cv, float r) {
  float esc = (3.0 / 7.0) * max(1.0 + 2.0 * cv + r * (1.0 - 2.0 * cv), 0.3 + 0.7 * r);
  return vec2(BELOW * mu0 * min((0.5 + 0.75 * mu0) * tDown, 1.0) * esc / PI, 1.06 * tDown * esc);
}

// What of the sky's light comes through cloud of optical depth tau to a
// point in it, as two streams let light through a slab.
float skyThrough(float tau) {
  return 1.0 / (1.0 + SKYV.y * tau);
}

float hg(float mu, float g) {
  return (1.0 - g * g) / (4.0 * PI * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}

// The clouds along the ray from ta to tb: what gets through them (Tc), the
// light they send to the eye per unit of sunlight (sOne: scattered once;
// sMany: many times) and of skylight (sAmb), and the distance it comes from
// (tBar; negative without clouds).
void clouds(vec3 o, vec3 d, float ta, float tb, float jitter,
            out float Tc, out float sOne, out float sMany, out float sAmb, out float sLean, out float tBar, out vec4 mapA, out vec4 mapB) {

  // end within the budget; the nearest stay fine.

  // the end of the ray does. A ray that meets the sea ends early: plan it

  // that just meets the sea is then planned like one that just misses it,
  // and a cloud in front of the horizon looks the same above and below it.

  // marched in steps of 100 to 200 m: their edges came out as thin dark
  // squiggles and a hatch. Now the steps grow from DS_REL * t by 1 + t / L,
  // where L is set so that this too ends within the budget (the sum of
  // dt / (DS_REL t (1 + t / L)) from s0 to plan), and never past rel * t:
  // fine near the eye, as before far off. The whole budget is for the part
  // beyond the knee, wherever the ray enters the shell. It used to pay for
  // the part before the knee as well: once the eye came within about 6 km
  // of the tops, that part ate the budget, the steps beyond it grew three
  // times longer, and the noise read with them was smoothed as much, so the
  // clouds below went soft between 6.5 and 5.2 km. The march's own limit
  // (CLOUD_STEPS) pays for the near part.

  // grey polygons with straight edges. The mean over the frames is smooth.

  // clear air before it is not marched again, and the ray starts a little
  // before it, a share of a stride further for each pixel and frame (as at
  // ta). Where none of them met any, nor does this ray: a cloud that all
  // of them miss is under 2 pixels wide.

    // ray ends once it is clear of the farthest cloud that the others met,
    // by a fifth of that distance and 2 km more: beyond it, the ray that
    // met none has found the air clear a pixel or two away. (Rays that
    // slipped past the edge of a near cloud marched on to the horizon, up
    // to CLOUD_STEPS steps, and the pixels that the GPU runs with them

  // (e^-tau), new for each pixel and frame. The samples before the point wait
  // for its light (pend: their weight); the later ones take it. So the light
  // is that of the cloud's first few metres, as the eye sees them, and the
  // mean over the frames is its integral. (Two strata, 0 to 1.5 and 1.5 to
  // 4.5, each with its point, cost 0.6 to 0.8 ms more of the frame among
  // the heaps.)

  // works it out after its loop: the pixels that the GPU runs together

  // met a cloud at another step made the others wait through its light
  // in turn.
  int i = 0;

        // sample.)

        // start (with the eye in a cloud, that would put the cloud behind
        // it, and the sky would show through).

        // seventh of the light, up to dsAir.

          // more than 85 % of what lies behind: then it takes their light
          // (it would show little of its own, and the light is most of the
          // cost).

            tsIn = tsum;

            // start's jitter.)
            tauStar = -log(1.0 - fract(ign(gl_FragCoord.xy + 31.0) + 0.7548777 * mod(uPass, 4096.0)) * (1.0 - exp(-LIGHT_TAU)));

            tauStar = -log(1.0 - ign(gl_FragCoord.xy + 5.588238 * uPass + 31.0) * (1.0 - exp(-LIGHT_TAU)));

          // worked out at the middle of what it met there, by weight. At the
          // place it left, a ray that grazed a lobe took the light of the
          // lobe's far side for the whole of its way through it: with the
          // sun behind the eye every lobe before another had a dark outline.)

        // the depth that way as two streams let it through. The mean over
        // the frames is the whole sky: a top sees all of it, a wall half,
        // a base under a deep cloud the little that comes through it. Two
        // directions mirrored about the vertical: on a wall one goes into
        // it and one away. skyLean: the same times how far each direction
        // lies towards the sun's side (the lean of the sky's light with the

        // came from. (Through the two streams, a face turned from the glow
        // got nearly as much of it as one turned to it, and a deck at dusk
