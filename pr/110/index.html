    select: document.getElementById('sound'), volume: document.getElementById('volume'),
    note: document.getElementById('soundOut'), volumeOut: document.getElementById('volumeOut'),
    waiting: () => TEXT[LANG].soundWait, params, aircraft: () => state,
  });
  alt.addEventListener('input', sound.follow);
  speed.addEventListener('input', sound.follow);

  // The language: at once, and kept for the next visit. The title and the
  // hint come back for a while, in the new language.
  langSelect.addEventListener('change', () => {
    applyLanguage(langSelect.value);
    try { localStorage.setItem('sky.lang', LANG); } catch (err) {}
    showLabels();
    showFullScreen();
    sound.show();
    showQuality();
    showIntro();
  });

  // Full screen: the hero with its overlays. Esc and the browser's own exits
  // come through fullscreenchange too. Where the browser has no full screen
  // for pages (an iPhone), the button stays hidden.
  function showFullScreen() {
    const label = TEXT[LANG][document.fullscreenElement ? 'exitFullScreen' : 'fullScreen'];
    fsButton.setAttribute('aria-label', label);
    fsButton.title = label;
  }
  if (document.fullscreenEnabled) {
    fsButton.hidden = false;
    fsButton.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else hero.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => {
      showFullScreen();
      update();
    });
  }
  showFullScreen();

  new ResizeObserver(update).observe(document.body);
  window.addEventListener('resize', update);
  readInputs();
  // The time and the moon's age run unrounded while playing: ?debug=1 gives them so, and they are taken as given
  // (a slider would round them to its step), when in range.
  for (const id of ['time', 'moon']) {
    const x = params.has(id) && params.get(id) !== '' ? +params.get(id) : NaN, el = document.getElementById(id);
    if (x >= +el.min && x <= +el.max) { state[sliders[id]] = x; update(); }
  }
  // ?now=1 is the button; ?rate= (one of the select's) and ?play=1 are the
  // select and the play button.
  if (params.get('now') === '1') toNow();
  if ([...rate.options].some(o => o.value === params.get('rate'))) {
    rate.value = params.get('rate');
    rate.dispatchEvent(new Event('change'));
  }
  if (params.get('play') === '1' && !playing) setPlaying(true);
  // Start with the sun off to one side, where it models the clouds best.
  celestial();
  state.yaw = params.has('yaw') ? params.get('yaw') * RAD : Math.atan2(state.sun[0], state.sun[2]) + 65 * RAD;
  if (params.has('pitch')) state.pitch = params.get('pitch') * RAD;
  // The view starts out of a window ahead and to the right of the nose.
  state.heading = params.has('heading') ? (+params.get('heading') || 0) * RAD : state.yaw - 60 * RAD;
  // The attitude, degrees: ?bank=20 (the right wing down), ?climb=5 (the nose up).
  state.bank = clampTo((+params.get('bank') || 0) * RAD, BANK_MAX);
  state.climb = clampTo((+params.get('climb') || 0) * RAD, CLIMB_MAX);
  // A place to start from, in km: ?at=120,40
  if (params.has('at')) {
    const [x, z] = params.get('at').split(',');
    state.drift = [wrap(+x || 0), wrap(+z || 0)];
  }

  // ---------- Loading ----------
  // The page shows at once, in its loading state (.loading in the style).
  // The renderer is made after that has been painted, a step at a time
  // (makeSky): nothing holds the main thread for long, and nothing waits
  // for the GPU. Then the first frame is asked for and the time starts;
  // the loading state fades once the first picture is on the canvas.
  // data-sky on the hero tells the test tools when the loading has ended.
  // The next frame of the browser; in a hidden tab, which has no animation
  // frames, a while later.
  function nextFrame() {
    return new Promise(resolve => {
      if (document.hidden) setTimeout(resolve, 100);
      else requestAnimationFrame(() => resolve());
    });
  }
  // Runs jobs (see finish) to their ends in slices of about SLICE_MS, a
  // slice a frame; report(share) after each job.
  const SLICE_MS = 8;
  // The next task (a frame in a hidden tab, where timers are slowed anyway).
  const soon = () => document.hidden ? nextFrame() : new Promise(resolve => setTimeout(resolve, 0));
  // wait: how a slice yields (the next frame, or the next task).
  async function slices(jobs, report, wait = nextFrame) {
    let start = performance.now();
    for (let k = 0; k < jobs.length; k++) {
      while (!jobs[k].next().done) {
        if (performance.now() - start > SLICE_MS) {
          await wait();
          start = performance.now();
        }
      }
      report((k + 1) / jobs.length);
    }
  }
  const loadingLine = hero.querySelector('.loading .line');
  let share = 0;
  const done = s => {
    if (s > share) loadingLine.style.setProperty('--done', share = s);
  };

  // ---------- Stats ----------
  // ?stats (or ?stats=1): a small overlay with what the hero costs on this
  // device, to read off a phone (a screenshot): frames a second over the
  // last STATS_SPAN ms and the longest gap between two of them, the GPU's
  // time a frame (where the GPU tells it), the quality level, the canvas's
  // size and the CSS size it fills, the device pixel ratio, the sizes the
  // frame and its passes are drawn at, the drawing scale, the time from
  // opening the page to the first picture, the GPU memory its textures and
  // canvas take (counted as they are made: see countMemory), the contexts
  // lost and the levels that failed, and the GPU's name. Without it,
  // nothing of this runs.
  const STATS_SPAN = 3000;
  const stats = params.has('stats') && params.get('stats') !== '0'
    ? { frames: [], shown: 0, shownAt: 0, gpu: [], js: [], memory: { bytes: 0 }, first: null, lost: 0, element: null, bench: params.get('stats') === 'bench' ? [] : null, bench3: params.get('stats') === 'bench3' ? { lines: ['bench3: waiting'] } : null,
        // The parts of a frame: the script's time in each (a mean over the
        // last few dozen frames), and the draws and pixels of the last frame.
        parts: { mean: new Map(), lap(name, ms) { this.mean.set(name, (this.mean.get(name) ?? ms) * 0.95 + ms * 0.05); }, draws: 0, pixels: 0 } } : null;
  function showStats() {
    stats.shownAt = performance.now();
    if (!stats.element) {
      stats.element = document.createElement('pre');
      stats.element.className = 'stats';
      document.body.append(stats.element);
    }
    const now = performance.now(), from = now - STATS_SPAN;
    stats.frames = stats.frames.filter(t => t >= from);
    stats.gpu = stats.gpu.filter(([t]) => t >= from);
    stats.js = stats.js.filter(([t]) => t >= from);
    const js = stats.js.length ? stats.js.reduce((a, [, ms]) => a + ms, 0) / stats.js.length : null;
    const jsWorst = stats.js.reduce((a, [, ms]) => Math.max(a, ms), 0);
    const f = stats.frames;
    let worst = 0;
    for (let i = 1; i < f.length; i++) worst = Math.max(worst, f[i] - f[i - 1]);
    const fps = f.length > 1 && now - f[f.length - 1] < 500 ? (f.length - 1) / ((f[f.length - 1] - f[0]) / 1000) : 0;
    const gpu = stats.gpu.length ? stats.gpu.reduce((a, [, ms]) => a + ms, 0) / stats.gpu.length : null;
    const gl = heroCanvas.getContext('webgl2');
    if (gl && !stats.name) {
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      stats.name = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    }
    const z = render && render.sizes && render.sizes();
    const Q = z && QUALITY[z.level];
    const wh = a => a ? a.join('x') : '-';
    // How the picture reaches the screen's pixels: enlarged by the page (the
    // shader "enlarge"), and stretched by the browser past the canvas.
    const shownLine = z => {
      const by = z.shown[0] / z.picture[0], browser = heroCanvas.clientWidth * (window.devicePixelRatio || 1) / z.shown[0];
      return `shown ${wh(z.shown)}: ${by > 1.005 ? `enlarged ${by.toFixed(2)}x by the page` : 'as drawn'}` +
        (Math.abs(browser - 1) > 0.005 ? `, ${browser > 1 ? 'stretched' : 'shrunk'} ${browser.toFixed(2)}x by the browser` : ', 1:1 on the screen');
    };
    if (stats.memory.update) stats.memory.update();
    stats.element.textContent = [
      `${fps ? fps.toFixed(1) + ' fps, worst ' + worst.toFixed(0) + ' ms' : 'not drawing'}${gpu !== null ? `, GPU ${gpu.toFixed(1)} ms` : ''}`,
      js !== null ? `JS ${js.toFixed(1)} ms a frame, worst ${jsWorst.toFixed(0)} ms` : '',
      stats.parts.mean.size ? 'JS by part ' + [...stats.parts.mean].map(([k, v]) => `${k} ${v.toFixed(1)}`).join(', ') : '',
      stats.drawn ? `${stats.drawn[0]} draws a frame, ${(stats.drawn[1] / 1e6).toFixed(2)} Mpx` : '',
      stats.bench && stats.bench.length ? 'bench ' + stats.bench.map(([sc, f, j]) => `${sc}: ${f.toFixed(1)} fps JS ${j.toFixed(1)}`).join(', ') : '',
      ...(stats.bench3 ? stats.bench3.lines : []),
      `quality ${level || '-'}${choice === 'auto' ? ' (auto)' : ''}`,
      `canvas ${heroCanvas.width}x${heroCanvas.height}, CSS ${heroCanvas.clientWidth}x${heroCanvas.clientHeight}, DPR ${(window.devicePixelRatio || 1).toFixed(2)}`,
      z ? shownLine(z) : '',
      z ? `picture ${wh(z.picture)}, frame ${wh(z.frame)}, scale ${z.scale.toFixed(2)}` : 'picture -',
      z ? `clouds ${state.cloud > 0 ? wh(z.passes) : '-'}, light ${state.cloud > 0 ? wh(z.light) : '-'}, cirrus ${state.cirrus > 0 ? wh(z.frame.map(x => Math.ceil(x / (Q.ciPass || Q.pass)))) : '-'}` : '',
      `first picture ${stats.first === null ? '-' : (stats.first / 1000).toFixed(1) + ' s'}`,
      stats.marks && stats.marks.length ? 'start ' + startParts(stats.marks) : '',
      `GPU memory ${(stats.memory.bytes / 1e6).toFixed(0)} MB`,
      `context lost ${stats.lost}, failed ${tried.length}`,
      stats.name || '',
    ].filter(Boolean).join('\n');
  }
  // The parts of the start, for the overlay: when each ended (s since the
  // page was opened), by the names of `mark` in makeSky; the programs as
  // one, when the last was done.
  const START_PARTS = [['WebGL2 context made', 'context'], ['tables built', 'tables'], ['program', 'programs'], ['noise and weather built', 'noise'],
    ['cirrus built', 'cirrus'], ['waves built', 'waves'], ['first frame drawn', 'frame']];
  const startParts = marks => START_PARTS.map(([what, name]) => {
    const at = marks.filter(([m]) => m === what || (what === 'program' && m.startsWith('program '))).map(([, s]) => s);
    return at.length ? `${name} ${Math.max(...at).toFixed(1)}` : '';
  }).filter(Boolean).join(', ') + ' s';
  if (stats) setInterval(showStats, 500);
  // ?stats=bench: from 3 s after the first picture, the drawing scale is
  // held at each of BENCH_SCALES for BENCH_MS in turn, and the frames a
  // second and the script's time are noted for each (the last 2 s of it):
  // a time that falls with the scale's square is the pixels', one that
  // stays is the frame's fixed cost. Then the scale is let go.
  const BENCH_SCALES = [1, 0.71, 0.5, 0.35], BENCH_MS = 4000;
  // ?stats=bench3: what each part of the frame costs, and what each cut
  // saves, measured as the first bench does, by the frames a second (the
  // GPU's time cannot be read on a phone: no timer queries, and a phone's
  // GPU draws a target only when it is needed, so reads round a draw time
  // nothing). For each configuration in BENCH3: the scale held at 1, the
  // first BENCH3_SKIP ms let go, then the mean time between pictures over
  // BENCH3_MS. The screen's 60 Hz caps the reading at 16.7 ms: where the
  // first configuration reads under twice BENCH3_CAP, the passes and the
  // scene are drawn K times a frame (K = 2, 4, 8), and all are measured at
  // that K. The variants of the programs (the candidate cuts) are compiled
  // first.
  const BENCH3_SKIP = 500, BENCH3_MS = 2500, BENCH3_CAP = 20;
  const BENCH3 = [
    ['no clouds', { cloud: 0 }], ['no cirrus', { cirrus: 0 }], ['no light pass', { skip: { light: true } }],
    ['light every 2nd', { skip: { lightOdd: true } }], ['LOD for frame', { clouds: '#define Q_BENCH_CLOUD_LOD' }],
  ];
  if (stats && stats.bench3) {
    const B = stats.bench3;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    // (Frames from now, by the pictures: timers may wait behind slow frames.)
    const frames = n => new Promise(r => { stats.after = [stats.shown + n, r]; });
    const time = async () => {
      const t0 = performance.now(), n0 = stats.shown;
      while (performance.now() - t0 < BENCH3_SKIP) await frames(1);
      const t1 = performance.now(), n1 = stats.shown;
      while (performance.now() - t1 < BENCH3_MS) await frames(1);
      return (performance.now() - t1) / Math.max(stats.shown - n1, 1);
    };
    const run = async () => {
      while (!stats.first || !render || !render.pin) await wait(500);
      await wait(2000);
      const gl = heroCanvas.getContext('webgl2'), timer = !!gl.getExtension('EXT_disjoint_timer_query_webgl2');
      const defs = d => d;
      B.lines = ['bench3: compiling the variants'];
      const want = [];
      for (const [name, c = {}] of BENCH3) {
        if (c.scene) want.push([name + ' scene', '', defs(c.scene)]);
        if (c.clouds) want.push([name + ' clouds', 'CLOUD_PASS', defs(c.clouds)]);
        if (c.cirrus) want.push([name + ' cirrus', 'CIRRUS_PASS', defs(c.cirrus)]);
      }
      const made0 = await render.variants(want);
      const before = render.sizes() ? render.sizes().scale : 1;
      render.pin(1);
      const kept = { cloud: state.cloud, cirrus: state.cirrus };
      // One configuration: set, measured, and put back.
      const one = async (c, label) => {
        B.lines = [label];
        if ('cloud' in c) state.cloud = c.cloud;
        if ('cirrus' in c) state.cirrus = c.cirrus;
        render.use(c.made && c.made.scene, c.made && c.made.clouds, c.made && c.made.cirrus);
        render.bench(K, c.skip);
        update();
        const ms = await time();
        render.bench(1);
        render.use();
        Object.assign(state, kept);
        update();
        return ms;
      };
      // K, on "as is" after a settling run of it (see BENCH3_CAP).
      let K = 1, base = await one({}, 'bench3: settling');
      while (base < 2 * BENCH3_CAP && K < 8) {
        K *= 2;
        base = await one({}, `bench3: as is, K ${K}`);
      }
      // Each row against an "as is" just before it: the phone's speed
      // drifts over the run (it grows warm), and the pair sees the same.
      const rows = [];
      for (const [i, [name, c = {}]] of BENCH3.entries()) {
        const made = { scene: made0[name + ' scene'], clouds: made0[name + ' clouds'], cirrus: made0[name + ' cirrus'] };
        if ((c.scene && !made.scene) || (c.clouds && !made.clouds) || (c.cirrus && !made.cirrus)) {
          rows.push(`${name} -`);
          continue;
        }
        const a = await one({}, `bench3 ${i + 1}/${BENCH3.length}: as is`);
        const b = await one({ ...c, made }, `bench3 ${i + 1}/${BENCH3.length}: ${name}`);
        rows.push(`${name} ${b.toFixed(1)} (${b - a >= 0 ? '+' : ''}${(b - a).toFixed(1)})`);
      }
      // (The drawing scale as it was, and the frames since.)
      render.pin(before);
      render.pin(0);
      stats.frames = [];
      stats.js = [];
      B.lines = [`bench3, ms a frame at scale 1 (+/- against as is just before), K = ${K}, as is ${base.toFixed(1)} (timer query ${timer ? 'yes' : 'no'}):`];
      for (let i = 0; i < rows.length; i += 2) B.lines.push('  ' + rows.slice(i, i + 2).join(', '));
    };
    run().catch(err => { B.lines = ['bench3 failed: ' + String(err && err.message || err).slice(0, 200)]; });
  }
  if (stats && stats.bench) {
    const run = async () => {
      while (!stats.first || !render || !render.pin) await new Promise(r => setTimeout(r, 500));
      await new Promise(r => setTimeout(r, 3000));
      for (const sc of BENCH_SCALES) {
        render.pin(sc);
        await new Promise(r => setTimeout(r, BENCH_MS - 2000));
        const from = performance.now();
        await new Promise(r => setTimeout(r, 2000));
        const f = stats.frames.filter(t => t >= from), j = stats.js.filter(([t]) => t >= from);
        stats.bench.push([sc, f.length > 1 ? (f.length - 1) / ((f[f.length - 1] - f[0]) / 1000) : 0, j.length ? j.reduce((a, [, ms]) => a + ms, 0) / j.length : 0]);
      }
      if (render && render.pin) render.pin(0);
    };
    run();
  }

  // ---------- Quality ----------
  // The level drawn (see QUALITY): the address (?quality=), else the
  // panel's last choice, else the automatic one: the level this device
  // reached on its last visit, or a first guess from what it says of
  // itself; then a step down while frames are too slow, or up while they
  // are fast (see "Quality levels" in docs/design.md). A level that fails
  // to start falls back to the one below.
  const quality = document.getElementById('quality');
  const named = q => LEVELS.includes(q);
  // (The panel's name of a level: TEXT.qualityLow and so on.)
  const levelText = l => TEXT[LANG]['quality' + l[0].toUpperCase() + l.slice(1)];
  // crashed: a level that started on the last visit and did not draw for
  // QUALITY_OK_MS (sky.qualityTrying: set as a level starts, removed once it
  // has drawn that long): the tab died, or the context was lost for good.
  const QUALITY_OK_MS = 10000;
  let storedQuality = null, memo = null, crashed = null;
  try {
    storedQuality = localStorage.getItem('sky.quality');
    memo = JSON.parse(localStorage.getItem('sky.qualityAuto'));
    crashed = localStorage.getItem('sky.qualityTrying');
  } catch (err) {}
  const askedQuality = params.get('quality');
  // choice: 'auto' or a level; level: the level drawn (null until the context says what it can do).
  let choice = named(askedQuality) || askedQuality === 'auto' ? askedQuality : named(storedQuality) ? storedQuality : 'auto';
  let level = named(choice) ? choice : null;
  // The automatic choice goes no higher than a level it once stepped down from.
  let ceiling = memo && named(memo.ceiling) ? memo.ceiling : 'max';
  const below = l => LEVELS[Math.max(0, LEVELS.indexOf(l) - 1)];
  const lower = (a, b) => LEVELS[Math.min(LEVELS.indexOf(a), LEVELS.indexOf(b))];
  const remember = () => {
    try { localStorage.setItem('sky.qualityAuto', JSON.stringify({ level, ceiling })); } catch (err) {}
  };
  // A level failed, and `to` is drawn instead: the automatic choice goes no
  // higher for good, and a level chosen in the panel (not in the address)
  // becomes `to` (the panel shows it), so that the next visit does not fail
  // again.
  let wentDown = false;
  const steppedDown = to => {
    if (choice === 'auto') {
      ceiling = lower(ceiling, to);
      wentDown = true;
      remember();
    } else if (!named(askedQuality)) {
      choice = to;
      try { localStorage.setItem('sky.quality', to); } catch (err) {}
    }
  };
  if (named(crashed) && !named(askedQuality)) {
    console.info(`Sky: quality ${crashed} did not last on the last visit`);
    if (choice === 'auto') ceiling = lower(ceiling, below(crashed));
    else if (choice === crashed) level = choice = below(crashed);
  }
  // A visit that ends in the usual way (a reload, another page, the tab
  // closed, also while it loads) did not crash: only a tab that died
  // leaves sky.qualityTrying behind. (Reloaded within QUALITY_OK_MS, the
  // page stepped down a level for good each time.)
  addEventListener('pagehide', () => {
    try { localStorage.removeItem('sky.qualityTrying'); } catch (err) {}
  });
  // The first guess, from cheap signals: low on a renderer without a GPU, on
  // a phone or a tablet, and where the GPU lacks what the frames need (half
  // floats to draw into, large textures); max for the strongest desktop
  // GPUs, high for other dedicated ones, mid for the rest (integrated GPUs,
  // and GPUs that do not give their name), and at most mid with little
  // memory or few cores.
  // A phone or a tablet: the user agent says mobile, or the pointer is
  // coarse and the screen under 900 CSS pixels on its short side.
  const ua = navigator.userAgentData;
  const phone = (ua ? ua.mobile : /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))
    || (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 900);
  // A phone starts at low, and the automatic choice takes it no higher than
  // mid: its GPU is many times slower than a desktop's, and its screen hides
  // what the higher levels add.
  if (phone) ceiling = lower(ceiling, 'mid');
  function guess(gl) {
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    const name = String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    const floats = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
    if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(name) || phone || !floats
      || gl.getParameter(gl.MAX_TEXTURE_SIZE) < 8192) return 'low';
    let l = /RTX\s*(30[89]0|40[789]0|50[789]0)|RX\s*(6[89]|7[89]|9[07])\d0|Apple M\d+ (Max|Ultra)/i.test(name) ? 'max'
      : /GeForce|Quadro|RTX|Radeon (RX|Pro)|Arc|Apple M\d+ Pro/i.test(name) ? 'high' : 'mid';
    if ((navigator.deviceMemory || 8) <= 4 || (navigator.hardwareConcurrency || 8) <= 4) l = lower(l, 'mid');
    return l;
  }
  function showQuality() {
    const T = TEXT[LANG];
    // (An explicit level that could not start shows the one drawn.)
    quality.value = choice === 'auto' ? 'auto' : level || choice;
    quality.options[0].textContent = choice === 'auto' && level ? T.qualityAutoAt(levelText(level)) : T.qualityAuto;
  }
  showQuality();
  quality.addEventListener('change', () => {
    choice = quality.value;
    // (Auto chosen in the panel starts afresh: no ceiling, and the next
    // visit starts from the first guess.)
    if (choice === 'auto') {
      ceiling = 'max';
      wentDown = false;
    }
    try {
      if (choice === 'auto') {
        localStorage.removeItem('sky.quality');
        localStorage.removeItem('sky.qualityAuto');
      } else localStorage.setItem('sky.quality', choice);
    } catch (err) {}
    showQuality();
    if (named(choice) && choice !== level && loaded) restart(choice);
  });

  // The automatic steps. After the first picture, AUTO_WAIT ms are let go
  // by (the first frames are slow on any GPU); then windows of at least
  // AUTO_SPAN ms and 20 frames that follow one another. A window whose
  // pictures were drawn at under AUTO_SMALL of the size per side (on the
  // mean: the drawing size had to shrink to keep 25 frames a second; see
  // The drawing size) steps down, and the level above becomes the ceiling
  // for good (no step back up: no back and forth). One drawn at full size
  // throughout, fast enough that the level above would still draw at
  // AUTO_FAST ms a frame by the costs in QUALITY, steps up. At most
  // AUTO_STEPS steps a visit. The level reached is the next visit's start.
  // Where the GPU tells the time of its frames (gpuTimed), that decides the
  // step up instead: the level above would take under AUTO_GPU ms of the
  // GPU's a frame. The wall clock cannot tell how much time is left on a
  // frame that waits for the screen (at 60 Hz, never under 16.7 ms). And
  // the GPU's times keep the step down for a GPU that is busy.
  const AUTO_WAIT = 2000, AUTO_SPAN = 3000, AUTO_SMALL = 0.6, AUTO_FAST = 30, AUTO_GPU = 12, AUTO_STEPS = 3;
  let shownAt = 0, measure = null, autoSteps = 0, restarting = false;
  // The GPU's work for a frame at level l on this canvas: its cost per pixel times its pixels.
  const work = l => {
    const [w, h] = drawnSize(heroCanvas.clientWidth || 1, heroCanvas.clientHeight || 1, QUALITY[l]);
    return QUALITY[l].cost * w * h;
  };
  // The GPU's time of a frame, into the window being measured.
  const gpuTimed = ms => {
    if (stats) stats.gpu.push([performance.now(), ms]);
    if (measure) {
      measure.gn++;
      measure.gpu += ms;
    }
  };
  const timed = (ms, small) => {
    if (choice !== 'auto' || restarting || !shownAt || !render) return;
    const now = performance.now();
    if (now - shownAt < AUTO_WAIT) return;
    if (!measure) measure = { from: now, n: 0, ms: 0, small: 0, full: true, gn: 0, gpu: 0 };
    measure.n++;
    measure.ms += ms;
    measure.small += small;
    measure.full = measure.full && small === 1;
    if (now - measure.from < AUTO_SPAN || measure.n < 20) return;
    const m = measure, i = LEVELS.indexOf(level), up = LEVELS[i + 1];
    measure = null;
    let to = null;
    if (autoSteps >= AUTO_STEPS) return;
    // (Where the GPU tells its time, a step down needs it busy: its time
    // a frame, scaled to the full size, at least AUTO_FAST. Frames slowed by
    // something else, a busy CPU or a throttled window, are no reason to
    // draw less; a level stepped down from is never tried again.)
    // (At a level that keeps its size, minScale 1, the size the frames' time
    // would have shrunk it to: under AUTO_SMALL, frames over 83 ms.)
    const drawn = m.small / m.n, busy = m.gn < 20 || m.gpu / m.gn / (drawn * drawn) >= AUTO_FAST;
    const scale = QUALITY[level].minScale >= 1 ? Math.min(1, Math.sqrt(SCALE_AIM * m.n / m.ms)) : drawn;
    if (scale < AUTO_SMALL && i > 0 && busy) {
      to = LEVELS[i - 1];
      steppedDown(to);
    } else if (up && !wentDown && i < LEVELS.indexOf(ceiling) && m.full
      && (m.gn >= 20 ? m.gpu / m.gn : m.ms / m.n) * work(up) / work(level) < (m.gn >= 20 ? AUTO_GPU : AUTO_FAST)) {
      to = up;
    }
    if (to) {
      autoSteps++;
      console.info(`Sky: quality ${level} to ${to} (${(m.ms / m.n).toFixed(1)} ms a frame${m.gn ? `, ${(m.gpu / m.gn).toFixed(1)} of the GPU's` : ''}, at ${(m.small / m.n).toFixed(2)} of the size)`);
      restart(to);
    }
    remember();
  };

  // A context for a new level: the last level's textures and programs are
  // freed by losing the context on purpose (WEBGL_lose_context), and the
  // browser gives it back empty. A context lost for real is waited for.
  let used = false, retiring = null, back = null;
  const once = type => new Promise(resolve => heroCanvas.addEventListener(type, resolve, { once: true }));
  heroCanvas.addEventListener('webglcontextlost', e => {
    e.preventDefault();                      // so that the browser may give it back
    if (stats && !retiring) stats.lost++;
    back = once('webglcontextrestored');
    if (retiring) {
      const ext = retiring;
      retiring = null;
      setTimeout(() => ext.restoreContext(), 0);
      return;
    }
    console.error('Sky: the WebGL context was lost.');
    // Lost while drawing (a driver gave up, or the GPU was reset): start
    // again a level lower. (Lost while loading, the loading throws.)
    if (render && !restarting) fall(new Error('The WebGL context was lost while drawing.'));
  });
  async function freshContext() {
    if (!used) {
      used = true;
      return;
    }
    const gl = heroCanvas.getContext('webgl2');
    if (!gl) return;
    if (!gl.isContextLost()) {
      const ext = gl.getExtension('WEBGL_lose_context');
      if (!ext) return;                      // (the old level's work stays until it is collected)
      retiring = ext;
      const gone = once('webglcontextlost');
      ext.loseContext();
      await gone;
    }
    let late;
    await Promise.race([back, new Promise((resolve, reject) => {
      late = setTimeout(() => reject(new Error('The WebGL context was lost, and the browser did not give it back.')), 10000);
    })]).finally(() => clearTimeout(late));
  }

  // What failed at each level tried, for the message.
  const tried = [];
  const view = () => ({ yaw: state.yaw, pitch: state.pitch, heading: state.heading, climb: state.climb, bank: state.bank,
    fov: FOV, alt: state.alt, cloud: state.cloud, look: AIR_LOOK });
  // Makes the renderer at `level`, or the first level below it that starts.
  async function load() {
    for (;;) {
      try {
        await freshContext();
        const made = await makeSky(heroCanvas, view, {
          done, timed, wake: kick,
          // (The GPU's times only where they are used: the tools' pages
          // name a level, and their GL traces stay those of before.)
          gpuTimed: choice === 'auto' || stats ? gpuTimed : null,
          memory: stats && stats.memory,
          pictured: stats && (now => {
            stats.frames.push(now);
            stats.shown++;
            if (stats.after && stats.shown >= stats.after[0]) stats.after.splice(0)[1]();
            // (While frames wait for the GPU, timers may wait behind them:
            // the overlay is then brought up to date from here.)
            if (now - stats.shownAt > 1000) showStats();
          }),
          parts: stats && stats.parts,
          marks: stats && (stats.marks = []),
          shown: () => {
            hero.classList.add('shown');
            shownAt = performance.now();
            if (stats && stats.first === null) stats.first = shownAt;
            const at = level;
            setTimeout(() => {
              try { if (level === at && render) localStorage.removeItem('sky.qualityTrying'); } catch (err) {}
            }, QUALITY_OK_MS);
          },
          level: gl => {
            if (!level) level = lower(memo && named(memo.level) ? memo.level : guess(gl), ceiling);
            try { localStorage.setItem('sky.qualityTrying', level); } catch (err) {}
            showQuality();
            return level;
          },
        });
        if (!made) throw Object.assign(new Error('This browser gives no WebGL2.'), { none: true });
        return made;
      } catch (err) {
        console.error(err);
        tried.push(`${level || '?'}: ${String(err && err.message || err).trim()}`);
        if (err.none || !level || level === LEVELS[0]) throw Object.assign(new Error(tried.join('\n')), { none: err.none });
        level = below(level);
        steppedDown(level);
        showQuality();
        share = 0;
        loadingLine.style.setProperty('--done', 0);
      }
    }
  }
  // The loading failed at every level: its text says so, and stays, with
  // the reasons (a phone has no console to read) and the GPU's name.
  function fail(err) {
    const said = hero.querySelector('.loading p');
    said.dataset.t = err.none ? 'noWebGL' : 'failed';
    said.textContent = TEXT[LANG][said.dataset.t];
    hero.classList.remove('shown');
    hero.classList.add('failed');
    let why = hero.querySelector('.loading .why');
    if (!why) {
      why = document.createElement('pre');
      why.className = 'why';
      said.after(why);
    }
    let gpu = '';
    try {
      const g = heroCanvas.getContext('webgl2');
      const info = g && g.getExtension('WEBGL_debug_renderer_info');
      gpu = g ? String(g.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : g.RENDERER)) : 'no WebGL2';
    } catch (e) {}
    why.textContent = (String(err && err.message || err).trim().slice(0, 1600) + '\n' + gpu).trim();
    render = null;
    hero.dataset.sky = 'failed';
  }
  // A failure once the page draws: a level lower, or the message. (At the
  // lowest level, once a visit, the same level again: a phone's GPU process
  // may be reset by something else, and low drew before.)
  let again = false;
  function fall(err) {
    console.error(err);
    tried.push(`${level}: ${String(err && err.message || err).trim()}`);
    if (level === LEVELS[0] && !again) {
      again = true;
      restart(level, 'lostAgain');
    } else if (level === LEVELS[0]) fail(new Error(tried.join('\n')));
    else {
      steppedDown(below(level));
      restart(below(level), 'lost');
    }
  }
  // Another level, once the page draws: the loading state again, over the
  // dark, while it compiles and bakes.
  // (note: the loading's text meanwhile, a key of TEXT.)
  async function restart(to, note = 'loading') {
    if (restarting) return;
    restarting = true;
    const asked = choice;
    measure = null;
    render = null;
    level = to;
    if (choice === 'auto') remember();
    showQuality();
    hero.classList.remove('shown');
    hero.dataset.sky = 'loading';
    const said = hero.querySelector('.loading p');
    said.dataset.t = note;
    said.textContent = TEXT[LANG][note];
    share = 0;
    loadingLine.style.setProperty('--done', 0);
    try {
      render = await load();
      hero.dataset.sky = 'ready';
      said.dataset.t = 'loading';
      said.textContent = TEXT[LANG].loading;
    } catch (err) {
      fail(err);
    }
    restarting = false;
    update();
    // (A level chosen in the panel meanwhile.)
    if (render && choice !== asked && named(choice) && choice !== level) restart(choice);
  }
  // ---------- Debug ----------
  // ?debug=1 (or the I key, remembered like the HUD): the build, the address
  // that draws this view again, the renderer, the canvas and the frame time,
  // in a corner, so that a screenshot says how to see the same. Off, nothing
  // of it exists in the page but window.__debug and the key. window.__debug()
  // gives it all for the tools, on or off.
  const rounded = (x, n) => +(+x).toFixed(n);
  // The address of the view now, as the page reads it: every parameter that
  // shapes the picture. (Not ?expo: the page meters its own; it is shown.)
  function debugQuery() {
    const deg = x => rounded(((x / RAD) % 360 + 540) % 360 - 180, 2);
    const q = {
      date: rounded(state.day, 0), time: rounded(state.time, 3), clock: state.clock,
      lat: rounded(state.lat, 2), lon: rounded(state.lon, 2), alt: rounded(state.alt, 4),
      at: rounded(wrap(state.drift[0]), 3) + ',' + rounded(wrap(state.drift[1]), 3),
      yaw: deg(state.yaw), pitch: rounded(state.pitch / RAD, 2),
      heading: deg(state.heading), bank: rounded(state.bank / RAD, 2), climb: rounded(state.climb / RAD, 2),
      speed: rounded(state.speed, 1), cloud: rounded(state.cloud, 3), cirrus: rounded(state.cirrus, 3),
      haze: rounded(state.haze, 2), wind: rounded(state.wind, 1), moon: rounded(state.moonAge, 3),
      quality: level || (named(choice) ? choice : 'auto'), pixels: pixels.value,
      hud: hudOn ? 1 : 0, lang: LANG,
    };
    if (params.has('res')) q.res = params.get('res');
    return Object.entries(q).map(([k, v]) => k + '=' + v);
  }
  function debugData() {
    const gl = render ? heroCanvas.getContext('webgl2') : null;
    const info = gl && gl.getExtension('WEBGL_debug_renderer_info');
    const query = debugQuery().join('&'), E = window.__exposure;
    const meta = document.querySelector('meta[name="build"]');
    return {
      build: meta ? meta.content : 'dev', query, url: location.origin + location.pathname + '?' + query,
      renderer: gl ? String(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER)) : null,
      canvas: [heroCanvas.width, heroCanvas.height], css: [heroCanvas.clientWidth, heroCanvas.clientHeight],
      dpr: window.devicePixelRatio || 1, quality: level, choice,
      frameMs: debug.at && performance.now() - debug.at < 1000 ? rounded(debug.ms, 1) : null,
      exposure: typeof E === 'number' ? rounded(E, 3) : null,
    };
  }
  window.__debug = debugData;
  let debugBox = null, debugTimer = 0;
  function showDebug() {
    const d = debugData(), box = debugBox;
    box.head.textContent = `build ${d.build}\n${d.renderer || 'no renderer yet'}\n` +
      `canvas ${d.canvas.join('x')}, CSS ${d.css.join('x')}, DPR ${rounded(d.dpr, 2)}\n` +
      `quality ${d.quality || '-'}${d.choice === 'auto' ? ' (auto)' : ''}, ${d.frameMs === null ? 'at rest' : d.frameMs + ' ms a frame'}, ` +
      `exposure ${d.exposure === null ? '-' : d.exposure + ' (log2)'}`;
    // The line breaks after each &, not inside a number.
    box.line.replaceChildren(...d.query.split('&').flatMap((p, i) => [document.createTextNode((i ? '&' : '?') + p), document.createElement('wbr')]));
    box.url = d.url;
  }
  function copyDebugUrl() {
    const text = debugData().url, done = () => { debugBox.button.textContent = 'Copied'; setTimeout(() => { if (debugBox) debugBox.button.textContent = 'Copy URL'; }, 1500); };
    const old = () => {
      const t = document.createElement('textarea');
      t.value = text;
      t.style.cssText = 'position:fixed;opacity:0';
      document.body.append(t);
      t.select();
      try { if (document.execCommand('copy')) done(); } catch (err) {}
      t.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, old);
    else old();
  }
  function setDebug(on, keep) {
    debug.on = on;
    document.body.classList.toggle('debugging', on);
    if (on && !debugBox) {
      const el = document.createElement('div');
      el.className = 'debug';
      const head = document.createElement('div'), line = document.createElement('span'), button = document.createElement('button');
      line.className = 'q';
      button.type = 'button';
      button.textContent = 'Copy URL';
      button.addEventListener('click', copyDebugUrl);
      el.append(head, line, button);
      document.body.append(el);
      debugBox = { el, head, line, button, url: '' };
    }
    if (debugBox) debugBox.el.hidden = !on;
    clearInterval(debugTimer);
    debug.at = 0;
    if (on) {
      showDebug();
      debugTimer = setInterval(showDebug, 300);
    }
    if (keep) try { localStorage.setItem('sky.debug', on ? '1' : '0'); } catch (err) {}
  }
  {
    const asked = params.get('debug');
    let stored = null;
    try { stored = localStorage.getItem('sky.debug'); } catch (err) {}
    if (asked === '1' || asked === '0' ? asked === '1' : stored === '1') setDebug(true, false);
  }

  // After the first paint: an animation frame runs before it, a message after.
  nextFrame()
    .then(nextFrame)
    .then(() => new Promise(resolve => {
      const channel = new MessageChannel();
      channel.port1.onmessage = resolve;
      channel.port2.postMessage(0);
    }))
    .then(load)
    .catch(err => {
      fail(err);
      return null;
    })
    .then(made => {
      render = made;
      loaded = true;
      hero.dataset.sky = made ? 'ready' : 'failed';
      if (choice === 'auto' && made) remember();
      kick();
      // A time-lapse asked for in the address starts now, not during the loading.
      if (playing) {
        if (pace !== 1) last = performance.now();
        schedule();
      }
      showIntro();
      wake();
    });
})();
</script>
</body>
</html>
