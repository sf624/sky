    vec3 ol = depthToTop(o, uSun);
    for (int k = 0; k < 3; k++) {
      // Only the glare is new here: G already holds the sun's disc or its
      // glitter, and L has it.
      vec4 g = uSunI * glare * smoothstep(0.9, 0.93, mu) * exp(-(uBR[k] * ol.x + extM * uMA[k] * ol.y + uBO[k] * ol.z));
      G[k] += g;
      L[k] += g;
    }
  }

  vec3 col = ISUN * vec3(
    dot(uWR[0], L[0]) + dot(uWR[1], L[1]) + dot(uWR[2], L[2]),
    dot(uWG[0], L[0]) + dot(uWG[1], L[1]) + dot(uWG[2], L[2]),
    dot(uWB[0], L[0]) + dot(uWB[1], L[1]) + dot(uWB[2], L[2]));
  col = max(col, 0.0);                               // colours outside sRGB
  // The eye at night (after Krawczyk, Myszkowski and Seidel, 2005). Below
  // a few cd/m2 the rods take over from the cones, and colours fade into
  // the grey of what the rods see, which favours blue-green over red (the
  // Purkinje shift): moonlit clouds and the moon's glitter are grey to the
  // eye, and the moonlit sky a dark grey-blue, where a long exposure shows
  // them in the colours of sunlight. The rods' share falls from 1 to 0 as
  // the pixel's luminance goes from MESOPIC.x to MESOPIC.y cd/m2 (a
  // smoothstep in its log: the eye's mesopic range), as the night eye
  // comes in. So the full moon's clouds (about 0.07 cd/m2) are mostly
  // grey, not tan. Their grey is a little blue, as the night looks (the
  // "blue shift" of Jensen et al., 2001), but less: neutral grey read as a
  // black and white photograph.
  float rodShare = 0.0;
  if (uNightEye > 0.0) {
    float rods = ISUN * (dot(uWS[0], L[0]) + dot(uWS[1], L[1]) + dot(uWS[2], L[2]));
    float cd = CD * dot(col, vec3(0.2126, 0.7152, 0.0722));
    float wide = 1.0 - smoothstep(log(MESOPIC.x), log(MESOPIC.y), log(max(cd, 1e-12)));
    rodShare = uNightEye * mix(ROD_HALF / (ROD_HALF + cd), wide, uNightGrey);
    // A full moon's sky is dark but blue to the eye, where a quarter moon's
    // is grey: at the top of the rods' range the grey of blue light turns
    // blue (ROD_BLUE), as its luminance goes from SKY_BLUE.x to SKY_BLUE.y.
    // Only light bluer than the rods' grey: the sky, and the sea that
    // mirrors it; the moonlit clouds and the glitter stay grey.
    float bluer = col.r > 0.0 ? smoothstep(0.0, 0.3, col.b / col.r * (ROD_TINT.r / ROD_TINT.b) - 1.0) : 0.0;
    float blue = uNightGrey * bluer * smoothstep(log(SKY_BLUE.x), log(SKY_BLUE.y), log(max(cd, 1e-12)));
    vec3 tint = mix(ROD_TINT, ROD_BLUE, blue);
    col = mix(col, max(rods, 0.0) * tint, rodShare);
  }
  // The meter counts the sun's disc and glare and its glitter on the sea
  // (G) at METER_GLINT of their light: a camera lets the sun and its mirror
  // image run into white and exposes for the rest. Photographs from the air
  // keep the sky as light facing the sun as away from it, with the glitter
  // white; and as a low sun dims in the haze, the picture does not grow
  // brighter for it.
  float glintY = ISUN * dot(vec3(0.2126, 0.7152, 0.0722), vec3(
    dot(uWR[0], G[0]) + dot(uWR[1], G[1]) + dot(uWR[2], G[2]),
    dot(uWG[0], G[0]) + dot(uWG[1], G[1]) + dot(uWG[2], G[2]),
    dot(uWB[0], G[0]) + dot(uWB[1], G[1]) + dot(uWB[2], G[2])));
  float metered = dot(col, vec3(0.2126, 0.7152, 0.0722)) - (1.0 - METER_GLINT) * glintY;
  float level = (log2(max(metered, 1e-30)) - uLogRange.x) / (uLogRange.y - uLogRange.x);
  col *= uExposure;
  // No shoulder that keeps the hue: each channel meets the curve below on
  // its own, as on a camera's sensor. A bright orange band of twilight
  // then runs into white at its strongest channel first, and comes out
  // yellow at its core, orange at its edges and pale above, as in
  // photographs; pressed together as a whole, it stayed a thin saturated
  // red-orange line.
  // A camera's white balance: for daylight, sunlit cloud, a little yellow on
  // a screen whose white is D65, comes out white, and the sea a deeper blue;
  // in twilight it adapts in part to the light of the sky (balanceFor).
  col *= uBalance;
  // A camera's colour by day: deeper than the light's. The sky from the air
  // is a strong azure in photographs (in linear light, red a tenth of the
  // blue or less), where the light of the sky gives a quarter. Channels
  // pushed below zero are cut.
  float y0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = max(y0 + uSaturation * (col - y0), 0.0);
  // Light far too strong for the screen turns white, as on film, instead
  // of a flat saturated colour (the glitter of a low sun would be yellow).
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col, vec3(lum), 0.85 * smoothstep(1.0, 6.0, lum));

  // A "look", not physics: a per-channel power deepens the colour, as film does.
  // What the rods see takes the power on its luminance alone: the look
  // deepens the tones but adds no colour that the eye does not see. And it
  // is steeper (NIGHT_LOOK, the same at LOOK_PIVOT, about the moonlit
  // clouds): the night eye's view has black in it, the dark sea and the
  // sky away from the moon, where the gentler curve left a grey veil.
  vec3 looked = pow(col, vec3(uLook));
  if (rodShare > 0.0) {
    float yl = max(dot(col, vec3(0.2126, 0.7152, 0.0722)), 1e-30);
    // As the eye adapts to a darker night it is steeper still, about a
    // lower level (DARK_LOOK, DARK_PIVOT): on a moonless night the Milky
    // Way, the zodiacal light and the stars stand out as the dark-adapted
    // eye sees them; under a moon, with the gentler curve, the moonlit sky
    // lies over them. One curve for everything, set by the adaptation.
    float dark = smoothstep(DARK_EYE.x, DARK_EYE.y, log2(uExposure));
    float n = mix(uLook, mix(NIGHT_LOOK, DARK_LOOK, dark), rodShare);
    float pivot = LOOK_PIVOT * pow(DARK_PIVOT / LOOK_PIVOT, dark);
    looked = mix(looked, col * pow(yl, n - 1.0) * pow(pivot, uLook - n), rodShare);
  }
  // Tone mapping: 1 - exp(-col) up to the knee (SHOULDER.x); above it the
  // shoulder falls off as a power (SHOULDER.y) instead of exponentially, so
  // that lit cloud keeps its gradation some two stops further up, and only
  // far brighter light (the sun's glow, glints) runs into white. The two
  // meet with the same value and slope.
  col = 1.0 - exp(-min(looked, SHOULDER.x)) * pow(1.0 + max(looked - SHOULDER.x, 0.0) / SHOULDER.y, vec3(-SHOULDER.y));
  col = pow(col, vec3(1.0 / 2.2));                   // display encoding
  // How far is what this pixel shows? As far as the clouds, if they hide
  // enough of what is behind or give enough of its light, or else as far
  // as the sea; the sky is infinitely far. A thin sheet counts when nothing
  // else is there, or when it hides the rest.
  float wCloud = tBar > 0.0 ? (1.0 - Tc) * (cloudsFirst ? 1.0 : Th) : 0.0;
  float wHigh = tHigh > 0.0 ? (1.0 - Th) * (cloudsFirst ? Tc : 1.0) : 0.0;
  // A wisp that hides little of the dark sea still gives much of the
  // light. Counted as sea, that light would stay on the sea while the
  // cloud flies past, and trail behind a near cloud in streaks.
  bool cloudLight = dot(C[1], vec4(1.0)) > 0.05 * dot(L[1], vec4(1.0));
  float tSeen = tBar > 0.0 && (wCloud > 0.1 || cloudLight) ? tBar : ground ? tmax : -1.0;
  // Against the sky, a sheet too thin to hide much still gives much of the
  // light, and its streaks would smear if they stayed put: it counts by
  // its share of the light (the sun, the moon and stars behind it, by far
  // the brighter, stay put). By degrees: the pixel moves with the sheet by
  // that share, from 0.05 to 0.3 of the light, as if the sheet were that
  // much farther. (Moved with the sheet from a share of 0.1 on, next to
  // the sun, where the glare is most of the light and falls off steeply,
  // the pixels past that share took their past from where the sheet was,
  // with the glare of another angle from the sun: in flight, a dark or
  // bright band hugged the glow there, with an edge, issue #54.)
  // The rest of such a pixel's light, the sky, the glare and the sun
  // behind the sheet, stays put, yet moves with the pixel: `astray`, its
  // share, goes with the distance (in the fraction of the depth below the
  // code's step), and the mean holds the past of that light to this frame
  // around the pixel as far as it slips (see `mean`).
  float astray = 0.0;
  if (tSeen < 0.0 && tHigh > 0.0) {
    float lit = dot(H[1], vec4(1.0)) / max(dot(L[1], vec4(1.0)), 1e-30);
    float share = smoothstep(0.05, 0.3, max(wHigh, lit));
    if (share > 0.0) {
      tSeen = tHigh / share;
      astray = clamp(1.0 - lit, 0.0, 1.0);
    }
  } else if (wHigh > 0.5) tSeen = tHigh;
  gl_FragDepth = distanceCode(tSeen) + 0.75 / 65536.0 * astray;
  // The frame is kept in steps (of half floats, or of 8 bits). Rounded to
  // the nearest, a smooth sky would come out in bands; rounded down, it
  // would be too dark. So round up or down at random, anew each frame:
  // then the mean over the frames is right. The same for the level.
  outColor = floor(clamp(vec4(col, level), 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass)) / uSteps;
}
#endif
#endif
</script>

<script id="mean" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;

// The picture of the aircraft's view is a mean over frames: one frame is
// noisy (its rays cross the pixels and step through the clouds at random).
// This shader joins a new frame to the picture so far. While the view
// moves, each pixel finds what it shows now in that picture, where it was a
// frame ago.
uniform sampler2D uFrame;     // the new frame, as shown, and its level before exposure (a)
uniform sampler2D uFrameAux;  // the distance of what each pixel shows, coded (the depth, r)
uniform sampler2D uPast;      // the picture so far
uniform sampler2D uPastAux;   // its distances (r, g), and the number of frames in the mean / 64 (b)
uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform float uAlt;     // altitude of the eye, km
uniform mat3 uCamPast;  // the camera a frame ago
uniform vec2 uResPast;  // the size of the picture so far
uniform vec3 uWay;      // how far the eye has moved since, km
uniform float uTrust;   // the most frames a pixel's past may count for
uniform float uSteps;   // the picture is kept in steps of 1 / uSteps
uniform float uPass;    // the number of the frame
#ifdef UPSCALE
// The frame is smaller than the picture (a quality level's `frame`): each
// of its rays crosses its pixel at uJitter (in its pixels, -0.5 to 0.5),
// and the picture takes each ray where it fell, by how near it fell to
// the picture's pixel. Over the frames the rays fall all over the pixels,
// and a still picture comes out as sharp as the picture's own size.
uniform vec2 uJitter;
uniform vec2 uFrameRes;   // the part of uFrame drawn (its texture is as large as at full scale)
#endif
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;

const float RG = 6360.0;        // ground radius, km

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// The code of a distance (see distanceCode in the other shader) as one
// number from 0 to 1, and one over the distance (km; 0: infinitely far).
float decode(vec2 c) {
  return (floor(c.x * 255.0 + 0.5) * 256.0 + floor(c.y * 255.0 + 0.5)) / 65535.0;
}
float nearness(float code) {
  return code > 0.995 ? 0.0 : exp2((0.5 - code) * 20.0);
}

#ifdef KEYS
// Keys' six-point cubic convolution kernel (R. G. Keys, "Cubic convolution
// interpolation for digital image processing", 1981): it passes a cubic
// through unchanged, and at any offset it lets no wave through stronger than
// it came, so read frame after frame it neither rings nor grows.
float keys6(float x) {
  x = abs(x);
  return x < 1.0 ? (4.0 / 3.0 * x - 7.0 / 3.0) * x * x + 1.0
       : x < 2.0 ? ((-7.0 / 12.0 * x + 3.0) * x - 59.0 / 12.0) * x + 2.5
       : x < 3.0 ? ((x / 12.0 - 2.0 / 3.0) * x + 1.75) * x - 1.5 : 0.0;
}
#endif

// Where in the picture so far (0 to 1; outside: nowhere) was what this pixel
// shows, if that is at one over inv km from the eye (0: infinitely far)?
// Clouds and sea have come nearer by the eye's way since, at the same height
// above the ground; the sky stays (the air rides with the eye). The camera
// of that frame says which pixel it was.
vec2 whence(float inv) {
  vec3 q = normalize(uCam * vec3((gl_FragCoord.xy * 2.0 - uRes) * uTan / uRes.y, 1.0));
  if (inv > 0.0) {
    q /= inv;
    q += vec3(uWay.x, uWay.y - dot(2.0 * q.xz + uWay.xz, uWay.xz) / (2.0 * (RG + uAlt + q.y)), uWay.z);
  }
  q = q * uCamPast;
  return q.z > 0.0 ? 0.5 + 0.5 * q.xy / (q.z * uTan) * vec2(uResPast.y / uResPast.x, 1.0) : vec2(-1.0);
}

void main() {
#ifdef UPSCALE
  // The ray of the frame that fell nearest this pixel's middle, and its
  // weight: 1 on the middle, 0.13 a pixel of the picture off.
  vec2 fsize = uFrameRes, tsize = vec2(textureSize(uFrame, 0)), ratio = fsize / uRes, fp = gl_FragCoord.xy * ratio;
  ivec2 here = clamp(ivec2(floor(fp - uJitter)), ivec2(0), ivec2(fsize) - 1);
  vec2 off = (vec2(here) + 0.5 + uJitter - fp) / ratio;
  float weight = exp(-2.0 * dot(off, off)), count = -1.0;
#else
  ivec2 here = ivec2(gl_FragCoord.xy);
#endif
  vec4 col = texelFetch(uFrame, here, 0);
#ifdef UPSCALE
  // While the view moves, the frame read through the GPU's filter where its
  // rays fell, all pixels alike: all of a frame's rays fall at the same place
  // in their pixels, and weighed by it, the picture's pixels took turns
  // following the noisy frames, in a fine grid that showed in flight.
  vec4 filtered = textureLod(uFrame, clamp(fp - uJitter, vec2(0.5), fsize - 0.5) / tsize, 0.0);
  if (uTrust < 62.5) {
    col = filtered;
    weight = 0.5;
  }
#endif
  // The code, and the share of the pixel's light that is not as far as it
  // says (astray: the sky behind a thin sheet, see the other shader).
  float raw = texelFetch(uFrameAux, here, 0).r * 65536.0;
  float code = floor(raw) / 65535.0, astray = fract(raw) / 0.75;
  float inv = nearness(code);
  // Things at different distances pass each other as the eye moves: by
  // `parallax` pixels a frame for a difference of 1 in one over the distance.
  float parallax = length(uWay) * uRes.y / (2.0 * uTan);
  vec2 st = whence(inv);
  // If something nearer was there, this pixel may show its ragged edge,
  // where one frame hits the cloud and the next misses it. Then look where
  // that nearer thing was: for a miss, it leads to the same edge; for sea
  // that the cloud has just uncovered, to the sea next to the cloud.
  if (uTrust > 0.0 && parallax > 0.0 && st == clamp(st, 0.0, 1.0)) {
    float invWas = nearness(decode(textureLod(uPastAux, st, 0.0).rg));
    if (parallax * (0.8 * invWas - inv) > 0.1) st = whence(invWas);
  }

  // The mean of n frames takes this one as the next. Without a past (the
  // first frame, a pixel that comes into view), this frame is the picture.
  float n = 0.0, codeNow = code;
  if (uTrust > 0.0 && st == clamp(st, 0.0, 1.0)) {
    // Read the picture so far through a Catmull-Rom filter (nine bilinear
    // reads: Jimenez, 2016): a bilinear read, frame after frame, would
    // blur it.
    // The weights and reads follow MJP's Tex2DCatmullRom.hlsl gist (MIT): see THIRD_PARTY_NOTICES.md.
    vec2 size = vec2(textureSize(uPast, 0));
    vec2 pos = st * size - 0.5;
    vec2 i = floor(pos), f = pos - i;
#ifdef KEYS
    // (KEYS, the levels that draw the frame at the picture's size: Keys'
    // six-point cubic over 6 by 6 texels, in 25 bilinear reads, the two
    // middle texels of each row and column in one. In flight each pixel's
    // past is read again every frame, and what one read loses, the next
    // loses again: through Catmull-Rom, a picture of 2560 by 1440 kept 62 %
    // of the detail 3.5 to 5 pixels across that a still at the place reached
    // has, and through this, 75 %. Sharper kernels, Lanczos's of three lobes
    // among them, let some waves grow at some offsets, and in flight they
    // grew into a fine hatch.)
    float wx[5], wy[5], px[5], py[5];
    for (int k = 0; k < 2; k++) {
      float g = k == 0 ? f.x : f.y, c = k == 0 ? i.x : i.y, s = k == 0 ? size.x : size.y;
      float wc = keys6(g), wd = keys6(1.0 - g);
      float w[5] = float[5](keys6(g + 2.0), keys6(g + 1.0), wc + wd, keys6(2.0 - g), keys6(3.0 - g));
      float p[5] = float[5](c - 1.5, c - 0.5, c + 0.5 + wd / (wc + wd), c + 2.5, c + 3.5);
      for (int j = 0; j < 5; j++) {
        if (k == 0) { wx[j] = w[j]; px[j] = p[j] / s; } else { wy[j] = w[j]; py[j] = p[j] / s; }
      }
    }
    vec4 was = vec4(0.0);
    for (int b = 0; b < 5; b++) {
      vec4 row = vec4(0.0);
      for (int a = 0; a < 5; a++) row += textureLod(uPast, vec2(px[a], py[b]), 0.0) * wx[a];
      was += row * wy[b];
    }
#else
    vec2 w0 = f * (-0.5 + f * (1.0 - 0.5 * f));
    vec2 w1 = 1.0 + f * f * (-2.5 + 1.5 * f);
    vec2 w2 = f * (0.5 + f * (2.0 - 1.5 * f));
    vec2 w3 = f * f * (-0.5 + 0.5 * f);
    vec2 w12 = w1 + w2;
    vec2 c0 = (i - 0.5) / size, c12 = (i + 0.5 + w2 / w12) / size, c3 = (i + 2.5) / size;
    vec4 was = (textureLod(uPast, vec2(c0.x, c0.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c0.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c0.y), 0.0) * w3.x) * w0.y
             + (textureLod(uPast, vec2(c0.x, c12.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c12.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c12.y), 0.0) * w3.x) * w12.y
             + (textureLod(uPast, vec2(c0.x, c3.y), 0.0) * w0.x
              + textureLod(uPast, vec2(c12.x, c3.y), 0.0) * w12.x
              + textureLod(uPast, vec2(c3.x, c3.y), 0.0) * w3.x) * w3.y;
#endif
    // The filter overshoots at edges: stay within the four texels around.
    // They also tell how many frames the mean has, and how far away the
    // pixel's past was.
    ivec2 last = ivec2(size) - 1;
    vec4 lo = vec4(1e9), hi = vec4(-1e9);
    float codeWas = 0.0;
    for (int k = 0; k < 4; k++) {
      ivec2 t = clamp(ivec2(i) + ivec2(k & 1, k >> 1), ivec2(0), last);
      vec4 c = texelFetch(uPast, t, 0);
      lo = min(lo, c);
      hi = max(hi, c);
      vec4 aux = texelFetch(uPastAux, t, 0);
      vec2 g = mix(1.0 - f, f, vec2(k & 1, k >> 1));
      n += g.x * g.y * 64.0 * aux.b;
      codeWas += g.x * g.y * decode(aux.rg);
    }
    was = clamp(was, lo, hi);
    // Is the past what the pixel shows now? Not if it was nearer or further
    // by enough to slip a fraction of a pixel since. Then the past only
    // counts as far as it looks like this frame around the pixel. At the
    // ragged edge of a cloud both cloud and sea are around, and the mean
    // goes on. Nor is it, for the light that stays put (astray) in a pixel
    // that moves: that light slips by the pixel's own way. Next to the sun,
    // under a thin sheet near the eye, the glare and the sun's disc slipped
    // so by pixels a frame, and in flight the disc drew a streak and the
    // glow banded copies of its edge.
    float invWas = nearness(codeWas);
    float doubt = smoothstep(0.1, 0.3, parallax * max(max(abs(inv - invWas) - 0.2 * max(inv, invWas), 0.0), astray * inv));
    if (doubt > 0.0) {
#ifdef UPSCALE
      ivec2 edge = ivec2(uFrameRes) - 1;
#else
      ivec2 edge = textureSize(uFrame, 0) - 1;
#endif
      lo = col;
      hi = col;
      for (int k = 0; k < 9; k++) {
        vec4 c = texelFetch(uFrame, clamp(here + ivec2(k % 3 - 1, k / 3 - 1), ivec2(0), edge), 0);
        lo = min(lo, c);
        hi = max(hi, c);
      }
      vec4 fit = clamp(was, lo, hi);
      vec3 off = abs(fit.rgb - was.rgb);
      // A past that had to change much was something else: begin again.
      float other = doubt * smoothstep(0.02, 0.1, max(off.r, max(off.g, off.b)));
      was = mix(was, fit, doubt);
      n = mix(n, min(n, 1.0), other);
      codeWas = mix(codeWas, code, other);
    }
    n = any(isnan(was)) ? 0.0 : min(n, uTrust);
#ifdef UPSCALE
    if (n > 0.0) {
      col = mix(was, col, weight / (n + weight));
      codeNow = min(code, mix(codeWas, code, weight / (n + weight)));
      count = n + weight;
    }
#else
    if (n > 0.0) {
      col = mix(was, col, 1.0 / (n + 1.0));
      // A cloud's distance stays after a miss, and fades only as fast as
      // its light does in the mean. While the picture still holds a near
      // cloud's light, the pixel moves with that cloud; once the cloud has
      // gone, the past is in doubt (above) and its light is let go. Faded
      // sooner, the light would stay behind on the sea, in streaks.
      codeNow = min(code, mix(codeWas, code, 1.0 / (n + 1.0)));
    }
#endif
  }
#ifdef UPSCALE
  // Without a past, the frame read through the GPU's filter where its rays
  // fell, as one frame's worth: a sharper ray soon takes over.
  if (count < 0.0) {
    col = filtered;
    count = 0.5;
  }
#endif
  // Round up or down at random, as the other shader does, so that the mean
  // neither stops moving nor sinks.
  outColor = floor(clamp(col, 0.0, 1.0) * uSteps + hash(gl_FragCoord.xy + 31.7 * uPass + 5.3)) / uSteps;
  float c = floor(codeNow * 65535.0 + 0.5), high = floor(c / 256.0);
#ifdef UPSCALE
  // (The count grows by weights: rounded up or down at random to the 8
  // bits' steps, so that small weights still count.)

float hash(vec2 p) {

precision highp float;
precision highp int;
precision highp sampler2D;

// than the picture (a screen finer than the drawing limit, or a picture
// drawn smaller while the view moves), in two passes at the canvas's size:
// an edge-adaptive enlargement into a texture, then (SHARPEN) a sharpening
// with the dither, to the canvas. Both after AMD's FidelityFX Super

// picture is as shown (after the exposure and the tone curve), as both
// expect.

uniform vec2 uSize;           // of the canvas

uniform float uSharp;   // how much: 1 the most, each halving a stop less
uniform float uDither;  // 0 when the picture is rounded to 8 bits already
#endif
out vec4 outColor;

vec3 at(ivec2 p) {
  return texelFetch(uPicture, clamp(p, ivec2(0), textureSize(uPicture, 0) - 1), 0).rgb;
}
// (Twice a luma, cheaply: all the enlargement needs.)
float luma(vec3 c) {
  return 0.5 * (c.r + c.b) + c.g;
}

#ifdef SHARPEN
// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// four neighbours, by as much as keeps it within 0 and 1 where they are
// near either (so it never clips and rings little), and by less where it
// stands alone against them (noise, a star: those are not edges).

  edge(dir, len, pp.x * (1.0 - pp.y), cL, fL, gL, hL, kL);
  edge(dir, len, (1.0 - pp.x) * pp.y, fL, iL, jL, kL, nL);

  tap(sum, weight, vec2(1.0, 0.0) - pp, dir, len2, lob, clip, g);
  tap(sum, weight, vec2(2.0, 0.0) - pp, dir, len2, lob, clip, h);
  tap(sum, weight, vec2(-1.0, 1.0) - pp, dir, len2, lob, clip, i);
  tap(sum, weight, vec2(0.0, 1.0) - pp, dir, len2, lob, clip, j);
  tap(sum, weight, vec2(1.0, 1.0) - pp, dir, len2, lob, clip, k);
  tap(sum, weight, vec2(2.0, 1.0) - pp, dir, len2, lob, clip, l);
  tap(sum, weight, vec2(0.0, 2.0) - pp, dir, len2, lob, clip, n);

  outColor = vec4(clamp(sum / weight, min(min(f, g), min(j, k)), max(max(f, g), max(j, k))), 1.0);

precision highp float;
precision highp int;
precision highp sampler2D;

// picture, and holds the mean of its level (log2 of the luminance before
// exposure, coded from 0 to 1) at 4 x 4 points, in 16 bits over two 8-bit
// channels. The JS reads the blocks back and sets the exposure.
uniform sampler2D uPicture;
uniform vec2 uBlocks;   // the number of blocks across and up
out vec4 outColor;

void main() {
  vec2 size = vec2(textureSize(uPicture, 0));
  float sum = 0.0;
  for (int k = 0; k < 16; k++) {
    vec2 at = (floor(gl_FragCoord.xy) + (vec2(k & 3, k >> 2) + 0.5) / 4.0) / uBlocks * size;
    sum += texelFetch(uPicture, ivec2(at), 0).a;

  float c = floor(sum / 16.0 * 65535.0 + 0.5), high = floor(c / 256.0);
  outColor = vec4(high / 255.0, (c - 256.0 * high) / 255.0, 0.0, 1.0);
}

<script>
// Background sound, made in the browser with the Web Audio API: no files, no
// samples. Every part is noise or a tone, shaped by filters to stand for one
// source of the real sound. SkySound.engine(ctx) builds the graph on any
// BaseAudioContext (the tests render it offline); SkySound.attach(...) runs
// it in the page. It never asks for a frame: the page may stop drawing while
// the sound goes on.
const SkySound = (() => {
  'use strict';
  const KINDS = ['off', 'airliner', 'airliner-whine', 'wind'];
  // Strength of the engines' high tones in the airliner with engine whine
  // (1: soft, the level chosen by ear; 2: 6 dB stronger).
  const WHINE = 1;
  // The engines run at cruise thrust whatever the sliders say: the speed
  // slider is how fast the view goes by, not a throttle, and an airliner's
  // engines hold a steady speed in cruise. N1, the fan's speed as a fraction
  // of full, is 0.9; the fan shaft turns at 56 Hz.
  const N1 = 0.9, SHAFT = 62 * N1;
  const FADE = 0.15;          // time constant of fades and crossfades, s
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
  const between = (lo, hi) => lo + (hi - lo) * Math.random();

  function to(param, value, when, tau) {
    if (tau > 0) param.setTargetAtTime(value, when, tau); else param.setValueAtTime(value, when);
  }

  // What the sound needs to know of the flight, from the altitude (km) and the
  // speed (km/h). Density falls with a scale height of 8 km.
  function flight(alt, speed) {
    const sigma = Math.exp(-alt / 8), ref = Math.exp(-11 / 8);
    // Dynamic pressure, relative to the cruise (11 km, 900 km/h), with a light
    // wind that is there even when the aircraft stands still.
    const q = sigma / ref * ((speed / 900) ** 2 + 0.004);
    // The rush of air grows with the dynamic pressure, compressed (0.7 of its
    // level in dB) and softly held below +9 dB, so that low and fast stays
    // bearable: -17 dB standing still, -3 dB low and slow, +5 dB at 2400 km/h.
    const db = 7 * Math.log10(q);

      sigma,
      rush: 10 ** ((db > 0 ? 9 * Math.tanh(db / 9) : db) / 20),
      // A faster flow is brighter: the frequencies of the turbulence scale
      // with the speed.
      bright: Math.sqrt((speed + 60) / 960),
      // Thin air carries less of the low end: a shelf under 250 Hz, 0 dB at
      // 11 km, up to +7 dB near the ground.
      body: Math.min(7, Math.max(-3, 4 * Math.log2(sigma / ref))),

  //   play(kind, when): crossfade to a variation ('off' fades out);
  //   fly(alt, speed, when, glide): follow the flight (glide false: at once);
  //   volume(v, when, glide): 0 to 1;
  //   hush(quiet, when): fade the whole output out (true) or back in;
  //   tick(until): schedule the slow random movement (gusts, the beat of the
  //   engines) up to the time until. In the page, a timer calls it.

    // it repeats only when both loops line up again, which is never in

      }

    // overlaps others in frequency and would otherwise add to or cancel them,
    // as their filters shift the phase.

    // the compressor's knee -> a high-pass at 25 Hz (nothing below is heard,
    // and it would only work the compressor) -> a compressor with a short

        noise(...nodes) { bed.connect(nodes[0]); taps.push([bed, nodes[0]]); chain(...nodes, out); },

        // none: a sine) at the given frequency.
        tone(harmonics, frequency) {

          // the graph and its filters stop running.
          const timer = ctx.createConstantSource();
          timer.offset.value = 0;
          timer.connect(out.gain);

          timer.start(when);
          timer.stop(when + 0.01);

    // airliner with engine whine; strength scales their level. Per engine,
    // panned as the low drone:
    //   - the fan's blade-passing tone (24 blades: 1340 Hz) with its second
    //     and third harmonics;
    //   - "buzz-saw": at high power the fan's tips pass the speed of sound and

    //     irregular height, at half strength (they come in from N1 0.8 and

    // whine. The wall's mass law takes off the top: all of it is low-passed

    // together; the second runs 0.2 to 1 cent faster, so that the fan's line
    // beats once in 1.3 to 6.5 s (the whine at 3.5 kHz, 0.4 to 2 times a

    function highTones(k, strength) {

      k.chain(bus, wall, k.out);
      const whine = 3600 * (0.6 + 0.4 * N1);

        const fan = k.tone([1, 0.45, 0.25], 24 * SHAFT);
        k.chain(fan, k.gain(0.02), pan);
        const orders = Array.from({ length: 40 }, (_, i) => i < 7 ? 0 : 0.2 + 0.8 * Math.random() ** 2);
        const buzz = k.tone(orders, SHAFT);
        k.chain(buzz, k.filter('bandpass', 1100, 0.6), k.gain(0.015), pan);
        const comp = k.tone(null, whine);
        k.chain(comp, k.gain(0.004), pan);

      k.chain(k.late(k.filter('bandpass', 24 * SHAFT, 18)), k.gain(0.05), bus);

      } }];
    }

        // frequency (24 blades), faint through the wall.
        k.noise(k.filter('bandpass', 24 * SHAFT, 8), k.gain(0.025 * N1 ** 4));
        // Air conditioning: a steady hiss from the vents, 2 to 7 kHz.
        k.noise(k.filter('highpass', 1800), k.filter('lowpass', 7000), k.gain(0.0035));
        return {
          k,
          // Only the air follows the flight; the engines keep their cruise.
          set(f, when, glide) {
            to(rush.gain, 0.6 * f.rush, when, glide && 0.4);
            to(rushLp.frequency, 450 * f.bright, when, glide && 0.4);
            to(rushLp2.frequency, 1500 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.4);
            to(rumble.gain, 0.9 * f.rush * Math.sqrt(f.sigma / 0.25), when, glide && 0.4);
          },
          tracks: [
            // The second engine runs 8 to 22 cents faster: a beat of 0.3 to
            // 0.8 Hz on the shaft tone, more on its harmonics. (The whine's
            // lines keep their own, much smaller mismatch: at this one, the
            // fan tone, 24 times higher, would flutter at 7 to 19 Hz.)
            { every: [4, 10], at: (t, tau) => engines[1].detune.setTargetAtTime(between(8, 22), t, tau) },
            { every: [0.8, 3], at: (t, tau) => bump.gain.setTargetAtTime(Math.exp(0.3 * gauss()), t, tau) },
            { every: [2, 6], at: (t, tau) => drift.gain.setTargetAtTime(Math.exp(0.08 * gauss()), t, tau) },
            ...(whine > 0 ? highTones(k, whine) : []),
          ],
        };
      },
      // The same cabin, with more of the engines' high tones.
      'airliner-whine': () => voices.airliner(WHINE),

      // No engine: only the air, as from an open window or a glider. Gusts
      // come and go; thin and quiet high up, fuller low down.
      wind() {
        const k = kit();
        // The rush past the ears and the frame, low-passed; a gust makes it
        // both louder and brighter (the filter's detune follows the gust).
        const thin = k.filter('highpass', 60), bodyLp = k.filter('lowpass', 800, 0.5);
        const shelf = k.filter('lowshelf', 250), body = k.gain(), gust = k.gain(1);
        k.noise(thin, bodyLp, shelf, body, gust);
        // Buffeting: the low, irregular push of the wind, under 120 Hz, which
        // rises more than the rest in a strong gust.
        const buffet = k.gain(), heave = k.gain(1);
        k.noise(k.filter('lowpass', 110, 0.7), buffet, heave);
        // Whistles: air on an edge sings at a pitch set by its speed (vortex
        // shedding); two faint narrow bands that come and go.
        const whistles = [1, 1.62].map(r => {
          const bp = k.filter('bandpass', 700 * r, 22), g = k.gain(), on = k.gain(0);
          k.noise(bp, g, on);
          return { r, bp, g, on };
        });
        // Gusts: a slow swell (tens of seconds) with quicker gusts on top,
        // log-normal, so that strong ones are rare.
        let swell = 0;
        return {
          k,
          set(f, when, glide) {
            // Standing still, a breeze remains: 15 dB under the cruise at
            // 11 km, 9 dB under it near the ground.
            const rush = Math.max(f.rush, 0.18 * Math.sqrt(f.sigma / Math.exp(-11 / 8)));
            to(thin.frequency, 40 + 160 * (1 - f.sigma), when, glide && 0.6);
            to(bodyLp.frequency, 800 * f.bright, when, glide && 0.4);
            to(shelf.gain, f.body, when, glide && 0.6);
            to(body.gain, 0.55 * rush, when, glide && 0.4);
            to(buffet.gain, 1.3 * rush * f.sigma, when, glide && 0.4);
            for (const w of whistles) {
              to(w.bp.frequency, 700 * w.r * f.bright, when, glide && 0.6);
              to(w.g.gain, 0.25 * rush * Math.sqrt(f.sigma), when, glide && 0.6);
            }
          },
          tracks: [
            { every: [0.8, 2.6], at: (t, tau) => {
              swell = 0.9 * swell + 0.44 * gauss();
              const g = 0.33 * swell + 0.45 * gauss();
              gust.gain.setTargetAtTime(Math.exp(0.6 * g - 0.15), t, tau);
              heave.gain.setTargetAtTime(Math.exp(0.9 * g - 0.3), t, tau);
              bodyLp.detune.setTargetAtTime(300 * g, t, tau);
              for (const w of whistles) w.bp.detune.setTargetAtTime(250 * g, t, tau);
            } },
            ...[0, 1].map(i => ({ every: [1.5, 5], at: (t, tau) =>
              whistles[i].on.gain.setTargetAtTime(Math.random() < 0.35 ? between(0.3, 1) : 0, t, tau) })),
          ],
        };
      },
    };

    let now = flight(11, 900), voice = null, current = 'off';
    const live = new Set();
    return {
      get kind() { return current; },
      play(kind, when) {
        current = voices[kind] ? kind : 'off';
        if (voice) {
          // The old voice fades out, keeps its movement until it is silent,
          // and leaves the graph.
          to(voice.k.out.gain, 0, when, FADE);
          voice.end = when + 8 * FADE;
          voice.k.release(voice.end);
          voice = null;
        }
        if (!voices[kind]) return;
        voice = voices[kind]();
        voice.set(now, when, false);
        voice.end = Infinity;
        for (const tr of voice.tracks) tr.t = when;
        live.add(voice);
        voice.k.out.gain.setValueAtTime(0, when);
        to(voice.k.out.gain, 1, when, FADE);
      },
      fly(alt, speed, when, glide = true) {
        now = flight(alt, speed);
        if (voice) voice.set(now, when, glide);
      },
      volume(v, when, glide = true) { to(level.gain, v * v, when, glide && 0.05); },
      hush(quiet, when) { to(hushed.gain, quiet ? 0 : 1, when, 0.1); },
      tick(until) {
        for (const v of live) {
          const stop = Math.min(until, v.end);
          for (const tr of v.tracks) {
            while (tr.t < stop) {
              const step = between(...tr.every);
              tr.at(tr.t, step / 3);
              tr.t += step;
            }
          }
          if (v.tracks.every(tr => tr.t >= v.end)) live.delete(v);
        }
      },
    };
  }

  // Runs the sound in the page. Takes
  //   select, volume: the controls; their parents are hidden without Web Audio;
  //   note, volumeOut: <output>s, for the note that the sound waits for a
  //   click (waiting(): its text, in the page's language) and the volume;
  //   params: the address's URLSearchParams; aircraft(): { alt, speed } now.
  // Returns follow(), to call when the altitude or the speed changes, and
  // show(), to call when the language changes.
  function attach({ select, volume, note, volumeOut, waiting, params, aircraft }) {
    const AC = window.AudioContext;
    if (!AC) {
      select.parentElement.hidden = volume.parentElement.hidden = true;
      return { follow() {}, show() {} };
    }
    // The address, else the last choice, else off and half volume.
    let stored = [null, null];
    try { stored = [localStorage.getItem('sky.sound'), localStorage.getItem('sky.volume')]; } catch (err) {}
    let kind = [params.get('sound'), stored[0]].find(k => KINDS.includes(k)) || 'off';
    const v = [params.get('volume'), stored[1]].find(x => x !== null && x !== '' && isFinite(x));
    let vol = v === undefined ? 0.5 : Math.min(1, Math.max(0, +v));
    select.value = kind;
    volume.value = vol;
    let ctx = null, eng = null, timer = 0, gen = 0;
    const show = () => {
      note.textContent = kind !== 'off' && (!ctx || ctx.state !== 'running') && !document.hidden ? waiting() : '';
      volumeOut.textContent = Math.round(vol * 100) + ' %';
    };
    const tick = () => eng.tick(ctx.currentTime + 4);
    // Starts or resumes the context and the chosen variation. Browsers allow
    // sound only from a user gesture: this runs from one, or waits for one.
    function wake() {
      if (kind === 'off' || document.hidden) return;
      // Without a gesture yet, a new context would only be refused (and warn).
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      const my = ++gen;
      if (!ctx) {
        try { ctx = new AC({ latencyHint: 'playback' }); } catch (err) { return; }
        eng = engine(ctx);
        eng.volume(vol, 0, false);
        eng.fly(aircraft().alt, aircraft().speed, 0, false);
        ctx.onstatechange = show;
      }
      ctx.resume().then(() => {
        if (my !== gen) return;
        const t = ctx.currentTime;
        eng.hush(false, t);
        if (eng.kind !== kind) eng.play(kind, t);
        tick();
        clearInterval(timer);
        timer = setInterval(tick, 1000);
        show();
      }, () => {});
    }
    // Fades out, then suspends: nothing runs while it is off or hidden.
    function sleep(off) {
      const my = ++gen;
      if (!ctx || ctx.state !== 'running') return;
      const t = ctx.currentTime;
      if (off) eng.play('off', t); else eng.hush(true, t);
      setTimeout(() => {
        if (my !== gen) return;
        clearInterval(timer);
        ctx.suspend();
      }, off ? 1300 : 600);
    }
    for (const type of ['pointerdown', 'pointerup', 'keydown', 'click']) {
      window.addEventListener(type, () => { if (!ctx || ctx.state !== 'running') wake(); }, { capture: true, passive: true });
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) sleep(false); else wake(); show(); });
    select.addEventListener('change', () => {
      kind = select.value;
      try { localStorage.setItem('sky.sound', kind); } catch (err) {}
      if (kind === 'off') sleep(true); else wake();
      show();
    });
    volume.addEventListener('input', () => {
      vol = +volume.value;
      try { localStorage.setItem('sky.volume', vol); } catch (err) {}
      if (eng) eng.volume(vol, ctx.currentTime);
      show();
    });
    show();
    return { follow() { if (eng) eng.fly(aircraft().alt, aircraft().speed, ctx.currentTime); }, show };
  }

  return { engine, attach };
})();
</script>

<script>

  const DAY_OPEN = [3.5, 2.8], DAY_KM = [12, 20];   // in sunlight the eye opens up at most DAY_OPEN[0] stops past the exposure

  const MONO_RATE = [1, 0.8], MONO_STEP = 0.25;  // as the sun goes down, the exposure opens up at most MONO_RATE

  const MONO_DEEP = [-3, -6];                 // the first in civil twilight, the second from the sun MONO_DEEP[1] down

      const lf = Math.min(0.999, Math.max(0, 0.4 * 0.7 * (6.5 - mag) * Math.LN10 / LN_FLUX_MAX));
      // Colour: temperature from B-V (Ballesteros), then the slope of the
      // spectrum relative to the sun's.

      const tilt = Math.min(4, Math.max(-4, x / (1 - Math.exp(-x)) - 4.56));
      const texel = [v[0], v[1], v[2], Math.round((tilt + 4) / 8 * 63) + lf];
      // Two tangents, and the cells within reach of the star's disc.
      const a = Math.abs(v[2]) < 0.9 ? [-v[1], v[0], 0] : [0, -v[2], v[1]], al = Math.hypot(...a);
      const t1 = a.map(c => c / al);

      const ln = lf * LN_FLUX_MAX;
      // The disc reaches 3 radii; the spikes of a bright star reach further
      // (the shader's falloff, down to the level of the sky), up to 16 pixels.
      const reach = ln > 2.5 ? Math.min(16, 3 * Math.log(0.5 * Math.exp(ln)) + 2) * 3.5e-3
        : 3 * (0.7 + 0.04 * ln) * 2.5e-3;

      for (let ring = 1; ring * 0.012 < reach + 0.012; ring++) {
        const r = Math.min(ring * 0.012, reach);          // rings closer than a cell is wide
        for (let k = 0; k < 12; k++) {

          cells.add(starCell(v.map((q, j) => q + c * t1[j] + sn * t2[j])));

          starData.set(texel, ((cell - cell % GRID) * SLOTS + (cell % GRID) * SLOTS + fill[cell]++) * 4);

    }

  // The moonless night sky (airglow), in units of the sun's irradiance:
  // about 4e-8 of the daytime sky.
  const NIGHT = 8.59e-10;

  // How far twilight's ways have taken over from the day's, 0 to 1, as the
  // sun goes from DUSK[0] to DUSK[1] degrees (a smoothstep): the exposure
  // (exposureFor) and the white balance.
  const smooth01 = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

  // The white balance (uBalance). By day a camera's for daylight. In
  // twilight, as an automatic white balance does and as the eye adapts, it
  // goes BALANCE_ADAPT of the way (in log) towards the colour of the light
  // then falling on the level ground (the sea, the low air and the clouds),
  // from the sky alone once the sun is down, relative to that of the light
  // (sun and sky) with the sun at 30 degrees.
  // That light is blue and a little violet: without it the sky away from the
  // sun came out lavender and the Belt of Venus magenta near the sea, where
  // photographs show a pale blue sky and a pink belt. Blended in as the
  // sun goes from 2.5 to -0.5 degrees (BALANCE_IN), and out again as the sun goes from 4 to 9
  // degrees down (BALANCE_OUT): photographs of the deeper twilight are blue,
  // and a balance held there turned the sky grey and the clouds brown. And
  // out again with height, from BALANCE_HIGH[0] to BALANCE_HIGH[1] km: from
  // cruise the view is the high sky and the deck far below, which

  const sunThrough = (alt, mus, out) => {

  const lightOn = (alt, mus, out) => {
    const x = Math.min(1, Math.max(0, (mus - MS_MU_MIN) / (1 - MS_MU_MIN))) * (NMU - 1);
    const y = Math.sqrt(Math.min(1, Math.max(0, alt / (RT - RG)))) * (NH - 1);
    const i0 = Math.min(Math.floor(x), NMU - 2), j0 = Math.min(Math.floor(y), NH - 2), fx = x - i0, fy = y - j0;
    const k00 = (j0 * NMU + i0) * NW, k01 = k00 + NW, k10 = k00 + NMU * NW, k11 = k10 + NW;
    const sun = sunThrough(alt, mus, sunScratch);
    for (let w = 0; w < NW; w++) {

             + upData[k10 + w] * (1 - fx) * fy + upData[k11 + w] * fx * fy

    const k = BALANCE_ADAPT * smooth01((BALANCE_IN[0] - state.elev) / (BALANCE_IN[0] - BALANCE_IN[1])) * y * y * (3 - 2 * y) * z * z * (3 - 2 * z);
    if (k === 0) return DAY_BALANCE;

    return DAY_BALANCE.map((b, c) => b * (ref[c] / now[c]) ** k);

  // A camera's saturation (uSaturation): DAY_SATURATION by day, none from
  // the start of twilight's exposure on (DUSK), nor at night: the colours of
  // twilight, the glow and the night were set without it.
  const DAY_SATURATION = 1.3;

  // The eye at night (uNightEye): the rods' grey, the night's tone curve and

  // - and at night the eye opens up no further than it can: the exposure

  //   floor held the median at the same shown level from dusk down to a
  //   moonless night: a half moon's clouds came out nearly as light as by
  //   day, as in a long exposure, yet with the stars of a short one.
  // - and while the sun shines on the eye, the eye opens up no further
  //   than the sun's light lets it: the exposure (after all the above) is

  //   facing the sun, in the sun's light at the eye (sunlitLevel), at

  //   view, so turning the view does not move it; and on the sun as the
  //   eye sees it, not on its height over the ground's horizon: from 40 km
  //   the sun sets some 6 degrees below it, and until then its light
  //   barely dims (to a fifth at 4 degrees down, in the model's air). So
  //   the limit lifts by itself as the sun's light at the eye fades into
  //   the limb, and twilight's exposure then comes in as before. Up to the
  //   cruise heights no view comes near it: the darkest, the deep blue
  //   zenith from 11 km, stays 0.26 stops below or more. From DAY_KM[0] km
  //   up it closes to DAY_OPEN[1] at DAY_KM[1] km, a little above where a
  //   view with the sunlit Earth in it stands: above the cruise heights
  //   the sky over the eye is near space, and the eye, adapted to the sun
  //   and the sunlit Earth round it, sees it near black. Without it a
  //   view of the sky alone opened up 4.4 to 5 stops further at 40 km and
  //   1.2 to 1.6 at 20 km, and came out a clear dark blue, where
  //   photographs from the stratosphere show it near black. It bounds the
  //   exposure of the sun as it is, not the envelope of the sun higher:
  //   there it held the night down by up to 6 stops at 40 km.
  // Of the picture only its levels at five shares are needed: they are
  // sorted once, and the same view a stop brighter is the same shares a

  // The level (log2, as the meter reads it) of a white surface facing the

  // planet hides the sun.
  const ISUN = 20;   // the bare sun's luminance, as in the shader (ISUN in fs)
  const sunlit = new Float64Array(NW);
  function sunlitLevel(alt, e) {
    sunThrough(alt, Math.sin(e * RAD), sunlit);
    return Math.log2(ISUN / Math.PI * WY.reduce((a, y, w) => a + y * sunlit[w], 0));

  // The day's eye (see DAY_OPEN): the most the exposure may be, from the

  function dayEye() {
    const open = DAY_OPEN[0] + (DAY_OPEN[1] - DAY_OPEN[0]) * smooth01((state.alt - DAY_KM[0]) / (DAY_KM[1] - DAY_KM[0]));
    return WHITE + open - sunlitLevel(state.alt, state.elev);

    const tops = WHITE + SUNLIT_TOPS - sunlitLevel(state.alt, elev);
    const key = Math.max(KEY - EYE * low, Number.isFinite(tops) ? tops : -Infinity);
    // By day, the highlights near the sun count for less (st.lit), and

    const day = 1 - smooth01((DUSK[0] - elev) / (DUSK[0] - DUSK[1]));
    const lit = high + day * (st.lit - st.high);
    const white = WHITE - lit - DIM * Math.max(0, DAY_HIGH - lit);
    const floor = Math.min(key, KEY + MID_GAP - EYE * mid - DEEP * (1 - EYE) * (mid - NIGHT_LEVEL));
    const byDay = Math.max(Math.min(key, white), Math.min(floor, white + FLOOR_OVER * Math.max(0, DAY_HIGH - lit)));
    // The eye's limit (see NIGHT_OPEN), on the sky's level.
    const eye = NIGHT_OPEN - NIGHT_RATE * (Math.max(st.sky + d, LOG_RANGE[0]) - NIGHT_SKY);
    const dusk = smooth01((DUSK[0] - elev) / (DUSK[0] - DUSK[1])) * state.sunOn;
    if (dusk === 0) return Math.min(byDay, eye);

    const sky = Math.max(st.sky + d, NIGHT_LEVEL), peak = st.peak + d;

    const far = Math.max(0, (sky - nightMid) / (DUSK_MID - nightMid));
    const shown = nightShown + (DUSK_SHOWN - nightShown) * far ** DUSK_POW;
    const above = ABOVE * Math.min(1, Math.max(0, (DUSK[1] - elev) / ABOVE_SPAN));
    const byGlow = Math.max(WHITE + PEAK_ABOVE - peak - Math.min(DROP, DIM_BAND * Math.max(0, DAY_HIGH - peak)),

    const byDusk = Math.min(shown - sky, WHITE - high + above, byGlow);
    return Math.min(byDay + (byDusk - byDay) * dusk, eye);

  // log2 of the luminance of the air's mean light (msData) at height alt

  function airLevel(alt, e) {
    const mus = Math.sin(e * RAD);
    const x = Math.min(1, Math.max(0, (mus - MS_MU_MIN) / (1 - MS_MU_MIN))) * (NMU - 1);
    const y = Math.sqrt(Math.min(1, Math.max(0, alt / (RT - RG)))) * (NH - 1);
    const i0 = Math.min(Math.floor(x), NMU - 2), j0 = Math.min(Math.floor(y), NH - 2), fx = x - i0, fy = y - j0;
    let lum = 0;
    for (let w = 0; w < NW; w++) {
      lum += WY[w] * ((msData[msIndex(j0, i0, w)] * (1 - fx) + msData[msIndex(j0, i0 + 1, w)] * fx) * (1 - fy)
                    + (msData[msIndex(j0 + 1, i0, w)] * (1 - fx) + msData[msIndex(j0 + 1, i0 + 1, w)] * fx) * fy);

  // How much of the moon's light in the air (uMoonI) is drawn. By day the

  // step of the screen, and working it out costs a second light in every
  // march: it fades out as the moonlit air (the air's mean light, airLevel,
  // for each light) goes from MOON_AIR[1] to MOON_AIR[0] stops below the
  // sunlit air. That is 1/2000 to 1/16000 of the sky's light, a twentieth
  // of a step of the screen or less, so no switch shows. The moon itself,
  // its disc and its light on the clouds and the sea, is drawn at every hour.
  function moonAirFor() {

  const bandOf = (q, k, b) => {

    let s = 0, w = 0;
    for (let i = Math.max(0, Math.ceil((k - b) * n)); i <= Math.min(n, Math.floor((k + b) * n)); i++) {

    const lit = Float64Array.from(v, (x, i) => x + near[i]).sort();
    const st = { low: share(LOW_SHARE), high: bandOf(q, 1 - HIGH_SHARE, HIGH_BAND), mid: share(0.5), sky: share(DUSK_SHARE),
                 peak: bandOf(q, 1 - PEAK_SHARE, 0), lit: bandOf(lit, 1 - HIGH_SHARE, HIGH_BAND) };
    let E = exposureAt(st, state.elev, 0);
    if (state.elev < DUSK[0]) {
      const here = airLevel(state.alt, state.elev);
      const rate = MONO_RATE[1] + (MONO_RATE[0] - MONO_RATE[1]) * smooth01((state.elev - MONO_DEEP[1]) / (MONO_DEEP[0] - MONO_DEEP[1]));
      for (let e = state.elev + MONO_STEP; e < DUSK[0] + MONO_STEP; e += MONO_STEP) {
        const d = rate * (airLevel(state.alt, e) - here);
        E = Math.min(E, d + exposureAt(st, e, d));

    return Math.min(E, dayEye());

  // ---------- Drawing ----------
  // Camera basis as a column-major mat3: right, up, forward.
  const basis = (yaw, pitch) => {
    const f = [Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw)];
    const r = [Math.cos(yaw), 0, -Math.sin(yaw)];
    const u = [f[1] * r[2] - f[2] * r[1], f[2] * r[0] - f[0] * r[2], f[0] * r[1] - f[1] * r[0]];
    return [...r, ...u, ...f];
  };
  const camera = (yaw, pitch) => new Float32Array(basis(yaw, pitch));
  // The camera of a view from the aircraft (see view() below): the eye's
  // direction within the aircraft (yaw - heading, pitch), turned by the
  // aircraft's attitude: its heading, its climb (the nose up) and then its
  // bank (the right wing down, about the nose). Level, it is
  // camera(yaw, pitch) itself, to the last bit.
  // The aircraft's own axes: right (the right wing), up and forward (the
  // nose), for its heading, climb and bank.
  const airframe = v => {
    const a = basis(v.heading, v.climb);
    const cb = Math.cos(v.bank), sb = Math.sin(v.bank);
    const R = [0, 1, 2].map(i => a[i] * cb - a[3 + i] * sb), U = [0, 1, 2].map(i => a[3 + i] * cb + a[i] * sb);
    return [R, U, a.slice(6, 9)];
  };
  const cameraOf = v => {
    if (!v.bank && !v.climb) return camera(v.yaw, v.pitch);
    const [R, U, N] = airframe(v), e = basis(v.yaw - v.heading, v.pitch);
    const m = new Float32Array(9);
    for (let c = 0; c < 3; c++) {
      for (let i = 0; i < 3; i++) m[3 * c + i] = R[i] * e[3 * c] + U[i] * e[3 * c + 1] + N[i] * e[3 * c + 2];
    }
    return m;

  function countMemory(gl, memory) {

  // or the scissor's where it is on), into parts.draws and parts.pixels,
  // for ?stats: it wraps drawArrays, viewport and scissor on this context.
  function countDraws(gl, parts) {

  // Makes the renderer, a step at a time (see Loading below). Resolves to a
  // function that draws, render(fresh, now), or to null without WebGL2.
  // fresh: something has changed; now: the time of the frame, ms.
  // done(share) tells the loading state how far it has come (0 to 1);
  // shown() is called once, when the first picture has gone to the canvas.
  // level(gl): the quality level to draw at (a name of QUALITY), asked once
  // there is a context. timed(ms, scale): each frame that followed another,
  // its wall-clock time and its drawing scale (see the automatic choice).
  // pictured(now): each picture that has gone to the canvas.
  // parts: for ?stats, an object this renderer fills each frame: the
  // script's time in each part of a frame (lap), and the draws and the
  // pixels they shade (see countDraws).
  // gpuTimed(ms): the GPU's time for each frame drawn, where the GPU can
  // tell it (EXT_disjoint_timer_query_webgl2); asked only if given.
  // memory: an object whose `bytes` this renderer keeps up to date (its
  // textures, and the canvas's own buffers as 12 bytes a pixel), for ?stats.
  async function makeSky(canvas, view, { done, shown, level, timed, gpuTimed, memory, pictured, parts, marks, wake }) {
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
    if (!gl) return null;
    if (memory) countMemory(gl, memory);
    if (parts) countDraws(gl, parts);
    const levelName = level(gl), Q = QUALITY[levelName];
    // A context lost while the page loads (the GPU process restarted, or a
    // driver gave up on a program) ends the loading with an error: a fence
    // or a program would otherwise be waited for for ever.
    let lost = false;
    canvas.addEventListener('webglcontextlost', () => { lost = true; });
    // (What the loading was doing, for the message.)
    let doing = 'starting';
    const alive = () => {
      if (lost) throw new Error(`The WebGL context was lost (while ${doing}).`);
    };
    // ?timing in the address prints the parts of the loading to the
    // console as each ends (seconds since the page was opened), and every
    // 5 s what it still waits for: where the time goes on a stack that
    // compiles slowly (ANGLE on Direct3D 11, the usual one on Windows).
    const timing = new URLSearchParams(location.search).has('timing');
    // (With ?stats, the parts are kept for its overlay too: marks.)
    const mark = what => {
      if (timing) console.info(`Sky: ${what}, ${(performance.now() / 1000).toFixed(2)} s`);
      if (marks) marks.push([what, performance.now() / 1000]);

    mark('WebGL2 context made');
    // The extensions first: asking for one waits for the GPU process, which
    // is soon busy compiling.
    const parallel = gl.getExtension('KHR_parallel_shader_compile');
    // Seen aslant, a pixel covers a long strip of sea: where the GPU can,
    // it averages along the strip instead of blurring across it.
    const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
    const anisotropy = aniso && Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT));
    // A renderer without a GPU (SwiftShader, llvmpipe, Microsoft's Basic
    // Render Driver) would build the cirrus's ice for minutes: it builds it
    // a quarter as wide (40 m a texel), and the hairs drawn in the
    // scene make up for most of it. The name, not a timing, decides, so
    // that one renderer always draws the same.
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    const software = /swiftshader|llvmpipe|softpipe|software|basic render/i.test(gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    const iceSize = Math.min(Q.ice, software ? ICE_SOFT : ICE, gl.getParameter(gl.MAX_TEXTURE_SIZE));
    // The aircraft's view reads its tables through the GPU's filter: full
    // floats where it can filter them, else half floats (rounded to within 5e-4).
    const fullFloat = !!gl.getExtension('OES_texture_float_linear');
    // The frames and the pictures: half floats where the GPU can draw to those (see picture).
    let fine = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('EXT_color_buffer_float'));

    const LUT_MRT = Math.min(gl.getParameter(gl.MAX_DRAW_BUFFERS), gl.getParameter(gl.MAX_COLOR_ATTACHMENTS)) >= 7 ? 7 : 4;

    // one went until the GPU says it is done: with
    // KHR_parallel_shader_compile, the GPU process compiles them on threads
    // of its own while the page goes on (a large shader can take seconds).
    const programs = [];
    const names = new Map();
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    // The cirrus's layer: base and depth (km), form (0 a sheet, 1 fibres from heads, 2 small cells), size (km),
    // thick, ice. `ci=base,depth,form,size,thick,ice` sets them (a test; an empty place keeps its value).
    const CIRRUS_LAYER = [11.3, 2.0, 1.0, 0.6, 1.0, 1.0];
    (new URLSearchParams(location.search).get('ci') || '').split(',').forEach((t, i) => { if (i < 6 && t !== '' && Number.isFinite(+t)) CIRRUS_LAYER[i] = +t; });
    const CI_DBG = new URLSearchParams(location.search).get('cidbg');
    // The cirrus's generating field (uG2 in fs): fBm of gradient noise that
    // repeats with the tile, each size 2^(-1/3) of the one twice as large (a
    // spectral slope of -5/3); R the large sizes, G the small ones, B another
    // field of large sizes, each 0.5 + x / 6 for x of unit deviation. Made
    // in a worker, which starts here, while the programs compile: on the
    // main thread it held the first picture back by some 0.4 s. (Without
    // workers: here, when it is asked for.)
    const g2Field = () => {
      const N = 2048, data = new Uint8Array(N * N * 4);
      let seed = 12345;
      const rnd = () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

        const out = new Float32Array(N * N);
        for (let o = first; o < first + count; o++) {
          const n = 1 << o, s = N / n, amp = Math.pow(2, -o / 3);
          const gx = new Float32Array(n * n), gy = new Float32Array(n * n);
          for (let i = 0; i < n * n; i++) { const a = 6.2831853 * rnd(); gx[i] = Math.cos(a); gy[i] = Math.sin(a); }
          const i0 = new Int32Array(N), i1 = new Int32Array(N), fr = new Float32Array(N), fd = new Float32Array(N);
          for (let x = 0; x < N; x++) {
            const q = (x + 0.5) / s, i = Math.floor(q), f = q - i;
            i0[x] = i % n; i1[x] = (i + 1) % n; fr[x] = f; fd[x] = f * f * f * (f * (f * 6 - 15) + 10);
          }
          for (let y = 0; y < N; y++) {
            const j0 = i0[y] * n, j1 = i1[y] * n, fy = fr[y], v = fd[y], row = y * N;
            for (let x = 0; x < N; x++) {
              const a = i0[x], b = i1[x], fx = fr[x], u = fd[x];
              const n00 = gx[j0 + a] * fx + gy[j0 + a] * fy, n10 = gx[j0 + b] * (fx - 1) + gy[j0 + b] * fy;
              const n01 = gx[j1 + a] * fx + gy[j1 + a] * (fy - 1), n11 = gx[j1 + b] * (fx - 1) + gy[j1 + b] * (fy - 1);
              const p = n00 + u * (n10 - n00), q2 = n01 + u * (n11 - n01);
              out[row + x] += amp * (p + v * (q2 - p));
            }
          }
        }
        let m = 0, m2 = 0;
        for (let i = 0; i < N * N; i++) { m += out[i]; m2 += out[i] * out[i]; }
        m /= N * N;
        const k = 255 / 6 / Math.sqrt(Math.max(m2 / (N * N) - m * m, 1e-12));
        return [out, m, k];
      };
      [[0, 6], [6, 5], [1, 5]].forEach(([first, count], ch) => {
        const [f, m, k] = fbm(first, count);

    const g2Data = new Promise(resolve => {

    };

    // s: the cirrus's pass 8.6, the scene 8.2, the low clouds' pass 4.7, ice
    // 3.5; the GPU process compiles several at once). The cirrus's pass (see CIRRUS_PASS in fs)
    // and the ice program only if the page starts with cirrus (see

    let ciProg = state.cirrus > 0 ? link('fs', '#define CIRRUS_PASS') : null;
    const prog = link('fs');
    // fs as the low clouds' pass (see CLOUD_PASS).
    const cloudProg = link('fs', '#define CLOUD_PASS');
    const iceProgram = state.cirrus > 0 ? link('ice') : null;
    const noiseProgram = link('noise'), wavesProgram = link('waves');
    const mean = link('mean', [Q.frame < 1 ? '#define UPSCALE' : '', Q.keys ? '#define KEYS' : ''].filter(Boolean).join('\n')), show = link('show'), meter = link('meter');

    const shadowProg = link('fs', '#define SHADOW_MAP');
    // And as the map of the tops (see uTops), and as the sky's light on the
    // clouds (see uSkyLight).
    const topsProg = link('fs', '#define TOPS_MAP'), skyProg = link('fs', '#define SKY_LIGHT');

    const airProg = Q.airLut && fine ? link('fs', '#define AIR_LUT') : null;

    const enlarge = Q.enlarge && !NO_ENLARGE ? [link('enlarge'), link('enlarge', '#define SHARPEN')] : null;
    gl.flush();

    // given (at least a frame: a fence is seen to be passed only in a later task).
    const settle = async () => {
      alive();

      gl.flush();
      while (gl.getSyncParameter(sync, gl.SYNC_STATUS) !== gl.SIGNALED) {
        await nextFrame();
        alive();
      }
      gl.deleteSync(sync);

    // the GPU after each: a batch doubles while the GPU gets through it in
    // under 100 ms, and halves when it takes over 250 ms. So a slow GPU is
    // never given seconds of work at once (the GPU process, which draws the
    // whole browser, would stand still that long).
    const batches = async (parts, report) => {
      for (let i = 0, batch = 4; i < parts.length;) {

          w += parts[i][0];
          parts[i][1]();
        }
        await settle();
        const ms = performance.now() - start;
        batch = ms < 100 ? Math.min(batch * 2, 1024) : ms > 250 ? Math.max(1, batch / 2) : batch;
        report(i / parts.length);
      }

    // Meanwhile the tables of the CPU, in slices. The table of depthToTop
    // (see there), in the air's tables on unit 0 below: a sum of 16 midpoint
    // steps at each texel.
    const NM = 512, NR = 128;
    const depths = new Float32Array(NM * NR * 4);
    function* depthTable() {
      const NL = 16, H = Math.sqrt(RT * RT - RG * RG);
      for (let j = 0; j < NR; j++) {
        const rho = H * j / (NR - 1), r = Math.sqrt(rho * rho + RG * RG);
        for (let i = 0; i < NM; i++) {
          const t = (RT - r) + (rho + H - (RT - r)) * i / (NM - 1);
          const mu = t > 0 ? (H * H - rho * rho - t * t) / (2 * r * t) : 1, dt = t / NL;
          let a = 0, m = 0, o = 0;
          for (let s = 0; s < NL; s++) {

            const h = Math.max(0, Math.sqrt(r * r + u * u + 2 * r * mu * u) - RG);

            m += mieDensity(h) * dt;
            o += Math.max(0, 1 - Math.abs(h - 25) / 15) * dt;

          depths.set([a, m, o, 0], (j * NM + i) * 4);

      }
    }
    done(0.05);
    const forHaze = state.haze;
    // The slices are paced by timers (`soon`), not by frames: a frame comes
    // only every 50 ms or so while the page starts and the GPU is busy, and
    // a slice a frame made the tables take 1.8 s.
    await slices([buildDepths()], share => done(0.05 + 0.08 * share), soon);
    // The table of multiple scattering, the longest (some 0.2 to 0.3 s),
    // reads the first table (`sunDepth`). It goes on beside the others, and
    // while the GPU compiles the programs and draws the textures below; the
    // first frame waits for it. Run after the others, in slices a frame, it
    // held the first picture back by 0.4 s.
    const scattered = slices([buildMultiScatter(forHaze)], () => {}, soon);
    await slices([buildStars(), depthTable()], share => done(0.13 + 0.17 * share), soon);
    mark('tables built');

    // The triangle that covers the view, for every program.
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // more than one target, and the GPU process waits for it: the ice
    // program took 4.6 s there, the air's table's (airProg) 0.3 to 0.7 s.
    // Drawn into a pixel of as many targets (n) as soon as it is done, it is
    // compiled again while the scene's program still compiles, instead of
    // after it.
    const warm = (p, n) => {
      const frame = gl.createFramebuffer(), pixels = [];
      gl.bindFramebuffer(gl.FRAMEBUFFER, frame);
      for (let i = 0; i < n; i++) {

        gl.bindTexture(gl.TEXTURE_2D, pixels[i]);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 1, 1);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, pixels[i], 0);

      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.useProgram(null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.deleteFramebuffer(frame);
      for (const t of pixels) gl.deleteTexture(t);
      gl.flush();
    };

    // done: one a frame.
    doing = 'compiling the programs';
    for (let left = programs, told = performance.now(); left.length;) {
      alive();
      left = left.filter(([p]) => {
        if (!parallel) return false;
        if (!gl.getProgramParameter(p, parallel.COMPLETION_STATUS_KHR)) return true;
        mark(`program ${names.get(p)} compiled`);
        if ((p === iceProgram || p === airProg) && gl.getProgramParameter(p, gl.LINK_STATUS)) warm(p, p === airProg ? LUT_MRT : 3);
        return false;
      });
      done(0.3 + 0.3 * (1 - left.length / programs.length));
      if (timing && left.length && performance.now() - told > 5000) {
        told = performance.now();
        mark(`still compiling ${left.map(([p]) => names.get(p)).join(', ')}`);
      }
      if (left.length) await nextFrame();
    }
    for (const p of programs) {
      check(p);
      if (!parallel) {
        mark(`program ${names.get(p[0])} compiled`);
