<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky — レイリー散乱の空</title>
<style>
  :root {
    --wall: #f3f1ec;
    --ink: #1c2330;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero: the sky itself ---------- */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    color: #fff;
  }
  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;   /* a drag by touch looks around, as with the mouse */
    /* Fallback when WebGL is unavailable. */
    background: linear-gradient(to top,
      oklch(0.90 0.04 235) 0%, oklch(0.74 0.11 245) 30%,
      oklch(0.56 0.15 255) 70%, oklch(0.44 0.15 260) 100%);
  }
  .hero canvas:active { cursor: grabbing; }
  .title {
    position: absolute;
    left: clamp(20px, 6vw, 88px);
    right: clamp(20px, 6vw, 88px);
    top: clamp(20px, 6vw, 88px);       /* as far from the top as from the left */
    pointer-events: none;
    text-shadow: 0 1px 24px rgba(10, 40, 110, .35);
  }
  .title h1 {
    margin: 0;
    font-size: clamp(40px, 8vw, 104px);
    font-weight: 200;
    letter-spacing: .04em;
    line-height: 1.05;
    /* The line box leaves room above the capitals: without it the title
       would stand lower than its margin says. Trim it where the browser
       can; elsewhere, about as much by hand. */
    text-box: trim-start cap alphabetic;
  }
  @supports not (text-box: trim-start cap alphabetic) {
    .title h1 { margin-top: -.2em; }
  }
  .title p {
    margin: 14px 0 0;
    font-size: clamp(14px, 1.5vw, 18px);
    letter-spacing: .12em;
    opacity: .92;
  }
  .panel {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 5vh, 44px);
    transform: translateX(-50%);
    width: min(840px, calc(100vw - 32px));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 24px;
    padding: 14px 22px 16px;
    border-radius: 18px;
    background: rgba(24, 58, 120, .34);
    border: 1px solid rgba(255, 255, 255, .28);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
    font-size: 13px;
    letter-spacing: .06em;
  }
  .panel label { display: block; }
  /* The time row: play, now, the rate, then the time slider; the slider
     goes to a line of its own when the row is too narrow for its label. */
  .panel .time { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
  .panel .time label { flex: 1; min-width: 260px; }
  .panel button {
    width: 38px; height: 38px; flex: none;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font-size: 14px; line-height: 1;
    cursor: pointer;
  }
  .panel button:hover { background: rgba(255, 255, 255, .25); }
  .panel button svg { display: block; width: 18px; height: 18px; margin: auto; }
  .panel .row { display: flex; justify-content: space-between; }
  .panel output { font-variant-numeric: tabular-nums; opacity: .9; }
  .panel input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #fff; }
  .panel select {
    width: 100%; margin: 4px 0 0; padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(255, 255, 255, .12);
    color: #fff; font: inherit; letter-spacing: inherit;
    cursor: pointer;
  }
  .panel select option { color: #123; }
  .panel .time select { width: auto; flex: none; margin: 0; }
  .title .hint {
    margin: 10px 0 0;
    font-size: 12px;
    letter-spacing: .1em;
    opacity: .75;
  }
  /* Full screen, top right, in the corner that nothing else uses. */
  .fs {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 38px; height: 38px;
    padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .6);
    background: rgba(24, 58, 120, .34);
    color: #fff;
    cursor: pointer;
  }
  .fs:hover { background: rgba(60, 100, 170, .5); }
  .fs svg { width: 18px; height: 18px; }
  .fs .leave, .hero:fullscreen .fs .enter { display: none; }
  .hero:fullscreen .fs .leave { display: block; }
  .fs[hidden] { display: none; }
  @media (max-width: 700px) {
    .panel { grid-template-columns: repeat(2, 1fr); gap: 6px 18px; padding: 12px 16px 14px; }
  }
  /* A short window (a phone on its side): a smaller title nearer the top,
     the panel in fewer rows when it is wide enough, and a panel that never
     runs off the screen (it scrolls inside itself). */
  .panel { max-height: calc(100% - 2 * clamp(16px, 5vh, 44px)); overflow-y: auto; }
  @media (max-height: 560px) {
    .title { left: 16px; top: 16px; right: 70px; }
    .title h1 { font-size: clamp(32px, 11vh, 56px); }
    .title p { margin-top: 6px; font-size: 14px; }
    .title .hint { margin-top: 4px; }
  }
  @media (max-height: 560px) and (min-width: 701px) {
    .panel { grid-template-columns: repeat(5, 1fr); width: min(1040px, calc(100vw - 32px)); gap: 4px 20px; padding: 10px 18px 12px; }
  }
  /* The title and the hint are shown at first, then fade for good (.told).
     The panel and the full-screen button fade while nothing moves (.still)
     and come back with the pointer, a touch, a key or focus. Hidden, they
     take no clicks, so the view behind them can still be dragged; their
     controls stay in the tab order, and focus brings them back. Only
     opacity changes: the canvases are not drawn again. */
  .title { transition: opacity 1s, visibility 1s; }
  .hero.told .title { opacity: 0; visibility: hidden; }
  .panel, .fs { transition: opacity .6s; }
  .hero.still .panel, .hero.still .fs { opacity: 0; pointer-events: none; }
  /* The cursor goes with them, when their fade starts (a cursor cannot
     fade), and comes back with them; it wins over grab and grabbing. */
  .hero.still, .hero.still canvas, .hero.still canvas:active { cursor: none; }
  /* Loading: until the first picture is on the canvas (.shown), a dark
     sky with the title, a thin line of progress and a word stands over it.
     The line and the word fade in only after 0.3 s, so that a quick start
     shows nothing but the dark; the panel and the full-screen button wait
     hidden (they take no clicks and no focus). Then the dark fades out over
     the picture, and lets the pointer through to it at once. Without
     WebGL2 it fades out over the canvas's gradient. */
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    background: radial-gradient(130% 90% at 50% 105%, #22385f 0%, #121f3b 45%, #080d1c 100%);
    transition: opacity .8s, visibility .8s;
  }
  .hero.shown .loading { opacity: 0; visibility: hidden; pointer-events: none; }
  .hero:not(.shown) .panel, .hero:not(.shown) .fs { opacity: 0; visibility: hidden; }
  .loading .line, .loading p { opacity: 0; animation: sky-appear .6s ease .3s forwards; }
  /* With the picture, they go at once: the panel may come up where they are. */
  .hero.shown .loading .line, .hero.shown .loading p { animation: none; }
  .loading .line {
    position: relative;
    width: min(220px, 50vw);
    height: 2px;
    overflow: hidden;
    border-radius: 1px;
    background: rgba(255, 255, 255, .16);
  }
  /* The part done (--done, 0 to 1, set by the script), and a faint light
     that runs along the line while the page works. */
  .loading .line::before, .loading .line::after { content: ""; position: absolute; inset: 0; }
  .loading .line::before {
    background: rgba(255, 255, 255, .8);
    transform-origin: left;
    transform: scaleX(var(--done, 0));
    transition: transform .4s;
  }
  .loading .line::after {
    width: 35%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
    animation: sky-sweep 1.8s ease-in-out infinite;
  }
  .loading p {
    margin: 14px 0 0;
    font-size: 12px;
    letter-spacing: .14em;
    color: rgba(255, 255, 255, .78);
  }
  @keyframes sky-appear { to { opacity: 1; } }
  @keyframes sky-sweep { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) {
    .title, .panel, .fs { transition: none; }
    .loading .line::after { animation: none; display: none; }
  }
</style>
</head>
<body>

<section class="hero" data-sky="loading">
  <canvas id="sky" aria-label="巡航中の航空機から見た、空と雲と海" data-t-label="canvas"></canvas>
  <div class="loading" role="status">
    <div class="line"></div>
    <p data-t="loading">読み込み中…</p>
  </div>
  <div class="title">
    <h1>Sky</h1>
    <p data-t="subtitle">レイリー散乱で描く、雲の上の空</p>
    <p class="hint" data-t="hint">ドラッグで見回す</p>
  </div>
  <button class="fs" type="button" hidden aria-label="全画面表示" title="全画面表示">
    <svg class="enter" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6.5V2h4.5M11.5 2H16v4.5M16 11.5V16h-4.5M6.5 16H2v-4.5"/></svg>
    <svg class="leave" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.5 2v4.5H2M16 6.5h-4.5V2M11.5 16v-4.5H16M2 11.5h4.5V16"/></svg>
  </button>
  <form class="panel" onsubmit="return false">
    <div class="time">
      <button id="play" type="button" aria-label="時間を進める" data-t-label="play">▶</button>
      <button id="now" type="button" aria-label="いまの日時" title="いまの日時" data-t-label="now" data-t-title="now">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M9 4.8V9l2.8 1.8"/></svg>
      </button>
      <select id="rate" aria-label="時間の進む速さ" title="時間の進む速さ" data-t-label="rate" data-t-title="rate">
        <option value="1" data-t="rate1">実時間</option>
        <option value="60" data-t="rate60">1分/秒</option>
        <option value="600" data-t="rate600">10分/秒</option>
        <option value="960" data-t="rate960" selected>16分/秒</option>
        <option value="3600" data-t="rate3600">1時間/秒</option>
      </select>
      <label>
        <span class="row"><span data-t="time">時刻</span><output id="timeOut"></output></span>
        <input id="time" type="range" min="0" max="24" step="0.05" value="15">
      </label>
    </div>
    <label>
      <span class="row"><span data-t="date">日付</span><output id="dateOut"></output></span>
      <input id="date" type="range" min="1" max="365" step="1">
    </label>
    <label>
      <span class="row"><span data-t="moon">月</span><output id="moonOut"></output></span>
      <input id="moon" type="range" min="0" max="29.5" step="0.5">
    </label>
    <label>
      <span class="row"><span data-t="haze">大気の霞</span><output id="hazeOut"></output></span>
      <input id="haze" type="range" min="0" max="6" step="0.05" value="0.35">
    </label>
    <label>
      <span class="row"><span data-t="wind">海上の風</span><output id="windOut"></output></span>
      <input id="wind" type="range" min="1" max="15" step="0.5" value="6">
    </label>
    <label>
      <span class="row"><span data-t="alt">高度</span><output id="altOut"></output></span>
      <input id="alt" type="range" min="0.3" max="13" step="0.1" value="11">
    </label>
    <label>
      <span class="row"><span data-t="speed">速度</span><output id="speedOut"></output></span>
      <input id="speed" type="range" min="0" max="3000" step="50" value="900">
    </label>
    <label>
      <span class="row"><span data-t="cloud">雲</span><output id="cloudOut"></output></span>
      <input id="cloud" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      <span class="row"><span data-t="cirrus">薄雲</span><output id="cirrusOut"></output></span>
      <input id="cirrus" type="range" min="0" max="1" step="0.01" value="0.4">
    </label>
    <label>
      <span class="row"><span data-t="sound">音</span><output id="soundOut"></output></span>
      <select id="sound">
        <option value="off" data-t="soundOff">なし</option>
        <option value="airliner" data-t="soundAirliner">旅客機</option>
        <option value="airliner-whine" data-t="soundWhine">エンジン近く</option>
        <option value="wind" data-t="soundWind">風</option>
      </select>
    </label>
    <label>
      <span class="row"><span data-t="volume">音量</span><output id="volumeOut"></output></span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
    <label>
      <span class="row"><span data-t="pixels">解像度</span></span>
      <select id="pixels">
        <option value="fhd" data-t="fhd">フルHD</option>
        <option value="wqhd" selected>WQHD</option>
        <option value="4k">4K</option>
      </select>
    </label>
    <label>
      <span class="row"><span data-t="lang">言語 / Language</span></span>
      <select id="lang">
        <option value="ja" lang="ja">日本語</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
  </form>
<script>
// The text of the hero, in Japanese and English. The HTML holds the Japanese;
// this runs as soon as the hero is parsed, before the long scripts below, so
// an English reader does not see the Japanese first. Elements name their
// text with data-t (contents), data-t-label (aria-label) and data-t-title.
const TEXT = {
  ja: {
    title: 'Sky — レイリー散乱の空',
    canvas: '巡航中の航空機から見た、空と雲と海',
    subtitle: 'レイリー散乱で描く、雲の上の空',
    hint: 'ドラッグで見回す',
    loading: '読み込み中…',
    fullScreen: '全画面表示',
    exitFullScreen: '全画面を終了',
    play: '時間を進める', now: 'いまの日時',
    rate: '時間の進む速さ', rate1: '実時間', rate60: '1分/秒', rate600: '10分/秒', rate960: '16分/秒', rate3600: '1時間/秒',
    time: '時刻', date: '日付', moon: '月', haze: '大気の霞', wind: '海上の風',
    alt: '高度', speed: '速度', cloud: '雲', cirrus: '薄雲', pixels: '解像度', fhd: 'フルHD',
    lang: '言語 / Language',
    sound: '音', soundOff: 'なし', soundAirliner: '旅客機', soundWhine: 'エンジン近く', soundWind: '風',
    volume: '音量', soundWait: 'クリックで再生',
    // The light of the hour, by the sun's elevation (see showLabels).
    night: '夜', astronomical: '天文薄明', nautical: '航海薄明', civil: '市民薄明',
    morning: '朝', evening: '夕方', day: '昼',
    dateText: (month, day) => month + '月' + day + '日',
    newMoon: '新月', firstQuarter: '上弦', fullMoon: '満月', lastQuarter: '下弦',
    moonAge: age => '月齢 ' + age,
    hazes: ['澄みきった', '澄んだ', 'うす霞', '霞'],
    clouds: ['なし', '少ない', '中くらい', '多い', '一面'],
    cirri: ['なし', '少ない', '中くらい', '多い'],
  },
  en: {
    title: 'Sky — a Rayleigh-scattered sky',
    canvas: 'The sky, clouds and sea, seen from a cruising aircraft',
    subtitle: 'The sky above the clouds, drawn with Rayleigh scattering',
    hint: 'Drag to look around',
    loading: 'Loading…',
    fullScreen: 'Full screen',
    exitFullScreen: 'Exit full screen',
    play: 'Play time-lapse', now: 'Now',
    rate: 'Speed of time', rate1: 'real time', rate60: '1 min/s', rate600: '10 min/s', rate960: '16 min/s', rate3600: '1 h/s',
    time: 'Time', date: 'Date', moon: 'Moon', haze: 'Haze', wind: 'Wind at sea',
    alt: 'Altitude', speed: 'Speed', cloud: 'Clouds', cirrus: 'Thin clouds', pixels: 'Resolution', fhd: 'Full HD',
    lang: 'Language / 言語',
    sound: 'Sound', soundOff: 'Off', soundAirliner: 'Airliner', soundWhine: 'Near engines', soundWind: 'Wind',
    volume: 'Volume', soundWait: 'click to play',
    night: 'night', astronomical: 'astronomical twilight', nautical: 'nautical twilight', civil: 'civil twilight',
    morning: 'morning', evening: 'evening', day: 'day',
    dateText: (month, day) => day + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][month - 1],
    newMoon: 'new moon', firstQuarter: 'first quarter', fullMoon: 'full moon', lastQuarter: 'last quarter',
    moonAge: age => 'day ' + age,
    hazes: ['crystal clear', 'clear', 'light haze', 'hazy'],
    clouds: ['none', 'few', 'some', 'many', 'overcast'],
    cirri: ['none', 'few', 'some', 'many'],
  },
};
// The language: the address (?lang=en), else the reader's last choice, else
// the browser's first Japanese or English language; English for all others.
let LANG = (() => {
  const known = l => l === 'ja' || l === 'en';
  const asked = new URLSearchParams(location.search).get('lang');
  if (known(asked)) return asked;
  let stored = null;
  try { stored = localStorage.getItem('sky.lang'); } catch (err) {}
  if (known(stored)) return stored;
  for (const l of navigator.languages || [navigator.language || '']) {
    if (/^ja(-|$)/i.test(l)) return 'ja';
    if (/^en(-|$)/i.test(l)) return 'en';
  }
  return 'en';
})();
function applyLanguage(lang) {
  LANG = lang;
  const T = TEXT[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-t-label]')) el.setAttribute('aria-label', T[el.dataset.tLabel]);
  for (const el of document.querySelectorAll('[data-t-title]')) el.title = T[el.dataset.tTitle];
  document.getElementById('lang').value = lang;
}
applyLanguage(LANG);
</script>
</section>

<!-- Stars to magnitude 6.5 (V band) from Wikidata: structured data under CC0
     (https://www.wikidata.org/wiki/Wikidata:Copyright), retrieved 2026-11-15
     with tools/make-stars.py. Six bytes each, little-endian: right ascension
     (u16, turns), declination (u16, -90..90 degrees), V magnitude (u8, -1.5..6.5),
     B-V colour (u8, -0.5..2). Brightest first. 101 stars that Wikidata gives no V

<script id="noise" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Draws the textures of the clouds once, at start: slice uZ (0 to 1) of the
// 3D noise, or the weather map (uZ < 0). Everything repeats.
uniform float uZ;
uniform float uSize;
out vec4 outColor;

// An integer hash: xor-shifts and multiplies, Wellons' lowbias32
// (hash-prospector, public domain). Inputs one apart give unrelated words.
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for a lattice point; the lattice repeats
// every `period` points (at most 1024). One hash of the cell, its
// coordinates packed into a word, plus the seed spaced by the golden ratio.
// The numbers are the word, and its low 21 and 10 bits moved up: their
// first 11, 11 and 10 bits are their own, finer than the 8 bits the
// textures keep.
vec3 rnd(vec3 cell, vec3 period, float seed) {
  uvec3 c = uvec3(mod(cell, period));
  uint h = ihash(c.x + (c.y + c.z * 1024u) * 1024u + uint(seed) * 0x9e3779b9u + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

// Worley noise, upside down: 1 at a feature point, 0 far from all of them.
float worley(vec3 p, vec3 freq, float seed) {
  p *= freq;
  vec3 id = floor(p), f = p - id;
  float m = 1.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      for (int z = -1; z <= 1; z++) {
        vec3 g = vec3(x, y, z);
        vec3 r = g + rnd(id + g, freq, seed) - f;
        m = min(m, dot(r, r));
      }
    }
  }
  return 1.0 - sqrt(m);
}

float worleyFbm(vec3 p, vec3 freq, float seed) {
  return 0.625 * worley(p, freq, seed) + 0.25 * worley(p, 2.0 * freq, seed + 1.0)
       + 0.125 * worley(p, 4.0 * freq, seed + 2.0);
}

// Perlin (gradient) noise, about -1 to 1.
float perlin(vec3 p, vec3 freq, float seed) {
  p *= freq;
  vec3 i = floor(p), f = p - i;
  vec3 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
#define G(c) dot(rnd(i + c, freq, seed) * 2.0 - 1.0, f - c)
  return mix(mix(mix(G(vec3(0, 0, 0)), G(vec3(1, 0, 0)), u.x), mix(G(vec3(0, 1, 0)), G(vec3(1, 1, 0)), u.x), u.y),
             mix(mix(G(vec3(0, 0, 1)), G(vec3(1, 0, 1)), u.x), mix(G(vec3(0, 1, 1)), G(vec3(1, 1, 1)), u.x), u.y), u.z);
}

float perlinFbm(vec3 p, vec3 freq, int octaves, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq *= 2.0;
    amp *= 0.555;
  }
  return sum;
}

// Heaps: single clouds, each a dome round a point of a jittered grid of
// freq cells across the map, of its own width (0.3 to 0.75 of a cell) and
// strength. The highest dome wins where two meet: a cluster, not a sum.
float heaps(vec2 uv, float freq, float seed) {
  vec2 p = uv * freq, id = floor(p), f = p - id;
  float m = 0.0;
  for (int x = -1; x <= 1; x++) {
    for (int y = -1; y <= 1; y++) {
      vec2 g = vec2(x, y);
      vec3 r = rnd(vec3(id + g, 0.0), vec3(freq, freq, 1.0), seed);
      vec3 s = rnd(vec3(id + g, 1.0), vec3(freq, freq, 2.0), seed);
      vec2 c = g + 0.15 + 0.7 * r.xy - f;
      float d = length(c) / mix(0.3, 0.75, r.z);
      // A smooth max: where two meet they merge without a sharp crease.
      // A dome, round all over (a bell, hollow in its flanks, looked like a
      // hill), whose foot meets the others without a kink: its slope falls
      // to nought at the rim (else a crease showed where two met).
      float u = max(1.0 - d * d, 0.0), v = mix(0.35, 1.0, s.x) * sqrt(u) * smoothstep(0.0, 0.3, u);
      float k = clamp(0.5 + 2.0 * (v - m), 0.0, 1.0);
      m = mix(m, v, k) + 0.25 * k * (1.0 - k);
    }
  }
  return m;
}

// The same with a chosen gain: nearer 1, more of the small sizes.
float fbm(vec3 p, vec3 freq, int octaves, float gain, float seed) {
  float sum = 0.0, amp = 1.0;
  for (int i = 0; i < octaves; i++) {
    sum += amp * perlin(p, freq, seed + float(i));
    freq.xy *= 2.0;
    amp *= gain;
  }
  return sum;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  if (uZ >= 0.0) {
    // Perlin-Worley (after Schneider, 2015): Worley cells, swollen by billowy Perlin noise.
    vec3 p = vec3(uv, uZ);
    float billow = min(abs(perlinFbm(p, vec3(4.0), 7, 0.0)), 1.0);
    float g = worleyFbm(p, vec3(4.0), 10.0);
    float b = worleyFbm(p, vec3(8.0), 20.0);
    float a = worleyFbm(p, vec3(16.0), 30.0);
    outColor = vec4(g + billow * (1.0 - g), g, b, a);
  } else {
    // Weather, on a map 256 km wide: systems of some 80 km; open cells of
    // 30 km, with the cloud along their walls; streets, rows of cloud 5 km
    // apart; and clumps from 6 km down to single clouds of 1 km. The many
    // sizes of the clumps make clouds of many sizes.
    vec3 p = vec3(uv, 0.37);
    float systems = perlinFbm(p, vec3(3.0, 3.0, 1.0), 3, 40.0);
    float walls = smoothstep(0.3, 0.75, 1.0 - worley(p, vec3(9.0, 9.0, 1.0), 50.0));
    // Whole numbers turn the streets and keep them repeating.
    vec3 s = vec3(4.0 * uv.x + uv.y, 4.0 * uv.y - uv.x, 0.37);
    float streets = fbm(s, vec3(12.0, 3.0, 1.0), 3, 0.7, 90.0);
    float clumps = fbm(p, vec3(40.0, 40.0, 1.0), 4, 0.75, 60.0);
    float heap = max(heaps(uv, 64.0, 120.0), 0.8 * heaps(uv, 160.0, 130.0) * smoothstep(-0.4, 0.3, clumps + 0.3 * systems));
    float cover = 0.5 + 0.18 * systems + 0.15 * (walls - 0.5) + 0.3 * streets + 0.2 * clumps + 0.6 * (heap * heap - 0.23);
    // Towers: the widest clumps, where the weather lets them grow; some
    // grow taller than others.
    float tall = smoothstep(0.4, 0.55, 0.45 + 0.7 * perlinFbm(p, vec3(5.0, 5.0, 1.0), 4, 70.0))
               * smoothstep(0.15, 0.4, fbm(p, vec3(20.0, 20.0, 1.0), 3, 0.6, 65.0))
               * (0.7 + 0.6 * perlin(p, vec3(11.0, 11.0, 1.0), 75.0));
    // G: how high the heap stands here (a dome over each heap), taller
    // where towers grow.
    tall = clamp(heap * mix(0.6, 1.1, clamp(tall, 0.0, 1.0)), 0.0, 1.0);
    // Wind on the sea, which blows towards (2, 1): gusts and calms some
    // 7 km across and twice as long down the wind, with finer ones inside
    // them.
    vec3 pw = vec3(2.0 * uv.x + uv.y, 2.0 * uv.y - uv.x, 0.37);
    float gusts = 0.5 + 0.55 * perlinFbm(pw, vec3(8.0, 16.0, 1.0), 5, 80.0);

    // High, thin cloud: the wind draws it out along a, the direction (3, 1)
    // on the map; b runs across. Both step by whole numbers across the map,
    // so the pattern repeats; a few long waves bend b (the same in the
    // aircraft's shader, which adds the streaks). Patches of some 80 km,
    // bands of 40 by 10 km within them, and shorter runs of 8 by 2 km.
    const float TAU = 6.2831853;
    float bend = 0.05 * sin(TAU * dot(uv, vec2(2.0, 1.0)) + 1.3) + 0.04 * sin(TAU * dot(uv, vec2(-1.0, 3.0)) + 4.1)
               + 0.03 * sin(TAU * dot(uv, vec2(3.0, -2.0)) + 2.2) + 0.02 * sin(TAU * dot(uv, vec2(5.0, 4.0)) + 0.4)
               + 0.015 * sin(TAU * dot(uv, vec2(-6.0, 5.0)) + 5.0) + 0.006 * sin(TAU * dot(uv, vec2(13.0, -9.0)) + 2.9);
    vec3 c = vec3(dot(uv, vec2(3.0, 1.0)), dot(uv, vec2(-1.0, 3.0)) + bend, 0.61);
    float patches = perlinFbm(p, vec3(3.0, 3.0, 1.0), 3, 85.0);
    float bands = perlinFbm(c, vec3(2.0, 8.0, 1.0), 3, 100.0);
    float runs = perlinFbm(c, vec3(10.0, 40.0, 1.0), 2, 105.0);
    float cirrus = 0.42 + 0.5 * patches + 0.45 * bands + 0.3 * runs;

    outColor = vec4(cover, tall, gusts, cirrus);
  }
}
</script>

<script id="waves" type="x-shader/x-fragment">
#version 300 es
precision highp float;

// Draws the map of the waves on the sea once, at start: many plane waves,
// each a whole number of times across the map, so that it repeats.
// R, G: the slope along x and z, in units of its rms (0.125 per unit, flat
// at 0.5). B: the slope squared, over 8: averaged over a footprint, it
// tells how much slope the averaged R and G have lost. A: streaks along
// the wind.
uniform float uSize;
out vec4 outColor;

const float TAU = 6.28318530718;
const float WIND = 0.4636;          // the wind blows towards (2, 1)

// The integer hash of the noise shader (lowbias32).
uint ihash(uint x) {
  x ^= x >> 16u;
  x *= 0x7feb352du;
  x ^= x >> 15u;
  x *= 0x846ca68bu;
  x ^= x >> 16u;
  return x;
}

// Three random numbers (0 to 1) for wave i, from one hash, as for a cell
// of the noise.
vec3 rnd(int i) {
  uint h = ihash(uint(i) + 0x632be5abu);
  return vec3(h, h << 11u, h << 22u) * (1.0 / 4294967296.0);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uSize;
  // Wind waves: 10 to 64 crests across the map, with the same slope in
  // every octave (a sea in equilibrium). They run within some 70 degrees
  // of the wind, short-crested; the long ones keep closer to it.
  const int N = 96;
  vec2 s = vec2(0.0);
  for (int i = 0; i < N; i++) {
    vec3 r = rnd(i), q = rnd(i + 5000);
    float f = (float(i) + r.x) / float(N);
    float a = WIND + mix(1.1, 1.6, f) * (r.y + r.z - 1.0);
    vec2 m = round(10.0 * pow(6.4, f) * vec2(cos(a), sin(a)));
    s += normalize(m) * cos(TAU * (dot(m, uv) + q.x));
  }
  s *= sqrt(2.0 / float(N));
  // Streaks: 6 to 40 across the wind, and about twice as long along it.
  const int M = 40;
  float w = 0.0;
  for (int i = 0; i < M; i++) {
    vec3 r = rnd(i + 9000);
    float k = 6.0 * pow(7.0, r.x);
    float a = WIND + 0.25 * TAU + 0.7 * (r.y + r.z - 1.0);
    w += cos(TAU * (dot(round(k * vec2(cos(a), sin(a))), uv) + fract(61.0 * r.x + r.y))) / sqrt(k);
  }
  outColor = vec4(0.5 + 0.125 * s, dot(s, s) / 8.0, 0.5 + 0.165 * w);
}

<script id="fs" type="x-shader/x-fragment">
#version 300 es
precision highp float;
precision highp sampler2D;
precision highp sampler3D;

uniform vec2 uRes;
uniform mat3 uCam;      // columns: right, up, forward
uniform float uTan;     // tan(vertical fov / 2)
uniform vec3 uSun;      // unit vector towards the sun
uniform float uSunI;    // 1, or 0 when the sun is too far down to matter
uniform vec3 uMoon;     // unit vector towards the moon
uniform float uMoonI;   // moonlight relative to sunlight (0 when it does not matter)
uniform mat3 uSky;      // rotation of the stars since noon
uniform float uEarth;   // earthshine on the dark side of the moon
// Star catalogue: a grid over the sphere (octahedral map), SLOTS stars per
// cell. Texel: direction (J2000 equatorial), colour index + brightness.
uniform sampler2D uStars;
uniform float uHaze;    // multiplier on the aerosol (Mie) density
uniform float uExposure;
uniform float uLook;    // power of the "look" curve
// Twelve wavelengths (405-680 nm), four per vec4.
uniform vec4 uBR[3];    // Rayleigh scattering per km
uniform vec4 uBO[3];    // ozone absorption per km
uniform vec4 uWR[3];    // spectrum -> linear sRGB (solar spectrum folded in)
uniform vec4 uWG[3];
uniform vec4 uWB[3];
// Multiple scattering per unit of scattering coefficient: NMU x (3 * NH)
// texels, the three wavelength groups stacked in y.
uniform sampler2D uMS;
uniform vec4 uWL[3];    // wavelength / 550 nm
uniform float uNight;   // radiance of the moonless night sky (airglow)
uniform float uAlt;     // altitude of the eye, km
uniform float uCloud;   // cloud amount: 0 (none) to 1 (overcast)
uniform float uWind;    // wind over the sea, m/s
uniform vec3 uLight;    // what lights the clouds and the sea: the sun, or the moon at night
uniform float uLightI;
// The view from the aircraft is a mean over frames: each frame shifts the
// rays within the pixel (uJitter, in pixels) and the samples through the
// clouds (uPass, the number of the frame).
uniform vec2 uJitter;
uniform float uPass;
// How far the aircraft has flown, km: clouds and sea are read at p.xz + uDrift.
// It wraps at the width of the weather map, which every pattern must divide.
uniform vec2 uDrift;
uniform float uCirrus;  // amount of high, thin cloud: 0 (none) to 1
// Cloud noise, repeating. R: Perlin-Worley; G, B, A: Worley at rising frequencies.
uniform sampler3D uNoise;
// Weather map, repeating. R: cloud cover, G: towers, B: gusts on the sea.
uniform sampler2D uWeather;
layout(location = 0) out vec4 outColor;
// The aircraft's frames go on to the shader that joins them into a picture
// (see there), with the distance of what each pixel shows (outAux). They are
// kept in steps of 1 / uSteps.
uniform float uSteps;
layout(location = 1) out vec4 outAux;

const float PI = 3.14159265359;
// The parameters of the air follow Bruneton's demo (2017): see THIRD_PARTY_NOTICES.md.
// Lengths in km.
const float RG = 6360.0;        // ground radius
const float RT = 6460.0;        // top of atmosphere
const float BETA_M = 3.996e-3;  // Mie scattering per km at sea level
const float MIE_EXT = 1.11;     // extinction / scattering
const float HR = 8.0;           // Rayleigh scale height
const float HM = 1.2;           // Mie scale height
const float ISUN = 20.0;
const int NV = 20;              // view samples: the picture is within two steps of 8 bits of 40's
const int NMU = 40;             // multiple-scattering table: sun angle
const int NH = 12;              // multiple-scattering table: altitude
const float MS_MU_MIN = -0.35;
const float STAR_GAIN = 3.0;
const int GRID = 128;
const int SLOTS = 8;
const float LN_FLUX_MAX = 5.9915;   // ln(400)

vec2 raySphere(vec3 o, vec3 d, float r) {
  float b = dot(o, d);
  float c = dot(o, o) - r * r;
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  D = sqrt(D);
  return vec2(-b - D, -b + D);
}

// Densities of (Rayleigh, Mie, ozone) at altitude h. The depth table built
// in makeSky repeats this profile: change both.
vec3 density(float h) {
  h = max(h, 0.0);
  return vec3(exp(-h / HR), exp(-h / HM), max(0.0, 1.0 - abs(h - 25.0) / 15.0));
}

// The depths of depthToTop hang only on the height of p and the angle of d
// to the vertical. They are read from a table, a sum of 16 steps made once
// in JS: one filtered read instead of a march. Its axes, as
// in Bruneton (2017): the distance to the top between its least and its
// most at that height, and the distance to the horizon. They keep the
// table smooth near the horizon.
uniform sampler2D uDepth;
const int DEPTH_MU = 512, DEPTH_R = 128;
const float H_TOP = 1132.2544;  // distance from the ground to the top, along the horizon: sqrt(RT^2 - RG^2)

// Optical depth (per species) from p to the top of the atmosphere.
vec3 depthToTop(vec3 p, vec3 d) {
  float r = length(p);
  float rho = sqrt(max((r - RG) * (r + RG), 0.0));
  float lo = RT - r, hi = rho + H_TOP;
  vec2 x = vec2(clamp((raySphere(p, d, RT).y - lo) / (hi - lo), 0.0, 1.0), clamp(rho / H_TOP, 0.0, 1.0));
  const vec2 N = vec2(DEPTH_MU, DEPTH_R);
  return textureLod(uDepth, (x * (N - 1.0) + 0.5) / N, 0.0).rgb;
}

// Bilinear lookup of the multiple-scattering table.
void multiScatter(float h, float mus, out vec4 ms[3]) {
  float x = clamp((mus - MS_MU_MIN) / (1.0 - MS_MU_MIN), 0.0, 1.0) * float(NMU - 1);
  float y = sqrt(clamp(h / (RT - RG), 0.0, 1.0)) * float(NH - 1);
  // It is read through the GPU's filter (see the table of depths). The
  // three groups lie one above the other: a read within one never reaches
  // the next.
  for (int k = 0; k < 3; k++) {
    ms[k] = textureLod(uMS, (vec2(x, y + float(k * NH)) + 0.5) / vec2(NMU, 3 * NH), 0.0);
  }
}

// hash13 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash3(vec3 p) {
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}

float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1, 0, 0)), f.x),
                 mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
                 mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// The catalogue cell that holds direction c.
ivec2 starCell(vec3 c) {
  vec3 p = c / (abs(c.x) + abs(c.y) + abs(c.z));
  vec2 uv = p.z >= 0.0 ? p.xy
    : (1.0 - abs(p.yx)) * vec2(p.x >= 0.0 ? 1.0 : -1.0, p.y >= 0.0 ? 1.0 : -1.0);
  return ivec2(clamp(floor((uv * 0.5 + 0.5) * float(GRID)), 0.0, float(GRID - 1)));
}

// The band of the Milky Way, relative to the airglow: a noise pattern, not
// the real clouds, but on the real galactic plane and brighter at its centre.
float milkyWay(vec3 c) {
  const vec3 POLE = vec3(-0.8676, -0.1981, 0.4560);      // north galactic pole
  const vec3 CENTRE = vec3(-0.0550, -0.8734, -0.4839);   // galactic centre
  float b = dot(c, POLE);
  float near = 0.5 + 0.5 * dot(c, CENTRE);
  float clouds = 0.5 * noise3(c * 5.0) + 0.3 * noise3(c * 11.0) + 0.2 * noise3(c * 23.0);
  return (0.8 + 3.0 * near * near) * exp(-b * b / (0.02 + 0.03 * near)) * (0.25 + 1.5 * clouds * clouds);
}

vec2 phases(float mu) {
  const float g = 0.8;
  return vec2(3.0 / (16.0 * PI) * (1.0 + mu * mu),
              3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu))
                / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5)));
}

// Light from one source (sun or moon) scattered towards the eye at p:
// scattered once (times `direct`: less in the shadow of a cloud), plus what
// was already scattered (the table).
void addLight(vec3 p, float r, float h, vec3 od, vec3 dens, float scM, float extM,
              vec3 dir, float gain, float direct, float sky, vec2 phase, in vec4 Tv[3], inout vec4 L[3]) {
  vec4 ms[3];
  multiScatter(h, dot(p, dir) / r, ms);
  bool lit = raySphere(p, dir, RG).y < 0.0;          // not behind the planet
  vec3 odl = lit ? od + depthToTop(p, dir) : vec3(0.0);
  for (int k = 0; k < 3; k++) {
    vec4 sc = uBR[k] * dens.x;
    vec4 a = Tv[k] * (sc + scM) * ms[k] * sky;
    if (lit) {
      a += direct * exp(-(uBR[k] * odl.x + extM * odl.y + uBO[k] * odl.z)) * (sc * phase.x + scM * phase.y);
    }
    L[k] += gain * a;
  }
}

// hash12 of "Hash without Sine" by David Hoskins (MIT): see THIRD_PARTY_NOTICES.md.
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// After Jimenez (2014), "Next Generation Post Processing in Call of Duty: Advanced Warfare".
// Interleaved gradient noise: spreads the start of a march evenly over
// neighbouring pixels.
float ign(vec2 p) {
  return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
}

// The view from the aircraft: clouds below and a sea under them.

// raySphere for a ray from the eye (o, at height uAlt) and the sphere at
// height h, without its rounding. raySphere takes dot(o, o) - r * r, and at
// 6372 km a float steps by 4 km²; from an eye at the sphere's own height
// (the slider stops on the thin cloud's 12.2, 12.5 and 12.8 km) the
// crossing next to the eye then came out a hair ahead or behind it, as
// each ray's angle rounded. From the base of the thin cloud, rings of rays
// (and a disc under the eye, where dot(o, d) passes a power of two) saw
// through the whole sheet down to the sea, as lit bands. Here c comes from
// the heights, and the near crossing from the far one (their product is c).
vec2 eyeSphere(vec3 o, vec3 d, float h) {
  float b = dot(o, d);
  float c = (uAlt - h) * (2.0 * RG + uAlt + h);
  float D = b * b - c;
  if (D < 0.0) return vec2(1e9, -1e9);
  float q = b < 0.0 ? sqrt(D) - b : -b - sqrt(D);   // the crossing farther from the eye
  if (q == 0.0) return vec2(0.0);
  return b < 0.0 ? vec2(c / q, q) : vec2(q, c / q);
}

// ---------- Clouds ----------
// A shell from CB to CT holds them. A field says where they are: positive
// inside a cloud, rising by about 1 per km of depth under its surface. It
// is a sum: a weather map (where clouds stand, and how wide), less what a
// height costs (flat bases, domed tops, thicker where wider), plus noise on
// smaller and smaller scales (billows on billows). A sum keeps the small
// sizes at the edge of a cloud: its outline is ragged, not a smooth blob.
const float CB = 0.6;               // cloud base, km
const float CT = 5.0;               // the highest tops, km
const float WEATHER_KM = 256.0;     // size of the weather map
const float BASE_KM = 8.0;          // size of one tile of the noise
const float TEXEL_KM = BASE_KM / 128.0;
const float DETAIL = 7.0;           // tiles of the fine noise per tile (whole numbers: see uDrift)
const float SIGMA = 90.0;           // extinction inside a dense cloud, per km
const float LUMPS = 1.3;            // how far the noise of the tile moves the surface, in units of the field
const float RELIEF = 0.85;          // the same for the fine noise
const float EDGE = 0.03;            // depth under the surface at which an old, soft cloud is dense
const int CLOUD_STEPS = 400;
const vec4 MICRO = vec4(0.12, 0.07, 0.045, 0.05); // weights of the finer billows (cloudDetail)
const float LIGHT_MIN = 0.015;
const float CREASE = 0.25;          // how much a crease between billows dims the light it sends
const float SHAPE = 0.45;           // the light scattered many times on a billow's side turned from the light, against its top
const float SUNLIT = 0.53;          // the gain of the light scattered many times
const float SKYLIT = 1.5;           // the gain of the sky's light on the clouds
const float UNDER = 0.3;            // the light of the sky left in the air under a full deck
const float COLUMN = 0.11;          // (1 - g) 0.75: how a deep column dims the light through it
const float DEEP = 0.5;             // light scattered many times on a side turned from the light, against a lit side     // the first step towards the light, at least (km)
const float PENUMBRA = 0.06;        // how far light strays sideways in a cloud, km: shadows on it are soft

// Places in the clouds are given from the eye (p less eye()). At the
// Earth's radius a float steps by half a metre, and the finest noise
// (cloudDetail) showed those steps as terraces; heightAt finds the height
// of such a place without them.
vec3 eye() {
  return vec3(0.0, RG + uAlt, 0.0);
}

float heightAt(vec3 p) {
  float r = RG + uAlt;
  return (uAlt * (2.0 * RG + uAlt) + 2.0 * r * p.y + dot(p, p)) / (length(p + eye()) + RG);
}

// The weather map at x (km), smoothed as a mip level lod of the noise
// would be. Read through the GPU's filter, the map bends where its texels
// meet, every 250 m; the sides of clouds within a few km showed those bends
// as upright streaks. So where a pixel at p is finer than 8 m, the place
// within a texel is first eased (smoothstep: Quilez, "improved texture
// interpolation"), and the map bends smoothly: one read still. The
// distance to the eye decides, not lod: the samples towards the light then
// read the map as the ray does.
vec4 weather(vec3 p, vec2 x, float lod, bool fine) {
  float ease = clamp(-3.0 - log2(1.6 * uTan / uRes.y * length(p) / TEXEL_KM), 0.0, 1.0);
  if (ease == 0.0) return textureLod(uWeather, x / WEATHER_KM, lod - 2.0);
  float N = float(textureSize(uWeather, 0).x);
  vec2 u = x * (N / WEATHER_KM) - 0.5, i = floor(u), f = u - i;
  // Nearer still, a cubic B-spline (four filtered reads, as noiseSpline):
  // the eased map still bent enough for lit and shaded sides to show
  // upright streaks.
  if (ease < 1.0 || !fine) return textureLod(uWeather, (i + mix(f, f * f * (3.0 - 2.0 * f), ease) + 0.5) / N, 0.0);
  vec2 g = 1.0 - f;
  vec2 w0 = g * g * g / 6.0, w1 = (4.0 - 6.0 * f * f + 3.0 * f * f * f) / 6.0;
  vec2 w3 = f * f * f / 6.0, w2 = 1.0 - w0 - w1 - w3;
  vec2 a = w0 + w1, b = w2 + w3;
  vec2 h0 = (i - 0.5 + w1 / a) / N, h1 = (i + 1.5 + w3 / b) / N;
  return a.y * (a.x * textureLod(uWeather, vec2(h0.x, h0.y), 0.0) + b.x * textureLod(uWeather, vec2(h1.x, h0.y), 0.0))
       + b.y * (a.x * textureLod(uWeather, vec2(h0.x, h1.y), 0.0) + b.x * textureLod(uWeather, vec2(h1.x, h1.y), 0.0));
}

// The noise at q, level level, through a cubic B-spline: smooth, with a
// smooth slope (the GPU's filter bends where texels meet, and lit and
// shaded sides showed those bends as a grid of facets near the eye).
// Eight filtered reads, each at a place between two texels that weighs
// them as the spline does (Sigg and Hadwiger, GPU Gems 2, ch. 20).
vec4 noiseSpline(vec3 q, float level) {
  float N = float(textureSize(uNoise, int(level)).x);
  vec3 u = q * N - 0.5, i = floor(u), f = u - i, g = 1.0 - f;
  vec3 w0 = g * g * g / 6.0, w1 = (4.0 - 6.0 * f * f + 3.0 * f * f * f) / 6.0;
  vec3 w3 = f * f * f / 6.0, w2 = 1.0 - w0 - w1 - w3;
  vec3 a = w0 + w1, b = w2 + w3;
  vec3 h0 = (i - 0.5 + w1 / a) / N, h1 = (i + 1.5 + w3 / b) / N;
  return a.z * (a.y * (a.x * textureLod(uNoise, vec3(h0.x, h0.y, h0.z), level) + b.x * textureLod(uNoise, vec3(h1.x, h0.y, h0.z), level))
              + b.y * (a.x * textureLod(uNoise, vec3(h0.x, h1.y, h0.z), level) + b.x * textureLod(uNoise, vec3(h1.x, h1.y, h0.z), level)))
       + b.z * (a.y * (a.x * textureLod(uNoise, vec3(h0.x, h0.y, h1.z), level) + b.x * textureLod(uNoise, vec3(h1.x, h0.y, h1.z), level))
              + b.y * (a.x * textureLod(uNoise, vec3(h0.x, h1.y, h1.z), level) + b.x * textureLod(uNoise, vec3(h1.x, h1.y, h1.z), level)));
}

// The field at p without the fine noise. lod: how much to smooth, as a mip
// level of the noise (negative: finer than its texels; the fine noise still
// gains from that). Also gives the height over the base's level (y, in
// units of the shell's depth), the place in the noise (q.xyz), how rough
// the cloud is there (q.w), how thick it is from base to top (body, 1 for a
// deck), the billows there (lump: positive on one, negative between them)
// and the field of the base alone (base: rising by 2 per km over it).
float cloudShape(vec3 p, float lod, bool fine, out float y, out vec4 q, out float body, out float lump, out float base) {
  float h = heightAt(p);
  q = vec4(0.0);
  body = 0.0;
  lump = 0.0;
  base = -9.0;
  y = (h - CB) / (CT - CB);
  if (y <= 0.0 || y >= 1.0) return -9.0;
  vec2 x = p.xz + uDrift;
  vec4 w = weather(p, x, lod, fine);
  // The level of the bases, where rising air condenses: 150 to 300 m over
  // CB, higher or lower across tens of km (the gusts' map, w.b, serves as
  // a slow pattern). The clouds stand on it; a base is a little higher or
  // lower still from place to place (below).
  float level = CB + 0.15 + 0.15 * smoothstep(0.25, 0.75, w.b);
  y = (h - level) / (CT - CB);
  base = 2.0 * (h - level);
  // The cloud amount sets the level of the map above which clouds stand.
  // Each heap of the map is a dome: its top stands as high as the map's G
  // says (higher in the middle of a heap, and on some heaps more than on
  // others), so that a field of cloud is a field of domes even where the
  // cover is whole. The tallest heaps are towers, unless the clouds are few.
  float tower = smoothstep(0.55, 0.95, w.g) * smoothstep(0.1, 0.5, uCloud);
  float e = 3.0 * (w.r - 0.936 + uCloud * (1.181 - uCloud * (2.197 - 2.102 * uCloud))) + 1.5 * tower;
  // A dome over a flat base, with steep sides: a height costs its cube.
  // Wider clouds are thicker, up to a point; a deck swells where the map
  // is high.
  // Where the cover is thick all round, the heaps flatten into a deck of
  // small cells (stratocumulus).
  float deck = smoothstep(2.6, 3.6, e);
  float top = 0.12 + 0.32 * w.g * (1.0 - 0.6 * deck) + 0.25 * tower;
  float thick = 1.0 - exp(-e / 1.6);
  float cube = top * top * top;
  float swell = 0.25 * max(e - 1.0, 0.0);
  float f = 1.6 * (thick + swell - y * y * y / cube) - 4.0 * max(y - 0.85, 0.0);
  // The cube costs nothing near the base: there the thin edge of a cloud,
  // where the map is barely over its level, would reach out sideways as a
  // wide, flat sheet. Round off the lowest 180 m, so that a base ends under
  // the side of its cloud.
  float rim = max(1.0 - y / 0.04, 0.0);
  f -= 0.2 * rim * rim;
  // A thicker cloud has bigger lumps, and a tower bigger still.
  float lumps = LUMPS * (0.7 + 1.3 * w.g) * (1.0 - 0.2 * deck) * (1.0 + 0.3 * swell) * (1.0 + sqrt(tower));
  if (f < -0.6 * lumps) return f;                    // no noise could make a cloud here
  // The noise repeats every few km. Read it at a depth that drifts from
  // place to place, so that no two tiles show the same clouds.
  vec4 far = textureLod(uWeather, x / WEATHER_KM + 0.37, 5.5);
  q.xyz = vec3(x.x, h, x.y) / BASE_KM + vec3(far.b, 2.5 * far.r, far.g);
  // Near the eye (a pixel finer than 16 m) through the spline, which
  // smooths the bends of the GPU's filter; the distance decides, as in
  // weather. Only where the fine noise is wanted too: the surface, not the
  // shadows.
  float spline = fine ? clamp(-2.0 - log2(1.6 * uTan / uRes.y * length(p) / TEXEL_KM), 0.0, 1.0) : 0.0;
  vec4 n = spline < 1.0 ? textureLod(uNoise, q.xyz, max(lod, 0.0)) : vec4(0.0);
  if (spline > 0.0) n = mix(n, noiseSpline(q.xyz, 0.0), spline);
  // Hard, growing turrets stand beside older, smoother cloud.
  q.w = mix(0.45, 1.3, smoothstep(0.35, 0.65, n.g));
  // Billows of 2 km down to 125 m, rounded into domes (see cloudDetail;
  // the numbers are the means of the noise). lump: how far this place
  // stands out of them.
  n.gba *= 2.0 - n.gba;
  lump = 0.4 * (n.g - 0.712) + 0.6 * (n.b - 0.715) + 0.7 * (n.a - 0.715);
  lump = mix(lump, 0.4 * (n.b - 0.715) + 1.4 * (n.a - 0.715), deck);
  // Billows bulge out more than they dent in (smoothly: a kink where
  // lump is nought showed as a ridge along it), and they shape the outside
  // of a cloud: deep in a body they fade, so that they cannot punch holes
  // through it.
  float billows = lumps * (0.8 * lump + 0.2 * sqrt(lump * lump + 0.004)) * mix(1.0, 0.3, smoothstep(0.0, 0.6, f));
  // How high the top stands over this place, as the field has it here.
  body = pow(max(thick + swell + billows / 1.6, 0.0), 1.0 / 3.0) * top / 0.28;
  // The base is up to 120 m lower under the thick middle of a cloud and
  // under the swells of a deck (e, smooth: from the weather map) and a little
  // higher or lower from place to place (n.r, lump: the noise of the tile
  // is read through the GPU's filter, whose facets show on a surface as
  // smooth as a base, so they move it little). It stays clear of the
  // shell's own cut at CB even where shreds hang below it (cloudField).
  // Its field rises by 2 per km: a base is dense 15 to 30 m in, soft but
  // not deep (a deeper one cost more steps than it showed).
  base += 2.0 * (0.05 * clamp(e, 0.0, 2.4) - 0.04 * (n.r - 0.571) + 0.15 * lump);
  return f + billows;
}

// The fine noise at q (a place in the noise of the tile) on a cloud of
// roughness rough, in units of the field: billows of 300 m down to 20 m,
// read a mip level sharper than the pixel (the mean over the frames
// averages what that leaves). The 300 m billows stand out about a third of
// their width, the smaller ones up to a half, so that smaller billows sit
// on larger ones: a cauliflower. Equal weights made a foam.
// Nothing smaller: light spreads over tens of metres inside a cloud, and
// near the eye a cloud is a fog.
float cloudDetail(vec3 q, float lod, float rough) {
  // Worley noise rises in cones to its points; v (2 - v) rounds them into
  // domes with creases between them, as the billows of a cloud.
  vec4 d = textureLod(uNoise, q * DETAIL, lod + 1.7);
  d.gba *= 2.0 - d.gba;
  float f = 0.15 * (d.r - 0.571) + 0.4 * (d.g - 0.712) + 0.3 * (d.b - 0.715) + 0.2 * (d.a - 0.715);
  // Near the eye, smaller billows on those: the same noise 8 times finer
  // (billows of 36 m down to 2 m), and 8 times finer again, each turned
  // about the vertical (whole numbers keep it repeating in the tile), and
  // each only where a pixel is fine enough to show it.
  float l1 = lod + 4.7;
  if (l1 < 1.5) {
    vec3 u = vec3(fract(q.x), q.y, fract(q.z));
    vec4 m = textureLod(uNoise, vec3(50.0 * u.x + 25.0 * u.z, 56.0 * u.y, 50.0 * u.z - 25.0 * u.x), l1);
    m.gba *= 2.0 - m.gba;
    f += (1.0 - smoothstep(0.5, 1.5, l1)) * (MICRO.x * (m.g - 0.712) + MICRO.y * (m.b - 0.715) + MICRO.z * (m.a - 0.715));
    float l2 = l1 + 3.0;
    if (l2 < 1.5) {
      m = textureLod(uNoise, vec3(156.0 * u.x + 420.0 * u.z, 448.0 * u.y, 156.0 * u.z - 420.0 * u.x), l2);
      m.gba *= 2.0 - m.gba;
      f += (1.0 - smoothstep(0.5, 1.5, l2)) * MICRO.w * (0.5 * (m.g - 0.712) + 0.3 * (m.b - 0.715) + 0.2 * (m.a - 0.715));
    }
  }
  return RELIEF * rough * f;
}

// The field at p; fine: with the fine noise, which also comes out by
// itself (bump: positive on a billow, negative in a crease). lump: see
// cloudShape. A thin cloud is rougher: its edge frays. Also gives the
// depth at which the cloud there is dense (edge, km).
float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge, out float lump,
                 out vec4 q, out float fb) {
  float base;
  float f = cloudShape(p, lod, fine, y, q, body, lump, base);
  float c = min(f, base);
  fb = f - base;
  // Hard, growing turrets have a crisp edge (10 m); older cloud a deeper
  // fringe. Billows smaller than the edge melt into it: a deeper one made
  // every top look like cotton wool.
  edge = mix(EDGE, 0.01, smoothstep(0.45, 1.3, q.w));
  // Shreds under a base are thin and ragged: a deep, faint fringe.
  edge = mix(edge, 0.1, 1.0 - smoothstep(-0.06, 0.0, base));
  bump = 0.0;
  if (fine && q.w > 0.0 && c > -0.25 * RELIEF) {
    float d = cloudDetail(q.xyz, lod, q.w * mix(1.5, 1.0, smoothstep(0.1, 0.6, body)));
    // The sides and tops have billows; a base is flat, and only its broad
    // mottling shows. Here and there a shred hangs below it.
    bump = min(f + d, base + 0.8 * max(d - 0.12, 0.0)) - c;
  }
  return c + bump;
}

float cloudField(vec3 p, float lod, bool fine, out float y, out float bump, out float body, out float edge) {
  float lump, fb;
  vec4 q;
  return cloudField(p, lod, fine, y, bump, body, edge, lump, q, fb);
}

// Extinction (per km) for a value of the field at height y, in a cloud of
// that body: dense a little way in (a cloud has a surface), with more water
// higher up and in thicker clouds. A smoothed field (lod) has a wider edge.
float cloudExtinction(float f, float lod, float y, float body, float edge) {
  // The edge thins slowly at first, as a fringe of wisps; seen from afar it
  // is smoothed over the pixel, and the smoothing sets its width.
  float s = 1.5 * TEXEL_KM * exp2(lod), x = clamp(f / max(edge, s), 0.0, 1.0);
  return SIGMA * x * mix(x, 1.0, min(s / edge, 1.0))
       * mix(0.45, 1.0, clamp(4.0 * y, 0.0, 1.0)) * mix(0.2, 1.0, clamp(5.0 * body - 0.5, 0.0, 1.0));
}

// Extinction (per km) at p. fine: with the fine noise.
float cloudDensity(vec3 p, float lod, bool fine) {
  float y, bump, body, edge;
  float f = cloudField(p, lod, fine, y, bump, body, edge);
  return f > 0.0 ? cloudExtinction(f, lod, y, body, edge) : 0.0;
}

// Optical depth of the clouds from p towards the light, over the next
// 26 first steps' worth of distance (ds: the first); the steps grow. The
// first three see the fine noise, smoothed over some tens of metres (light
// spreads that far in a cloud), and the depth of the first two comes apart
// (crisp): bumps shade the creases beside them softly. The levels of the
// reads shrink with ds below 50 m (k < 0), so that a nearer cloud is shaded
// as a far one is, at a smaller size. The later steps are moved aside by
// off, each a third of a turn from the one before: light strays inside a
// cloud, and over the frames the shadows of other clouds soften.
float lightDepth(vec3 p, vec3 dir, float ds, float lod, vec3 off, out float crisp) {
  float tau = 0.0, s = 0.0, k = min(log2(ds / 0.05), 0.0), reach = 27.8 * max(ds, 0.015), moveAt = 5.1 * max(ds, 0.015);
  crisp = 0.0;
  for (int i = 0; i < 10; i++) {
    if (s >= reach) break;
    bool moved = s > moveAt;
    float y, bump, body, edge, l = i < 2 ? max(lod, k - 1.0) : max(lod, k) + 0.5 * float(i), sm = s + 0.5 * ds;
    float fl = cloudField(p + dir * sm + (moved ? off : vec3(0.0)), l, !moved, y, bump, body, edge);
    if (moved) off = -0.5 * off + 0.866 * cross(dir, off);   // the next one a third of a turn on
    float dt = fl > 0.0 ? cloudExtinction(fl, l, y, body, edge) * ds : 0.0;
    if (i < 2) crisp += dt; else tau += dt;
    s += ds;
    ds *= 1.6;
  }
  return tau;
}

// Optical depth of the clouds from a point on the sea, or anywhere under
// their tops, towards the light.
float shadowDepth(vec3 ps, vec3 dir, int N) {
  float t0 = max(raySphere(ps, dir, RG + CB).y, 0.0), len = raySphere(ps, dir, RG + CT).y - t0;
  if (len <= 0.0) return 0.0;
  float tau = 0.0, prev = 0.0;
  for (int i = 0; i < N; i++) {                      // most clouds are low: denser samples there
    float s1 = len * pow((float(i) + 1.0) / float(N), 1.5);
    float ds = s1 - prev;
    float lod = max(log2(0.5 * ds / TEXEL_KM), 0.0);
    tau += cloudDensity(ps - eye() + dir * (t0 + prev + 0.5 * ds), lod, false) * ds;
    prev = s1;
  }
  return tau;
}

float hg(float mu, float g) {
  return (1.0 - g * g) / (4.0 * PI * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
}

// The clouds along the ray from ta to tb: what gets through them (Tc), the
// light they send to the eye per unit of sunlight (sOne: scattered once;
// sMany: many times) and of skylight (sAmb), and the distance it comes from
// (tBar; negative without clouds).
void clouds(vec3 o, vec3 d, float ta, float tb, float jitter,
            out float Tc, out float sOne, out float sMany, out float sAmb, out float tBar) {
  const float DS_MIN = 0.02, DS_NEAR = 0.008, DS_REL = 0.0045, COARSE = 3.0, FINE = 0.35;
  Tc = 1.0; sOne = 0.0; sMany = 0.0; sAmb = 0.0; tBar = -1.0;
  float pix = 2.0 * uTan / uRes.y;
  // The steps grow with the distance. On a long path they grow faster, to
  // end within the budget; the nearest stay fine.
  const float BUDGET = COARSE * 80.0;
  // The steps also set how a cloud looks, so the plan must not jump where
  // the end of the ray does. A ray that meets the sea ends early: plan it
  // as if the sea were a mirror and the ray went on up to the tops. A ray
  // that just meets the sea is then planned like one that just misses it,
  // and a cloud in front of the horizon looks the same above and below it.
  float plan = tb;
  vec2 sea = raySphere(o, d, RG);
  if (sea.x > 0.0 && sea.x < 1e8) {
    vec3 pg = o + d * sea.x;
    plan = min(sea.x + raySphere(pg, reflect(d, normalize(pg)), RG + CT).y, 600.0);
  }
  // Up to knee the steps are DS_MIN; beyond it, rel * t. On a long path,
  // rel used to grow for the whole ray, and clouds 2 to 5 km off were
  // marched in steps of 100 to 200 m: their edges came out as thin dark
  // squiggles and a hatch. Now the steps grow from DS_REL * t by 1 + t / L,
  // where L is set so that this too ends within the budget (the sum of
  // dt / (DS_REL t (1 + t / L)) from s0 to plan), and never past rel * t:
  // fine near the eye, as before far off. The whole budget is for the part
  // beyond the knee, wherever the ray enters the shell. It used to pay for
  // the part before the knee as well: once the eye came within about 6 km
  // of the tops, that part ate the budget, the steps beyond it grew three
  // times longer, and the noise read with them was smoothed as much, so the
  // clouds below went soft between 6.5 and 5.2 km. The march's own limit
  // (CLOUD_STEPS) pays for the near part.
  float knee = DS_MIN / DS_REL;
  float s0 = max(ta, knee), E = exp(DS_REL * BUDGET);
  float L = plan > E * s0 ? s0 * plan * (E - 1.0) / (plan - E * s0) : 1e9;
  float rel = DS_REL * max(1.0, log(max(plan, knee) / max(ta, knee)) / DS_REL / BUDGET);
  // Light scattered once keeps the forward peak of the droplets; light
  // scattered many times goes deeper and forgets its direction. These five
  // terms stand for the orders of scattering; a thick cloud top that faces
  // the light comes out with an albedo near 0.7.
  float mu = dot(d, uLight);
  // With the sun on the horizon, the thin fringes towards it glowed like
  // red-hot wire against clouds near black; in photographs at sunset the
  // rims are pink or gold and faint. Their forward peak is halved then.
  float p0 = mix(0.8, 0.4, 1.0 - smoothstep(-0.02, 0.12, uLight.y)) * hg(mu, 0.8) + 0.2 * hg(mu, -0.25);
  float p1 = 0.6 * hg(mu, 0.4), p2 = 1.4 * hg(mu, 0.1), p3 = 1.6 / (4.0 * PI), p4 = 0.3 / (4.0 * PI);
  float ds = max(DS_NEAR, ta * min(DS_REL * (1.0 + ta / L), rel)), dsAir = max(DS_MIN, ds);
  float t = ta + jitter * COARSE * dsAir, wsum = 0.0, tsum = 0.0;
  // The field tells how far the next surface is, roughly: stride through
  // clear air, and slow down to a pixel's worth near a cloud, so that its
  // edge comes out crisp. came: the step that led here.
  float fPrev = 1.0, came = COARSE * dsAir;
  int walk = 0;
  // The light of the last sample; deeper in the same cloud the next ones
  // share it.
  float one = 0.0, many = 0.0, amb = 0.0;
  bool lit = false;
  float TcLit = 1.0, column = -1.0;
  for (int i = 0; i < CLOUD_STEPS; i++) {
    if (t >= tb || Tc < 0.01) break;
    ds = max(DS_NEAR, t * min(DS_REL * (1.0 + t / L), rel));
    dsAir = max(DS_MIN, ds);
    float lod = log2(max(0.8 * pix * t, 0.2 * ds) / TEXEL_KM);
    vec3 p = d * t;
    float y, bump, body, edge, lump, fb;
    vec4 q;
    float f = cloudField(p, lod, true, y, bump, body, edge, lump, q, fb);
    if (f > 0.0 && came > 1.5 * ds) {
      // Strode into a cloud: go back and walk, though not to before the
      // start (with the eye in a cloud, that would put the cloud behind
      // it, and the sky would show through).
      t = max(t - (came - ds), ta);
      came = ds;
      walk = 3;
      continue;
    }
    // Under a base, which has no fine noise, the fine steps are no finer
    // than dsAir: rays that graze it crept along it.
    float dsIn = mix(ds, dsAir, smoothstep(0.0, 0.1, fb));
    float next;
    if (f > 0.0) {
      // Fine steps find the surface and what shows through its fringe;
      // where little gets through, the old steps do.
      float den = cloudExtinction(f, lod, y, body, edge);
      // In a faint fringe (a shred) a step may be as long as takes a
      // seventh of the light, up to dsAir.
      next = clamp(0.5 * f, FINE * dsIn, max(mix(dsAir, dsIn, smoothstep(0.1, 0.6, Tc)), min(dsAir, 0.15 / max(den, 1e-3))));
      float a = 1.0 - exp(-den * next);
      // Not at every fine step near the eye: once more when 30 % more of
      // the light has gone (a fifth cost 3 ms more under a deck and
      // looked the same).
      // A cloud seen through others that already hide more than 85 % of
      // what lies behind takes their light: it would show little of its
      // own, and the light is most of the cost.
      if ((!lit && (Tc > 0.15 || TcLit > 0.99)) || (Tc > 0.4 && TcLit - Tc > 0.3)) {
        lit = true;
        TcLit = Tc;
        // Light the cloud where the ray met its surface, not where the
        // step happened to land beneath it.
        vec3 ps = fPrev < 0.0 ? p - d * (came * f / (f - fPrev)) : p;
        float fs = fPrev < 0.0 ? 0.0 : f;
        // Which way the surface faces: the field falls towards the light
        // on a side turned to it. A thick cloud is a matt surface: the
        // light it sends back goes with the cosine. The steps towards the
        // light shrink with the distance below 8 km (to 15 m), and so does
        // the reach towards the sky (to 50 m): a near cloud shows its small
        // billows lit and shaded as a far one shows its big ones. The
        // offsets of the light's later steps turn from frame to frame by
        // interleaved gradient noise, which covers the circle evenly over
        // the frames (white noise left a grain in the settled picture).
        float crisp;
        vec3 side = normalize(cross(uLight, abs(uLight.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        float ang = 2.0 * PI * ign(gl_FragCoord.yx + 5.588238 * uPass + 11.0);
        vec3 off = PENUMBRA * sqrt(hash(gl_FragCoord.xy + 3.71 * uPass + 19.1)) * (cos(ang) * side + sin(ang) * cross(uLight, side));
        // The billows shade one another: the field with the fine noise
        // smoothed over a few first steps of the light (mid: what it adds
        // at ps) gives the normal (facing) and the hollows, which get less
        // light (hollow). Smaller creases stay unshaded: they made a foam of
        // dark lines.
        vec3 dp = ps - p;
        float step = max(clamp(0.00625 * t, LIGHT_MIN, 0.05), 0.6 * ds);
        float lm = max(lod, min(log2(step / 0.05), 0.0) - 0.5) + 1.0;
        vec3 qs = q.xyz + vec3(dp.x, heightAt(ps) - heightAt(p), dp.z) / BASE_KM;
        // (Well under a base, mid is a shred's at most: not worth a read.)
        float mid = 0.0;
        if (q.w > 0.0 && fb < 0.3) {
          float dm = cloudDetail(qs, lm, q.w * mix(1.5, 1.0, smoothstep(0.1, 0.6, body)));
          mid = (min(fb + dm, 0.8 * max(dm - 0.12, 0.0)) - min(fb, 0.0)) * (1.0 - smoothstep(0.2, 0.3, fb));
        }
        float tau = lightDepth(ps, uLight, step, lod, off, crisp);
        // Which way the surface faces, from the field smoothed as for mid:
        // its gradient, normalised, so that each billow turns from the light
        // by degrees (the slope towards the light alone was lit or not, as
        // the field is steep).
        float y0, b0, c0, e0;
        float h = 1.5 * step;
        // The same at the size of whole billows (at least 120 m, from the
        // field without the fine noise: with it the picture barely changed,
        // at 4 ms more near the tops): in photographs the light falls off over a
        // billow, from its lit top to a grey side, and the small bumps on it
        // are only faintly shaded, as light spreads inside the cloud. The
        // normal of the small bumps alone made a cloud white all over, with
        // small dark creases, like snow.
        float hL = max(h, 0.12), lmL = max(lm, max(lod, log2(hL / 0.075) - 0.5) + 1.0);
        float fL = cloudField(ps, lmL, false, y0, b0, c0, e0);
        vec3 gL = vec3(cloudField(ps + hL * uLight, lmL, false, y0, b0, c0, e0),
                       cloudField(ps + hL * side, lmL, false, y0, b0, c0, e0),
                       cloudField(ps + hL * cross(uLight, side), lmL, false, y0, b0, c0, e0)) - fL;
        float facingL = clamp((0.4 - gL.x / max(length(gL), 1e-6)) / 1.4, 0.0, 1.0);
        // With the sun low, a side turned from it is lit by the sky more than
        // by sunlight that went through the cloud: blue-grey against the warm
        // sunlit side, as in photographs at a low sun.
        float low = 1.0 - smoothstep(0.05, 0.35, uLight.y);
        float shapeL = mix(SHAPE * (1.0 - 0.5 * low), 1.1, facingL * facingL * (3.0 - 2.0 * facingL));
        // Which way the surface faces, from the field smoothed as for mid:
        // its gradient, normalised, so that each billow turns from the light
        // by degrees (the slope towards the light alone was lit or not, as
        // the field is steep). Beyond 8 km, where the light's first step is
        // 50 m and a pixel some 10 m, the billows' normal is nearly the
        // whole billows' one: that one serves (four reads of the fine noise
        // fewer).
        bool far = step >= 0.05;
        float f0 = far ? fL : cloudField(ps, lm, true, y0, b0, c0, e0);
        vec3 grad = far ? gL : vec3(cloudField(ps + h * uLight, lm, true, y0, b0, c0, e0),
                                    cloudField(ps + h * side, lm, true, y0, b0, c0, e0),
                                    cloudField(ps + h * cross(uLight, side), lm, true, y0, b0, c0, e0)) - f0;
        if (far) h = hL;
        float glen = max(length(grad), 1e-6);
        float facing = clamp((0.3 - grad.x / glen) / 1.3, 0.0, 1.0);
        // The normal; out along it, the field falls as fast as it rises
        // here on a billow in the open, and less in a crease between
        // billows (occ: 1 where it does not fall at all).
        vec3 nrm = -(grad.x * uLight + grad.y * side + grad.z * cross(uLight, side)) / glen;
        float fo = cloudField(ps + 2.0 * h * nrm, far ? lmL : lm, !far, y0, b0, c0, e0);
        float occ = clamp((fo - f0) / (2.0 * glen) + 1.0, 0.0, 1.0);
        // The sky lights what faces up, the higher the better. This
        // follows the field without the fine noise: light spreads over
        // tens of metres in a cloud, and the creases of the fine noise
        // came out as thin dark lines.
        float yu, bu, cu, eu;
        float reach = max(clamp(0.0125 * t, 0.05, 0.1), 2.0 * exp2(lod) * TEXEL_KM);
        float rise = (cloudField(ps + normalize(ps + eye()) * reach, lod, false, yu, bu, cu, eu) - (fs - bump)) / reach;
        float hm = 6.0 * mid, hollow = 1.0 + hm / (1.0 + max(-hm / 0.25, hm / 0.1));   // 75 % to 110 %
        // From below, a deck shows its cells: thick middles darker, thin
        // rims lighter, some 600 m across (Worley cells of the noise, read
        // at 3.5 times the tile's frequency: a texel of 18 m, whose facets
        // do not show; the tile's own 62 m texels did, as blocks).
        if (rise > 0.0) {
          float cell = textureLod(uNoise, qs * 3.5, max(lod + 1.8, 0.0)).g;
          cell *= 2.0 - cell;
          hollow *= mix(1.0, clamp(exp(-3.0 * (cell - 0.712)), 0.6, 1.4), min(rise, 1.0));
        }
        float open = (0.6 - 0.4 * rise / sqrt(rise * rise + 2.0))
                   * mix(0.6, 1.0, clamp((heightAt(p) - CB) / 1.5, 0.0, 1.0));
        // Light scattered a few times casts the crisp shadows of the
        // bumps; light scattered many times goes round them, and the last
        // term comes through the whole cloud or from its neighbours. A
        // thin cloud lets most of the light through: only a thick one is
        // brilliant. Far off, where the billows of the fine noise are
        // smaller than a pixel, the tops of those of the tile catch more of
        // it than the creases between them.
        float soft = tau + 0.4 * crisp;
        tau += crisp;
        float white = 1.12 * body / (body + 0.12);
        float billow = clamp(1.0 + 2.0 * smoothstep(5.0, 30.0, t) * lump, 0.6, 1.3);
        // A side turned from the light still sees the sunlit cloud around
        // it: white light, of the sun and of the sky, as that cloud sends.
        float bounce = (1.0 - facing) * clamp(dot(ps + eye(), uLight) / length(ps + eye()), 0.0, 1.0);
        one = p0 * exp(-tau);
        float crease = 1.0 - CREASE * occ;
        // Light that comes down through the cloud above, scattered many
        // times on the way (the sky's, and the sun's that went deep): what
        // a slab of that depth lets through (two streams, g = 0.85). Under
        // a deck its thick cells are darker than the thin gaps between them.
        // (Once per cloud the ray enters: it changes little within one,
        // and costs five reads of the field.)
        if (column < 0.0 || fPrev < 0.0) column = 1.0 / (1.0 + COLUMN * max(shadowDepth(ps + eye(), normalize(ps + eye()), 5) - 5.0, 0.0));
        open = mix(open, 0.55 + 0.35 * dot(nrm, normalize(ps + eye())), 0.5);
        // SUNLIT: the gain of the light scattered many times, and SKYLIT that
        // of the sky's: a sunlit top keeps room below white for its
        // gradients, and a side in shadow is a luminous blue-grey, lit by
        // the sky, not a dark grey.
        many = shapeL * crease * hollow * billow * white * (SUNLIT * mix(0.15, 1.0, facing) * (p1 * exp(-0.4 * tau) + p2 * exp(-0.15 * soft))
                                 + column * (SUNLIT * mix(DEEP * (1.0 - 0.5 * low), 1.0, facing) * p3 * exp(-0.05 * soft)
                                 + p4 * exp(-0.012 * soft)) + 0.02 * bounce);
        amb = SKYLIT * crease * hollow * billow * (column * open * mix(1.0, white, 0.5) + 0.15 * bounce);
      }
      sOne += Tc * a * one;
      sMany += Tc * a * many;
      sAmb += Tc * a * amb;
      wsum += Tc * a;
      tsum += Tc * a * t;
      Tc *= 1.0 - a;
    } else {
      lit = false;
      next = clamp(-0.35 * f, FINE * dsIn, COARSE * dsAir);
      if (walk > 0) {
        next = min(next, ds);
        walk--;
      }
    }
    fPrev = f;
    came = next;
    t += next;
  }
  if (Tc < 0.01) Tc = 0.0;
  if (wsum > 0.0) tBar = tsum / wsum;
}

// ---------- Sea ----------
// Light scattered back out of clear ocean water, per unit of light going
// in (as a matt surface would), for the twelve wavelengths: blue, and hardly
// any red.
const vec4 SEA[3] = vec4[3](
  vec4(0.026, 0.028, 0.026, 0.019), vec4(0.012, 0.0070, 0.0038, 0.0017), vec4(0.0006, 0.0004, 0.0003, 0.0002));

// The sky as the sea sees it, towards dir: a short march, enough for a
// reflection.
void skyAt(vec3 p0, vec3 dir, float betaM, float extM, out vec4 S[3]) {
  const int NS = 8;
  S[0] = vec4(0.0); S[1] = vec4(0.0); S[2] = vec4(0.0);
  float tmax = raySphere(p0, dir, RT).y;
  vec2 phaseSun = phases(dot(dir, uSun));
  vec2 phaseMoon = phases(dot(dir, uMoon));
  vec3 od = vec3(0.0);
  vec4 Tv[3];
  float prev = 0.0;
  for (int i = 0; i < NS; i++) {
    float f = (float(i) + 1.0) / float(NS);
    float t1 = tmax * f * f;
    float dt = t1 - prev;
    vec3 p = p0 + dir * (prev + 0.5 * dt);
    prev = t1;
    float r = length(p);
    float h = max(r - RG, 0.0);
    vec3 dens = density(h) * dt;
    od += 0.5 * dens;
    float scM = betaM * dens.y;
    for (int k = 0; k < 3; k++) {
      Tv[k] = exp(-(uBR[k] * od.x + extM * od.y + uBO[k] * od.z));
    }
    if (uSunI > 0.0) addLight(p, r, h, od, dens, scM, extM, uSun, uSunI, 1.0, 1.0, phaseSun, Tv, S);
    if (uMoonI > 0.0) addLight(p, r, h, od, dens, scM, extM, uMoon, uMoonI, 1.0, 1.0, phaseMoon, Tv, S);
    od += 0.5 * dens;
  }
}

// How much of a rough sea hides behind its own waves, seen from a direction
// with cosine c to the vertical (Smith's term for Gaussian slopes, in the
// rational form of Walter et al., 2007).
float waveShade(float c, float s2) {
  float a = c / sqrt(s2 * max(1.0 - c * c, 1e-6));
  return a < 1.6 ? (1.0 - 1.259 * a + 0.396 * a * a) / (3.535 * a + 2.181 * a * a) : 0.0;
}

// Map of the waves, repeating (drawn at start). R, G: the slope of a wind
// sea along x and z, in units of its rms; B: the slope squared; A: streaks.
uniform sampler2D uWaves;
const vec2 WIND = vec2(0.8944, 0.4472);              // the wind blows this way (x, z)
// Swell from far storms: plane waves with a whole number of crests (x, z)
// in WEATHER_KM, and the amplitude of their slope along x and z. Two
// trains: six waves of 200 to 340 m, and two of 120 to 170 m from elsewhere.
const int SWELLS = 8;
const vec4 SWELL[SWELLS] = vec4[SWELLS](
  vec4(-1246.0, 182.0, -0.0109, 0.0016), vec4(-1043.0, 324.0, -0.0114, 0.0035),
  vec4(-1061.0, 74.0, -0.0152, 0.0011), vec4(-978.0, -23.0, -0.0111, -0.0003),
  vec4(-827.0, 187.0, -0.0112, 0.0025), vec4(-794.0, 212.0, -0.0118, 0.0031),
  vec4(-775.0, -1975.0, -0.0036, -0.0091), vec4(-468.0, -1475.0, -0.0031, -0.0098));

// The sea at pg, at distance t along d, behind air of depth od and under
// clouds of depth tau towards the light: the glitter of the sun on the
// waves, the mirrored sky, and the blue light from below.
// The slopes of the waves have the variance of Cox and Munk (1954). The
// waves long enough for the picture to show tilt the surface: swell, and
// three bands of the wind sea from the map. What a pixel's footprint
// averages away stays in the variance, so that the light of the glitter
// is the same from near and far.
void addSea(vec3 pg, vec3 d, float t, vec3 od, float betaM, float extM, float vis, float tau, inout vec4 L[3]) {
  vec3 n = normalize(pg);
  vec3 ps = pg + n * 0.001;
  float cv = max(dot(n, -d), 0.0);
  float pix = 2.0 * uTan / uRes.y;
  // Axes on the sea along the map's x and z, and the footprint of the pixel
  // on them: fa along the view (long when seen aslant), fc across.
  vec3 ex = normalize(vec3(1.0, 0.0, 0.0) - n * n.x), ez = cross(ex, n);
  vec2 x = pg.xz + uDrift;
  vec2 dh = vec2(dot(d, ex), dot(d, ez));
  float dl = length(dh);
  vec2 ua = dl > 1e-4 ? dh / dl : vec2(1.0, 0.0);
  float across = pix * t, along = across / max(cv, 0.02);
  vec2 fa = along * ua, fc = across * vec2(-ua.y, ua.x);

  // The wind varies: gusts and calms over kilometres (the weather map),
  // more so in light airs, and streaks within them.
  float gust = textureLod(uWeather, x / WEATHER_KM, log2(max(along / (WEATHER_KM / 1024.0), 1.0))).b;
  float streak = textureGrad(uWaves, x * (40.0 / WEATHER_KM), fa * (40.0 / WEATHER_KM), fc * (40.0 / WEATHER_KM)).a;
  float wind = uWind * exp(mix(1.2, 0.4, smoothstep(2.0, 9.0, uWind)) * (2.0 * gust - 1.0) + 0.3 * (streak - 0.5));
  float s2 = 0.003 + 0.00512 * wind;

  // Wind waves. The longest are as long as a grown sea has them
  // (0.9 U^2 metres), ten to a tile of the map; each band reaches down to a
  // sixth of that, and holds the same variance (0.0075, from the constant
  // of Phillips), up to a fifth of the whole. slope: the tilt of the
  // footprint; hidden: the variance within it.
  float share = min(0.0075 / s2, 0.2) * s2;
  float rep = max(round(WEATHER_KM / (0.0096 * uWind * uWind)), 1.0) / WEATHER_KM;
  vec2 slope = vec2(0.0);
  float hidden = 0.0, crest = 0.0;
  for (int i = 0; i < 3; i++) {
    vec4 w = vec4(0.5, 0.5, 0.125, 0.0);             // a footprint as wide as the waves averages them all
    if (along * rep < 0.12) w = textureGrad(uWaves, x * rep + 0.37 * float(i), fa * rep, fc * rep);
    vec2 s = 8.0 * w.rg - 4.0;
    float h = max(8.0 * w.b - dot(s, s), 0.0);
    slope += s;
    hidden += h;
    if (i > 0) crest += dot(s, WIND);                // the short waves, down the wind
    rep *= 6.0;
  }
  slope *= sqrt(share);
  hidden *= share;
  float micro = s2 - 3.0 * share;
  // Swell, smoothed over the footprint. Currents bend its crests: the map
  // of the streaks, read wide, shifts it by up to some 200 m.
  vec2 xs = (x + (textureLod(uWaves, x * (5.0 / WEATHER_KM), 2.0).a - 0.5) * vec2(0.24, 0.32)) / WEATHER_KM;
  for (int i = 0; i < SWELLS; i++) {
    vec2 k = SWELL[i].xy * (2.0 * PI / WEATHER_KM);
    float keep = exp(-0.125 * (dot(k, fa) * dot(k, fa) + dot(k, fc) * dot(k, fc)));
    float var = 0.5 * dot(SWELL[i].zw, SWELL[i].zw);
    slope += SWELL[i].zw * (keep * cos(2.0 * PI * fract(dot(SWELL[i].xy, xs))));
    hidden += var * (1.0 - keep * keep);
    micro -= var;
  }
  // What is left for the ripples no picture shows.
  float s2r = max(micro, 0.1 * s2) + hidden;

  // Whitecaps cover 2.95e-6 U^3.52 of the sea (Monahan and O'Muircheartaigh,
  // 1980); two fifths of that is thick, white foam. It lies in separate
  // breakers: a cell of a grid (0.3 of the longest wave) holds one at
  // most, somewhere, of some size (many small, a few large), longer along
  // the crest; more of them in the streaks of the wind. From close, count
  // what the footprint covers of the breakers around (seen sharp, a
  // breaker has an edge, ragged with the short waves); from far, take the
  // mean.
  float white = 0.4 * 2.95e-6 * pow(wind, 3.52);
  float cells = max(round(WEATHER_KM / (2.7e-4 * uWind * uWind)), 1.0);
  float cell = WEATHER_KM / cells;
  float foam = white;
  if (white > 1e-5 && along < 1.5 * cell) {
    const float SB = 0.07;                           // size of a breaker, in cells
    float chance = white / (2.0 * PI * SB * SB * 1.2) * exp(3.5 * (streak - 0.5) - 0.245);
    vec2 g = x / cell, g0 = floor(g);
    // The footprint as a Gaussian (covariance aa, ac, cc), in cells.
    vec2 ha = 0.5 * fa / cell, hc = 0.5 * fc / cell;
    vec3 cov = vec3(ha.x * ha.x + hc.x * hc.x, ha.x * ha.y + hc.x * hc.y, ha.y * ha.y + hc.y * hc.y);
    // A breaker of unit size: 1.5 SB along the crest, SB / 1.5 down the wind.
    vec3 one = SB * SB * (2.25 * vec3(WIND.y * WIND.y, -WIND.x * WIND.y, WIND.x * WIND.x)
                        + 0.444 * vec3(WIND.x * WIND.x, WIND.x * WIND.y, WIND.y * WIND.y));
    float sum = 0.0;
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec2 id = g0 + vec2(i, j);
        float r = hash(floor(mod(id, cells) + 0.5) + 0.37);       // under the chance: a breaker; also its size and place
        if (r < chance) {
          float size = fract(1731.7 * r);
          size = 0.5 * exp(1.6 * size * size);
          vec2 e = id + fract(vec2(4217.3, 9127.1) * r) - g;
          vec3 v = cov + size * size * one;
          float det = v.x * v.z - v.y * v.y;
          float sharp = size * size * SB * SB / sqrt(det);
          float b = sharp * exp(-0.5 * (v.z * e.x * e.x - 2.0 * v.y * e.x * e.y + v.x * e.y * e.y) / det);
          float edge = mix(0.3, 0.06, smoothstep(0.3, 0.9, sharp));
          sum += mix(b, smoothstep(0.37 - edge, 0.37 + edge, b * exp(0.7 * crest)), smoothstep(0.3, 0.7, sharp));
        }
      }
    }
    foam = mix(min(max(chance, 1.0) * sum, 1.0), white, smoothstep(0.6, 1.5, along / cell));
  }
  foam *= 0.5;                                       // the albedo of thick foam

  vec4 T[3], lit[3];
  for (int k = 0; k < 3; k++) {
    T[k] = vis * exp(-(uBR[k] * od.x + extM * od.y + uBO[k] * od.z));
    lit[k] = vec4(0.0);
  }
  // A cloud blocks the direct light, but lets diffuse light through.
  float soft = 1.0 / (1.0 + 0.1 * tau);
  float c = dot(n, uLight);
  if (uLightI > 0.0 && c > 0.0) {
    vec3 ol = depthToTop(ps, uLight);
    // Glitter: the share of the waves tilted so as to mirror the light to
    // the eye. That takes the slope zh; the ripples spread around the tilt
    // of the footprint.
    vec3 hv = normalize(uLight - d);
    float ch = max(dot(hv, n), 1e-3);
    vec2 zh = -vec2(dot(hv, ex), dot(hv, ez)) / ch - slope;
    float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(hv, -d), 0.0, 1.0), 5.0);
    float glint = F * exp(-dot(zh, zh) / s2r)
                / (4.0 * PI * s2r * max(cv, 1e-3) * ch * ch * ch * ch)
                / (1.0 + waveShade(max(cv, 1e-3), s2) + waveShade(c, s2));
    float direct = exp(-tau);
    for (int k = 0; k < 3; k++) {
      lit[k] = uLightI * exp(-(uBR[k] * ol.x + extM * ol.y + uBO[k] * ol.z));
      L[k] += T[k] * lit[k] * (direct * glint + soft * c / PI * (SEA[k] + foam));
    }
  }
