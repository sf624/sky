    // floats where it can filter them, else half floats (rounded to within 5e-4).
    const fullFloat = !!gl.getExtension('OES_texture_float_linear');
    // The frames and the pictures: half floats where the GPU can draw to those (see picture).
    let fine = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('EXT_color_buffer_float'));

    // Every program is compiled and linked at once, and nothing asks how
    // one went until the GPU says it is done: with
    // KHR_parallel_shader_compile, the GPU process compiles them on threads
    // of its own while the page goes on (a large shader can take seconds).
    const programs = [];
    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    };
    const link = id => {
      const prog = gl.createProgram(), shaders = [];
      for (const [type, src] of [[gl.VERTEX_SHADER, '#version 300 es\nlayout(location = 0) in vec2 p;\nvoid main() { gl_Position = vec4(p, 0.0, 1.0); }'],
        [gl.FRAGMENT_SHADER, document.getElementById(id).textContent.trim()]]) {
        shaders.push(compile(type, src));
        gl.attachShader(prog, shaders[shaders.length - 1]);
      }
      gl.linkProgram(prog);
      programs.push([prog, shaders]);
      return prog;
    };
    // Throws the compiler's message, or the linker's, if a program failed.
    const check = ([prog, shaders]) => {
      if (gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
      for (const s of shaders) if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      throw new Error(gl.getProgramInfoLog(prog));
    };
    const prog = link('fs'), noiseProgram = link('noise'), wavesProgram = link('waves');
    const mean = link('mean'), show = link('show');
    gl.flush();

    // Waits, a frame at a time, until the GPU has done all that it was
    // given (at least a frame: a fence is seen to be passed only in a later task).
    const settle = async () => {
      const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
      gl.flush();
      while (gl.getSyncParameter(sync, gl.SYNC_STATUS) !== gl.SIGNALED) await nextFrame();
      gl.deleteSync(sync);
    };
    // Runs parts of the GPU's work, [weight, fn], in batches, and waits for
    // the GPU after each: a batch doubles while the GPU gets through it in
    // under 100 ms, and halves when it takes over 250 ms. So a slow GPU is
    // never given seconds of work at once (the GPU process, which draws the
    // whole browser, would stand still that long).
    const batches = async (parts, report) => {
      for (let i = 0, batch = 4; i < parts.length;) {
        const start = performance.now();
        for (let w = 0; i < parts.length && w < batch; i++) {
          w += parts[i][0];
          parts[i][1]();
        }
        await settle();
        const ms = performance.now() - start;
        batch = ms < 100 ? Math.min(batch * 2, 128) : ms > 250 ? Math.max(1, batch / 2) : batch;
        report(i / parts.length);
      }
    };

    // Meanwhile the tables of the CPU, in slices. The table of depthToTop
    // (see there), on unit 5 below: a sum of 16 midpoint steps at each texel.
    const NM = 512, NR = 128;
    const depths = new Float32Array(NM * NR * 4);
    function* depthTable() {
      const NL = 16, H = Math.sqrt(RT * RT - RG * RG);
      for (let j = 0; j < NR; j++) {
        const rho = H * j / (NR - 1), r = Math.sqrt(rho * rho + RG * RG);
        for (let i = 0; i < NM; i++) {
          const t = (RT - r) + (rho + H - (RT - r)) * i / (NM - 1);
          const mu = t > 0 ? (H * H - rho * rho - t * t) / (2 * r * t) : 1, dt = t / NL;
          let a = 0, m = 0, o = 0;
          for (let s = 0; s < NL; s++) {
            const u = (s + 0.5) * dt;
            const h = Math.max(0, Math.sqrt(r * r + u * u + 2 * r * mu * u) - RG);
            a += Math.exp(-h / HR) * dt;
            m += Math.exp(-h / HM) * dt;
            o += Math.max(0, 1 - Math.abs(h - 25) / 15) * dt;
          }
          depths.set([a, m, o, 0], (j * NM + i) * 4);
        }
        yield;
      }
    }
    done(0.05);
    // The table of multiple scattering for the haze of the night sky (see
    // NIGHT), and then for the haze the address gives, if another.
    const forHaze = state.haze;
    const jobs = [buildDepths(), buildStars(), buildMultiScatter(NIGHT_HAZE), nightSky()];
    if (forHaze !== NIGHT_HAZE) jobs.push(buildMultiScatter(forHaze));
    jobs.push(depthTable());
    await slices(jobs, share => done(0.05 + 0.25 * share));
    builtHaze = forHaze;

    // The programs. Without the extension, asking waits until a program is
    // done: one a frame.
    for (let left = programs; left.length;) {
      left = left.filter(([p]) => parallel && !gl.getProgramParameter(p, parallel.COMPLETION_STATUS_KHR));
      done(0.3 + 0.3 * (1 - left.length / programs.length));
      if (left.length) await nextFrame();
    }
    for (const p of programs) {
      check(p);
      if (!parallel) await nextFrame();
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // Cloud textures: the 3D noise on unit 2, the weather map on unit 3.
    // The noise program draws them, slice by slice, and the weather map in
    // strips of 64 rows (the scissor), in batches.
    {
      const n = NOISE, m = WEATHER, STRIP = 64;
      const smooth = target => {
        gl.generateMipmap(target);
        gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      };
      gl.activeTexture(gl.TEXTURE2);
      const noise = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_3D, noise);
      gl.texStorage3D(gl.TEXTURE_3D, Math.log2(n) + 1, gl.RGBA8, n, n, n);
      gl.activeTexture(gl.TEXTURE3);
      const weather = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, weather);
      gl.texStorage2D(gl.TEXTURE_2D, Math.log2(m) + 1, gl.RGBA8, m, m);
      {
        const draw = noiseProgram;
        gl.useProgram(draw);
        const uZ = gl.getUniformLocation(draw, 'uZ'), uSize = gl.getUniformLocation(draw, 'uSize');
        const target = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, target);
        gl.viewport(0, 0, n, n);
        gl.uniform1f(uSize, n);
        const parts = [];
        for (let z = 0; z < n; z++) {
          parts.push([1, () => {
            gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, noise, 0, z);
            gl.uniform1f(uZ, (z + 0.5) / n);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          }]);
        }
        parts.push([0, () => {
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, weather, 0);
          gl.viewport(0, 0, m, m);
          gl.uniform1f(uSize, m);
          gl.uniform1f(uZ, -1);
          gl.enable(gl.SCISSOR_TEST);
        }]);
        for (let y = 0; y < m; y += STRIP) {
          parts.push([STRIP * m / (n * n), () => {      // weighed as slices of as many texels
            gl.scissor(0, y, m, STRIP);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          }]);
        }
        parts.push([0, () => gl.disable(gl.SCISSOR_TEST)]);
        await batches(parts, share => done(0.6 + 0.25 * share));
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.deleteFramebuffer(target);
        gl.deleteProgram(draw);
      }
      smooth(gl.TEXTURE_2D);
      gl.activeTexture(gl.TEXTURE2);
      smooth(gl.TEXTURE_3D);
      gl.activeTexture(gl.TEXTURE0);
    }

    // The map of the waves on the sea, on unit 4, drawn by its own program.
    {
      const n = 512;
      gl.activeTexture(gl.TEXTURE4);
      const waves = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, waves);
      gl.texStorage2D(gl.TEXTURE_2D, Math.log2(n) + 1, gl.RGBA8, n, n);
      const draw = wavesProgram;
      gl.useProgram(draw);
      gl.uniform1f(gl.getUniformLocation(draw, 'uSize'), n);
      const target = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, target);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, waves, 0);
      gl.viewport(0, 0, n, n);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.deleteFramebuffer(target);
      gl.deleteProgram(draw);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, anisotropy);
      gl.activeTexture(gl.TEXTURE0);
    }
    await settle();
    done(0.88);

    // The table of depthToTop, on unit 5.
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
      [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) {
      gl.texParameteri(gl.TEXTURE_2D, k, v);
    }
    gl.texImage2D(gl.TEXTURE_2D, 0, fullFloat ? gl.RGBA32F : gl.RGBA16F, NM, NR, 0, gl.RGBA, gl.FLOAT, depths);
    gl.activeTexture(gl.TEXTURE0);
    gl.useProgram(prog);
    const U = n => gl.getUniformLocation(prog, n);
    gl.uniform1i(U('uDepth'), 5);
    gl.uniform1i(U('uNoise'), 2);
    gl.uniform1i(U('uWeather'), 3);
    gl.uniform1i(U('uWaves'), 4);
    gl.uniform4fv(U('uBR'), new Float32Array(BR));
    gl.uniform4fv(U('uBO'), new Float32Array(BO));
    gl.uniform4fv(U('uWL'), new Float32Array(WL.map(l => l / 550)));
    gl.uniform1f(U('uNight'), NIGHT);
    gl.uniform4fv(U('uWR'), new Float32Array(W[0]));
    gl.uniform4fv(U('uWG'), new Float32Array(W[1]));
    gl.uniform4fv(U('uWB'), new Float32Array(W[2]));
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
      [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) {
      gl.texParameteri(gl.TEXTURE_2D, k, v);
    }
    gl.uniform1i(U('uMS'), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, GRID * SLOTS, GRID, 0, gl.RGBA, gl.FLOAT, starData);
    gl.uniform1i(U('uStars'), 1);
    gl.activeTexture(gl.TEXTURE0);
    const uRes = U('uRes'), uCam = U('uCam'), uTan = U('uTan'), uSun = U('uSun');
    const uHaze = U('uHaze'), uExposure = U('uExposure'), uLook = U('uLook');
    const uSunI = U('uSunI'), uMoon = U('uMoon'), uMoonI = U('uMoonI'), uSky = U('uSky');
    const uEarth = U('uEarth'), uAlt = U('uAlt'), uCloud = U('uCloud'), uWind = U('uWind');
    const uDrift = U('uDrift'), uCirrus = U('uCirrus');
    const uLight = U('uLight'), uLightI = U('uLightI');
    const uJitter = U('uJitter'), uPass = U('uPass');
    let tableHaze = null;
    // Draws the view v, w by h pixels, into the bound framebuffer.
    const draw = (v, cam, w, h) => {
      if (tableHaze !== builtHaze) {
        gl.texImage2D(gl.TEXTURE_2D, 0, fullFloat ? gl.RGBA32F : gl.RGBA16F, NMU, 3 * NH, 0, gl.RGBA, gl.FLOAT, msData);
        tableHaze = builtHaze;
      }
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h);
      gl.uniformMatrix3fv(uCam, false, cam);
      gl.uniform1f(uTan, Math.tan(v.fov / 2));
      gl.uniform3fv(uSun, state.sun);
      gl.uniform1f(uSunI, state.sunOn);
      gl.uniform3fv(uMoon, state.moon);
      gl.uniform1f(uMoonI, state.moonI);
      gl.uniformMatrix3fv(uSky, false, state.sky);
      // Earthshine is 1e-6 in these units, but the night exposure would burn
      // it out and hide the phase. The eye adapts to the moon locally; so
      // hold the dark side at a dim grey (20 is the shader's ISUN).
      gl.uniform1f(uEarth, Math.min(1e-6, 0.06 / (20 * v.exposure)));
      gl.uniform1f(uHaze, state.haze);
      gl.uniform1f(uExposure, v.exposure);
      gl.uniform1f(uLook, v.look);
      gl.uniform1f(uAlt, v.alt);
      gl.uniform1f(uCloud, v.cloud);
      gl.uniform1f(uWind, state.wind);
      gl.uniform2fv(uDrift, state.drift);
      gl.uniform1f(uCirrus, state.cirrus);
      gl.uniform3fv(uLight, state.light);
      gl.uniform1f(uLightI, state.lightI);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    // Fits the canvas to its place on the page. Returns 0 when it has no
    // place, 2 when its size has changed, else 1.
    const fit = () => {
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      if (!cw || !ch) return 0;
      let scale = Math.min(window.devicePixelRatio || 1, 2);
      scale = Math.min(scale, Math.sqrt(heroPixels / (cw * ch)));
      const w = Math.max(1, Math.round(cw * scale)), h = Math.max(1, Math.round(ch * scale));
      if (canvas.width === w && canvas.height === h) return 1;
      canvas.width = w;
      canvas.height = h;
      return 2;
    };

    // The aircraft's view. Each frame is drawn into a texture, joins the
    // picture so far in a second one (the shader "mean"), and that picture
    // is copied to the canvas (the shader "show"). The textures hold half
    // floats where the GPU can draw to those (eight times finer steps than
    // 8 bits, so the mean of many frames stays smooth); else 8 bits. Each
    // has a second texture of 8 bits for the distances and the counts.
    const uSteps = U('uSteps');
    const M = {};
    gl.useProgram(mean);
    for (const n of ['uRes', 'uCam', 'uTan', 'uAlt', 'uCamPast', 'uResPast', 'uWay', 'uTrust', 'uSteps', 'uPass']) {
      M[n] = gl.getUniformLocation(mean, n);
    }
    // Texture units 6 to 9: the new frame and the picture so far.
    ['uFrame', 'uFrameAux', 'uPast', 'uPastAux'].forEach((n, i) => gl.uniform1i(gl.getUniformLocation(mean, n), 6 + i));
    gl.useProgram(show);
    gl.uniform1i(gl.getUniformLocation(show, 'uPicture'), 6);
    const uSize = gl.getUniformLocation(show, 'uSize'), uDither = gl.getUniformLocation(show, 'uDither');
    gl.useProgram(prog);
    // A picture of w by h pixels: `old` if it has that size, else a new one in its place.
    const picture = (old, w, h) => {
      if (old && old.w === w && old.h === h) return old;
      if (old) {
        gl.deleteFramebuffer(old.target);
        gl.deleteTexture(old.colour);
        gl.deleteTexture(old.aux);
      }
      const p = { w, h, target: gl.createFramebuffer(), colour: gl.createTexture(), aux: gl.createTexture() };
      gl.activeTexture(gl.TEXTURE6);

  const time = document.getElementById('time'), moon = document.getElementById('moon');

  const cirrus = document.getElementById('cirrus'), cirrusOut = document.getElementById('cirrusOut');
  function showLabels() {
    const T = TEXT[LANG];
    // Hours and minutes, as a clock shows them (the minute that has begun).
    const e = state.elev, t = state.time % 24, m = Math.floor(t * 60 + 1e-6);
    const clock = String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    timeOut.textContent = clock + ' ' + (e < -18 ? T.night : e < -12 ? T.astronomical : e < -6 ? T.nautical

    moonOut.textContent = a < 1.5 || a > 28 ? T.newMoon : Math.abs(a - 7.4) < 1 ? T.firstQuarter

    cloudOut.textContent = T.clouds[state.cloud < 0.02 ? 0 : state.cloud < 0.35 ? 1 : state.cloud < 0.65 ? 2 : state.cloud < 0.9 ? 3 : 4];
    windOut.textContent = state.wind.toFixed(0) + ' m/s';
    speedOut.textContent = state.speed.toFixed(0) + ' km/h';

  // The date slider covers this year. The moon's age follows the date (mean

    for (const id in sliders) read(id);

      update();
    });
  }
  showFullScreen();

  new ResizeObserver(update).observe(document.body);
  window.addEventListener('resize', update);
  readInputs();
  // ?now=1 is the button; ?rate= (one of the select's) and ?play=1 are the
  // select and the play button.
  if (params.get('now') === '1') toNow();
  if ([...rate.options].some(o => o.value === params.get('rate'))) {
    rate.value = params.get('rate');
    rate.dispatchEvent(new Event('change'));
  }
  if (params.get('play') === '1' && !playing) setPlaying(true);
  // Start with the sun off to one side, where it models the clouds best.
  celestial();
  state.yaw = params.has('yaw') ? params.get('yaw') * RAD : Math.atan2(state.sun[0], state.sun[2]) + 65 * RAD;
  if (params.has('pitch')) state.pitch = params.get('pitch') * RAD;
  // The view starts out of a window ahead and to the right of the nose.
  state.heading = params.has('heading') ? (+params.get('heading') || 0) * RAD : state.yaw - 60 * RAD;
  // A place to start from, in km: ?at=120,40
  if (params.has('at')) {
    const [x, z] = params.get('at').split(',');
    state.drift = [wrap(+x || 0), wrap(+z || 0)];
  }

  // ---------- Loading ----------
  // The page shows at once, in its loading state (.loading in the style).
  // The renderer is made after that has been painted, a step at a time
  // (makeSky): nothing holds the main thread for long, and nothing waits
  // for the GPU. Then the first frame is asked for and the time starts;
  // the loading state fades once the first picture is on the canvas.
  // data-sky on the hero tells the test tools when the loading has ended.
  // The next frame of the browser; in a hidden tab, which has no animation
  // frames, a while later.
  function nextFrame() {
    return new Promise(resolve => {
      if (document.hidden) setTimeout(resolve, 100);
      else requestAnimationFrame(() => resolve());
    });
  }
  // Runs jobs (see finish) to their ends in slices of about SLICE_MS, a
  // slice a frame; report(share) after each job.
  const SLICE_MS = 8;
  async function slices(jobs, report) {
    let start = performance.now();
    for (let k = 0; k < jobs.length; k++) {
      while (!jobs[k].next().done) {
        if (performance.now() - start > SLICE_MS) {
          await nextFrame();
          start = performance.now();
        }
      }
      report((k + 1) / jobs.length);
    }
  }
  const loadingLine = hero.querySelector('.loading .line');
  let share = 0;
  const done = s => {
    if (s > share) loadingLine.style.setProperty('--done', share = s);
  };
  // After the first paint: an animation frame runs before it, a message after.
  nextFrame()
    .then(nextFrame)
    .then(() => new Promise(resolve => {
      const channel = new MessageChannel();
      channel.port1.onmessage = resolve;
      channel.port2.postMessage(0);
    }))
    .then(() => makeSky(heroCanvas, () => ({ yaw: state.yaw, pitch: state.pitch, fov: FOV,
      alt: state.alt, cloud: state.cloud, exposure: state.airExposure, look: AIR_LOOK }),
      { done, shown: () => hero.classList.add('shown') }))
    .catch(err => {
      console.error(err);
      return null;
    })
    .then(made => {
      render = made;
      loaded = true;
      hero.dataset.sky = made ? 'ready' : 'failed';
      if (!made) hero.classList.add('shown');
      kick();
      // A time-lapse asked for in the address starts now, not during the loading.
      if (playing) {
        if (pace !== 1) last = performance.now();
        schedule();
      }
      showIntro();
      wake();
    });
})();
</script>
</body>
</html>
